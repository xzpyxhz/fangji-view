甘草6\n剂量和比例最重要，思考一下27条\n无阳也不可发汗，用的是桂二越一汤\n桂枝4芍药4炙甘草4生姜6大枣9麻黄4生石膏6\n无阳，是阳气不能在表温煦防御，麻黄可以解表寒之营卫不和\n27、太阳病，发热恶寒，热多寒少，脉微弱者，此无阳也，不可发汗，宜桂枝二越婢一汤。\n太阳病，发热恶寒是标准证\n而此条发热多一些，恶寒少一些了，这是说明病向阳明里位传变了，阳明热多，太阳寒多，\n这是伤寒的定法，但若是典型的阳明病的话，应该是脉浮滑数甚至洪邪热亢盛的应有脉象，\n\n保胃气、存津液、和营卫、畅三焦\n\n邪热亢盛，蒸腾津液外泄，就会出现有余的脉象，而此条反而是脉微弱，这说明津液不但没\n有被蒸腾到表外，表外的津液反而是不足的不能温煦防御的，这就是此无阳也的含义。\n 后面说不可发汗，但是桂枝法和越婢法都是典型的发汗剂，宜桂枝二越婢一汤，是因为\n桂枝汤是发汗解表调和营卫和解寒热类方中补津液剂， 越婢汤是发散风寒废水郁热类方中的\n补津液剂，因为此两类方皆是以生姜甘草汤法为基础方干。去人参，加桂枝芍药（调和营卫\n和解寒热）或麻黄石膏（发散风水清解水热）而成，这里面尤以生姜是立足于津和表、水和\n血的要药， 所以真正的津血绝对有余而充滞在表需要决散津液而发汗的情况下是不会用生姜\n的，如麻黄汤即不用生姜；而津血不足而相对有余充滞在表而需要补益津液而发汗的情况下\n就需要配伍生姜，如桂枝汤法用生姜。\n27条说的不可发汗是指的不可以用麻黄汤法决散津液而发汗，而桂枝汤法和越婢汤法都是\n补益津液而发汗解表的，再缩减剂量，变成以温卫解表调和营卫兼能微散废水微郁热的剂型\n所以仲圣用的是桂枝二越婢一汤，而不是桂枝二杏子一（麻杏甘石汤）汤。\n 麻杏甘石汤（杏子汤）是决散津液而发散废水郁热的代表方，和越婢汤相对应。\n42许师解析越婢加术汤\n越婢加术汤: 甘草12生姜18大枣30麻黄36石膏48白术24\n越婢加术汤就是生姜甘草汤去掉补津液的人参加上温化健运中焦去渗利津液之白术， 再加上\n金匮的杏子汤（麻杏甘石汤）\n原文：下焦脚弱，首先水湿郁滞表位，津液不能敷布就是肢体沉重虚弱，如果单纯的水饮或\n是肢体沉重为主，下焦脚弱就不单纯水饮了也有津液虚的一面，津液不能敷布，为什么津液\n不能充盈，因为表上有溢饮有风水，就要在去水的同时补津液，因为津液不能敷布，里面的\n废水增多，好的津液亏少，所以大枣的量从12枚增加到15枚，大枣量的加重都是与津与胃\n有关，就是因为有生姜甘草汤去人参加白术的方干，所以这张方子不算俊列而反有一点补益\n作用，很多中风偏瘫的患者，痛风的患者，既有津血的亏虚，表上有风水溢饮又有肌肤甲错，\n面色不华或是大便微溏小便不利津血不能充养敷布的患者， 真正的实性热溢饮风水反而不适\n合这张方子，所以说续命煮散就是在越婢加术汤延伸出来的（更寒加附子，津血虚得更重所\n以加人参，胃虚产生淡饮了加茯苓） ，中风偏瘫的患者后期也会肢体水肿也会津血不能敷布\n肌肤甲错面色不华， 太阴中风传变可以有水饮的层面再传可以中风历节虚劳为什么可以这么\n传，方子都是有一个主线的穿插（半个生姜甘草汤：生姜，大枣，甘草）。\n阳旦是津液偏阳的一面，阴阳是津液偏阴的一面，生姜甘草汤是津液法，加上桂枝类就是阳\n旦法加上白芍类就是阴旦法，加上柴胡就是大阴旦法，如果加桂枝不够，再加上麻黄就变成\n了还魂续命青龙法。\n43栀子豉类方与黄芩汤的区别\n一、黄芩汤\n①黄芩汤从津液的层面看：\n是养津液药：芍药2两，炙甘草2两，大枣12枚\n清热：黄芩3两，养津液大过于清热\n\n保胃气、存津液、和营卫、畅三焦\n\n所以黄芩汤多用于溃疡（热伤津血）\n②寒热层面来看：黄芩苦寒3两，芍药苦平2两 共5两\n炙甘草2两 大枣12枚\n清热作用与补津液对等\n从这里看出这是苦寒法中偏于补益，真正苦寒的有大黄，黄连泻心汤\n苦寒，阳明之正法，典型阳明里，而黄芩汤是在阳明里热基础上伤到津血\n二、栀子豉类方是酸寒法度（阳明法中的类厥阴法）\n虽然在阳明阵地上，阳明，主要清里清热还能解表\n豆豉酸温能健运中焦，温化水饮豆豉酸温加栀子的苦寒\n栀子苦寒泄热（半寒热）\n豆豉： 解表，健运，补中，化饮\n典型厥阴病半表里半寒热半虚实而偏于阴者，虚者，栀子类方是整体偏热偏实，只不过夹杂\n了表里寒热虚实，所以归为阳明法中的类厥阴法（温中 化饮 补益 清热）\n大病后劳复者，枳实栀子豉汤主之\n大病后劳复者，不可能用苦寒的药和攻下的药，就可能用枳实栀子豉汤，因为补中有泻，清\n中有温，清里又解表，可以防止邪气进入，正气存内邪不可干，如果大病后劳复者，邪气往\n里走，这种情况还达不到用麻黄桂枝去攻，如果用了麻黄桂枝会虚其里，津液更少，这里豆\n豉用了一升，解表，温中的作用强，枳实三枚，枳实也可以解表，枳实是气药中的表药，气\n药中的补药，气药中的水药（如枳术汤）\n以上是枳实栀子豉汤对表津液的作用里的津液少了，所以不能濡养，就会浊水浊气增多，如\n果用茯苓白术渗利，里之津液就会更少，这种情况，第一有枳实利水，（心下坚，大如盘，\n边如旋血，水饮所作，枳术汤主之） ，第二是七升酸浆水，酸浆水酸温，酸甘，微辛，可以\n轻微解外，可以清热，亦可利小便\n44甘草麻黄汤，大黄甘草汤与芍药甘草汤区别。\n甘草配麻黄肯定是处在一个表的层面， 大多数处在一个有表证有表邪层面， 表上可以有\n风寒，废水，废血或者中恶，客忤，鬼疾引起的神志昏迷，它首先是开表的，开表能代谢表\n上废弃的水和血，反而现代人认为麻黄这药是治风寒的，忽略了它能治水治血，能不能治风\n寒，肯定能治。\n大黄甘草汤，阳明药已经很清楚了，要用阳明四法去看，大黄法是苦寒法，苦寒是清阳\n明热的，清阳明之正热，如口苦咽干，这是在上焦。在中焦可以心烦胸满，在中焦还可以腹\n满不食。 在下焦可以大便干燥， 满腹压痛。 大黄甘草汤这方本来治疗食已即吐的， 吃饭也吐，\n因为热涌攻冲，阳明热可以出现在任何部位（三焦表里都可以发生）。大黄可以清热，既然\n能清热的话， 这热引起的症候群都可以治， 阳明热可以灼伤津液， 灼伤津血， 它能不能治水，\n能不能治血。\n大黄甘草汤与芍药甘草汤的区别。它们都是苦泄的，芍药苦泄又有酸敛，一个养津液，\n\n保胃气、存津液、和营卫、畅三焦\n\n一个是绝对的去涌散泻表，一个相对的涌散去濡养。\n45曹某某 女 39 \n上方柴胡桂枝汤，方后口干，刻下头晕，舌淡红 苔薄白，睑淡白，目眶黯黑， 腹软 \n压痛，肌肤甲错 有血络，头晕一月又发三次，程度减轻，不呕 纳可，二便可 不起夜，带\n可，月经两月一次 量少 色可无块，腰腹不痛，肢不凉 不麻，小腹不凉，无心慌胸闷，汗\n可，眠可，口稍干，饮不多，腹不响，面有褐斑、痤疮。\n处方 （1）柴胡桂枝汤\n （2）小柴胡汤\n李鹏问曰 ： 老师，曹某某这个病案津血虚弱比较明显，而上焦郁火和营卫不和并不明显，\n为何用柴胡桂枝汤？\n师曰：上诊柴胡桂枝汤服后口干。\n营卫不和其实就是人体表里不和的代名词，因为卫行脉外营行脉中，人体只要牵涉到有\n血分失调的表里证都可以归为营卫不和，所以我们看太阴篇，包括血痹，黄芪桂枝五物汤就\n虚寒很明显了，那么为什么还去调和营卫呢？就是因为营卫是人体大的表里的代名词。这个\n患者她是下睑淡白、目眶黯黑、腿部血络而有汗出，是不是存在营卫不和？并且这个患者的\n所急所苦在上焦和表位，是不是要调和营卫而解表？再加上里边要治血、治热，是不是阳旦\n法和阴旦法合方？虽然她上次吃了柴胡桂枝汤后口干，但这一次还用这个方，为什么？就是\n因为阳旦法是发散津液的，本来解表的同时会丧失一部分津液，那么人就会有口干的感觉，\n口干说明什么？说明好的津液还没有来复，那么我们继续用这个方子，它里边有柴胡法，可\n以让津液正常地去敷布。所以不能见到吃了以后口干舌燥就不敢用了，这是津血还没有达到\n自和的状态，用上这个方子以后表证解的更彻底了，然后我们再用小柴胡汤收一下就行了。\n李鹏问曰：不用竹叶前胡就是因为水饮不明显？\n师曰：对。外热外结比较明显，她还有痤疮（火痤）。\n46黄芪桂枝五物汤\n丁元深，男，51，主诉：胃怕凉，不敢吃凉东西\n刻诊：口不干苦，饮水可，纳可，不怕风冷，以前血压低，心率过缓，脉迟缓，大便日\n一行质可，吃凉的拉稀便，偶肠鸣，小便可，出汗少，眠一般，早上4点就醒，眼干，有飞\n蚊症，人易疲乏，手脚易出汗，汗后不凉，舌紫红质厚薄白苔边齿痕，睑淡白边淡红，腹满，\n下肢血络浮露。—— \n丁元深：黄芪桂枝五物汤\n这个案子的眼目在于\n1、里邪出表。虽然患者胃冷，但是还兼有身疲易汗血络睑淡，这都是太阴中风再偏里一些\n的层面，但是病机尚未出中风范畴，这种情况，只用里药只会让表邪入里，因为未离中风范\n畴，故而大便只是食冷偶溏，平日大便质可\n2、生姜药症\n\n保胃气、存津液、和营卫、畅三焦\n\n时方菜蔬，经方大药，立足胃津，温中开表。\n生姜虽为经方解表之常用药，而生姜重用，必有里证，如生姜泻心汤（四两） 、生姜甘\n草汤（五两）、当归生姜羊肉汤（五两）、半夏厚朴汤（五两）、厚姜半甘人参汤（半\n斤）、当归四逆加吴茱萸生姜汤（半斤），那么黄芪桂枝五物汤用生姜六两，是不是可以治\n里，眼干是因为中风汗出伤津液，治疗中风就行了，中风层面得以解除，再论治里\n中风不但可以眼干，重了还可以发痉，即使津液虚到发痉的层面，只要是阳旦法则也是\n桂枝法，我的剑只留给能挥舞它的人\n47温脾汤\n男，54岁。主诉:腹胀如鼓，腹胀胀痛。\n刻诊：精神可，无汗出，周身怕冷，心慌，胸闷憋气、气短。并伴有咳喘。干咳无痰。时有\n头痛，头晕 ，手麻。口苦，无口干。饮水少。怕冷。眠可。纳可。无打嗝反酸。腹胀按压\n痛，按压偏软，但有时候会有团状的硬物感。胁痛腰痛。 大便难，每次量少，次数不定。\n小便少，便难。色黄一次量极少。下肢浮肿干涩，色黑。咳嗽干咳。面色黑而燥。浑身无力。\n肠鸣音。舌红，苔薄白。脉弦数尺脉浮数。刷牙无出血。\n建议处方：温脾汤\n治腹痛，脐下绞结，绕脐不止，温脾汤方。（千金）\n甘草附子人参芒硝（各一两） 当归干姜（各三两） 大黄（五两）\n上七味咀，以水七升煮取三升，分服，日三。\n病机解析：\n师曰 ： 借这个医案小讲一下经方方根学。此案少阴虚寒，营虚饮盛而引起周身怕冷肢体麻木，\n夏着冬衣，周身乏力，咳喘短气面黑干燥，腿肿色黑干燥，胃中停水则小便不利肠鸣胁痛喘\n息头晕；而又有阳明内结导致的腹满胀痛按痛硬块便难，因为有饮的存在，所以这个便难但\n是硬不起来，舌红符合阳明舌象，脉弦数尺脉浮数符合阳明脉象。脉浮主水主热。舌脉都是\n实的，而综合四诊是虚寒营弱水饮与阳明问题夹杂了。温脾汤有三个方根，即四逆汤、甘草\n干姜汤、调胃承气汤。用四逆汤对治少阴虚寒，甘草干姜汤温胃化饮，调胃承气汤微和胃气\n对治阳明，兼能治饮，在加上当归养营，可谓无一字无来历，再加上人参养胃气生津液，可\n谓丝丝入扣矣。\n48黄芪建中汤\n刘秀芳 女 76\n因胸痛、咯血住院，检查疑为肺癌。已出院。\n刻诊：左边乳下胸内刺痛，痛处有灼热感，有时心跳也引起痛。心累、头晕、痰多。不停吐\n涎沫（泡沫样口水）。汗多，动则容易出汗，一搭脉皮肤是湿润的，晚上稍微翻身就要出汗，\n汗后不冷。怕冷，穿衣比常人多很多，不敢敞风，怕感冒。口干、咽干，饮热，饮不多，口\n中感觉很粘。微烦。纳食较少，无腹胀腹痛。小便略黄，白天不多，夜起2-4次。大便2、\n3日一行，先干后软。腿稍显无力发软。脚背胫部肿而皱褶多，按之无明显凹陷。\n舌鲜红无苔；脉略数，右浮细，尺脉沉，左寸关浮细略滑，尺沉。\n\n保胃气、存津液、和营卫、畅三焦\n\n建议处方：黄芪建中汤\n病机分析\n师曰：虚热，津伤，血耗\n痰多，不停吐涎沫（泡沫样口水）\n汗多，动则容易出汗，一搭脉皮肤是湿润的，晚上稍微翻身就要出汗。怕冷，穿衣比常人多\n很多，不敢敞风，怕感冒\n内饮外湿了都，不可以用单纯的清滋 ，黄芪配伍桂枝生姜是针对外湿的，而黄芪建中汤里\n有多半张生姜甘草汤，只不过把人参改成了饴糖。\n学生：黄芪建中汤是可以治湿和饮的，包括白带多，\n师曰：是的，可以建中而制化水浊，这种水，就像堤岸空虚了，出了漏洞，所以水浊才源源\n不断上泛，需要甘药去培补，堵住这个漏洞，水饮就不上泛了\n学生：怪不得，之前群里有个案好像是用来桂枝加黄芪汤，白带问题显著解决\n师曰：就是里面那多半张生姜甘草汤（变人参为饴糖） 这就是甘药治水的道理，所以仲圣治\n水湿，多用甘药\n学生：用到五行理论了？\n师曰：和后世的时方思路有根本的不同，不是五行，是“假药味之滋，辩五苦六辛” \n学生：胸内刺痛要不要单独考虑要药症啥的？\n师曰：不荣则痛，调和营卫则自可不痛\n学生：是不是也有黄芪证的湿气在表导致刺痛\n师曰：有关系，只能守住甘能治水之法\n学生：生姜甘草汤 治肺痿咳唾涎沫不止，咽燥而渴。生姜五两 人参二两 甘草四两 大枣十\n五枚\n49小建中汤转黄芪建中汤","hasDose":true},{"caseId":"P0011","caseSource":"A方证大全1762784856","caseType":"讲义医案","归集方":"小青龙加石膏汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：因腰冷，性欲低下一年就诊。","symptom":"主诉：因腰冷，性欲低下一年就诊。","history":"","exam":"刻诊：患者自诉一年前起出现腰部以下冷，如坐在冷水中。夜间加重，足底冰冷。虽初秋亦","analysis":"","prescription":"师曰：此案若用五苓散、猪苓汤都会加重病情，该案中出现的腰冷也不是肾着汤证，腰冷只","effect":"","comment":"","caseExcerpt":"主诉：因腰冷，性欲低下一年就诊。\n刻诊：患者自诉一年前起出现腰部以下冷，如坐在冷水中。夜间加重，足底冰冷。虽初秋亦\n要盖两张棉被。性欲欲低下，阳痿，勃起困难。两周行房一次。舌诊 ： 舌淡红，苔黄腻少津。\n脉诊：左寸脉浮细，关尺沉细。右寸脉浮滑，关尺弦细，稍浮。手部略湿，微寒。患者平时\n饮酒多。 \n建议处方：天雄散\n病机分析：\n师曰：此案若用五苓散、猪苓汤都会加重病情，该案中出现的腰冷也不是肾着汤证，腰冷只\n是一个症状，少阴、太阴厥阴都可以出现，而肾着汤只是对治太阴的淡饮证。面黄者是精血\n少的表现 ，精虚血少者不可汗、不可清、不可下，舌黄是因为上焦的火下不去，上焦的火\n下不去是因为下焦虚有寒，所以腰冷如冰，足底冰冷，其实肾着汤也不可以治疗此种类型，\n这个不是以水饮为主， 而是以下焦虚有寒和精虚血少为主， 这个病人的最佳方子就是天雄散 ：\n天雄 生白术桂枝 龙骨，我们来看看组方。\n天雄：味辛温。主大风，寒湿痹，沥节痛，拘挛，缓急，破积聚，邪气，金创，强筋骨，轻\n身健行。一名白幕。（《御览》引云，长阴气，强志，令人武勇，力作不倦，《大观本》，\n作黑字）生山谷。《名医》曰：生少室，二月采根，阴干。加减不是真经方。注意，这个天\n雄是主大风，而附子只是治风寒湿痹，拘挛脚痛的，这个大风就有玄机，古人认为风行迟缓，\n你看那个中风的桂枝汤脉就缓，这个大风更缓，中了哪里哪里就缓，中了肢体就迟缓不用，\n中了经筋阳具则迟缓不举。\n龙骨：味甘平。主心腹，鬼注，精物老魅，咳逆，泄利，脓血，女子漏下，症瘕坚结，小儿\n热气惊痫，齿主，小儿大人惊痫瘨疾狂走，心下结气，不能喘息，诸痉，杀精物。久服，轻\n身通神明，延年。生山谷。\n《吴普》 曰：龙骨生晋地，山谷阴，大水所过处，是龙死骨也，青白者善，十二月采，或无\n时，龙骨畏干漆，蜀椒，理石，龙齿神农李氏大寒，治惊痫，久服轻身。（《御览》 《大观\n本》节文）\n 注意龙骨这个药，是可以治此证的热的，也可以除此证的痘，脓血，坚结，小儿热\n气惊痫，还不至于伤到阳气和津血，最好不过，亡阳失精需要清、敛、固的，仲圣多用龙骨，\n具体可以参看桂枝去芍药加蜀漆龙骨牡蛎救逆汤、桂枝加龙牡汤\n\n保胃气、存津液、和营卫、畅三焦\n\n白术：味苦温。主风寒湿痹死肌，痉疸，止汗，除热，消食，作煎饵。久服，轻身延年，不\n饥。一名山蓟（艺文类聚引作山筋），生山谷。\n 白术可以强肌壮腰，逐寒湿，去郁热，逐水饮不明白的可以看枳术汤。\n 龙骨配合白术还可以治疗这个手部略湿，再配上天雄更可以治疗这个寒\n桂枝：味辛温。主上气咳逆，结气喉痹，吐吸，利关节，补中益气。久服通神，轻身不老。\n生山谷。桂枝，配伍天雄驱风，配伍白术逐寒湿，配伍龙骨和营强精。 \n51小青龙加石膏汤","hasDose":false},{"caseId":"P0017","caseSource":"临床医案解伤寒","caseType":"讲义医案","归集方":"桃核承气汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：心绞痛伴右侧肢体瘫痪七天。","symptom":"主诉：心绞痛伴右侧肢体瘫痪七天。","history":"","exam":"刻诊：神志昏昧，时有躁动，呼之可应，可言苦楚。右侧肢体瘫痪，","analysis":"","prescription":"处方：桃核承气汤","effect":"二诊：目睛已有神，精神已好转，心绞痛大减，惟在服药期间，发生","comment":"","caseExcerpt":"主诉：心绞痛伴右侧肢体瘫痪七天。\n病史简要：一周前患者因心绞痛入当地县医院治疗，第二天出现右侧\n肢体瘫痪，神志昏昧，诊断为“急性心梗加脑梗”，主张转\n\n入上级医院治疗。同日转入市医院治疗，症状缓解不明显，\n曾因为剧烈心绞痛注射“杜冷丁”止痛，五天后下病危而出\n院回家。\n刻诊：神志昏昧，时有躁动，呼之可应，可言苦楚。右侧肢体瘫痪，\n阵发性心绞痛掣背痛肋痛。口干口渴，饮多饮温，喉中有痰粘\n滞，时时呛咳，鼻饲流食。留置导尿管，尿液深黄有酸臭气。\n大便数日不行，需服泻药。腹痛，周身疼痛，时掀衣掲被，时\n又喜裹衣被。夜间烦躁难眠，躁动不安，而白天又常身冷覆被，\n无汗。下睑暗边红鲜，目睛少神，面容暗红晦腻，唇色青紫，\n腹满压痛，下肢肌肤甲错血络浮露，手足扪冷，手背有黑血点，\n家人挤捏后渗出黑血。舌脉：脉弦迟缓，舌紫红苔黄厚干裂。\n周喜梅：栝蒌薤白半夏汤\n杨维宇：大柴胡汤\n郑晓岑：温脾汤\n宋昱霖：温脾汤\n赵胜军：栀子大黄汤\n李晓旭：调胃承气苦酒汤\n周帅：温脾汤\n\n李忠渝：调胃承气加人参苦酒汤\n欧志穗：大柴胡汤\n邓茹月：温脾汤\n刘聚才：桃承气\n谢雨吟：前胡牡丹汤\n六病辨证：类厥阴病\n病机分析：\n表束+表寒+伤营\n太阴伤血+水饮\n阳明里热+里结+里燥+水热+外燥\n方证：桃核承气汤证\n处方：桃核承气汤\n大黄24芒硝12（冲入）炙甘草12桂枝12桃仁24\n水煎服6 剂\n二诊：目睛已有神，精神已好转，心绞痛大减，惟在服药期间，发生\n过心前区及心下不适感数次，家人诉肢体功能进步，已可从容\n翻身，尚不能自行坐起。口干，饮多，饮温，喉中有痰粘滞，\n时时呛咳，鼻饲流食。留置导尿管，尿液深黄味重。大便四五\n日一行，便燥。腹痛身痛已减。阵发性烦躁有加重现象，时冷\n时热，时烦躁掀被时又裹紧衣被，无汗。下睑暗红边红鲜，目\n睛已有神，面容微红已不晦腻，腹满压痛，下肢肌肤甲错血络\n浮露，手背有黑血点已不容易渗血。\n舌脉：脉弦缓，舌淡紫红苔黄厚舌质已润。\n\n原方续进6剂。\n三诊：心绞痛已基本不发作，肢体功能明显进步，已可在家人牵引下\n走二十几步。已拔除鼻饲管与导尿管。烦躁大减，服二诊方中\n间曾因夜间烦躁谵语加服过两剂调胃承气汤（入暮到夜间一剂\n分两次服用）。口干，饮水已少，咽痛，喉中痰滞，咳吐不利，\n时时呛咳。大便时软时溏色绿，拔除导尿管后小便不利，数次\n才能尿完，近日身痛加重，肚皮时痛，腹痛拒按，时冷时热，\n无汗，眠差。下睑暗红边红鲜，面容微红已不晦腻，腹满压痛，\n下肢肌肤甲错血络浮露，手扪微凉。\n舌脉：脉弦缓，舌淡紫红苔薄黄白腻。\n处方\n①柴胡加芒硝汤 柴胡16黄芩6 旱半夏8人参6炙甘草6 生姜6 大\n枣8芒硝8（冲入）\n水煎服6 剂\n②柴胡去半夏加栝楼汤 柴胡48黄芩18人参18炙甘草18生姜18\n大枣24天花粉24\n水煎服6 剂\n四诊：心绞痛已基本消失，肢体功能明显进步，已可自主步行（上楼\n梯需要家人稍加扶持）。怕热，口干已减，饮水已少，时时呛\n咳，咳甚耸肩，咳则面红，甚至汗出，汗后不凉。纳可，大便\n里急后重，日一两行，时欲便则无，小便浑浊，夜尿一至三次，\n微有不利，身痛已减，皮肤疼痛，腹满，眠差。下睑暗红边红\n鲜，面容微红已不晦腻，按腹满，下肢肌肤甲错血络浮露轻微\n水气，手扪可。舌脉：脉弦缓略有结代，舌淡紫红苔黄白腻水\n滑。\n处方：枳实栀子豉汤\n\n枳壳36栀子12淡豆豉48酸浆水240ml\n水煎服10剂。继续巩固调理。\n【解析】\n初诊：\n患者神志昏昧，时有躁动，呼之可应，可言苦楚，右侧肢体瘫痪，\n阵发性心绞痛，彻背痛、肋痛，大家看当时面部的照片，面如死灰，\n神志昏昧，一派濒临死亡之象，伴随症状：口干口渴，饮多饮温，喉\n中有痰粘滞，时时呛咳，鼻饲流质饮食，留置胃管和导尿管，尿深黄\n酸臭，大便数日不行，需服用泻药，腹痛，周身疼痛，时掀衣揭被，\n时又喜裹衣被，时冷时热，夜间烦躁不眠，躁动不安，白天身冷覆被，\n无汗，目睛少神，面部暗红晦腻，油垢，泛着一种晦暗的光泽，非常\n暗滞的脸色，一派败证之象，唇色青紫，腹满压痛，手足冷，手背黑\n血点，渗出黑血，血干稠。脉弦迟缓，舌紫红，苔黄厚干裂，下睑暗\n红边红鲜，下肢肌肤甲错，血络浮露。\n六病辨证为类厥阴病，因为在厥阴病中分了两种，《伤寒论》原\n文中“此蛔厥也，非脏厥” （338、伤寒，脉微而厥，至七八日肤冷，\n其人躁无暂安时者，此为藏厥，非蚘厥也。蚘厥者，其人当吐蚘。今\n病者静，而复时烦者，此为藏寒。蚘上入其膈，故烦，须臾复止，得\n食而呕又烦者，蚘闻食臭出。其人常自吐蚘。蚘厥者，乌梅丸主之。\n又主久利。）\n在仲圣的体系中，厥阴的厥有两种，一种是脏厥，一种是蛔厥，\n脏厥就是人体的阴阳要离决，要断绝了，是一种真厥阴的现象；还有\n一种厥阴叫做蛔厥，蛔厥当然并不一定是蛔虫的阻碍，蛔虫是一种邪\n气，是一种有余的邪气的代名词，那么寒邪、水邪、淤血、气滞一样\n可以阻滞，所以所谓的蛔厥一定要辨证地去看，就是体内有邪气的阻\n碍，形成类似阴阳阻断的一种症候群，厥冷的现象或是寒热杂错或是\n\n厥热往复的现象，就叫蛔厥。我们为了便于后世的理解和为了与脏厥\n（真厥阴）形成区别而命名为类厥阴病。\n真厥阴就是脏厥，类厥阴就是蛔厥。\n蛔厥在症候群上非常类似真厥阴，但是绝对不能单纯地使用附子\n干姜等回阳救逆药物，因为它里面有有余的东西，有多余风寒湿燥火，\n或是蛔虫，或是各种邪气集聚类。\n由于本证为类厥阴，故而虽然症状凶险，但是从病机体系来分析\n还是可治的。\n病机中有表束，凡是人体四肢百骸的失调、不安、不和就叫表束，\n因为经方最讲表里观的，比如说伤寒、中风，这都是有表证有表邪的\n现象，表束本身又是分层面的，经过我们研究解读《伤寒论》，表束\n分为三个层面。\n第一个层面：有表证有表邪，比如麻黄汤证，身体疼痛，发热恶\n寒，既有表位的症状，又有风寒邪气侵袭表位，卫气津血凝滞在表的\n状态，此即为有表证有表邪。治法是攻表，用汗法将已经变成废水废\n血的津液和邪气一起涌散掉即可。\n第二个层面叫有表证无表邪，比如说，苓桂术甘汤证，也可以出\n现身体沉重、疼痛，也可以出现头晕目眩，以表和上焦为所急所苦，\n但是病机是由于内里的水饮冲逆引起，故而苓桂术甘汤这个方子是以\n治里为主，以茯苓、白术利小便，为苓术剂、苓甘剂、苓桂剂，以里\n为主兼顾表位，这就是有表证无表邪。\n第三个层面是外证，比如伤寒论29条，“伤寒，脉浮，自汗出，\n小便数，心烦，微恶寒，脚挛急，反与桂枝汤，欲攻其表，此误也，\n得之便厥，咽中干，烦躁吐逆者，作甘草干姜汤与之，以复其阳。”\n以复其阳，阳指的是里阳，甘草干姜是温里的。\n这就是外证，因为经方的言辞风格跟后世有很大的不同，比如在\n金匮中，有种水叫里水，按照后世的理解，里水应该以里的表现为主，\n但是其恰恰相反，用的是甘草麻黄汤，解表的。那里水是什么？里水\n是指人体表上的水邪向里走，影响到里叫里水。比如防己茯苓汤治的\n是皮水，那我们想，肯定是治表的问题是引起人的症候群的一个原因，\n但是用的是茯苓配防己，是利小便的，为何叫皮水？是因为里的水饮\n冲逆，冲滞充斥影响到表的问题，就叫做皮水。那么外证呢？外证是\n因为人体内部的失调影响到人体的外部，就叫做外以里为主要病因证，\n它是，而症候群也会表现在表上，所以经方的概念、名词、研究的风\n格，我们需要去了解。\n\n患者病机第二个层面是表寒，表寒就是人体表面的、医者的他觉\n或者是患者自觉的寒冷现象，比如怕风、恶寒、手脚摸起来是凉的都\n是表寒。\n第三个层面是伤营，伤营是人体的津血不能去温煦和濡养而出现\n的四肢冰冷或肢体麻木的症候群，甚至出现失眠、神志不安。\n表位上的病机有什么特点呢？那就是后一层病机总能包含前一\n层病机，即伤精包含伤营包含中风包含表寒（伤寒），而表寒又统摄\n在表束之下，是这样的一种特点。\n此案在太阴层面的病机，有太阴伤血，还有水饮。伤血，凡是血\n的不和，不管是血虚、血实、血热、血寒，血的可见性的伤损或者医\n者可见的患者的面色萎黄、下睑淡白都是伤血层面。\n那么水饮呢，水饮有四，有溢饮、淡饮、支饮、悬饮，金匮中有\n一个明确的概念，“问曰：四饮何以为异？师曰：其人素盛今瘦，水\n走肠间，沥沥有声，谓之痰饮；饮后水流在胁下，咳唾引痛，谓之悬\n饮；饮水流行，归于四肢，当汗出而不汗出，身体疼重，谓之溢饮；\n咳唾倚息，短气不得卧，其形如肿，谓之支饮。”四饮是有明确概念\n的。\n此案阳明层面有里热、里结、里燥、水热、外燥，这些基础病机。\n为何叫做基础病机呢？是因为伤寒论的结构是这样的：辨太阳脉证并\n治、辨某某病脉证病治，是先有辨的过程，然后才有病的概念。而不\n能直接套上某某病，那是想当然套上的而不是辨出来的。\n辨，就是辨的基础的东西，就是刚刚分析的表的、太阴的、阳明\n的基础的病机元素，辨出来之后才能上升到六病的层面。\n我们用基础病机分析之后才知道，这个病是个类厥阴病，因为它\n有表里的失和，有表里的、寒热的、阴阳的夹杂，整体又偏阴、偏虚、\n偏里，那么方证用的是桃核承气汤，大黄24芒硝12炙甘草12桂枝\n12桃仁24开了6副，据我们考证，其实汉代的1 两，用在药上是折\n合6g的，1升折合60毫升，这是更符合仲圣原貌的，所以我们是原\n方原量、不加不减地去治病，我们这样已经用了好多年，临床疗效很\n可观，我建议大家若是做经典，就要从经典入手，尊崇经典，不要做\n加减，遵从经典的法度，不要楷法入隶。\n二诊：目睛已有神，精神好转，心绞痛大减，服药期间，发生过\n心前区、心下不适感数次，而没有达到明显的心绞痛层面，家人反馈\n肢体功能有明显的恢复，仅服了六天的药，已经能自行从容翻身，尚\n不能自行坐起，兼证症候群：口干、饮多饮温，喉中有痰粘滞，时时\n呛咳，鼻饲流食，留置导尿管，大便4-5日一次，腹痛身痛已减，阵\n\n发性烦躁有加重现象，时冷时热，时烦躁掀被，时裹被无汗，大家说\n这种烦躁加重现象是什么引起的？是加重吗？不是的，这就是厥阴病\n的厥热胜复，热胜则生，寒胜则死，这个患者非常典型的体现了这种\n病传的过程，所以这个病案是非常的宝贵，它完整得体现了仲景的厥\n阴法度是真实存在的，体现了厥热胜复，是经方非常宝贵的理法。也\n体现了我们提出的概念：凡病都是阴病转阳、里邪出表，就可以愈，\n反之，就会加重或死亡。下睑暗红边红鲜，目睛已有神，面容微红，\n已经不是污腻感了，面部照片对照第一次，已明显不同。腹满压痛，\n下肢肌肤甲错、血络浮露，手背有黑血点，不容易渗血，脉弦缓，舌\n淡紫红，苔黄厚舌质已润，舌苔较上一次好很多，上次伸舌不出，现\n在能从容的伸出来了，原方续进6剂，第二次整个眼睑、面色、神情、\n伸舌的幅度比第一次明显的提高。\n三诊：舌苔、面色更好了一步，心绞痛已基本不发作，肢体功能\n改善明显，已经可以在家人的牵引下行走20余步，胃管、导尿管已\n拔出，烦躁大减，服二诊期间，曾因夜间烦躁、谵语，加服过2剂的\n调胃承气汤，两剂调胃承气汤后，烦躁好多，口干，饮水亦少，咽痛，\n喉中痰滞，咳吐无力，时时呛咳，大便时软时溏色绿，拔出导尿管后\n小便不利，需数次才能尿完，近日身疼加重，肚皮时疼，腹痛拒按，\n时冷时热，无汗，眠差，下睑暗红边红鲜，面容绯红，腹满压痛，下\n肢肌肤甲错，血络浮露，手凉，脉弦缓，舌淡紫红苔薄黄白腻。注意\n一点：第二个层面，患者出现了身痛明显加重，肚皮疼痛，这是什么\n现象？里邪出表！这非常好，不要看到身痛就紧张，一定要有经方家\n手眼，身痛在表是表证，不能死人的。这个医案，非常准确的还原了\n纯用经方治病的规律，真的是遵循仲景所重视的里邪出表！若是中西\n医一起治疗，一边喝中药，一边用输液，有可能邪气要发出的的时候，\n又被水饮压制进来了。一边输水一边发表，则发不透，就有可能出现\n不了如此典型的阴病转阳、里邪出表的过程，也不会出现明显的厥热\n胜复，有可能一发热，西医西药一退烧，邪气又进去了，所以说当我\n们忠于原著、忠于原方、忠于原量去用的话，就可以按照仲景老人家\n描述那样好起来，疗效非常神奇。\n这次处方：柴胡加芒硝汤，柴胡16黄芩6 旱半夏8人参6炙甘\n草6生姜6大枣8芒硝18（冲）水煎服 6剂，吃完第一个方子后，\n再吃第二个方子：柴胡去半夏加栝楼根汤，小柴胡汤去半夏加24g天\n花粉，为何一下子出两个方子呢？因为若是研究经方的话，你会发现，\n仲景体系一直在分层次，仲景书中，本来就有初级班、中级班、高级\n版，在初级班，要求随证治之，出了啥症状就对应什么症状。中级班\n的时候要求依法治之，比如说坏病。到了高级班的时候，要求以病传\n\n治之。所以我们读伤寒论29条，从开始误用了桂枝汤，到最后救逆\n甘草干姜汤，到后来的芍药甘草汤，到调胃承气汤，到四逆汤，是一\n个病传观，比如伤寒论100条：“伤寒，阳脉涩，阴脉弦，法当腹中\n急痛。先予小建中汤，不差者，小柴胡汤主之。”病传观可以一次性\n的出两个方子，并不是仲景老人家辨证不精细，用完小建中汤没有效\n果才用小柴胡汤，而是因为仲景的体系内有病传观，他把津液分了两\n个层面，一是濡润，二是温煦，伤寒是有表束，阳脉涩是指表上津血\n不足，不能敷布，阴脉弦是指里有饮，表上津血不能敷布就需要用阳\n旦法则补津液而救表，阴脉弦是里有水饮，表上津液不能温煦不能敷\n布需要用阳旦法则补津液而救表，也就是桂枝法，阴旦法则是柴胡法，\n当里面有水饮的话就用柴胡法祛饮，因为小柴胡汤里面含有一个完整\n的生姜甘草汤，可以化饮。伤寒，阳脉涩，阴脉弦，法当腹中急痛，\n它既有表又有里，既有表上的津液不能温煦和濡润，又有里面水饮的\n阻碍，先予小建中汤，为什么呢？先解表啊，先让表邪出去，给邪气\n以出路就是给自己以生路，有表先解表，这是伤寒的法则，用完这个\n方子后，因为津液温煦起来了，腹痛会减轻，当有不了了时，是因为\n水饮没有化去，后续的方子则不能效不更方了，要有病传观，就是用\n小柴胡汤来收尾。\n本案也是，先予柴胡加芒硝汤，因为她有里结，当结去了后，她\n津血不能濡养的一方面会显现出来，再用柴胡去半夏加栝楼根汤，这\n样用病传观去对治。这个病传观非常好用，我目前的记录是可以给患\n者开6 诊方子，让患者依法服之，疗效理想。\n上午查房的时候我给大家讲过一个病例，也是我的一个老患者，\n这个患者是个生物学的女博士，在香港读书时小产，因为在冷气房中\n呆的太久导致了不孕，30几岁了再没怀过孕，家人都很着急，刚开\n始来就诊的时候，过程比较曲折，对医生的信任也是有个磨合的过程，\n后来当她完全信任我了，我说现在可以正而八经的正规地治病了，我\n按照病传观一次性的开了6 个方子，吃完后第二个月再来，开了5个\n方子，服药2 个月，10年的不孕治好了。刚刚，2月前生了一个大胖\n小子，非常得高兴，在我来这里讲课的头两天，她又因为奶水少来看\n病，一见面开口就是菩萨医生感谢你！\n当然我们了解患者的心情和溢美之词，但是作为医者的成就感来\n自哪里呢？来自于我们按照仲景的原文、按照仲景的思维、按照仲景\n的原方，去把疑难病、顽固病、看起来非常复杂的疾病，用非常简单\n的方法来解决掉，这就是我们医者的成就感！\n本患者四诊时，心绞痛基本上消失，肢体功能进步明显，已可自\n主步行，初诊时卧床不起，心绞痛欲死，而现在呢，能自行步入门诊\n\n来看医生。\n老人家能恢复的这么好，生命得到延续，是因为有个孝敬而有智\n慧的好儿子，仲景老人家在伤寒论序言中说过，“上以疗君亲之疾，\n下以救贫贱之厄，中以保身长全，以养其生。”自古我们医者和儒家\n思想熏陶下的国人的追求就是这样的。\n想必大家也知道，此案就是我们班宋宜兵同学的母亲，那时他还\n没有入群学习，而宜兵通过自己对中医的爱好，与医者的及时沟通、\n有效地救治，把自己的母亲从死亡线上拉了回来，这种感觉温暖而神\n圣！为宜兵的孝心和智慧点赞！\n患者现在的症状是：怕热，口干已减，饮水已少，时时呛咳，咳\n则耸肩，咳则面红，甚至汗出，汗后不凉，纳可，大便里急后重，每\n日1-2次，经常想大便但是便不尽，小便浑浊，夜尿1-3次，小便微\n微不利，身痛已减，皮肤疼痛。发现没有？患者从身痛到皮肤痛，越\n来越浅。还有腹满，眠差，下睑暗红边红鲜，面容微红而不晦腻，腹\n满，下肢肌肤甲错，血络浮露，有轻微的水气，手已不凉，脉弦缓略\n有结代，舌淡紫红苔黄白腻水滑，从干燥苔，津液来复，才滑起来，\n有津液则生无津液则死。我们给出的是枳实栀子豉汤：枳壳36栀子\n12淡豆豉48酸浆水240ml，患者现在还在调理巩固，但是已经没有\n生命危险了，并且从开始的卧床不起、濒临死亡这样一种病情危重到\n现在的活动自若，虽稍有虚弱但已无大碍的状况。\n继学往圣，深究经方，而能去解决这样的大病顽疾正是我们经方\n中医应该有的追求！\n今晚讲这些，谢谢大家！\n五期课程 《伤寒论讲座》第六课\n2017.8.7\n【原文】7、病有发热恶寒者，发于阳也；无热恶寒者，发\n于阴也。发于阳，七日愈；发于阴，六日愈。以阳数七，阴\n数六故也。\n【校注】\n\n《玉函经》：夫病有发热而恶寒者，发于阳也；不热而恶寒者，发于阴也。发于\n阳者七日愈，发于阴者六日愈，以阳数七，阴数六故也。\n《千金方》：夫病有发热而恶寒者，发于阳也。不热而恶寒者，发于阴也。发于\n阳者七日愈，发于阴者六日愈。以阳数七，阴数六故也。\n《圣惠方》：无此条。\n《康平本》：病有发热恶寒者，发于阳也；无热恶寒者，发于阴也。发于阳者，\n七日愈。发于阴者，六日愈。以阳数七，阴数六故也。\n【解析】1、发于阳发于阴解——即阴阳当为表里论\n发热恶寒，是有表证有表邪，是病发于表；无热恶寒，是有\n表证无表邪，是病发于里。发热恶寒，即发热和恶寒同时都为所急所\n苦，外来邪气侵袭于表则恶寒，卫气凝滞于表则发热。无热恶寒，即\n以恶寒为所急所苦而无热证之所急所苦，是内生邪气（或外来邪气病\n传里位）积聚于里则恶寒，卫气不足于里则无热。\n从《外台秘要》更可以清晰的看到表里概念被改成为阴阳的轨\n迹：\n《外台秘要。卷一。伤寒门》：\n（王叔和）又曰：夫表和里病，（一作阳盛阴虚）下之而愈，\n汗之则死。里和表病（一作阳虚阴盛）汗之而愈，下之则死。夫如是\n则神丹不可以误发（神丹丸在此卷崔氏部中六味者是也）甘遂何可以\n妄攻。（甘遂者水导散也在第三卷天行狂语部中甘遂等二味者是也，\n出千金方）表里（一作盛虚）之治，相背千里，吉凶之机，应若影响。\n\n然则桂枝下咽，表和即毙（桂枝汤在此卷仲景曰数部中桂枝等五味），\n承气入胃，里平以亡。若此表里（一作阴阳）虚实之交错，其候至微，\n发汗吐下之相反，其祸至速，而医术浅狭，为治乃误，使病者陨没，\n自谓其分。\n又凡两感病俱作，治有先后，发表攻里，本自不同，而执迷妄\n意者，乃云神丹甘遂，合而服之，且解其外，又除其内，言巧似是，\n于理实违。安危之变，岂可诡哉！\n夫病发热而恶寒者发于阳；无热而恶寒者发于阴。发于阳者可\n攻其外；发于阴者宜温其内。发表以桂枝；温里宜四逆。\n《外台秘要》此篇通篇论述表里证治之别，尤其末句明言：发\n于阳者可攻其外；发于阴者宜温其内！训表里以为阴阳之轨迹可明！\n至于发表宜桂枝，温里宜四逆是表达表里治则的一种行为笔法，表里\n之方繁多，不一定必须用桂枝汤或四逆汤。\n2、阳数七阴数六 为河图生成数 是五星天象学说\n发于阳，七日愈；发于阴，六日愈。以阳数七，阴数六故也。\n伏羲氏河图的生成数是：\n天一生水，地六成之；\n地二生火，天七成之；\n天三生木，地八成之；\n地四生金，天九成之；\n天五生土，地十成之。\n\n这是古人根据五星出没的时间规律而绘制出来的，五星指的是：\n岁星(木星)\n荧惑(火星)\n镇星(土星)\n太白(金星)\n辰星(水星)\n（大家可以知道知名度颇高的太白金星老人家名字的来历了）\n天一生水，地六成之，表示水星与日月会聚；\n地二生火，天七成之，表示火星与日月会聚；\n天三生木，地八成之，表示木星与日月会聚；\n地四生金，天九成之，表示金星与日月会聚；\n天五生土，地十成之，表示土星与日月会聚。\n《史记。天宫书》：“五星分天之中，积于东方，中国利；积于\n西方，外国用（兵）者利。五星皆从辰星而聚于一舍，其所舍之国可\n以法致天下”；《汉书。天文志》：“五星分天之中”。古占星家观\n察五星运行变化而用以预测战争胜负、王位安危、年成丰歉、水旱灾\n害等政治、军国大事。\n比在1995 年，考古学家们在新疆和田一处古墓中发现蜀汉时\n期的一块织锦护膊。\n织有八个汉隶字：“五星出东方利中国”。\n\n就是说到了五星聚会的年时利于“中国”（古之中国指黄河流\n域地区）用兵，此织锦被评为国家一级文物，而且是首批禁止出国展\n览文物。（据推算，下一次五星聚会是2040 年）。而有历史记录的\n一次“五星聚于东井”是汉元年十月，记载于《史记。天宫书》、《汉\n书》、《张耳传》、《汉纪》等。（看到这块织锦，大家有没有觉得\n对中华民族的伟大复兴充满了期待感和提上计事日程感）\n也是又一次证明了伤寒（表寒）之邪只能浅伤于表的经方学术观点。\n正所谓“水火者，阴阳之征兆也”，所以水火就是代表阴阳的，\n而水为阴成数是六，火为阳成数是七，故曰“阳数七阴数六”也。\n综上所述，阳数七阴数六作为河图生成数，是源于古星占术的\n五星学说观天象以定家国大事的，而仲圣医学学术重要特点就是重视\n人体之阴阳盛衰而不过度倚重天之阴阳晴朔 。并且整部伤寒金匮的\n病传病愈体系也不是按照这个占星术数去机械设定的，此应为蹿入的\n\n汉晋时代一些阴阳家的衍文。仲圣所谓的“阴阳自和者必自愈”指的\n是人体津液的阴阳自和；“随证治之”亦是是随证之阴阳而施治，亦\n即是根据人体症候群的寒热虚实表里去展开施治。皆与阳七阴六等术\n数观点不同，故经方家即使在隆冬天气寒凛时，阳明证患者亦可用白\n虎承气类去治愈（如冬季热喘常用白虎承气类）；盛夏天气酷热时，\n太阴证患者亦可用理中四逆辈去治愈（如夏季下利常用理中四逆辈）。\n【原文】8、太阳病，头痛至七日以上自愈者，以行其经尽\n故也。若欲作再经者，针足阳明，使经不传则愈。\n【校注】\n《玉函经》：太阳病头痛，至七日有当愈者，其经竟故也。若欲作再经者，当针\n足阳明，使经不传，则愈。\n《千金方》：太阳病，头痛，至七日以上自愈者，其经竟故也。若欲作再经者，\n针足阳明，使经不传则愈。\n《圣惠方》：无此条。\n《康平本》：大阳病，头痛至七日以上自愈者，以行尽其经故也。若欲作再经者，\n针足阳明，使经不传则愈。\n【解析】\n1、自愈之理\n\n此条是太阳伤寒轻浅之疾，即表寒轻证，而且没有病传到中风\n耗散津液和里病的层面，所以随着邪气的逐渐衰减和卫气津液的熏肤\n泽毛充身，经过大致七日左右，就可以症状消失而自愈。比如临床上\n一般感冒即使不治疗的自然病程也就是一周左右，符合轻浅小邪客人\n的自愈规律，即“行其经尽故也”。\n此条与后面第10条的“风家，表解而不了了者，十二日愈”\n有表里虚实急缓呼应之妙，详解见第10条。也是又一次证明了伤寒\n（表寒）之邪只能浅伤于表的经方学术观点。\n2、此“经”为语气助词 而非经络之意\n前人往往把此条作为《伤寒论》用经络学说的出处，也是把六\n病也称谓“六经”的主要依据。而其实，本条的“经”，是语气助词，\n多用在倒装句中，譬如古诗“伤心秦汉经行处”之“经”，并无实指\n意义。伤心秦汉经行处，不是作者伤心秦朝和汉朝走过的地方，而是\n作者走过秦汉朝代的故城遗址，自己感到了伤心。\n不管是在中医界还是在文学界，对古代文字误读误解是一种普\n遍存在的现象了。比如王昌龄的“洛阳亲友如相问，一片冰心在玉壶”，\n基本上可以见到的解释都是把自己冰莹剔透的心从玉石般洁白的壶\n中捧出来，说的好惊悚。古人的文字不是这么浅薄的解读的，这“玉\n壶”指的是月亮，皓月，表明自己的心可昭日月的意思。\n我们且把本条的语气助词“经”去掉，调整倒装句，发现并\n不会影响到阅读理解：\n太阳病，头痛至七日以上自愈者，以（其）行尽故也。若欲\n（再）作者，针足阳明，使不传则愈。\n\n但是因为约定俗成已久，把六病称谓六经也由来已久，所以只\n要不要牵强附会的把六经与经络再联系起来，即使随俗说称谓六经也\n无伤大雅。\n3、经方用针学术观点：\n阳面阳经可解表，三阳病多用； 阴面阴经可治里， 三阴病多\n用。所以不论是针足阳明还是针风池风府其实都是解表的，因为表寒\n不发展为中风并不传里，所以并不存在所谓的“先安未受邪之地”的\n说法，经方讲究的是丝丝入扣的随证治之，未病之地是不去扰动的。\n解表和三阳病取阳面阳经\n如：8、太阳病，头痛至七日以上自愈者，以行其经尽故也。\n若欲作再经者，针足阳明，使经不传则愈。（解表）\n24、太阳病，初服桂枝汤，反烦不解者，先刺风池、风府，却\n与桂枝汤则愈。（解表）\n142、太阳与少阳并病，头项强痛，或眩冒，时如结胸，心下\n痞硬者，当刺大椎第一间、肺俞、肝俞，慎不可发汗；发汗则谵语，\n脉弦，五日谵语不止，当刺期门。（三阳病）\n治里和三阴病取阴面阴经\n如：109、伤寒发热，啬啬恶寒，大渴欲饮水，其腹必满，自\n汗出，小便利，其病欲解，此肝乘肺也，名曰横，刺期门。（治里）\n340、病者手足厥冷，言我不结胸，小腹满，按之痛者，此冷\n结在膀胱关元也。（三阴病）\n\n《伤寒论》中明确记载的针灸穴位仅有7 个,即以上风池、风\n府、大椎、肺俞、肝俞、期门、关元，全部符合笔者总结的“阳面阳\n经可解表，三阳病多用； 阴面阴经可治里， 三阴病多用”的施治规\n则。\n【原文】9、太阳病，欲解时，从巳至未上。\n【校注】\n《玉函经》：太阳病欲解时，从巳尽未。\n《千金方》：太阳病欲解时，从巳尽未。\n《圣惠方》：无此条。\n《康平本》：大阳病欲解时，从巳至未上。\n【解析】（此条后续课程会详解，本课时暂略）\n【原文】10、风家，表解而不了了者，十二日愈。\n【校注】\n《玉函经》：风家表解，而不了了者，十二日愈。\n《千金方》：风家，表解而不了了者，十二日愈。\n《圣惠方》：无此条。\n《康平本》：风家，表解而不了了者，十二日愈。\n\n【解析】\n风家兼里 故表解而里不了了 伤寒纯表 故七日经尽可自愈。\n风家，即中风病患者，此处泛指六病中风的患者。本条再次可\n以见证明我们提出经方理论的“中风为六病眼目”，“寒邪只能浅伤\n于表”，“风邪可以洞开脏腑”，“中风为表里合病而以表为所急所\n苦”等学术观点的正确性。\n假设中风病为纯粹表病的话，“风家表解”就会彻底痊愈了的，\n就像前述第8 条所言，太阳伤寒头痛七日表邪当尽。而本条“风家表\n解”后的“不了了”竟然“十二日”才能痊愈，这说明这个“不了了”\n是里位不和！即在里邪出表以后，里的胃气津血还没有完全恢复过来，\n所以需要用比单纯表病的“七日”还要久的时间“十二日”来恢复！\n第8条和第10条从另一个侧面告诉我们，“表轻而里重”“里深则\n易死”的经方学术观点。\n所以本条的“不了了”并不是前人所普遍认为的表不了了、邪\n衰未尽等观点，而是里病不了了！是提醒医家病家要注意饮食房劳劳\n倦等摄养，以防“劳复”、“食复”，“房劳”等。\n此条与《伤寒论》397、398条关系尤为密切：\n397、伤寒解后，虚羸少气，气逆欲吐，竹叶石膏汤主之。\n398、病人脉已解，而日暮微烦，以病新差，人强与谷，脾胃气\n尚弱，不能消谷，故令微烦。损谷则愈。\n\n【原文】11、病人身大热，反欲得衣者，热在皮肤，寒\n在骨髓也；身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。\n【校注】\n《玉函经》：病人身大热，反欲得衣者，寒在骨髓，热在皮肤，身大寒，反不欲\n近衣者，热在骨髓，寒在皮肤也。\n《千金方》：无此条。\n《圣惠方》：无此条。\n《康平本》：病人身大热，反欲得衣者，热在皮肤，寒在骨髓也。身大寒，反不\n欲近衣者，寒在皮肤，热在骨髓也。\n【解析】\n1、扁鹊表里观理论遗存\n以骨髓为里，皮肤为表，这是扁鹊体系理论与语言风格的遗存，\n再次证明了仲圣学术与扁鹊学术的渊源关系。\n热在皮肤，指的是表面上是热像，寒在骨髓，指的是里面本质上\n是寒病；寒在皮肤，指的是表面上是寒像，热在骨髓，指的是里面本\n质上是热病。\n2、真假寒热之辨即厥阴厥阳之辨\n此条即真假寒热之辨，亦即经方精细辨证中的厥阴厥阳之辨。\n①病人身大热，反欲得衣者，寒在骨髓，热在皮肤——即真寒假\n热，也就是厥阴病。\n见于：\n\n353、大汗出，热不去，内拘急，四肢疼，又下利厥逆而恶寒者，\n四逆汤主之。（厥阴轻证）\n370、下利清谷，里寒外热，汗出而厥者，通脉四逆汤主之。（厥\n阴重症）\n②身大寒，反不欲近衣者，寒在皮肤，热在骨髓也——即真热假\n寒，也就是厥阳病。\n如：\n350、伤寒，脉滑而厥者，里有热，白虎汤主之。（厥阳轻证）\n320、少阴病，得之二三日，口燥咽干者，急下之，宜大承气汤。\n（厥阳重症）\n335、伤寒一二日至四五日，厥者必发热，前热者后必厥，厥深者\n热亦深，厥微者热亦微。厥应下之，而反发汗者，必口伤烂赤。\n3、厥阳病即阳明热厥病\n“厥阳”见于《金匮。脏腑经络先后病脉证第一》：\n问曰：经云：\"厥阳独行\"，何谓也？师曰：此为有阳无阴，故\n称厥阳。\n有阳无阴，是表面症状上虽然存在阴寒证，如“身大寒”、“厥”、\n“少阴”四逆等，但是里面本质却是无有阴寒证，却是实热证，即阳\n明的热厥病。\n\n因为厥阳病的本质即热厥，也就是阳明病，而少阳包含三阳病，\n厥阴又包含少阳病，故而厥阳病也被厥阴病所包含。所以在厥阴篇我\n们既可以见到四逆汤通脉四逆汤的厥阴病，也可以见到白虎汤大承气\n汤的厥阴病，统为一篇。\n但是我们临床上必须分得出厥阴病种的真厥阴需要温里，厥阴\n病中的厥阳需要清里！这就是厥阴篇以及本条厥阴与厥阳区分的意义\n所在。\n4、第7条为经方表里观， 11条为寒热虚实观。\n7、病有发热恶寒者，发于阳也。无热恶寒者，发于阴也。\n发于阳，七日愈。发于阴，六日愈。以阳数七阴数六故也。\n11、病人身大热，反欲得衣者，热在皮肤，寒在骨髓也；\n身大寒，反不欲近衣者，寒在皮肤，热在骨髓也。\n经方辨证，表里寒热虚实也，故而在《伤寒论》开篇几条，即\n已经彻解，表里寒热虚实之辨尤其集中见于第7 条和11条。\n第7条是经方的表里观，发于阳为发于表，发于里为发于里；\n11条为寒热虚实观，厥阳为热实，厥阴为寒虚。\n至此，经方辨证的要素——表、里、寒、热、虚、实即以完备！\n众所周知，《伤寒》《金匮》本为一书，后世整理人为的割裂\n了这些条文。所以这种《伤寒》开篇的这种表里寒热虚实观，在《金\n匮》开篇也是如出一撤：\n如：\n\n《金匮。脏腑经络先后病脉证第一》：\n问曰：病有急当救里救表者，何谓也？\n师曰：病，医下之，续得下利清谷不止，身体疼痛者，急当救\n里；后身体疼痛，清便自调者，急当救表也。夫病痼疾加以卒病，当\n先治其卒病，后乃治其痼疾也。\n师曰：病人脉浮者在前，其病在表；浮者在后，其病在里，腰\n痛背强不能行，必短气而极也。\n问曰：经云：\"厥阳独行\"，何谓也？师曰：此为有阳无阴，\n故称厥阳。\n此段与《伤寒论》7条、11条关系密切，甚至可以组合而独成\n一篇“经方表里寒热虚实辨证心法”\n临床医案解伤寒五期班\n——伤寒论讲座第七课\n【原文】12、太阳中风，阳浮而阴弱。阳浮者，热自发，阴弱者，汗自出。啬啬\n恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。\n桂枝三两，去皮 芍药三两 甘草二两，炙 生姜三两，切 大枣十二枚，擘\n上五味，㕮咀三味，以水七升，微火煮取三升，去滓，适寒温，服一升。服\n已，须臾啜热稀粥一升余，以助药力。温覆令一时许，遍身漐漐，微似有汗者益\n佳，不可令如水流漓，病必不除。若一服汗出病差，停后服，不必尽剂。若不汗，\n更服依前法。又不汗，后服小促其间，半日许，令三服尽。若病重者，一日一夜\n服，周时观之。服一剂尽，病证犹在者，更作服。若汗不出，乃服至二三剂。禁\n生冷、粘滑、肉面、五辛、酒酪、臭恶等物。\n【校注】\n《玉函经》：太阳中风，阳浮而阴濡弱，阳浮者热自发，濡弱得汗自出，啬\n啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕，桂枝汤主之。\n《千金方》：太阳中风，阳浮而阴濡弱，浮者热自发，濡弱者，汗自出，濇\n濇恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。\n《圣惠方》：太阳病中风脉。其阳浮而弱。浮者热自发。弱者汗自出。啬啬\n恶寒。翕翕发热。鼻鸣干呕。宜桂枝汤。\n\n《康平本》：大阳中风，脉阳浮而阴弱。啬啬恶寒，淅淅恶风，翕翕发热，\n鼻鸣干呕者，桂枝汤主之。\n桂枝去皮，三两 芍药三两 甘草炙，二两 生姜切，三两 大枣\n擘，十二枚\n上五味，㕮咀三味，以水七升，微火煮，取三升，去滓，适寒温，服一升。\n服已须臾，啜热稀粥一升余，以助药力，温覆令一时许，遍身漐漐，微似有汗者\n益佳，不可令如水流离，病必不除。若一服汗出病差，停后服，不必尽剂。若不\n汗，更服，依前法。又不汗，后服小促其间，半日许，令三服尽。若病重者，一\n日一夜服，周时观之。\n服一剂尽，病证犹在者，更作服。若汗不出，乃服至二三剂。禁生冷、粘滑、\n肉面、五辛、酒酪、臭恶等物。\n【原文】13、太阳病，头痛，发热，汗出，恶风，桂枝汤主之。\n【校注】\n《玉函经》：太阳病，头痛发热，汗出恶风，桂枝汤主之。\n《千金方》：太阳病，头痛发热，汗出恶风，桂枝汤主之。\n《圣惠方》：无此条。\n《康平本》：大阳病，头痛发热，汗出恶风者，桂枝汤主之。\n注：\n太阳病，发热汗出，此为营弱卫强，故使汗出，欲解邪风，桂枝汤主之。（康\n平本 12-13 之间）\n太阳病，发热汗出，此为营弱卫强，故使汗出，以救邪风，桂枝汤主之。（千\n金方唐本 12-13 之间）\n【原文】95、太阳病，发热，汗出者，此为荣弱卫强，故使汗出。欲救邪风者，\n宜桂枝汤。［方四十七］方用前法。\n【校注】\n《玉函经》：无此条。\n《千金方》：无此条。\n《圣惠方》：太阳病发热汗出。此为荣弱卫强。故使汗出。欲去其邪。更服\n桂枝汤。\n《康平本》：大阳病，发热汗出者，此为荣弱卫强，故使汗出。欲救邪风者，\n宜桂枝汤。\n【解析】\n1、太阳伤寒与太阳中风病机之异同\n太阳病伤寒证是典型的纯表无里的表病，以寒邪困束，卫阳津血凝滞而引起\n表位及上焦为所急所苦的一组症候群，其实质也就是表寒证，在太阳伤寒病机状\n态下，邪气和表的津血都是绝对有余的，是典型的表实证。\n太阳伤寒病机过程：\n表束——寒邪实——津液实——表实热\n即在表伤于寒的病因作用下，邪气实而侵袭于表，津液实而凝滞于表，卫阳\n\n津血充盈到一定程度而表寒困束仍不解，那么就会发热，形成一组表实热的症候\n群。\n太阳中风病机过程：\n表束——寒邪实——津液虚——表半实半虚热\n而在表伤于寒的病因作用下，邪气实而在侵袭于表，津液虚而涣散于表，那\n么就会出现这么一种特殊的病理状态：\n卫阳聚集于表抗邪而相对有余，津血自里散越而绝对不足。\n卫阳有余于表故聚集而发热——阳浮——卫强；\n津血不足于里故涣散而汗出——阴弱——荣弱。\n这就是为什么桂枝汤证虽然发热但是 12 条反言“阴弱”、95 条反言“荣弱”\n之机理。\n2、伤寒经方体系中太阳中风证之意义：\n太阳中风这种特殊的病机状态在伤寒经方体系中有以下几种意义：\n① 太阳伤寒为纯表病实病，太阳中风已经在表实的基础上病传而兼里病虚病；\n② 故而太阳病正方为治太阳伤寒的麻黄汤，而非治太阳中风的桂枝汤；\n③ 麻黄辛苦温而泄为太阳表病正药，桂枝辛甘温而补为少阴表病正药；\n④ 麻黄汤为泄津泄表而解表，桂枝汤为补津补里而解表；\n⑤ 桂枝汤之所以为群方之祖，是因为从太阳中风贯穿六病中风而形成伤寒经方\n体系独特之表里观（阳明中风为虚热转实，故不用桂枝而用辛寒法解表，六病中\n风皆有勿论本经本病之虚实，常伴有津虚虚热，故而常用芍药人参栝楼根类补津\n液清虚热之寒药）。\n3、三阳中风小便通利，三阴中风小便不利\n桂枝汤证表邪不解津血涣散发热汗出而小便通利，故曰太阳中风，小便清者\n知不在里仍在表也。\n以太阳病开首的三阳病中风证整体偏阳偏表，表病层面更为突出，故常无小\n便异常；\n而以少阴病开首的三阴病中风证整体偏阴偏里，里病层面也很突出，故常常\n小便不利，如：\n少阴中风——桂枝加附子汤证：\n太阳病，发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者，桂\n枝加附子汤主之。(20)\n太阴中风——桂枝加黄芪汤证：\n黄汗之病，两胫自冷；假令发热，此属历节。食已汗出，又身常暮卧盗汗出\n者，此劳气也。若汗出已反发热者，久久其身必甲错；发热不止者，必生恶疮。\n若身重，汗出已辄轻者，久久必身瞤。瞤即胸中痛，又从腰以上必汗出，下无汗，\n腰髋弛痛，如有物在皮中状，剧者不能食，身疼重，烦躁，小便不利，此为黄汗，\n桂枝加黄芪汤主之。(《金匮要略·水气病》)\n诸病黄家，但利其小便；假令脉浮，当以汗解之，宜桂枝加黄芪汤主之。(《金\n匮要略·黄疸病》)\n厥阴中风——柴胡桂枝干姜汤证：\n伤寒五六日，已发汗而复下之，胸胁满微结，小便不利，渴而不呕，但头汗\n出，往来寒热心烦者，此为未解也，柴胡桂枝干姜汤主之。（147）\n而三阳中风的条文并无小便不利,\n\n如：\n太阳中风——桂枝汤证：\n《伤寒论》12 条、太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自\n出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。\n《伤寒论》13 条、太阳病，头痛发热，汗出恶风者，桂枝汤主之。\n《伤寒论》95 条、太阳病，发热汗出者，此为荣弱卫强，故使汗出，欲救邪\n风者，宜桂枝汤。\n少阳中风——柴胡桂枝汤证：\n伤寒六七日，发热微恶寒，支节烦疼，微呕，心下支结，外证未去者，柴胡\n加桂枝汤主之。（146）\n阳明中风——白虎加人参汤证：\n服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主之。（26）\n伤寒若吐若下后，七八日不解，热结在里，表里俱热，时时恶风，大渴，舌\n上干燥而烦，欲饮水数升者，白虎加人参汤主之。（168）\n伤寒无大热，口燥渴，心烦，背微恶寒者，白虎加人参汤主之。（169）\n太阳中热者，暍是也。汗出恶寒，身热而渴，白虎加人参汤主之。（《金匮\n要略· 痉湿暍病脉证第二》）\n4、太阳中风病理与治法 桂枝汤厥阴之理及方解：\n太阳中风既有太阳伤寒的卫强实寒发热，又有病传的营弱虚热，而又以表为\n所急所苦，所以在病机上就存在着表实寒+表虚热的病理。\n这也是为什么后世医家把桂枝汤证认为是“表虚证”的原因。\n而桂枝汤证不是单纯的表虚证，在表上既有实寒卫强发热证，也有荣弱虚热\n证，是表的一种寒热虚实夹杂状态，所以也是最容易发生病传和坏病的状态（详\n解见 16 条）。\n太阳中风除了发热汗出头痛鼻鸣干呕这组上焦和表位的所急所苦，在症状上\n不但会恶风，也会恶寒的。\n正如 12 条明言：“太阳中风......啬啬恶寒，淅淅恶风”，所以后世有些\n医家用恶寒和恶风的症状作为主要特点来区分伤寒和中风，是不符合法度和临床\n的。\n① 桂枝甘草汤治实寒\n从本质上来剖析，太阳中风在病机中就已经包涵了表寒，那么在治法上自然\n也应该能对治表寒。所以麻黄汤中有桂枝甘草汤的基础方干来辛甘发散祛寒解表，\n而桂枝汤中也同样含有桂枝甘草汤的基础方干辛甘发散祛寒解表，也就是说在治\n表寒的这个点上它们的基础方干是重叠吻合的。\n② 芍药甘草汤治虚热\n桂枝汤里含有芍药甘草汤方干，《伤寒论》29 条：“若厥愈足温者，更作芍\n药甘草汤与之，其脚即伸”，可见芍药甘草汤是滋津液而清虚热的基础方干，在\n经方中广泛用于表里之津虚或津虚有热者。\n在表常配伍桂枝等辛药，如桂枝汤，栝楼桂枝汤等；\n在里常配伍黄芩等苦药，如黄芩汤，黄连阿胶汤等。\n③ 甘麦大枣汤养胃气补津液\n桂枝汤还含有甘麦大枣汤方干，甘麦大枣汤见于《金匮·妇人杂病篇》，治\n妇人脏躁，喜悲伤欲哭，象如神灵所作，数欠伸。是一张养胃气补津液缓解迫的\n方子，里面有小麦一升，古人以五谷做粥，麦为五谷之一，所以桂枝汤方后的啜\n\n粥就有了甘麦大枣汤的方义，用以养胃生津滋化汗源。\n④ 半个生姜甘草汤补胃养津降逆治饮\n生姜甘草汤见于《金匮要略·肺痿肺痈咳嗽上气病脉证治第七》之附方：\n《千金》生姜甘草汤，治肺痿咳唾涎沫不止，咽燥而渴。\n（以小品补伤寒始于隋唐，以千金补伤寒始于宋）\n生姜甘草汤是补胃养津降逆治饮的方子。\n桂枝汤含有半个生姜甘草汤方干，即生姜甘草汤去掉人参加粥，因为病在太\n阳当汗之，故而用粥的温煦滋养助汗来取代寒性的人参。\n桂枝汤证中的“鼻鸣”、“干呕”、“气上冲”、“心下闷”，除了因表束\n而气不旁流的主要病机外，也有里位不和的上逆，故而此方干用来和里降逆。\n合而解之，可知桂枝汤非为太阳中风所专设，乃是为表里寒热虚实兼顾之厥\n阴方，只是可以借用来兼治太阳中风而已。\n故桂枝汤更准确的定义是为厥阴中风的标准方，本来营血虚弱了，再伴有虚\n热、胃虚，而触冒外邪后，表上风寒重了就会津血虽然处在虚的状态，但仍需要\n趋表抗邪，故发生表寒卫强的发热证，这就是太阳病中风证的病理。\n另外，中风证都是表里合病而以表为所急所苦，所以即使从表而病传的桂枝\n汤证同样可以兼有里虚胃弱津虚血弱。\n表里先后病的次第可以不同，但是都会导致相同的结果，即出现相同的\n“证”——桂枝证，古又称阳旦证，所以桂枝汤也被称为阳旦汤，是发汗解\n表、调和营卫、和解寒热类方中补津液、养胃气、滋血气之剂。\n正是因为可以对治以上病理，故而桂枝汤具有了健胃养血而防御邪气的功效，\n所以在《金匮》中又被用于妇人妊娠期间的养胎和产后调理，妇人妊娠产后的机\n体特点就是营血虚弱伴有轻微胃虚而容易触冒感邪。\n《金匮·妊娠病》曰：妇人得平脉，阴脉小弱，其人渴，不能食，无寒热，\n名妊娠。于法六十日当有此证。设有医治逆者，却一月加吐下者，则绝之。（此\n条又一次证明了我们提出的平脉不是正常脉，而是符合病理特点的常规病脉的论\n断，故而虽言“平脉”而后又说“阴脉小弱”。）\n《金匮·产后病》产后风，续之数十日不解，头微痛，恶寒，时时有热，心\n下闷，干呕汗出，虽久，阳旦证续在耳，可与阳旦汤。（即桂枝汤，方见下利中）。\n5、桂枝汤方机\n桂枝汤\n桂枝三两 芍药三两 炙甘草二两 生姜三两 大枣十二枚 粥一碗\n方干：桂枝甘草汤 芍药甘草汤 甘麦大枣汤 半个生姜甘草汤\n方眼：桂枝甘草汤+甘麦大枣汤\n方势：发汗（桂枝不用啜粥法不能大发汗） 解表 温卫 补津 缓急 益胃 降\n逆\n6、桂枝汤为仲景众方之祖群方之魁 代表了仲景诸方阴阳寒热互用之特点\n柯韵伯的《伤寒来苏集》所言：“仲景群方之魁，乃滋阴和阳，调和营卫，\n解肌发汗之总方也。凡头痛发热，恶风恶寒，其脉浮而弱，汗自出者，不拘何经，\n不论中风、伤寒、杂病，咸得用此发汗。若妄汗、妄下而表不解者，仍当用此解\n肌。如所云：头痛发热、恶寒恶风、鼻鸣干呕等病，但见一证便是，不必悉具。\n惟以脉弱自汗为主耳”；\n（笔者按：前半段甚当，而不当以脉弱自汗为主，桂枝汤证亦常见脉数无汗，\n当以中风病机之津亏血虚或稍兼胃弱而表寒不解为主）；\n\n清名医徐彬在《金匮要略论注》中认识到：“桂枝汤，外证得之，解肌和营\n卫；内证得之，化气调阴阳”；\n日人矢数道明引《勿误方函口诀》云：“此方为众方之祖，古方以此为胚胎\n者有百余方，其变化应用无穷”。\n桂枝汤为仲景众方之祖群方之冠，演化了阴阳二旦方系的半壁江山，也代表\n了仲景诸方阴阳寒热互用之特点，故而纵观仲景之方，阴阳寒热攻补并施的占九\n成以上，药势单行的不足一成，所以我们经典经方提出了“方证多维”的经方基\n本概念。\n7、太阳中风证必发热 他经中风可不发热\n正如以上所述，太阳中风用桂枝汤来对治，但是并不代表所有的桂枝汤条文\n都是太阳中风证。正因为桂枝汤方证多维，本就是寒热表里虚实并治的厥阴之方，\n只是能兼治太阳中风而已，并不是为太阳中风所独设。故在《伤寒》、《金匮》\n中桂枝汤条文有二十余条，实则绝大多数都不是太阳中风，而是以他经病为主。\n太阳病中风证的成立，需要具有明显而持续发热的特点，必须符合 “太阳病，\n发热，汗出，恶风，脉缓者，名为中风”的症候规律。而太阳病本证的太阳伤寒\n因为寒邪袭表，寒能郁闭阳气影响温煦，反倒不一定马上发的起热来，直到人体\n之卫阳达表抗邪驱寒，产生过度凝滞在表状态的时候才可以开始发热。这也就是\n为什么太阳伤寒的条文反而是“或已发热，或未发热，必恶寒，体痛，呕逆，脉\n阴阳俱紧者，名为伤寒”（《伤寒论》第 3 条）的道理所在。\n如前所述，太阳中风包涵伤寒（表寒）病机并且产生病传，已经过了寒邪郁\n闭阳气不能发热的阶段，所以反倒会以“发热”为主要症状之一，“啬啬恶寒，\n淅淅恶风”，再伴有津液外泄的“汗出”“脉缓”等症候群。故而即使连“时发\n热”的 54 条也并不是太阳中风，而是少阳或厥阴中风（《伤寒论》54 条、病人\n藏无他病，时发热，自汗出而不愈者，此卫气不和也，先其时发汗则愈，宜桂枝\n汤。）\n以下是太阳病中风证桂枝汤证之条文：\n《伤寒论》12 条：太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自\n出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。\n《伤寒论》13 条：太阳病，头痛发热，汗出恶风者，桂枝汤主之。\n《伤寒论》95 条：太阳病，发热汗出者，此为荣弱卫强，故使汗出，欲救邪\n风者，宜桂枝汤。\n8、阳浮而阴弱 以脉言营卫\n太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。\n这里的阳浮，指的是脉象浮取和寸脉是浮象或数象，阴弱指的是脉象沉取虚\n弱或不足，就像前面《金匮》所言“得平脉（表病有表脉），阴脉小弱”。\n而脉者血之府也，“荣（营）行脉中，卫行脉外”，故而脉象最能反映出营\n卫的状态，这里即是以脉而言营卫。\n阳浮为卫气相对强而凝滞在表故发热，阴弱为营血绝对弱而涣散于表故汗出。\n9、桂枝汤方后为经方常规煎服宜忌方法之垂范\n桂枝汤方后文：\n上五味，㕮咀三味，以水七升，微火煮取三升，去滓，适寒温，服一升。服\n已，须臾啜热稀粥一升余，以助药力。温覆令一时许，遍身漐漐，微似有汗者益\n\n佳，不可令如水流漓，病必不除。若一服汗出病差，停后服，不必尽剂。若不汗，\n更服依前法。又不汗，后服小促其间，半日许，令三服尽。若病重者，一日一夜\n服，周时观之。服一剂尽，病证犹在者，更作服。若汗不出，乃服至二三剂。禁\n生冷、粘滑、肉面、五辛、酒酪、臭恶等物。\n①㕮咀煎煮\n五味㕮咀三味，加上生姜切大枣擘，就是全部破碎，以利于气味药效的溶出，\n这也是为什么经方剂量不大药效却宏达的原因之一，即合理的炮炙煎煮方法。\n加水后微火煎煮，是因为急火煎煮则气厚味薄，不利于气和味的均衡析出，\n所以并不是后世认为的解表药需要急煎。这种炮炙煎煮方法也是为常规经方煎煮\n方法之垂范。\n②从汉太医院药罐看“水七升”，七升水按照我们的考证，一升约合 60ml，七\n升即 420ml，煮取三升，每次服用一升，每天三次。现在认为汉代的一升是200ml，\n我们从出土文物来分析一下：孟县出土汉代太医药罐。\n1979 年冬，在河南孟县城西出土了一件汉代太医药罐。罐为陶质,葫芦形,\n平底、圆腹,尖嘴略外撇。罐高 12.5、底径 8、最大腹径 11.5、口径 5.5、厚 0.5\n厘米。底部由外向内逐渐低平,中心有一长 2.8、宽 1.4 厘米的框,框内阳刻汉篆\n“太医”二字。在距中心 2.5 厘米的地方,有一条宽为 0.3 厘米的阴刻环带,将罐\n底分为两个部分。\n经过计算，这个药罐的容量是 637.81ml，如果按照一升折 200ml 计算，七升\n水是 1400ml，那么连桂枝汤这样的小方子都没法煎煮。按照我们考证的一升折\n60ml，七升 420ml，再加上药，正好放在药罐中煎煮。汉代药罐底大口小，尖嘴\n外撇，成葫芦形，正是因为㕮咀的炮炙煎煮规范而设，防止口大药物容易沸出。\n北宋官修的《圣济总录》记载：“古今升斗大小不同，盖古之三升为今一升，凡\n方中用水言升合者，今以中盏为率，庶与世俗相通，无多少之惑。其他如酒酢乳\n蜜之类，凡言升合者，亦合以盏为则”。“盖古之三升为今一升”说明古制小而\n\n今制大，古之一升等于一个中等茶盏容量。其实大处方大药量是最近几十年的事\n情，家中有传承的同学更应该知道，我们的父辈祖父一般是嘱咐患者煎药“三茶\n碗水煎成一茶碗服用”。\n民国药罐图：\n高度不过一支烟卷（8.5cm 左右）。\n③ 发汗有度 不必尽剂\n“啜热稀粥一升余，以助药力。温覆令一时许，遍身漐漐微似有汗者益佳，\n不可令如水流漓，病必不除”。\n因为是中风证而非中风病（中风瘫痪），病总属轻浅，故而药后啜粥温覆取汗不\n要太过，薄薄的一层汗即可，要是出的大汗淋漓，反而耗伤津血更不利于邪气的\n祛除。\n④ 中病即止\n“若一服汗出病差，停后服，不必尽剂。”因为太阳中风总归属于阳之表证，\n可以速愈，所以汗出邪解后就可以停药了。不需要像三阴中风或里病为主的症候\n那样巩固治疗。\n⑤ 不愈增量\n“若不汗，更服依前法。又不汗，后服小促其间，半日许，令三服尽。若病\n重者，一日一夜服，周时观之。服一剂尽，病证犹在者，更作服。若汗不出，乃\n服至二三剂。”\n在辨证正确的情况下，没有取得疗效或者也没有出现相应的治疗反应，那么\n就可以缩短给药时间和加大用药剂量。\n\n一般服药治疗都是在白天进行，如日（白天）三服；若病情重的时候可以把\n夜间也用于给药时间，即夜间也可以三服；如若病情还沉重不解，一日一夜可以\n最多服用三剂相同的方子。\n这也从另一个侧面证明了我们考证的一两约合 6 克的合理性，比如我们用桂\n枝汤方来比较下一两折 6 克和一两折 15 克（15.625 克）一日一夜三剂服尽的用\n量：\n一两 6 克三剂服尽：\n桂枝 54 芍药 54 炙甘草 36 生姜 54 大枣 72\n一两 15 克三剂服尽：\n桂枝 135 芍药 135 炙甘草 90 生姜 135 大枣 72\n中原传统旱大枣核小枣也小，去核的剂量每枚大约 2 克，所以苦酒汤才可以\n用半夏十四枚破如枣核大，装进去掉鸡子黄的鸡蛋壳中煎煮。\n那么大枣的剂量考据实测有了数据以后，大家就会发现，折用 15 克的首先\n辛药和甘药的比例失调了，然后就是服用这么大量的甘草患者会出现浮肿的！并\n且这么大量的桂枝、芍药和生姜下去，患者的胃气会更弱！正如清代伤寒大家徐\n灵胎在《慎疾刍言》中指出的：“要知药气入胃，不过借此调和气血，非药入口，\n即变为气血，所以不在多也！又有病人粒米不进，反用腻膈、酸苦、腥臭之药，\n大碗浓煎灌之，即使中病，尚难运化，况与病相反之药，填塞胃中，即不药死亦\n必灌死，小儿尤甚！”\n这个方后附注在《伤寒例》中有个姊妹条文：“凡发汗温服暖汤药。其方虽\n言日三服。若病剧不解。当促其间。可半日中尽三服。若与病相阻。即便有所觉。\n重病者。一日一夜当晬时观之。如服一剂。病证犹在。故当复作本汤服之。至有\n不肯汗出。服三剂乃解。若汗不出者。死病也。”\n⑥ 饮食宜忌\n“禁生冷、粘滑、肉面、五辛、酒酪、臭恶等物”。\n经方之取效讲究的是四气五味，桂枝汤就是一根平衡木，已经在如理如法的\n燮理病体的阴阳了，就不能因为饮食的的关系而影响到这种丝丝入扣的平衡过程。\n比如：\n生冷：性向阴寒，影响阳气宣发表位，会加重桂枝汤证芍药的寒性而牵制温\n卫发汗解表；\n粘滑：性向下行，影响药势趋于上焦，会加重桂枝汤中芍药的通利而牵制温\n卫益胃解表；\n五辛：五辛常规指的是葱、韭、薤、蒜、姜，这些辛味耗散营阴，会加重桂\n枝汤中桂枝生姜的温散而牵制补津缓急降逆；\n（另有几种不同的五辛说法，如《楞严经》五种辛菜注：五辛者，谓大蒜、\n茖葱、慈葱、兰葱、兴渠；《本草纲目》：大蒜、小蒜、韭、胡荽、芸苔。）\n酒酪：酒会加重桂枝汤中桂枝生姜的温散而影响补津缓急降逆，酪是奶制品，\n《释名·释饮食》：“酪，乳作汁”，指牛羊乳汁或乳制品，气味酸甘会加重桂\n枝汤证芍药酸敛和甘草大枣的甘滋作用而影响到发汗解表；\n臭恶：嗅恶，刺激性气味，闻起来令人不快甚至作呕的气味，往往伤败胃气，\n不宜于桂枝汤中甘草大枣益胃降逆；\n肉面：这个问题前人鲜有解释者，笔者以为，这与古人的饮食模式和经方的\n源流有关。在古代并无冰箱也不具备每家每户都有冰鉴和冰窖储存肉食的条件\n（极少数的王公贵族有一些这样的器具和储存条件），那么肉食都是新鲜屠宰的，\n\n是具有鲜香腥发之气的“发物”，容易动风发火，触引痰涎，诱发疾病，故需要\n禁忌；而面，来源于麦，在汉代以前，尚无大规模的推行石磨技术，要把麦制作\n出面，需要用杵臼杵捣，并且需要用新鲜小麦才行，那这样的面也具有了鲜发之\n气即属于“发物”。而桂枝汤的来源古远，源自汉代之前的伊尹商周时代，故而\n流传而下。\n附：《左传•成公十年》载：“六月丙午，晋侯欲麦，使甸入献麦，馈人为之。\n召桑田巫，示而杀之。将食，张，如厕，陷而卒”，六月，说明是新麦，所以不\n论是直接煮食还是杵臼成面煮食都是“发物”。\n以上煎服方法及饮食宜忌为经方之常规，故而宋本伤寒第二首方桂枝加葛根\n汤方后曰：“余如桂枝法将息及禁忌”，葛根汤方后曰：“余如桂枝法将息及禁\n忌，诸汤皆仿此！”\n10、名词解释\n啬啬恶寒，淅淅恶风，翕翕发热为连绵词，这是汉赋和骈体文的笔法。\n啬啬：《说文》：“啬读如濇”，《水部》：“濇，不滑也”，用的是引申\n义，即因为受寒而肌肤粟起，触之碍手而不滑，引申为恶寒貌，即通俗说法：冻\n得起鸡皮疙瘩。\n淅淅：《说文》：“淅,洒米也”；《广雅》：“淅,洒也。”，也是引申词，\n引申为风寒如冷水洒身之皮毛，如《素问•刺热》：“先淅然起毫毛，恶风寒”。\n翕翕：《广韵》：“翕，火炙”，形意词，合羽，就像蒙盖上羽毛那样的闷\n热的感觉。\n鼻鸣：鼻塞而气息不利吭哧有声。\n须臾：这是舶来词，自从张迁凿空西域，外来的文化和饮食药物器具牲畜等\n对中原进行了有益的补充，比如《金匮》诃梨勒散，也是典型的音译舶来药方，\n还有红蓝花酒等药物都是舶来品。\n这个“须臾”，源自《僧只律》：“一刹那者为一念，二十念为一瞬，二十\n瞬为一弹指，二十弹指为一罗预，二十罗预为一须臾，一日一夜有三十须臾”，\n那么照此计算。一须臾大约是 48 分钟的样子，联系到古人对时间概念相对没有\n锱铢必较，常用模糊概念，大概也就是桂枝汤服后，过半个小时左右，喝一碗热\n粥，以助胃气滋汗源。\n【原文】14、太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。\n葛根四两 麻黄三两，去节 芍药二两 生姜三两，切\n甘草二两，炙 大枣十二枚，擘 桂枝二两，去皮\n上七味，以水一斗，先煮麻黄、葛根，减二升，去上沫，内诸药，煮取三升，\n去滓。温服一升，覆取微似汗，不须啜粥，余如桂枝法将息及禁忌。臣亿等谨按，\n仲景本论，太阳中风自汗用桂枝，伤寒无汗用麻黄，今证云汗出恶风，而方中有麻黄，恐非本意也。第三\n卷有葛根汤证，云无汗，恶风，正与此方同，是合用麻黄也。此云桂枝加葛根汤，恐是桂枝中但加葛根耳。\n【校注】\n《玉函经》：太阳病，项背强几几，而反汗出恶风者，桂枝汤主之。论云：\n桂枝加葛根汤主之。\n《千金方》：太阳病，项背强几几，而反汗出恶风，桂枝汤主之。本论云：\n桂枝加葛根汤主之。\n\n《圣惠方》：无此条。\n《康平本》：太阳病，项背强几几，反汗出恶风者，桂枝加葛根汤主之。\n葛根四两 芍药二两 生姜切 三两 甘草炙 二两 大枣擘 十\n二枚 桂枝二两\n上六味，以水一斗，先煮葛根，减二升，去白沫，内诸药，煮取三升，去滓，\n温服一升，覆取微似汗，不须啜粥，余如桂枝法、将息及禁忌。\n【解析】\n1、津伤而身强为痉病之渐 痉病为津伤而身强之甚\n太阳病伤寒证为津血绝对有余而凝滞在表；\n太阳病中风证为津血相对有余而凝滞在表；\n那么还有一种是太阳痉病，是津血绝对不足而以表位和上焦的经脉失养为所\n急所苦。\n太阳痉病症状类似于太阳病，“其证备”，而其脉不浮反沉，并且不以身痛\n为所急所苦，而是以“身体强”、“几几然”、“颈项强急”、“独头动摇”、\n“卒口噤”、“背反张者”等表位和上焦的经脉经筋失养为所急所苦，这就是\n“太阳痉病”，和“太阳湿病”、“太阳中暍”一样，都是突破了单纯太阳病表\n病的范畴而合并里病虚病，在治法上不是单纯的解表就可以的。\n这几种病既需要解表，也需要配合以治里为主的表里同治法则。\n而本条桂枝加葛根汤证的“项背强几几”，就是最轻浅的一种痉病，所以即\n使用桂枝汤解太阳表也需要加上“起阴气”而主“诸痹”（《本经》）的葛根药\n症对治身项拘强的所急所苦。\n本条原文中方剂桂枝加葛根汤组成中因为错简蹿入了葛根汤，依法修正，桂\n枝加葛根汤即桂枝汤加四两葛根。\n因为葛根的量最大，那么方势就会被葛根所牵引，而成为补益津液舒缓经脉\n为主兼顾解表的功效。\n葛根四两 桂枝三两 芍药三两 甘草二两 生姜三两 大枣十二枚，这组药配\n伍起来以补益津液濡养血脉为主，三两桂枝兼顾表证，所以是一个表里合病表里\n同治的方子。\n若误用过汗解表，或没有固护津血，继续耗散，导致脉细脉弱，就会成为痉\n病中的重证而难治。故而“太阳病，发热，脉沉而细者，名曰痉，为难治”。\n2、无汗而痉为刚痉 汗出而痉为柔痉\n《金匮要略•痉湿喝病脉证第二》：\n“太阳病，发热无汗，反恶寒者，名曰刚痉。太阳病，发热汗出，而不恶寒，\n名曰柔痉。”\n按：此条有一个错简，应该是“太阳病，发热汗出，而反恶寒，名曰柔痉。”\n刚痉柔痉的区别点不是在于恶寒和不恶寒，而是在于是否津液外泄失养的更显著。\n柔者弱也，津液耗伤的更多而变得更弱；\n刚者强也，卫津的状态相对而言比柔痉稍强，并且风寒困束的更明显，所以\n即使治刚痉的葛根汤，也只不过是在桂枝加葛根汤益津液舒缓经脉的基础上加上\n一味散表寒的麻黄。\n故治柔痉的桂枝加葛根汤有“反汗出恶风（寒）者”（恶风恶寒都为表寒证，\n这是连绵词，并无差异）、栝楼桂枝汤有“太阳病其证备”（太阳病证即是以显\n著的恶风寒为特点），是以可证此条错简之误。\n“太阳病，发热，脉沉而细者，名曰痉，为难治”；\n\n“太阳病，发汗太多，因致痉”；\n“夫风病，下之则痉，复发汗，必拘急”；\n“疮家，虽身疼痛，不可发汗，汗出则痉”；\n“病者，身热足寒，颈项强急，恶寒，时头热，面赤，目赤，独头动摇，卒口噤，\n背反张者，痉病也”；\n“太阳病，其证备，身体强，几几然，脉反沉迟，此为痉，栝蒌桂枝汤主之”；\n“太阳病，无汗而小便反少，气上冲胸，口噤不得语，欲作刚痉，葛根汤主\n之。\n葛根汤方\n葛根四两 麻黄三两（去节） 桂枝二两（去皮） 芍药二两 甘草二两\n（炙） 生姜三两 大枣十二枚\n上七味，㕮咀，以水七升，先煮麻黄、葛根，减二升，去沫，内诸药，煮取\n三升，去滓，温服一升，覆取微似汗，不须啜粥，余如桂枝汤法将息及禁忌。”\n《伤寒论》31 条：“太阳病，项背强几几，无汗，恶风，葛根汤主之”；\n按：《金匮》葛根汤条和《伤寒》葛根汤条药物服法禁忌条并无二致，本为一篇。\n3、阳明痉病 急下存阴\n“痉为病（一本痉字上有刚字），胸满口噤，卧不着席，脚挛急，必齿介齿，可\n与大承气汤。\n大承气汤方\n大黄四两（酒洗） 厚朴半斤（炙去皮） 枳实五枚（炙） 芒硝三\n合\n上四昧，以水一斗，先煮二物，取五升，去滓，内大黄。煮取二升，去滓，\n内芒硝，更上火微一二沸，分温再服，得下止服。”\n按：上条属于阳明痉病，当急下存阴，与太阳痉病泾渭分明。\n【原文】15、太阳病，下之后，其气上冲者，可与桂枝汤。方用前法。若不上冲\n者，不得与之。\n【校注】\n《玉函经》：太阳病，下之后，其气上冲者，可与桂枝汤；不冲者，不可与之。\n《千金方》：太阳病下之，其气上冲，可与桂枝汤；不冲不可与之。\n《圣惠方》：太阳病若下之。其气上冲。可与桂枝汤。\n《康平本》：太阳病，下之后，其气上冲者，可与桂枝汤。方用前法注若不是上\n冲者，不可与之。\n【原文】21、太阳病，下之后，脉促胸满者，桂枝去芍药汤主之。促，一作：纵。\n【校注】\n\n《玉函经》：太阳病，下之，其脉促，胸满，桂枝去芍药汤主之。\n《千金方》：太阳病，下之，其脉促，胸满者，桂枝去芍药汤主之。\n《圣惠方》：太阳病若下之。其脉促。胸中满。宜桂枝汤。\n《康平本》：大阳病，下之后，脉促胸满者，桂枝去芍药汤主之。\n【原文】22、若微寒者，桂枝去芍药加附子汤主之。\n【校注】\n《玉函经》：若微恶寒者，桂枝去芍药加附子汤主之。\n《千金方》：若微寒者，桂枝去芍药加附子汤主之。桂枝去芍药，中加附子\n一枚，即是。\n《圣惠方》：无此条。\n《康平本》：若微恶寒者，桂枝去芍药加附子汤主之。\n【解析】\n15、21、22 条用的是省文笔法，皆为太阳病误下后表仍不解，而尚未兼太阴\n水证（28 条 桂枝去芍药加茯苓白术汤证）和阳明火证（279 条 桂枝加大黄汤证），\n当联系解读：\n28、服桂枝汤，或下之，仍头项强痛，翕翕发热，无汗，心下满微痛，小便\n不利者，桂枝去桂加茯苓白术汤主之。\n279、本太阳病，医反下之，因尔腹满时痛者，属太阴也，桂枝加芍药汤主\n之，大实痛者，桂枝加大黄汤主之。\n1、下后胃气未伤 病仍在表\n太阳病，下之后，其气上冲，而为出现二便异常和里证者，说明仍然是表束\n而气不旁流之气冲，故可与桂枝汤；\n2、后胃气已伤 当表里同治\n若不上冲而二便异常或出现里证者，不得与之，当看病传太阴水证还是阳明\n火证而依法治之。\n详如 28 条桂枝去芍药加茯苓白术汤证及 279 条桂枝加大黄汤证等。（芍药\n大黄相类，如 280、太阴为病，脉弱，其人续自便利，设当行大黄、芍药者，宜\n减之。以其人胃气弱，易动故也。）\n3、下后卫气不足抗邪 则去芍药\n芍药性寒 味酸苦，下后脉促，说明表仍不解，胸满就是气冲之甚，说明表\n困束的更紧了，所以去掉药性寒凉酸敛碍于解表的芍药，把桂枝汤调成一张发散\n的更张扬的方子，温卫气而解表。\n芍药\n《神农本草经·中经》：味苦平。主邪气腹痛，除血痹，破坚积寒热，疝瘕，\n止痛，利小便，益气。\n《千金翼方·本草中品之上》：味苦酸，平，微寒，有小毒。主邪气腹痛，\n除血痹，破坚积，寒热疝瘕，止痛，益气，通顺血脉，缓中，散恶血，逐贼血，\n去水气，利膀胱大小肠，消痈肿，时行寒热，中恶，腹痛，腰痛。\n4、下后卫阳不能温煦养脉 则加附子\n22 条也用了省文笔法，不是微恶寒，而是脉不促了，变成（脉）微（而恶）\n寒者，则在桂枝去芍药汤的基础上加上附子温卫阳而温阳复脉解表驱寒。\n下后卫气已伤 病传里位\n附子\n\n《神农本草经》：【附子】味辛。温。主治风寒咳逆。邪气。温中。金创。\n破癥坚积聚。血瘕。寒湿踒躄。拘挛。膝痛不能行走。生犍为山谷。\n《名医别录》：【附子】味甘。大热。有大毒。主治脚疼冷弱。腰脊风寒。\n心腹冷痛。霍乱转筋。下痢赤白。坚肌骨。强阴。又堕胎。为百药长。生犍为及\n广汉。八月采为附子。春采为乌头。（地胆为之使。恶蜈蚣。畏防风甘草黄芪人\n参乌韭大豆。）\n【原文】16、太阳病三日，已发汗，若吐，若下，若温针，仍不解者，此为坏病，\n桂枝不中与之也。观其脉证，知犯何逆，随证治之。桂枝本为解肌，若其人脉浮\n紧，发热汗不出者，不可与之也。常须识此，勿令误也。\n【校注】\n《玉函经》：太阳病三日，已发汗，若吐、若下、若温针而不解，此为坏病，\n桂枝不复中与也。观其脉证，知犯何逆，随证而治之。\n桂枝汤，本为解肌，其人脉浮紧，发热无汗，不可与也。常须识此，勿令误也。\n《千金方》：太阳病三日，已发汗，吐下、温针而不解，此为坏病，桂枝汤\n复不中与也，观其脉证，知犯何逆，随证而治之。\n桂枝汤本为解肌，其人脉浮紧，发热无汗，不可与也。常识此，勿令误也。\n《圣惠方》：无此条\n《康平本》：太阳病三日，已发汗，若吐、若下、若温针，仍不解者，此为\n坏病。桂枝不中与之也，观其脉证，知犯何逆，随证治之。\n【解析】\n1、 坏病为表里虚实寒热杂错之病\n《伤寒论》中，称作“坏病”的有两条，除了本条，还有 267、若已吐、下、\n发汗、温针，谵语，柴胡汤证罢，此为坏病。知犯何逆，以法治之。\n桂枝汤为阳旦汤，柴胡汤为阴旦汤，代表着阴阳层面不同的解表方阵。\n也就是说，当在单用阳旦和阴旦方阵都屡治不效的时候，往往就需要阴旦和\n阳旦方系的合方或合法去随证治之或者依法治之或依病传治之了。\n这就是为什么经方中多见阴阳寒热表里虚实互杂之方的缘由。\n2、解肌法为芍药法\n诚如《玉函经》所言，是“桂枝汤本为解肌”而不是“桂枝本为解肌”，这\n也是省文笔法。不是说桂枝这味药能解肌，恰恰相反，解肌是芍药的功用。\n并且“其人脉浮紧，发热汗不出者，”是表寒困束的伤寒证，并不禁桂枝，\n如麻黄汤中即用桂枝来解表寒。“脉浮紧，发热汗不出”，需要禁用酸敛的芍药！\n脉紧（紧张）发热当发散——辛——桂枝——偏阳\n脉缓（涣散）发热当收敛——酸——芍药——偏阴\n这两味药一去一加的法度，即可以灵活调节桂枝汤偏阳偏阴之两大类方。\n3、经方三境界 随证治之、依法治之、以病传治之\n随证治之\n病者脚挛急就用芍药甘草汤；谵语腹满就用调胃承气汤；这叫随证治之，是\n经方最浅的一层用法，类似于以方证或条文证来使用经方。\n以法治之\n病者脚挛急，经过辨证发现是津血虚寒而表中风引起的“四肢微急”，就用\n桂枝加附子汤的少阴中风法度施治（《伤寒论》20 条）；\n\n病者谵语，经过辨证发现是表不解里有热夹杂水饮的“谵语遗尿”，就用白\n虎汤的三阳合病法度施治（《伤寒论》219 条），这叫以法治之。\n以病传治之\n以病传治之，你牵着病让病按照你的方式走出去，发现用大小承气汤后病人\n会出现偏于虚寒的一面，那我们就前瞻性地给他用药，先用调胃承气汤，然后再\n用甘草干姜汤，或者先用调胃承气汤再用四逆汤，如 29 条。\n或者《金匮·淡饮咳嗽病》中这一系列的组合拳法：\n咳逆倚息，不得卧，小青龙汤主之（方见上文肺痈中）。\n青龙汤下已，多唾口燥，寸脉沉，尺脉微，手足厥逆，气从小腹上冲胸咽，手足痹，其面翕热如醉状，\n因复下流阴股，小便难，时复冒者；与茯苓桂枝五味甘草汤，治其气冲。\n桂苓五味甘草汤方\n茯苓四两 桂枝四两（去皮） 甘草三两（炙） 五味子半升\n上四味，以水八升，煮取三升，去滓，分三温服。\n冲气即低，而反更咳，胸满者，用桂苓五味甘草汤去桂，加干姜、细辛，以治其咳满。\n苓甘五味姜辛汤方\n茯苓四两 甘草三两 干姜三两 细辛三两 五味半升\n上五味，以水八升，煮取三升，去滓，温服半升，日三。\n咳满即止，而更复渴，冲气复发者，以细辛、干姜为热药也。服之当遂渴，而渴反止者，为支饮也。\n支饮者，法当冒，冒者必呕，呕者复内半夏，以去其水。\n桂苓五味甘草去桂加干姜细辛半夏汤方\n茯苓四两 甘草三两 细辛二两 干姜二两 五味子 半夏各半升\n上六味，以水八升，煮取三升，去滓，温服半升，日三。\n水去呕止，其人形肿者，加杏仁主之。其证应内麻黄，以其人遂痹，故不内之。若逆而内之者，必厥。\n所以然者，以其人血虚，麻黄发其阳故也。\n苓甘五味加姜辛半夏杏仁汤方\n茯苓四两 甘草三两 五味半升 干姜三两 细辛三两 半夏半升 杏仁半升（去皮尖）\n上七味，以水一斗，煮取三升，去滓，温服半开，日三。\n若面热如醉，此为胃热上冲熏其面，加大黄以利之。\n苓甘五味加姜辛半杏大黄汤方\n茯苓四两 甘草三两 五味半升 干姜三两 细辛三两 半夏半升 杏仁半升 大黄三两\n上八味，以水一斗，煮取三升，去滓，温服半升，日三。\n明白了经方这三层境界，也就是可以明白为什么很多医家初诊的方子有效。\n越服用效果反而不佳，都是因为只针对了⼀部分病机，并未全解病机。所以在这\n个病机得到纠正时，患者病减。\n而此消彼长，在这个病机纠正后，还有未照顾周全之病机就会受到牵制而变\n化，所以越服用则诸症蜂起。此法度可以统摄后世“效不更方”与“效必更方”\n诸说，病机改变则更方，病机不变则守方。\n在基础病机层面随证治之，到了复合病机层面依法治之，再联系到四证层面\n全盘分析病传规律时则可以以病传治之。\n要想去彻底治愈疑难性疾病和大病顽疾，一定要有“以病传治之”这样一个\n整体的战略性的思维，并不只是单纯的去随证治之，跟在症状后面跑永远是打不\n赢战争的，永远是被病所牵引，要前瞻性地去处方用药，这样才能从整体把体质\n逆转过来，把病势逆转过来。\n【原文】17、若酒客病，不可与桂枝汤，得之则呕，以酒客不喜甘故也。\n【校注】\n《玉函经》：酒客不可与桂枝汤，得之则呕，酒客不喜甘故也。\n《千金方》：酒客，不可与桂枝汤，得之则呕，酒客不喜甘故也。\n\n《圣惠方》：无此条。\n《康平本》：若酒客病，不可与桂枝汤，得汤则呕，以酒客不喜甘故也。\n【原文】18、喘家，作桂枝汤加厚朴杏子，佳。\n【校注】\n《玉函经》：喘家，作桂枝汤加厚朴杏仁佳。\n《千金方》：喘家作，桂枝汤加厚朴杏仁佳。\n《圣惠方》：无此条。\n《康平本》：喘家作桂枝汤，加厚朴杏子佳。\n【原文】19、凡服桂枝汤吐者，其后必吐脓血也。\n【校注】\n《玉函经》：服桂枝汤吐者，其后必吐脓血。\n《千金方》：服桂枝汤吐者，其后必吐脓血。\n《圣惠方》：无此条。\n《康平本》：又服桂枝汤吐者，其后必吐脓血也。\n【解析】\n1、整合错简\n17、18、19 条需要相互联系并参看《金匮》、《千金》的泽泻汤、厚朴大黄\n汤条才能解析：\n17、若酒客病，不可与桂枝汤，得之则呕，以酒客不喜甘故也。\n18、喘家，作桂枝汤加厚朴杏子，佳。\n19、凡服桂枝汤吐者，其后必吐脓血也。\n《金匮·淡饮咳嗽篇》\n心下有支饮，其人苦冒眩，泽泻汤主之。\n泽泻汤方\n泽泻五两 白术二两\n右二味，以水二升，煮取一升，分温再服。\n支饮胸满者，厚朴大黄汤主之。\n厚朴大黄汤方\n厚朴一尺 大黄六两 枳实四枚\n右三味，以水五升，煮取二升，分温再服。\n《备急千金要方·卷十八：大肠腑方·痰饮第六》中可以见到一些更详细点的资\n料：\n夫酒客咳者，必致吐血，此坐久饮过度所致也。其脉虚者必冒，其人本有支饮在\n胸中也。\n支饮胸满，厚朴大黄汤主之。\n厚朴(一尺)大黄(六两)枳实(四两) 上三味，㕮咀，以水五升，煮取二升，\n分为二服，温服之。\n\n因为《金匮》此条有脱遗，故从《千金》中补全。\n这五条说的是一个法度，本为一篇，经过整理排序如下：\n酒客病喘家作，不可与桂枝汤，得之则呕，以酒客不喜甘故也，桂枝汤加厚\n朴、杏子佳。\n凡酒客咳，服桂枝汤吐者，其后必吐脓血也。此坐久饮过度所致也。\n其脉虚者必（苦）冒，以其人本有支饮在胸中故也，心下有支饮，其人苦冒\n眩，泽泻汤主之，治属饮家；\n（若其脉实而不苦冒者，以其人留气结在胸，胸满）厚朴大黄汤主之。\n2、解读条文\n酒客，久坐饮酒，中焦气机容易壅滞，病咳喘的话，单纯用桂枝汤甘养津液\n而解表，不用苦泄的气证药，则中焦气机更容易壅滞，会发生呕吐甚至因为桂枝\n汤助热而导致吐血。这种证型，需要用桂枝汤加上厚朴杏仁这样苦泄而疏通气机\n的药物对治。若是上述酒客咳喘时，服了桂枝汤咳血后应该怎么治疗呢？\n后段说明了酒客误治咳血的两种证型：\n<1>伴有脉虚眩晕者是留饮支结在胸，虚寒水饮伤血为主，当用治饮或兼顾\n血分的方子如泽泻汤、真武汤、当归芍药散等（支饮不得息，还可以用葶苈大枣\n泻肺汤主之）；\n<2>伴有脉实不眩晕者是留气郁结在胸，气郁化火伤血为主，当用行气清下\n或兼顾血分的方子如厚朴大黄汤、栀子大黄汤等。（栀子大黄汤：酒黄疸，心中\n懊憹或热痛，梔子大黄汤主之。《金匮要略·黄疸病脉证并治第十五》）\n是以酒客的气滞在胸和热势上攻不但可以导致心中懊燶热痛和黄疸，也会伤\n血咳血吐血的，症状虽有不同，病机实则一致。\n临床医案解伤寒五期第八课\n（2017 年 9 月 1 日）\n【原文】23、太阳病，得之八九日，如疟状，发热恶寒，热\n多寒少，其人不呕，清便欲自可，一日二三度发。脉微缓者，\n为欲愈也；脉微而恶寒者，此阴阳俱虚，不可更发汗、更下、\n更吐也；面色反有热色者，未欲解也，以其不能得小汗出，\n\n身必痒，宜桂枝麻黄各半汤。\n桂枝一两十六铢，去皮 芍药 生姜切 甘草炙 麻黄\n去节，各一两 大枣四枚，擘 杏仁二十四枚，汤浸，去皮\n尖及两仁者\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，\n煮取一升八合，去滓。温服六合。本云：桂枝汤三合，麻黄\n汤三合，并为六合，顿服，将息如上法。臣亿等谨按，桂枝\n汤方：桂枝、芍药、生姜各三两，甘草二两，大枣十二枚。\n麻黄汤方：麻黄三两，桂枝二两，甘草一两，杏仁七十个。\n今以算法约之，二汤各取三分之一，即得桂枝一两十六铢，\n芍药、生姜、甘草各一两，大枣四枚，杏仁二十三个零三分\n枚之一，收之得二十四个，合方。详此方乃三分之一，非各\n半也，宜云合半汤。\n【校注】\n《玉函经》：太阳病，得之八九日，如疟状，发热而恶寒，热多而寒少，其\n人不呕，清便自调，日二三发，脉微缓者为欲愈。脉微而恶寒，此阴阳俱虚，不\n可复吐下发汗也，面色反有热色者，为未欲解，以其不能得小汗出，身必当痒，\n桂枝麻黄各半汤主之。\n\n《千金方》：太阳病，得之八九日，如疟，发热而恶寒，热多而寒少，其人\n不呕，清便欲自可，一日再三发，其脉微缓者，为欲愈。脉微而恶寒者，此为阴\n阳俱虚，不可复吐下、发汗也。面色反有热者，为未欲解，以其不能得汗出，身\n必当痒，桂枝麻黄各半汤主之。\n桂枝一两十六铢 芍药 生姜切 甘草炙 麻黄去节，各一两 大枣四枚，\n擘 杏仁二十四枚，去皮尖，两仁者\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取一升八合，去\n滓，温服六合。本云：桂枝汤三合，麻黄汤三合，并为六合，顿服。\n《圣惠方》：无此条。\n《康平本》：大阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不\n呕，清便欲自可，一日二三度发。注脉微缓者，为欲愈也；脉微而恶寒者，此阴\n阳俱虚，不可更发汗、更下、更吐也；面色反有热色者，未欲解也。经以其不能\n得小汗出，身必痒，宜桂枝麻黄各半汤。\n桂枝一两十六铢 芍药 生姜切 甘草炙 麻黄去节，各一两 大枣擘，四\n枚 杏仁汤浸去皮尖及两仁者，二十四枚\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取一升八合，去\n滓，温服六合。注本云：桂枝汤三合，麻黄汤三合，并为六合，顿服例将息如上\n法。\n【原文】25、服桂枝汤，大汗出，脉洪大者，与桂枝汤，如\n前法，若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一\n\n汤。方十二。\n桂枝一两十七铢，去皮 芍药一两六铢 麻黄十六铢，\n去节 生姜一两六铢，切 杏仁十六个，去皮尖 甘草\n一两二铢，炙 大枣五枚，擘\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，\n煮取二升，去滓，温服一升，日再服。本云：桂枝汤二分，\n麻黄汤一分，合为二升，分再服。今合为一方。将息如前法。\n臣亿等谨按：桂枝汤方，桂枝、芍药、生姜各三两，甘草二\n两，大枣十二枚。麻黄汤方，麻黄三两，桂枝二两，甘草一\n两，杏仁七十个。今以算法约之∶桂枝汤取十二分之五，即\n得桂枝、芍药、生姜各一两六铢，甘草二十铢，大枣五枚。\n麻黄汤取九分之二，即得麻黄十六铢，桂枝十铢三分铢之二，\n收之得十一铢，甘草五铢三分铢之一，收之得六铢，杏仁十\n五个九分枚之四，收之得十六个。二汤所取相合，即共得桂\n枝一两十七铢，麻黄十六铢，生姜芍药各一两六铢，甘草一\n两二铢，大枣五枚，杏仁十六个，合方。\n【校注】\n\n《玉函经》：服桂枝汤大汗出，若脉但洪大者，与桂枝汤，若其形如疟，\n一日再发，汗出便解，宜桂枝二麻黄一汤。\n《千金方》：服桂枝汤，大汗出，若脉洪大，与桂枝汤。其形如疟，一日再\n发，汗出便解，宜桂枝二麻黄一汤方。\n桂枝一两十七铢，去皮 麻黄十六铢 生姜切 芍药各一两六铢 甘草一两二铢，\n炙 大枣五枚，擘 杏仁十六枚，去皮尖，两仁者\n上七味，以水七升，煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，温\n服一升，日再服。本云：桂枝汤二分，麻黄汤一分，合为二升，分二服。今合为\n一方。\n《圣惠方》：无此条。\n《康平本》：服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法，若形如疟，\n一日再发者，汗出必解，宜桂枝二麻黄一汤。\n桂枝一两十六铢，去皮 芍药一两六铢 麻黄去节 十六铢 生姜切 一两十\n六铢 杏仁去皮尖 十六株 甘草炙 一两二铢 大枣擘 五枚\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，\n温服一升，日再服。注本云：桂枝汤二分，麻黄汤一分，合为二升，分再服。今\n合为方。例将息如上法。\n【原文】27、太阳病，发热恶寒，热多寒少，脉微弱者，此\n无阳也，不可发汗。宜桂枝二越婢一汤。方十四。\n桂枝去皮 芍药 麻黄 甘草炙，各十八铢 大枣四枚，\n\n擘 生姜一两二铢，切 石膏二十四铢，碎，绵裹\n上七味，以水五升，煮麻黄一二沸，去上沫，内诸药，\n煮取二升，去滓，温服一升。本云：当裁为越婢汤、桂枝汤，\n合之饮一升；今合为一方，桂枝汤二分、越婢汤一分。\n臣亿等谨按：桂枝汤方：桂枝、芍药、生姜各三两，甘\n草二两，大枣十二枚。越婢汤方：麻黄三两，生姜三两，甘\n草二两，石膏半斤，大枣十五枚。今以算法约之，桂枝汤取\n四分之一，即得桂枝、芍药、生姜各十八铢，甘草十二铢，\n大枣三枚。越婢汤取八分之一，即得麻黄十八铢、生姜九铢，\n甘草六铢、石膏二十四铢，大枣一枚八分之七，弃之。二汤\n所取相合，即共得桂枝、芍药、甘草、麻黄各十八铢，生姜\n一两三铢，石膏二十四铢，大枣四枚，合方。旧云：桂枝三，\n今取四分之一，即当云桂枝二也。越婢汤方，见仲景杂方中。\n《外台秘要》一云：起脾汤。\n【校注】\n《玉函经》：太阳病，发热而恶寒，热多寒少，脉微弱者，此无阳也，不\n可复发其汗，宜桂枝二越婢一汤。\n《千金方》：太阳病，发热恶寒，热多寒少，脉微弱，则无阳也，不可发汗，\n\n桂枝二越婢一汤方主之。方：\n桂枝 芍药 甘草炙 麻黄去节，各十八铢 生姜一两三铢，切 石膏二十四\n铢，碎 大枣四枚，擘\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，\n温服一升。本云：当裁为越婢汤，桂枝合之，饮一升，今合为一方，桂枝汤二分。\n《圣惠方》：无此条。\n《康平本》：大阳病，发热恶寒，热多寒少，脉微弱者，（“此无阳也”原\n文写在“脉微弱者”下方），不可大发汗，宜桂枝二越婢一汤。服桂枝汤，或下\n之，仍头项强痛，翕翕发热，无汗，心下满，微痛，小便不利者，桂枝去桂加茯\n苓白术汤主之。\n桂枝二越婢一汤\n桂枝去皮 芍药 麻黄 甘草炙，各十八铢 大枣擘，四枚 生姜切，一两二\n铢 石膏擘，绵裹，二十四铢\n上七味，以水五升，煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，温\n服一升。注：本云：当裁为越婢汤、桂枝汤，合之饮一升，今合为一方，桂枝汤\n二分，越婢汤一分。\n桂枝去桂加茯苓白术汤\n芍药三两 甘草炙，二两 生姜切 白术 茯苓各三两 大枣擘，十二枚\n上六味，以水八升，煮取三升，去滓，温服一升。小便利则愈。注：本云：\n桂枝汤，今去桂枝加茯苓、白术。\n【解析】\n\n23、25、27 条三条连解\n23、25、27条，本为太阳病桂枝汤与麻黄汤合方合法、变方变\n法之一系列法度条文，但是因为存在着严重的错简及误读，所以在伤\n寒学术界长期以来含混不清难以解析，影响了伤寒经方体系的圆融以\n及续命法的复原，笔者经过考据整理，复原如下：\n宋本原文：\n23、太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，\n圊便欲自可，一日二三度发。脉微缓者，为欲愈也，脉微而恶寒者，\n此阴阳俱虚，不可更发汗、更下、更吐也。面色反有热色者，未欲解\n也，以其不能得小汗出，身必痒，宜桂枝麻黄各半汤。\n25、服桂枝汤，大汗出，脉洪大者，与桂技汤，如前法（蹿入衍文）。\n若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一汤。\n27、太阳病，发热恶寒，热多寒少，脉微弱者，此无阳也，不可发汗，\n宜桂枝二越婢一汤。\n①26 条蹿入25 条之错简\n25、服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法，若形似疟，\n一日再发者，汗出必解，宜桂枝二麻黄一汤。脉微缓者，为欲愈也\n26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主\n之。\n\n25条的“服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法”\n和26条“服桂枝汤，大汗出后，大烦渴不解，脉洪大者”本为26条\n一段文字，故此段为蹿入25条中重出者。\n即去掉衍文的25条条文如下：\n25、若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一汤。\n②错简整合后读法\n<1>23条与25条错简整合后读法：\n太阳病，得之八九日，如疟状（若形似疟），发热恶寒，热多寒\n少，其人不呕，圊便欲自可，一日二三度发（一日再发者，汗出必解），\n宜桂枝二麻黄一汤，脉微缓者，为欲愈也。\n<2>23条与27条错简整合后读法：\n脉微而恶寒者（太阳病，发热恶寒，热多寒少，脉微弱者），此\n阴阳俱虚（此无阳也），不可更发汗、更下、更吐也，宜桂枝二越婢\n一汤。\n<3>面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂\n枝麻黄各半汤。\n③错简整合后解法\n<1>23条与25条错简整合后读法：\n\n太阳病，得之八九日，如疟状（若形似疟），发热恶寒，热多寒\n少，其人不呕，圊便欲自可，一日二三度发（一日再发者，汗出必解）。\n宜桂枝二麻黄一汤。脉微缓者，为欲愈也。\n解：太阳病，八九日当传变，但是不呕、二便正常，正如56条\n所言“小便清者知不在里仍在表也”；所以这种传变就没到少阳或阳\n明这样的里位，还是在表上，由于缠绵日久，津液抗邪外出，而邪势\n已减津液亦伤的营卫不和证，所以虽然发热恶寒，但是以发热为主，\n恶寒轻微，和典型太阳病表邪重的发热恶寒并重不同；营卫不和则往\n往有往来之证，故寒热如疟，一日两三度发作；所以就用两份桂枝汤\n去和解营卫，用一份麻黄汤去发散表上寒邪；那么这个脉象，就会兼\n有桂枝汤和麻黄汤两方的特点，桂枝汤是脉阳浮阴弱，麻黄汤是脉浮\n紧，那么综合起来，桂二麻一汤的脉就会是阳浮紧而阴微弱，浮取浮\n紧，沉取又微弱不足而又以阴微弱为主，因为表上有寒邪的困束也；\n要是表上的寒邪解了，紧就去了，邪气去了，只要津液恢复就会病解\n的，所以剩下这个脉也会从微弱变得缓和起来，注意，脉微缓者，是\n脉从“阴微弱”变成了“阴缓和”，（所以下文还会说“脉微而恶寒\n者”这个微是一个基础脉，变缓和始为不传），紧者，躁动之脉，缓\n者，安静之脉，“脉若静为不传也”，所以只要津液自和就会痊愈。\n<2>23条与27条错简整合后解法：\n\n脉微而恶寒者（太阳病，发热恶寒，热多寒少，脉微弱者），此\n阴阳俱虚（此无阳也），不可更发汗、更下、更吐也，宜桂枝二越婢\n一汤。\n解：上段桂二麻一汤是脉阳浮紧而阴微弱，表上有寒邪与阳津的\n凝滞，故用两份桂枝汤补津液和营卫，用一份麻黄汤散风寒发邪汗；\n而到了本证是脉微弱，没有了那个紧，也就是表上的寒邪已经入里化\n热了但是表还不了了，而且津液还不足，营卫还不和。\n这种情况，表不解而不可汗，虽入里而不可吐下，所以就用两份\n桂枝汤补津液和营卫，用一份越婢汤微清里热微解表束。\n无阳——表上卫阳津液凝滞失去温煦防御功能；阴阳俱虚——卫\n阳和营阴都不足，表上不能温煦防御，里面不能营养濡润。\n<3>面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂\n枝麻黄各半汤。\n解：本证的脉象，也是兼有桂枝汤和麻黄汤两方的特点，阳浮紧\n而阴微弱，浮取浮紧，沉取又微弱不足而又以浮取浮紧为主，正好和\n桂二越一汤相对应。表证也比桂二越一汤重一些，也就是阳气重故也\n（46条麻黄汤），所以会有麻黄汤阳气重的一些表现，典型的麻黄\n汤证都可以发烦目瞑，这个轻一些，但也会面有热色的。阴弱还有桂\n枝汤的津液不足，津液既不足又要向表上充盈，风邪寒邪各自为疟，\n\n充盈重了会身痛的，这是风寒两感证，既充盈又达不到那种张力和程\n度，所以疼痛不起来，就会有身痒的症状。故而用一份桂枝汤和一份\n麻黄汤各取其半双解风寒，既补津液而又散津液以解身痒等表证。\n④三方解表强度比较\n桂二麻一汤芍药倍于麻黄，制约发散；\n桂麻各半汤芍药等量麻黄，发表略强。\n桂二越一汤芍药等量麻黄，又有重于麻黄一倍半量的石膏，发表\n作用最弱。解表强度：桂枝麻黄各半汤＞桂枝二麻黄一汤＞桂枝\n二越婢一汤。\n⑤三方剂量\n桂麻各半汤\n桂枝10 生白芍6 炙甘草6 生姜6 大枣8 麻黄6 杏仁8\n桂二麻一汤\n桂枝10 生白芍8 炙甘草6 生姜9 大枣10 麻黄4 杏仁6\n桂二越一汤\n桂枝4 生白芍4 炙甘草4 生姜6 大枣9 麻黄4 生石膏 6\n⑥此三方为续命类方之滥觞\n\n此三方解决了伤寒体系中风寒两感的治法，即中风证兼有轻微风\n寒两感者，只要麻黄法（发表津血水法）小于桂枝法（补津血水而发\n表法），既可用在有汗出的情况下。\n这也是续命类方之滥觞与重要方干，其组成也被包含于大多数续\n命类方中。\n经过此法度的延伸，在中风病中，勿论有汗无汗，只要表上有风\n寒邪气困束，就会用此类方干去解表邪救邪风。\n【原文】24、太阳病，初服桂枝汤，反烦不解者，先刺风池、\n风府，却与桂枝汤则愈。\n【校注】\n《玉函经》：太阳病，初服桂枝汤，反烦不解者，当先刺风池、风府，却\n与桂枝汤即愈。\n《千金方》：太阳病，初服桂枝汤，而反烦不解者，当先刺风池、风府，\n乃却与桂枝汤则愈。\n《圣惠方》：太阳病服桂枝汤烦热不解者。当先针风池风府穴。乃与桂枝\n汤即愈。\n《康平本》：大阳病，初服桂枝汤，反烦不解者，先刺风池、风府，却与\n桂枝汤则愈。\n\n【解析】\n这一条，有两个需要掌握的知识点，\n①桂枝救表 针引阳气\n在12条桂枝汤方后我们看到的法度是“服一剂尽，病证犹在者，\n更作服。若汗不出，乃服至二三剂”，而本条又提出了可以配合针刺\n的治疗方案。也就是说桂枝证服药一剂不解者，按照汤液派本来的做\n法应该是再连续服第二剂和第三剂桂枝汤的。\n如若医者、患者畏惧药量过重；或仓促间药物尚未煎备等因素影\n响；也可以用针刺风池、风府的方法来代替桂枝汤发汗解表，即扁鹊\n所谓“在肌肤，针石之所及也”（《扁鹊见蔡桓公》）。但此针刺法\n只能替代桂枝汤的发汗解表作用，而不能代替其补津液养血脉的作用。\n故而后续还需要服用桂枝汤来补津液养血脉而解表邪。此法与《金\n匮·血痹虚劳病脉证》“但以脉自微涩，在寸口、关上小紧，宜针引\n阳气，令脉和，紧去则愈”同理。\n②麻黄汤之烦 为表束而津血卫阳充滞有余\n桂枝汤之烦 为表束而津血卫阳温养不足\n麻黄汤和桂枝汤都会有“烦”，然而病机各异。\n在表束不解之后，麻黄汤之烦为津血卫阳充滞有余之实寒实烦；\n桂枝汤之烦为津血卫阳温养不足之半实（表寒实）半虚（津血虚）\n\n烦。除了本条，桂枝汤之烦还见在以下两条：\n57、伤寒发汗，已解。半日许复烦，脉浮数者，可更发汗，宜桂枝\n汤。\n240、病人烦热，汗出则解，又如疟状，日晡所发热者，属阳明也。\n脉实者，宜下之；脉浮虚者，宜发汗。下之，与大承气汤，发汗，\n宜桂枝汤。\n【原文】26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，\n白虎加人参汤主之。方十三。\n知母六两，石膏一斤，碎，绵裹 甘草二两，炙 粳米六\n合 人参三两\n上五味，以水一斗，煮米熟，汤成，去滓。温服一升，\n日三服。\n【校注】\n《玉函经》：服桂枝汤，大汗出后，大烦渴不解，若脉洪大者，白虎加人\n参汤主之。\n《千金方》：无此条条文，但有方药。\n又方：\n\n知母六两，石膏一斤，碎 甘草二两，炙 人参三两 粳米六合\n上五味，以水一斗，煮米熟，汤成，去滓，温服一升，日三服。立夏后至立\n秋前得用之，立秋后，不可服。春三月，病常苦里冷，白虎汤亦不可与之，与之\n即呕利而腹痛。诸亡血及虚家，亦不可与白虎汤，得之则腹痛而利，但当温之。\n《圣惠方》：无此条。\n《康平本》：服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤\n主之。\n【解析】\n①本为阳明中风 误作太阳中风\n“大汗出”、“大烦渴”、“脉洪大”，这个排比句说明患者未\n服药前的症状就有“汗出”、“烦”、“脉洪”。\n这组症状和桂枝汤证的“汗出”、“烦”、“脉浮”相类（桂枝\n汤证发烦的脉象，在57条是“复烦，脉浮数”；在240条是“烦热...\n脉浮虚”，绝非洪脉），但却是阳明中风，加之六病中风皆有表证之\n共性，医者如果用的是套条文证或方证的方法，就容易陷入误用桂枝\n汤的辛温解表的误区。阳明中风本来需要辛寒解表补津液，误用辛温\n解表就会发大汗。发大汗耗伤津液，“大汗出后，大烦渴不解，脉洪\n大”，阳明热更盛了，需要救逆救火邪（火邪即邪火，即多余的火热；\n而桂枝汤为救邪风，即多余的风寒）。因为表邪未解，还是在阳明中\n风的层面，故而还需要用治阳明中风的白虎加人参汤来救逆。此法与\n\n29条的太阴外证甘草干姜汤证，误用桂枝汤攻表后还需要甘草干姜\n汤救逆之法道理相通。\n②洪脉皆主里之实邪 如里热或里实里结\n除了25条的错简为误写，仲景书中脉洪大只见于里之实邪，或\n为里热或为里实或为里结。\n里热：\n《伤寒论》\n26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主\n之。\n里实里结：\n《金匮·趺蹶手指臂肿转筋阴狐疝蛔虫病脉证治》问曰：病腹痛\n有虫，其脉何以别之？师曰：腹中痛，其脉当沉，若弦，反洪大，故\n有蛔虫。\n【原文】28、服桂枝汤，或下之，仍头项强痛，翕翕发热，\n无汗，心下满微痛，小便不利者，桂枝去桂加茯苓白朮汤主\n之。方十五。\n芍药三两 甘草二两，炙 生姜切 白术 茯苓各三两 大枣\n\n十二枚，擘\n上六味，以水八升，煮取三升，去滓，温服一升，小便\n利则愈。本云：桂枝汤，今去桂枝（无逗号）加茯苓白术。\n【校注】\n《玉函经》：服桂枝汤，或下之，仍头项强痛，翕翕发热，无汗，心下满\n而微痛，小便不利者，桂枝去桂加茯苓白术汤主之。\n《千金方》：服桂枝汤，下之，颈项强痛，翕翕发热，无汗，心下满，微痛，\n小便不利，桂枝去桂加茯苓白术汤主之。方：\n茯苓 白术各三两\n上于桂枝汤中，惟除去桂枝一味，加此二味为汤，服一升，小便即利。本云：\n桂枝汤，今去桂枝，加茯苓、白术。\n《圣惠方》：无此条\n《康平本》：同 27 条合为一条\n【解析】\n28条在学术界一直存在着去桂还是去芍之争，我们遵循清代名\n医吴谦在《医\n宗金鉴》中的观点去芍，即为桂枝去芍药加茯苓白术汤。其实去桂还\n是去芍，可\n以从伤寒经方体系的表里观、四饮观、药症等法度来考量的。\n\n“小便不利”是淡饮，经方的治淡饮的基础方干，常用茯苓白术\n配伍，再\n随表里阴阳治之，在饮病系列方中，有苓术配伍桂枝的，如苓桂术甘\n汤，五苓散\n等；也有苓术配伍芍药的，如真武汤，当归芍药散等。如此则表邪得\n桂枝而解，\n里饮得苓术而解，才能达到表里同治表里同解的功效。\n芍药在经方中是养营血，除血痹的。淡饮是阴邪，会伤阳气，但\n人体的阴阳\n是被津液这个一所涵盖，所以除了伤阳气之外，人体的营血也会跟着\n伤损。真武汤证可以筋惕肉膶，振振欲辟地；当归芍药散的那个水盛\n血亏的腹痛。故而芍药在饮病应用中的规律就是“水饮+营血不利”。\n芍药是通过内达营血来滋养除痹的阴药，相当于阳表来说，这个\n营血的症候当然是偏于阴里的；而桂枝，桂枝是发汗解表温卫升散的\n药，正与芍药相反，是 个阳药，向上向外可以达表。五苓散可以治\n“病在阳，应以汗解之”；苓桂术甘\n\n汤可以治“伤寒...心下逆满，气上冲胸...头眩...身为振振摇者”。\n故而桂枝\n在饮病中的应用规律就是“水饮+表邪不解”。\n28条的症候是“服桂枝汤，或下之”表仍不解。\n“头项强痛,翕翕发热,无汗,”——表证表邪困束的很显著——\n桂枝去芍药\n汤以更好的去解表；\n“心下满,微痛,小便不利,”——里面的淡饮内停导致的症状\n——加茯苓白\n术这个配伍是仲景治淡饮的基础方干。\n这个28条的症候，可以理解成一个装满水的茶壶，要想把里面\n的水倒出来，需要两个条件：\n1、上面的进气孔通畅；\n2、下面的出水口通畅。\n28条有表证表邪困束，外在毛窍闭塞，表束不开，就要发表攻表，\n所以不能再用酸敛的芍药了。所以就要用桂枝汤去芍药，使这个\n\n方子能无有挂碍的发表攻表；这样那个紫砂壶出水的第一个条件\n就具备了；茶壶出水的第二个条件要下窍（溺窍）通畅，故而加\n茯苓白术利小便。如此则表邪得桂枝而解，里饮得苓术而解，才\n能达到表里同治表里同解的功效。\n【原文】29、伤寒，脉浮，自汗出，小便数，心烦，微恶寒，\n脚挛急。反与桂枝，欲攻其表，此误也。得之便厥，咽中干，\n烦躁（无逗号）吐逆者，做甘草干姜汤与之，以复其阳；若\n厥愈足温者，更作芍药甘草汤与之，其脚即伸；若胃气不和，\n谵语者，少与调胃承气汤。若重发汗，复加烧针者，四逆汤\n主之。方十六\n甘草干姜汤方\n甘草四两，炙 干姜二两\n上二味，以水三升，煮取一升五合，去滓。分温再服。\n芍药甘草汤方\n白芍药 甘草炙，各四两\n上二味，以水三升，煮取一升五合，去滓。分温再服。\n\n调胃承气汤方\n大黄四两，去皮，清酒洗 甘草二两，炙 芒硝半升\n上三味，以水三升，煮取一升，去滓，内芒硝，更上火\n微煮令沸，少少温服之。\n四逆汤方\n甘草二两，炙 干姜一两半 附子一枚，生用，去皮，\n破八片\n上三味，以水三升，煮取一升二合，去滓。分温再服。\n强人可大附子一枚、干姜三两。\n【校注】\n《玉函经》：伤寒脉浮，自汗，小便数，颇微恶寒。论曰：心烦微恶寒，两\n脚挛急，反与桂枝汤，欲攻其表，得之便厥，咽干烦躁吐逆，当作甘草干姜汤，\n以复其阳，厥愈足温，更作芍药甘草汤与之，其脚即伸。若胃气不和，谵语，少\n与调胃承气汤。若重发汗，复加烧针者，四逆汤主之。\n《千金方》：伤寒，脉浮，自汗出，小便数，颇复微恶寒，而脚挛急。反与\n桂枝，欲攻其表，得之便厥，咽干，烦躁，吐逆，当作甘草干姜汤，以复其阳。\n厥愈足温，更作芍药甘草汤与之，其脚即伸。而胃气不和，可与承气汤；重发汗，\n复加烧针者，四逆汤主之。\n《圣惠方》：无此条\n\n《康平本》：伤寒脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，反与桂\n枝汤，欲攻其表，此误也。得之便厥，咽中干燥，吐逆者，作甘草干姜汤与之。\n若厥愈，足温者，更作芍药甘草汤与之，以复其阳。若胃气不和，谵语者，小与\n调胃承气汤。若重发汗，复加烧针，得之者，回逆汤主之。\n【解析】\n伤寒证是不会自汗出的，这里用伤寒这个称谓是因为这组症候群\n中的脉浮，恶寒，发烦，肢体拘挛甚至拘痛这组症状给人的第一感觉\n像是太阳伤寒的表现。但是医者已经注意到还伴有自汗出的症状了，\n所以知道这不是伤寒证。而如果只注意到汗的问题而弗顾其它并不是\n真正的“用思精”者。所以只是看到表证+自汗=中风这一层面就认为\n这是太阳中风证了，而用了桂枝汤（阳旦汤）去解表证攻邪风。\n在这里，医者忽略了患者还有另外一个非常重要的症状——小便\n数，故而差之毫厘谬以千里！所以我们在临床中采集四诊资料一定要\n做到无微不至，细致入微才行！绝不放过一丝一毫症候症状，绝不预\n设一丝一毫病机方药；未辨之前不立一法，即辨之后不留一法！要做\n经方的微雕大师，绝不能做暴虎冯河之辈，亦或偶有一中，则昂头戴\n面，不知涉境之险也！\n汗之与溺，同为津液之去路也，故伤寒大法——自汗必审小便症\n状：\n\n桂枝汤症候群：脉浮缓或浮数或浮弱，发热恶风寒，自汗出，头\n痛身痛，小便基本正常。\n桂枝汤证病机：表上津液丢失+营卫不和+邪风气逆。\n桂枝加黄芪汤症候群：脉浮微或浮涩（据黄芪桂枝五物汤条补入），\n微发热恶风或身冷，劳汗出，身疼重或肿，小便不利。\n桂枝加黄芪汤证病机：表上津液丢失+卫气亏虚+邪风虚热+水饮\n血痹+风水黄汗。\n桂枝加附子汤症候群：脉浮虚而涩(据桂枝附子汤条补入)，恶风，\n汗漏不止，四肢微急难以屈伸，小便难。\n桂枝加附子汤证病机：表上津液丢失+卫阳亏虚+温煦不及。\n甘草干姜汤症候群：脉浮大（据30条补入），微恶寒或微热，\n自汗出，脚挛急，小便数。\n甘草干姜汤证病机：表上津液丢失+胃虚寒+中不制下。\n29条的“自汗出，小便数，心烦，微恶寒，脚挛急”是由于胃\n虚冷中不制下而引起的太阴病外证，脉虽浮但是要大而中空或者浮虚\n的。本来就是里虚寒而津虚液少血弱了，应该用甘草干姜汤去温里煦\n表而补津液，再去用发散攻表的桂枝汤就会导致阳气不足津液虚冷而\n四肢厥逆的。津液丢失多了濡润不及还会咽中干、烦躁；胃虚重了中\n不制下，下焦的浊饮浊气上逆就会呕逆。这时的救逆，还得用甘草干\n\n姜汤，因为误治后的这组症状还没有跑出太阴外证的范畴。甘草干姜\n汤用四两甘草，二两干姜，四两甘草是仲圣急补津液的常用量，当津\n液亏损，还达不到少阴病的层面时，多用四两甘草来急补津液以复其\n阳，代表方就是这个甘草干姜汤；甘草甘能补益、甘能缓和、甘能治\n饮，可补津液、益胃气、缓急迫；干姜温胃中虚冷而治里虚寒为太阴\n里证之正药，甘草倍于干姜，说明此方即是以甘补甘缓甘益为主而性\n偏温；配伍起来的甘草干姜汤即可以通过恢复胃气而补益津液。胃不\n虚冷了，阳气恢复，中能制下了自然就不吐逆了，小便也就不数了，\n也不恶寒自汗了，津液上承了咽中自然也不干了，津液得以充养也就\n不烦躁了，脚也不会挛急了。如果这时候见到咽中干而去用生地、芩\n连之类去治疗，那胃就更虚寒了，阳气不复，津液也就不会生，病情\n就会进一步加重，甚成为坏病！这就是学伤寒的妙处，仲圣总是教我\n们用最高法则，用病机去统摄诸法，而不是单纯的以药对病和见山是\n山。\n所以讲到这里大家就会明白，这个“复其阳”的实质就是去恢复\n津液，恢复津液的温煦、濡养作用。甘草干姜汤作为方根还可见于四\n逆汤、甘姜苓术汤、生姜甘草汤、甘草泻心汤、理中汤、小青龙汤等\n方。\n经方之法，津液为本。仲圣是在津液的基础上来阐释阴阳的,所\n\n以津液既不单纯是阳气（津)，也不单纯是阴液（血）。在仲圣体系\n中，津液既含有阳气和阳的概念 也含有阴血和阴的概念，是为伤寒\n论最独特的概念。\n表：曰卫 曰阳 曰气\n津液\n里：曰营（荣） 曰阴 曰血\n可见津液本为一体，只是在不同的部位，叫做不同的称谓而已。\n而它们之间是可以互根互用、相互转换的。譬如同为人民军队，在地\n方驻防的时候叫地方部队，军民鱼水拥军爱民（荣）；在边防的时候\n叫边防军，保家卫国抵御外侮（卫）；而同样都是人民军队，内涵是\n一样的。但由于在不同的部位能发挥不同的作用，所以它们会有不同\n的称谓，而它们是根源一致、作用交互、相互交换的。这就比如说，\n边防发生战乱了，边防军需要从地方上抽调地方部队去补充兵源（营\n液补充卫津）；地方发生动乱了，边防军也可以撤回来维持治安（卫\n津补充营液）。\n这个津液的概念体系，不同于任何前人之说，而本蕴于伤寒书中，\n请大家熟记于心，以之校读仲圣之书，每可言下顿悟。\n29条，就没有离开甘草这个药，为什么？津液在表的，既要解\n表，又要补充津液的，用桂枝汤；津液寒而虚，既需要救津液又虚寒\n\n的，加个干姜，甘草干姜汤嘛。那么，津液偏阳的气的恢复以后，津\n液偏阴的一面相对来说更不足了，然后就用芍药甘草汤。芍药甘草汤\n用下去以后，津液恢复了嘛，津液恢复了以后，虚寒的一面，因为它\n毕竟经过桂枝攻表，丧失了一部分了，会出来四逆汤证，阳气不能去\n温煦了，不能去防御了，这个阳气不足的现象又会出来，还是得用甘\n草为主，加上附子就行了。然后这个时候，阳气回了，胃家受不了了，\n本来里面津液就亏了，又给用过附子、干姜这类燥热药，胃中燥烦满\n都会有，轻微的实，并不是真正的实，真正的实不会用调胃承气汤。\n这种情况，少与调胃承气汤。有可能一付药，喝几勺就行了。这个病\n人就好了。\n那么，你会发现，这几个方子，都是以甘草为主的，调胃的基础\n在哪里？在甘草。甘草干姜汤、太阴外证的基础在哪里？甘草。芍药\n甘草汤养津液怎么养？甘草。四逆汤的津液怎么补的？附子配甘草，\n一直是用甘草这个主线在转，这就是推一及十的读经方法。\n接着解条文，29条中接下来的部分，由于是 30条的简略版，有\n很多过程和细节体现在30条中并且前后呼应密不可分，所以我们把\n它放在30条中一并解析。\n\n【原文】30、问曰：证象阳旦，按法治之而增剧，厥逆，咽\n中干，两胫拘急而谵语。师曰：言夜半手足当温，两脚当伸，\n后如师言。何以知此？答曰：寸口脉浮而大。浮为风，大为\n虚，风则生微热，虚则两胫挛，病形象桂枝，因加附子参其\n间，增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦\n燥，阳明内结，谵语烦乱，更饮甘草干姜汤。夜半阳气还，\n两足当热，胫尚微拘急，重与芍药甘草汤，尔乃胫伸。以承\n气汤微溏，则止其谵语，故知病可愈。\n【校注】\n《玉函经》：问曰：证象阳旦，按法治之而增剧，厥逆，咽中干，两胫拘急\n而谵语，师言夜半手足当温，两脚当伸，后如师言，何以知之？答曰：寸口脉浮\n而大，浮即为风，大即为虚，风则生微热，虚则两胫挛，其形象桂枝，因加附子\n于其间，增桂令汗出，附子温经，亡阳故也。厥逆咽中干，烦躁，阳明内结，谵\n语烦乱，更饮甘草干姜汤，夜半阳气还，两足当热，胫尚微拘急，与芍药甘草汤，\n尔乃胫伸，与承气汤微溏，止其谵语，故知其病可愈。\n《千金方》：未见\n《圣惠方》：无此条\n《康平本》：问曰：证象阳旦，按法治之而增剧，厥逆，咽中干燥，两胫拘\n急而谵语。师曰：言夜半手足当温，两脚当伸，后如师言，何以知之？答曰：寸\n\n口脉浮而大，大为虚，风则生微热，虚则两胫挛。病形象桂枝，因加附子参其间，\n增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦躁，阳明内结，谵语，烦\n乱，更饮甘草干姜汤。夜半阳气还，两足当热，胫尚微拘急，重与芍药甘草汤，\n尔乃胫伸，以承气汤微溏，则止其谵语，故知病可愈。\n【解析】\n这一条，完全是解释和补充29条的，增补描述了29条中省略\n而未叙述的那一部分治法和过程。这些条文是伤寒书中不可多得的可\n以直白得窥仲圣学术思维和临证轨迹的记录，并且可以得知仲圣当时\n的教学活动也是边做临床边做学术的，和现在脱离临床做学术的中医\n教育大有不同：\n因为29条是太阴外证，症候群像是阳旦汤（即桂枝汤）证，用\n桂枝汤去发汗反而加重了病情，引起了很多症候群，或四肢厥逆，或\n咽中干，或胫脚挛急，或谵语，学生去请教老师该怎样救逆，老师就\n让“作甘草干姜汤与之”，并且说服药后阳气恢复，手足就会热起来，\n厥逆就会好的。“师曰：言夜半手足当温，两脚当伸。后如师言。”\n经过验证，果然不出老师所料。学生就问老师道理所在，老师就\n说：第一个阶段：“作甘草干姜汤与之，以复其阳”。此病的寸口脉\n虽浮但是大而中空，浮虽然一般规律上是邪风在表的表病，但是“脉\n大为劳”（《金匮》），浮大中空的脉是里极虚的表现。津液亏虚也\n\n可以产生微风微热的表现（轻的比如太阴中风的邪风虚热，重的就是\n太阴外证，继续加重就会向少阴或厥阴经传如亡阳戴阳三阴合病等），\n还会出现肢体拘挛的表现。病看起来有些像桂枝汤证，而用了桂枝汤\n后导致了厥逆，咽中干，烦躁（接29条）“吐逆者，做甘草干姜汤\n与之，以复其阳”。胃气和阳气恢复了后，手足都暖了，这是第一次\n救逆成功。但是由于本来有微热，再加上服用温药的作用，表上的津\n液也会被热耗失，就会“两胫拘急”的，这个时候，就用芍药甘草汤，\n四两甘草急补津液，配伍缓拘挛的芍药去补津缓急，“重与芍药甘草\n汤，尔乃胫伸”（与29条“若厥愈足温者，更作芍药甘草汤与之，\n其脚即伸”说的是同一件事情）；\n第二个阶段：“增桂令汗出”。这其实是第二次误治，就是在第\n一次用甘草干姜汤复阳厥愈足温后，医者看到还有些脚挛急，但是没\n有用芍药甘草汤，而是在芍药甘草汤中增加了桂枝。这就还是阳旦汤\n的法则了，而恰恰是由于增加了桂枝会发汗的，所以条文说这是“重\n发汗”，说明这是第二次误汗导致了亡阳。\n第三个阶段：“附子温经，亡阳故也”。经过第二次的误治误汗\n“重发汗”或者“复加烧针者”，病已由太阴外证传变为少阴亡阳证\n了，会厥逆的更厉害，烦躁的也更重，那么再用甘草干姜汤就照顾不\n周全了，所以就 “因加附子参其间”。甘草干姜汤加上附子那正好\n\n就是四逆汤，故而29条有个“四逆汤主之”的提法。\n第四阶段：“若胃气不和，谵语者，少与调胃承气汤”。患者本\n有津虚生微热的底子在那里，经过这一番惊心动魄的误治和救逆的过\n程，阳气是固护住了，但是这一番温药入胃又导致了内里的津液耗失\n和热生，产生了“胃气不和”、“阳明内结”的病机，有了“谵语烦\n乱”的症状。这个时候，需要“少与调胃承气汤”，“以承气汤微溏，\n则止其谵语”。注意是“少与”，即所谓的“峻药轻投”法，少少的\n喝几勺调胃承气汤，微和胃气，轻轻的解决一下阳明的内结而不致于\n再伤阳气，“故知病可愈”。\n此两条大有内涵，亦是伤寒经方体系病传观理法的集中体现，可\n谓一以贯之法度森严。\n其后如《伤寒论》100条（伤寒，阳脉涩，阴脉弦，法当腹中急\n痛，先与小建中汤，不差者，小柴胡汤主之。）和金匮四饮中的“青\n龙汤下已”至“苓甘五味姜辛夏杏大黄汤”等条文亦是受此条津液观\n阴阳观理法所统摄的病传条文，但层面都没有此条丰满，所以此条为\n伤寒论中灵魂级“病传观”条文。\n\n附：甘草干姜汤之《金匮》、《外台》条文：\n《金匮要略·肺痿肺痈咳嗽上气病脉证治》：\n肺痿吐涎沫而不咳者，其人不渴，必遗尿，小便数，所以然者，\n以上虚不能制下故也。此为肺中冷，必眩，多涎唾，甘草干姜汤以温\n之。若服汤已渴者，属消渴。\n《外台》：32、疗肺痿吐涎唾“不咳者,其人不渴，必遗尿，小便\n数,所以然者，以上虚不能制偃下故也。此为冷。必眩,甘草干姜汤主\n之，以温其脏方。\n甘草四两,炙 干姜二两\n右二味，切，以水三升，煮取一升半，分温二服，服汤已，小温\n覆之。若渴者，属消渴。忌海藻、菘菜。\n（1）涎唾：《千金方》卷十七第六、《金匮要略》卷上第七并作“涎\n沫”，且下有“而”字。\n（2）制偃：程本、《千金方》，《金匮要略》“制”下并无“偃”\n字。\n（3）为冷: 程本“为”上有“肺”字，(金匮要略》、《千金方》\n并作“肺中冷”。\n\n临床医案解伤寒五期第八课\n（2017 年 9 月 1 日）\n【原文】23、太阳病，得之八九日，如疟状，发热恶寒，热\n多寒少，其人不呕，清便欲自可，一日二三度发。脉微缓者，\n为欲愈也；脉微而恶寒者，此阴阳俱虚，不可更发汗、更下、\n更吐也；面色反有热色者，未欲解也，以其不能得小汗出，\n身必痒，宜桂枝麻黄各半汤。\n桂枝一两十六铢，去皮 芍药 生姜切 甘草炙 麻黄\n去节，各一两 大枣四枚，擘 杏仁二十四枚，汤浸，去皮\n尖及两仁者\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，\n煮取一升八合，去滓。温服六合。本云：桂枝汤三合，麻黄\n汤三合，并为六合，顿服，将息如上法。臣亿等谨按，桂枝\n汤方：桂枝、芍药、生姜各三两，甘草二两，大枣十二枚。\n麻黄汤方：麻黄三两，桂枝二两，甘草一两，杏仁七十个。\n今以算法约之，二汤各取三分之一，即得桂枝一两十六铢，\n\n芍药、生姜、甘草各一两，大枣四枚，杏仁二十三个零三分\n枚之一，收之得二十四个，合方。详此方乃三分之一，非各\n半也，宜云合半汤。\n【校注】\n《玉函经》：太阳病，得之八九日，如疟状，发热而恶寒，热多而寒少，其\n人不呕，清便自调，日二三发，脉微缓者为欲愈。脉微而恶寒，此阴阳俱虚，不\n可复吐下发汗也，面色反有热色者，为未欲解，以其不能得小汗出，身必当痒，\n桂枝麻黄各半汤主之。\n《千金方》：太阳病，得之八九日，如疟，发热而恶寒，热多而寒少，其人\n不呕，清便欲自可，一日再三发，其脉微缓者，为欲愈。脉微而恶寒者，此为阴\n阳俱虚，不可复吐下、发汗也。面色反有热者，为未欲解，以其不能得汗出，身\n必当痒，桂枝麻黄各半汤主之。\n桂枝一两十六铢 芍药 生姜切 甘草炙 麻黄去节，各一两 大枣四枚，\n擘 杏仁二十四枚，去皮尖，两仁者\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取一升八合，去\n滓，温服六合。本云：桂枝汤三合，麻黄汤三合，并为六合，顿服。\n《圣惠方》：无此条。\n《康平本》：大阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不\n呕，清便欲自可，一日二三度发。注脉微缓者，为欲愈也；脉微而恶寒者，此阴\n阳俱虚，不可更发汗、更下、更吐也；面色反有热色者，未欲解也。经以其不能\n得小汗出，身必痒，宜桂枝麻黄各半汤。\n\n桂枝一两十六铢 芍药 生姜切 甘草炙 麻黄去节，各一两 大枣擘，四\n枚 杏仁汤浸去皮尖及两仁者，二十四枚\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取一升八合，去\n滓，温服六合。注本云：桂枝汤三合，麻黄汤三合，并为六合，顿服例将息如上\n法。\n【原文】25、服桂枝汤，大汗出，脉洪大者，与桂枝汤，如\n前法，若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一\n汤。方十二。\n桂枝一两十七铢，去皮 芍药一两六铢 麻黄十六铢，\n去节 生姜一两六铢，切 杏仁十六个，去皮尖 甘草\n一两二铢，炙 大枣五枚，擘\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，\n煮取二升，去滓，温服一升，日再服。本云：桂枝汤二分，\n麻黄汤一分，合为二升，分再服。今合为一方。将息如前法。\n臣亿等谨按：桂枝汤方，桂枝、芍药、生姜各三两，甘草二\n两，大枣十二枚。麻黄汤方，麻黄三两，桂枝二两，甘草一\n两，杏仁七十个。今以算法约之∶桂枝汤取十二分之五，即\n\n得桂枝、芍药、生姜各一两六铢，甘草二十铢，大枣五枚。\n麻黄汤取九分之二，即得麻黄十六铢，桂枝十铢三分铢之二，\n收之得十一铢，甘草五铢三分铢之一，收之得六铢，杏仁十\n五个九分枚之四，收之得十六个。二汤所取相合，即共得桂\n枝一两十七铢，麻黄十六铢，生姜芍药各一两六铢，甘草一\n两二铢，大枣五枚，杏仁十六个，合方。\n【校注】\n《玉函经》：服桂枝汤大汗出，若脉但洪大者，与桂枝汤，若其形如疟，\n一日再发，汗出便解，宜桂枝二麻黄一汤。\n《千金方》：服桂枝汤，大汗出，若脉洪大，与桂枝汤。其形如疟，一日再\n发，汗出便解，宜桂枝二麻黄一汤方。\n桂枝一两十七铢，去皮 麻黄十六铢 生姜切 芍药各一两六铢 甘草一两二铢，\n炙 大枣五枚，擘 杏仁十六枚，去皮尖，两仁者\n上七味，以水七升，煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，温\n服一升，日再服。本云：桂枝汤二分，麻黄汤一分，合为二升，分二服。今合为\n一方。\n《圣惠方》：无此条。\n《康平本》：服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法，若形如疟，\n一日再发者，汗出必解，宜桂枝二麻黄一汤。\n桂枝一两十六铢，去皮 芍药一两六铢 麻黄去节 十六铢 生姜切 一两十\n\n六铢 杏仁去皮尖 十六株 甘草炙 一两二铢 大枣擘 五枚\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，\n温服一升，日再服。注本云：桂枝汤二分，麻黄汤一分，合为二升，分再服。今\n合为方。例将息如上法。\n【原文】27、太阳病，发热恶寒，热多寒少，脉微弱者，此\n无阳也，不可发汗。宜桂枝二越婢一汤。方十四。\n桂枝去皮 芍药 麻黄 甘草炙，各十八铢 大枣四枚，\n擘 生姜一两二铢，切 石膏二十四铢，碎，绵裹\n上七味，以水五升，煮麻黄一二沸，去上沫，内诸药，\n煮取二升，去滓，温服一升。本云：当裁为越婢汤、桂枝汤，\n合之饮一升；今合为一方，桂枝汤二分、越婢汤一分。\n臣亿等谨按：桂枝汤方：桂枝、芍药、生姜各三两，甘\n草二两，大枣十二枚。越婢汤方：麻黄三两，生姜三两，甘\n草二两，石膏半斤，大枣十五枚。今以算法约之，桂枝汤取\n四分之一，即得桂枝、芍药、生姜各十八铢，甘草十二铢，\n大枣三枚。越婢汤取八分之一，即得麻黄十八铢、生姜九铢，\n甘草六铢、石膏二十四铢，大枣一枚八分之七，弃之。二汤\n\n所取相合，即共得桂枝、芍药、甘草、麻黄各十八铢，生姜\n一两三铢，石膏二十四铢，大枣四枚，合方。旧云：桂枝三，\n今取四分之一，即当云桂枝二也。越婢汤方，见仲景杂方中。\n《外台秘要》一云：起脾汤。\n【校注】\n《玉函经》：太阳病，发热而恶寒，热多寒少，脉微弱者，此无阳也，不\n可复发其汗，宜桂枝二越婢一汤。\n《千金方》：太阳病，发热恶寒，热多寒少，脉微弱，则无阳也，不可发汗，\n桂枝二越婢一汤方主之。方：\n桂枝 芍药 甘草炙 麻黄去节，各十八铢 生姜一两三铢，切 石膏二十四\n铢，碎 大枣四枚，擘\n上七味，以水五升，先煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，\n温服一升。本云：当裁为越婢汤，桂枝合之，饮一升，今合为一方，桂枝汤二分。\n《圣惠方》：无此条。\n《康平本》：大阳病，发热恶寒，热多寒少，脉微弱者，（“此无阳也”原\n文写在“脉微弱者”下方），不可大发汗，宜桂枝二越婢一汤。服桂枝汤，或下\n之，仍头项强痛，翕翕发热，无汗，心下满，微痛，小便不利者，桂枝去桂加茯\n苓白术汤主之。\n桂枝二越婢一汤\n桂枝去皮 芍药 麻黄 甘草炙，各十八铢 大枣擘，四枚 生姜切，一两二\n铢 石膏擘，绵裹，二十四铢\n\n上七味，以水五升，煮麻黄一二沸，去上沫，内诸药，煮取二升，去滓，温\n服一升。注：本云：当裁为越婢汤、桂枝汤，合之饮一升，今合为一方，桂枝汤\n二分，越婢汤一分。\n桂枝去桂加茯苓白术汤\n芍药三两 甘草炙，二两 生姜切 白术 茯苓各三两 大枣擘，十二枚\n上六味，以水八升，煮取三升，去滓，温服一升。小便利则愈。注：本云：\n桂枝汤，今去桂枝加茯苓、白术。\n【解析】\n23、25、27 条三条连解\n23、25、27条，本为太阳病桂枝汤与麻黄汤合方合法、变方变\n法之一系列法度条文，但是因为存在着严重的错简及误读，所以在伤\n寒学术界长期以来含混不清难以解析，影响了伤寒经方体系的圆融以\n及续命法的复原，笔者经过考据整理，复原如下：\n宋本原文：\n23、太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，\n圊便欲自可，一日二三度发。脉微缓者，为欲愈也，脉微而恶寒者，\n此阴阳俱虚，不可更发汗、更下、更吐也。面色反有热色者，未欲解\n也，以其不能得小汗出，身必痒，宜桂枝麻黄各半汤。\n25、服桂枝汤，大汗出，脉洪大者，与桂技汤，如前法（蹿入衍文）。\n\n若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一汤。\n27、太阳病，发热恶寒，热多寒少，脉微弱者，此无阳也，不可发汗，\n宜桂枝二越婢一汤。\n①26 条蹿入25 条之错简\n25、服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法，若形似疟，\n一日再发者，汗出必解，宜桂枝二麻黄一汤。脉微缓者，为欲愈也\n26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主\n之。\n25条的“服桂枝汤，大汗出，脉洪大者，与桂枝汤，如前法”\n和26条“服桂枝汤，大汗出后，大烦渴不解，脉洪大者”本为26条\n一段文字，故此段为蹿入25条中重出者。\n即去掉衍文的25条条文如下：\n25、若形似疟，一日再发者，汗出必解，宜桂枝二麻黄一汤。\n②错简整合后读法\n<1>23条与25条错简整合后读法：\n太阳病，得之八九日，如疟状（若形似疟），发热恶寒，热多寒\n少，其人不呕，圊便欲自可，一日二三度发（一日再发者，汗出必解），\n宜桂枝二麻黄一汤，脉微缓者，为欲愈也。\n\n<2>23条与27条错简整合后读法：\n脉微而恶寒者（太阳病，发热恶寒，热多寒少，脉微弱者），此\n阴阳俱虚（此无阳也），不可更发汗、更下、更吐也，宜桂枝二越婢\n一汤。\n<3>面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂\n枝麻黄各半汤。\n③错简整合后解法\n<1>23条与25条错简整合后读法：\n太阳病，得之八九日，如疟状（若形似疟），发热恶寒，热多寒\n少，其人不呕，圊便欲自可，一日二三度发（一日再发者，汗出必解）。\n宜桂枝二麻黄一汤。脉微缓者，为欲愈也。\n解：太阳病，八九日当传变，但是不呕、二便正常，正如56条\n所言“小便清者知不在里仍在表也”；所以这种传变就没到少阳或阳\n明这样的里位，还是在表上，由于缠绵日久，津液抗邪外出，而邪势\n已减津液亦伤的营卫不和证，所以虽然发热恶寒，但是以发热为主，\n恶寒轻微，和典型太阳病表邪重的发热恶寒并重不同；营卫不和则往\n往有往来之证，故寒热如疟，一日两三度发作；所以就用两份桂枝汤\n去和解营卫，用一份麻黄汤去发散表上寒邪；那么这个脉象，就会兼\n有桂枝汤和麻黄汤两方的特点，桂枝汤是脉阳浮阴弱，麻黄汤是脉浮\n\n紧，那么综合起来，桂二麻一汤的脉就会是阳浮紧而阴微弱，浮取浮\n紧，沉取又微弱不足而又以阴微弱为主，因为表上有寒邪的困束也；\n要是表上的寒邪解了，紧就去了，邪气去了，只要津液恢复就会病解\n的，所以剩下这个脉也会从微弱变得缓和起来，注意，脉微缓者，是\n脉从“阴微弱”变成了“阴缓和”，（所以下文还会说“脉微而恶寒\n者”这个微是一个基础脉，变缓和始为不传），紧者，躁动之脉，缓\n者，安静之脉，“脉若静为不传也”，所以只要津液自和就会痊愈。\n<2>23条与27条错简整合后解法：\n脉微而恶寒者（太阳病，发热恶寒，热多寒少，脉微弱者），此\n阴阳俱虚（此无阳也），不可更发汗、更下、更吐也，宜桂枝二越婢\n一汤。\n解：上段桂二麻一汤是脉阳浮紧而阴微弱，表上有寒邪与阳津的\n凝滞，故用两份桂枝汤补津液和营卫，用一份麻黄汤散风寒发邪汗；\n而到了本证是脉微弱，没有了那个紧，也就是表上的寒邪已经入里化\n热了但是表还不了了，而且津液还不足，营卫还不和。\n这种情况，表不解而不可汗，虽入里而不可吐下，所以就用两份\n桂枝汤补津液和营卫，用一份越婢汤微清里热微解表束。\n无阳——表上卫阳津液凝滞失去温煦防御功能；阴阳俱虚——卫\n阳和营阴都不足，表上不能温煦防御，里面不能营养濡润。\n\n<3>面色反有热色者，未欲解也，以其不能得小汗出，身必痒，宜桂\n枝麻黄各半汤。\n解：本证的脉象，也是兼有桂枝汤和麻黄汤两方的特点，阳浮紧\n而阴微弱，浮取浮紧，沉取又微弱不足而又以浮取浮紧为主，正好和\n桂二越一汤相对应。表证也比桂二越一汤重一些，也就是阳气重故也\n（46条麻黄汤），所以会有麻黄汤阳气重的一些表现，典型的麻黄\n汤证都可以发烦目瞑，这个轻一些，但也会面有热色的。阴弱还有桂\n枝汤的津液不足，津液既不足又要向表上充盈，风邪寒邪各自为疟，\n充盈重了会身痛的，这是风寒两感证，既充盈又达不到那种张力和程\n度，所以疼痛不起来，就会有身痒的症状。故而用一份桂枝汤和一份\n麻黄汤各取其半双解风寒，既补津液而又散津液以解身痒等表证。\n④三方解表强度比较\n桂二麻一汤芍药倍于麻黄，制约发散；\n桂麻各半汤芍药等量麻黄，发表略强。\n桂二越一汤芍药等量麻黄，又有重于麻黄一倍半量的石膏，发表\n作用最弱。解表强度：桂枝麻黄各半汤＞桂枝二麻黄一汤＞桂枝\n二越婢一汤。\n\n⑤三方剂量\n桂麻各半汤\n桂枝10 生白芍6 炙甘草6 生姜6 大枣8 麻黄6 杏仁8\n桂二麻一汤\n桂枝10 生白芍8 炙甘草6 生姜9 大枣10 麻黄4 杏仁6\n桂二越一汤\n桂枝4 生白芍4 炙甘草4 生姜6 大枣9 麻黄4 生石膏 6\n⑥此三方为续命类方之滥觞\n此三方解决了伤寒体系中风寒两感的治法，即中风证兼有轻微风\n寒两感者，只要麻黄法（发表津血水法）小于桂枝法（补津血水而发\n表法），既可用在有汗出的情况下。\n这也是续命类方之滥觞与重要方干，其组成也被包含于大多数续\n命类方中。\n经过此法度的延伸，在中风病中，勿论有汗无汗，只要表上有风\n寒邪气困束，就会用此类方干去解表邪救邪风。\n【原文】24、太阳病，初服桂枝汤，反烦不解者，先刺风池、\n风府，却与桂枝汤则愈。\n\n【校注】\n《玉函经》：太阳病，初服桂枝汤，反烦不解者，当先刺风池、风府，却\n与桂枝汤即愈。\n《千金方》：太阳病，初服桂枝汤，而反烦不解者，当先刺风池、风府，\n乃却与桂枝汤则愈。\n《圣惠方》：太阳病服桂枝汤烦热不解者。当先针风池风府穴。乃与桂枝\n汤即愈。\n《康平本》：大阳病，初服桂枝汤，反烦不解者，先刺风池、风府，却与\n桂枝汤则愈。\n【解析】\n这一条，有两个需要掌握的知识点，\n①桂枝救表 针引阳气\n在12条桂枝汤方后我们看到的法度是“服一剂尽，病证犹在者，\n更作服。若汗不出，乃服至二三剂”，而本条又提出了可以配合针刺\n的治疗方案。也就是说桂枝证服药一剂不解者，按照汤液派本来的做\n法应该是再连续服第二剂和第三剂桂枝汤的。\n如若医者、患者畏惧药量过重；或仓促间药物尚未煎备等因素影\n响；也可以用针刺风池、风府的方法来代替桂枝汤发汗解表，即扁鹊\n所谓“在肌肤，针石之所及也”（《扁鹊见蔡桓公》）。但此针刺法\n只能替代桂枝汤的发汗解表作用，而不能代替其补津液养血脉的作用。\n\n故而后续还需要服用桂枝汤来补津液养血脉而解表邪。此法与《金\n匮·血痹虚劳病脉证》“但以脉自微涩，在寸口、关上小紧，宜针引\n阳气，令脉和，紧去则愈”同理。\n②麻黄汤之烦 为表束而津血卫阳充滞有余\n桂枝汤之烦 为表束而津血卫阳温养不足\n麻黄汤和桂枝汤都会有“烦”，然而病机各异。\n在表束不解之后，麻黄汤之烦为津血卫阳充滞有余之实寒实烦；\n桂枝汤之烦为津血卫阳温养不足之半实（表寒实）半虚（津血虚）\n烦。除了本条，桂枝汤之烦还见在以下两条：\n57、伤寒发汗，已解。半日许复烦，脉浮数者，可更发汗，宜桂枝\n汤。\n240、病人烦热，汗出则解，又如疟状，日晡所发热者，属阳明也。\n脉实者，宜下之；脉浮虚者，宜发汗。下之，与大承气汤，发汗，\n宜桂枝汤。\n【原文】26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，\n白虎加人参汤主之。方十三。\n知母六两，石膏一斤，碎，绵裹 甘草二两，炙 粳米六\n\n合 人参三两\n上五味，以水一斗，煮米熟，汤成，去滓。温服一升，\n日三服。\n【校注】\n《玉函经》：服桂枝汤，大汗出后，大烦渴不解，若脉洪大者，白虎加人\n参汤主之。\n《千金方》：无此条条文，但有方药。\n又方：\n知母六两，石膏一斤，碎 甘草二两，炙 人参三两 粳米六合\n上五味，以水一斗，煮米熟，汤成，去滓，温服一升，日三服。立夏后至立\n秋前得用之，立秋后，不可服。春三月，病常苦里冷，白虎汤亦不可与之，与之\n即呕利而腹痛。诸亡血及虚家，亦不可与白虎汤，得之则腹痛而利，但当温之。\n《圣惠方》：无此条。\n《康平本》：服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤\n主之。\n【解析】\n①本为阳明中风 误作太阳中风\n“大汗出”、“大烦渴”、“脉洪大”，这个排比句说明患者未\n服药前的症状就有“汗出”、“烦”、“脉洪”。\n这组症状和桂枝汤证的“汗出”、“烦”、“脉浮”相类（桂枝\n\n汤证发烦的脉象，在57条是“复烦，脉浮数”；在240条是“烦热...\n脉浮虚”，绝非洪脉），但却是阳明中风，加之六病中风皆有表证之\n共性，医者如果用的是套条文证或方证的方法，就容易陷入误用桂枝\n汤的辛温解表的误区。阳明中风本来需要辛寒解表补津液，误用辛温\n解表就会发大汗。发大汗耗伤津液，“大汗出后，大烦渴不解，脉洪\n大”，阳明热更盛了，需要救逆救火邪（火邪即邪火，即多余的火热；\n而桂枝汤为救邪风，即多余的风寒）。因为表邪未解，还是在阳明中\n风的层面，故而还需要用治阳明中风的白虎加人参汤来救逆。此法与\n29条的太阴外证甘草干姜汤证，误用桂枝汤攻表后还需要甘草干姜\n汤救逆之法道理相通。\n②洪脉皆主里之实邪 如里热或里实里结\n除了25条的错简为误写，仲景书中脉洪大只见于里之实邪，或\n为里热或为里实或为里结。\n里热：\n《伤寒论》\n26、服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主\n之。\n里实里结：\n《金匮·趺蹶手指臂肿转筋阴狐疝蛔虫病脉证治》问曰：病腹痛\n\n有虫，其脉何以别之？师曰：腹中痛，其脉当沉，若弦，反洪大，故\n有蛔虫。\n【原文】28、服桂枝汤，或下之，仍头项强痛，翕翕发热，\n无汗，心下满微痛，小便不利者，桂枝去桂加茯苓白朮汤主\n之。方十五。\n芍药三两 甘草二两，炙 生姜切 白术 茯苓各三两 大枣\n十二枚，擘\n上六味，以水八升，煮取三升，去滓，温服一升，小便\n利则愈。本云：桂枝汤，今去桂枝（无逗号）加茯苓白术。\n【校注】\n《玉函经》：服桂枝汤，或下之，仍头项强痛，翕翕发热，无汗，心下满\n而微痛，小便不利者，桂枝去桂加茯苓白术汤主之。\n《千金方》：服桂枝汤，下之，颈项强痛，翕翕发热，无汗，心下满，微痛，\n小便不利，桂枝去桂加茯苓白术汤主之。方：\n茯苓 白术各三两\n上于桂枝汤中，惟除去桂枝一味，加此二味为汤，服一升，小便即利。本云：\n桂枝汤，今去桂枝，加茯苓、白术。\n\n《圣惠方》：无此条\n《康平本》：同 27 条合为一条\n【解析】\n28条在学术界一直存在着去桂还是去芍之争，我们遵循清代名\n医吴谦在《医\n宗金鉴》中的观点去芍，即为桂枝去芍药加茯苓白术汤。其实去桂还\n是去芍，可\n以从伤寒经方体系的表里观、四饮观、药症等法度来考量的。\n“小便不利”是淡饮，经方的治淡饮的基础方干，常用茯苓白术\n配伍，再\n随表里阴阳治之，在饮病系列方中，有苓术配伍桂枝的，如苓桂术甘\n汤，五苓散\n等；也有苓术配伍芍药的，如真武汤，当归芍药散等。如此则表邪得\n桂枝而解，\n里饮得苓术而解，才能达到表里同治表里同解的功效。\n芍药在经方中是养营血，除血痹的。淡饮是阴邪，会伤阳气，但\n人体的阴阳\n\n是被津液这个一所涵盖，所以除了伤阳气之外，人体的营血也会跟着\n伤损。真武汤证可以筋惕肉膶，振振欲辟地；当归芍药散的那个水盛\n血亏的腹痛。故而芍药在饮病应用中的规律就是“水饮+营血不利”。\n芍药是通过内达营血来滋养除痹的阴药，相当于阳表来说，这个\n营血的症候当然是偏于阴里的；而桂枝，桂枝是发汗解表温卫升散的\n药，正与芍药相反，是 个阳药，向上向外可以达表。五苓散可以治\n“病在阳，应以汗解之”；苓桂术甘\n汤可以治“伤寒...心下逆满，气上冲胸...头眩...身为振振摇者”。\n故而桂枝\n在饮病中的应用规律就是“水饮+表邪不解”。\n28条的症候是“服桂枝汤，或下之”表仍不解。\n“头项强痛,翕翕发热,无汗,”——表证表邪困束的很显著——\n桂枝去芍药\n汤以更好的去解表；\n“心下满,微痛,小便不利,”——里面的淡饮内停导致的症状\n——加茯苓白\n术这个配伍是仲景治淡饮的基础方干。\n\n这个28条的症候，可以理解成一个装满水的茶壶，要想把里面\n的水倒出来，需要两个条件：\n1、上面的进气孔通畅；\n2、下面的出水口通畅。\n28条有表证表邪困束，外在毛窍闭塞，表束不开，就要发表攻表，\n所以不能再用酸敛的芍药了。所以就要用桂枝汤去芍药，使这个\n方子能无有挂碍的发表攻表；这样那个紫砂壶出水的第一个条件\n就具备了；茶壶出水的第二个条件要下窍（溺窍）通畅，故而加\n茯苓白术利小便。如此则表邪得桂枝而解，里饮得苓术而解，才\n能达到表里同治表里同解的功效。\n【原文】29、伤寒，脉浮，自汗出，小便数，心烦，微恶寒，\n脚挛急。反与桂枝，欲攻其表，此误也。得之便厥，咽中干，\n烦躁（无逗号）吐逆者，做甘草干姜汤与之，以复其阳；若\n厥愈足温者，更作芍药甘草汤与之，其脚即伸；若胃气不和，\n谵语者，少与调胃承气汤。若重发汗，复加烧针者，四逆汤\n主之。方十六\n\n甘草干姜汤方\n甘草四两，炙 干姜二两\n上二味，以水三升，煮取一升五合，去滓。分温再服。\n芍药甘草汤方\n白芍药 甘草炙，各四两\n上二味，以水三升，煮取一升五合，去滓。分温再服。\n调胃承气汤方\n大黄四两，去皮，清酒洗 甘草二两，炙 芒硝半升\n上三味，以水三升，煮取一升，去滓，内芒硝，更上火\n微煮令沸，少少温服之。\n四逆汤方\n甘草二两，炙 干姜一两半 附子一枚，生用，去皮，\n破八片\n上三味，以水三升，煮取一升二合，去滓。分温再服。\n强人可大附子一枚、干姜三两。\n【校注】\n\n《玉函经》：伤寒脉浮，自汗，小便数，颇微恶寒。论曰：心烦微恶寒，两\n脚挛急，反与桂枝汤，欲攻其表，得之便厥，咽干烦躁吐逆，当作甘草干姜汤，\n以复其阳，厥愈足温，更作芍药甘草汤与之，其脚即伸。若胃气不和，谵语，少\n与调胃承气汤。若重发汗，复加烧针者，四逆汤主之。\n《千金方》：伤寒，脉浮，自汗出，小便数，颇复微恶寒，而脚挛急。反与\n桂枝，欲攻其表，得之便厥，咽干，烦躁，吐逆，当作甘草干姜汤，以复其阳。\n厥愈足温，更作芍药甘草汤与之，其脚即伸。而胃气不和，可与承气汤；重发汗，\n复加烧针者，四逆汤主之。\n《圣惠方》：无此条\n《康平本》：伤寒脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，反与桂\n枝汤，欲攻其表，此误也。得之便厥，咽中干燥，吐逆者，作甘草干姜汤与之。\n若厥愈，足温者，更作芍药甘草汤与之，以复其阳。若胃气不和，谵语者，小与\n调胃承气汤。若重发汗，复加烧针，得之者，回逆汤主之。\n【解析】\n伤寒证是不会自汗出的，这里用伤寒这个称谓是因为这组症候群\n中的脉浮，恶寒，发烦，肢体拘挛甚至拘痛这组症状给人的第一感觉\n像是太阳伤寒的表现。但是医者已经注意到还伴有自汗出的症状了，\n所以知道这不是伤寒证。而如果只注意到汗的问题而弗顾其它并不是\n真正的“用思精”者。所以只是看到表证+自汗=中风这一层面就认为\n这是太阳中风证了，而用了桂枝汤（阳旦汤）去解表证攻邪风。\n在这里，医者忽略了患者还有另外一个非常重要的症状——小便\n\n数，故而差之毫厘谬以千里！所以我们在临床中采集四诊资料一定要\n做到无微不至，细致入微才行！绝不放过一丝一毫症候症状，绝不预\n设一丝一毫病机方药；未辨之前不立一法，即辨之后不留一法！要做\n经方的微雕大师，绝不能做暴虎冯河之辈，亦或偶有一中，则昂头戴\n面，不知涉境之险也！\n汗之与溺，同为津液之去路也，故伤寒大法——自汗必审小便症\n状：\n桂枝汤症候群：脉浮缓或浮数或浮弱，发热恶风寒，自汗出，头\n痛身痛，小便基本正常。\n桂枝汤证病机：表上津液丢失+营卫不和+邪风气逆。\n桂枝加黄芪汤症候群：脉浮微或浮涩（据黄芪桂枝五物汤条补入），\n微发热恶风或身冷，劳汗出，身疼重或肿，小便不利。\n桂枝加黄芪汤证病机：表上津液丢失+卫气亏虚+邪风虚热+水饮\n血痹+风水黄汗。\n桂枝加附子汤症候群：脉浮虚而涩(据桂枝附子汤条补入)，恶风，\n汗漏不止，四肢微急难以屈伸，小便难。\n桂枝加附子汤证病机：表上津液丢失+卫阳亏虚+温煦不及。\n甘草干姜汤症候群：脉浮大（据30条补入），微恶寒或微热，\n自汗出，脚挛急，小便数。\n\n甘草干姜汤证病机：表上津液丢失+胃虚寒+中不制下。\n29条的“自汗出，小便数，心烦，微恶寒，脚挛急”是由于胃\n虚冷中不制下而引起的太阴病外证，脉虽浮但是要大而中空或者浮虚\n的。本来就是里虚寒而津虚液少血弱了，应该用甘草干姜汤去温里煦\n表而补津液，再去用发散攻表的桂枝汤就会导致阳气不足津液虚冷而\n四肢厥逆的。津液丢失多了濡润不及还会咽中干、烦躁；胃虚重了中\n不制下，下焦的浊饮浊气上逆就会呕逆。这时的救逆，还得用甘草干\n姜汤，因为误治后的这组症状还没有跑出太阴外证的范畴。甘草干姜\n汤用四两甘草，二两干姜，四两甘草是仲圣急补津液的常用量，当津\n液亏损，还达不到少阴病的层面时，多用四两甘草来急补津液以复其\n阳，代表方就是这个甘草干姜汤；甘草甘能补益、甘能缓和、甘能治\n饮，可补津液、益胃气、缓急迫；干姜温胃中虚冷而治里虚寒为太阴\n里证之正药，甘草倍于干姜，说明此方即是以甘补甘缓甘益为主而性\n偏温；配伍起来的甘草干姜汤即可以通过恢复胃气而补益津液。胃不\n虚冷了，阳气恢复，中能制下了自然就不吐逆了，小便也就不数了，\n也不恶寒自汗了，津液上承了咽中自然也不干了，津液得以充养也就\n不烦躁了，脚也不会挛急了。如果这时候见到咽中干而去用生地、芩\n连之类去治疗，那胃就更虚寒了，阳气不复，津液也就不会生，病情\n就会进一步加重，甚成为坏病！这就是学伤寒的妙处，仲圣总是教我\n\n们用最高法则，用病机去统摄诸法，而不是单纯的以药对病和见山是\n山。\n所以讲到这里大家就会明白，这个“复其阳”的实质就是去恢复\n津液，恢复津液的温煦、濡养作用。甘草干姜汤作为方根还可见于四\n逆汤、甘姜苓术汤、生姜甘草汤、甘草泻心汤、理中汤、小青龙汤等\n方。\n经方之法，津液为本。仲圣是在津液的基础上来阐释阴阳的,所\n以津液既不单纯是阳气（津)，也不单纯是阴液（血）。在仲圣体系\n中，津液既含有阳气和阳的概念 也含有阴血和阴的概念，是为伤寒\n论最独特的概念。\n表：曰卫 曰阳 曰气\n津液\n里：曰营（荣） 曰阴 曰血\n可见津液本为一体，只是在不同的部位，叫做不同的称谓而已。\n而它们之间是可以互根互用、相互转换的。譬如同为人民军队，在地\n方驻防的时候叫地方部队，军民鱼水拥军爱民（荣）；在边防的时候\n叫边防军，保家卫国抵御外侮（卫）；而同样都是人民军队，内涵是\n一样的。但由于在不同的部位能发挥不同的作用，所以它们会有不同\n的称谓，而它们是根源一致、作用交互、相互交换的。这就比如说，\n\n边防发生战乱了，边防军需要从地方上抽调地方部队去补充兵源（营\n液补充卫津）；地方发生动乱了，边防军也可以撤回来维持治安（卫\n津补充营液）。\n这个津液的概念体系，不同于任何前人之说，而本蕴于伤寒书中，\n请大家熟记于心，以之校读仲圣之书，每可言下顿悟。\n29条，就没有离开甘草这个药，为什么？津液在表的，既要解\n表，又要补充津液的，用桂枝汤；津液寒而虚，既需要救津液又虚寒\n的，加个干姜，甘草干姜汤嘛。那么，津液偏阳的气的恢复以后，津\n液偏阴的一面相对来说更不足了，然后就用芍药甘草汤。芍药甘草汤\n用下去以后，津液恢复了嘛，津液恢复了以后，虚寒的一面，因为它\n毕竟经过桂枝攻表，丧失了一部分了，会出来四逆汤证，阳气不能去\n温煦了，不能去防御了，这个阳气不足的现象又会出来，还是得用甘\n草为主，加上附子就行了。然后这个时候，阳气回了，胃家受不了了，\n本来里面津液就亏了，又给用过附子、干姜这类燥热药，胃中燥烦满\n都会有，轻微的实，并不是真正的实，真正的实不会用调胃承气汤。\n这种情况，少与调胃承气汤。有可能一付药，喝几勺就行了。这个病\n人就好了。\n那么，你会发现，这几个方子，都是以甘草为主的，调胃的基础\n在哪里？在甘草。甘草干姜汤、太阴外证的基础在哪里？甘草。芍药\n\n甘草汤养津液怎么养？甘草。四逆汤的津液怎么补的？附子配甘草，\n一直是用甘草这个主线在转，这就是推一及十的读经方法。\n接着解条文，29条中接下来的部分，由于是 30条的简略版，有\n很多过程和细节体现在30条中并且前后呼应密不可分，所以我们把\n它放在30条中一并解析。\n【原文】30、问曰：证象阳旦，按法治之而增剧，厥逆，咽\n中干，两胫拘急而谵语。师曰：言夜半手足当温，两脚当伸，\n后如师言。何以知此？答曰：寸口脉浮而大。浮为风，大为\n虚，风则生微热，虚则两胫挛，病形象桂枝，因加附子参其\n间，增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦\n燥，阳明内结，谵语烦乱，更饮甘草干姜汤。夜半阳气还，\n两足当热，胫尚微拘急，重与芍药甘草汤，尔乃胫伸。以承\n气汤微溏，则止其谵语，故知病可愈。\n【校注】\n《玉函经》：问曰：证象阳旦，按法治之而增剧，厥逆，咽中干，两胫拘急\n而谵语，师言夜半手足当温，两脚当伸，后如师言，何以知之？答曰：寸口脉浮\n而大，浮即为风，大即为虚，风则生微热，虚则两胫挛，其形象桂枝，因加附子\n\n于其间，增桂令汗出，附子温经，亡阳故也。厥逆咽中干，烦躁，阳明内结，谵\n语烦乱，更饮甘草干姜汤，夜半阳气还，两足当热，胫尚微拘急，与芍药甘草汤，\n尔乃胫伸，与承气汤微溏，止其谵语，故知其病可愈。\n《千金方》：未见\n《圣惠方》：无此条\n《康平本》：问曰：证象阳旦，按法治之而增剧，厥逆，咽中干燥，两胫拘\n急而谵语。师曰：言夜半手足当温，两脚当伸，后如师言，何以知之？答曰：寸\n口脉浮而大，大为虚，风则生微热，虚则两胫挛。病形象桂枝，因加附子参其间，\n增桂令汗出，附子温经，亡阳故也。厥逆，咽中干，烦躁，阳明内结，谵语，烦\n乱，更饮甘草干姜汤。夜半阳气还，两足当热，胫尚微拘急，重与芍药甘草汤，\n尔乃胫伸，以承气汤微溏，则止其谵语，故知病可愈。\n【解析】\n这一条，完全是解释和补充29条的，增补描述了29条中省略\n而未叙述的那一部分治法和过程。这些条文是伤寒书中不可多得的可\n以直白得窥仲圣学术思维和临证轨迹的记录，并且可以得知仲圣当时\n的教学活动也是边做临床边做学术的，和现在脱离临床做学术的中医\n教育大有不同：\n因为29条是太阴外证，症候群像是阳旦汤（即桂枝汤）证，用\n桂枝汤去发汗反而加重了病情，引起了很多症候群，或四肢厥逆，或\n咽中干，或胫脚挛急，或谵语，学生去请教老师该怎样救逆，老师就\n\n让“作甘草干姜汤与之”，并且说服药后阳气恢复，手足就会热起来，\n厥逆就会好的。“师曰：言夜半手足当温，两脚当伸。后如师言。”\n经过验证，果然不出老师所料。学生就问老师道理所在，老师就\n说：第一个阶段：“作甘草干姜汤与之，以复其阳”。此病的寸口脉\n虽浮但是大而中空，浮虽然一般规律上是邪风在表的表病，但是“脉\n大为劳”（《金匮》），浮大中空的脉是里极虚的表现。津液亏虚也\n可以产生微风微热的表现（轻的比如太阴中风的邪风虚热，重的就是\n太阴外证，继续加重就会向少阴或厥阴经传如亡阳戴阳三阴合病等），\n还会出现肢体拘挛的表现。病看起来有些像桂枝汤证，而用了桂枝汤\n后导致了厥逆，咽中干，烦躁（接29条）“吐逆者，做甘草干姜汤\n与之，以复其阳”。胃气和阳气恢复了后，手足都暖了，这是第一次\n救逆成功。但是由于本来有微热，再加上服用温药的作用，表上的津\n液也会被热耗失，就会“两胫拘急”的，这个时候，就用芍药甘草汤，\n四两甘草急补津液，配伍缓拘挛的芍药去补津缓急，“重与芍药甘草\n汤，尔乃胫伸”（与29条“若厥愈足温者，更作芍药甘草汤与之，\n其脚即伸”说的是同一件事情）；\n第二个阶段：“增桂令汗出”。这其实是第二次误治，就是在第\n一次用甘草干姜汤复阳厥愈足温后，医者看到还有些脚挛急，但是没\n有用芍药甘草汤，而是在芍药甘草汤中增加了桂枝。这就还是阳旦汤\n\n的法则了，而恰恰是由于增加了桂枝会发汗的，所以条文说这是“重\n发汗”，说明这是第二次误汗导致了亡阳。\n第三个阶段：“附子温经，亡阳故也”。经过第二次的误治误汗\n“重发汗”或者“复加烧针者”，病已由太阴外证传变为少阴亡阳证\n了，会厥逆的更厉害，烦躁的也更重，那么再用甘草干姜汤就照顾不\n周全了，所以就 “因加附子参其间”。甘草干姜汤加上附子那正好\n就是四逆汤，故而29条有个“四逆汤主之”的提法。\n第四阶段：“若胃气不和，谵语者，少与调胃承气汤”。患者本\n有津虚生微热的底子在那里，经过这一番惊心动魄的误治和救逆的过\n程，阳气是固护住了，但是这一番温药入胃又导致了内里的津液耗失\n和热生，产生了“胃气不和”、“阳明内结”的病机，有了“谵语烦\n乱”的症状。这个时候，需要“少与调胃承气汤”，“以承气汤微溏，\n则止其谵语”。注意是“少与”，即所谓的“峻药轻投”法，少少的\n喝几勺调胃承气汤，微和胃气，轻轻的解决一下阳明的内结而不致于\n再伤阳气，“故知病可愈”。\n此两条大有内涵，亦是伤寒经方体系病传观理法的集中体现，可\n谓一以贯之法度森严。\n其后如《伤寒论》100条（伤寒，阳脉涩，阴脉弦，法当腹中急\n痛，先与小建中汤，不差者，小柴胡汤主之。）和金匮四饮中的“青\n\n龙汤下已”至“苓甘五味姜辛夏杏大黄汤”等条文亦是受此条津液观\n阴阳观理法所统摄的病传条文，但层面都没有此条丰满，所以此条为\n伤寒论中灵魂级“病传观”条文。\n附：甘草干姜汤之《金匮》、《外台》条文：\n《金匮要略·肺痿肺痈咳嗽上气病脉证治》：\n肺痿吐涎沫而不咳者，其人不渴，必遗尿，小便数，所以然者，\n以上虚不能制下故也。此为肺中冷，必眩，多涎唾，甘草干姜汤以温\n之。若服汤已渴者，属消渴。\n《外台》：32、疗肺痿吐涎唾“不咳者,其人不渴，必遗尿，小便\n数,所以然者，以上虚不能制偃下故也。此为冷。必眩,甘草干姜汤主\n之，以温其脏方。\n甘草四两,炙 干姜二两\n右二味，切，以水三升，煮取一升半，分温二服，服汤已，小温\n覆之。若渴者，属消渴。忌海藻、菘菜。\n（1）涎唾：《千金方》卷十七第六、《金匮要略》卷上第七并作“涎\n沫”，且下有“而”字。\n\n（2）制偃：程本、《千金方》，《金匮要略》“制”下并无“偃”\n字。\n（3）为冷: 程本“为”上有“肺”字，(金匮要略》、《千金方》\n并作“肺中冷”。\n经 典 经 方 第 五 期 课 程\n医案讲解一\n病案解析——肺塞胸瘤如何疗 水血同治得良效\n（2017 年7 月5 日）","hasDose":true},{"caseId":"P0024","caseSource":"临床医案解伤寒一期","caseType":"讲义医案","归集方":"桂枝茯苓丸","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：腹部痞闷不舒，阵痛，按之硬。","symptom":"主诉：腹部痞闷不舒，阵痛，按之硬。","history":"","exam":"刻诊：眼花、头晕，下午加重，心慌胸闷，腰部疼痛，浑身发沉，无汗，怕","analysis":"","prescription":"","effect":"","comment":"","caseExcerpt":"主诉：腹部痞闷不舒，阵痛，按之硬。\n刻诊：眼花、头晕，下午加重，心慌胸闷，腰部疼痛，浑身发沉，无汗，怕\n冷。\n口渴不欲饮，纳差，小便频数，尿不净感。大便一日一次，不成形。眠差，\n月经 30 天一次，量正常，颜色淡。月经前小腹与腰发胀。\n舌淡，水滑，淡黄腻苔。右脉沉缓，左脉寸部沉滑，余沉缓。真武汤\n4. 小建中，是太阴太阳阳明病，小建中，以表和营血虚为主\n\n温经汤是少阴太阴阳明病以，营血不通为主伤营，表寒，饮，伤血，阳明热，\n燥\n水血盛亏之理：\n纵观经方生理病理本义，可以总结出两句话：人身不过表里，气血不过阴阳。\n当太阴里虚寒证以胃虚寒为主的时候，就会产生水饮和造成血亏。水饮的产\n生是由于中不制下和津液不化；血亏的出现是由于胃虚不纳不运不化而导致水谷\n精微不能生化。太阴为阴中之里、阴中之阴，涵盖了血之部位，故而血归太阴。\n夫“血者，水之类也”，人体乃容器也，水血乃溶液也。由于容器之容量已经恒\n定，故水先增多则血即随后相应减少变淡也，此即水盛血亏也；器中血先减少则\n水即随后相应增多浸淫入血而血亦是减少变淡也，此即血亏水盛也。水盛血亏，\n利水为主，养血为助；血亏水盛，养血为主，利水为助。\n水盛血亏或血亏水盛的代表方当归芍药散、赤小豆当归散、桂枝茯苓丸、金\n匮肾气丸（八味丸）、附子汤、真武汤、猪苓汤、酸枣仁汤\n<1>当归芍药散条：\n妇人怀娠，腹中庥痛，当归芍药散主之。《金匮要略•妇人妊娠病脉证并治第\n二十》\n妇人腹中诸疾痛，当归芍药散主之。《金匮要略•妇人妊娠病脉证并治第二十》\n当归芍药散方\n当归三两 芍药一斤 茯苓四两 白术四两 泽泻半斤 芎窮半斤（一作三两）\n右六味，杵为散，取方寸匕，酒和，日三服。\n腹中 xiu 痛，我没找到那个字，谁有这个 xiu 字就发上来\n一个病字头，下面一个“亏”少一横\n释：妇人以血为用，所有的经带胎产哺乳莫不耗血，所以妇人的血证最为常\n见。妇人怀娠，血即去养胎，发生腹中庥痛者，不荣则痛也，血少也。而“器中\n血先减少则水即随后相应增多浸淫入血而血亦是减少变淡也”，是故血亏水盛之\n病机成矣。而“妇人腹中诸疾痛”，亦用当归芍药散者，则机理则亦相当。妇人\n腹中，胞宫子处所居，经带胎产诸生理功能之根据地，血室之处也。胞中有胎或\n下焦瘀阻（多为经带胎产所致），则血之滋养荣养受碍，得不到滋荣部位的血是\n绝对不足的，胞中子处和瘀阻之处血是相对不足的，故而此证之血亏不可以用阿\n胶胶饴类滋腻壅滞之品呆补，而需用养血中能行血之品。\n所以当归芍药散中芍药量最大，《本经》：“芍药，味苦平。主邪气腹痛，除\n血痹，破坚积寒热，疝瘕，止痛，利小便，益气。”芍药的“益气”，益的是荣气\n即营，也就是养营的药，还可以除血痹，行血化瘀去滞，并且最为恰当的是可以\n“利小便”，即所以去水饮也。一药可兼水血两端，可养营血可行淤血可利水液\n可助阴液，芍药配伍茯苓，是仲圣水血同病水血同治的方根。见于当归芍药散、\n桂枝茯苓丸、真武汤、附子汤、薯蓣丸，这个方根的方子，占了水血同治的方剂\n的半壁江山，是此类方剂最重要的基础。\n当归芍药散中，当归、川芎、芍药养营血行瘀血为主，茯苓泽泻白术逐水气\n利小便为主，芍药兼可以利水饮，白术兼可以健胃气，合而成养血行血逐水祛饮\n益气护液之方。此方养血不留湿，行血不伤血，逐水不损中，祛饮不伤阴，益气\n不燥津，护液不滋腻，可谓水血同治之第一方。\n<2>赤小豆当归散条：\n\n病者脉数，无热微烦，默默但欲卧，汗出，初得之三四日，目赤如鸠眼；\n七八日，目四眦（一本此有黄字）黑。若能食者，脓已成也，赤小豆当归散主之。\n《金匮要略•百合狐惑阴阳毒病证治第三》\n下血，先血后便，此近血也，赤小豆当归散主之。（方见狐惑中）《金匮要\n略•惊悸吐血下血胸满瘀血病脉证治第十六》\n赤小豆当归散方\n赤小豆三升（浸，令芽出，曝干） 当归三两\n右二味，杵为散，浆水服方寸匕，日三服。\n释：《本经》：“赤小豆，主下水，排痈肿脓血”。\n《别录》：\"赤小豆，主寒热，热中，消渴，止泄，利小便，吐逆，卒澼，\n下胀满。\"\n《本经》：“当归，味甘温。主咳逆上气，温虐，寒热，洗在皮肤中（《大\n观本》，洗音癣）。妇人漏下绝子，诸恶创疡金创。”\n赤小豆当归散的主治，可以用三个概念来概括：利水祛湿化浊、养血行血止\n血、排脓生肌止痛，清热解毒疗疮。\n赤小豆可以利水祛湿化浊，排脓生肌止痛，清热解毒疗疮，本身还具有轻微\n的活血养血的作用，但是以通利攻逐为主要性情，所以古人有久食赤小豆令人黑\n瘦结燥之经验。\n这个方子很好用，可以用于风疹痒疹、带状疱疹、手脚湿气、疔肿走黄、大\n头瘟毒、痄腮红眼、痈肿疮毒、大腹水肿、小便淋涩、遗精带浊、经血不利、湿\n热或毒热出血等水血同病而需“利水祛湿化浊、养血行血止血、排脓生肌止痛，\n清热解毒疗疮”者。并且可以外用亦可敷毒疗疮清热散结。\n当归为养血行血止血之要药，也具排脓生肌止痛，解毒疗疮之功。故而两药\n和合，功效倍增。\n当归芍药散为血亏水盛，养血为主，利水为助的代表方；赤小豆当归散为水\n盛血亏，利水为主，养血为助的代表方。\n<3>桂枝茯苓丸条：\n妇人宿有癥病，经断未及三月，而得漏下不止，胎动在脐上者，为癥痼\n害。\n妊娠六月动者，前三月经水利时，胎下血者，后断三月下血也。所以血不\n止者，其癥不去故也。当下其癥，桂枝获苓丸主之。《金匮要略•妇人妊娠病脉证\n并治第二十》\n桂枝茯苓丸方\n桂枝 茯苓 牡丹（去心） 桃仁（去皮尖，熬） 芍药各等分\n右五味末之，炼蜜和丸，如兔屎大，每日食前服一丸。不知，加至三\n丸。\n释：桂枝茯苓丸是临床常用的一张治疗水血同病以血为主的好方子。此\n方包涵芍药配伍茯苓的水血同治的方根，而再配以桂枝和营祛瘀，丹皮清热祛瘀，\n桃仁破血祛瘀，可以祛瘀攻坚消癥瘕积聚恶血停水而不伤正。其组方既注意阴阳\n的搭配，又注意缓图护正，可谓巧妙。\n桂枝，阳性祛瘀药，丹皮阴性祛瘀药；\n桃仁，阳性祛瘀药，芍药阴性祛瘀药；\n\n茯苓利水而炼蜜滋液可利水而不伤阴液。\n<4>金匮肾气丸(八味丸)条：\n虚劳腰痛，少腹拘急，小便不利者，八味肾气丸主之。《金匮要略。血痹虚\n劳病脉证并治第六》\n夫短气有微饮，当从小便去之，苓桂术甘汤主之（方见上）；肾气丸亦主之\n（方见脚气中）。《金匮要略。痰饮咳嗽病脉证并治第十二》\n男子消渴，小便反多，以饮一斗，小便一斗，肾气丸主之（方见脚气中）。\n《金匮要略。消渴小便不利淋病脉证并治第十三》\n问曰：妇人病，饮食如故，烦热不得卧，而反倚息者，何也？师曰：此名转\n胞不得溺也。以胞系了戾，故致此病，但利小便则愈，宜肾气丸主之。《金匮要\n略。妇人杂病脉证并治第二十二》\n崔氏八味丸 治脚气上入，少腹不仁。《金匮要略。中风历节病脉证并治第五》\n干地黄（八两） 薯蓣（四两） 山茱萸（四两）泽泻（三两） 茯苓（二两）牡\n丹皮（三两） 桂枝附子（炮，各一两）\n上八味，末之，炼蜜和丸梧子大，酒下十五丸，加至二十五丸，日再服。\n释：金匮肾气丸是水血同病、水津同病的一张方子。此方用大剂量的干地黄\n去滋阴养血活血，配伍桂枝丹皮这组阴阳搭配的祛瘀药加强治血功效，配伍山药\n山茱萸附子补虚益气生津温中，山药山茱萸丹皮还能养阴液清虚热，桂枝附子配\n伍还能温卫而解表邪。茯苓泽泻配伍丹皮能利水祛饮消肿清热，和合而成水血同\n治、水津同治而以津血为主之方。\n所以此方可以治疗水血同病，水津同病，虚劳积弱，水饮虚热上冲导致的消\n渴烦热短气倚息小便不利，表里不和，寒热不均，妇人转胞不溺，男子腰痛腹拘\n等属厥阴诸疾。\n《本经》：干地黄味甘寒。主折跌绝筋，伤中，逐血痹，填骨髓，长肌肉，\n作汤，除寒热积聚，除痹，生者尤良。久服，轻身不老。\n《本经》：署豫（旧作薯蓣，《御览》作署豫是）味甘温。主伤中，补虚羸，\n除寒热邪气，补中益气力，长肌肉。久服耳目聪明，轻身不饥，延年。\n《本经》：山茱萸，味酸平。主心下邪气，寒热，温中，逐寒湿痹，去三虫。\n久服轻身。\n《本经》：牡丹，味苦辛寒。主寒热，中风，瘈疭，痉，惊痫，邪气，除症\n坚，淤血留舍肠胃，安五脏，疗痈创。\n《本经》：泽泻，味甘寒。主风寒湿痹，乳难消水，养五脏，益气力，肥健。\n久服耳目聪明，不饥，延年轻身，面生光，能行水上\n《本经》：茯苓，味甘平。主胸胁逆气（《御览》作疝气），忧恚，惊邪，恐\n悸，心下结痛，寒热烦满，咳逆，口焦舌干，利小便。久服安魂养神，不饥延年。\n《本经》牡桂，味辛温。主上气咳逆，结气喉痹，吐吸，利关节，补中益气。\n久服通神，轻身不老。\n《本经》：附子，味辛温。主风寒咳逆邪气，温中，金创，破症坚积聚，血\n瘕，寒温，踒（《御览》作痿）。躄拘挛，脚痛，不能行步。\n<5>附子汤条：\n304．少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主\n之。\n305．少阴病，身体痛，手足寒，骨节痛，脉沉者，附子汤主之。\n\n附子汤条：\n附子（炮，去皮，破八片，二枚） 茯苓（三两） 人参（二两） 白术\n（四两） 芍药（三两）\n上五味，以水八升。煮取三升，去滓，温服一升，日三服。\n释：\n解释附子汤这两条，需要联系少阴病的几个条文：\n少阴病，得之二三日，麻黄附子甘草汤微发汗。以二三日无证，故微发汗也。\n（302）\n少阴病，始得之，反发热脉沉者，麻黄细辛附子汤主之。（301）\n少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。（304）\n我们把这一系列条文前后联系起来看就知道了， “少阴病，得之两三日，\n无证”，怎么回事？不是少阴病吗，怎么会无证呢？其实仲圣要表达的意思是无\n里证和其他兼证，所以单纯的温发就行了。注意，这是说的两三日的时候，无里\n证和其他兼证，就是温发表邪就行了。而有的少阴病就不这样了，比如“少阴病，\n始得之，反发热，脉沉者”，这就是有问题了，少阴病刚刚得上就脉沉，这是里\n面有饮，脉沉者，里有水也，所以加上细辛化饮才行，这就是前面咱们讲过的麻\n黄附子细辛汤。其实是个合病，太阳少阴太阴合病，麻黄解太阳之邪，附子温少\n阴之阳，细辛化少阴之饮。\n还有就是这种附子汤证的“少阴病，得之一二日，口中和”，这也也不是单\n纯的少阴病了，也不可以用麻黄附子甘草汤之类的微发汗，它是水饮的阻碍，胃\n也虚寒，津液不能上承了，有饮还津液不润，所以口中还不至于太干燥，也不至\n于太水润，黏黏糊糊，像是不爽还不想喝水，就是这样一种状态。\n和，在这里读 huo，就是和面、和泥的状态，《释文》和，戸卧反。 《周礼•\n天官》：“内饔掌王及后世子膳羞之割烹煎和之事。”煎和，类似今天的乱炖，也\n是一种混合粘滞的状态。\n由于有少阴的阳津亏虚，有太阴胃中虚冷，水饮停滞，所以会引起背恶寒。\n这种状态，除了服用附子汤，当灸之而取捷效。灸哪里呢？灸其背！为什么这么\n肯定是灸背？因为第 110 条即有此治法之先例：“太阳病二日，反躁，反熨其背\n而大汗出，火热入胃，胃中水竭，躁烦，必发谵语。”110 条是太阳病的全身恶\n寒，不是附子汤证的单纯背恶寒。太阳病二日邪当在表，正如第 5 条所言：“伤\n寒二、三日，阳明、少阳证不见者，为不传也。”此条第二日就反躁，这就是病\n已经传阳明里位了。医者把太阳病恶寒当成少阴太阴合病的附子汤证的背恶寒去\n治疗了，熨灸其背，这是汉代常用的温胃化饮解表的方法，可是 110 条是阳明热\n炽本来就多热多汗津亏，再误用熨灸就会“火热入胃，胃中水竭”而导致坏病的。\n但我们就可以拿着这个方法去治疗附子汤证的背恶寒口中和的，这个“火热入胃”\n正好治疗胃中虚寒，“胃中水竭”正好可以去饮化水，胃温饮去津回即可以取捷\n效。这是从误治中悟正治之道的方法。\n附子汤，包涵芍药配伍茯苓这个水血同治的方根，所以肯定可以治疗水血同\n病的疾病。而上面条文的病机解释是以虚寒水饮津亏为主的，这就是说，方证是\n多维的而不是唯一的，比如上面的附子汤和金匮肾气丸，都能即可以治疗虚寒水\n津同病的层面，又可以治疗水血同病的层面，还可以治疗水血津液同病的层面。\n第 305 条的身痛骨痛手足寒而脉沉，说明不是以表证为要，而是里面虚寒重\n\n了，营不能去温煦所致，所以用附子汤这个温阳养营祛寒除湿的方子对治。\n而以水血同病表现的为主的条文，见于《金匮•妇人妊娠病脉证并治第二十》：\n“妇人怀娠六七月，脉弦发热，其胎愈胀，腹痛恶寒者，少腹如扇，所以然者，\n子藏开故也，当以附子汤温其藏。”\n前面讲过，怀娠需要用血来养胎，所以孕妇生病最容易影响到血分。譬如本\n条怀娠六七个月了，腹部逐渐增大，“其胎愈胀”，这个“胀”通“长”，长大的\n意思，就是胎儿越来越长大了，开始准备入盆了。“少腹如扇”，不是前人解释的\n少腹受风冷像扇子扇的一样或“少腹如扇之状”。这个扇，是障扇、扇伞的意思，\n指的是古代仪仗中障尘蔽日的那种扇伞。就是说妇人这个小肚子是胎儿的保护伞，\n即少腹有可以庇护子脏的功能。但是随着胎儿越来越长大，“子脏开”了，就是\n子宫下降产门渐开了，不严实了。这个孕育胎儿的脏器就容易受到风寒湿邪的感\n触了，子脏在下降过程中越来越接近身体的表，那就容易受风寒，越来越趋向人\n体的下焦低位，那就容易受湿，“湿趋于下”嘛。而人体的四肢百骸为表，五脏\n六腑为里，所以内脏受寒可不能去发表，虽然也有发热恶寒，但是还伴有脉弦腹\n痛这些里位脏器不和的症状，这可不是表证，应该温其脏才行。需要温阳养血驱\n寒除湿，那么就用附子汤最为对证。\n答疑：\n许师 桂枝茯苓丸 在临床中变汤剂是用什么量？\n我一般各用 20 克，包括蜂蜜\n2、赤小豆当归散一般用汤剂还是散剂？赤小豆三升用多少克？我一般用汤，\n赤小豆 100 当归 20 发芽是为了作散剂能更好吸收 ，古人认为生用令人胀满，发\n芽后可以消除这个弊端。而作汤剂不需要发芽，因为可以煮的开花。长粒的红饭\n豆才是赤小豆，有淤有热有湿气可以吃。\n3、水血应该指(饮 滞) 在临床中的表现吧？水就是诸水饮疾，血就是血虚\n血瘀血寒血热诸疾。\n4 很多人用的乌梅丸都用错了，没加上苦酒，金匮肾气丸没加上黄酒，大承\n气汤没加上黄酒，这都使经方性味失去了法度。苦酒比醋还淡一些，我用醋和水\n各半。\n5、手脱皮，有阳明热炽的，有太阴血虚的，有厥阴水热的，比如甘草泻心\n汤证，太阴阳明合病属厥阴病，里面有阳明的热和太阴的水夹杂了。\n6、龙翠萍，女，26 岁。面部皮肤发热就诊。。。。。刻诊。病人面色红，双额\n头有红色丘疹，不痒，精神爽朗，诉。面部发热，，腰部怕冷，晨起胃口不好，\n口苦，饮食一般，口干，喝水多，喜热水。但喝水后感觉腹胀不适，手足冷，平\n时不出汗，睡眠可，容易疲劳，小便黄，大便结（以前 7 天一次大便，现在喝了\n凉药一天一次。自己在药店买滴大黄类药）月经量少，行经三天，色黑，有血块，\n月经时腹部稍涨不适，白带稀，无气味。胫肿，小腿受凉后易抽筋水滑苔，舌质\n淡。边有齿痕，舌尖一小块黄腻苔，脉细数，曾经看西医长期用激素治疗\n下焦和营血虚寒了，上面肯定要热上面的热一部分是下焦虚寒营血不濡阳气\n上浮\n另一部分是阳明燥烦满实大便难\n也有水血（营）同病，这就是病机所在，半量温经汤\n7、经方，有一个极高级的心法，即以方为药之法，也就是把一个方剂当成\n一味药来使用。\n8、仲圣理论的滥觞，就是二旦、四神大小等汤。\n\n一对阳旦汤、阴旦汤；四张四神的方子。阳旦汤就是桂枝汤，阴旦汤就是柴\n胡汤。阳旦汤是升阳的，阴旦汤是扶阴的，一阴一阳之谓道。四神，也叫四兽，\n青龙，白虎，朱雀，玄武。青龙者，宣发之方，白虎者，收重之方，朱雀者清滋\n之方\n玄武者温渗之方。阴、阳、宣、收、清（滋）、温（渗）所有的经方都是从\n这六类方子来的，仲圣用这六类方子为主干，把所有的他研究的效方挂在了上面，\n也就是说，仲景其实是借用了汤液经法大辞典的方子，理法全新。阴阳+四神=\n上下+四方，是六合，一个圆。汤液经法的方剂是 365 首但是太散乱，没有统摄\n之法\n仲圣用六合之数来统摄，这叫以博返约。仲圣的方子，二百首左右，也就是\n说，扬弃了一部分，但是仲圣也自创和加减了一部分。这就是我们常见的诸如桂\n枝加芍药汤、柴胡加芒硝汤、黄芩加半夏生姜汤、桂枝去芍药加茯苓白术汤、木\n防己去石膏加茯苓芒硝汤等等。所以我们说，仲圣制的加减之方都是单列的，自\n己有自己的户口本。而方后加减的都是仲圣的弟子再传弟子或私淑弟子的经验，\n比如小柴胡汤后、小青龙汤后等等，没有户口本，也没护照，不是无往不利的，\n价值有限。还有一类方子，很特殊。这是一类什么方子？桂枝麻黄各半汤、桂枝\n二麻黄一汤、桂枝二越婢一汤等等。桂枝麻黄各半汤，麻黄汤就是解表的，桂枝\n汤就是补汗后护津液的，一个发散，一个补养，把麻黄汤当泻（汗）药，桂枝汤\n当补药。\n太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，清便欲\n自可，一日二三度发，脉微缓者，为欲愈也。脉微而恶寒者，此阴阳俱虚，不可\n更发汗、更下、更吐也。面色反有热色者，未欲解也，以其不能得小汗出，身必\n痒，宜桂枝麻黄各半汤。（23）\n以其不能得小汗出，只能微微发小汗，那就是需要监制。\n服桂枝汤，大汗出，脉洪大者，与桂枝汤如前法；若形如疟，日再发者，\n汗出必解，宜桂枝二麻黄一汤。（25）\n这个是津液伤的更重，病邪要往里走，所以补药比例更多一些，泻（汗）药\n比例更小一些。\n太阳病，发热恶寒，热多寒少，脉微弱者，此无阳也，不可更汗，宜桂枝\n二越婢一汤方。（27）\n本条可以解读到，第一无阳并不可怕，只是津液伤了，第二改变方剂药量以\n改变药物的功效趋势。无阳津液伤，两份桂枝汤补津液，越婢汤本为发越风水而\n设，但是剂量小到越婢一汤的程度就可以成为有监制的透表邪药，这是仲圣的以\n方为药的思路。\n9、问曰：妇人年五十，所病下，利（血）数十日不止，暮即发热，少腹里\n急，腹满，手掌烦热，唇口干燥，曾经半产，瘀血在少腹不去，何以知之？其证\n唇口干燥，故知之。当以温经汤主之。（金匮要略。妇人杂病脉证并治第二十二\n吴茱萸（三两）当归 川芎 芍药（各二两）人参 桂枝 阿胶 牡丹皮（去心）生\n姜 甘草（各二两） 半夏（半升） 麦门冬（一升，去心）\n上十二味，以水一斗，煮取三升，分温三服。亦主妇人少腹寒，久不受胎；\n兼取崩中去血，或月水来过多，及至期不来。\n温经汤全量是治什么的？急治的猛剂，崩漏几十天了。这是温经汤的立方所\n本，但是温经汤“亦主妇人少腹寒，久不受胎；兼取崩中去血，或月水来过多，\n及至期不来。”温经汤急治有个病机很重要，曾经半产，瘀血在少腹不去。这说\n\n明什么，温经汤重用可是化瘀去实邪的剂量。那么“妇人少腹寒，久不受胎；兼\n取崩中去血，或月水来过多，及至期不来。 ”这些病邪实不明显甚至无实邪的\n以虚寒津亏胃虚为主的呢？也用全量？是不是得学学桂枝二越婢一汤的法则，改\n变越婢汤的功效趋势？ 用半量温经汤\n10、为啥叫越婢汤？越国，是个熟谙水性的国家，越婢汤证是风水证，即中\n风+表饮证，伤寒+表饮证是大青龙汤，治水之力猛峻。比较而言是实证，中风+\n表饮证是越婢汤证，治水之力相对缓和，因为越婢汤的石膏重于麻黄，相对缓和；\n大青龙汤的麻黄重于石膏，相对峻烈。那么，越人善水，女性相对柔和，就是治\n水中的和缓之剂，对治中风类相对的“虚”病。青龙阳刚，大青龙更是阳刚的霸\n王龙，对治伤寒类绝对\"实”病。\n11、大小青龙汤怎么鉴别？小虽小矣，符合法度。小青龙汤有阴证，所以成\n小称，\n阳大而阴小。小青龙是，表饮+伤寒。大青龙是 表饮+里热+外伤寒？\n不是这么解的，详细的方证是一种解法，大的理法框架是一种解法。就像桂\n枝汤阴阳旦汤是升阳之方一个道理。为什么有白芍还说升阳呢？它是说的一个大\n的理法体系，是象，而不是小的个体。没有这个浑朴的大象，挂不住精细的枝节。\n真武汤条：\n太阳病发汗，汗出不解，其人仍发热，心下悸，头眩，身瞤动，振振欲擗地\n者，真武汤主之。（82）\n少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利\n者，此为有水气，其人或咳，或小便利，或下利，或呕者，真武汤主之。（316）\n真武汤\n茯苓 芍药 生姜（切，各三两） 白术（二两） 附子（炮，去皮，破八片，一\n枚）\n上五味，以水八升，煮取三升，去滓，温服七合。日三服。\n释：真武汤含有水血同治的方根茯苓配伍芍药；亦含有驱寒除湿逐水气的方\n根白术配伍附子，并且还有生姜的温散水饮；更侧重于治水的比例，所以这是一\n张水血同治以水为主的方子。可以治疗淡饮中以偏寒为主者，亦可以治疗溢饮轻\n证虚寒为主者。\n太阳病，发汗是正治，但是发汗后患者“汗出不解，其人仍发热，心下悸、\n头眩、身膶动，振振欲擗地”，为什么会出现这些症候？如果联系下五苓散证就\n会看的清楚了，\n《伤寒论》71 条：“太阳病。。。若脉浮，小便不利，微热消渴者，五苓散主\n之。”\n这是里有水饮的人又患上太阳表病了，这种情况经方的施治有个法则，要去\n通利小便而解表，单纯的用发汗法，不但会表不解，还要激动里面的水饮上冲的，\n类似这种五苓散证的里饮表邪而误用汗法就有可能成为真武汤证。\n还有一种情况就是少阴病在两三日的时候没有得到正确治疗，到了四五日传\n里，从表阴证传里，成了少阴太阴合病，里面也虚寒了，就会因为虚寒和津液不\n化而产生水饮。\n这两种情况一个是从阳之表太阳传太阴里位表之里合病，一个是从阴之表少\n阴传太阴里位之表里合病，都可以导致真武汤证。\n“太阳病发汗，汗出不解',虽然汗出而表邪不解，所以“其人仍发热”， 水\n饮上逆上冲，冲到上焦的里位就要“心下悸”、冲到上焦的表位就要“或咳”，再\n\n冲到表位中的阳位就要“头眩”，冲击中焦就会“或呕”，水饮泛滥于下焦就会“自\n下利”“或小便不利”、“或不下利”或者“小便利”（尿频）、或者“腹痛”等。\n看看会出现多少症状，发热、头晕、心慌、咳嗽、呕吐、下利、小便或者不\n利、或者尿频，或者腹痛。这还不算，还可能会有更重的症状出现的，因为水盛\n则津亏，水盛则血虚，水饮不化津液，津的温煦血的濡养功能就不足了。津血不\n温煦濡养，还有水饮停滞，轻则“四肢沉重疼痛”，重则“身膶动，振振欲擗地”，\n也就是身体颤抖，手足摇动甚则欲倒地。\n振，《广雅•释诂一》振,动也。颤动的意思。\n擗，《莊子•馬蹄篇》摘擗爲禮。《註》屈折手足之意。\n亦作擘。亦通辟。\n身体颤动，手足摇动，甚至很多真武汤的患者，神情也慌张，一组明显的水\n饮动经的表现。\n猪苓汤条：\n阳明病，脉浮而紧，咽燥口苦，腹满而喘，发热汗出，不恶寒，反恶热，身\n重。若发汗则躁，心愦愦，反谵语。若加烧针，必怵惕烦躁，不得眠；若下之，\n则胃中空虚，客气动膈，心中懊憹，舌上胎者，栀子豉汤主之。 若渴欲饮水，\n口干舌燥者，白虎加人参汤主之。 若脉浮发热，渴欲饮水，小便不利者，猪苓\n汤主之。（223）\n阳明病，汗出多而渴者，不可与猪苓汤，以汗多胃中燥，猪苓汤复利其小便\n故也。（224）\n少阴病，下利六七日，咳而呕渴，心烦，不得眠者，猪苓汤主之。（319）\n脉浮发热，渴欲饮水，小便不利者，猪苓汤主之。（金匮要略。消渴小便不\n利淋病脉证并治第十三）\n猪苓（去皮） 茯苓 泽泻 阿胶 滑石（碎，各一两）\n上五味，以水四升，先煮四味，取二升，去滓；内阿胶烊消。温服七合，日\n三服。\n释：这个 223 条是所有猪苓汤条文的引子，猪苓汤的其它条文都需要在此联\n系解读。\n阳明病，脉浮而紧，咽燥口苦，腹满而喘，发热汗出，不恶寒，反恶热，身\n重。若发汗则躁，心愦愦，反谵语。若加烧针，必怵惕烦躁，不得眠；若下之，\n则胃中空虚，客气动膈，心中懊憹，舌上胎者，栀子豉汤主之。 若渴欲饮水，\n口干舌燥者，白虎加人参汤主之。 若脉浮发热，渴欲饮水，小便不利者，猪苓\n汤主之。（223）\n这个 223 条，信息量巨大，是仲圣法则的眼目之一。\n首先这一条说的都是阳明脉浮的证型，这就说明，脉浮不光主表，还主热，\n并且以主阳明的热为主。\n本条就是列举了阳明脉浮的三种证型，也是阳明病或三阳合病而误汗、误火、\n误下治后引起的上中下三焦的三组阳明火邪证：\n一、 栀子豉汤证（偏于上焦<亦可兼有中焦>之湿热）：\n开始是三阳合病，仲圣定义的三阳合病都是以阳明证为主，本条是，219 条\n也是。所以有太阳的身重，少阳的口苦，而更突出的表现是阳明的发热汗出，不\n恶寒，反恶热，腹满而喘，咽燥，因为里面邪热鸮张，脉也浮起来了，而还有太\n阳的寒湿困表，所以浮到一定程度会兼有紧象。\n这种情况，若发汗耗津，会导致人烦躁心乱，津伤重了还会谵语。\n\n心愦愦，就是心烦闷乱的意思。\n愦，《说文》：傳曰。潰潰，亂也。按潰潰者，憒憒之叚借也。後人皆用憒憒。\n从心。\n又《三国志•蜀志•蔣琬傳》琬曰：事不當理，則憒憒矣。\n和仲圣同为东汉人的大文学家王逸，在《九思•逢尤》中有“心烦愦兮意\n无聊”之句，可见在东汉，惯用心愦形容烦闷心乱的意思。\n若烧针不但耗津还伤血，津血伤损后不但烦躁失眠了，还会怵惕的，就是心\n悸恐惧，惴惴不安。\n怵，《说文》：恐也。孟子云怵惕。\n怵惕也。忧也，惧也\n《广雅》：怵,惧也。\n《玉篇》：惕,惧也。\n若下之，也是误治，因为这是阳明热证，而不是里实，胃中还没有燥屎的，\n应该用清法而不是下法。没有成实而误下就会虚其胃，虚其胃则会导致“客气动\n膈”，为什么叫“客气”？说明这些气不是胃本家的，是串门来的。这些浊气本\n来是应该在下焦呆着才行，下焦才是分清别浊的加工厂。胃不虚时，人体的浊气\n浊饮就会规规矩矩的呆在下焦，在那里等着分清泌浊。但是误下后胃虚了，浊气\n浊饮就会乘虚而入上逆到中焦胃中，再向上还可以动膈，横膈膜是中上焦的分界，\n浊气浊饮可以突破横膈以上，侵犯到了上焦。原文虽然说的是客气动膈，其实有\n浊气也有浊饮，概称为客气罢了。\n因为误下后热还没有除，所以这些浊气浊饮上来就会随化而成为湿热。湿热\n向上涌迫，上焦有心位在那里，所以就会心中懊憹。\n懊憹，烦闷忧愤状，。\n懊，《集韻》恨也，晋绿珠有《懊儂歌》。就是心里憋屈不痛快的意思。\n憹，《說文》有所恨也。汝南人有所恨曰憹。汝南，和南阳毗邻，说明仲圣\n写《伤寒杂病论》一书是习惯用到很多当地方言的，也证明了何顒说仲圣“用思\n精而韵不高”之语确有来历，仲圣之言辞精炼简洁直白了当，和汉赋的磅礴大气\n瑰丽奇伟气度非凡确实不同。\n关于懊憹一词，成无己在《伤寒明理论》中叙述的很精当：“懊者懊恼之懊，憹\n者郁闷之貌，即心中懊懊恼恼，烦烦恼恼 ，郁郁然不舒畅，愤愤然无奈，比之\n烦闷而甚者。”\n舌上苔，也是有用意的，仲圣的书，是着重于描述异常的病理状态忽略正常\n的生理状态的，所以就像附子汤的“口中和”、本条的“舌上苔”都是说的病理\n状态的。舌苔正常时是淡红舌薄白苔，而舌上苔，指的是舌苔厚、腻、黄、浊等\n状态，这都是典型的湿热征象，那么就用栀子豉汤去清热利湿酸苦涌泄。\n在这里，有必要说一下淡豆豉这味药，《释名•释饮食》：豉，嗜也。五味调\n和，须之而成，乃可甘嗜也。豉有淡咸二种，淡者入药，故名淡豆豉。腌上盐的\n那是咸菜，全国各地皆有各种风味豆豉，譬如我们当地的佐餐豆豉就是用苏叶、\n花椒、生姜发酵腌制的。\n香豉，《名医别录》：“味苦，寒，无毒。主伤寒头痛，寒热，瘴气恶毒，烦\n躁满闷，虚劳喘急，两脚疼冷。”\n《伤寒论》有六首方子用豉，栀子豉汤、栀子甘草豉汤、栀子生姜豉汤、枳\n实栀子豉汤、栀子大黄汤、瓜蒂散。\n淡豆豉是黑豆发酵后的制品，随各地地产不同而用辣蓼、佩兰、苏叶、藿香、\n\n桑叶、青蒿辛香植物等做汤煮黑豆，等煮透汤尽后，再蒸透焖闭发酵，生出黄衣\n后晒干即成，所以叫香豉，闻起来是酸香的。所以，淡豆豉的性味除了苦寒，还\n有微微的辛香酸温，凡是发酵之物，大抵微温。\n淡豆豉的功效全面的阐释有四个方面的作用，清热化湿除烦，和中养胃健运，\n疏散微透表邪，涌泄轻宣郁滞。而前人往往只论述到清热化湿除烦这个层面，而\n对于后面三个功效鲜有论及，从而限制了本类方剂使用的范围。\n还有一段疑案，就是栀子豉类方到底有无吐的作用，由于栀子豉汤方后有“得\n吐者，止后服”之语，而导致注家分成两派，一派主张栀子豉汤能吐，一派主张\n栀子豉汤不能吐。而据我临床验证，栀子豉汤在某些患者确可发生吐的现象，并\n不是辨证不准，也不是不能愈病，但是确实有一部分患者服用栀子豉汤或其类方\n会有吐的反应，而大部分不会吐。\n细究其因，则栀子豉汤所治之证，自中焦湿热开始可以涌迫到上焦，所引起\n的症状也是极多，烦热、胸中窒、心中懊憹、饥不能食、头汗出、虚烦不得眠、\n其外有热、手足温、下利后更烦、按之心下濡等等。那么，病机就会有湿热结于\n中焦和结于上焦的不同，中焦湿热用栀子豉汤后大部分不吐，；而上焦湿热由于\n病位在横隔膜以上，如果火热湿邪冤结郁滞较甚，药入而与邪争，加之栀子豉汤\n本身具有酸苦涌泄的作用，病位在上，因势利导，得吐则邪去正安，津液得下得\n以敷布，正气自调，故曰得吐者可以止后服。\n二、 白虎加人参汤证（偏于中焦之燥热）：\n若误治后引起口干舌燥，渴欲饮水，说明热耗津伤，津液急剧丢失了，胃中\n干，中焦不能奉上了，不能上奉津液了，所以会口燥的厉害，人体要饮水自救了，\n这样的燥渴索饮，更明显的会渴喜冷饮，是典型的阳明热消水之证，这种证型我\n们在临床可见于糖尿病患者的一些阶段，往往用本方数剂后即可以生津去热止渴，\n效佳良验。\n白虎汤是清热的，配伍人参才能生津止渴，故仲圣书中白虎汤证三条，无\n一字言渴：\n伤寒脉浮，发热无汗，其表不解者，不可与白虎汤。渴欲饮水，无表证者，\n白虎加人参汤主之。（170）\n三阳合病，腹满身重，难以转侧，口不仁而面垢，谵语遗尿。发汗则谵语，\n下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。（219）\n伤寒脉滑而厥者，里有热也，白虎汤主之。（350）\n而白虎加人参汤六条，每条必见渴证：\n服桂枝汤，大汗出后，大烦，渴不解，脉洪大者，白虎加人参汤主之。（26）\n伤寒病，若吐、若下后，七八日不解，热结在里，表里俱热，时时恶风，大\n渴，舌上干燥而烦，欲饮水数升者，白虎加人参汤主之。（168）\n伤寒无大热，口燥渴，心烦，背微恶寒者，白虎加人参汤主之。（169）\n伤寒脉浮，发热无汗，其表不解者，不可与白虎汤。渴欲饮水，无表证者，\n白虎加人参汤主之。（170）\n阳明病，脉浮而紧，咽燥口苦，腹满而喘，发热汗出，不恶寒，反恶热，身\n重。若发汗则躁，心愦愦，反谵语。若加烧针，必怵惕烦躁，不得眠；若下之，\n则胃中空虚，客气动膈，心中懊憹，舌上胎者，栀子豉汤主之。若渴欲饮水，口\n干舌燥者，白虎加人参汤主之。（222）\n太阳中热者，暍是也。汗出恶寒，身热而渴，白虎加人参汤主之。（金匮要\n略。痉湿喝病脉证第二。26）\n\n猪

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经典经方十大方阵 · 方剂演化关系图谱（可编辑）</title>

<style>
:root{--ink:#1b2430;--sub:#5b6675;--line:#e3e8ee;--bg:#f6f8fa;--card:#fff;--red:#a61b1b;--blue:#1f4e79;--grn:#1e8449}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden;display:flex;flex-direction:column;height:100vh}
#topbar{flex:none;min-height:56px;display:flex;align-items:center;gap:8px;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:20;flex-wrap:wrap}
#topbar h1{font-size:15px;margin:0;white-space:nowrap}
#topbar .stat{font-size:12px;color:var(--sub);white-space:nowrap}
#topbar .stat b{color:var(--ink)}
.spacer{flex:1}
label.sw{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;padding:5px 10px;border:1px solid var(--line);border-radius:16px;background:#fbfcfd;user-select:none;white-space:nowrap}
label.sw.on{background:#eaf2fa;border-color:#bcd4ea;font-weight:600;color:var(--blue)}
button.b{border:1px solid var(--line);background:#fbfcfd;color:var(--ink);font-size:12.5px;padding:5px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
button.b:hover{background:#eef4fa}
button.b.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.b.pri:hover{background:#17456b}
button.b.dan{background:#fdf0f0;color:var(--red);border-color:#f0c9c9}
button.b.dan:hover{background:#fbe3e3}
button.b.ok{background:var(--grn);color:#fff;border-color:var(--grn)}
#wrap{position:relative;flex:1;min-height:0}
#chart{width:100%;height:100%}
#legend{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.85;max-width:290px;max-height:calc(100% - 28px);overflow-y:auto;z-index:10}
#legend .t{font-weight:600;color:var(--sub);margin-bottom:4px}
#legend .it{display:flex;align-items:center;gap:7px}
#legend .dot{width:10px;height:10px;border-radius:50%;flex:none}
#legend .ln{width:22px;height:0;border-top:2px solid;flex:none}
#legend .cnt{margin-left:auto;font-size:10.5px;color:#98a1ab;background:#f1f4f8;border-radius:8px;padding:0 6px;flex:none}
.pre{white-space:pre-wrap;font-size:12.5px;line-height:1.85;color:#33414f;background:#fafcfd;border:1px solid #e9eef4;border-radius:6px;padding:8px 10px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
.casebox{border:1px solid #e6ebf1;border-radius:8px;padding:8px 10px;margin:8px 0;background:#fcfdfe}
.casebox .ch{font-size:12px;color:#5b6675;border-bottom:1px dashed #e3e8ee;padding-bottom:4px;margin-bottom:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cf2{display:flex;gap:8px;font-size:12.5px;line-height:1.8;margin:2px 0}
.cf2 .ck{flex:none;width:60px;color:#1f4e79;font-weight:600}
.cf2 .cv{white-space:pre-wrap;color:#33414f}
details summary{cursor:pointer;font-size:12px;color:#a61b1b;margin-top:4px}
#legend .it{cursor:pointer;border-radius:5px;padding:1px 5px}
#legend .it:hover{background:#eef4fa}
#legend .it.lg{opacity:.4}
#legend .it.lg.on{opacity:1;font-weight:600;background:#eaf2fa}
#lgReset{cursor:pointer;color:#a61b1b;margin-top:6px;font-weight:600}
#tip{position:absolute;right:14px;top:12px;font-size:12px;color:var(--sub);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:8px;padding:8px 12px;line-height:1.8;z-index:10;max-width:290px}
#mask{position:fixed;inset:0;background:rgba(18,28,40,.0);display:flex;z-index:100;align-items:center;justify-content:center;padding:24px;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity var(--dur-slow) var(--ease), background-color var(--dur-slow) var(--ease),
             visibility 0s linear var(--dur-slow)}
#mask.on{opacity:1;visibility:visible;pointer-events:auto;background:rgba(18,28,40,.42);
  transition:opacity var(--dur-slow) var(--ease), background-color var(--dur-slow) var(--ease), visibility 0s}
#modal{background:var(--card);width:min(1080px,100%);max-height:90vh;border-radius:12px;display:flex;flex-direction:column;
  box-shadow:0 18px 50px rgba(10,25,45,.28);overflow:hidden;
  transform:translateY(16px) scale(.975);opacity:0;
  transition:transform var(--dur-slow) var(--ease-back), opacity var(--dur-slow) var(--ease)}
#mask.on #modal{transform:translateY(0) scale(1);opacity:1}
#mhead{padding:14px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
#mhead h2{margin:0 0 4px;font-size:18px;color:var(--red)}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;background:#eef3f8;color:var(--blue);margin-right:6px;display:inline-block}
.badge.warn{background:#fdf0e6;color:#b26a00}
#mhead .tools{margin-left:auto;display:flex;gap:6px;flex:none}
#mclose{border:none;background:#f1f4f7;color:var(--sub);width:30px;height:30px;border-radius:50%;font-size:16px;cursor:pointer;flex:none}
#mbody{padding:16px 20px 30px;overflow-y:auto}
.fld{font-size:13px;line-height:1.85;margin:0 0 10px}
.fld .k{display:inline-block;min-width:70px;color:var(--sub);font-weight:600;vertical-align:top}
.fld .v{word-break:break-word}
.fld .v.comp{font-family:Consolas,monospace;font-size:12.5px;color:#25405e}
h3.sec{font-size:13px;margin:18px 0 8px;padding-left:9px;border-left:3px solid var(--blue);color:var(--blue)}
h3.sec.cand{border-left-color:#b9c0c8;color:#6b7684}
table.rel{width:100%;border-collapse:collapse;font-size:12.5px}
table.rel th{background:#f4f7fa;color:var(--sub);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rel td{padding:6px 8px;border-bottom:1px solid #f0f3f7;vertical-align:top}
table.rel .nm{color:var(--red);font-weight:600;white-space:nowrap}
.cf{display:inline-block;font-size:11px;padding:1px 6px;border-radius:9px;background:#eef3f8;color:var(--blue);white-space:nowrap}
.cf.w{background:#f0f2f5;color:#6b7684}
.ev{color:#7b8794;font-size:11.5px}
.empty{color:#98a1ab;font-size:12.5px;padding:6px 0}
/* ---- 编辑态控件 ---- */
input.e,textarea.e,select.e{width:100%;font-family:inherit;font-size:13px;color:var(--ink);border:1px solid #cfd8e3;border-radius:6px;padding:5px 8px;background:#fff}
input.e:focus,textarea.e:focus,select.e:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,78,121,.10)}
textarea.e{line-height:1.8;resize:vertical}
input.e.mini,select.e.mini{font-size:12px;padding:3px 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1.6fr auto;gap:8px;align-items:center}
.addbox{border:1px dashed #bcd4ea;border-radius:8px;padding:10px 12px;background:#f7fbfe;margin:8px 0}
.tagbar{font-size:11.5px;color:var(--sub);margin:2px 0 8px}
#toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%) translateY(20px);background:#1b2430;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:20px;opacity:0;transition:.22s;z-index:200;pointer-events:none}
#toast.on{opacity:.94;transform:translateX(-50%) translateY(0)}
#searchWrap{border-bottom:1px dashed var(--line);padding-bottom:8px;margin-bottom:6px}
#searchBox{width:100%;font-family:inherit;font-size:12.5px;border:1px solid #cfd8e3;border-radius:6px;padding:5px 8px}
#searchBox:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,78,121,.10)}
#searchHits{max-height:190px;overflow-y:auto;margin-top:5px}
#searchHits .hit{display:flex;align-items:center;gap:6px;padding:2px 5px;border-radius:5px;cursor:pointer;font-size:12px}
#searchHits .hit:hover{background:#eef4fa}
#searchHits .hit.sel{background:#e3eef9;box-shadow:inset 2px 0 0 #1f4e79}
#searchHits .hit b{font-weight:600;color:var(--red)}
#searchHits .hit .g{color:#98a1ab;font-size:10.5px;margin-left:auto}
#searchInfo{font-size:11px;color:#98a1ab;margin-top:4px}
/* ---- 连线模式 ---- */
#hintbar{position:absolute;left:50%;top:12px;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.97);border:1px solid #bcd4ea;border-radius:10px;padding:8px 14px;font-size:12.5px;
  box-shadow:0 6px 20px rgba(15,35,60,.12);z-index:15;flex-wrap:wrap;max-width:min(780px,92%);
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translateX(-50%) translateY(-10px) scale(.97);
  transition:opacity var(--dur) var(--ease), transform var(--dur) var(--ease-back),
             visibility 0s linear var(--dur)}
#hintbar.on{opacity:1;visibility:visible;pointer-events:auto;
  transform:translateX(-50%) translateY(0) scale(1);transition-delay:0s}
#hintbar .from{color:#a61b1b;font-weight:700}
#hintbar .hint{color:#5b6675}
#linkPanel{position:fixed;left:50%;top:50%;width:min(580px,94vw);background:#fff;
  border-radius:12px;box-shadow:0 18px 50px rgba(10,25,45,.3);z-index:150;overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate(-50%,-50%) translateY(14px) scale(.97);
  transition:opacity var(--dur-slow) var(--ease), transform var(--dur-slow) var(--ease-back),
             visibility 0s linear var(--dur-slow)}
#linkPanel.on{opacity:1;visibility:visible;pointer-events:auto;
  transform:translate(-50%,-50%) translateY(0) scale(1);transition-delay:0s}
#linkPanel .ph{padding:13px 18px;border-bottom:1px solid var(--line);font-size:14px;font-weight:700;color:#1f4e79}
#linkPanel .pb{padding:14px 18px 18px}
#linkPanel .row{margin-bottom:9px}
#linkPanel .lb{font-size:11.5px;color:#5b6675;margin-bottom:3px}
#linkPanel .ft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#linkPanel .pair{font-size:13px;background:#f7fbfe;border:1px dashed #bcd4ea;border-radius:8px;padding:9px 11px;margin-bottom:12px}
#linkPanel .pair b{color:#a61b1b}
#linkPanel .dirlab{display:inline-block;font-size:12.5px;border:1px solid var(--line);border-radius:16px;
  padding:4px 13px;cursor:pointer;background:#fbfcfd;margin-right:6px}
#linkPanel .dirlab.sel{background:#1f4e79;color:#fff;border-color:#1f4e79}
#linkPanel .dirlab input{display:none}
/* =====================  动效层  =====================
   设计令牌：三档时长 + 四条缓动曲线。全站只用这套，保证节奏一致。
   fast  = 按下／即时反馈
   dur   = 悬停／开关／标签
   slow  = 弹窗／面板进出
   ease     标准减速（绝大多数过渡）
   ease-back 轻微回弹（"弹出来"的观感：弹窗、面板、提示条、开关）
   ease-in   加速离场（收起比展开快，符合直觉）
   ================================================== */
:root{
  --dur-fast:110ms;--dur:190ms;--dur-slow:300ms;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-in:cubic-bezier(.4,0,1,1);
  --ease-back:cubic-bezier(.34,1.28,.64,1);
}
/* ① 统一过渡属性集合：可交互元素共享同一套，避免各处时长不一 */
button.b,label.sw,#legend .it,#legend .dot,details summary,#searchHits .hit,
#searchBox,input.e,textarea.e,select.e,.dirlab,.badge,.casebox{
  transition-property:background-color,border-color,color,box-shadow,transform,opacity;
  transition-duration:var(--dur);
  transition-timing-function:var(--ease);
}
/* ② 按钮：悬停微抬 + 按下回弹（点击的"手感"） */
button.b{will-change:transform}
button.b:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(15,35,60,.10)}
button.b:active{transform:translateY(0) scale(.955);box-shadow:none;transition-duration:var(--dur-fast)}
button.b.pri:hover,button.b.ok:hover{box-shadow:0 4px 14px rgba(31,78,121,.26)}
button.b.dan:hover{box-shadow:0 4px 14px rgba(166,27,27,.20)}
button.b:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(31,78,121,.22)}
/* ③ 开关胶囊 */
label.sw{will-change:transform}
label.sw:hover{background:#eef4fa;border-color:#cfdbe8}
label.sw:active{transform:scale(.975)}
label.sw input{transition:transform var(--dur) var(--ease-back)}
label.sw input:checked{transform:scale(1.18)}
label.sw.on{box-shadow:0 0 0 3px rgba(31,78,121,.07)}
/* ④ 图例：悬停横移 + 色点放大 + 选中左侧标记 */
#legend .it:hover{transform:translateX(2px)}
#legend .dot{transition:transform var(--dur) var(--ease-back),opacity var(--dur) var(--ease)}
#legend .it:hover .dot{transform:scale(1.32)}
#legend .it.lg{transition:opacity var(--dur) var(--ease),background-color var(--dur) var(--ease),transform var(--dur) var(--ease)}
#legend .it.lg.on{box-shadow:inset 2px 0 0 #1f4e79}
#lgReset:hover{transform:translateX(2px);color:#7d1414}
/* ⑤ 输入控件 */
#searchBox:hover,input.e:hover,textarea.e:hover,select.e:hover{border-color:#bcd4ea}
input.e:focus,textarea.e:focus,select.e:focus,#searchBox:focus{transition-duration:var(--dur-fast)}
/* ⑥ 搜索命中项 */
#searchHits .hit:hover{transform:translateX(2px)}
/* ⑦ 医案卡片：轻微浮起 */
.casebox:hover{border-color:#cfe0f0;box-shadow:0 3px 12px rgba(15,35,60,.06);transform:translateY(-1px)}
/* ⑧ 弹窗／面板／提示条：抬起时加速，落下时回弹 */
#mask,#modal,#linkPanel,#hintbar{will-change:opacity,transform}
/* ⑨ 关系编辑框与方向标签 */
.dirlab:hover{border-color:#bcd4ea;background:#eef4fa}
.dirlab.sel{transition-duration:var(--dur-fast)}
.addbox{transition:border-color var(--dur) var(--ease),background-color var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.addbox:hover{border-color:#9fc6ea}
/* ⑩ 右上角的「已锁定」红色标识 —— 点它解锁 */
#tipLock{margin-top:5px}
.lockbadge{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;
  background:#fdf0f0;color:#a61b1b;border:1px solid #f0c9c9;border-radius:14px;
  padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap;
  transition:background-color var(--dur) var(--ease),border-color var(--dur) var(--ease),
             color var(--dur) var(--ease),box-shadow var(--dur) var(--ease),
             transform var(--dur-fast) var(--ease)}
.lockbadge:hover{background:#fbe3e3;border-color:#e5a9a9;box-shadow:0 3px 12px rgba(166,27,27,.20)}
.lockbadge:active{transform:scale(.955)}
.lockbadge:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(166,27,27,.22)}
.lockbadge .x{font-weight:800;font-size:13px;line-height:1}
details summary{transition-duration:var(--dur-fast)}
details summary:hover{color:#7d1414}
/* ⑩ 滚动条也统一质感 */
#mbody::-webkit-scrollbar,#legend::-webkit-scrollbar,#searchHits::-webkit-scrollbar{width:10px}
#mbody::-webkit-scrollbar-thumb,#legend::-webkit-scrollbar-thumb,#searchHits::-webkit-scrollbar-thumb{
  background:#d7dfe8;border-radius:6px;border:3px solid #fff}
#mbody::-webkit-scrollbar-thumb:hover,#legend::-webkit-scrollbar-thumb:hover{background:#c2ccd8}
/* ⑪ 尊重系统「减少动态效果」偏好 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:1ms !important;animation-duration:1ms !important}
}
</style></head><body>
<div id="topbar">
  <h1>经典经方十大方阵 · 方剂演化关系图谱</h1>
  <span class="stat" id="stat"></span><span class="spacer"></span>
  <label class="sw" id="lbEdit" title="开启后可修改任何内容；改动需点弹窗里的「保存本节点」才生效"><input type="checkbox" id="cbEdit"> ✎ 编辑模式</label>
  <label class="sw" id="lbLink" title="开启后依次点两个方剂即可连线，可自选关系类型"><input type="checkbox" id="cbLink"> 🔗 连线模式</label>
  <label class="sw" title="显示虚线画出的候选关系（仅供参考，不作演化依据）"><input type="checkbox" id="cbCand"> 显示候选关系</label>
  <label class="sw" title="把没有任何关系的孤立方剂从图上隐去，画面更清爽"><input type="checkbox" id="cbIso"> 隐藏无主图关系节点</label>
  <label class="sw" title="焦点方剂在图中时，一并显示它的上下游相邻方"><input type="checkbox" id="cbAdj" checked> 带出上下游相邻方</label>
  <label class="sw" title="在节点上显示方名（密集时只显示部分）"><input type="checkbox" id="cbLab" checked> 显示方名标注</label>
  <button class="b pri" id="btnView" title="在「向日葵视图」与「连线视图」之间切换（数据是同一份）">⇄ 切到连线视图</button>
  <button class="b" id="btnNew" title="新建一个方剂节点（仅在编辑模式下可用）">＋ 新建方剂</button>
  <button class="b pri" id="btnSave" title="保存到本机浏览器（刷新后自动恢复）；快捷键 Ctrl+S">保存</button>
  <button class="b" id="btnSaveFile" title="把当前全部修改写进一份新的 HTML 文件并下载，用它覆盖原文件即可永久生效">保存为 HTML</button>
  <button class="b" id="btnExport" title="导出为 JSON 备份文件（可跨电脑导入）">导出 JSON</button>
  <button class="b" id="btnImport" title="从 JSON 备份文件导入修改">导入 JSON</button>
  <button class="b dan" id="btnReset" title="清除本机保存的全部修改，回到初始数据">还原</button>
  <input type="file" id="fileIn" accept=".json" style="display:none">
</div>
<div id="wrap"><div id="chart"></div>
  <div id="hintbar"></div>
  <div id="legend">
    <div id="searchWrap">
      <div class="t">搜索方剂</div>
      <input id="searchBox" placeholder="输入方名／药味／方阵…（回车定位）">
      <div id="searchHits"></div>
      <div id="searchInfo"></div>
    </div>
    <div class="t">图例</div><div id="legendBody"></div>
  </div>
  <div id="tip">拖拽节点 · 滚轮缩放 · 空白平移<br>点击节点查看／编辑全部内容<br><span id="tipEdit"></span><div id="tipLock"></div></div>
</div>
<div id="linkPanel">
  <div class="ph">🔗 连线</div>
  <div class="pb" id="linkBody"></div>
</div>
<div id="mask"><div id="modal">
  <div id="mhead"><div><h2 id="mname">—</h2><div id="mtags"></div></div>
  <div class="tools" id="mtools"></div>
  <button id="mclose">✕</button></div>
  <div id="mbody"></div>
</div></div>
<div id="toast"></div>
<script>

const nodes           = [{"name":"桂枝汤","sourceBooks":"《经典经方十大方阵》、《经典经方十大方阵》正文、《经典经方方解》＋《经典经方方解》","primaryGroup":"桂枝方阵","subGroup":"桂枝汤衍化","composition":"桂枝18生姜18炒甘草12白芍药18大枣24秫米48","mainTreat":"太阳中风，阳浮而阴弱，阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣，干呕者，桂枝汤主之。[宋12]\n太阳病，头痛发热，汗出恶风，桂枝汤主之。[宋13]\n\n太阳病，发热，汗出者，此为荣弱卫强，故使汗出。欲救邪风者，宜桂枝汤。[宋95]\n太阳病，外证未解，脉浮弱者，当以汗解，宜桂枝汤。[宋42]\n太阳病，外证未解，不可下也，下之为逆。欲解外者，宜桂枝汤。[宋44]\n太阳病，先发汗不解，而复下之，脉浮者，为不愈。浮为在外，而反下之，故令不愈也。今脉浮，故知在外，当须解外则愈，宜桂枝汤。[宋45]\n病人，脏无他病，时发热，自汗出而不愈者，此为卫气不和也。先其时发汗则愈，宜桂枝汤。[宋54]\n病常自汗出者，此为荣气和，荣气和者，外不谐，以卫气不共荣气谐和故尔。以荣行脉中，卫行脉外。复发其汗，荣卫和则愈，宜桂枝汤。[宋53]\n伤寒，发汗，已解，半日许复烦，脉浮数者，可更发汗，宜桂枝汤。[宋57]\n阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜桂枝汤。[宋234]\n病人烦热，汗出则解，又如疟状，日晡所发热者，属阳明也。脉实者，宜下之；脉浮虚者，宜发汗。下之，与大承气汤；发汗宜桂枝汤。[宋240]\n太阴病，脉浮者，可发汗，宜桂枝汤。[宋276];吐利止，而身痛不休者，当消息和解其外。宜桂枝汤小和之。[宋387]\n下利，腹胀满，身体疼痛者，当先温其里，乃攻其表。温里，宜四","originalEntry":"【方名】桂枝汤　【所属】桂枝方阵 ／ 桂枝汤衍化\n【组成】桂枝18生姜18炒甘草12白芍18大枣24秫米48\n【组成（原书）】桂枝三两（去皮）芍药三两甘草二两（炙）生姜三两（切）大枣十二枚（擘）\n【方干】桂枝甘草汤，芍药甘草汤，甘麦大枣汤\n【方眼】桂枝甘草汤\n【方势】温煦解表，降逆化饮，补虚温胃\n【方效】解表祛邪，调和营卫，温中降逆，解肌缓急\n【讲义论述】当水饮血痹逐渐加重，桂枝汤不能更好地去温中推动的时候，就把桂枝汤加上黄芪，因为黄芪可以发汗可以祛湿，所以当水饮血痹产生一个邪风水病为主的时候我们一定要加黄芪去除水，黄芪是除水的药，所以黄芪并不是一个绝对补益的药，无表证不用黄芪，无水湿不用黄芪\n【讲义论述】太阳中风以表束+表阳+表虚为基础，并且这个表阳是以热为主要表现的，所以《伤寒论》中桂枝汤证条文很多，但只有在太阳中风层面会有发热，有无发热也是鉴别太阳桂枝证和它经桂枝证的主要区别点\n【原书正文】桂枝汤我们来看一下桂枝汤（桂枝 18 生姜 18 炒甘草 12 白芍药 18 大枣 24 秫米 48）的条文，见于《伤寒论》的 12 条、13 条、2 条：“太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。 ”“太阳病，头痛发热，汗出恶风者，桂枝汤主之。 ”“太阳病，发热，汗出，恶风，脉缓者，名为中风。”中风是太阳病的一个分型， 太阳病是津血凝滞在表， 表上的津血不能去温煦防御而产生的表病，中风和伤寒正好相反，伤寒是表上津血凝滞，而中风是津液外泄，腠理洞开，津液外泄的状态，和寒邪凝塞痹阻状态是两种状态。阳浮告诉我们为什么桂枝汤证可以见到发热，因为阳气卫阳浮越在表了， 人体的体表是会发热的， 阴弱是营气营血不足了， 所以说除了发热桂枝汤会有很多里证出现，比如说脉是缓的，干呕，里面的津液出现敷布的异常。太阳中风处在一个津亏液少血弱而有表邪而有表寒而卫阳被痹阻，他的津血是相对不足的，但是表寒一个实寒存在的，急需要桂枝甘草汤来发越实寒， 也需要用芍药甘草汤补益津血， 同样桂枝汤又可见于 《伤寒论》276 条“太阴病， 脉浮者，可发汗，宜桂枝汤“”。明确告诉我们太阴病可以用桂枝汤，这就告诉我们六病都有中风，中风只要处在从卫阳，让津液温煦的时候就可以用阳旦法，“太阴中风，四肢烦疼，脉阳微阴涩而长者，为欲愈”。因为太阴中风这个病是处在津血更亏，不但津血亏了他胃气也弱了，所以280 条告诉我们“太阴为病，脉弱，其人续自便利，设当行大黄、芍药者，宜减之。以其人胃气弱，易动故也。 ”续自便利是胃气弱了嘛，是不是太阳中风和太阴中风就一个区别，太阳中风+胃弱就是太阴中风。但是呢方证多维，桂枝汤也可以治疗胃弱，因为他包含了多半张生姜甘草汤方根在里面，所以说治疗太阳中风的方子也可以治疗太阴中风，这就是说为什么很多太阳病和太阴病可以用一样的方子去解决，不过不是说太阳病和太阴病是一样的，而是说在方证多维的统摄之下，只要是胃弱的方子能照顾到胃，就可以去解表可以用它来治疗很多表病，为什么这个病会出现阳微阴涩而长呢？脉阳微是表上的卫阳不能去温煦了，阴涩是里面的瘀血少了，这时候会特别容易产生风寒的侵袭，风寒侵袭就会导致中风的出现，如果患者脉有变长就有趋表趋阳向愈的方向，为什么呢？因为脉为血之父，脉长了证明营血多起来了，那么就可以去表位防御温煦祛邪外出。正如刚才所讲太阳中风和太阴中风都是津亏液少血弱，但是太阴中风多了一个胃虚，别的层面是完全一样，所以在看《伤寒论》的时候桂枝汤的条文有很多条，治太阳中风的不过三两条而已，大部分都是治它经中风的。桂枝汤的条文跟大家解读一下，因为开手第一方嘛，煎服方法，“以水七升，微火煮取三升，去滓，适寒温，服一升，这是常规的煎服方法，服已须臾，啜热稀粥一升余，以助药力，温覆令一时许，遍身漐漐，微似有汗者益佳，不可令如水流漓，病必不除”。按照我的经验，其实桂枝汤不盖被子发汗可能性比较小，如果治太阴中风不需要发大汗的话可以吃上药不用盖被子，如果治太阳中风的发热性疾病，你让患者吃上药以后喝一碗稀粥，或者面条也可以，然后盖上被子出汗，然后就会随着汗出热降，并且退烧非常迅速。后来的注家都在不可令如水流漓作文章，认为发大汗以后，病必不除，其实所有问题都是辩证去看的，如果表寒困束的太阳病你就让他发大汗，为什么？因为汗出不撤转出阳明，本来太阳病就是发大汗的，什么时候不可令如水流漓呢？除了太阳中风别的中风不可令如水流漓，因为比如说太阴中风本来就津血更虚了，胃气弱了不利于人体津血的恢复，若一服汗出病差， 停后服， 不必尽剂； 这个大家都知道， 若不汗， 更服依前法； 又不汗， 后服小促其间，半日许，令三服尽。这个代表所有经方的服法，后面的葛根汤就说后方皆仿此，就是说所有经方都是半日功夫就可以吃三剂，这就从另一个侧面告诉我们在汉代经方剂量并不大的，并不是我们后来认为的一两等于 15.625 克， 而是一两是6 克左右， 这个考证我给大家讲过。后面还有一个若病重者，一日一夜服，周时观之。就是说如果和个人病重的话，吃药怎么吃呢？就是白天吃三次，晚上吃三次，白天吃药以后晚上继续按照白天的方法去服药，让药力相续，这样才能解病，当然是重症或者急治的患者这样服药，而不是像现在，三餐饭后服，晚上睡觉，那样治重病之不行的。后面的也挺有意思，桂枝汤的禁忌，禁生冷、粘滑、肉面、五辛、酒酪、臭恶等物。这段话什么意思呢？其实这段话就折射了经方的作用机理，就是经方用什么治病的？用气味来治病的，就是用四气五味来治病的，所以对气味的变化是非常重视的，比如说为什么桂枝汤要忌这些东西？生冷是加重了里面芍药法的力度，那么就牵制了桂枝发表的力度，粘滑是增加了芍药甘草汤胃中增加胃津的作用，牵制了发散卫阳的效果，肉面是补益养血的，加重了芍药法和生姜甘草汤法的药势，那就牵制了辛泄的力度，五辛加重了桂枝甘草汤里面辛散的力度，那么就牵制了芍药甘草汤濡养的力度，酒酪，酒是辛散的加重辛散，酪是酸寒的加重了芍药酸敛的力度，臭恶是一些奇奇怪怪的味道的食物，比如有些同学喜欢吃臭豆腐，按照中医养生来讲的话，不主张吃的，因为可以让我们胃气不清宁， 容易被浊气所损伤， 正是因为养病， 你的胃气清宁你才养的好病， 就不要吃这些臭恶等物。桂枝汤如果拆开来看的话包含了三个主要方干，一个是桂枝甘草汤可以温表散寒，温煦营血，一个是芍药甘草汤可以濡养津血， 一个是生姜甘草汤可以暖胃补中， 桂枝汤方势： 温卫散寒， 养营和血，调和营卫，和解寒热，这是在营卫和津血上表达方势，前面是本来对津血的调动是一种什么药势和方向，后面是他对邪气的驱除功效，可以解表祛邪，平冲降逆，补虚温胃，宣通阳气。","note":"本方阵内药味重叠（仅供人工复核，不作演化依据）：桂枝加芍药汤(重叠5味)；桂枝加桂汤(重叠5味)；桂枝加黄芪汤(重叠5味)；桂枝加附子汤(重叠5味)；千金桂枝加黄芩汤(重叠5味)；桂枝去芍药汤(重叠4味)","_prose":"桂枝汤我们来看一下桂枝汤（桂枝 18 生姜 18 炒甘草 12 白芍药 18 大枣 24 秫米 48）的条文，见于《伤寒论》的 12 条、13 条、2 条：“太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。 ”“太阳病，头痛发热，汗出恶风者，桂枝汤主之。 ”“太阳病，发热，汗出，恶风，脉缓者，名为中风。”中风是太阳病的一个分型， 太阳病是津血凝滞在表， 表上的津血不能去温煦防御而产生的表病，中风和伤寒正好相反，伤寒是表上津血凝滞，而中风是津液外泄，腠理洞开，津液外泄的状态，和寒邪凝塞痹阻状态是两种状态。阳浮告诉我们为什么桂枝汤证可以见到发热，因为阳气卫阳浮越在表了， 人体的体表是会发热的， 阴弱是营气营血不足了， 所以说除了发热桂枝汤会有很多里证出现，比如说脉是缓的，干呕，里面的津液出现敷布的异常。太阳中风处在一个津亏液少血弱而有表邪而有表寒而卫阳被痹阻，他的津血是相对不足的，但是表寒一个实寒存在的，急需要桂枝甘草汤来发越实寒， 也需要用芍药甘草汤补益津血， 同样桂枝汤又可见于 《伤寒论》276 条“太阴病， 脉浮者，可发汗，宜桂枝汤“”。明确告诉我们太阴病可以用桂枝汤，这就告诉我们六病都有中风，中风只要处在从卫阳，让津液温煦的时候就可以用阳旦法，“太阴中风，四肢烦疼，脉阳微阴涩而长者，为欲愈”。因为太阴中风这个病是处在津血更亏，不但津血亏了他胃气也弱了，所以280 条告诉我们“太阴为病，脉弱，其人续自便利，设当行大黄、芍药者，宜减之。以其人胃气弱，易动故也。 ”续自便利是胃气弱了嘛，是不是太阳中风和太阴中风就一个区别，太阳中风+胃弱就是太阴中风。但是呢方证多维，桂枝汤也可以治疗胃弱，因为他包含了多半张生姜甘草汤方根在里面，所以说治疗太阳中风的方子也可以治疗太阴中风，这就是说为什么很多太阳病和太阴病可以用一样的方子去解决，不过不是说太阳病和太阴病是一样的，而是说在方证多维的统摄之下，只要是胃弱的方子能照顾到胃，就可以去解表可以用它来治疗很多表病，为什么这个病会出现阳微阴涩而长呢？脉阳微是表上的卫阳不能去温煦了，阴涩是里面的瘀血少了，这时候会特别容易产生风寒的侵袭，风寒侵袭就会导致中风的出现，如果患者脉有变长就有趋表趋阳向愈的方向，为什么呢？因为脉为血之父，脉长了证明营血多起来了，那么就可以去表位防御温煦祛邪外出。正如刚才所讲太阳中风和太阴中风都是津亏液少血弱，但是太阴中风多了一个胃虚，别的层面是完全一样，所以在看《伤寒论》的时候桂枝汤的条文有很多条，治太阳中风的不过三两条而已，大部分都是治它经中风的。桂枝汤的条文跟大家解读一下，因为开手第一方嘛，煎服方法，“以水七升，微火煮取三升，去滓，适寒温，服一升，这是常规的煎服方法，服已须臾，啜热稀粥一升余，以助药力，温覆令一时许，遍身漐漐，微似有汗者益佳，不可令如水流漓，病必不除”。按照我的经验，其实桂枝汤不盖被子发汗可能性比较小，如果治太阴中风不需要发大汗的话可以吃上药不用盖被子，如果治太阳中风的发热性疾病，你让患者吃上药以后喝一碗稀粥，或者面条也可以，然后盖上被子出汗，然后就会随着汗出热降，并且退烧非常迅速。后来的注家都在不可令如水流漓作文章，认为发大汗以后，病必不除，其实所有问题都是辩证去看的，如果表寒困束的太阳病你就让他发大汗，为什么？因为汗出不撤转出阳明，本来太阳病就是发大汗的，什么时候不可令如水流漓呢？除了太阳中风别的中风不可令如水流漓，因为比如说太阴中风本来就津血更虚了，胃气弱了不利于人体津血的恢复，若一服汗出病差， 停后服， 不必尽剂； 这个大家都知道， 若不汗， 更服依前法； 又不汗， 后服小促其间，半日许，令三服尽。这个代表所有经方的服法，后面的葛根汤就说后方皆仿此，就是说所有经方都是半日功夫就可以吃三剂，这就从另一个侧面告诉我们在汉代经方剂量并不大的，并不是我们后来认为的一两等于 15.625 克， 而是一两是6 克左右， 这个考证我给大家讲过。后面还有一个若病重者，一日一夜服，周时观之。就是说如果和个人病重的话，吃药怎么吃呢？就是白天吃三次，晚上吃三次，白天吃药以后晚上继续按照白天的方法去服药，让药力相续，这样才能解病，当然是重症或者急治的患者这样服药，而不是像现在，三餐饭后服，晚上睡觉，那样治重病之不行的。后面的也挺有意思，桂枝汤的禁忌，禁生冷、粘滑、肉面、五辛、酒酪、臭恶等物。这段话什么意思呢？其实这段话就折射了经方的作用机理，就是经方用什么治病的？用气味来治病的，就是用四气五味来治病的，所以对气味的变化是非常重视的，比如说为什么桂枝汤要忌这些东西？生冷是加重了里面芍药法的力度，那么就牵制了桂枝发表的力度，粘滑是增加了芍药甘草汤胃中增加胃津的作用，牵制了发散卫阳的效果，肉面是补益养血的，加重了芍药法和生姜甘草汤法的药势，那就牵制了辛泄的力度，五辛加重了桂枝甘草汤里面辛散的力度，那么就牵制了芍药甘草汤濡养的力度，酒酪，酒是辛散的加重辛散，酪是酸寒的加重了芍药酸敛的力度，臭恶是一些奇奇怪怪的味道的食物，比如有些同学喜欢吃臭豆腐，按照中医养生来讲的话，不主张吃的，因为可以让我们胃气不清宁， 容易被浊气所损伤， 正是因为养病， 你的胃气清宁你才养的好病， 就不要吃这些臭恶等物。桂枝汤如果拆开来看的话包含了三个主要方干，一个是桂枝甘草汤可以温表散寒，温煦营血，一个是芍药甘草汤可以濡养津血， 一个是生姜甘草汤可以暖胃补中， 桂枝汤方势： 温卫散寒， 养营和血，调和营卫，和解寒热，这是在营卫和津血上表达方势，前面是本来对津血的调动是一种什么药势和方向，后面是他对邪气的驱除功效，可以解表祛邪，平冲降逆，补虚温胃，宣通阳气。","_proseLen":2361,"_compOld":"桂枝18生姜18炒甘草12白芍18大枣24秫米48","_dm":48,"_dc":0,"_orphan":false,"_nc":36},{"name":"黄芩汤","sourceBooks":"《经典经方十大方阵》正文（本阵章节内论述）","primaryGroup":"桂枝方阵","subGroup":"（原书正文在本阵章节内论述，未列入目录二级子类）","composition":"黄芩18白芍药12炒甘草12大枣24","mainTreat":"黄芩汤方\n黄芩三两芍药二两甘草二两（炙）大枣十二枚（擘）\n右四味，以水六升，煮取三升，去滓，温服一升，日再，夜一服。\n太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。[宋172]\n伤寒脉迟六七日，而反与黄芩汤彻其热，脉迟为寒，今与黄芩汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死。[宋333]","originalEntry":"【方名】黄芩汤　【所属】桂枝方阵 ／ （原书正文在本阵章节内论述，未列入目录二级子类）\n【原文】太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。(宋172)伤寒脉迟六七日，而反与黄芩汤彻其热，脉迟为寒，今与黄芩汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死。(宋333)\n【组成】黄芩18白芍12炒甘草12大枣24\n【组成（原书）】葛根四两麻黄一两黄芩芍药甘草各二两大枣十二枚\n【组成（原书）】黄芩三两芍药二两甘草二两炙半夏半升洗生姜三两切（一方一两半）\n【组成（原书）】黄芩三两芍药二两甘草二两炙大枣十二枚擘\n【组成（原书）】甘草炙干地黄麦门冬去心前胡黄芩麻黄去节栝蒌根各二升川芎一两\n【组成（原书）】甘草一两炙升麻石膏碎牡丹皮各一两\n【方干】半个黄芩汤甘草麻黄汤\n【方眼】黄芩汤甘草麻黄汤\n【方势】宣发透表解肌养津，散结除水，解毒止利。\n【讲义论述】伤寒脉迟六七日，而反与黄芩汤彻其热，脉迟为寒，今与黄芩汤复除其热，腹中应冷，当不能食，今反能食，此名除中，必死\n【原书正文】黄芩汤、黄芩加半夏生姜汤我们比较一下从阳旦汤演化到阴旦汤，阳旦汤和阴旦汤的区别就是桂枝汤去桂枝加黄芩就是阴旦汤，那么就要比对一下桂枝和黄芩的区别，这个不管是从性味上还是功效上，都是阴阳对应泾渭分明的一种对应关系。一个是对治津血虚寒表位的津血被表位的津虚困束所致，一个是对治里位的实热，津血被里位实热灼伤，导致表里的不安不和。那么这种特点是怎么形成的呢？我们看《伤寒论》172 条，太阳与少阳合病，自下利者与黄芩汤（黄芩 18 白芍药 12 炒甘草 12 大枣 24）；下利好像是阴病水病，跟火热不一样了吧，若呕者黄芩加半夏生姜汤（黄芩 18 白芍药 12 炒甘草 12 大枣 24 生姜 9 半夏 24）主之。除了治火也能治水，那么这种呕逆跟桂枝汤的呕逆是对应关系的，我们知道桂枝汤可以鼻鸣干呕，是因为上焦和表位被寒邪困束气机不畅所以鼻鸣干呕，而黄芩汤是里位失和火热灼伤津血可以下利而呕，所以一表一里症状是相似的，所以我经常讲阳旦的体系会出现什么症候群，在阴旦层面也一定会出现，它是一种阴阳对应关系，这就是中医辨的一种玄妙所在，你辨的是类似的症状后面阴阳的不同分类方法。其实《金匮》中干呕而利也是用了黄芩加半夏生姜汤， 不是单纯的火证也不是单纯的火证伤血或者火证伤津， 它一样可以引起一些水的现象， 水逆啦、呕逆啦、吐水都可可以，所以就是从单纯治火证的方子演化成跟阳旦汤对应的关系。比如说桂枝汤可以治疗表寒，但是当他演化成桂枝加芍药汤就不仅可以治疗里寒还可以治疗津血的虚弱，那当里的津血再虚的时候就可以演化成小建中汤，而里的津血是实热呢就可以演化成桂枝加大黄汤。那么一定黄芩汤也是这么演化的，在阴阳对应关系上具有这种规律，再说其实这个条文是错简，为什么这么讲呢？在所有的仲景条文中有个规律就是主之在前，与在后，这样才符合它的行文特点，这个错简调整以后应该是这样的，太阳与少阳合病，自下利若呕者黄芩加半夏生姜汤主之，不呕者与黄芩汤。主之在前，与在后，这是仲景的行文特点，我们把这个条文解读以后就知道这个阴旦汤的地位，在桂枝汤演化那么多方子才是我们在桂枝类方去左右逢源的去解表散寒，去养血去除痹，治疗虚劳或者症瘕积聚，阴旦体系一定也可以这么做的，也可以治疗虚劳，可以治疗水火的冲逆，可以治疗人体的津血在表里的不安不和的各种症候群，水火气血的各种分类方法，那么我会在下面的讲课中逐步抽丝剥茧。黄芩理水类方（偏里）千金阴旦解肌汤在千金方中唐本《伤寒论》中从阴旦角度发散风寒，发散表上的风寒、寒湿、邪气，我们大家都知道如果是在阳的层面上出现寒邪伤阳气，导致了伤寒或温病，经方常用一个方子，叫葛根汤，葛根汤就是阳旦汤桂枝汤加葛根和麻黄，当他不适合阳旦汤来解，不是津液的不能温煦不能防御不能推动，而是不能濡养和敛降的时候，你还能用阳旦吗？肯定不行，那么怎么办呢？去掉桂枝把桂枝汤转换成黄芩汤， 这就是一个在阴旦方面去解温发表的基础方千金阴旦解肌汤 （麻黄 6 葛根 24 黄芩 12 白芍 12 甘草 12 大枣 24），这个方子非常好用，大家知道去年在发热门诊查方，大批发热患者都是一到三剂完全退烧的，那么其中就有这个方子，只要精准辨证的话，在阴旦体系中解表上的风寒非常好用的， 避桂， 因为阳盛立毙， 当里阳充滞的时候不能用桂枝的， 但是可以把桂枝换成黄芩，那么这就是这个方子的演化规律以及和阳旦汤的特点。","note":"本方在原书「桂枝方阵」章节内被论述，据此归入本阵；原书未给单独（方干）／（方眼），故仅按章节归属建立边","_prose":"黄芩汤、黄芩加半夏生姜汤我们比较一下从阳旦汤演化到阴旦汤，阳旦汤和阴旦汤的区别就是桂枝汤去桂枝加黄芩就是阴旦汤，那么就要比对一下桂枝和黄芩的区别，这个不管是从性味上还是功效上，都是阴阳对应泾渭分明的一种对应关系。一个是对治津血虚寒表位的津血被表位的津虚困束所致，一个是对治里位的实热，津血被里位实热灼伤，导致表里的不安不和。那么这种特点是怎么形成的呢？我们看《伤寒论》172 条，太阳与少阳合病，自下利者与黄芩汤（黄芩 18 白芍药 12 炒甘草 12 大枣 24）；下利好像是阴病水病，跟火热不一样了吧，若呕者黄芩加半夏生姜汤（黄芩 18 白芍药 12 炒甘草 12 大枣 24 生姜 9 半夏 24）主之。除了治火也能治水，那么这种呕逆跟桂枝汤的呕逆是对应关系的，我们知道桂枝汤可以鼻鸣干呕，是因为上焦和表位被寒邪困束气机不畅所以鼻鸣干呕，而黄芩汤是里位失和火热灼伤津血可以下利而呕，所以一表一里症状是相似的，所以我经常讲阳旦的体系会出现什么症候群，在阴旦层面也一定会出现，它是一种阴阳对应关系，这就是中医辨的一种玄妙所在，你辨的是类似的症状后面阴阳的不同分类方法。其实《金匮》中干呕而利也是用了黄芩加半夏生姜汤， 不是单纯的火证也不是单纯的火证伤血或者火证伤津， 它一样可以引起一些水的现象， 水逆啦、呕逆啦、吐水都可可以，所以就是从单纯治火证的方子演化成跟阳旦汤对应的关系。比如说桂枝汤可以治疗表寒，但是当他演化成桂枝加芍药汤就不仅可以治疗里寒还可以治疗津血的虚弱，那当里的津血再虚的时候就可以演化成小建中汤，而里的津血是实热呢就可以演化成桂枝加大黄汤。那么一定黄芩汤也是这么演化的，在阴阳对应关系上具有这种规律，再说其实这个条文是错简，为什么这么讲呢？在所有的仲景条文中有个规律就是主之在前，与在后，这样才符合它的行文特点，这个错简调整以后应该是这样的，太阳与少阳合病，自下利若呕者黄芩加半夏生姜汤主之，不呕者与黄芩汤。主之在前，与在后，这是仲景的行文特点，我们把这个条文解读以后就知道这个阴旦汤的地位，在桂枝汤演化那么多方子才是我们在桂枝类方去左右逢源的去解表散寒，去养血去除痹，治疗虚劳或者症瘕积聚，阴旦体系一定也可以这么做的，也可以治疗虚劳，可以治疗水火的冲逆，可以治疗人体的津血在表里的不安不和的各种症候群，水火气血的各种分类方法，那么我会在下面的讲课中逐步抽丝剥茧。黄芩理水类方（偏里）千金阴旦解肌汤在千金方中唐本《伤寒论》中从阴旦角度发散风寒，发散表上的风寒、寒湿、邪气，我们大家都知道如果是在阳的层面上出现寒邪伤阳气，导致了伤寒或温病，经方常用一个方子，叫葛根汤，葛根汤就是阳旦汤桂枝汤加葛根和麻黄，当他不适合阳旦汤来解，不是津液的不能温煦不能防御不能推动，而是不能濡养和敛降的时候，你还能用阳旦吗？肯定不行，那么怎么办呢？去掉桂枝把桂枝汤转换成黄芩汤， 这就是一个在阴旦方面去解温发表的基础方千金阴旦解肌汤 （麻黄 6 葛根 24 黄芩 12 白芍 12 甘草 12 大枣 24），这个方子非常好用，大家知道去年在发热门诊查方，大批发热患者都是一到三剂完全退烧的，那么其中就有这个方子，只要精准辨证的话，在阴旦体系中解表上的风寒非常好用的， 避桂， 因为阳盛立毙， 当里阳充滞的时候不能用桂枝的， 但是可以把桂枝换成黄芩，那么这就是这个方子的演化规律以及和阳旦汤的特点。","_proseLen":1398,"_compOld":"黄芩18白芍12炒甘草12大枣24","_dm":41,"_dc":58,"_orphan":false,"_nc":28}];

n少腹与腰部畏寒。怎么解释啊\n因为这个畏寒所以要用薤白和桂枝\n留气是金匮的而一个概念\n阳郁是后世创造的名词\n随便添加是中医的弊病\n寒热不同\n留气而泄利下重，偏热者（少阳阳明为主），用四逆散，偏寒者（少阴太阴为主）用枳实薤白桂枝汤\n真的恍然大明白啊\n少腹两侧轮流闷，小便黄，用力时牙龈出血，睡眠多梦（烦躁？）··许老师能不能理解为淤血？？\n淤血，属于经方阴伏的概念\n需要四诊和参\n哦，那是不是太阴+留气就会大便不爽\n胸闷，有几十个方证会出现\n太阳病误下会出现，如桂枝去芍药汤证\n阳明里实会出现，如承气汤证\n少阳的小柴胡汤证会出现\n湿家会有、支饮会有、寒疝会有","hasDose":false,"patient":"男，34岁，2013年5月13日就诊","symptom":"主诉：大便不爽，一天2~4次，最终也排不净。","exam":"","prescription":"","effect":""},{"caseId":"Y0200","caseSource":"方证医案集·晓辉整理版／桂枝加厚朴杏子汤医案集.doc","caseType":"案集医案","归集方":"桂枝加厚朴杏子汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"张凤萍，女，44岁，腹胀一年，子宫肌瘤2-3年，大便难。 恶风恶寒，无手脚凉麻，偶有头晕头痛，口干口苦，饮多饮温，汗多，汗后无明显寒热，纳可，饭后气往上冲，无呕吐，有恶心，偶有肠鸣，腹胀，不痛，平日都胀，大便日行一次，量少，感觉不够力，先干后溏，小便色黄，量可，偶有起夜，月经周期25-26天，行经7—8天，量可，色前后两天黑，中间几天鲜红，经行腹痛，经前期也腹痛，腰酸，经前乳房胀痛，睡觉梦多，睡不沉，下肢无按肿，无肌肤甲错，右踝崴有肿微热不红，舌淡紫苔灰黑略黄不厚边有齿痕，脉沉滞良久才来，孕2育1流1，是有胸闷，脸上一圈雀斑。\n此案的病机是营卫不和、营血不足而有结气，营卫不和则汗多脚踝肿而微热，不但有营卫不和了，还兼有比营卫不和更深一层的病机营血不足的层面，故不能温养的则恶寒恶风，不能濡养则面斑经血不利经行腹痛；营血不足营卫失和则卫气入营受碍，故眠浅多梦；再加上结气在内则胸闷腹胀肠鸣腹胀；此案费神之处在于①大便难的问题，此种腹满便难不是阳明典型的燥烦满实大便难，而是表不和和里气结之病机导致，表束气机不能旁流则可以胸腹满闷，食后气上冲。（所谓无水虚胀者气也）；②这个热怎么解决？即口干口苦小便色黄，注意，这个口干口苦的原因是：1、中风证汗伤津液（肺中风者口燥而喘）；2，营血不濡（参见温经汤）3，瘀血内停（病者如热状,烦满,口干燥而渴,其脉反无热,此为阴伏,是瘀血也,当下之）。所以需要调和营卫治中风，滋养周运营血——桂枝汤，解表而除结气旁流气机——桂枝加厚朴杏子汤","hasDose":false,"patient":"张凤萍，女，44岁，腹胀一年，子宫肌瘤2-3年，大便难。 恶风恶寒，无手脚凉麻，偶有头晕头痛，口干口苦，饮多饮温，汗多，","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0669","caseSource":"经方医案按方证归类／桂枝加厚朴杏子汤医案集.doc","caseType":"案集医案","归集方":"桂枝加厚朴杏子汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"王在芬 女 40岁\n左下腹隐痛一月余\n左下腹痛，饿时加重。按压中腹，左下腹皆有痛感。无寒热 汗可 手足温。口中厚、乏味。晨起口干。时有身上肌肉跳动，常口腔溃疡，常尿道感染（伴 腰胀痛）。无下肢肿，无甲错。经色暗红，量可，期3天尽，末期拖延黑色血，伴小腹胀，腰酸，腿脚酸乏力。带可小便可色淡黄。大便时粘时而干粒状 2~3次/天。舌淡红 尖微红 苔白厚腻 脉弱\n真武汤 三天\n二诊 服上方后腹胀，矢气后腹痛缓解，现偶左下腹痛。身上肌肉跳痛减轻。口干消失。大便偏稀，日二次。\n原方继进三剂\n三诊：因感冒有段时间末来复诊。现重新收集症状如下\n服上方，肌肉仍跳动。以腿脚游离性肌肉跳为主（此病程有二年）\n左侧头胀，眼胀，耳心痛。汗可，手足暖。无胸闷，偶有呼吸时胸骨下不适。口苦，易饿，食之易饱，食欲不佳，食后中上腹胀：用手揉之打嗝、矢气。左侧腹走路时觉重重的下坠感。肩背腰紧，右膝酸（制衣工长年踩平车）。面肿（经来明显），下肢 汤.doc","caseType":"案集医案","归集方":"桂枝加芍药汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"金雪松案\n男3岁，\n主诉，鼻塞严重，影响睡眠，经常用口呼吸。\n刻诊：面部皮肤稍干，嘴及太阳穴周围有白色小疙瘩。活动出汗，手心易出汗。手脚温。极偶尔有白色粘稠鼻涕，平时无。无明显怕冷。易口腔溃疡，目前无。喝水正常。食欲好。睡觉不老实，因鼻塞经常憋醒。大便干，日1-2次。小便色淡黄，量次可。无恶心呕吐，无腹痛。腹部触摸稍有抵抗感。右脉浮滑数，左脉稍有力。舌淡苔白润稍厚。下眼睑色淡。\n与四剂黄芪健中，诸症无明显变化。原晨尿浑浊，服药后消失。\n方根很重要，这个表证，本来是个桂枝汤证，表上有风寒湿燥火，有风易汗，有燥则肤干，有寒湿则涕出，有燥火则溃疡起粟疹\n而此证有里证，表上营卫不和鼻塞易汗，由于津液趋表，充滞则鼻塞有涕，不和则汗燥粟疹；但是此证里面津液不足要比桂枝汤明显\n故而便干腹硬脉像有力，加大黄引邪入里了，虚其营卫。\n桂枝汤为方根，加芍药，桂枝加芍药汤。就是为了不要发散太过，芍药，可以润津、和营、治燥；加大黄虚其胃，虚津液；表邪入里。\n加黄芪反而要好点，70分；加葛根，80；加大黄30；小建中50；\n里面津液不足的时候呢，加葛根证，热比这个重；加瓜蒌根，燥渴比这个重；加大黄，热实比这个重；加饴糖，表之风寒比这个轻而里之虚热燥比这个重；\n从加葛根开始都会渴，这个所及所苦是鼻塞，是表上有风寒而营卫不和所致，那么你的处方就要以解风寒和营卫为药势，不要过用凉药冰伏邪气。\n芍药是通透的，配伍桂枝解表；配伍甘草养津；配伍茯苓能利水；配伍大黄下宿便；配伍附子温养营；配伍当归养血\n桂枝汤治中风证，六病皆有中风，而只有太阳少阴有伤寒，寒性收引，羁留于表，风行涣散，可以洞开肌腠直入脏腑。\n桂枝本为解肌，说的就是六病中风（其实是五病）皆可以用桂枝汤。\n那么桂枝汤是汗法（太阳）、不可汗不可吐不可下法（少阳）、清法（阳明，此法有变化，为芍药甘草汤方根之演化，但是小建中汤亦是阳明虚热证），温表法（少阴）、温里法（太阴）、不可汗不可吐不可下法（厥阴）的基础方根。","hasDose":false,"patient":"金雪松案","symptom":"","exam":"刻诊：面部皮肤稍干，嘴及太阳穴周围有白色小疙瘩。活动出汗，手心易出汗。手脚温。极偶尔有白色粘稠鼻涕，平时无。无明显怕冷。易口腔溃疡，目前无。喝水正常。食欲好。睡觉不老实，因鼻塞经常憋醒。大便干，日1-2次。小便色淡黄，量次可。无恶心呕吐，无腹痛。腹部触摸稍有抵抗感。右脉浮滑数，左脉稍有力。舌淡苔白润稍厚。下眼睑色淡。","prescription":"","effect":""},{"caseId":"Y0682","caseSource":"经方医案按方证归类／桂枝加黄芪汤医案集.doc","caseType":"案集医案","归集方":"桂枝加黄芪汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"8.\t二十岁左右时做过十二指肠溃疡手术（过去年代挨饿肠胃受损所致）\n这是太阴中风的第二个层面水饮血痹，第二个层面可以包涵第一个层面的病机邪风虚热的。所以此案的主要病机就是水饮血痹+邪风虚热，患者面色微黄，皮肤粗糙，失眠，进食流清涕，行走不稳，这是太阴的水血同病+外证中风；胃口欠佳，大便固瘕，夜尿略频，这是太阴的胃虚津寒和水饮导致；夏天怕热，是因为有虚热的存在；行走不稳，夜间休克，是因为有邪风与水饮血痹的共同存在；经言：欲救邪风，宜桂枝汤，而此证之太阴虚而有饮，不宜麻黄，因太阴病之黄芪即是太阳病之麻黄，故用黄芪，即桂枝加黄芪汤，合而成方，则治血痹之理法其实即已涵其中耳。\n失眠是为什么呢\n水饮和血痹影响到了卫气入营\n卫气昼行于阳而夜行于阴\n转和不利了\n鲜有桂枝加黄芪汤，太阴病的层面解除后再向阳面转就非常顺利了\n太阴外证解了，之后是不是对治太阴的胃虚津寒和水饮\n此病的转归或者太阳太阴为主，或者少阴太阴为主\n但是都会从表解一大部分邪气\n病虽机转\n要把握住这个机理\n觉得层次的把握好难，觉得里外矛盾的地方，不知道怎么下手\n疾病发生发展痊愈的规律\n怪不得老师老说治疗要把病机把握在出表的层面就快好了。也好治疗，效果还好。\n要看所急所苦的病机在哪里\n里邪出表，阴病转阳\n是，过去在总群看家栋兄处方，总是照顾最急最苦的，很多里证并没有去管，当时不太理解\n其实每个症状都照顾到了\n只是照顾的隐现和层次不同而已","hasDose":false,"patient":"8.\t二十岁左右时做过十二指肠溃疡手术（过去年代挨饿肠胃受损所致）","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0683","caseSource":"经方医案按方证归类／桂枝加黄芪汤医案集.doc","caseType":"案集医案","归集方":"桂枝加黄芪汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"一诊女，17岁，嗜睡，乏力。无寒热无汗，无口干口渴，无头疼头晕。食欲可，大便一天一次，质可。舌淡红，舌尖红，白苔根部稍后。末次月经错后一周左右，量多有少量血块，腹部酸疼三小时，白带无异常，脉象寸弦浮，关弦，尺沉\n二诊嗜睡稍好，无乏力。无寒热无汗，无口干口渴，无头疼头晕。食欲可，大便一天一次，今天质稀。舌稍红，舌苔根腻稍黄。脉左寸弦浮，关弦，尺稍弱；右寸浮缓，关弦；尺沉微。\n感觉伤寒论入门好难啊\n上次是用的是桂枝汤吧\n桂枝甘草汤\n对了，容易长口腔溃疡\n应该不会睡一觉再想起来其他了\n真确定绝对没了的话就是桂枝加黄芪汤\n不好意思，插播一段广告，广告之后，更加精彩 听许哥讲课享受，言简意赅，一字千金，他是经方导游，引领大家登仲景堂入仲景室，品味经方。\n嗜睡为什么你用麻附辛呢？老师\n要看病机，而不是症状\n对，我也想问这个问题\n日期:2013/5/26\n疮家不可发汗\n当然是辨证用经方\n看病机\n没治到本才复发\n脏腑辨证多数是的\n我还以为是甘草泻心汤呢\n你刚会套方\n复杂病例摸不着头绪，症状虽简单也不容易变清楚啊\n到这个群里才发现。。外面世界好大哦\n口腔溃疡，我原来试过，手心放血，大量些，效果不错\n老师，关弦，有没有饮参与\n到这个群里才发现。。外面世界好大哦\n上学学西医惯了。比如，大便干结和便稀交替出现，一年，可诊断为慢性结肠炎。\n弦脉，伤寒中多数主寒主水\n老师，我现在吃的方子，吃了晚上睡不着。我上午吃一包，中午晚上各半包，这样吃的。咳嗽有减轻了\n这个其实简单\n麻黄40克，你就失眠了\n痰也少了\n只能下次先煎麻黄\n我这麻黄质量太好了\n微黄的那种\n大家进麻黄不要进纯绿的\n麻黄不是绿的有力量嘛\n是寒去欲解也\n绿的都是采收的月份不对\n四剂","hasDose":true,"patient":"一诊女，17岁，嗜睡，乏力。无寒热无汗，无口干口渴，无头疼头晕。食欲可，大便一天一次，质可。舌淡红，舌尖红，白苔根部稍后","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0699","caseSource":"经方医案按方证归类／温经汤医案集.doc","caseType":"案集医案","归集方":"温经汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"女，27岁、面色淡黄。头痛伴头晕2月。头晕重是伴恶心。头脑不清，健忘。眼涩。无胸闷。时心慌，身乏力重、没精神。喜睡。无口干口苦。时有口气。平时喜热饮。饮凉后小腹发凉，饮食正常，胃脘部无胀满。睡觉梦多。刷牙无出血，颈腰沉重，腰膝怕冷。后背天凉时怕冷，冬天身怕冷。睡觉时上肢有麻木感。心烦意乱。手脚心发热出凉汗。身无汗。冬天手脚凉，小便正常，大便正常一天一次。吃凉饭大便稀，月经周期40天，经期7-8天，量少，有血块，色黑。经前小腹有时凉痛感，腰痛轻。黄白带多。下肢无水肿，有甲错。舌质红，苔薄白。脉沉炫\n温经汤\n下寒：吃凉饭大便稀，经前小腹有时凉痛感。饮凉后小腹发凉。\n阳明热：时有口气。手脚心发热出凉汗(血虚导致)。黄白带多\n津血亏的燥和不养（里位）：头晕，恶心。时心慌。头脑不清，健忘。眼涩。睡觉梦多。心烦意乱。\n血虚血瘀：经迟，时间长。量少，有血块，色黑。\n少阴（不温煦，不荣养体表，在表营分的滞（温经汤含桂枝汤））：头痛，身乏力重、没精神。喜睡。颈腰沉重，腰膝怕冷。后背天凉时怕冷，冬天身怕冷。睡觉时上肢有麻木感。冬天手脚凉。有甲错。","hasDose":false,"patient":"女，27岁、面色淡黄。头痛伴头晕2月。头晕重是伴恶心。头脑不清，健忘。眼涩。无胸闷。时心慌，身乏力重、没精神。喜睡。无口","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0713","caseSource":"经方医案按方证归类／温经汤医案集.doc","caseType":"案集医案","归集方":"温经汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"女，66岁，5月30日就诊。\n主诉：斗眼、视力模糊12天。\n病史：糖尿病10年，脑血栓左侧后遗症4年，高血压20多年，白内障8年\n刻诊：左项压迫感。头痛拍打后缓解，脑血栓患侧肢体麻木沉重怕凉。晚上睡觉时脚心发热。劳累后微汗出。饮水量正常，不能饮凉否则立即拉肚。纳好，吃干饭时必须喝水，否则噎堵。无腹胀无痛。小便淡黄，量少而频。大便成形但有拉不净感。睡眠时间少、多梦，常梦已故亲人。舌体瘦小，色淡红，舌根处有少量淡黄苔，舌尖点刺明显。右寸关中取可得，沉取弦大有力，右尺浮沉都弦而有力；左寸关中取可得，沉取弦大有力，但左寸力度大于左关，左尺中取沉取都是略弦，力度明显小于其它各部脉\n就是两只眼睛聚到一起了\n这是眼睛上的痉病嘛\n12天前吃了别的药，老是拉肚子，别的药是当归四逆+半夏泻心汤+千金附子汤。我感觉拉肚子拉的眼睛这样了。\n痉病，疑难病\n患者面色怎么样\n面色可以，没看出跟之前有什么变化。我今天仔细观察了一下，没有萎黄\n以前肤色就比较白，现在还这样\n眼睛有无红肿或者水肿\n这也是症状\n四诊资料采集就是查户口\n许老师这么复杂不知道怎样下手\n一头牛再复杂也有套路不是\n温经汤证\n你讲讲悟出来的东西呗\n许师说使用温经汤的要点：抓住少阴阳明太阴病的病机\n有津血亏虚，有阳明热，有少阴寒（不能饮凉否则立即拉肚）\n太阴寒\n不能饮凉否则立即拉肚，这是太阴寒还是少阴寒\n太阴寒\n我是这么理解的，看对大家有没有帮助，因为许师可能太忙了，要让我们自己悟\n脉象呢\n其他的可能要许师亲自讲了\n刻诊：病人面色红，双额头有红色丘疹，不痒，精神爽朗，诉。面部发热，，腰部怕冷，晨起胃口不好，口苦，饮食一般，口干，喝水多，但喝水后感觉腹胀不适，手足冷，平时不出汗，睡眠可，容易疲劳，小便黄，大便结（以前7天一次大便，现在喝了凉药一天一次。自己在药店买滴大黄类药）月经量少，行经三天，色黑，有血块，月经时腹部稍涨不适，白带稀，无气味。胫肿，小腿受凉后易抽筋，水滑苔，舌质淡。边有齿痕，舌尖一小块黄腻苔，脉细数。\n下寒/饮：白带稀，无气味 喝水后感觉腹胀不适 月经时腹部稍涨不适\n阳明热：面色红，双额头有红色丘疹 面部发热\n津血亏的燥和不养（里位）：胃口不好,口苦 口干，喝水多 容易疲劳 小便黄，大便结\n血虚血瘀：月经量少，行经三天，色黑，有血块，月经时腹部稍涨不适\n少阴（不温煦，不荣养体表，在表营分的滞（温经汤含桂枝汤））：腰部怕冷 手足冷 胫肿 小腿受凉后易抽筋\n钟晓辉曰：这个案我出五苓散。\n杨磊曰：我出甘草泻心汤。\n刘建廷曰：貌似漏芦连翘汤。\n许师曰：半量温经汤。\n谢知曰：我总觉得寒大于热。\n杨磊曰：老师，我觉得她是上热下寒，津血亏虚，虚热上炎。\n许师曰：把这组症状看下来就有感觉了。腰部怕冷晨起胃口不好饮食一般但喝水后感觉腹胀不适，手足冷，平时不出汗容易疲劳经量少，行经三天，色黑，有血块，月经时腹部稍涨不适，白带稀，无气味。胫肿，小腿受凉后易抽筋水滑苔，舌质淡。边有齿痕\n许师曰：下焦和营血虚寒了，上面肯定要热。上面的热一部分是下焦虚寒营血不濡阳气上浮。另一部分是阳明燥烦满实大便难。这就是病机所在。也就是说我们的处方要解决这两个问题。\n许师曰：肯定有，也有水血（营）同病。\n此案存疑。\n许师曰：讲讲温经汤剂量的问题。\n许师曰：我们再回到温经汤。\n问曰：妇人年五十，所病下利数十日不止，暮即发热，少腹里急，腹满，手掌烦热，唇口干燥，何也？师曰：此病属带下。何以故？曾经半产，瘀血在少腹不去，何以知之？其证唇口干燥，故知之。当以温经汤主之。（金匮要略。妇人杂病脉证并治第二十二\n吴茱萸（三两） 当归 川芎 芍药（各二两） 人参 桂枝 阿胶 牡丹皮（去心） 生姜 甘草（各二两） 半夏（半升） 麦门冬（一升，去心）\n上十二味，以水一斗，煮取三升，分温三服。亦主妇人少腹寒，久不受胎；兼取崩中去血，或月水来过多，及至期不来。\n温经汤全量是治什么的，急治的猛剂。 妇人年五十，所病下，利（血）数十日不止，暮即发热，少腹里急，腹满，手掌烦热，唇口干燥，曾经半产，瘀血在少腹不去。崩漏几十天了，危急不？这是温经汤的立方所本。但是温经汤“亦主妇人少腹寒，久不受胎；兼取崩中去血，或月水来过多，及至期不来。 ”这是急症还是缓证？温经汤急治有个病机很重要，曾经半产，瘀血在少腹不去。这说明什么，温经汤重用可是化瘀去实邪的剂量，就像越婢汤发越风水邪实一个道理。那么“妇人少腹寒，久不受胎；兼取崩中去血，或月水来过多，及至期不来。 ”这些病邪实不明显甚至无实邪的以虚寒津亏胃虚为主的呢？也用全量？是不是得学学桂枝二越婢一汤的法则，改变越婢汤的功效趋势？\n许师曰：徐大椿怎么说的：若夫虚邪之体，攻不可过，本和平之药，而以峻药补之，衰敝之日不可穷民力也;实邪之伤，攻不可缓，用峻厉之药，而以常药和之，富强之国可以振威武也。所以你用全量不如我用半量取效呢！为什么？理法所在，仲圣先例所在。讲完了，今晚的课，大家好好体会一下，再过一年后再读一遍，看看是不是感同身受。\n痛经20年 月经量多20年。\n刻诊；颜面稍黄，神差，失眠，经期腹痛，腰痛，月经第一天是红色，第三天偏黑，月经提前5天，月经量多，血块多，要10天才干净，白带无，阴道干燥。头晕，眼花，头痛（既往有外伤使）。口干，喜欢热饮，饮水不多，冷饮则容易腹痛，大便干燥，每天一次，小便色黄，夜尿不定，有时候有，冬天一次，白天要休息，要不会头痛，冬天手脚怕冷，现在也比一般人怕冷。汗出正常，饮食正常。双侧胫骨按压无凹陷。双脉重取可得，细。舌尖有少量的小瘀点，舌质暗红，少量白苔。\n许师曰：旭民的医案，半量温经汤。\n许师曰：这个也是半量温经汤。","hasDose":false,"patient":"女，66岁，5月30日就诊。","symptom":"主诉：斗眼、视力模糊12天。","exam":"刻诊：左项压迫感。头痛拍打后缓解，脑血栓患侧肢体麻木沉重怕凉。晚上睡觉时脚心发热。劳累后微汗出。饮水量正常，不能饮凉否则立即拉肚。纳好，吃干饭时必须喝水，否则噎堵。无腹胀无痛。小便淡黄，量少而频。大便成形但有拉不净感。睡眠时间少、多梦，常梦已故亲人。舌体瘦小，色淡红，舌根处有少量淡黄苔，舌尖点刺明显。右寸关中取可得，沉取弦大有力，右尺浮沉都弦而有力；左寸关中取可得，沉取弦大有力，但左寸力度大于左关，左尺中取沉取都是略弦，力度明显小于其它各部脉","prescription":"","effect":""},{"caseId":"Y0714","caseSource":"经方医案按方证归类／温经汤医案集.doc","caseType":"案集医案","归集方":"温经汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"女，43岁\n主诉：产后脱发6年\n生二胎后出现脱发，洗头梳头时脱发多，头发边掉边长，头顶明显，头皮痒。面色萎黄，下睑白，平时怕冷，无汗，无头痛，腰时痛腰感觉硬板，怕凉，四肢温。头晕，晕车，时一过性晕，晕时伴恶心，既往有胃炎史，无腹胀肠鸣，无胸闷心慌。右胁肋部、脐下部、右少腹部时有发作性疼痛。纳眠可，耳鸣如潮，无口干口苦，不欲饮,大便一天一次，成形，饮水少时有时干，小便淡黄，无尿急尿痛。月经周期正常，经期7天，经量色可，无白带，无经前腹痛腰痛，舌淡润苔薄黄，右脉沉细，左脉细\n温经汤是对的\n饮证都那么明显了\n头晕，晕车，时一过性晕，晕时伴恶心，右胁肋部、脐下部、右少腹部时有发作性疼痛，耳鸣如潮\n和，在这里念huo\n我们山东南部和河南地区 的一种读音\n这样一种粘滞不爽的状态\n奥，就是口里感觉粘腻\n很多患者有这主诉的:口中粘滞不爽\n少阴病，得之二三日，麻黄附子甘草汤微发汗。以二三日无证，故微发汗也。（宋302\n少阴病，始得之，反发热，脉沉者，麻黄附子细辛汤主治\n少阴病，得之一二日，口中和，其背恶寒者，当灸之，附子汤主之。 （宋304）\n少阴病，得之两三日，无证，怎么回事？不是少阴病吗，怎么会无证呢\n那是无里证和其他兼证\n所以单纯的温发就行了\n注意，这是说的两三日的时候\n古人说：试玉要烧三日满，辨材须待七年期\n仲圣教我们这个少阴病你要观察个两三日\n无里证和其他兼证，就是温发表邪就行了\n而有的少阴病就不这样了，比如少阴病，始得之，反发热，脉沉者\n这就是不对了，少阴病刚刚的得上就脉沉，这是里面有饮，脉沉者，理由水也，所以加上细辛化饮才行\n还有的少阴病，得之一二日，口中和\n这也不对了，也不是单纯的少阴病了，也不可以用麻黄附子甘草汤之类的微发汗\n是水饮的阻碍，胃也虚寒，津液不能上承了，有饮还津液不润，所以口中还不至于太干燥，也不至于太水润，黏黏糊糊，像是不爽还不想喝水，就是这样一种状态\n这种胃虚寒有饮引起的这组症状，用灸法是非常得当的，可以很快改善症状的，所以仲圣先说当灸之，然后再吃下附子汤\n有太阴的问题\n那凡是口中和，就 ","analysis":"","comment":"","caseExcerpt":"原方：小阴旦汤：治天行病（指流感、感冒之类的外感病），身热（指发烧。这里没有提及恶寒，当有发热而不恶寒或发热多恶寒小（不明显）之类的表现，通常是少阳病发热的特点，说明病不在表，已经传里了（这里主要是指病传少阳、传半表半里而不是指病传阳明、传里）），汗出，头目痛（指有上热的烦热、烦躁、汗出、头痛、眼痛之类的表现，有用黄芩的机会），下利（汗出加上下利，说明津血在不断耗损中，有用甘草、红枣之类养胃补津血的机会），腹中痛（指腹中拘急挛痛、里急后重、腹满时痛之类，有用白芍、芍药甘草汤之类的机会），干呕者（指呕吐哕逆，有用生姜、半夏（小半夏汤）之类的机会）方。\n黄芩三两，芍药三两，生姜（切）二两（一作“三两”），甘草（炙）二两，大枣十二枚。\n上五味，以水七升，煮取三升，温服一升，日三服。服汤已，如人行三四里时（一作“少时”），令病者啜酸浆水一器，以助药力（以上做法，在实际应用本方时，完全没有必要这样去做，病照样能好。所以在仲景的黄芩汤方、黄芩加半夏生姜汤方中都没有关于这类做法的说明）。身热去（指退烧），自愈也。\n参考比例：黄芩三，甘草二，红枣四，白芍三，生姜三；煎汤，分三服。\n合方分解：1、小阴旦汤＝黄芩（治上焦郁热、实热）+甘草、红枣（养胃生津血）+白芍（即芍药甘草汤）（治腹中拘急挛痛、腹满时痛、里急后重之类）+生姜（温胃、袪寒以治呕吐哕逆）。\n2、小阴旦汤＝黄芩汤+生姜＝黄芩加半夏生姜汤－半夏（可见本证没有痰多、眩晕之类的表现。但实际应用本方时，半夏也可以留用而不去掉）。\n按：本方与黄芩汤、黄芩加半夏生姜汤有着极其密切的联系，属于这类方剂的加减变化方，宜互参。","hasDose":false,"patient":"原方：小阴旦汤：治天行病（指流感、感冒之类的外感病），身热（指发烧。这里没有提及恶寒，当有发热而不恶寒或发热多恶寒小（不","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0380","caseSource":"方证医案集·晓辉整理版／芍药四物解肌汤医案集.doc","caseType":"案集医案","归集方":"芍药四物解肌汤","usedFormulas":["黄芩汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"男：2岁10个月\n主述：下午5点左右，吃了冰棍坐空调车，下车后，发现有发烧情况，并且又要睡觉。\n刻诊：脸色不红，没有感觉恶寒或恶风，额头微汗，发烧37.7度。\n额头温度高，手足温，无汗。今天主动要喝水半杯，下午吃冰淇淋一盒，座公交空调车，下车后，发现发烧。有口气。\n无呕吐。早上起床起的晚，今天中午没吃饭，就早上吃的牛奶蛋糕。\n今天大便硬，前段成粒状后面成形。\n目前没有发现喉咙叫痛，现睡着没有看见里面的情况。\n舌头头部红，后部苔厚\n中午小便一次，色微黄，量正常。\n不会用的黄芩汤吧\n小孩醒后，查，咽部红，小便黄。\n吃药后，没出汗，喝了点牛奶出点点额汗，然后，自己吃了点粉。\n喝药后一小时，现温度是38.5度，\n第二天：昨天药在二个半小时内，喝了一半，晚上3点，温度升到39度，摸额头，手心有点湿。早上起床后，温度38.2度。咽部红，起床后想喝冷牛奶。晚上踢被子。\n转方 黄芩加半夏生姜汤全量1剂 依然不退\n烧没有退，但是现在有微汗，精神好。吃饭也可以\n大便1次成形，\n转方 黄芩汤1剂\n第三天：昨天喝黄芩汤2次，温度在37.5-38度之间，晚上又大便一次，前面干成形，后段拉稀泥状，不准盖被子。精神好，胃口不差。额温高。现在温度37.7。\n怪了，烧还是没退，温度37.7度，精神好，下午大便一次，稀泥状\n舌头还是前面红，后面白厚，因为吃药，苔有点黄\n咱先听 师兄说完哈\n手脚扪略凉\n无汗、背微润\n无口干 面色不红 无流涕 无甲错\n除了体温高 ，一如平常，大便稀\n黄芩姜夏汤\n转方……一剂 烧退……\n连喝2付\n千金解肌汤\n葛根24 麻黄6 黄芩12 赤芍12 炙甘草12大枣24 1剂 稍捂汗\n昨天千金解肌汤煮好后，使用六分之一剂，半小时后开始退烧，今晨烧已退。\n这个连续战斗三天 差点把我搞崩溃\n一哥有完整的案吗\n与葛根汤略有差别","hasDose":true,"patient":"男：2岁10个月","symptom":"","exam":"刻诊：脸色不红，没有感觉恶寒或恶风，额头微汗，发烧37.7度。","prescription":"","effect":""},{"case nt":"","caseExcerpt":"男，33岁\n主述：头皮触摸刺痛，颈项略强。\n病史简要：脑动脉瘤术后1月+，高血压、高血脂病、家族史，脂肪肝。\n刻诊：面色微黑黄，体壮。无头晕，口不干，略口苦，口中有异味，饮水多，1500ml。无胸闷心悸，腹胀腹痛，胃出血病史，胃口好。出汗多，头汗多，怕热，不怕风，不怕冷。大便1次，时干时稀，有时2-3天一次，难解。小便时黄，无异常感觉。睡眠好。下眼睑红。下肢皮肤略干燥无肿胀按坑，微袜子印。易心烦急躁。\n舌红苔薄白，脉缓。\n师曰：黄芩汤\n这个同样有 颈项略强这种芍药甘草汤证\n王某 58岁 男\n主诉：大便不畅，便粘，不尽感。\n刻诊 140705：面色暗，体态中等，不怕风冷，上半身怕热，腿喜温。上半身爱出汗，热时头颈胸背出汗多，夜间睡觉背热出汗。\n头沉，不晕不痛。刷牙易出血，口腔有异味，口苦，无耳鸣，喜饮水，冷热均可，现在喜饮凉水。\n有轻微心脏压迫感，心脏不适时易伴随背酸麻感。无胃部不适。晨起大便一次，大便不畅，量少粘滞，有便不尽感，下腹积滞感。\n无肠鸣。发生大便不畅的症状时纳差。眠可。小便量少，稍黄，不频，上午喝水多，小便3到4次。无起夜或起夜一次，小腿怕凉，触之凉。四肢无按肿，无甲错。\n脉弦 舌质红，胖大齿痕，苔薄略黄。\n家栋：黄芩汤，阳明湿热伤血\n主诉： 牙疼两天，今天稍微有些减轻了。（昨晚懒得煎药了，服了三支儿童清肺口服液，同仁堂产，含麻杏石甘汤方义）\n0608刻诊: 最近食欲稍差，眠可。大便一至二天一次，有时偏干。今天小便有点灼热，偏少。不起夜。白带少，微黄。口有点干渴。咽干。两侧牙疼。无明显恶风寒，肩颈腰背有些酸痛。平常手心微热，但不影响睡觉。头部左侧有点胀痛。今天工作极累，下午有阵子发轻微虚汗。腿酸。\n练习：黄芩汤\n平常有些怕热，汗出不多。","hasDose":false,"patient":"男，33岁","symptom":"主诉：大便不畅，便粘，不尽感。","exam":"刻诊：面色微黑黄，体壮。无头晕，口不干，略口苦，口中有异味，饮水多，1500ml。无胸闷心悸，腹胀腹痛，胃出血病史，胃口好。出汗多，头汗多，怕热，不怕风，不怕冷。大便1次，时干时稀，有时2-3天一次，难解。小便时黄，无异常感觉。睡眠好。下眼睑红。下肢皮肤略干燥无肿胀按坑，微袜子印。易心烦急躁。","prescription":"师曰：黄芩汤","effect":""},{"caseId":"Y0511","caseSource":"方证医案集·晓辉整理版／黄芩汤医案集.doc","caseType":"案集医案","归集方":"黄芩汤","usedFormulas":["黄芩汤"],"isCombine":false,"history":"","analysis":"","comment":"","caseExcerpt":"刘某，男，50岁，体力劳动者，体质壮实，不是虚浮体质，5月13日初诊：自5月12日起，无诱因左眼平视的时候有模糊感，但是往上看或者往下看则无模糊感，右眼无恙，平时怕热，汗出多，热则汗出，动则汗出，口不太渴（也喝水，但不是喝得很多），眼睛无胀感，身不痛，饮食可，大小便正常，精神可，语气可，舌质淡，微有齿印，苔薄白润，脉紧弦有力而慢，我仿《千金》越婢加术汤，与其开方如下：石膏50g 麻黄25g 生姜20g 大枣15g 甘草12g 苍术20g 半夏25g 四付。 今天已喝了三付，打电话跟我说，没效。（他主要是治眼睛视物模糊感 ）\n请老师指导，我错在哪。\n黄芩汤\n您认为还是少阳热\n阳明热\n怎么看来出是这个方剂呢，怎么辨呢\n平时怕热，汗出多，热则汗出，动则汗出\n这是一组阳明热证\n噢，原来病眼在此\n还有轻微的中风\n太阳与少阳合病，自下利者，与黄芩汤，我原来以为黄芩汤是少阳\n无其它的表证，无少阴，无太阴，无少阳，无厥阴\n明白\n黄芩汤是桂枝汤的变法\n没有表上的风寒，所以去桂枝生姜\n桂枝汤？怎么讲\n有阳明热所以加黄芩\n就是把桂枝汤调成一张偏阴的方子\n这么一说还真有点意思\n我原先从不这么思维\n所以会春用发越是不行的\n那就让肖师兄试一个许老师的方子\n原方原量吗\n许老师的方还用试吗","hasDose":true,"patient":"刘某，男，50岁，体力劳动者，体质壮实，不是虚浮体质，5月13日初诊：自5月12日起，无诱因左眼平视的时候有模糊感，但是","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0535","caseSource":"方证医案集·晓辉整理版／黄芪桂枝芍药苦酒汤医案集.doc","caseType":"案集医案","归集方":"黄芪桂枝芍药苦酒汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"赵国祥 男 52\n病史：牛皮癣30年\n主述：头晕、巅顶冷\n头晕近两个月，一阵阵昏沉。巅顶、额头冷两年，四季都要戴线帽子睡。此刻也觉得头顶额头冷，用热手捂着舒服。头不痛。身不冷，略怕热。汗出较多，汗后不冷。眼睛涩，流眼泪。无口苦口干心烦。\t。纳可，无胃腹不适。大便平时很规律，日一行成形。今天未解。小便颜色未观察，晚上喝水多，夜起2、3次。小腿不肿不干燥。睡眠可。全身牛皮癣，春秋两季换季的时候严重。\n舌淡红，尖略红，薄白苔中间深痕。\n脉左寸关内偏，略滑，尺沉稍弱；右寸关内偏沉细，尺沉弦细。\n芪芍桂酒汤，备用黄芩加半夏生姜汤\n哦～我一般的思维是先治里，再让里邪出表\n所急所苦\n不光代表症状\n更是津液输布离合的轨迹\n不太明白巅顶冷是啥原因？卫津表虚为啥只反应在头部\n芪芍桂酒汤和黄芩加半夏生姜汤都是类厥阴中风\n类厥阴的最大特点就是有寒热不均杂错\n津液在有些地方过剩而生热\n而在有些地方又不足而生寒\n哦～想到类厥阴，就是方证不确定\n桂枝汤是经方之首\n所有经方在此基础延伸而来\n它本身就是类厥阴方\n是，这个老师多次提到过\n类厥阴是经方中涵盖最广泛的病机方机\n厥阴一法钤伤寒，桂枝一法钤经方\n芪芍桂酒汤是偏补偏温清和合的桂枝汤，适用于偏虚偏寒热杂错的症候\n偏虚是指表的虚吗？因为在桂枝的基础上加了黄芪\n黄芩加半夏生姜汤是偏泻偏清化和合的桂枝汤，适用于偏实偏水血火邪夹杂的症候\n津虚\n津液虚\n桂枝汤就是经方三百首\n包括黄芩加半夏生姜汤都源自桂枝汤\n所以我们把它定义为阴性的桂枝汤\n偏阴的桂枝汤\n以晓岑的悟性，这些不难\n在津液寒热表里的层次上去分\n其实表束的层次分清了，仲圣心法已经得了\n嗯，表里辨是最考验人的\n芪芍桂酒汤是偏补偏温清和合的桂枝汤，适用于偏虚偏寒热杂错的症候\n黄芩加半夏生姜汤是偏泻偏清化和合的桂枝汤，适用于偏实偏水血火邪夹杂的症候\n初诊","hasDose":false,"patient":"赵国祥 男 52","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0556","caseSource":"经方医案按方证归类／三物黄芩汤医案集.doc","caseType":"案集医案","归集方":"三物黄芩汤","usedFormulas":["黄芩汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"三物黄芩汤 苦参6 黄芩18生地24 6付\n外洗：大黄50生甘草50五倍子100白芨50积雪草200没药50虎杖100黄芪100外洗\n20140719复诊前额眉间粟粒样大小暗红色丘疹伴黑头，额头鼻部下肢有数块黄豆大小皮损，色红伴少许鳞屑，不瘙痒有数个新发皮损。自觉怕冷，在吹风扇的室内觉身冷手足凉。不爱出汗，近日锻炼身体后可有上半身汗出，汗后不觉冷。头晕，蹲起后头晕明显，眼前发黑。颈背酸痛缓解。口唇稍干，口干口渴，喜欢喝凉水。纳可，纳后无不适。无烧心反酸。小便色微黄，次数不多，无夜尿。大便成条质偏稀，日2行。上次经行6天，色鲜红，量少无血块。无白带。手触温，腿部触凉。下肢无水肿。舌暗红苔薄黄润，脉寸关弦滑尺弱。（注：下肢皮损一直未用外洗药）\n许师曰：疗效还不错。原方续进。\n许师曰：化瘀去滞。对溃疡面还有护膜生肌的作用。并且是树皮的分泌物，以皮治皮。没药用生的。\n盛长青曰：《千金》三物黄芩汤\n黄芩（一两） 苦参（二两） 干地黄（四两）\n上三味，以水六升，煮取二升，温服一升多吐下虫。","hasDose":false,"patient":"三物黄芩汤 苦参6 黄芩18生地24 6付","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0806","caseSource":"经方医案按方证归类／葛根芩连汤医案集.doc","caseType":"案集医案","归集方":"葛根芩连汤","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"高华忠 男 48\n感冒两天，无汗，轻微发热（摸额头估计有37.2），恶寒，极度怕风吹，风一吹全身肌肉痛。身痛晚上翻来覆 方子\n原方原量吗\n许老师的方还用试吗","hasDose":true,"patient":"王某 58岁 男","symptom":"主诉：大便不畅，便粘，不尽感。","exam":"","prescription":"家栋：黄芩汤，阳明湿热伤血","effect":""},{"caseId":"Y0863","caseSource":"医案集·跟诊会诊／医案--黄芩加半夏生姜汤-余翥_20190813_100739.doc","caseType":"案集医案","归集方":"医案","usedFormulas":["黄芩汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"医案—黄芩加半夏生姜汤—余翥\n【归宗】琼-伤寒-余翥\n女，3岁半。\n咳嗽伴痰音一周\n舌红润，苔薄，时常剥落苔，今天无。舌尖小溃疡，色淡红。眼睑淡红。\n清鼻涕，咽喉疼，夜咳加重。胃口稍差，喝水可，手足温，大便前干后稀，最近2日未解。小便黄。踢被子。肚皮稍凉，柔软。\n大家请处方\n黄芩加半夏生姜汤\n变异性哮喘病案进度跟进，第十诊\n2015/6/6\n白天体温稍下降至37.5，夜间体温上升最高时39.5度，昨日37.5-39.5度。今天家属带患儿到医院查血常规，未见明显异常。\n2015/6/7\n家中会诊：早上体温37.2-37.5，家中见到患儿时患者测量体温37.2度，精神可，能下地跑动。脸上红色褪。红疹颜色稍腿，其余皮疹面积同上。昨夜发烧时面部红。今刻诊不明显。\n干咳伴少许咳呕，咳嗽猛烈，有少许痰音，头面前胸成片淡红色小疹，无脓头无水样溃烂。眼睑半红半白，舌淡红偏暗，苔白腻厚，一侧剥落苔，面积大约占一半舌面。脉浮细数。今晨微汗，昨夜捂汗也不太多。手足扪凉。皮肤凉。下肢皮肤稍干燥，干燥已不如之前明显。手皮肤稍干燥，但比之前有进步。大便前日（6月5日）未解，昨日大便前软后稀，今早大便稀黏，气味不重。小便黄。咽狭右侧1度肿大，淡红色，可见白色脓头少许米粒大。腹部凉汗，食欲不佳，饮水多，口不苦，咽喉疼痛。昨日家属有听到患儿自诉胸闷不适，今天无。\n黄芩加半夏生姜汤，继续服用\n十一诊\n2015/6/9\n傍晚下班后再去患者家中复诊一次。周日喝药后，前半夜夜间猛升高后逐渐开始退烧，后半夜体温是近一周来第一次达到36.5度。之后没再发烧。\n刻诊：咽喉白脓头仅剩下针尖大小，咽狭淡红，肿大1度，痰多。舌淡红，中间稍鲜红,苔剥落，白腻。眼睑半红半白偏红润。脉浮。\n昨日间咳嗽猛烈咳嗽伴咳呕，至夜间，前半夜体温猛升高之后逐渐开始退烧，有正常汗出，后半夜体温是近一周来第一次达到36.5度，伴随退烧同时咳嗽大为减少，未发烧。踢被子减少。今天汗不多，有鼻涕，咳嗽不明显，有痰音，咽喉不疼，手温回暖，下肢皮肤稍干燥，大便日一次，昨天大便偏黏，今天干溏各半。小便淡黄，喝水多。红疹颜色减淡，额头、前胸等处红疹成片。\n十二诊\n2015/6/16\n来门诊看病，几乎不咳嗽，一周来没再发烧。\n刻诊：脉浮数；眼睑半红半白偏红润；舌淡红紫，苔白腻，后部脱落。无鼻涕，夜间不踢被子，汗减少，咽喉不疼，左侧咽喉少许红，不肿，无白斑溃疡。小腿皮肤凉，稍干，无按肿，皮肤干燥减轻。大便日一次，量多，成型。小便偏黄。饮水不多，红疹褪。\n守方4付，2日一付。\n2015/6/24\n脉浮缓；眼睑半红半白；舌红稍暗，苔白腻，生长新苔覆盖大部分，后半部有一块剥落。\n出汗减少，无自汗，今天偶尔干咳，无痰音，咽喉不疼，无红肿。额头少许皮疹，色浅淡红，身上皮疹褪去。食欲佳，饮食增加。活泼。夜间少许踢被。大便日一次，稠。小便淡黄。下肢皮肤稍干，小腿与脚丫凉，不肿。手温可。已没药1日。\n守方4付，2日一付（每日半付）。\n这是2诊信息\n2015/4/13 女，4岁\n主诉：咳嗽复发3月余，反复发作，加重一周。\n患者咳嗽反复发作近三月，经省人民医院门诊系统治疗近2月，联合使用沙丁胺醇、糠酸莫米松、丙酸氟替卡松、匹多莫德、小儿肺热咳喘颗粒等药物，疗效不佳。\n西医治坏的\n解析：溃疡属于疮家，疮家发汗有技巧，仲景提醒过\n不可以直接发汗\n也因为疮家，所以气血不足\n强行发汗，会亡津液\n所以要两方面都有照顾，在这个基础，才可以发汗\n也因为津液不足，被西医治坏了，又有阳明湿热，所以痊愈才慢\n如果正气足，当然可以桂枝汤系列去使用\n这个发烧，不是单纯的太阳病，是太阳少阳太阴，类厥阴\n太阳与少阳合病，自下利者，与黄芩汤，若呕者，黄芩加半夏生姜汤主之。（172）\n黄芩汤方\n黄芩三两　芍药二两　甘草二两（炙）　大枣十二枚（擘）\n上四味，以水一斗，煮取三升，去滓，温服一升，日再夜一服。\n黄芩 eSource":"医案集·跟诊会诊／2019.2.22MDT会诊资料+随访（许家栋老师）.docx","caseType":"案集医案","归集方":"2019.2.22MDT会诊资料+随访","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"洪钜源 男 57 2019年2月22日\n脉弦紧，舌紫红嫩苔黄腻，水滑边齿痕，面部湿疹,下眼睑淡白边暗红，面部红色苔藓化皮损,腹满,下肢袜痕,甲错,血络,手凉\n失眠,头晕,记亿力减退,性功能下降,大便不成形\n腹稍胀,肠鸣不频,口干苦,饮多,饮温,怕饮凉,口中涎沫粘稠,胃纳可,小便不灼热,夜2.\n不怕风冷,足凉怕风,足不麻,汗多,汗后不凉,食汗,心慌胸闷,无梦.\n表束表寒中风伤营\n太阴伤血 血少轻 里虚 里寒 水饮\n阳明里热 里结 外热 外结 外燥\n柴胡桂枝枳实汤 *30剂\n柴胡24 黄芩9 生旱半夏12 北沙参3党参3 生晒参3 炒甘草6 生姜9 大枣12 桂枝9 黑皮芍药9 生枳壳12 川芎12\n上焦表卫所急所苦 厥阴是偏里偏虚偏寒 生姜甘草汤加川芎 桂甘枳实，自觉上热下寒，汗出是外在的表现，以津液在表失和为所急所苦，肢体疼痛，湿疹，在里就是腹泻\n厥阴中风 厥阴本病与厥阴中风\n津液在表 在里\n伤寒56条、伤寒不大便六七日。头痛有热者。与承气汤。其小便清者。一云大便青知不在里。仍在表也。当须发汗。若头痛者。必衄。宜桂枝汤。\n表里之辨看二便，二便是看津液的去路。患者腹胀腹凉，腹痛肠鸣，便溏，月经量少色黑，腰酸。里亏虚，津血来路出了问题，营出中焦，不能温煦推动防御，在里补胃气津血，不能攻表，少量桂枝，乌梅量大（30），乌梅丸（乌梅丸不看桂枝）大部分药矫正津血，以里为主轻微兼顾表。第2方，苦温，里位药（不看细辛）加表，里位养起来再到表。\n随访：服药期间睡眠明显改善，口粘减少，大便臭，不成形，颈部两侧不断出现皮疹瘙痒。仍有头晕，膝盖酸软乏力，脚板冰冷刺骨似踩冰上。\n精神疲倦嗜睡。自觉上热下寒，额头出汗较多，动则汗出，食热则汗出，汗出后不怕风冷，但脚底怕风冷。常有头晕，反应力较前明显减退，口干口苦口臭口粘，流涕，四肢麻木，肌肉酸痛，下肢袜痕。纳可，饮水多。肠鸣频，大便臭，不成形。夜尿2次。时有耳鸣，听力差，记忆力差。眠可。","hasDose":true,"patient":"洪钜源 男 57 2019年2月22日","symptom":"","exam":"","prescription":"","effect":""},{"caseId":"Y0958","caseSource":"医案集·跟诊会诊／160713-002.docx","caseType":"案集医案","归集方":"160713","usedFormulas":["桂枝汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"（7月13，第二份。内部深圳师兄弟聚会。）\n师曰：她就是体内，水火气血的某一些阻碍，就不能受孕了，你把邪气给它去除掉，好的津液，好的津血自然能濡养，濡养胞宫的话就能正常受孕了。临床一定要重视邪气的存在，邪气是客观存在的。\n弟子曰：她当时一直在问我，要吃多久的药，我就真不知道怎么回答，后来怀上了以后就特别感激我。\n师曰：经方治不孕还是很有特长的。\n弟子曰：她过来是因为她之前有个朋友，也是不孕，那个调的时间比较长一些，调了3个多月，基本上用的都是建中类。\n问曰：老师这个是叫疣还是叫什么？高于皮肤。它是这样子，一开始是很小，一块，然后擦了很多药膏会消失，但是用完之后它就扩散，越来越多，现在就变成这样。\n师曰：这应该是扁平苔癣。扁平苔癣或者线装苔癣，治是肯定可以治的，一般的话这不是阳明的外结嘛，除了内服辨证用药，外用药一般都是用的芒硝，加上一些红花、栀子这样的去。\n师曰：反正就是用一些去实的药。软坚的和去实的药。\n问曰：睡眠不好，大便不好。\n师曰：这个肯定是要内外结合，他一般都是阳明证会有有的，多多少少会有的。采集一下四诊资料，内外结合治一下，这个一般是可以治好的不要紧。\n问曰：他耳朵后面都有，你看这。\n师曰：看起来不像疣，疣不是这种形态。软疣的话是那种很软的，很细软的，扁平疣的话是那种和皮肤基本上是平齐，但是稍微碍手，有蜡样光泽的，这个都不像，它这么高了，应该是一种苔癣。\n答曰：是我大学同学。\n师曰：可以采集一下四诊资料，然后给他开个中药，内服外洗一下。\n师曰：麻黄汤这个方你看，它有的是太阳病嘛，津血绝对充斥在表，那么这种情况的话是会发热的，卫气强则发热，卫气是什么？阳气嘛，阳气多了凝聚在表的话肯定表上要发热的。那么会有一种什么，刚说的是卫气，津液的状态凝聚在表，是一种阳气、津液充斥在表，那么如果是废水的状态充斥在表的话，他一般就是不是发热了嘛，那么就会是一种溢饮的状态。酸沉疼痛都可以。麻黄汤临床也不是光是退烧，我临床用它治鼻炎效果也挺好。再说麻黄汤吧，吃上以后，不刻意让他发汗，他不发汗的，吃麻黄汤不发汗的，它卫气壅滞在表的时候，服上麻黄汤，盖上被子，再出汗。\n师曰：肯定有啊。半在里半在外。\n问曰：半在里半在外那不是一半在表一半在里吗，那不代表有一个夹在中间的（病位）。\n师曰：半在内半在外，是不是有一个中的涵义呢。我这么解释的话你可能就明白了：你说的内外都有那叫表里合病，我说的是邪气的交争，他处在一个出表入里的过程，出则进入太阳的病位那么就会恶寒，入则进入阳明的病位那么就会恶热，所以他会寒热往来。那么恶寒是太阳的一个症候群，恶热是阳明的症候群，那么寒热往来又阵寒又发热这种转态在邪气交争的过程会出现，寒热如疟的过程会出现，那么就这是半在内半在外。\n问曰：我是说有没有这样一个病位，就像表就是四肢百骸，上焦；里是五脏六腑一样，有没有这样的。\n答曰：我觉得既可以是表又可以是里。\n答曰：也是既可以是表又可以是里。\n答曰：确实。\n答曰：从这个看是。那少阳和厥阴是其他的几经合病吗，还是它是有单独的。\n师曰：对，在病机分析上是合病，但是不影响它是作为独立科目存在的。因为它是少阳的法度，而并不是表里合病的法度。\n问曰：就是少阳和厥阴这些方子的话，既可以是专属少阳和厥阴的法度，又可以是其他的合病的方子。\n师曰：对啊。这就是方证多维，其实概念都完整地提出来了，为什么方证多维，就是这个原因存在，它既是有单纯的少阳中风的方子，又可以治疗阳明太阴合病，阳明法的柴胡黄芩法，太阴的生姜甘草法，它合病的嘛。\n师曰：归为太阳、厥阴才对。\n问曰：少阴不是也可以嘛。\n师曰：少阴可以，但是它就配附子、配细辛，它不能单纯治少阴病，少阴是津血虚寒的嘛，那么你能用麻黄去发越吗？麻黄是苦泄的，桂枝才是少阳的一个正药，麻黄是太阳的正药。但是你不可否认麻黄它可以治疗一部分厥阴病，什么厥阴病啊？就是那种以寒邪在表，不得温煦，那么也可以用麻黄去温通，所以说有一个麻黄升麻汤，是以麻黄为主的，麻黄是15g，而别的药才2g，才8g、5g，量很少，那么为什么以麻黄为主，反而治疗有个上面唾脓血，下面下利呢？下面下利是不是太阳病呢？下面下利就不是太阳病了，那为什么用麻黄为主呢？这就是它能驱寒嘛。\n师曰：对，可以眼睑鲜红，但是肯定有一些别的一些虚和寒的症状。\n问曰：虚，脉或者舌之类的。\n师曰：对。局部会有偏实的表现，但整体会偏虚的表现。\n问曰：麻黄附子细辛汤这个方子里证应该不是很明显。\n师曰：麻黄附子细辛汤这个方子，严谨来说的话是太阳，太阴和少阴合病才行。麻黄发太阴之表和废水，附子温太阴之里，细辛出少阴表上的水，细辛这个药它其实很独特，你看，第一是小青龙汤类方用它；第二是苓甘五味姜辛夏杏类方用它；第三是续命类方用它。清热法度，无少阴证则大青龙汤法度，有少阴证则小青龙汤法度，它是不是属于少阴的方子啊？那么细辛这个药就是比较典型的少阴药，因为它既可以发，又可以去温散水饮，如果配上当归的话也可以去养营嘛。咱们把这类药归为一种续命类药，续命的药有什么特点啊？就是应该解表的时候，你不能去过度地温发、苦泄，那么就用某些表药去解，比如说这种细辛类的，解表而温寒，也能发汗呀，还有什么？防己类的，能去水。你看续命煮散的话，他有可能没有明显的里水，没有明显的小便不利，但是他却用防己，为什么？他能去表上的废水。\n师曰：他可以有水热，但是你配上附子的话也可以治疗寒性的。你不可否认他是寒性的是不是。\n问曰：那它跟茯苓的这种还是不一样的。\n师曰：对。茯苓是淡饮之主药，为什么防己不是淡饮之主药，防己是什么，是治疗支饮的。支饮是什么，“咳逆倚息,短气不得卧,其形如肿”，你看，表里都有了嘛，那么木防己汤、木防己去石膏加茯苓芒硝汤、续命类方，都是用它为主的，这就是一种客观存在的，你不能一个靶向去用药，就是多靶向。比如说虚者不可汗，寒冷者不可汗，液少者不可汗，但是续命方很多都是虚者、寒者、津虚液少血弱者，他为什么可以发汗，就是因为他用了一些很巧妙的非典型药。\n问曰：那附子这个药，按理应该除了温里之外，也可以解表。\n师曰：这么说吧，因为附子是辛热的，它用一枚，是不是，然后干姜是一两半，然后甘草是二两。二两加上一两半是不是三两半了，要超过这一枚附子了，这个用量，并且它是一个非常完整的甘草干姜汤嘛，把29条背一下。\n答曰：伤寒脉浮，自出汗，小便数，心烦，微恶寒，脚挛急，反与桂枝汤，欲攻其表，此误也。得之便厥，咽中干，烦燥吐逆者，作甘草干姜汤与之，以复其阳。\n师曰：与甘草干姜汤，以复其阳。复其阳是甘草干姜汤的作用。\n师曰：附子是除废的东西的。\n问曰：就是说除邪气的。\n师曰：对对。所以你看，诸XX主皮下之水嘛15:07，对不对。那我要想用附子来攻邪气的话，我可以重用附子，比如说甘草附字汤，附子三枚，是不是量非常大啊，反而扶阳救逆我才用一枚，你能说它是主药吗？它不是扶阳救逆的主药啊，甘草干姜汤起主要的作用。\n问曰：附子在津血比较亏虚的时候还是要慎用。\n问曰：附子是不是可以温表，就是祛表寒，祛里寒都可以。\n师曰：对啊，它首先是辛热的嘛，辛热走表。\n问曰：桂枝加附子汤的话这个汗到底是怎么止住的，我一直都没有相同。\n师曰：就是应为里边发汗后，复恶寒，虚故也， 芍药甘草附子汤主之。\n问曰：就是因为有芍药甘草附子汤这个方子。\n师曰：对，它因为里边含有一个完整的芍药甘草附子汤。那么芍药甘草附子汤是治发汗后，复恶寒，虚故也。因为他亏虚了，然后需要用芍药甘草汤去缓其迫，把那个毛孔的急迫给收回来，然后用附子去温人体的卫阳，因为表上这个……\n答曰：明白了。\n问曰：那附子有点像催化剂一样的。\n师曰：附子首先是一个散阴药（三阴药？），再就是明白，散阴它也是有邪气的，并不是完全是正气虚的，那么散阴有邪气怎么办，往往是用附子剂，真正大虚了以后他反而不用附子。\n问曰：那如果把太阳和少阴做一个比较的话，那么麻黄附子细辛汤是不是类似于麻黄汤，麻黄附子甘草汤类似于桂枝汤法。\n问曰：我自己想的，因为麻黄附子细辛汤不是以发散为主嘛，麻黄附子甘草汤的话它的发散的东西有一些……\n师曰：就是我觉得你应该把那个方机的理解一下，方机虽然是咱提出一个新的学说，但是他比较能好得能切入仲景的经典著作去理解仲景的用药思维。麻黄附子细辛汤，咱刚才讲了，细辛是治疗续命类的药，它既能出营，又能解表，但是还不至于让人太虚。所以你看，麻黄附子细辛汤里边麻黄是用二两的，还有另一个方子麻黄附子汤。麻黄附子汤是治疗水气病的，麻黄是三两，你看他真正用麻黄作用的话他用三两的，而少阴病的话他不敢用那么大量，他用二两。\n问曰：那边因为有是废水。\n答曰：里水。\n师曰：里水是表邪入里，表水入里。一个是麻黄附子细辛汤已经产生了过多的有余的东西了，一个是它要入里，还没有产生那么多有余的东西，那么我们就用甘草配附子，来甘温补益一下，是不是好的津液补上来了，坏的水自然就产生不了了。那么麻黄附子细辛汤它已经产生那么多的东西，我们要用细辛配麻黄把它发散出去，辛的作用更强一些，那这三味药都是辛药，麻黄是辛苦温的，附子是辛热的，然后细辛是辛温的，三味辛药。麻黄附子甘草汤呢，甘草是甘药，它能增加好多津液，那么它配伍附子是不是和麻黄附子细辛汤的作用就不一样了，它本来是治里水的，那么表邪要入里，表水要入里，那我把好的东西养起来，坏的东西自然就产生不了那么多了。\n问曰：麻黄附子细辛汤本身是里虚寒更偏重一些。\n师曰：里虚寒偏重一些是麻黄附子甘草汤，麻黄附子细辛汤是有余的邪气、有余的废水偏多一些。\n问曰：那就是说，如果我们从一个比较粗的层面去分析，基本上是从正气的多少和邪气的多少的角度去。\n师曰：不。临床分析用药的方向就是根据，你把阳气和营血把他对立起来看，就是调得是或者让阳气偏温一些，或者让营血偏濡养一些。\n答曰：不行，要去邪。\n师曰：对啊。那么是不是这种如果是废水多的患者你要让津液，把津液调得要偏少一点，让津液利出去，还是在津液层面打算嘛，你并没有所谓的正邪观。但是要用人参的话一定要人参、党参、沙参合用才能达到经方的性味。特别是比如说退烧的患者，你有的用党参的话有可能是达不到应有的效果，因为人参的补津液作用要比党参强多了，党参有可能是温一些胃气或者调一些胃气血的食欲不振是可以，但是你要真想补津液，养津，这易层面达不到的。\n答曰：就还是要沙参。\n师曰：对。安精神定魂魄，这个做用根本就是没有党参和沙参的事。\n师曰：偏于里者，偏于虚者，偏于寒者。\n师曰：你把乌梅丸条文背一下。\n答曰：只知道组成：乌梅、细辛、桂枝、人参、附子、当归、蜀椒、干姜、黄连、黄柏、苦酒、米。\n师曰：这个方子你看，乌梅这个药是酸温的，他用30g，大米他用一升，48g，在加上苦酒这个酸温方，他整体这个药是不是偏热的，他的黄连是用9g，黄柏是6g。\n问曰：但是那个丸子里面黄连是16两。\n师曰：是，丸子里是16两，他蒸之于5斗米下，然后乌梅是300枚，那个厉害？\n问曰：我不知道乌梅300枚是多少。\n师曰：乌梅300枚的话得几斤了，16两才一斤。\n问曰：那乌梅丸它不用黄芩的原因是什么。\n答曰：它泻的力量没有黄连那么强。\n师曰：对啊，那是不是用黄连不用黄芩。\n师曰：泻心类的方子，他既是有人参的，津液有不足的一面，胃气有亏虚的一面，他原有理中法，又有过度有余的水和热，他既需要润又需要燥，所以黄芩、黄连他是并用的。\n问曰：但是乌梅丸它也有津血亏虚的这一面嘛。\n师曰：乌梅丸是有津血亏虚的一面，但是他津液亏虚是不是整体是偏于，如果泻心汤的话是整体偏于胃气是不足的，所以人参的量，大枣的量，甘草的量是为主的，是很大的，而乌梅丸虚的并不重，他主要是寒热水火夹杂为主要主要矛盾，是不是要选各个方面，精兵强将来补火的，补水的，制水的，制火的来各个击破呢。\n问曰：像经方里面的方子，怎样去更好地梳理啊，还有去记忆啊。老师，你是提倡用类方的方子去记，还是比较推崇按太阳篇、阳明篇这样。\n师曰：类方。这样，桂枝类方，阳旦类方，麻黄类方，续命类方，石膏类方是白虎类方，大黄类方就是承气类方，清热类方就是朱雀类方，在就是一些柴胡剂，就是阴旦类方，一些泻心剂，甘草汤剂，建中剂，当归剂，当归剂都是养血的嘛，包括千金当归汤、芎归胶艾汤、温经汤这一大类。\n问曰：像这些的话，有没有一本书比较全面地把金匮和伤寒两个类方组合在一起，有没有这样一本书，是整合了这两本著作的。\n师曰：2年以后就有了。我们明年差不多能讲到方证系统，大约2年能讲完。我现在就推荐你看徐大椿那个《伤寒论类方》及行了。你现把那些方子先掌握起来，金匮的方子自然就能插在里面了。你先这样，先不要记乱了，因为我最原始的思想就是从伤寒论类方开始的嘛。\n问曰：我是觉得如果按伤寒论里面那些篇章里面的方子去记的话，有时候会有些杂。\n师曰：这个记方子必须按照类方，我发现类方有很多缺点，因为很多方子没法去整到类方中去，那么咱那个方证系统的话，就能把所有的方子全部整合的方子，包括咱增补的方子。\n问曰：那老师你觉得如果是类方的话，原本的伤寒论原貌会不会是以这种方式的形式出现的。\n师曰：不是的。原本的是前面是可汗不可汗，可吐不可吐，可下不可下，后边是附方。他讲的是法的层面。\n师曰：就这么说吧，《伤寒论》和《金匮要略》这两本书根本就不是仲景自己写的，而是仲景的弟子或者再传弟子记录仲景的临床看病的过程，或者是当时的课堂笔记，所以你会看到“问曰”，“答曰”，“师曰”，“师又治病家”等等，就像《论语》一样，《论语》是不是孔子的思想。\n问曰：这个和胡希恕提出的思想好像是一样的，胡希恕也认为《金匮要略》和《伤寒论》不是同一个人的手笔。\n师曰：金匮和伤寒的整个思维模式完全是一样的，并且你只有把伤寒的太阴篇穿插到金匮里面去，才能读懂金匮要略，他们肯定是一个体系，但是因为他是历朝历代整理版本嘛，我们现在读的伤寒论是宋代人整理的，那么宋代人整理的是综合了多种版本，流传在市面上的各种版本，包括各种古版，或者是高级重本36:02，因为这个是比较古老的版本，没有经过后世流传的传抄，也是当时整理医官比较重视的版本，以这些为蓝本，整合到一起，才是我们现在看到的这种体例。那么它既然是各种版本整合在一起，每个人的课堂笔记会不一样的。\n问曰：对对，我们现在有一些都会，医家在写这些东西的时候会有一些错误。\n师曰：第一他是跟诊记录，第二，他是讲课的一些简略的纪要，那么他本来就存在很多思维跳跃的过程。\n师曰：不会的，这个是绝对不会的。因为你如果在法则层面去看透彻的话，这些方子就足够了，怎么样去增补方子都是有法无方的，就像我给大家最近增补那个黄芪竹叶汤，那么在金匮要略中明确地就说黄汗可以传变痈脓，但是在金匮中腻找不到一个治痈脓的方子是从太阴传过去的方子，因为痈脓，什么叫痈啊，红肿热，是阳明证嘛，那么既有太阴证又有阳明证这样的方子不好找。那么我们读千金方的话我们发现在痈脓篇有一张方子，叫黄芪竹叶汤，既有太阴中风的方干在里边，又有竹叶石膏汤在里面，那么它又是治痈脓病的，那是不是这就是有法无方的地方，就是这个方子在这里，并不是没有，其实我们现在看到的海量的方子都足够了，并且大量的方子，99%不是仲景的方子，那么我们披沙拣金地捡出这几张方子以后，的确是经得起锤炼的，为什么？因为仲景的体系，他的方子，他有自己的特点，什么特点？他是阴阳二旦法则的，这就是 陶弘景说的“外感天行，经方之治，有二旦、六神大小等汤。昔南阳张机，依此诸方，撰为《伤寒论》一部，疗治明悉，后学咸尊奉之。”他是阴阳二旦体系的，很多方子一看就不是阴阳二旦体系的，根本就没必要补进来。\n师曰：用到下的都归太阳？肯定不对的。这个其实就是为什么咱提出表束这个概念的问题，表束有很多层面嘛，那比如说阳明中的表，阳明中风，或者是太阳中暍，那它会有什么？背微恶寒，或者全身恶寒。但是它却是用的石膏剂啊。这是就是表的不同层面而已，你不要被篇章所误，那少阴篇还有大承气汤呢。你要完全有一种一以贯之的思维。那么太阳的主要特点是“脉浮，头项强痛而恶寒”，表和上焦津血充滞了，津血充滞在脉管脉就浮起来了，充滞在头面的话就会头项强疼，充滞在上焦嘛，表位嘛，会头疼，腰疼，骨节疼，身体酸疼都有了，那是不是上焦和表位出了问题，那么为什么麻黄汤证可以有咳喘呕逆呢，那很多人说这是不是里证啊。咳喘呕逆你在普通地分的话它是里证，但是它里证只是说咱看到病人的症状的所急所苦，那么咱为什么要强调从症状的所急所苦上一定要上升到病机的所急所苦上，它时整个津血往上焦和表位上去凝滞，去压迫而引起的一种表束而气不旁流的状态嘛，那么你开表就行了嘛，这就叫有表证有表邪嘛。当然呕逆，咳喘是下焦淡饮往上冲逆引起的话，你当然是治里为主了，这不就是咱讲的麻黄汤和苓桂术甘汤的区别嘛，一个是代表有表证有表邪，一个代表有表证无表邪。那么腻把这两个层面区分开的话，你临床思维会开阔很多，那么再加上外证的区别的话，你对表上的所有问题能解决得非常透彻。那么就不会存在说看到这个病人一定要纠结他是太阳还是阳明，你不要纠结这个。那当然是咱不可否认，太阳病它篇幅很长，它占的篇幅也是最大的，为什么会这样呢？就是因为伤寒之法他首重表证表邪，他特别重视里邪出表，特别重视阴病转阳，表、阳，是不是都能代表表和阳的是太阳，那么所以太阳篇那么大嘛。\n问曰：所以我那天跟诊就看到你很多的病例，那一次跟诊，很多人诊断都有表束或者说表寒，都有一些表证的成分在里面。应该这样说吧，现在很多病，应该会有夹杂表证在里面。\n师曰：应该说大部分病都夹杂表证，我们临床大部分杂病都会夹杂表证在里面。\n问曰：这跟我前段时间跟一个医生朋友，也算是我的半个老师，他也说到他最近看病经常会用到解表的药，桂枝麻黄用得特别多，他说发现很多病都有表证的征候。所以我那天跟诊时我就看到这一点，几乎所有的都会有表束这方面。我发现其实我也有，上次勇哥给我开了一个小青龙，还要请老师帮我看一下，验证对不对。\n师曰：今天大家多谈思路问题，看病就不看了。看病只是你看一个，没什么意思，大家多谈思路这些东西，理法。\n弟子曰：是这样子，许师这边不是说这段时间是很多表束，是大部分情况下都是很多表束。\n师曰：对，我们一直在研究表。\n师曰：对，它是客观存在的嘛，那太阴病是最里的病。\n问曰：那这样子，胡希恕前辈就是把太阴归到表阴证。\n师曰：把少阴归到表阴证。\n问曰：对对，把少阴归到表阴这一块，那老师你这怎么判断。\n少阴是真阳卫阳之别嘛，少阴病它有两个层面，第一个是伤到卫阳层面，第二个是伤到真阳层面，所以说少阴病有很多死证，而太阴病一个死证都没有。那如果是一个表证会有死人吗？\n答曰：伤到了真阳这个层面。\n师曰：对啊，人体的大的阴阳要脱失，要断裂了嘛。那么腻不可否认少阴病它是有真阳层面要忘失的一个死证的，那么它有没有表的问题？有表。那就是少阴它本来就包含卫阳虚和真阳欲脱，那你不能说单纯……\n问曰：那这两个层面应该有可以同时存在的这个情况，既有表证，又有表阳的卫阳的情况，也有真阳同时发生的一个症状，这两个层面都可以同时……\n师曰：不是，咱提出少阴这个真阳和卫阳的区别最大的意义是什么？让大家一定清楚，少阴这个层面，它并不是单纯的是表阴或者是表上的表邪能解决的了的，而是说它本来就存在的一个，如果说治疗不恰当的话，或者是误诊逆治的话，它有可能人体的真阳出了问题，它本来就是一个津血虚寒嘛，如果说太阴病的话主要的原因是水病或水血同病为主。（被打断）\n问曰：那个百合前胡汤和竹叶前胡汤，有些分不清楚，特别是一些表上的症状。\n师曰：百合前胡汤它虽然有津液的亏虚，但是它废水比较多嘛，那么它的阳明层面也比较重，它是既有虚热又有阳明的实热，那么废水还比较重。\n师曰：太阳阳明太阴都有。\n师曰：对，他津血不能濡养，所以才用麦冬和百合嘛。那么竹叶前胡汤呢是一个津液不能濡养，它的虚热为主，热已经转实了嘛，它用人参当归它都是治虚的嘛。\n师曰：白术类的有什么特点呢？白术这个药其实挺迷惑人的。\n问曰：我觉得他跟麻黄有点像，它有偏麻黄的一面，它又有偏里虚。\n师曰：对，你这个思维是对的，因为白术这个药它是除饮的药，它是除有余的东西的药，那么有余的东西多了，阻碍到胃的运化的时候他会用白术嘛，你看这个理中汤，我们认为这个方子是很部的，但是理中汤它治什么，这个水气或者上逆，引起胸闷胸满，或者是吐涎沫，则是不是有余的邪气多了，那或者是下利，是不是水气增多了，真正虚地过重的话它不用白术的，白术这个药是苦的，温的，有点微微的燥性，那么苦温燥的药你对津液是有所燥伤的，为什么生姜甘草汤它就不用白术，因为生姜甘草汤的胃虚已经达到胃津虚的层面了，胃津大亏了，你再用白术的话，胃中水竭嘛，苓术并用是利胃中水气的嘛，那么它利胃中水气的话，它也是竭胃中津液嘛，所以说只要是津液过虚，而不是水气有余的话就不用这个东西的。\n问曰：那单纯是生姜和白术这两个?\n师曰：生姜和白术的话你看，生姜这个药不可否认它可以补津液，那么说它能不能解表，能不能化饮，那它的解表和化饮的性质比白术所牵引的话它就会变成什么，除风、除湿的药了，桂枝附子汤、甘草附子汤都是白术配生姜的嘛。\n问曰：老师这个风到底是什么东西啊？湿、水都好理解，但是这个风我就从来没想明白过。\n答曰：我自己感觉好像，我也感觉不出来。\n师曰：因为这样的，水火气血是人身所本具的东西，我们本具的东西。“水火者，阴阳之征兆也”，我们人身本具阴阳，那么我们的气血，我们津液的状态，那么就是本来就是水和火的一种反应，我们阳气的温煦是不是火，我们的津液的濡养是不是水。那么人身本具的东西，病了以后是人身本具的东西病了，那我们都在这吹吹风，然后有的人感冒了，有的人拉肚子，有的人发烧了，有的人胃中痞满了，都是受的一个风，为什么引起不同的状态？那是引起了人体内不同的水火气血的反应群，并不是风怎么样了。人身本具的东西，出现了病机的话它要出现反应，而风不是这个东西，风是一个外在、客观存在的一种自然界的现象，“风为天地浩荡之气” 。正常的人应该是“虚邪贼风，避之有时”，太冷的地方不要去，然后天气冷了不要开门开窗，天气热了适当通风，符合天地阴阳之道。\n问曰：我记得有具话叫“痒为泄风”，那这个风又是指什么东西。\n答曰：只能是外来的东西了，但是是不是外来的风。\n问曰：它就是根据症候群的特色然后……\n答曰：黄汗篇。\n师曰：对，金匮水气病。\n问曰：我说一个我的理解，黄汗也好，那些风水也好，汗就是津液不断外泄，泄到一定程度之后就会津液就会亏，亏了话他可能一个是容易招邪气，另一个招了邪气之后他又要通过调动自身的津液去祛邪，津液虚，他又不能一鼓作气地把邪气给祛除出去。\n师曰：你的理解基本正确。\n问曰：就会轻微地对抗形成一种痒，如果他剧烈的话他就会痛的。\n师曰：对，基本正确，但是你这种思维方式吧，你老是跟在条文后面跑，老是跟在症状后面跑，你不能自己前瞻性地去用药，咱们为什么提出太阴中风有三个层面，那么其实“痒为泄风”这一段也是重要的一个依据，咱做学术要“无一字无来历，无一字无出处”，那么出处之一就是这段话，这段话是什么意思啊？它是水气病，黄汗病。黄汗病是太阴中风的第三个层面，那么他要里邪出表的话，会不会到第一个层面去，那么这种痒的话是不是一种好现象，是不是里邪出表啊，那么这反证过来，邪风是第一个层面，黄汗是后一个层面的。这样理解了吗。邪气是有深浅的。\n师曰：对啊，他里邪出表了他肯定就病要轻嘛，那么就会……\n问曰：那我只知其一不知其二。\n师曰：那么就会出现这个色黄的症状，这个色黄的症状的话，如果医者是新人的话说：是不是吃药过敏了。我们临床中你只要是按照原方去用的话，会有很多风湿的病号，水肿的患者，他用完药以后身体痒的，你仔细地问诊或者观察，或者患者主动跟你说，你不要认为这是过敏了，你说是很好的现象，这是邪气往外走的现象，但是这又提示怎么的，“痒为泄风，久为痂癞”，你如果一直让他痒下去的话，津血会被燥伤的，让你不要除水气了，要养津液。其实怎么啊，前瞻性地用药。\n问曰：今年一月低的时候许师知道我治过一个慢性湿疹嘛，是我给他治，治治他发烧了，以前从来不发烧，治治发烧了，然后我就给他开了越婢加术汤，然后整个脸全肿起来了，右边脸。当时吓死我了，对方呢也很不高兴，当时就赶紧问许师，许师当时开的那个表里大解，千金时病表里大热方，吃了四付就基本上就下去了。\n师曰：那个方子你们记一下，方子是千金方治时病表里大热方，那么他这个方子咱稍微给他变动一下，他因为原方是有寒水石的，那么寒水石这个药，现在的话你买不到很好的寒水石的，那么原方又有石膏的，石膏和寒水石的话其实是一种东西，完全是一样的东西，只不过寒水石他没有石膏的纹理，石膏我们都知道有竖条的纹理嘛，寒水石是一整块，一个晶体一样。在以前我干门诊的时候，自己进石膏的时候，有时候他会给我寒水石，我用起来和石膏一模一样，所以后来我直接石膏代替寒水石。这个方子组成是：麻黄二两，葛根二两，升麻二两，石膏四两，芒硝二两，大黄二两，这么组成，原方是寒水石。\n问曰：石膏您当时开的是48g。\n师曰：对，那个是翻倍用了嘛，因为那个症状比较重嘛。这个方子有什么作用呢？这个方子是治疗一种病叫做支饮病的，当这个水饮形成一种顽固性的水饮，形成一种水饮的巢穴是时候，你必须用咸寒的药去治疗，那这种水饮以表为主的话，你需要配上麻黄，这个方子他必须处在那个层面，阳明的层面比较重，结和热比较重，那么同时微微得伤到一个津液的濡养的状态了，会有皮肤的甲错，干燥，那么表上呢有废水、废血和这个卫阳比较重，卫阳凝滞在表就会发热，废水凝滞在表就会水肿，废水凝滞在表就会出现肌肤发斑，或者红肿。那么这种情况因为他睡水气比较重，会肿得比较重，这种患者往往肿得比较重，用这个方子效果非常好。我们在把这个方子剖析一遍，你会发现，麻黄、石膏、芒硝、大黄都能治水，只是升麻去清热解毒，然后葛根去清热养津液，在清热解毒和清热养津液的基础上配上一堆水药。这个方子你可以把他和苓甘五味姜辛夏大黄汤对应起来看，你就明白很多了。\n问曰：就一个偏阳，一个偏阴。\n师曰：对。“若其人面色如醉，加大黄以利之”，那个是以太阴层面为主而出现了阳明证，这个是以阳明层面为主而出现了水饮证，水饮是归太阴的嘛，支饮证。这方子退一些顽固性的高烧也很好用，大便燥结。\n问曰：不一定吧，上次许师指导我的时候就没有，完全没有大便秘结。\n师曰：那是水病，他那个是水病，水热。\n师曰：漏芦汤治水嘛，他不是以废水为主的，他如果表上废水的话就不会用芍药了嘛。漏芦汤是以解热为主的嘛，太阳阳明的解热为主的，这个水是比较重的，首先你看立足于水的几张方子，就是为了和别的方子区别嘛。你用漏芦汤的话就是患者会加重的。\n师曰：可以，结和热为主，达到一个需要咸寒的状态的话也可以。\n问曰：金匮里面那个桂枝附子汤为什么后面大便坚，小便自利的话（后面听不清）\n师曰：这个是已经成湿痹了，是一种湿痹病，其实这一篇咱讲过，湿痹病有个特点，或者是大便坚而小便自利，或者是小便不利而大便安，他总归是因为水气郁结在中下焦而引起二便的失调，并不一定必须是大便坚硬的，也并不一定必须是小便不利的。它也可以大便坚小便自利，那么水是从小便尿下来的，那么用白术去这个水。如果是大便安常，小便不利的话，也应该除多余的水。\n所以这个方子，其实你仔细看起来的话，它含有一个完整的生姜甘草汤，只不过是把人参换成了白术，是不是也会增加津液的，敷布津液嘛。\n师曰： 这样，咱下次让余翥把咱的体系详细得讲一下，给大家再详细的讲一下病机的框架，然后呢就是，大家用这个框架，慢慢的去切入临床。\n问曰：到现在，我中风和伤寒的概念还是不清楚。\n师曰：中风和伤寒的话，从症状上来说的话，比如说咱读原文的话，他往往是以汗出为中风，然后无汗为伤寒嘛，那么中风的话往往是脉缓的，伤寒是脉紧的，但是这只是表面，你学这个应该是学不进去的吧。\n答曰：是，我就是分不清楚。\n师曰：然后，怎么去区别什么是中风，什么是伤寒呢，就是一言概之，中风的话就是津血虚而凝滞在表，伤寒的话是津血实而凝滞在表。那么中风的话就是用辛甘温的方法去补津液而解表，伤寒的话就是用辛苦温的方法泄津而解表，那么辛甘温的方法就是桂枝类方代表，辛苦温的方法就是麻黄类方为代表。这就是中风和伤寒的区别。\n问曰：然后太阳中风太阳伤寒，然后阳明也中风也有伤寒，阳明没有伤寒。\n师曰：伤寒是这样的，因为风邪可以洞开脏腑，它可以入中得很深，所以六病都可以有中风，那么，寒邪是凝滞在表，寒邪是收引的嘛，那么一收引的话，他只能在表。只有太阳和少阴有伤寒，别的是没有的。\n师曰：对啊。少阴你看有麻黄剂嘛，麻黄附子细辛汤，麻黄附子甘草汤，有没有？太阳的话，麻黄汤，桂二麻一汤，小陷胸汤其实是少阴的方子，当然也可以说是太阳太阴合病的方子，因为他水的层面不同，寒的层面不同，那么阳明篇有没有麻黄？\n师曰：那不是，那合病的。“发汗后，不可更行桂枝汤，若汗出而喘，无大热者，麻杏甘石汤主之”。你看，发汗后，他往往是指发大汗，表还没解透嘛，那表还没解透的话还有表，所以一般人会用桂枝汤来解表，但是仲景说不可更行桂枝汤，若汗出而喘，无大热者，麻杏甘石汤主之。是不是啊，他是太阳和阳明合病了，那这个古人的说话的方式他非常奇特，他是说的无大热者，他指的这个热吧，还没有白虎汤那么热，但是他已经很热了，所以麻杏甘石汤是可以退高烧的嘛。他指的无大热是说这个病一定有阳明层面了，但是还没达到白虎汤这么大的热，你看他无大热这个三个字，他包含有多少层意思，他是没有白虎汤这么大的热，但是他热已经超过麻黄汤了。那少阳病有没有麻黄剂？\n不用思考，这个绝对没有麻黄剂的，少阳不可汗。\n问曰：少阳我记得用柴胡剂。\n问曰：刚才说的胃气虚，胃气虚的情况下你表上有热，你要去解这个表上的热要用辛寒的方法，但是这个人呢，因为他胃气虚，可能他处于厥阴……\n师曰：胃虚怎么样去治表上的热，表上有热，然后又胃虚，怎么样去顾及这个问题。\n问曰：一般来说，表上的热还是应该用辛寒去解表，因为他胃气虚……\n师曰：对，你的意思我基本明白了，他是这样的，如果病人是胃虚的话，有表证的话，往往是不能去攻表嘛，不能去攻表那么辛药会不会发散津液，那辛药发散津液的话你是不是不能用辛药去解表了，那么用什么方法去解表呢？有几个好的方子，小柴胡汤、柴胡去半夏加瓜蒌根汤，治寒热如疟，热多寒少，对不对，寒热如疟证明是有寒有热嘛，那热多寒少。（柴胡去半夏加瓜蒌根汤）就是说这种情况他往往不是用咱想象的那种桂枝剂或者麻黄剂去解表，他用生姜甘草汤去解表，那么往往是这个表单纯生姜甘草汤的话，有可能是这个表他牵引得不够，他往往配柴胡剂，因为柴胡是少阳的表药嘛，那么他也能治疗一部风类厥阴一些表嘛。其实还是“此属胃，胃和则愈，胃不和，烦而悸”那个范畴，那么他用补胃的方法，在补胃的同时，为什么不用甘草干姜汤去补啊，因为他有表嘛，他需要散一下，所以用生姜甘草汤去补胃，再加上柴胡剂，这样用的多一些。\n师曰：对啊，生姜甘草汤他配上甘草，配上人参，配上大枣。\n问曰：就是辛寒和苦寒是……（问题听不清）\n师曰：他是这样的，因为有生姜这个辛药，然后再配上苦药的话，苦一般他不是选择这种大苦大寒的药，他能起到一种辛开苦降的的作用，辛开苦降是气味的搭配嘛，那比如说这个小柴胡汤这个方子，柴胡是苦平的嘛，那么生姜是辛温的，那么他可以到达一个辛开苦降，辛开苦降本来就是能开表，而降里嘛，那么是不是表里三焦就疏通了嘛，而他没有用桂枝去解这个表，因为如果是用桂枝攻表的话，胃中水竭，所以用既能补津液，又能解表的生姜，那么单纯用生姜汤会发现过度热了，因为表上有热，他就会用柴胡，柴胡是既能去解表，解伤寒的表，或者一部分厥阴的表，又能去辛开苦降，疏利三焦，把好的津液生华上来，坏的的水发散掉。\n问曰：我觉得还是比较偏向于柴胡。\n师曰：对柴胡剂多一些。","hasDose":true,"patient":"（7月13，第二份。内部深圳师兄弟聚会。）","symptom":"","exam":"","prescription":"师曰：她就是体内，水火气血的某一些阻碍，就不能受孕了，你把邪气给它去除掉，好的津液，好的津血自然能濡养，濡养胞宫的话就能正常受孕了。临床一定要重视邪气的存在，邪气是客观存在的。","effect":""},{"caseId":"Y0967","caseSource":"医案集·跟诊会诊／160711-007.docx","caseType":"案集医案","归集方":"160711","usedFormulas":["黄芩汤"],"isCombine":true,"history":"","analysis":"","comment":"","caseExcerpt":"（7月11，第七份录音，第一个湿疹病人先半量小建中后竹叶前胡汤。第二个是司机大哥。之后是内部交流。）\n师曰：他分虚火和实火，首先说阳明外燥嘛，阳明外燥的话首先要分虚实，有的是虚性津液不能濡养，有点是实性的，火热内伤，内伤津血，我们治火热。那津液本来就少了我们去濡养津血，层面是不一样的。\n第一个病人\n病人：脚也是这样的，手脚一样。\n病人：柳慰。\n病人：46，他会掉皮。\n病人：没有分季节的。\n病人：脸上没有，脚上有。\n病人：没有。\n病人：每天喝很多水。\n病人：喝茶，就是喝普洱。\n病人：吃饭可以\n病人：不疼不胀。\n病人：正常，每天2次，正常吧。\n病人：没有，没有夜尿。\n病人：不怕。\n病人：不。\n病人：发麻是有一点点，因为这个神经可能，颈椎啊\n病人：就是这两个手有点麻。经常会这两个手麻。\n病人：出汗多。\n病人：热一点就会出汗。\n病人：会。\n病人：睡眠不会。\n病人：（未作答）\n病人：挺好。睡着很快。\n病人：不怕。\n师曰：大便每天2次，轻证，正常的消磨水谷是每天一次，2次的话里虚的轻证，这个轻证你用药稍微照顾一下，不是主要的治疗方向。下睑淡白。先用半量的小建中汤，会把津液濡养起来。\n答曰：竹叶前胡汤。\n师曰：对，当然是。会产生虚热往实热方面转，这个其实和太阴中风的黄汗转为痈脓是一样的嘛。我们会前瞻性去用药，给他把病机，再用小建中汤濡养起来后马上用竹叶前胡汤给他平复下去，那这样的话不但说症状会好了，整个体质会改善过来。这个6付，这个4付。\n师曰：那看，竹叶前胡汤里面是竹叶二两，黄芩一两半，人参，前胡。竹叶、人参、黄芩这些药清实性的药，它的比例并不少。\n师曰：你看，津液濡养起来了吧，热也清下去了吧，病机会转成……\n师曰：那倒不会，后续有可能是黄芩汤证多一些。因为他本来汗出，食汗，阳明热嘛，只不过现在是津血不能濡养，你不能去过用苦药了，先用甘药，然后再用甘药和苦药结合，然后再用苦药。\n问曰：也是说太阴层面解掉了，然后湿热层面减轻了，那接下来后面还是\n师曰：他现在是太阴中风哪个层面？有邪风，风湿热燥嘛。对，有虚热，但是也有实热。他这种水饮的话你可以忽略不计，因为太阴中风本来就包含水饮嘛，那么你要找出特异性的，太阴中风占层面最多的那部分，然后在加上血痹和黄汗，麻木加汗出嘛，是不是，这是他的状态。那么黄汗状态是不是往下传就会痈脓啊，痈脓的话用竹叶、前胡、黄芩、人参可以是吧。然后这个方子养起来以后痈脓这个层面会解，痈脓解的话，你看黄芩汤这个方子，黄芩是可以治痈脓的，芍药治这个的，对不对？然后甘草大枣治太阴的药，虽然是个病传的过程可以，但是还是在太阴中风打转。\n第二个病人\n病 n37桂麻各半汤、桂二麻一汤、桂二越一汤的区别？................................................................48\n\n保胃气、存津液、和营卫、畅三焦\n\n38防己黄芪汤和防己茯苓汤的区别............................................................................................48\n39许师讲枳实栀子豉汤................................................................................................................49\n表束的三个层面..............................................................................................................................49\n40肾着汤、真武汤、附子汤、苓桂术甘汤、茯苓四逆汤的区别............................................49\n41桂枝二越婢一汤解析（27条）..............................................................................................50\n42许师解析越婢加术汤................................................................................................................51\n43栀子豉类方与黄芩汤的区别....................................................................................................51\n44甘草麻黄汤，大黄甘草汤与芍药甘草汤区别。....................................................................52\n45曹某某 女 39.......................................................................................................................53\n46黄芪桂枝五物汤........................................................................................................................53\n47温脾汤........................................................................................................................................54\n48黄芪建中汤................................................................................................................................54\n49小建中汤转黄芪建中汤............................................................................................................55\n50天雄散........................................................................................................................................56\n51小青龙加石膏汤........................................................................................................................57\n52续命煮散....................................................................................................................................57\n53苓桂味甘汤................................................................................................................................58\n54小柴胡和柴胡桂枝汤的区别....................................................................................................59\n55千金小鳖甲丸............................................................................................................................60\n56桂枝茯苓丸................................................................................................................................61\n57竹叶前胡汤和黄芩加半夏生姜汤，柴胡桂枝汤的区别？....................................................61\n58半量黄芪建中汤........................................................................................................................61\n59大柴胡汤治疗下利....................................................................................................................63\n60建中汤........................................................................................................................................63\n61芍药的功效................................................................................................................................64\n62麻黄剂量....................................................................................................................................66\n63浅说柴胡桂枝干姜汤................................................................................................................66\n64麻黄附子细辛汤与麻黄升麻汤的方解....................................................................................69\n65许师答疑-芪芍桂酒汤案..........................................................................................................70\n66柴胡加芒硝汤案及条文方机解................................................................................................72\n67外台六物黄芩汤........................................................................................................................75\n68深师三黄石膏汤及阳明酸寒法和类厥阴甘寒法的鉴别........................................................75\n69关于手汗....................................................................................................................................76\n\n保胃气、存津液、和营卫、畅三焦\n\n十问歌解析\n述：许家栋老师 分享：胡西平师兄2015-9-2 20:35:53：\n 由于这段时间新进班的学员不少，有的基础不太好，下面我就把我２０１３年在许师哪\n跟诊时整理的一些关于十问歌的资料和大家和分享。\n１、寒热问题：\n 第一是要了解病人的寒热情况，一是整体的寒热，整个身体的怕风怕冷状态，强度，有\n多怕，怕到什么程度，整体的怕冷还是局部的怕冷，如果是整体的怕冷，表证是非常明显的，\n局部的怕冷，一般都会有里证和表证夹杂的情况，比如说一个病人，只有关节冷，身体不冷，\n只是局部一些表的问题，有可能就是有少阴的问题，或者有表的问题，有太阳的问题，或者\n太阴水饮，或者阳明的夹杂。\n２、汗的问题：\n 如果是以汗为主诉的病患，肯定会存在营卫的不和，不管是有表或有里，这个汗是由表\n或里引起的，都存在营卫不和，比如说，太阳桂枝汤证可以出现营卫不和的出汗，是以营卫\n不和为主的，它的营卫不和有两个层次，第一个是卫强营弱，卫气在表上强了，营在里面不\n足了，这是卫强营弱的出汗，第二是营卫俱虚，在营虚的情况上卫也不足了，津液亏虚了，\n也可以用桂枝汤来补津液，这个太阳病会有，尤其到太阴病尤其明显，所以太阴病才会加上\n黄芪之类的药，即可以有补益作用，又可以有驱风的作用，和祛湿的作用，去治疗营卫不和\n和中风的汗出。\n 阳明的汗出，第一是阳明的中风，第二是阳明的外证，这两种情况以汗出为主，阳明中\n风会伴有里热津亏非常明显和在表上风的症状，用石膏的辛去达表，然后用补津液的人参和\n甘草、粳米的配伍来补津液，阳明的中风就是以这个方证为主（白虎加人参汤） ，它的外证\n呢，所有的外证都是以里证为主的外在表现，阳明的外证就是说在阳明里热的基础上，因为\n阳明里热了，它外面也热，就象一个火炉一样，里面烧的红红的，外面也是热的，这是阳明\n的外证，它也是蒸腾汗出，它里面蒸蒸发汗，汗出非常明显，然后清里热就行了，它虽然是\n有表证的表现，人烦躁、壮热、身热、灼热，但是清里热就行了，用白虎汤去清里热就行，\n白虎汤方证也是多维的，它即可以治表的三阳合病，可以治纯的里热。\n 再说说少阳，少阳的汗出一般就是说伴有寒热往来的汗出，寒热往来的过程中有出汗的\n情况，这是伴随的症状。太阳的肯定是以怕风怕冷为主的出汗，阳明的是以怕热为主，当然\n也会轻微的恶寒，但是以怕热为主的出汗，少阳的往来寒热的汗出这是我们辨别汗出的不同\n的一些伴随证，辨别它是属于哪个纲的病。\n 比如少阴的汗出，到了少阴的层面，第一影响到了卫阳，阳气不足了，第二是影响到营\n的问题， 因为少阴的层面比太阳深， 会影响到人的营会更重一些， 所以说它用桂枝汤加附子，\n桂枝汤加附子这个方，其实就是一个桂枝汤合上一个芍药甘草附子汤，芍药甘草附子汤其实\n就是一个养津液、温津液来治里的津伤的，在桂枝汤的基础上加重了治营分的药，加重了温\n卫阳的药，来治疗一系序症状，面色无华（因为不能荣养了）、四肢微急（津液散失多了，\n四肢就会不得劲，功能活动受限制了，或者是拘挛了甚至是抽筋都有可能） 、再一个就是小\n\n保胃气、存津液、和营卫、畅三焦\n\n便难（里面津液不足了，小便就要变少） ，太阳病的中风一般不会有小便难的情况到了少阴\n就会有这个层面。就是说它是汗出、怕冷、恶风、恶寒、四肢微急、小便难、面色无华，这\n肯定是少阴的中风汗出。\n 厥阴的汗出非常明显的，因为是寒热错杂，手足脚心发热伴随出汗，或者上热下寒伴随\n出汗，烦热伴随出汗，都会伴有一些虚寒的表现，里面可能有大便溏泻，手足心出汗，它有\n可能觉得手足心热，但是又怕风怕冷的，手足又是凉的。\n 太阴的出汗就是存在一个桂枝加黄芪汤和芪芍桂酒汤，黄芪防已汤这类的方子，它是以\n表上的津、血、饮并见为主，表上的津不足了，用桂枝加黄芪汤，加上黄芪祛风补津，然后\n祛湿，血不足就是用黄芪桂枝五物汤，它是血痹麻，四肢就像被捆了一样，肢体的烦躁，甚\n至是手脚不能正常的活动，肢体麻木，这就是也血一个问题为主的时候，再一个就是以饮的\n问题为主的时候，就是芪芍桂酒汤，它在表上的饮太多了，要用泻的方法去治疗，加大黄芪\n的量再配上苦酒，既有黄芪的从里的甘温的达表的效果了发散在表的风水饮，又能用苦酒苦\n味去宣泻，苦味去涌散表上的饮，因为这种情况，太阴的风，太阴的饮，因为风和饮杂夹在\n一起，阻隔在表的话，它会里面有些热传导不力的，在上面下不去了，所以这个人会有一些\n轻微的热证，但这种热证不是泻心类方的热证，虽然有热证，整体怕风怕冷，肢体的挛急、\n肢体的不用，汗出湿冷为主的。这就是芪芍桂酒汤的一些症状，也会有心烦的，也会有口苦\n的。\n 再就泻心类方的汗出，阳明的汗出和太阴的里虚里寒，有可能大便溏泻，上焦的烦热，\n肢体的异常出汗。\n３、问头面症状：\n 人体上焦阳窍的一些症状，比如说，口苦、咽干、目眩、耳鸣的症状，第一是判断有没\n有表束的问题，第二是判断有没有热的问题，少阳的热会口苦、咽干、目赤。再一个是水饮\n的问题，如果有水饮的话，表上的水饮为主的话，有可能是鼻涕比较多、鼻塞，有可能耳鸣、\n有可能眼泪汪汪、有可能是口中涎沫多。\n４、问身体的症状：\n 身体是不是沉重，身体的疼痛，辨别致病因素，比如说，水饮多的话，身体是沉重的，\n如果是风多，身体是迟缓的、无力的，寒多的话身体是疼痛的。\n５、二便的问题：\n 如果是便秘就是偏于阳明的里滞、里燥。如果是大便干燥，肯定有里燥症，大便的天数\n多，虽然干燥但是天数少，一天一次这是里燥为主，又干燥，时间又延长，又有里滞，又有\n里燥，这个就是既需要润又需要通下攻下，相应的药症和方证都会不同，\n大便溏泻是太阴的问题，厥阴的大便溏泻一般都伴有热证在里面，太阴的话一般都是纯虚寒\n症，\n 再就是有些人大便不干燥，但是排便困难，这种情况一般是有胃虚的症状，再就是有气\n滞的症状，再就是有水饮的夹杂。\n 再有小便的问题，小便白者，里有寒，里有虚，小便黄者，红者，里有热，小便红者当\n然是伤血。尿频、尿急、尿滴沥、尿等待、小便热、混浊、气味大，一般是水饮或者是水热，\n\n保胃气、存津液、和营卫、畅三焦\n\n如果说单纯的尿频、 尿急没有小便性质和气味的改变， 再伴有一些虚的症状， 就要考虑里虚，\n第一就是太阴的里虚证，第二是下焦虚有寒不能制水，虚寒以后它不能去收摄水液，而小便\n的性质，气味发生改变时，郁热有水饮。\n６、问饮食的情况：\n 食欲好的时候，胃气好，太阴的里虚的情况不存在，如果食欲不振的话，这就是太阴里\n虚的症状存在，不能运化了，胃气也相应的变亏虚了，如果吃完饭肚子胀，在里虚的基础上\n有可能伴有里的气滞，或者气的溢出，或者的气的一些气胀，如果有伴有疼痛的，有可能是\n伴有一些里寒证，如果食欲亢进，这是阳明里热了，里热以后引起的一些能食的症状，还有\n阳明病能食为中风，不能食者为中实，为什么说阳明病能食者为中风，不能食者为中实，因\n为承气的一些类方，在有燥屎的情况下，他是不能吃饭的，里实的情况反而不能食，中风的\n情况是里热为主，能食，这就出来一个严谨的阳明病的框架。\n７、问有没有胸痛、胸闷、心慌、心悸看有没有表束和有没有水饮，里热上趋这一系列的。\n８、问口干、口苦、口渴这类症状：\n 如果是口干，除了太阳病不会引起口干，阳明的口干是口干多饮的，重的话是喜欢冷饮\n的，如果是太阴病的口干，是口干不欲饮，或者是喝水喝一点，但是不想咽，少阴的口干，\n一般是口干不想喝水，或者是虽然口干，但是见了水反而会厌恶，厥阴病的口干，一般是喜\n欢喝水，但是喜欢喝热水，这个是要看几种情况综合分析，也有厥阴喜欢喝凉的，肯定是上\n热比较重一些，还有一个饮不解渴，第一是有水饮存在，第二是里热伤津了，伤到津液了，\n人要饮水自救，不能补津液还是渴，这是里热的症状。\n９、妇女经带胎产：\n 白带是最明显的水饮症状，如果是白带多，肯定是有水饮的存在，白带多清浠的话，一\n般是虚寒水饮，混浊的话一般有湿热，或者是有水热，夹杂厥阴的一些问题，\n如果是月经色淡的，太阴血虚，如果是色紫色红的，一般是阳明血热，量多的话会伤到血，\n量少是血少症，有血块是阳明的里滞症，这个里滞是血分的里滞，经期的延长，缩短，是伤\n血，周期的延长，缩短也是伤血。伤血就是病已经入血份了，已经耗伤血，或寒或热都可以，\n血属太阴，处方时，就要血份上的药为照顾\n10、小孩的问诊：\n 问家长晚上睡觉有没有蹬被，出汗的情况，晚上蹬被是有阳明里热的情况，出汗的话，\n一般也是有里热，除了特殊的虚寒性的体质，如果有尿床、遗尿一般是有水饮症，太阴的里\n虚和少阴的虚寒不能制水。平时手脚凉热是辨别寒热的一个区别。\n11、睡眠问诊：\n 睡眠的障碍除了太阳病，别的纲都会出现，阳明病，因为阳明的里热还有伤到津液的时\n候，或者伤到血的时候，就会引起睡眠的障碍，失眠、烦躁、易怒，甚致是精神的障碍，狂\n躁或精神失常，少阳病有个热入血室，会影响人的睡眠或精神障碍，如果是水饮重的话，也\n可以是少阴的人的心脑引起的睡眠障碍，少阴病的失眠，第一是阴阳的转化不利了，引起白\n天比较烦躁，晚上又非常安静，和正常的阴阳不一样了，正常的阴阳，白天应该动，晚上应\n该静，少阴和厥阴有很多地方重合，一是阴阳的转化不利和厥阴的重合，第二是营血的不通\n\n保胃气、存津液、和营卫、畅三焦\n\n和厥阴是重合的， 所以说少阴和厥阴的方子可以通用的， 少阴的干姜附子汤证又个失眠症状，\n还有伤了营的当归四逆汤证，也可以引起失眠的症状，同样一些营血夹杂的一些温经汤证，\n也会有失眠的，这就是寒热互含了，就是说在少阴病的层面再加上，寒热互含再重的话，就\n是属厥阴的问题，这种情况也会引起失眠，单纯的阴，伤到营的话，也会引起失眠，所以用\n当归四逆汤和干姜附子汤治疗失眠效果也非常好，\n 有一部分失眠是表不通引起的，表束，表阴症，白天昏昏沉沉要睡觉，晚上睡不着，用\n麻黄附子甘草汤或续命煮散的一些类方，小青龙也可以，有饮的，有表的阴症的失眠的，太\n阴病的失眠，是伤到血了，血不养心的失眠，再就是有饮重的失眠，它的方证是胶艾汤或胶\n姜汤一类的，或者当归汤都可以，水饮重引起的失眠有五苓散证，真武汤证，半夏秫米汤证，\n小半夏加茯苓汤证都可以， 厥阴的失眠， 一是大部分常见的寒热杂错， 乌梅丸证和温经汤证，\n温经汤证是也伤到营血为主，乌梅丸证是以阴阳的不通为主，再就是一部分的当归四逆汤证\n也是， 或者当归四逆汤加吴茱萸生姜汤都可以， 少阴病还有一个二加龙骨汤证， 以少阴为主，\n还有营卫的不和，有了阳明的虚热，轻微的水饮上逆的症状。\n圣浩师兄对许师辩证方法之总结课\n2016年1月13日\n今天由我带领大家复习讲义。\n我试着把讲义串联起来，简述许师的辨证步骤（我理解的许师辨证步骤，请诸位师兄师姐多\n多指正）。\n这次在五莲跟诊，发现许师边问诊边提炼基础病机，并以一定格式写下来，做到一目了然而\n不遗漏任何症状。这是非常值得我们学习的辨证方法。现我把个人的学习体会整理如下，请\n各位师兄师弟多多指正。\n《外台秘要》 曰：“表里之治，相背千里，吉凶之机，应若影响····若此虚实表里之交\n错，其候至微，发汗吐下之相反，其祸至速”。\n伤寒的精髓是表里之辨， 所以辨证首辨表里。 许师辨证时表里是分开写的， 而不是写成一串。\n如：\n表束+中风+伤营\n阳明热+外结+里结+里燥\n太阴里虚+水饮\n表的问题写在第一行，第二行开始写里的问题，以阳明排在前，太阴排在后。如此表里分明，\n提纲挈领。辨证的第一步称为见山是山，也就是就是采集症状，分解到最细小的病机，如见\n表的问题就是表束，见热就是阳明热，见水则为水饮等等。\n表的基础病机：表束 中风 伤营 伤寒 表阴（阳）（热） \n里的基础病机：阳明热 里热 里结 里燥 外燥 外结 水热\n 太阴胃虚 水饮 伤血 里寒 血少 \n辨证的第二步是见山不是山\n经过第一步基础病机的采集，我们对四诊有了个大致的了解。下面就需要把基础病机组合起\n\n保胃气、存津液、和营卫、畅三焦\n\n来。同时这也是一个分辨表里虚实寒热六病的过程。\n第一步先辨里证。\n在我们辨证模型中，典型的里证为阳明之里实热、太阴之里虚寒。也就是分辨这个里证是阳\n明为主还是太阴为主，并进一步分辨病机的层次。\n太阴病基础病机可以分为胃虚、水饮、伤血、里寒，血少。\n这里每一个元素都需要分开来讲。\n出现胃虚的时候，需要分辨胃虚的四层次。到底是胃气虚、胃虚寒、胃津虚、胃虚热。\n胃气虚见虚寒而以虚为主，主方时理中丸。\n胃虚寒以寒为主，主方时甘草干姜汤\n胃虚热以胃虚+热，主方时建中汤，芍药甘草+饴糖的方纲。\n胃津虚以胃虚+津液不足为主，主方时芍药甘草汤。\n还有未达到胃虚四层次的轻证而见胃虚而有饮的生姜甘草汤证，再轻则为半个生姜甘草汤。\n辨水饮\n津液不利+胃虚则为水饮。水饮都包含在四饮大法里面。水的去路无非是津液的离散，在于\n水道和谷道。《金匮·水气病脉证并治》：师曰：诸有水者，腰以下肿，当利小便；腰以上\n肿，当发汗乃愈。\n淡饮是基础，主以温药和之，主药是茯苓，这里面蕴涵着温补为主还是温化为主。各有方根\n支持，详细可见三期课程（淡饮篇）。淡饮茯苓法，其实是从小便而解。\n溢饮是表饮，病溢饮当发其汗，主以汗法，主药以偏虚为黄芪，偏实为麻黄。溢饮麻黄黄芪\n法，其实是从水道玄腑而解。\n支饮是表里错杂，虚实错杂。寒热错杂，当依法治之。\n悬饮是饮邪盛而正未衰，主以攻逐，主药是甘遂，以十枣汤、甘遂半夏汤为代表。悬饮甘遂\n法，其实是从谷道而解。\n伤血多见血之不濡养不养，血络浮露，睑色的淡等，主药是白芍、川芎等药。\n血少多见余月经量少，血之不煦，肌肤苍白为主，主药是阿胶、当归等\n里寒，多表现腹中冷，身冷，下利无度等，主方以四逆辈。\n太阴病都是以里虚寒的基础上展开，更详细的描述就是二期课程太阴病了，所以二期三期前\n面讲的都是基础，需要反复温习。\n阳明病的基础病机：里热、外热、外结、里结、外燥、里燥、水热\n这个的表现不需要多讲。阳明的主要难点在于所有的基本病机都需要分虚实。\n里热，这个需要分实热还是虚热，因为里热可以灼伤津血，看到里虚的一面，但是主要矛盾\n在于里实热。对治实热的法则以阳明的四法（辛寒散热、苦寒折热、酸寒泄热、咸寒攻\n热）。\n同时太阴津血不足可见阴不涵阳之阳热偏亢， 主以甘润甘寒之品， 一如百合类方、 地黄类方、\n麦冬类方。\n外热，可以分两种，一种是里热表现在外，主以苦寒折热、咸寒攻热 ； 一种是表位的热明显，\n\n保胃气、存津液、和营卫、畅三焦\n\n如肢体的发热，胸部的热等，这种热主以辛寒散热、酸寒泄热。\n里燥里结，如果里实热+里结+里燥，那么以阳明四法治之；如果里虚热+里结+里燥，当以甘\n润之法，一如建中系列。\n水热，其实是阳明里热+太阴水饮的组合。衍化的病机是湿热，其实是水火二证并见，依病\n机的偏倚可以见火盛或者水盛。\n以上就是里证的病机。\n那么表证的病机：表束 表阴（表阳） 中风 伤营 伤寒\n表束：四肢百骸皆为表，表位出现的任何问题都辨证为表束。\n表阴（表阳）：表位出现阴的症状，如寒、痿废不用等，同理表阳反之\n中风：中风的实质是津液的不足、津液的外泄，多表现为汗出及小便问题。\n伤营：营卫属于表的津液，所以伤营和伤血相对，伤血放在里位的病机。伤营多表现为眠差\n等。\n伤寒：是津液的表聚充实，表实而对风寒的过分敏感。\n表束的问题，需要分辨表束的三层次（具体详见表束三层次文）。\n表束的三层次，其实也是表里辨，有表证有表邪，这个津液的表聚，必须以发越为主。有表\n证无表邪，其实是里证为主，不需要发越。外证是里证为主，绝不可发越。\n以上是表里位的基础病机。\n这一步就是见山是山，不必深究。\n第二步是见山不是山，需要在基础病机的基础上辨析组合病机。\n如表束 中风 伤营，如果不见里证，那么就是太阳中风了，若果同时见里证以太阴为主，那\n么这个表束中风就是太阴中风，再进一步就是分辨太阴中风的三层次问题（见二期讲稿之邪\n风虚热、水饮血痹、风水黄汗）\n如果表束 中风 ，同时里证以阳明为主，那么这个就是阳明中风，走的是白虎加人参汤。\n如果表束中风+表阴，里证以里虚里寒为主，这个就是少阴中风，甚至少阴病之下焦虚有寒。\n如果表里错杂，寒热错杂，虚实错杂，这就需要考虑少阳病机（少阳四大病机） 或者考虑类\n厥阴问题。\n同理，这样可以分辨六病。\n以上，辨表辨里的法则都包含其中。\n第二步经过见山不是山后，基本可以选方了。但是遇到复杂的还需要纵向列入水火气血的体\n系，以帮助选方，如辨证完之后，整个判断是火证偏多，那么在火证的方里面选，走的是阳\n明四法，如果是水证偏多，大的方向辨金匮四饮，在水证的方里面选。如果是气证偏多，多\n兼夹表束，以表阴还是表阳，表阴以桂枝+枳实为主，表阳以栀子+枳实为主。如果是血证偏\n多，则多为太阴，兼夹水血同病。\n至于少阳的问题，以少阳属胃作为重点辨析，因为胃具有生津液、制水饮、制浊气、制下焦、\n御表邪的作用。少阳病以胃的这个几项功能异常作为突出表现。也就是少阳的四证（邪气交\n争于表，上焦郁火，中焦胃虚，下焦饮逆）。少阳属胃的另外一个表现是以三焦的形式出现。\n三焦是水火通路，以中为制约。\n\n保胃气、存津液、和营卫、畅三焦\n\n至于厥阴病，真厥阴是阴阳的离决，以四逆辈、通脉四逆辈为主。\n类厥阴病，依据错杂的偏重各有主方：\n以表里错杂为主：厥阴中风：（小柴胡、柴胡桂枝汤、柴胡桂枝干姜汤、桂枝汤等）\n以寒热虚实为主：厥阴外证：（泻心汤法）\n至于各类混杂的，就是类厥阴方，这个包含在整个辨证体系内。\n少阳、厥阴的问题，因为临床基本上都是太阴阳明而兼表的问题，都属于类厥阴病。类厥阴\n和少阳的难点个人认为是在于辨可与不可的问题。 在可与不可之间， 主要看胃虚和津亏程度，\n例如少阳病，不可汗不可吐不可下；类厥阴病很多也是这种情况，病当发越，但是津亏不可\n发越，这种两难的境地衍生出来新的理法，表现比较突出的是柴胡类方及续命类方，这个方\n向可以细辨。\n如此，我们辨证太阳、阳明、少阳、少阴、太阴、厥阴都没有问题了。\n整个辨证体系，还需要关注津液的输布离合问题。\n《素问·经脉别论篇》：“饮入于胃,游溢精气,上输于脾.脾气散精,上归于肺,通调入道,下\n输膀胱.水精四布,五经并行,合于四时五脏阴阳,揆度以为常也。”这段是对水谷化生津液\n到津液布散而出的描述，是朴素的人体生理模型。其实也就是我们说的输布离合。\n输代表津液的来路，布代表津液的布散，离代表津液的离散，合代表营卫气血的和合。这样，\n让整个体系活动起来，不仅仅辨的是静止的气血，更加辨的是活动的气血。\n病人所急所苦是一个重要参考， 提炼所急所苦症之后的病机尤为重要， 在这个病机的基础上，\n代入津液的输布离合。\n所以辨证的点睛之笔在于明晰津液的动向。如“伤寒，不大便六七日，头痛有热者，与承气\n汤。其小便清者，知不在里，仍在表也，当须发汗。若头痛者，必衄。宜桂枝汤。二十二。\n用前第十二方。[56]”这是虽有里证，但是以津液聚表而里津不足引起，治表而可复里。又\n如半夏泻心汤和甘草泻心汤之比较，都有太阴的外证，而半夏泻心汤以病势的上逆为主，甘\n草泻心汤以病势的下趋为主。这是辨活灵活现的气血，机巧灵动所在。\n下面用我的一个小案来分析","hasDose":false},{"caseId":"P0009","caseSource":"A方证大全1762784856","caseType":"讲义医案","归集方":"栀子厚朴汤","usedFormulas":["黄芩汤"],"isCombine":true,"patient":"主诉：荨麻疹月余","symptom":"主诉：荨麻疹月余","history":"","exam":"刻诊：无恶寒发热，汗出正常，有时胃有点不舒服，放屁多。喝水多，喜欢喝水，温水，口","analysis":"","prescription":"许师：看剂量：麻黄3 薏米3 杏仁3 炙甘草6","effect":"","comment":"","caseExcerpt":"主诉：荨麻疹月余\n大片，红，痒，肿，每日反复发作。\n恶寒，无恶风，手足汗出多，汗出身凉\n不口渴，手足汗出。\n无胸闷，食欲可，食后心下痛，胀烧心反酸，无腹部怕凉无肠鸣，大便食辣腹泻，平素软便，\n里急后重每日2次，小便正常，睡眠可。\n苔：微黄腻 舌质：淡 眼睑下缘：边红睑白\n右手寸细稍弦关细稍弦尺沉细\n左手寸浮细弦关细弦稍滑尺沉细\n腹诊： 腹满 下肢肌肤甲错\n芪芍桂酒汤煎剂5天\n患者服药第三天反馈发作次数和发作时间明显减少。\n34许师答疑：防己黄芪汤为什么没有桂枝？\n感谢许师答疑 感谢邓茹月同学的分享\n防己黄芪汤\n治风湿脉浮身重汗出恶风方。\n甘草（二两）黄芪（五两） 汉防己（四两） 生姜 白术（各三两） 大枣（十二枚）\n上六味 咀，以水六升煮取三升，分三服，服了坐被中，欲解如虫行皮中，卧取汗。\n桂枝附子去桂加白术汤证\n白术（二两） 附子（一枚半，炮，去皮） 甘草（一两，炙） 生姜（一两半，切） 大枣\n（六枚）\n上五味，以水三升，煮取一升，去滓，分温三服。一服觉身痹，半日许再服，三服都尽，其\n人如冒状，勿怪，即是术附并走皮中，逐水气未得除故耳。\n若其人大便硬，小便自利者，去桂枝加白术汤主之。（174，或《金匮要略。痉湿喝病脉证\n第二》）\n 防己黄芪汤来源于桂枝去桂加白术汤，治疗风湿肢痛为主，因为以太阴为主不到少阴的\n层面，故而去了附子，因为加用了黄芪防己去表饮，还可以兼治风水。并且这两个方子服用\n后的反应非常相类。\n67、伤寒，若吐、若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振\n振摇者，茯苓桂枝白术甘草汤主之。\n防己茯苓汤\n防己（三两） 黄芪（三两） 桂枝（三两） 茯苓（六两） 甘草（二两）\n\n保胃气、存津液、和营卫、畅三焦\n\n上五味，以水六升，煮取二升，分温三服。\n皮水为病，四肢肿，水气在皮肤中，四肢聂聂动者，防已茯苓汤主之。（金匮要略。水气病。\n22）\n 防己茯苓汤来源于苓桂术甘汤，苓桂术甘汤治疗“伤寒，若吐、若下后，心下逆满，气\n上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者”，“身为振振摇”和“四肢聂聂\n动”程度不同，病理相类，而因为防己黄芪汤证里证少于表证（里证为辅，表之饮证为主）\n（里水，虚则黄芪法）病机，故去用苓桂术甘汤去白术加防己黄芪去表饮。\n35枳实栀子豉汤和栀子厚朴汤的区别：\n 许师曰：栀子厚朴汤是实热加气滞；枳实栀子豉汤是水饮、胃虚、虚热、实热、气滞。\n 大病差后，劳复者，枳实栀子豉汤主之。\n大病基本上好了，而不了了，劳复就是有很多复发的可能，或者是饮食不节后食复，大病后\n胃气未复，过度去疲劳引起复发（出现腹满腹胀） ，大病之后人体的胃气都是偏虚，胃虚的\n基础上易产生水饮，水饮需要利小便，又不能用淡渗茯苓白术去渗利，易造成胃中水竭，需\n要既能补益又能调畅血脉又能利小便还能增加津液7升酸浆水。 在此基础上用到枳实去行气\n除滞，配上栀子去清热，栀子配伍豆豉既可以涌泄又可以清化健运，豆豉既能从上焦吐（苦\n温，吐了后上焦邪气解了就止后服） ，又能配伍枳实从下焦而下。那么说这个方子主要作用\n清热补津液而能涌散邪气。\n 伤寒下后，心烦，腹满，卧起不安者，栀子厚朴汤主之。\n伤寒下后（阳明腑实证，下后应该能解） ，有形实邪已经下去了，胃中烦满大便难的情况得\n到解除，但是说燥实去了，这个人还有心烦腹满卧起不安，这是无形的热气，无形热气还没\n有消除，这类情况不能用大黄类去攻下，不能用承气汤去攻下，那么就用栀子去清下，又厚\n朴枳实去除胀除满，栀子厚朴汤，没有水饮，完全是一个阳明里实下以后的实热证，实热加\n上气滞，或者说在阳明里实证以前，还没形成燥屎以前的一个实热加气滞。\n 附：\n现7升酸浆水用120毫升啤酒代替，酸浆水较平和，啤酒毕竟有酒的性质，故减量。\n酸浆水：做酒之前的一种状态，有谷类米类的补益作用，有补虚，利小便，清虚热，还有一\n定调整血分的作用；喝啤酒后会小便多，有利小便的作用，这种利小便是建立在既能滋津液\n也能利小便，不像茯苓淡渗，而是增加了津液再利小便。\n 温故而知新：\n豆豉功效：1、清热利湿除烦虚2、和中养胃健运3、疏散微透表邪4、涌泄轻宣郁滞。\n36桂枝去芍药加蜀漆牡蛎龙骨救逆汤\n蜀漆是常山苗，催吐、截疟。风寒湿燥火五邪可以外感和内生，可以火邪在外引起的里证，\n也可以里面津血亏虚痰饮内生使火热在表留积。\n桂枝去芍药加蜀漆牡蛎龙骨救逆汤是里面太阴盛，痰饮重，蜀漆龙骨牡蛎化痰，去养津\n血，制约桂枝的芍药，除了痰盛还有表热，这种热有可能是实热，有可能是虚热，可以有太\n阳表上的实热证。火邪指不正常的火，包括外感和内生。 \n\n保胃气、存津液、和营卫、畅三焦\n\n37桂麻各半汤、桂二麻一汤、桂二越一汤的区别？\n 桂麻各半汤——有中风病有伤寒，处于两者之间，达不到中风和伤寒的程度，但是都有\n轻微的风和寒，属于太阳病的风寒两感证，两者都有，属于过度阶段。如果是太阳病的伤寒\n的话，人会发热恶寒身痛，津血在表上凝滞过度，但桂麻各半汤这个方的津液充不太实，既\n有津血不足又有津血充盈，处于半虚半实状态，所以身不疼，只是痒。\n 桂二麻一汤——25条“脉洪大”为“脉浮大”脉浮有表邪，脉大为虚，脉浮大是既有表\n邪又有津血不足，桂二麻一方是补津液而解表，这个病发热恶寒就如疟疾一样，真正的太阳\n病发热恶寒是伴随的，卫气在表过度凝滞，对寒热比他人更加敏感。而此方是一会恶寒一会\n发热，发热是卫阳在表凝滞，恶寒是有时津血又不足，凝聚的程度达不到，偏虚，所以恶寒，\n津血虚则冷，津血实则热。真正的桂枝汤证和真正的麻黄汤证都是有身体疼痛的，这种达不\n到充盈的力度，身体痒也属于津液在表上凝滞，所以用两份桂枝汤去补津液解表，一份麻黄\n汤去散津血而解表，这是“形似疟”的道理。太阳的风寒两感，此方也是类厥阴的方。\n 桂二越一汤——“热多寒少”已不是典型的太阳病，往阳的层面发展，热多是有阳明的\n层面，寒少是还有太阳表不解。“脉微弱者，此无阳也”在表的津液亏虚，需补津液而解表，\n而不能用麻黄汤散津液而解表，用两份桂枝汤去解表治恶寒，脉微弱。一份越婢汤是治疗太\n阳表不了了，阳明里热的。\n桂麻各半汤是风寒两感，风和寒是对等的；桂二麻一是中风证，风邪偏重，寒邪轻。桂二越\n一汤津液是亏虚的，寒邪不是主要的，出了风水溢饮和阳明里热的问题，越婢汤是治疗风水\n的，除了治疗风水，越婢汤加术汤还治疗肉极，下焦脚弱，津血在表不能正常输布，根本原\n因是表上津血凝滞了，生姜大枣补津液，麻黄解表邪解水饮，生姜大枣麻黄组合是和营卫补\n津液而解表邪祛水邪，正好对治下肢沉重无力而津血亏虚不能濡养，津血亏虚后可以产生寒\n邪或热邪， 有热加了白术。 这些方是续命类的祖方之一。 续命法则就是在这些上建立起来的。\n续命法则是既需要补津液又需要解表邪。\n38防己黄芪汤和防己茯苓汤的区别\n 防己黄芪汤——治疗风水的，如果是实性的风水有麻黄配石膏如越婢加术汤、越婢汤等，\n虚性的风水一般用黄芪，实则麻黄，虚则黄芪。白术茯苓配干姜温里治疗里面的水饮，配桂\n枝或生姜解表饮，此方是白术配黄芪解表饮，偏表，有风水，风水即津虚液少而又水饮，需\n补津液而化水饮，甘草大枣补津液，防己黄芪白术化水饮解邪风。\n 防己茯苓汤——治疗皮水，皮水是支饮的一种，表里都有水饮，皮水偏表（实）是甘草\n麻黄汤，偏里（虚） 是防己茯苓汤。甘草麻黄汤甘草二两补津液，麻黄解水饮，治疗表上水\n饮往里走，但还在偏表的层面多一些。防己茯苓汤茯苓六两里水偏里，利小便；甘草麻黄汤\n麻黄四两，虽是里水偏表需发散。防己茯苓汤黄芪桂枝甘草是太阴中风的，防己茯苓汤证的\n皮水是太阴中风证的进一步发展，邪风虚热、水饮血痹和风水黄汗共存后，水饮突出时就用\n此方，所以再加防己茯苓利小便。\n 皮水表里都有水饮，里水是表上的水往里走的过程。皮水里水都属于支饮。皮水是里水\n往里走到一定程度引起的。\n\n保胃气、存津液、和营卫、畅三焦\n\n39许师讲枳实栀子豉汤 \n枳实栀子豉汤\n393.大病瘥后，劳复者，枳实栀子豉汤主之。\n枳实三枚，栀子十四个，豉一升\n上三味，以清浆水七升，空煮取四升，内枳实、栀子，煮取两升，下豉，更煮五六沸，去滓。\n温分再服，覆令微似汗。若有宿食者，内大黄如博棋子五六枚，服之愈。\n病机：湿热，胃虚，气滞，水停。\n施治法则：清火，补胃，理气，祛水饮。\n虽有气滞而不用温燥的药去理气，如厚朴生姜等加重火盛。\n虽有水停湿热而不用淡渗利小便的茯苓白术致胃中水竭。\n怎样制化水饮、理气、补胃而不犯禁忌呢？\n豆豉：酸温键运泄利中焦从而制化水饮\n枳实：行气导滞解表来制化水饮（营卫气滞导致水停）1、表上水饮：主大风在皮肤中如麻\n豆苦痒。2、心下水停：心下坚，大如盘，边如旋盘，水饮所作，枳术汤主之。\n清浆水：清养津液让胃中虚热，湿热改善而制化水饮。\n表束的三个层面 \n表束能不能归结为太阳病？有表证有表邪是太阳证？有表证无表邪的表证来源于里证吗， 可\n以归结到有里证有表邪吗？\n许师曰：①表束是一个大的概念，包括三个层面：有表证有表邪；有表证无表邪；外证。六\n病都可以包括。\n ②有表证有表邪，涵盖太阳病。有表证有表邪最典型的就是太阳或少阴。\n ③有表证无表邪，如机体有水饮，表上容易出现寒症，苓桂术甘汤证是里有饮，上\n焦出现心痛、胸闷、心慌、气短，上焦也出现一些寒的现象。但是此种寒达不到伤寒的表现，\n伤寒的表现是身体的疼痛，恶寒发热，而此只有寒性收引的症候群，这只是有表证，但无表\n邪，所以治疗需温化里饮的同时补充在表的津液，即表里合病。无需过度发表，表里同治。\n 表证有表邪——发散表邪为主；有表证无表邪——表里同治；外证——不可攻表，\n先治里。 \n40肾着汤、真武汤、附子汤、苓桂术甘汤、茯苓四逆汤的区别\n肾着汤——是太阴的外证，在太阴外证的基础上出现了水湿偏重的情况，主要方纲是甘草干\n姜汤，加上茯苓白术。茯苓白术如果配上桂枝类的可以发表上的饮，如果配伍干姜类的可以\n治里面的饮，这是一个独特的地方。\n 真武汤——从大的方面说是少阴病的方子，但是细分方机的话有少阴太阴、少阴太阴\n阳明、太阳太阴、太 阴阳明太阴，从方机上来分析说明此方具有多维性，此方的含义是本\n来有太阳病水饮增多，往阴的方面走，出现了此方的症候群。\n 真武汤和肾着汤区别，肾着汤以里面的淡饮为基础，全是里的问题引起的，虽有肢体的酸\n\n保胃气、存津液、和营卫、畅三焦\n\n痛，甚至冷汗出，全是里阳不固在外的表现；真武汤会讲到表的问题，表上可以有水气，有\n表证有表邪。因为是少阴病，表上可以有寒有饮，或者是虚寒，卫阳亏虚有饮。\n 附子汤——是少阴病的另一个层面，相对真武汤来说他的表证消失，变成里阳不足，因\n为里面的阳气不足，里面的虚寒重，影响到营血的交合，津液得化生。此方既有阳不足，阴\n不足，津液不足，又伤营血。\n 肾着汤是温固里阳，温散水饮，完全是温、散、化，把水饮祛除。而附子汤是偏润，是水\n药中的补剂，他能治水能补益，附子能补阳，人参补津液，芍药补血。\n 苓桂术甘汤——从方机上分析可以是多维的，可以太阴病、太阳太阴病，此方和肾着汤\n只有一味药不同，肾着汤是治疗外证的方，把肾着汤的干姜换成桂枝，甘草干姜汤无存在的\n基础了，变成以桂枝甘草汤为方根的方子，两方都是治疗水饮的方，但是在治疗水饮的基础\n上肾着汤是以甘草干姜汤为主，治外证温里阳，苓桂术甘汤是以桂枝甘草为主，解表邪降气\n逆，所以能治疗头晕心悸。真武汤和附子汤都属于附子剂，附子剂少阴的层面较重，轻微的\n阳气不足是不需要用附子的，必须到一个较重的程度，里阳亏虚、脏有寒或者是卫阳亏虚用\n附子，那么苓桂术甘汤没有这些病机。\n茯苓四逆汤——就是四逆加人参加茯苓，阳气亏虚以后亡血，阳气亏虚、津伤的程度再\n加上水饮病。以里病为主没有表的问题，处于表束的有表证无表邪及外证的层面。 \n41桂枝二越婢一汤解析（27条）\n李某，男，成人\n主述:现在最不舒服的情况是什么（复诊患者需要描述对比上诊症状有什么变化）？\n答：尖锐湿疣，目前正在褪疤，尚未发现新疣体，阴囊湿疹也好了。\n刻诊：无恶寒发热，汗出正常，有时胃有点不舒服，放屁多。喝水多，喜欢喝水，温水，口\n干，渴，饭量正常，二便正常，有点失眠，每天十点多上床睡觉得到12点以后才能睡着，\n经常做梦。记忆力有些下降。\n眼睑淡白边红润，舌淡红苔薄腻中裂纹。\n麻杏薏甘汤\n问：津血虚很明显了，还用辛温发散法和滲利法？\n许师：看剂量：麻黄3 薏米3 杏仁3 炙

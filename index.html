seType":"讲义医案","归集方":"黄芩汤","usedFormulas":["黄芩汤"],"isCombine":true,"patient":"主诉：咳嗽五日，加重伴呕吐两日，发热伴惊厥一日半。","symptom":"主诉：咳嗽五日，加重伴呕吐两日，发热伴惊厥一日半。","history":"","exam":"刻诊：昨夜发热时汗出不明显，今晨汗出时有、汗后身热不凉，手足偏凉，","analysis":"","prescription":"处方：竹叶石膏汤，竹叶12、石膏96、麦冬48、旱半夏、党参4、北沙参","effect":"","comment":"","caseExcerpt":"主诉：咳嗽五日，加重伴呕吐两日，发热伴惊厥一日半。\n现病史：五日前食三文鱼及瘦肉，加之母亲哺乳前进食辛辣及牛肉，随后开\n始出现偶咳，两日前咳嗽加重，咳则呕吐，夜间发热，随后出现惊厥，双目上吊，\n手足冰凉，唇口面色青紫，手足握固抽动，持续2 分钟，随后至上海儿童医院就\n诊，予退热处理，体温降至正常。昨日再次发热，最高体温39.6 度，予布洛芬\n栓剂三次、每次均汗出热退，体温旋即复升。\n刻诊：昨夜发热时汗出不明显，今晨汗出时有、汗后身热不凉，手足偏凉，\n咳嗽，有痰音，流清涕，晨起打喷嚏，喜饮水。纳一般，输液后大便稀烂、有黏\n液，近两日大便每日一行，有矢气，小便清，哭闹，烦躁，夜寐不安，夜间坐起\n哭闹、稍有谵语，呼之不应、手足躁扰。惊厥后双眼较前少神。\n查体：脉浮数。舌红，苔薄白腻。舌尖有三枚水泡。下睑红。扪腹中灼热。\n下肢皮肤干燥。刻下体温39.3 度。\n基础病机：\n\n表束，表寒，中风，伤营\n太阴里虚，水饮\n阳明里热，外热，外燥\n复合病机：少阳阳明病\n四证：火证为主，兼水证（淡饮）\n临床思维还原：\n辨表里、寒热：临床判断阴阳和寒热，不能站在寒和热的症状上看，而是要\n去剖析寒和热产生的原因。也就是津液亏虚以后不能够温煦和濡养，津虚液少不\n能够温煦会生寒，不能够濡养会生热，所以判断寒热要跳出来站在“一”的层面\n去看，而不要站在“二”的层面去看。\n这里的寒，是里热耗伤津液而不能够温煦所致。对待此类寒证，若用温散，\n就会导致津液更伤，寒之更寒。因此本案既忌用辛温发表，又忌用渗利小便；本\n案出现了胃气虚、胃气弱而生水饮，水饮已经有冲逆之势，所以用大黄、黄芩一\n类会苦寒败伤胃气。\n本案的表寒表证，不是太阳表不解，在伤寒论第六条提到过，“太阳温病”，\n也即太阳中暍。而发生太阳温病的基础是阳明中风。阳明中风会出现“病有得之\n一日，不发热而恶寒者，……虽得之一日，恶寒将自罢，即自汗出而恶热也。”\n也就是说阳明病中风是会出现明显的恶寒表证，而这种寒是由于中风表不解导致\n的津液在表位涣散，就会出现表上失于温煦，病人就会出现对寒过度敏感，而表\n现为恶寒，手足发凉。但是随后“即汗出而恶热”，就会转成所谓的太阳温病，\n也就是正阳阳明。不管是阳明病也好，阳明中风也好，只要是有中风证都有可能\n出现恶寒，所以看到恶寒、发热、手足凉，不要马上用麻黄、桂枝发表，麻、桂\n一用下去只会抱薪救火。\n辨津液：同样要找到本案惊厥、神乱的原因，而不是用龙骨、牡蛎把神志异\n常的症状压制下来。痉病是什么？痉病就是表位津亏营弱。太阳痉病就是太阳病\n而伴有津亏，津液在表上不能濡养，同时有风寒表不解，这个时候“项背强，脉\n反沉迟，气上冲胸，口噤不得语”。\n阳明痉病是阳明病伴有表上津亏，此时表上津液不能濡养，同时有可能伴有\n表不解，就会出现手足痉挛、抽搐，两目上视，牙关紧闭。阳明痉病的正法是承\n\n气汤，是真正的燥烦满实、大便难，耗竭津液导致的。患者大便是稀烂，虽然有\n神昏“谵语”的表现，这是津液大亏不能涵养心神所致，所谓“虚则郑声”，不\n能够将之判定为阳明腑实证而妄用大黄。\n辨胃气：本案有几个迷惑性的症状，手足凉、谵语、纳差、大便稀烂。一般\n来说，纳呆便溏，这是太阴病，但如果直接“温其藏”，只会抱薪救火。因为这\n时津亏水盛。胃气要辨强弱虚实寒热，本案胃气虚、胃气弱，胃气热、胃气实的\n这几个层面都有，但是我们要进一步辨别。\n本案是在实火实热内盛灼伤津液而出现痉病、心神失养，这时候出现的胃虚\n当辨为胃津虚。胃津虚会导致津虚水盛，水饮冲逆，而表现为咳痰、流鼻涕；水\n饮下泄，则便溏，治疗只可用甘药以补津制水，而不能辛温助热。\n或问：津虚不是会生燥热吗？怎么会生水饮？君不见《伤寒论》之猪肤汤证\n“下利，咽痛，胸满，心烦”，咽痛、心烦，一派的津亏液少；但下利、胸满，\n则是典型的水饮内盛。所以用猪肤甘寒生津来治之。\n处方思路：患者以表为所急所苦，以阳明层面之实火实热为第一层病机，在\n阳明层面 /* ★ 两种图表形式：'sunflower'（按方阵聚类·向日葵排布）| 'force'（原始力导向连线） */
let LAYOUT={}, LAYOUT_MODE='sunflower', LAYOUT_FRESH=true;
/* 两种形式都是「自己算好坐标 → ECharts 用 layout:'none' 静态呈现」，
   不存在运行时布局，所以不会有模拟重排、抖动或悬停跳变。 */
let VIEW={zoom:0.85, center:null};   /* 缩放随布局自适应（装下全图） */
let _anim=null;                      /* 视图补间句柄 */
/* rAF 兜底（桩测/极老环境没有 requestAnimationFrame） */

const CAF=(typeof cancelAnimationFrame==='function')?cancelAnimationFrame:clearTimeout;
const NOW=()=>(typeof performance!=='undefined'&&performance.now)?performance.now():Date.now();

function clone(o){return JSON.parse(JSON.stringify(o));}

function applyData(d){
  NODES=d.nodes||[]; LM=d.links||[]; LC=d.cand||[]; CASES=d.cases||[];
  LAYOUT={}; LAYOUT_FRESH=true;        /* 换了一整套数据 → 坐标重算 */
  rebuild();
}
function snapshot(){return {nodes:NODES,links:LM,cand:LC,cases:CASES};}

function groupColor(g){
  if(!GROUP_COLOR[g]){
    const used=new Set(Object.values(GROUP_COLOR));
    let pick=PALETTE.find(c=>!used.has(c))||PALETTE[Object.keys(GROUP_COLOR).length%PALETTE.length];
    GROUP_COLOR[g]=pick;
  }
  return GROUP_COLOR[g];
}

/* ---------- 重建全部派生结构 ---------- */
function rebuild(){
  NODE_MAP={}; NODES.forEach(n=>NODE_MAP[n.name]=n);
  GROUPS=[...new Set(NODES.map(n=>(n.primaryGroup||'未分类').split('／')[0]))];
  GROUP_COLOR={}; Object.keys(GRP_COLOR).forEach(k=>GROUP_COLOR[k]=GRP_COLOR[k]);
  RELS=[...new Set(LM.concat(LC).map(l=>l.relationType).filter(Boolean))];
  // 度数
  const dm={}, dc={};
  LM.forEach(l=>{dm[l.source]=(dm[l.source]||0)+1;dm[l.target]=(dm[l.target]||0)+1;});
  LC.forEach(l=>{dc[l.source]=(dc[l.source]||0)+1;dc[l.target]=(dc[l.target]||0)+1;});
  NODES.forEach(n=>{n._dm=dm[n.name]||0;n._dc=dc[n.name]||0;n._orphan=!n._dm;});
  IDX_M=mkIdx(LM); IDX_C=mkIdx(LC);
  CASE={}; CASES.forEach(c=>(c.usedFormulas||[]).forEach(u=>(CASE[u]=CASE[u]||[]).push(c)));
  GRP_OF={};
  /* ★ 两种形式都由我们自己算坐标，ECharts 一律 layout:'none' 静态呈现。
     规则：只有「显式重排」（换形式 / 重新整理 / 换数据）才重算坐标；
     其余重绘沿用现有坐标（并抓一次图上的实际位置）——
     这样用户拖动过的节点、以及力导向算好的位置，都不会因为一次编辑而弹回。 */
  if(LAYOUT_FRESH){
    if(LAYOUT_MODE==='force') computeLayoutForce(); else computeLayout();
    LAYOUT_FRESH=false;
  } else {
    snapshotPositions();                 /* 抓住图上实际位置（含用户拖动） */
    if(!Object.keys(LAYOUT).length){      /* 万一还没算过，补算一次 */
      if(LAYOUT_MODE==='force') computeLayoutForce(); else computeLayout();
    }
    fillMissing();
  }
  ND0=NODES.map(buildNode); LM0=LM.map(l=>buildLink(l,false)); LC0=LC.map(l=>buildLink(l,true));
  ND0.forEach(d=>GRP_OF[d.name]=d._g);
}

function mkIdx(list){return (list||[]).reduce((a,l)=>{const s=a[l.source]||(a[l.source]={up:[],down:[]});const t=a[l.target]||(a[l.target]={up:[],down:[]});t.up.push(l);s.down.push(l);return a;},{});}

/* =====================  ★ 结构化布局 ★  =====================
   思路：把每个「顶层方阵」当成一个团，团心按成员规模加权排在环上；
   团内节点按主图度数降序，从团心向外做「向日葵（黄金角）」排布 —— 均匀、无环缝。
   这样同阵的方聚在一起，连线大多是团内的短线，跨阵长线大幅减少，交叉自然就下来了。 */
function computeLayout(){
  const byG={};
  NODES.forEach(n=>{
    const g=(n.primaryGroup||'未分类').split('／')[0];
    (byG[g]=byG[g]||[]).push(n);
  });
  let gs=Object.keys(byG).sort((a,b)=>byG[b].length-byG[a].length);
  if(!gs.length){ LAYOUT={}; return; }

  const SP=40;                                     /* 团内节点平均间距 */
  const rad={};
  gs.forEach(g=>{ rad[g]=Math.max(80, Math.sqrt(byG[g].length)*SP*0.58); });

  /* ★ 环上顺序：让「互相有连线」的方阵彼此相邻 —— 跨阵连线才会短 */
  const gOf={};
  NODES.forEach(n=>{ gOf[n.name]=(n.primaryGroup||'未分类').split('／')[0]; });
  const W={};
  LM.forEach(l=>{
    const a=gOf[l.source], b=gOf[l.target];
    if(a&&b&&a!==b){ W[a+'|'+b]=(W[a+'|'+b]||0)+1; W[b+'|'+a]=(W[b+'|'+a]||0)+1; }
  });
  const wsum=g=>Object.keys(W).reduce((s,k)=>k.split('|')[0]===g?(s+W[k]):s,0);
  const start=gs.slice().sort((a,b)=>wsum(b)-wsum(a))[0];
  const usedG=new Set([start]), order=[start];
  while(order.length<gs.length){
    const head=order[0], tail=order[order.length-1];
    let best=null,bw=-1,side='tail';
    gs.forEach(g=>{
      if(usedG.has(g)) return;
      const wt=W[g+'|'+tail]||0, wh=W[g+'|'+head]||0;
      if(wt>bw){bw=wt;best=g;side='tail';}
      if(wh>bw){bw=wh;best=g;side='head';}
    });
    if(!best) break;
    usedG.add(best);
    if(side==='tail') order.push(best); else order.unshift(best);
  }
  gs=order;

  /* ★ 环半径由「团半径之和」决定。原来按视口算（520 而团半径最大 475）→ 团全叠在一起，
       这是连线交叉多的真正原因。 */
  const sumR=gs.reduce((a,g)=>a+rad[g],0)||1;
  const worldR=Math.max(320, sumR/Math.PI*1.12);

  const pos={};
  let acc=0;
  gs.forEach(g=>{
    const r=rad[g];
    const span=Math.PI*2*(r/sumR);                /* 扇区宽按团大小分配 */
    const centerAngle=-Math.PI/2 + Math.PI*2*acc/sumR + span/2;
    acc+=r;
    const cx=Math.cos(centerAngle)*worldR, cy=Math.sin(centerAngle)*worldR;
    const list=byG[g].slice().sort((x,y)=>
      ((y._dm||0)+(y._dc||0)*0.5)-((x._dm||0)+(x._dc||0)*0.5) ||      /* 度数高的靠内 */
      (x.name<y.name?-1:(x.name>y.name?1:0)));
    const GA=Math.PI*(3-Math.sqrt(5));            /* 黄金角 ≈137.5°，向日葵排布 */
    list.forEach((n,k)=>{
      const rr = k===0 ? 0 : Math.sqrt(k/Math.max(1,list.length))*r;
      const t  = k*GA;
      pos[n.name]=[cx+Math.cos(t)*rr, cy+Math.sin(t)*rr];
    });
  });
  LAYOUT=pos;
}
/* ★★ 平滑平移：把视图中心/缩放从「当前值」补间到「目标值」★★
   直接 setOption(center) 是瞬间跳过去的，很突兀。这里用 rAF 逐帧插值。 */
function curView(c){
  c=c||initChart();
  try{
    const model=c.getModel&&c.getModel();
    const cs=model&&model.getSeriesByIndex(0).coordinateSystem;
    if(cs&&typeof cs.getZoom==='function'){
      const z=cs.getZoom();                       /* 用户滚轮缩放后的真实倍率 */
      const data=model.getSeriesByIndex(0).getData();
      const n=Math.min(data.count(),60);
      for(let i=0;i<n;i++){                       /* 用任一节点反推视图中心 */
        const L=data.getItemLayout(i); if(!L) continue;
        const wx=Array.isArray(L)?L[0]:L.x, wy=Array.isArray(L)?L[1]:L.y;
        if(!isFinite(wx)||!isFinite(wy)) continue;
        const px=c.convertToPixel({seriesIndex:0},[wx,wy]);
        if(!px||!isFinite(px[0])) continue;
        return {center:[wx-(px[0]-c.getWidth()/2)/z, wy-(px[1]-c.getHeight()/2)/z], zoom:z};
      }
      return {center:VIEW.center||[0,0], zoom:z};
    }
  }catch(err){}
  return {center:VIEW.center||[0,0], zoom:VIEW.zoom||0.85};
}
function animateView(toCenter, toZoom, ms){
  const c=initChart();
  const from=curView(c);
  const f0=(from.center||[0,0]).slice(), z0=from.zoom||VIEW.zoom||0.85;
  const tc=[toCenter[0],toCenter[1]], tz=(toZoom==null?z0:toZoom);
  VIEW.center=tc; VIEW.zoom=tz;                    /* 目标即刻记下（重绘时保持） */
  stopAnim();
  const dur=Math.max(1, ms==null?520:ms);
  if(dur<=1){ c.setOption({series:[{center:tc,zoom:tz}]}); return {animated:false}; }
  const ease=t=>1-Math.pow(1-t,3);                 /* cubicOut，与全站缓动一致 */
  const t0=NOW();
  const step=()=>{
    const t=Math.min(1,(NOW()-t0)/dur), e=ease(t);
    c.setOption({series:[{center:[f0[0]+(tc[0]-f0[0])*e, f0[1]+(tc[1]-f0[1])*e],
                          zoom:z0+(tz-z0)*e}]});
    if(t<1){ _anim=RAF(step); } else { _anim=null; }
  };
  step();                                          /* 立刻出第一帧，响应不延迟 */
  return {animated:true, from:f0, to:tc, ms:dur};
}
/* 立刻停掉正在进行的视角补间 */
function stopAnim(){
  if(_anim){ try{ CAF(_anim); }catch(err){} _anim=null; }
}
/* =====================  ★ 连线布局（自己算的力导向，结果静态）★  =====================
   ★ 为什么不用 ECharts 的 layout:'force'：
     那个模式**每次重绘都会重启模拟迭代**，连鼠标悬停引发的高亮都足以让整图重新排布，
     表现为「鼠标一放到节点上就跳到一个奇怪的视图」。靠延时冻结只是治标。
   ★ 为什么斥力要用四叉树（Barnes-Hut）：
     上一版为了快，把斥力截断到「只算邻近格子」—— 结果丢掉了维持全图张开的**长程斥力**，
     节点全塌到中心、严重交叠。这里用 Barnes-Hut 以 O(n log n) 算**完整**斥力，
     最后再跑一遍「最小间距松弛」，硬性保证不交叠。 */
const BH_THETA=0.85;                     /* 远场近似阈值，越小越精确 */
/* 向心强度：量级由力平衡推得 R ≈ k·sqrt(2n/GRAV)。
   取 2.0 → R ≈ 60·sqrt(1068) ≈ 1960；太小（如 0.05）会让布局爆到上万。 */
const GRAV=2.0;

function bhBuild(P, idxs, x0,y0,x1,y1, depth){
  const t={x0:x0,y0:y0,x1:x1,y1:y1,cx:0,cy:0,m:idxs.length,leaf:null,sub:null};
  let sx=0, sy=0;
  for(let i=0;i<idxs.length;i++){ sx+=P[idxs[i]].x; sy+=P[idxs[i]].y; }
  t.cx=sx/t.m; t.cy=sy/t.m;
  if(idxs.length<=1 || depth>=22){ t.leaf=idxs; return t; }
  const mx=(x0+x1)/2, my=(y0+y1)/2;
  const parts=[[],[],[],[]];
  for(let i=0;i<idxs.length;i++){
    const p=P[idxs[i]];
    parts[(p.x>=mx?1:0)+((p.y>=my?2:0))].push(idxs[i]);
  }
  const sub=[];
  for(let k=0;k<4;k++){
    const a=parts[k];
    if(!a.length){ sub.push(null); continue; }
    sub.push(bhBuild(P,a,(k&1)?mx:x0,(k&2)?my:y0,(k&1)?x1:mx,(k&2)?y1:my,depth+1));
  }
  t.sub=sub;
  return t;
}
function bhRepel(t, i, P, k, acc){
  if(!t) return;
  const dx=P[i].x-t.cx, dy=P[i].y-t.cy, d2=dx*dx+dy*dy;
  if(t.leaf){
    const L=t.leaf;
    for(let n=0;n<L.length;n++){
      const j=L[n]; if(j===i) continue;
      let ax=P[i].x-P[j].x, ay=P[i].y-P[j].y, a2=ax*ax+ay*ay;
      if(a2<1e-6){ ax=((i%7)-3)*0.5; ay=((i%5)-2)*0.5; a2=ax*ax+ay*ay||1e-6; }  /* 确定性散开 */
      const d=Math.sqrt(a2), f=(k*k)/d;
      acc.x+=ax/d*f; acc.y+=ay/d*f;
    }
    return;
  }
  const sz=t.x1-t.x0;
  if(sz*sz/Math.max(d2,1e-6) < BH_THETA*BH_THETA){      /* 足够远 → 整团当作一个质点 */
    if(d2>1e-6){
      const d=Math.sqrt(d2), f=(k*k*t.m)/d;
      acc.x+=dx/d*f; acc.y+=dy/d*f;
    }
    return;
  }
  const s=t.sub;
  for(let n=0;n<4;n++) if(s[n]) bhRepel(s[n],i,P,k,acc);
}
/* 最小间距松弛：硬性把靠得过近的节点推开，保证肉眼不交叠 */
function relaxMin(P, minSep, rounds){
  const n=P.length;
  for(let r=0;r<rounds;r++){
    const grid={}, cell=minSep;
    for(let i=0;i<n;i++){
      const key=Math.floor(P[i].x/cell)+'|'+Math.floor(P[i].y/cell);
      if(grid[key]) grid[key].push(i); else grid[key]=[i];
    }
    let moved=0;
    for(let i=0;i<n;i++){
      const gx=Math.floor(P[i].x/cell), gy=Math.floor(P[i].y/cell);
      for(let ox=-1;ox<=1;ox++) for(let oy=-1;oy<=1;oy++){
        const bucket=grid[(gx+ox)+'|'+(gy+oy)];
        if(!bucket) continue;
        for(let bi=0;bi<bucket.length;bi++){
          const j=bucket[bi]; if(j<=i) continue;
          let dx=P[j].x-P[i].x, dy=P[j].y-P[i].y;
          let d=Math.sqrt(dx*dx+dy*dy);
          if(d>=minSep) continue;
          if(d<1e-6){ dx=((i%7)-3)*0.5; dy=((i%5)-2)*0.5; d=Math.sqrt(dx*dx+dy*dy)||1e-6; }
          const u=(minSep-d)/2;
          P[i].x-=dx/d*u; P[i].y-=dy/d*u;
          P[j].x+=dx/d*u; P[j].y+=dy/d*u;
          moved++;
        }
      }
    }
    if(!moved) break;                     /* 已经全部满足最小间距 */
  }
}

function computeLayoutForce(){
  const n=NODES.length;
  if(!n){ LAYOUT={}; return; }
  /* 初值：圆形起手（观感同原 initLayout:'circular'） */
  const R0=Math.max(420, Math.sqrt(n)*30);
  const P=new Array(n);
  NODES.forEach((node,i)=>{
    const a=Math.PI*2*i/n;
    P[i]={x:Math.cos(a)*R0, y:Math.sin(a)*R0, fx:0, fy:0};
  });
  const idx={}; NODES.forEach((node,i)=>{ idx[node.name]=i; });
  const E=[];
  LM.concat(LC).forEach(l=>{              /* 参考边也计入，结构才连贯 */
    const a=idx[l.source], b=idx[l.target];
    if(a!=null&&b!=null&&a!==b) E.push([a,b]);
  });
  const k=Math.sqrt((4*R0*R0)/n);         /* 理想边长 */
  const ITER=110;
  let temp=R0*0.16;
  for(let it=0; it<ITER; it++){
    /* ① 斥力：Barnes-Hut（全图长程斥力，节点才会真正散开） */
    let minX=1e18,maxX=-1e18,minY=1e18,maxY=-1e18;
    for(let i=0;i<n;i++){
      const p=P[i];
      if(p.x<minX)minX=p.x; if(p.x>maxX)maxX=p.x;
      if(p.y<minY)minY=p.y; if(p.y>maxY)maxY=p.y;
    }
    const all=new Array(n); for(let i=0;i<n;i++) all[i]=i;
    const tree=bhBuild(P, all, minX-1, minY-1, maxX+1, maxY+1, 0);
    for(let i=0;i<n;i++){
      const acc={x:0,y:0};
      bhRepel(tree,i,P,k,acc);
      P[i].fx=acc.x; P[i].fy=acc.y;
    }
    /* ② 引力：沿边把两端拉近 */
    for(let e=0;e<E.length;e++){
      const a=E[e][0], b=E[e][1];
      const dx=P[a].x-P[b].x, dy=P[a].y-P[b].y;
      const d=Math.sqrt(dx*dx+dy*dy)||1e-6;
      const att=(d*d)/k, ux=dx/d, uy=dy/d;
      P[a].fx-=ux*att; P[a].fy-=uy*att;
      P[b].fx+=ux*att; P[b].fy+=uy*att;
    }
    /* ③ 位移（限温）＋ 弱向心：
       没有向心力的话，互不相连的团会被长程斥力推得无限飘散（布局半径会爆到几千）。 */
    for(let i=0;i<n;i++){
      const fx=P[i].fx-P[i].x*GRAV, fy=P[i].fy-P[i].y*GRAV;
      const d=Math.sqrt(fx*fx+fy*fy)||1e-6;
      const lim=Math.min(d, temp);
      P[i].x+=fx/d*lim; P[i].y+=fy/d*lim;
    }
    temp*=0.965;
  }
  /* ④ 最小间距松弛：硬性保证不交叠（力平衡只能"大致"分开，这一步是兜底） */
  relaxMin(P, Math.max(52, k*1.0), 60);

  const pos={};
  NODES.forEach((node,i)=>{ pos[node.name]=[P[i].x, P[i].y]; });
  LAYOUT=pos;
}

/* 把所有节点装进视野。noFloor=true 时不设下限（真·看全图） */
function fitAll(noFloor){
  let mx=0;
  Object.keys(LAYOUT).forEach(k=>{ const p=LAYOUT[k]; mx=Math.max(mx, Math.hypot(p[0],p[1])); });
  if(!mx) return;
  const vw=(chart&&chart.getWidth&&chart.getWidth())||1400;
  const vh=(chart&&chart.getHeight&&chart.getHeight())||760;
  const z=(Math.min(vw,vh)*0.44)/mx;
  /* 1068 个节点全塞进屏幕会缩到看不清名字，故默认给一个可读性下限；
     想看全貌用「⤢ 看全图」（noFloor）。 */
  VIEW.zoom=noFloor ? Math.max(0.05, Math.min(2,z)) : Math.max(0.42, Math.min(2,z));
}

function buildNode(n){
  const g=(n.primaryGroup||'未分类').split('／')[0];
  const dm=(n._dm||0), dc=(n._dc||0);
  let size=8+Math.min(22, dm*1.35+dc*0.30);
  const orph=!dm;
  const p=LAYOUT[n.name];
  /* ★ 锁定时的邻接聚焦：只留「锁定节点 + 它的相关方」，其余淡化 */
  const isLocked = !!(LOCKED && n.name===LOCKED);
  const related  = LOCK_SET ? LOCK_SET.has(n.name) : true;
  let color   = orph?'#c8cdd4':(GROUP_COLOR[g]||'#7b8794');
  let bColor  = orph?'#dfe4ea':'rgba(255,255,255,.85)';
  let bWidth  = 1.2, opacity = orph?0.62:1;
  let sBlur   = orph?0:6, sColor='rgba(20,50,90,.18)';
  let lColor  = orph?'#98a1ab':'#26313d', lWeight = orph?400:600, showLabel=true;
  if(LOCKED){
    if(isLocked){
      size*=1.35; bColor='#a61b1b'; bWidth=2.8; sBlur=16; sColor='rgba(166,27,27,.45)';
      lColor='#a61b1b'; lWeight=800; opacity=1;
    } else if(related){
      bColor='#fff'; bWidth=1.9; opacity=1;
    } else {
      opacity=0.10; showLabel=false; sBlur=0;
    }
  }
  const o={name:n.name,symbolSize:size,
    itemStyle:{color:color,borderColor:bColor,borderWidth:bWidth,
      opacity:opacity,shadowBlur:sBlur,shadowColor:sColor},
    label:{show:showLabel,color:lColor,fontWeight:lWeight,fontSize:isLocked?11:10},
    _orphan:orph,_g:g,_raw:n,_locked:isLocked};
  if(p){ o.x=p[0]; o.y=p[1]; }
  return o;
}
function buildLink(l,isCand){
  const noDir = isCand && l.relationType==='条文互见';
  const col=isCand?C_CAND:(REL_COLOR[l.relationType]||'#1f4e79');
  /* 连线视图保留原来的曲线；向日葵视图用直线（曲线在密集图里会互相缠绕） */
  const cv = isCand ? 0.16 : (LAYOUT_MODE==='force' ? 0.12 : 0);
  let w = isCand?0.9:(l.relationType==='方干同源取舍'?1.3:1.6);
  let op = isCand?0.42:0.72;
  /* ★ 锁定时：与锁定方直接相连的线加粗点亮，其余淡化 */
  if(LOCKED){
    const touches = (l.source===LOCKED || l.target===LOCKED);
    const inSet = LOCK_SET && LOCK_SET.has(l.source) && LOCK_SET.has(l.target);
    if(touches){ w=Math.max(w,2.2); op=1; }
    else if(inSet){ op=0.16; }
    else { op=0.04; }
  }
  return {source:l.source,target:l.target,value:l.relationType,
    lineStyle:{color:col,width:w,type:isCand?'dashed':'solid',opacity:op,curveness:cv},
    label:{show:false},symbol:(isCand?'none':['none','arrow']),symbolSize:isCand?0:5,
    _noDir:noDir,_raw:l,_isCand:isCand};
}

/* ---------- 图表 ---------- */
let chart=null;
function initChart(){ if(!chart) chart=echarts.init(document.getElementById('chart'),null,{renderer:'canvas'}); return chart; }
function opt(){
  const c=document.getElementById('cbCand').checked,
        h=document.getElementById('cbIso').checked,
        s=document.getElementById('cbLab').checked,
        adj=document.getElementById('cbAdj').checked;
  let vis=null;
  if(selG.size){
    vis=new Set();
    ND0.forEach(d=>{ if(selG.has(d._g)) vis.add(d.name); });
    if(adj){
      LM0.concat(c?LC0:[]).forEach(l=>{
        if((selG.has(GRP_OF[l.source])||selG.has(GRP_OF[l.target]))){
          vis.add(l.source); vis.add(l.target);
        }
      });
    }
  }
  if(SQ){ /* 搜索过滤 */
    const s2=new Set();
    ND0.forEach(d=>{ if(matchQuery(d.name,d._raw)) s2.add(d.name); });
    if(SQ_ADJ) LM0.concat(c?LC0:[]).forEach(l=>{ if(s2.has(l.source)||s2.has(l.target)){s2.add(l.source);s2.add(l.target);} });
    vis = vis? new Set([...vis].filter(x=>s2.has(x))) : s2;
  }
  const nd=ND0.filter(d=>((vis?vis.has(d.name):true))&&!(h&&d._orphan));
  const keep=new Set(nd.map(d=>d.name));
  const lk=LM0.concat(c?LC0:[]).filter(l=>keep.has(l.source)&&keep.has(l.target)
                                          &&(!selR.size||selR.has(l.value)));
  document.getElementById('stat').innerHTML='显示 <b>'+nd.length+'</b>/'+NODES.length+' 节点　边 <b>'+lk.length
    +'</b>/'+(LM0.length+(c?LC0.length:0))+'　'
    +(selG.size?'方阵筛选：'+[...selG].join('、')+'　':'')
    +(selR.size?'关系筛选：'+[...selR].join('、')+'　':'')
    +(SQ?'搜索：'+esc(SQ)+'　':'')
    +(dirty?'<span style="color:#b26a00">● 有未保存修改</span>':'');
  return {backgroundColor:'transparent',
    tooltip:{trigger:'item',confine:true,backgroundColor:'rgba(255,255,255,.97)',borderColor:'#dbe2ea',
      textStyle:{color:'#1b2430',fontSize:12,lineHeight:18},
      extraCssText:'box-shadow:0 6px 20px rgba(15,35,60,.12);border-radius:8px;max-width:380px;',
      formatter:p=>{
        if(p.dataType==='edge'){const l=p.data._raw;return '<b>'+esc(l.source)+' → '+esc(l.target)+'</b><br>'
          +'<span style="color:#5b6675">'+esc(l.relationType)+'　'+esc(l.confidence||'')+'</span><br>'
          +'<span style="font-size:11.5px">'+esc((l.relationDesc||l.evidenceText||'').slice(0,200))+'</span>';}
        const n=p.data._raw;
        const dm=n._dm||0, dc=n._dc||0;
        const up=(IDX_M[n.name]&&IDX_M[n.name].up?IDX_M[n.name].up.length:0);
        const dn=(IDX_M[n.name]&&IDX_M[n.name].down?IDX_M[n.name].down.length:0);
        return '<b style="color:#a61b1b">'+esc(n.name)+'</b><br><span style="color:#5b6675;font-size:11.5px">'
          +esc(n.primaryGroup)+'　'+esc(n.subGroup||'')+'</span><br><span style="font-size:11.5px">'
          +esc((n.composition||'').slice(0,110))+'</span><br><span style="color:#5b6675;font-size:11px">'
          +'主图关系 '+(up+dn)+' 条（上游 '+up+' · 下游 '+dn+'）'
          +(dc?('　候选 '+dc+' 条'):'')+'</span><br>'
          +'<span style="color:#98a1ab;font-size:11px">单击查看'+(editMode?'／编辑':'')
          +'详情　·　长按可锁定高亮</span>';}},
    animationDuration:760, animationEasing:'cubicOut',
    animationDurationUpdate:420, animationEasingUpdate:'cubicOut',
    series:[(()=>{
      /* ★ 两种形式一律用 layout:'none'（坐标由我们自己算好）。
         ECharts 的 'force' 会在每次重绘时重启模拟 —— 连悬停高亮都能让整图重排，
         表现为「鼠标一放上去就跳到奇怪的视图」，故彻底不用。 */
      const gr={type:'graph',layout:'none',
                roam:true,draggable:false,zoom:VIEW.zoom,
        scaleLimit:{min:0.10,max:8},
        /* 悬停＝邻接聚焦（只显本方与相关方，其余淡化）；
           锁定期间关掉它 —— 锁定的淡化由我们自己控制，避免两套机制互相打架。
           ★ 不在悬停时改 label：改字号/字重会让 hideOverlap 重排整图标签，
             看起来也像「跳了一下」。方名交给 tooltip 显示。 */
        emphasis:{focus:(LOCKED?'none':'adjacency'),scale:1.22,
          lineStyle:{opacity:1,width:2.8}},
        blur:{itemStyle:{opacity:0.12},label:{opacity:0.18},lineStyle:{opacity:0.05}},
        select:{disabled:true},
        /* ★ 只用 hideOverlap：原来的 moveOverlap:'shiftY' 会挪动标签位置，
           密集图里一悬停就整片标签换位，也是「跳到奇怪视图」的观感来源之一 */
        labelLayout:{hideOverlap:true},
        categories:GROUPS.map(g=>({name:g,itemStyle:{color:groupColor(g)}})),
        data:nd.map(d=>s?d:Object.assign({},d,{label:{show:false}})),
        links:lk.map(l=>s?l:Object.assign({},l,{label:{show:false}})),
        lineStyle:{color:'source',curveness:0},edgeSymbol:['none','arrow'],edgeSymbolSize:5,edgeLabel:{show:false}};
      gr.layoutAnimation=false;              /* 坐标已算好，不需要开场动画 */
      return gr;
    })()]};
}
/* 全量重绘。★ 默认会「保住当前视角」——重绘前记住用户当前的缩放与平移，重绘后还原，
   否则 notMerge 会把 ECharts 的视图状态一起清掉，表现为"点一下视角就回到原点"。
   需要按新布局重新取景时（换图表形式、重新整理、看全图）传 refresh(false)。 */
function refresh(preserve){
  const c=initChart();
  const keep=(preserve!==false);
  let v=null;
  if(keep){ try{ v=curView(c); }catch(err){ v=null; } }
  c.setOption(opt(), true);
  renderLegend();
  if(keep && v && v.center && isFinite(v.center[0]) && isFinite(v.center[1]) && isFinite(v.zoom) && v.zoom>0){
    VIEW.zoom=v.zoom;
    try{ c.setOption({series:[{center:v.center, zoom:v.zoom}]}); }catch(err){}
  }
}

/* =====================  ★ 长按锁定高亮 ★  =====================
   交互：在节点上「长按左键」600ms → 锁定该节点高亮（鼠标移开也不消失）。
   要点：
   · 长按期间移动超过阈值 或 提前松手 → 判定为拖拽/普通点击，取消长按
   · 长按一旦触发，紧接着的 click 会被「吞掉」→ 不会弹出详情页
   · 锁定不设切换（再长按同一节点仍是锁定），解锁只有一条路：点空白处
   ============================================================ */
let LOCKED=null, LOCK_SET=null, PRESS=null, SUPPRESS_CLICK=false, _supTimer=null, FOCUS_SEQ=0;
const PRESS_MS=600, PRESS_MOVE=8;

function nameIndex(c,name){
  try{
    const m=c.getModel&&c.getModel();
    const d=m?m.getSeriesByIndex(0).getData():null;
    if(d&&typeof d.indexOfName==='function'){ const i=d.indexOfName(name); if(i>=0) return i; }
  }catch(err){}
  const arr=((c.getOption().series||[{}])[0].data)||[];
  return arr.findIndex(x=>x&&x.name===name);
}
/* 锁定集合 = 锁定节点 + 所有与它直接相连的方（主图边 + 参考边） */
function computeLockSet(){
  if(!LOCKED){ LOCK_SET=null; return; }
  const s=new Set([LOCKED]);
  LM.concat(LC).forEach(l=>{
    if(l.source===LOCKED) s.add(l.target);
    else if(l.target===LOCKED) s.add(l.source);
  });
  LOCK_SET=s;
}
/* 把当前屏幕上的节点坐标抓下来存进 LAYOUT，重绘时就不会跳回初始位置 */
function snapshotPositions(){
  const c=initChart(), pos={};
  try{
    const model=c.getModel&&c.getModel();
    const d=model?model.getSeriesByIndex(0).getData():null;
    if(d&&typeof d.getItemLayout==='function'){
      const n=d.count();
      for(let i=0;i<n;i++){
        const L=d.getItemLayout(i); if(!L) continue;
        const nm=(typeof d.getName==='function')?d.getName(i):null;
        if(!nm) continue;
        pos[nm]=Array.isArray(L)?[L[0],L[1]]:[L.x,L.y];
      }
    }
  }catch(err){}
  if(Object.keys(pos).length) LAYOUT=pos;
}
/* 新增的节点还没有坐标时，先给个靠中心的位置 */
function fillMissing(){
  const miss=NODES.filter(n=>!LAYOUT[n.name]);
  if(!miss.length) return;
  const k0=Object.keys(LAYOUT)[0];
  const cx=k0?LAYOUT[k0][0]:0, cy=k0?LAYOUT[k0][1]:0;
  miss.forEach((n,i)=>{
    const a=Math.PI*2*i/Math.max(1,miss.length);
    LAYOUT[n.name]=[cx+Math.cos(a)*90, cy+Math.sin(a)*90];
  });
}
/* 只重算节点/连线的样式，不动布局 */
function restyleOnly(){
  ND0=NODES.map(buildNode); LM0=LM.map(l=>buildLink(l,false)); LC0=LC.map(l=>buildLink(l,true));
  GRP_OF={}; ND0.forEach(d=>GRP_OF[d.name]=d._g);
}
function setLock(name){
  LOCKED=name||null;
  computeLockSet();
  /* ★ 先抓一次当前坐标：用户可能拖动过节点，坐标只在图里、不在数据里。
     不抓的话换样式会把拖动过的节点弹回原位。 */
  snapshotPositions();
  restyleOnly();                           /* 只重算节点/连线的样式 */
  redrawStyles();                          /* ★ merge 下发：不重排布局、不重置视角 */
  renderLockTip();
}
/* ★ 用 merge 只更新样式。
   merge 不会重建坐标系，所以既不会让力导向重排，也不会把用户的缩放/平移重置。
   同时把 layout 一并切成「静态」（冻结后），彻底断掉重跑模拟的可能。 */
function redrawStyles(){
  const c=initChart();
  try{
    const ser=opt().series[0];
    c.setOption({series:[{layout:ser.layout, layoutAnimation:false,
      data:ser.data, links:ser.links, emphasis:ser.emphasis}]});
  }catch(err){ try{ refresh(); }catch(err2){} }
  renderLegend();
}
function renderLockTip(){
  const el=document.getElementById('tipLock'); if(!el) return;
  const n=(LOCKED&&LOCK_SET)?(LOCK_SET.size-1):0;
  el.innerHTML = LOCKED
    ? '<span class="lockbadge" id="lockBadge" title="点击解锁">'
      +'🔒 已锁定：'+esc(LOCKED)+'　<span class="x">✕</span></span>'
      +'<div style="color:#98a1ab;font-size:11px;margin-top:3px">相关 '+n+' 方｜点上面的红色标识解锁</div>'
    : '<span style="color:#98a1ab">长按节点可锁定（只显该方及其相关方）</span>';
}
/* ★ 解锁入口：点右上角那个红色锁定标识。
   标识是动态渲染出来的 → 用事件委托绑在稳定的 #tip 上（不能直接绑动态元素）。 */
document.getElementById('tip').addEventListener('click',e=>{
  if(e.target.closest && e.target.closest('#lockBadge')){
    setLock(null);
    toast('已解锁，恢复全部显示');
  }
});
function pressStart(name, ev){
  cancelPress();
  PRESS={name:name, x:ev?(ev.offsetX||0):0, y:ev?(ev.offsetY||0):0, fired:false};
  PRESS.timer=setTimeout(()=>{
    if(!PRESS) return;
    PRESS.fired=true;
    SUPPRESS_CLICK=true;                       /* ★ 吞掉随之而来的 click，不弹详情 */
    clearTimeout(_supTimer);
    _supTimer=setTimeout(()=>{ SUPPRESS_CLICK=false; },500);   /* 兜底：万一没有 click 事件 */
    setLock(name);
    toast('已锁定「'+name+'」（只显该方及其相关方；点右上角红色标识解锁）');
  }, PRESS_MS);
}
function cancelPress(){
  if(PRESS&&!PRESS.fired&&PRESS.timer) clearTimeout(PRESS.timer);
  PRESS=null;
}

/* =====================  ★ 拖动节点：带动相关节点一起移动 ★  =====================
   ECharts 自带的 draggable 只移动被拖的那**一个**节点，无法联动，
   所以关掉它（draggable:false），自己实现：
   拖某个节点时，与它直接相连的「一星」整体平移 —— 连线的相对形状完全保持。 */
const DRAG_TOL=4;                        /* 超过这个像素位移才算「拖动」（否则算点击/长按） */
let DRAG=null, _dragFrame=null;

/* 与某个方剂直接相连的全部方（主图边 + 参考边，去重） */
function neighborsOf(name){
  const s=new Set();
  LM.concat(LC).forEach(l=>{
    if(l.source===name && l.target) s.add(l.target);
    else if(l.target===name && l.source) s.add(l.source);
  });
  s.delete(name);
  return Array.from(s);
}
function evScreen(ev){ return [ev?(ev.offsetX||0):0, ev?(ev.offsetY||0):0]; }
function screenToWorld(c, sx, sy){
  try{
    const p=c.convertFromPixel({seriesIndex:0},[sx,sy]);
    if(p && isFinite(p[0]) && isFinite(p[1])) return [p[0],p[1]];
  }catch(err){}
  const v=curView(c), z=v.zoom||1, ct=v.center||[0,0];   /* 兜底：按视图变换反算 */
  return [ct[0]+(sx-c.getWidth()/2)/z, ct[1]+(sy-c.getHeight()/2)/z];
}
function dragArm(name, ev){
  DRAG=null;
  if(!ev || !LAYOUT[name]) return;
  const c=initChart();
  const sc=evScreen(ev);
  const w=screenToWorld(c, sc[0], sc[1]);
  if(!w) return;
  const grp=[name].concat(neighborsOf(name));
  const base={}, items=[];
  grp.forEach(nm=>{
    if(!LAYOUT[nm]) return;
    base[nm]=[LAYOUT[nm][0], LAYOUT[nm][1]];
    const d=ND0.find(x=>x.name===nm);
    if(d) items.push({n:nm, d:d});
  });
  DRAG={name:name, sc0:sc, w0:w, base:base, items:items, on:false};
}
function dragMove(ev){
  if(!DRAG || !ev) return;
  const sc=evScreen(ev);
  const dx0=sc[0]-DRAG.sc0[0], dy0=sc[1]-DRAG.sc0[1];
  if(!DRAG.on){
    if(Math.sqrt(dx0*dx0+dy0*dy0) < DRAG_TOL) return;
    DRAG.on=true;
    cancelPress();                       /* 开始拖动 → 取消长按（两者互斥） */
  }
  const c=initChart();
  const w=screenToWorld(c, sc[0], sc[1]);
  const dx=w[0]-DRAG.w0[0], dy=w[1]-DRAG.w0[1];
  DRAG.items.forEach(it=>{
    const b=DRAG.base[it.n];
    const nx=b[0]+dx, ny=b[1]+dy;
    LAYOUT[it.n]=[nx,ny];
    it.d.x=nx; it.d.y=ny;                /* 直接改数据项坐标，整组一起平移 */
  });
  pushDragPositions();
}
/* 每帧最多下发一次，拖动才顺滑 */
function pushDragPositions(){
  if(_dragFrame) return;
  _dragFrame=RAF(()=>{
    _dragFrame=null;
    try{ initChart().setOption({series:[{data:ND0}]}); }catch(err){}
  });
}
function dragEnd(){
  if(!DRAG) return;
  if(DRAG.on){
    SUPPRESS_CLICK=true;                 /* 拖完不要再弹详情页 */
    clearTimeout(_supTimer);
    _supTimer=setTimeout(()=>{ SUPPRESS_CLICK=false; },400);
    dirty=true;
    const n=DRAG.items.length;
    toast('已移动「'+DRAG.name+'」'+(n>1?('，相关 '+(n-1)+' 方同步跟上'):''));
  }
  DRAG=null;
}

/* =====================  两种图表形式互切  =====================
   ① 向日葵视图（sunflower）：按方阵聚类 + 阵内向日葵排布，连线最利落
   ② 连线视图（force）    ：力导向铺开的连线图（自己算好坐标，静态呈现）
   两者共用同一份 NODES/LM/LC/CASES，切换只是换坐标与连线的画法，数据天然同步。 */
const MODE_LABEL={'sunflower':'向日葵视图','force':'连线视图'};
function setLayout(mode){
  LAYOUT_MODE = (mode==='force') ? 'force' : 'sunflower';
  try{ localStorage.setItem('jf_layout_mode', LAYOUT_MODE); }catch(err){}
  LAYOUT_FRESH=true;                      /* 显式换形式 → 重算坐标 */
  rebuild(); fitAll(); refresh(false);    /* false＝按新布局重新取景 */
  syncViewBtn();
  toast('已切到「'+MODE_LABEL[LAYOUT_MODE]+'」'
    +(LAYOUT_MODE==='sunflower'?'——按方阵聚类·向日葵排布':'——力导向铺开（静态，操作时不会跳动）'));
}
function relayout(){
  LAYOUT_FRESH=true;
  rebuild(); fitAll(); refresh(false);
  toast('已重新整理布局');
}
/* 顶栏一键互切 */
function toggleView(){ setLayout(LAYOUT_MODE==='force' ? 'sunflower' : 'force'); }
function syncViewBtn(){
  const b=document.getElementById('btnView');
  if(b) b.innerHTML = (LAYOUT_MODE==='force') ? '❋ 切到向日葵视图' : '⇄ 切到连线视图';
}
document.getElementById('btnView').addEventListener('click',toggleView);

/* =====================  搜索  ===================== */
let SQ='', SQ_ADJ=true;
function matchQuery(name,n){
  if(!SQ) return true;
  const q=SQ.toLowerCase();
  const blob=((name||'')+' '+(n.composition||'')+' '+(n.primaryGroup||'')+' '+(n.subGroup||'')
              +' '+(n.mainTreat||'')+' '+(n.note||'')).toLowerCase();
  return blob.indexOf(q)>=0;
}
const HIT_MAX=60;                                /* 命中列表最多渲染多少项 */
let SEL_HIT=0;                                   /* 键盘↑↓选中的命中项 */
function hitPage(){ return searchHits().slice(0,HIT_MAX); }   /* 实际渲染出来的那批 */
function renderHits(){
  const q=SQ.trim(), box=document.getElementById('searchHits');
  if(!q){ box.innerHTML=''; return; }
  const shown=hitPage();
  /* ★ 选中索引必须落在「已渲染」范围内 —— 否则会选中一个看不见的项 */
  if(SEL_HIT>=shown.length) SEL_HIT=0;
  if(SEL_HIT<0) SEL_HIT=0;
  box.innerHTML = shown.map((n,i)=>'<div class="hit'+(i===SEL_HIT?' sel':'')+'" data-n="'+esc(n.name)+'">'
    +'<b>'+esc(n.name)+'</b><span class="g">'+esc((n.primaryGroup||'').split('／')[0])+'</span></div>').join('');
  /* 选中项滚进可视区（列表长时不用鼠标去找） */
  const sel=box.querySelector('.hit.sel');
  if(sel && sel.scrollIntoView){ try{ sel.scrollIntoView({block:'nearest'}); }catch(err){} }
}
/* ★ 命中排序：完全同名 → 名字以它开头 → 名字含它 → 药味/方阵含它
   否则搜「桂枝汤」时，主治里提到桂枝汤的「麻黄汤」会排到前面，定位到错的方。 */
function hitScore(n,q){
  const name=(n.name||'').toLowerCase();
  if(name===q) return 0;
  if(name.indexOf(q)===0) return 1;
  if(name.indexOf(q)>=0) return 2;
  if(((n.composition||'')+'').toLowerCase().indexOf(q)>=0) return 3;
  const meta=((n.primaryGroup||'')+' '+(n.subGroup||'')).toLowerCase();
  if(meta.indexOf(q)>=0) return 4;
  return 5;
}
function searchHits(){
  const q=SQ.trim().toLowerCase();
  if(!q) return NODES.slice();
  return NODES.filter(n=>matchQuery(n.name,n))
    .map(n=>({n:n,s:hitScore(n,q)}))
    .sort((a,b)=> a.s-b.s
              || (a.n.name.length-b.n.name.length)

function doSearch(val){
  SQ=val;

  renderHits();
  refresh();                                     /* 全量重绘（视图复位） */
  const hs=searchHits();
  const info=document.getElementById('searchInfo');
  if(!SQ.trim()){ if(info) info.textContent='按方名／药味／方阵搜索'; return; }
  if(!hs.length){ if(info) info.textContent='无匹配（编辑模式下回车可新建该方）'; return; }
  const r=focusNode(hs[0].name);
  if(info) info.innerHTML='匹配 '+hs.length+' 个方　·　已定位到 <b style="color:#a61b1b">'+esc(hs[0].name)+'</b>'
    +(r&&r.found?'':'（该方当前不在视图内）')
    +'<br><span style="color:#98a1ab">↑↓ 可换一个　回车定位选中项</span>';
}

document.getElementById('searchBox').addEventListener('keydown',e=>{
  if(e.isComposing) return;                    /* 输入法组字中不响应回车 */
  /* ★ ↑↓ 在命中列表里移动选中项 —— 只改选中态，不动视角 */
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    const shown=hitPage();
    if(!shown.length) return;
    e.preventDefault();                        /* 别让光标跳回输入框开头 */
    SEL_HIT += (e.key==='ArrowDown'?1:-1);
    if(SEL_HIT<0) SEL_HIT=shown.length-1;      /* 在「已渲染范围」内回环 */
    if(SEL_HIT>=shown.length) SEL_HIT=0;
    renderHits();
    const info=document.getElementById('searchInfo');
    const all=searchHits().length;
    if(info) info.innerHTML='选中第 '+(SEL_HIT+1)+' / '+shown.length+' 个：<b style="color:#a61b1b">'
      +esc(shown[SEL_HIT].name)+'</b><br><span style="color:#98a1ab">回车定位选中项'
      +(all>shown.length?('　（共 '+all+' 个匹配，列表显示前 '+shown.length+' 个）'):'')+'</span>';
    return;
  }
  if(e.key==='Enter'){
    SQ=(e.target.value||'');                   /* ★ 以输入框实际内容为准，避免与内部状态不同步 */
    const shown=hitPage();
    if(shown.length){
      const pick=shown[Math.min(Math.max(SEL_HIT,0),shown.length-1)];
      focusNode(pick.name);                    /* ★ 只定位高亮，不自动开弹窗 */
      toast('已定位到「'+pick.name+'」—— 点节点可展开详情');

});

/* ★ 定位并高亮某个方剂：视图「平滑平移」到该节点 + 高亮
   注意：只定位，不自动打开弹窗（是否展开由用户自己决定）
   返回 {found, centered, animated}，便于断言 */
function focusNode(name){
  const c=initChart();
  const seq=++FOCUS_SEQ;                 /* 用户一旦手动操作视角，这次定位整体作废 */
  let done=false;
  const run=()=>{
    if(seq!==FOCUS_SEQ) return {found:false,cancelled:true};
    if(done) return {found:true,centered:true};
    const r=applyFocus(name);
    /* 已找到「且」拿到坐标 → 不再重试；只找到没坐标则等布局完成后再来一次 */
    if(r.found && r.centered) done=true;
    return r;
  };
  /* 力导向布局是异步的，等渲染完再取坐标；同时留一个兜底定时器 */
  try{ if(typeof c.once==='function') c.once('finished',run); }catch(err){}
  setTimeout(run, 460);
  return run();                       /* 立即先试一次（已布局好的节点可立刻定位） */
}
function applyFocus(name, noAnim){
  const c=initChart(), out={found:false,centered:false,animated:false};
  let idx=-1, data=null;
  try{
    const model=c.getModel&&c.getModel();
    data=model?model.getSeriesByIndex(0).getData():null;
    if(data&&typeof data.indexOfName==='function') idx=data.indexOfName(name);
  }catch(err){}
  if(idx<0){
    const arr=(c.getOption().series||[{}])[0].data||[];
    idx=arr.findIndex(d=>d&&d.name===name);
  }
  if(idx<0) return out;
  out.found=true;
  /* ① 高亮（ECharts 自带 emphasis 过渡动画），4 秒后自动取消 */
  try{
    c.dispatchAction({type:'downplay',seriesIndex:0});
    c.dispatchAction({type:'highlight',seriesIndex:0,dataIndex:idx});
  }catch(err){}
  clearTimeout(applyFocus._t);
  applyFocus._t=setTimeout(()=>{ try{ c.dispatchAction({type:'downplay',seriesIndex:0,dataIndex:idx}); }catch(err){} },4200);
  /* ② 平滑平移到该节点（不是瞬间跳） */
  let pt=null;
  try{
    const L=data?data.getItemLayout(idx):null;
    if(L) pt = Array.isArray(L) ? [L[0],L[1]] : [L.x,L.y];
  }catch(err){}
  if(pt&&isFinite(pt[0])&&isFinite(pt[1])){
    const z=Math.max(curView(c).zoom||0.85, 1.25);
    const r=animateView(pt, z, noAnim?0:520);
    out.centered=true; out.animated=!!(r&&r.animated);
  }
  return out;
}

  if(it.id==='lgReset'){ selG.clear(); selR.clear(); }

});

/* ---------- 弹窗内事件（编辑） ---------- */
function bindModal(){
  const body=document.getElementById('mbody'), tags=document.getElementById('mtags');
  const onInput=e=>{
    const t=e.target; if(!NODE_MAP[CUR]) return;
    const n=NODE_MAP[CUR];
    if(t.dataset.nf){                                    /* 方阵／子类（弹窗顶部） */
      beginEdit();
      const v=t.value;
      n[t.dataset.nf]=v;
      dirty=true;
      if(t.dataset.nf==='primaryGroup'){ const g=v.split('／')[0]; if(g) groupColor(g); }
      return;
    }
    if(t.dataset.f && t.dataset.f.indexOf('nf.')===0){   /* 节点正文各字段 */
      beginEdit();
      const k=t.dataset.f.slice(3);
      n[k]=t.value; dirty=true; return;
    }
    const box=t.closest('[data-ci]');
    if(t.dataset.cf && box){                             /* 医案字段（列表头） */
      const c=CASES[+box.dataset.ci]; if(!c) return;
      beginEdit();
      if(t.dataset.cf==='usedFormulas'){ c.usedFormulas=t.value.split('＋').map(s=>s.trim()).filter(Boolean); }
      else c[t.dataset.cf]=t.value;
      dirty=true; return;
    }
    if(t.dataset.f && box){                              /* 医案字段（+inputFor） */
      const k=t.dataset.f; if(k.indexOf('c.')!==0) return;
      const c=CASES[+box.dataset.ci]; if(!c) return;
      beginEdit();
      c[k.slice(2)]=t.value; dirty=true; return;
    }
  };
  body.addEventListener('input',onInput);
  tags.addEventListener('input',onInput);
  body.addEventListener('change',e=>{
    const t=e.target;
    // 关系类型下拉：上/下游、参考
    const eb=t.closest('[data-ei]');
    if(t.dataset.ef && eb){
      const isC=eb.dataset.ecand==='1';
      const idx=+eb.dataset.ei, dir=eb.dataset.edir;
      const list=(isC?IDX_C:CURR_IDX())[CUR];
      const l=(dir==='up'? (list&&list.up[idx]) : (list&&list.down[idx]));
      if(!l) return;
      beginEdit();
      if(t.dataset.ef==='other'){
        const other=t.value.trim();
        if(!other) return;
        if(dir==='up') l.source=other; else l.target=other;
      } else {
        l[t.dataset.ef]=t.value;
      }
      dirty=true; rebuild(); showModal(CUR);
      return;
    }
    // 医案所用方
    if(t.dataset.cf==='usedFormulas'){
      const box=t.closest('[data-ci]'); const c=CASES[+box.dataset.ci];
      if(c){ beginEdit(); c.usedFormulas=t.value.split('＋').map(s=>s.trim()).filter(Boolean); dirty=true; rebuild(); }
    }
  });
  /* ★ 事件委托绑在稳定的 #modal 上 ★
     不能在这里直接 getElementById('btnAddCase') 等——那些按钮是 showModal 之后才
     渲染出来的，加载时并不存在，直接绑定必然绑不上（曾因此导致两个按钮点了没反应）。 */
  const modalRoot=document.getElementById('modal');
  modalRoot.addEventListener('click',e=>{
    const tgt=e.target;
    if(!NODE_MAP[CUR]) return;
    /* ★ 保存本节点（提交本次事务） */
    if(tgt.id==='btnMNodeSave'){ commitModal(); return; }
    /* ★ 取消（回滚本次事务） */
    if(tgt.id==='btnMNodeCancel'){ closeModal(); return; }
    /* 新增医案 */
    if(tgt.id==='btnAddCase'){
      beginEdit();
      CASES.push({caseId:'NEW'+String(CASES.length+1).padStart(3,'0'),caseSource:'（手工录入）',
        caseType:'手工',归集方:CUR,usedFormulas:[CUR],isCombine:false,
        patient:'',symptom:'',history:'',exam:'',analysis:'',prescription:'',effect:'',comment:'',
        caseExcerpt:'',hasDose:false});
      dirty=true; rebuild(); showModal(CUR); toast('已新增空白医案（点「保存本节点」才生效）');
      return;
    }
    /* 删除本节点 */
    if(tgt.id==='btnDelNode'){
      const n=NODE_MAP[CUR];
      const deg=(n._dm||0)+(n._dc||0), cn=(CASE[CUR]||[]).length;
      if(!confirm('删除方剂「'+CUR+'」？\n\n关联关系 '+deg+' 条、医案 '+cn+' 则会一并解除挂载。\n（可先导出 JSON 备份）')) return;
      for(let i=LM.length-1;i>=0;i--) if(LM[i].source===CUR||LM[i].target===CUR) LM.splice(i,1);
      for(let i=LC.length-1;i>=0;i--) if(LC[i].source===CUR||LC[i].target===CUR) LC.splice(i,1);
      CASES.forEach(c=>{ c.usedFormulas=(c.usedFormulas||[]).filter(x=>x!==CUR); });
      const i=NODES.findIndex(x=>x.name===CUR); if(i>=0) NODES.splice(i,1);
      mask.classList.remove('on'); CUR=null;
      OPEN_SNAP=null; MODAL_CHANGED=false; OPEN_FOR=null;
      dirty=true; rebuild(); refresh(); toast('已删除方剂');
      return;
    }
    const act=tgt.dataset?tgt.dataset.act:null;
    if(!act) return;
    const eb=tgt.closest('[data-ei]');
    if(act==='delEdge'&&eb){
      const isC=eb.dataset.ecand==='1', idx=+eb.dataset.ei, dir=eb.dataset.edir;
      const list=(isC?IDX_C:CURR_IDX())[CUR];
      const l=(dir==='up'? (list&&list.up[idx]) : (list&&list.down[idx]));
      if(!l) return;
      if(!confirm('删除这条关系？\n\n'+(l.source||'')+' → '+(l.target||'')+'\n'+(l.relationType||''))) return;
      beginEdit();
      const arr=isC?LC:LM;
      const i=arr.indexOf(l); if(i>=0) arr.splice(i,1);
      dirty=true; rebuild(); showModal(CUR); toast('已删除关系（点「保存本节点」才生效）');
      return;
    }
    if(act==='addEdge'){
      const dir=tgt.dataset.dir;
      const other=document.getElementById('ne_other').value.trim();
      if(!other){ toast('请先填写对方方名',true); return; }
      if(!NODE_MAP[other]){ toast('「'+other+'」不在库中；请先用「＋ 新建方剂」创建它',true); return; }
      const rel=document.getElementById('ne_rel').value;
      const conf=document.getElementById('ne_conf').value;
      const ev1=document.getElementById('ne_src').value;
      const ev2=document.getElementById('ne_txt').value;
      const desc=document.getElementById('ne_desc').value;
      beginEdit();
      const nl={relationType:rel,confidence:conf,evidenceSource:ev1,evidenceText:ev2,relationDesc:desc};
      if(dir==='up'){ nl.source=other; nl.target=CUR; } else { nl.source=CUR; nl.target=other; }
      LM.push(nl);
      dirty=true; rebuild(); showModal(CUR); toast('已添加主图关系（点「保存本节点」才生效）');
      return;
    }
    if(act==='addRef'){
      const other=document.getElementById('nr_other').value.trim();
      if(!other){ toast('请先填写方名',true); return; }
      if(!NODE_MAP[other]){ toast('「'+other+'」不在库中，请先新建',true); return; }
      beginEdit();
      LC.push({source:CUR,target:other,relationType:document.getElementById('nr_rel').value,
        confidence:document.getElementById('nr_conf').value,
        evidenceText:'',evidenceSource:'',relationDesc:'人工添加的参考关联（不作演化依据）'});
      dirty=true; rebuild(); showModal(CUR); toast('已添加参考边（点「保存本节点」才生效）');
      return;
    }
    if(act==='delCase'){
      const box=tgt.closest('[data-ci]'); const c=CASES[+box.dataset.ci];
      if(!c||!confirm('删除这则医案？\n（点「取消」可整批还原本次弹窗内的改动）')) return;
      beginEdit();
      CASES.splice(+box.dataset.ci,1);
      dirty=true; rebuild(); showModal(CUR); toast('已删除医案（点「保存本节点」才生效）');
      return;
    }
  });
}
function CURR_IDX(){ return IDX_M; }
bindModal();

/* =====================  弹窗事务：提交 / 回滚  ===================== */
/* 收尾本次事务：keep=true 保留（提交），false 回滚 */
function applySession(keep){
  if(OPEN_SNAP && MODAL_CHANGED){
    if(!keep){
      /* 回滚 = 把数据换回打开前的样子。坐标是数据的确定性函数，
         回滚后重算即得同一套坐标，所以不需要额外保存/恢复位置。 */
      try{ applyData(JSON.parse(OPEN_SNAP)); }catch(err){ toast('回滚失败：'+err.message,true); }
    } else {
      dirty=true; saveLocal();
    }
  }
  OPEN_SNAP=null; MODAL_CHANGED=false; OPEN_FOR=null;
}
function commitModal(){
  if(!MODAL_CHANGED){ toast('没有需要保存的修改'); return; }
  const who=OPEN_FOR||CUR;
  applySession(true);
  rebuild(); refresh(true);
  showModal(who);
  toast('已保存「'+who+'」的修改');
}
/* ★ 关闭弹窗：只在「真的回滚了数据」时才重绘。
   单纯点开看看再退出【不重绘】—— 重绘是节点抖动与视角跳动的唯一来源。 */
function closeModal(){
  let needRedraw=false;
  if(MODAL_CHANGED && OPEN_SNAP){
    if(!confirm('「'+(OPEN_FOR||CUR)+'」的修改还没有保存。\n\n点「确定」＝放弃修改并关闭\n点「取消」＝返回继续编辑')) return;
    applySession(false);
    needRedraw=true;
    toast('已放弃本次修改');
  } else {
    OPEN_SNAP=null; MODAL_CHANGED=false; OPEN_FOR=null;
  }
  mask.classList.remove('on'); CUR=null;
  if(needRedraw){ rebuild(); refresh(); }    /* 只有回滚过数据才需要重绘 */
}

function newFormula(prefill){
  if(!editMode){ toast('请先勾选「编辑模式」',true); return; }
  const name=(prefill||prompt('新方剂名称：','')||'').trim();
  if(!name) return;
  if(NODE_MAP[name]){ toast('已存在同名方剂，已为你打开',true); showModal(name); return; }
  const g=prompt('顶层方阵（如 桂枝方阵；不确定可留空）：','')||'';
  const sg=prompt('二级子类（可留空）：','')||'';
  const comp=prompt('药物组成（如 桂枝18白芍18…；可留空）：','')||'';
  NODES.push({name:name,primaryGroup:g||'未分类',subGroup:sg,composition:comp,
    mainTreat:'',sourceBooks:'',note:'（手工新建）',originalEntry:'',_prose:'',_proseLen:0});
  if(g) groupColor(g.split('／')[0]);
  dirty=true; rebuild(); refresh(true); showModal(name); toast('已新建「'+name+'」');

function chart_on(){
  initChart().on('click',p=>{
    if(SUPPRESS_CLICK){                          /* ★ 长按锁定刚触发：吞掉这次 click */
      SUPPRESS_CLICK=false; clearTimeout(_supTimer);
      return;
    }
    if(p.dataType==='node'){
      if(linkMode) handleLinkClick(p.data.name);
      else showModal(p.data.name);
    } else if(linkMode && linkFrom){
      linkFrom=null; renderHint();               /* 点空白处取消连线起点 */
    }
    /* 注意：点空白处【不】解锁 —— 解锁只能点右上角的红色锁定标识 */
  });
  /* ★ 长按锁定 + 拖动：按下时同时「预备」，之后靠位移阈值区分（互斥） */
  initChart().on('mousedown',p=>{
    if(p.dataType!=='node') return;
    pressStart(p.data.name, p.event);
    dragArm(p.data.name, p.event);
  });
  try{
    const zr=initChart().getZr();
    zr.on('mousemove',e=>{
      if(PRESS&&!PRESS.fired){
        if(Math.hypot((e.offsetX||0)-PRESS.x,(e.offsetY||0)-PRESS.y)>PRESS_MOVE) cancelPress();
      }
      dragMove(e);                       /* 位移超过阈值才真正开始拖 */
    });
    zr.on('mouseup',()=>{ cancelPress(); dragEnd(); });
    zr.on('mouseout',()=>{ cancelPress(); dragEnd(); });
  }catch(err){}
  initChart().getZr().on('dblclick',e=>{
    if(!editMode) return;
    const p=initChart().convertFromPixel({seriesIndex:0},[e.offsetX,e.offsetY]);
    if(p) newFormula('');
  });
  /* 用户自己缩放/平移 → 立刻停掉正在播放的视角补间，并放弃排队的定位重试。
     否则动画会继续跟用户「抢」视角，手动操作被覆盖。 */
  try{
    initChart().on('graphroam',p=>{
      stopAnim();
      FOCUS_SEQ++;                                  /* 让 focusNode 的延迟重试失效 */
      if(p&&typeof p.zoom==='number') VIEW.zoom=p.zoom;
    });
  }catch(err){}
}

  [...body.querySelectorAll('.dirlab')].forEach(lab=>{
    lab.addEventListener('click',()=>{
      [...body.querySelectorAll('.dirlab')].forEach(x=>x.classList.remove('sel'));
      lab.classList.add('sel');
    });
  });
  document.getElementById('linkPanel').classList.add('on');
  LINK_PAIR=[a,b];
}
document.getElementById('linkBody').addEventListener('click',e=>{
  const a=e.target.dataset?e.target.dataset.lk:null;
  if(!a) return;
  if(a==='cancel'){ document.getElementById('linkPanel').classList.remove('on'); return; }
  if(a==='swap'){
    LINK_PAIR=[LINK_PAIR[1],LINK_PAIR[0]];
    openLinkPanel(LINK_PAIR[0],LINK_PAIR[1]); return;
  }
  if(a==='ok'){
    const rel=(document.getElementById('lk_rel').value||'').trim();
    if(!rel){ toast('请填写关系类型',true); return; }
    const dir=([...document.querySelectorAll('input[name=lkd]')].find(x=>x.checked)||{}).value||'ab';
    const nl={relationType:rel,
      confidence:document.getElementById('lk_conf').value,
      evidenceSource:document.getElementById('lk_src').value,
      evidenceText:document.getElementById('lk_txt').value,
      relationDesc:document.getElementById('lk_desc').value};
    if(dir==='ref'){
      nl.source=LINK_PAIR[0]; nl.target=LINK_PAIR[1];
      if(!nl.relationDesc) nl.relationDesc='人工添加的参考关联（不作演化依据）';
      LC.push(nl); toast('已添加参考边（无方向）');
    } else if(dir==='ab'){ nl.source=LINK_PAIR[0]; nl.target=LINK_PAIR[1]; LM.push(nl); toast('已连线 '+LINK_PAIR[0]+' → '+LINK_PAIR[1]); }
    else { nl.source=LINK_PAIR[1]; nl.target=LINK_PAIR[0]; LM.push(nl); toast('已连线 '+LINK_PAIR[1]+' → '+LINK_PAIR[0]); }
    LAST_REL=rel; dirty=true; rebuild(); refresh(true);
    document.getElementById('linkPanel').classList.remove('on');
    linkFrom = STAY_LINK ? LINK_PAIR[1] : null;
    renderHint();
  }
});

/* ---------- 保存为 HTML（把修改写进文件本身） ---------- */
function saveAsFile(){
  /* 先把临时 UI 状态收干净，免得被序列化进存档 */
  const lpanel=document.getElementById('linkPanel'); if(lpanel) lpanel.classList.remove('on');
  const hbar=document.getElementById('hintbar'); if(hbar){ hbar.classList.remove('on'); hbar.innerHTML=''; }
  const maskEl=document.getElementById('mask'); if(maskEl) maskEl.classList.remove('on');
  const mbodyEl=document.getElementById('mbody'); if(mbodyEl) mbodyEl.innerHTML='';
  const mtagsEl=document.getElementById('mtags'); if(mtagsEl) mtagsEl.innerHTML='';
  const mtoolsEl=document.getElementById('mtools'); if(mtoolsEl) mtoolsEl.innerHTML='';
  const sb=document.getElementById('searchBox'); if(sb) sb.value='';
  const sh=document.getElementById('searchHits'); if(sh) sh.innerHTML='';

  let src='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  const A=src.indexOf('const nodes           = ');
  const B=src.indexOf('/* ==================== 数据区结束');
  if(A<0||B<0||B<A){ toast('无法定位数据区，请改用「导出 JSON」',true); return; }
  const blk='const nodes           = '+JSON.stringify(NODES)+';\n'
    +'const links_main      = '+JSON.stringify(LM)+';\n'
    +'const candidate_links = '+JSON.stringify(LC)+';\n'
    +'const cases           = '+JSON.stringify(CASES)+';\n';
  const htmlOut=src.slice(0,A)+blk+src.slice(B);
  let url=null;
  try{ url=URL.createObjectURL(new Blob([htmlOut],{type:'text/html;charset=utf-8'})); }catch(err){ url=null; }
  const el=document.createElement('a');
  el.href = url || ('data:text/html;charset=utf-8,'+encodeURIComponent(htmlOut));
  el.download='方剂演化图谱_十阵.html';
  document.body.appendChild(el); el.click();
  setTimeout(()=>{ try{document.body.removeChild(el);}catch(err){} if(url) URL.revokeObjectURL(url); },400);
  dirty=false; refresh(true);
  toast('已保存为 HTML（'+(htmlOut.length/1048576*3).toFixed(1)+' MB）—— 用它覆盖原文件即可永久生效');
}
document.getElementById('btnSaveFile').addEventListener('click',saveAsFile);

document.getElementById('mclose').addEventListener('click',closeModal);
mask.addEventListener('click',e=>{ if(e.target===mask) closeModal(); });
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('linkPanel').classList.contains('on')){ document.getElementById('linkPanel').classList.remove('on'); return; }
    if(mask.classList.contains('on')){ closeModal(); return; }
    if(linkFrom){ linkFrom=null; renderHint(); }
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); document.getElementById('btnSave').click(); }
});
window.addEventListener('resize',()=>{ if(chart) chart.resize(); });
['cbCand','cbIso','cbLab','cbAdj'].forEach(id=>document.getElementById(id).addEventListener('change',()=>chart.setOption(opt(),true)));

/* ---------- 启动 ---------- */
try{
  const lm0=localStorage.getItem('jf_layout_mode');
  if(lm0==='force') LAYOUT_MODE='force';
  else if(lm0==='sunflower'||lm0==='none') LAYOUT_MODE='sunflower';   /* 'none' 是旧键值 */
}catch(err){}
const restored=loadLocal();
if(!restored) applyData(clone(BASE_SNAP)); else { rebuild(); }
fitAll();                       /* ★ 首次进入先把全图装进视野，看到整体结构 */
refresh(false);                 /* 首次渲染不保留视角（还没有视角） */
renderHits();
syncViewBtn();
renderLockTip();
document.getElementById('tipEdit').innerHTML='勾选右上「编辑模式」可修改内容';
document.getElementById('searchInfo').textContent = SQ?'':'按方名／药味／方阵搜索';
if(restored){
  document.getElementById('stat').innerHTML += '　<span style="color:#b26a00">● 已载入本机保存的修改</span>';
}

/* ---------- 对外句柄（控制台调试 / 二次开发） ---------- */
window.__GRAPH__={
  get nodes(){return NODES;}, get links(){return LM;}, get cand(){return LC;},
  get cases(){return CASES;}, get map(){return NODE_MAP;},
  snapshot:snapshot, rebuild:rebuild, opt:opt, matchQuery:matchQuery, refresh:refresh,
  save:function(){return saveLocal();}, reset:function(){clearLocal();applyData(clone(BASE_SNAP));refresh();},
  open:function(n){showModal(n);}, setEdit:function(v){setEditMode(!!v);},
  focus:function(n){return focusNode(n);}, search:function(v){doSearch(v==null?'':v);},
  curView:function(){return curView();},
  animateTo:function(cx,cy,z,ms){return animateView([cx,cy],z,ms);},
  hits:function(){return searchHits().map(x=>x.name);},
  setLink:function(v){setLinkMode(!!v);}, isLink:function(){return linkMode;},
  link:function(a,b,rel,dir){          /* 控制台一句连线：__GRAPH__.link('A','B','母方演化') */
    const nl={relationType:rel||'母方演化',confidence:'原文明示',evidenceSource:'',evidenceText:'',
      relationDesc:'控制台添加'};
    if(dir==='ref'){ nl.source=a; nl.target=b; LC.push(nl); }
    else if(dir==='ba'){ nl.source=b; nl.target=a; LM.push(nl); }
    else { nl.source=a; nl.target=b; LM.push(nl); }
    LAST_REL=nl.relationType; dirty=true; rebuild(); refresh(true); return nl;
  },
  saveFile:saveAsFile,
  setLayout:function(m){setLayout(m);}, toggleView:function(){toggleView();},
  get viewMode(){return LAYOUT_MODE;},
  relayout:function(){relayout();},
  /* 锁定高亮 */
  lock:function(n){setLock(n);}, get locked(){return LOCKED;},
  get lockSet(){return LOCK_SET?Array.from(LOCK_SET):null;},
  /* 拖动（联动） */
  neighborsOf:function(n){return neighborsOf(n);},
  dragArm:function(n,ev){dragArm(n,ev||{offsetX:0,offsetY:0});},
  dragMove:function(ev){dragMove(ev);},
  dragEnd:function(){dragEnd();},
  get dragging(){return !!(DRAG&&DRAG.on);},
  get dragGroup(){return DRAG?DRAG.items.map(x=>x.n):null;},
  screenToWorld:function(sx,sy){return screenToWorld(initChart(),sx,sy);},
  pressStart:function(n,ev){pressStart(n,ev);}, cancelPress:function(){cancelPress();},
  fitAll:function(){fitAll();refresh(false);}, get zoom(){return VIEW.zoom;},
  get layoutMode(){return LAYOUT_MODE;}, get layoutPos(){return LAYOUT;},
  /* 弹窗事务：供测试/控制台使用 */
  commitModal:function(){ if(CUR) commitModal(); },
  closeModal:function(){ closeModal(); },
  isModalDirty:function(){ return MODAL_CHANGED; },
  openSessionFor:function(){ return OPEN_FOR; },
  addNode:function(o){NODES.push(o);rebuild();refresh(true);return o;},
  addLink:function(o){LM.push(o);rebuild();refresh(true);return o;}
};
}

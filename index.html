苓汤证（偏于下焦之水热）：\n同样是发热渴饮，但是伴有小便不利，这是水热结于下焦，废水存在下焦，\n影响到了津液的气化和上奉所以会渴饮。这种情况，会小便不利的，但是不会多\n汗。水虽热但是结在下焦了，表上是无汗的，可不能去用白虎加人参汤了，那个\n是清热而补充津液的，而此证需要清热而排出废水。更不能发汗，“阳明病，汗\n出多而渴者，不可与猪苓汤，以汗多胃中燥，猪苓汤复利其小便故也。（224）”\n阳明病，发热汗出口渴，胃中本来就显示不足了，再利水耗津就会便难谵语的。\n若脉浮发热，渴欲饮水，小便不利者，猪苓汤主之。（223）\n本条说的简略，要想全面了解此病机我们需要联系第 319 条：“少阴病，下\n利六七日，咳而呕渴，心烦，不得眠者，猪苓汤主之。”这就明了了，这样的患\n者，水热结于下焦，废水的存在，影响到了下焦的分清别浊，不但会小便不利，\n还会大便下利的。前人对 319 条为什么说少阴病往往解释的牵强，我们前面说过，\n三阴病的下利辨证要点是“自利而渴属少阴”的。\n“少阴病，欲吐不吐，心烦，但欲寐，五六日自利而渴者，属少阴也，虚故\n引水自救”，少阴病会呕渴下利心烦的，所以仲圣为了区别同样是呕渴下利心烦\n还会有猪苓汤证，故而前面提出少阴病下利来提醒学者鉴别。\n少阴病的下利是要用温法的，症候会恶寒，但欲寐，神疲乏力；而猪苓汤证\n除了呕渴下利心烦还会伴有发热，不得眠，小便不利，一派水热伤及下焦和营血\n的征象，它的下利重了会有血利或者尿血的，治疗要清热利水养血。\n猪苓汤，猪苓茯苓泽泻滑石都是清热利水的，阿胶是养血的，是水血同治以\n水为主的方子。\n酸枣仁汤条：\n虚劳虚烦不得眠，酸枣汤主之。《金匮•血痹虚劳病脉证并治第六》\n酸枣汤方\n酸枣仁二升 甘草一两 知母二两 茯苓二两 穹穷二两\n右五味，以水八升，煮酸枣仁，得六升，内诸药，煮取三升，分温三服。\n释：虚劳虚烦不得眠，这个劳，古代的写法是“勞”，两个火字头的，凡是\n虚劳都有虚热证。虚劳，伤的是津血精的范畴，这些都是濡养滋润人体的，它们\n伤了以后，会产生虚性的火燥热的症候群。所以酸枣仁汤用大量酸枣仁配伍川芎\n甘草养血益精生津，血少则水盛，虚劳则虚热，故用茯苓配伍知母清热利水，知\n母清热利水而能益气，是一味独特性能的清补之药。\n本方酸枣仁三倍于诸药之和，所以是水血同治中以治血为主者。\n答疑：\n1、许师酸枣仁汤枣仁二升，在临床中用多少？为什么此方用川芎呢？200\n多克，我一般用 160—200。血少了会淤滞，川芎养血行血，非常必要，就像水\n少了就会淤堵一个道理，川芎能补益，丹皮能行破。故而以补益为主的方子如胶\n艾汤、胶姜汤、薯蓣丸、酸枣仁汤、白术散、当归散等皆用川芎而不用丹皮；而\n行破为主的方子如桂枝茯苓丸、大黄牡丹皮汤、鳖甲煎丸皆用丹皮而不用川芎，\n丹皮所治之淤血是有了实的。\n2、如何理解静脉曲张这个症状，算是血痹吗？静脉曲张要分虚实的，虚的\n可以从血痹论治，实的需要从淤血论治。\n3、黄芪桂枝五物汤和小建中汤，是不是一个血痹在四肢肌表，一个血痹在\n腹部？\n\n不要这样理解，血痹必须以外证为主，血痹不是淤血痹着，而是表病兼虚，\n表病+津血虚。\n4、腹肌不荣而痛也是外证？那些瘀阻的表现是因虚而淤，需要温补为主，\n施治的方向和法则不同。\n5、食欲不佳不光是太阴病的专利，阳明也会有；大便初硬后溏是一个症状，\n不是病机，真正的太阴固瘕的大便初硬后溏的病机是中寒。\n6、当归芍药散的剂量，当归 10 川芎 40 芍药 40 泽泻 40 白术 20 茯苓 20 做\n汤\n7、老师经方中的湿、水、饮是怎么定义的或者说是如何区分的，在治疗上\n有什么区别吗？经方有两个大证，一个是水证，一个是火证。\n经过这几年的研究，水证我认为已经考证的较为完善了，火证我还需要两年\n的时间来解析。\n水证，包括四饮、水气、湿病。\n四饮是把人体的病态的水液分为淡饮、悬饮、溢饮和支饮。淡饮是虚寒性水\n饮是四饮的基础，悬饮是水饮结为实邪热症而需清利攻下者，溢饮是水饮流行肢\n表，支饮是综合了四饮的一种饮家，辨治需依法治之，及时转方。\n四饮病是废水存在的影响而人体出现了表里上下的多种症候群为主。\n水气病是以外在可见的水肿为主、为急、为苦。\n通俗来说，四饮病就是后世的痰病，所谓的“百病多有谈作祟”、“百病生于\n痰”“怪病多谈”之类‘水气病就是后世的水肿病。\n湿病是由于人体感受了湿邪，留羁于肌表，或内外湿邪相互交困而导致的以\n身体疼烦肿重或恶风恶寒发热，甚或伴有二便失调的一组疾病；其兼风者为风湿，\n兼寒者为湿家（寒湿），表里俱病湿者为湿痹。\n8、完整的病机的概念 ：病机的内容包括机体对风寒湿燥火等外邪侵袭的反\n应、人体内水证火证气证血证的形成与转归、卫气营血的消长盈亏输布转化、胃\n气的强弱虚实寒热、三焦的承奉制化通利以及形成六病的病位病性和病态的体现。\n9、杨艳琴 女 41 岁 农民\n以高血压来诊，平时不服降压药时 180-200/100-120MMHG，服降压药后\n160/100 左右。刻诊：平素怕冷也怕热，手足无寒热。面色黝黑（劳苦人本色），\n多汗，晨起头昏没精神，脸烘热汗出，头晕头胀，无恶心呕吐，低头时眼前发黑。\n大便日一次成型，小便黄起夜两次。阴雨天手关节痛。纳可。胸闷心悸。胃胀，\n烧心泛酸，无腹胀。眼花无耳鸣，口干口渴口苦心烦，喜冷饮。月经经常延后半\n个月，量多色黑无血块，三天完事，小腹凉痛，腰酸。白带可。乏力，晨起眼睑\n浮肿，按脉是指痕明显，腿按不肿。淡红舌薄白苔，有齿痕。脉缓弱涩。\n柴胡桂枝干姜汤 此案为中上焦热盛而伤津液而里有寒饮，热势攻冲，上焦\n热伤津液则口干口渴口苦心烦喜冷饮，本来有饮，津伤饮入，水饮不化，成为水\n热，氤氲中焦而烧心泛酸胃胀；水热继续攻冲则胸闷心悸头晕头胀，头昏无神，\n低头黑眩，眼睑浮肿，热蒸肌表则乏力肢肿烘热汗出多汗。小腹凉痛，腰酸是寒\n饮结于下焦，水寒结于下焦，导致经血也容易停滞，所以月经后期，量多色黑，\n下焦除了水寒，还有水热，所以腹凉而尿黄，阴雨天肢节疼痛乏力是湿饮水证的\n反应。淡红齿痕舌薄白苔是虚而有饮，脉缓是水湿若是里寒涩是津伤之象。怕冷\n也怕热正符合此案寒热杂错往来的病机，邪结于少阳半位，邪入接近阳明病位则\n怕热，邪出接近太阳病位则怕冷。如此病机，表里互兼，寒热杂错，水热并作，\n虚实共存，是为少阳阳明太阴合病，治疗需要解表清热祛饮温里，是故用柴胡桂\n\n枝干姜汤，柴胡配伍桂枝解表，柴胡配伍黄芩清热，天花粉配伍牡蛎清热化饮除\n烦止渴利尿降饮，干姜配伍甘草温里化饮，表里得和，水热得清降，寒饮得化，\n里寒的温，诸症可愈\n10、李炳怀 男 62 岁膀胱癌术后，小腹不舒，乏力。同时前列腺切除。小\n便清或白，尿急，夜里大约每小时一次小便，白天则少很多。查尿液里白细胞\n249（正常值 0-9）。前几天发烧，用了几天抗生素不发烧了，这个检查结果是用\n完抗生素后的。西医手术大夫说还有很多粘膜类的东西还没排完，排完就好了。\n大便日两三次，不稀。感觉怕热，腹部怕凉，手足心热。汗正常，腋窝下多汗。\n耳鸣眼花，无头晕头痛，口干不渴，无口苦，嘴里没滋味（口中和）。心烦，时\n心悸，无胸闷。时胃胀，烧心无泛酸，后背沉重，无四肢关节痛，纳可，眠差。\n舌淡红，苔少不均，无齿痕。右脉浮取似紧，重按缓弱无力，左脉涩。\n甘草泻心汤 此案为水热而兼有胃虚之候，本来是中不制下，下焦虚寒水\n饮夹杂之证，故大小便频数，夜间尿频，腹部怕冷，小腹不适乏力，因为水饮热\n化，水热聚集胃虚不化则口干不渴口中和胃胀烧心怕热，水热蒸腾攻冲则手足心\n热腋下多汗心烦心悸眠差耳鸣眼花，舌淡红苔少是胃虚之候，右脉浮取似紧，重\n按缓弱无力是虚而水热攻冲之象，左脉涩是不足之候。处以甘草泻心汤，里面有\n甘草干姜汤补上制下治虚寒水饮的方根，有小半夏汤治支饮的方根，有健胃的人\n参甘草大枣，有清热的芩连，所谓丝丝入扣者也\n11、少阳病是半表里半虚实半寒热之偏于阳者，厥阴病是半表里半虚实半寒\n热之偏于阴者，桂枝汤可以治太阳中风，太阳中风病的实质是表上相对的实证，\n就是说太阳中风是由于外邪的侵袭而津液聚集于表位了，但是相对于太阳伤寒麻\n黄汤证的绝对的“表实证”来说，太阳中风桂枝汤证是相对的实的“表虚证”，\n桂枝汤证可以是卫强营弱，可以是营卫俱弱，而营卫俱弱这个病机可以出现在厥\n阴病营血不足或不通的层面上，厥阴轻证经常可见，单用桂枝汤就可以取效，即\n使营血的重症比如当归四逆汤、当归四逆加吴茱萸生姜汤、温经汤等也是桂枝汤\n的加味方。而卫强营弱也会出现在一些少阳中风病偏于表位时，如 146：伤寒六\n七日，发热微恶寒，肢节烦疼，微呕，心下支结，外证未去者，柴胡桂枝汤主之。\n这组症状，有发热恶寒，肢体疼痛，呕这都是卫津在表强（聚集停滞）的反应，\n所以单用桂枝汤也可以治疗，而心下支结，有甘草生姜大枣和米粥和里养胃补津\n液也完全可以胜任，所以桂枝汤也可以治疗一部分少阳病\n故而说桂枝汤是少阳厥阴通吃的方子\n桂枝汤发表邪养营卫助胃气为主，柴胡汤和表里清里热通津液治水饮为主，\n怕冷又怕热是邪在半表里的反应\n12、许师：怕冷又怕热是邪在半表里的反应，那么我们临床的时候怎样鉴别\n是半表里的少阳还是厥阴呢？或者仅仅是在浅表的营卫不和？\n根据整体症状偏阳还是偏阴偏虚还是偏实偏寒还是偏热去定位\n13、老师，乌梅丸跟肾气丸若做成汤剂，剂量应该怎样？制附子 10 桂枝 10\n人参 10 细辛 10 干姜 20 当归 10 黄柏 10 黄连 30 川椒 10 乌梅 60 苦酒 150\n—200\n14、老师，能说说津，营，血，水，气之间的关系吗？水血讲了，其他几个，\n水津，水气，津血怎么个关系，水血津的关系。这几个在临床上的病案里怎么去\n更准确的找到是那个出问题后导致的另一个或几个出问题，像五课讲的附子汤时\n说：方证是多维的而不是唯一的，附子汤即可以治疗虚寒水津同病的层面，又可\n以治疗水血同病的层面，还可以治疗水血津液同病的层面。老师说过伤寒论讲的\n\n就是保胃气，存津液，那病人一定是这 2 个出问题了，才会出现病理情况。我现\n在临床是先从病人的中焦胃气去开始往外了扩展的找病机，基本是围绕胃气和津\n来找，到底是那些表里阴阳导致的胃气和津液的失常。但这个过程就要准确的把\n握住津，营，血，水之间的关系。难就难在现在把握不住这个。\n答：水盛津亏，津滞成水，水盛气寒，气滞水停，津虚血燥，血虚津少。\n今晚我们来学习太阴中风的水血同病的第二个层面\n第二个层面：偏外的层面者为中风血痹或风水黄汗；\n里虚寒引起的水血同病偏里的层面是水盛血亏或血亏水盛，我们已经讲解。\n接下来我们讲解里虚寒引起的水血同病偏外的层面，偏外的层面有三个类型，一\n个是中风，一个是血痹，另一个是风水黄汗，它们都属于广义的太阴中风的范畴。\n太阴中风,由于六病都有中风病的问题的，虽然是六病三阴三阳分别代表了\n人体表里位置，但是经方又不是这么的机械的，难道说有了里病就不可以再引起\n表病吗？完全是可以的。人体是一个有机的综合体，比如说纯粹的太阴病本证是\n里病，是里虚寒的，但是他还有太阴中风证，因为本来一个里虚寒的病人，里面\n底子薄弱，津虚液少血弱那就更容易感受外邪了，正气存内邪不可干，内里薄弱\n津虚液少血弱就更容易感邪。感受了外邪，有了表证怎么办，还去治里肯定不对\n了，要治表。那么这种情况的病机是什么？怎么对治呢？我们来看看仲景是按照\n什么病机规律治疗的：\n太阴中风的第一个层次邪风虚热：\n太阴中风，首先是有邪风入中的，风邪入中，津液就会在表聚集，导致一个\n相对的“卫强”状态，所以会发热。因为是太阴的中风，所以会有虚寒而津虚液\n少，故而这个热也是轻微的虚弱的短暂的。所谓的“风则生微热，虚则两胫挛”，\n因为风邪束表卫津抗邪汗出而导致轻微的热象，又因为津亏液少而导致肢体濡养\n不足而挛急烦疼。\n这个层次的治疗方案是桂枝汤：\n274、太阴中风，四肢烦疼，脉阳微阴涩而长者，为欲愈。\n276、太阴病，脉浮者，可发汗，宜桂枝汤。\n这两条综合起来看就明白了，太阴中风的第一个层次——邪风虚热，脉虽然\n浮，但是“阳微阴涩”，就是浮而微弱，也就是是说卫津虽然聚表但是只是一个\n相对的“卫强”状态，阴涩，沉取涩滞不足，津虚液少血弱的表现，症状就是“四\n肢烦疼”，当然也会可以有微微发热，恶风汗出，鼻鸣干呕这些桂枝汤的表证存\n在的，所以治疗上就是“可发汗”，用桂枝汤去补津液养津血救邪风发邪汗。\n“脉阳微阴涩而长者，为欲愈”，阳微阴涩都是不足之脉，津虚液少抗邪无\n力，要是此类患者出现长脉的现象，就说明病要好了，身体要恢复了。怎么讲呢？\n《素问•脉要精微论篇第十七》：“夫脉者，血之府也，长则气治，短则气病。”脉\n就是津血的管道和容器，短涩微弱的时候说明人体的气（阳气、荣气）病，长实\n有力的时候说明人体的阳气（卫）、荣气（营）恢复，营卫复常了，太阴中风自\n然就会好了。\n与太阴中风相关的桂枝汤证条文还有两处：\n387、吐利止而身痛不休者，当消息和解其外，宜桂枝汤小和之。\n产后风，续之数十日不解，头微痛，恶寒，时时有热，心下闷，干呕汗出，\n虽久，阳旦证续在耳，可与阳旦汤。（即桂枝汤，方见下利中）《金匮。妇人产后\n病脉证治第二十一》\n这两条都存在津虚液少血弱而中风的病机，符合太阴中风的法则。\n\n太阴中风在第一个层次津液耗伤发展到一定的程度后，抗邪更为无力，这个\n虚热就会逐渐减弱甚至消失，卫津温煦不足的症状就会逐渐明显，这就进入了太\n阴中风的第二个层面水饮血痹。\n太阴中风的第二个层次水饮血痹：\n太阴中风病是虚寒而津虚液少，卫津温煦不足了。有虚寒，加之津液不化就\n会产生水饮。又因为虚寒，津液就会流通不利，热则流通，寒则凝涩，人体的津\n血都是得热则行，得寒则凝的，津液原本不足，不足而又流通不利，就像河流一\n样，水流大的时候流的非常畅通（津液），水流变小变浅的时候，就会形成水洼\n停滞（水饮）。所以太阴病会有那么多的水饮证，就是因为津液不足而流通不利\n了。流通起来是津液，不流通就变成水饮了。\n问曰：血痹病从何得之？师曰：夫尊荣人，骨弱肌肤盛，重因疲劳汗出，卧\n不时动摇，加被微风，遂得之。但以脉自微涩，在寸口、关上小紧，宜针引阳气，\n令脉和，紧去则愈。\n血痹，阴阳俱微，寸口关上微，尺中小紧，外证身体不仁，如风痹状，\n黄芪桂枝五物汤主之。\n黄芪桂枝五物汤方\n黄芪三两 芍药三两 桂枝三两 生姜六两 大枣十二枚\n右五味，以水六升，煮取二升，温服七合，日三服。《金匮。血痹虚劳\n病脉证并治第六》\n释：血痹这个病是怎么发生的呢？就是平时养尊处优的人，活动的少，身体\n肥胖而运动能力差，稍微有些疲劳就会汗出淋漓。“卧不时动摇”这句话应该这\n样断句：“卧，不时动摇”，就是说平时老是喜欢躺着，也不时时的起来活动活动。\n动，《说文》：作也。作者，起也。\n摇，《说文》：动也。\n《尔雅》：作也。\n所以，这个“不时动摇”就是不经常起来动作活动的意思。\n“加被微风，遂得之。”那么这种情况，感触到常人引不起病变的微风也会\n入中而得中风病的重症——血痹的。注意这个“加被微风”，也就是中风后因为\n患者的体质差而得了血痹，比单纯的太阴中风的第一个层面——邪风虚热要重，\n但是血痹这个第二个层面同时也涵盖了第一个层面的病机和症状的。\n而血痹病本身也是分层次的，在血痹的第一个层次，是水血同病而以邪风水\n病为主的，“肌肤胜”就是肥胖的意思，肥胖人多水湿痰饮，故而仲圣在此点出。\n“但以脉自微涩，在寸口关上小紧，宜针引阳气，令脉和，紧去则愈。”\n大家来看，“脉自微涩”，这和《伤寒论》274 条那个“太阴中风……脉阳微\n阴涩”说的是一样的，这也说明血痹病就属于太阴中风的范畴，但是血痹病比桂\n枝汤证太阴中风程度要重，所以脉象除了微涩还会有自己的特点，那就是\n“在寸口关上小紧”，寸口关上，是主表和上焦的位置，这个位置小紧，小\n主津血不足，紧，就很有讲究了，仲圣书有个规律，凡是中风而见紧脉的，都是\n有水饮在表的，如大青龙汤证条有“太阳中风脉浮紧”，这也是个聚讼千年的疑\n案，很多前人说中风怎么可能脉浮紧？一定是错简，应该中风脉浮缓才是。其实\n只要是中风病而以水饮为急为苦时，脉象往往是紧的。中风津液不足所以脉势缓，\n但是因为水津凝滞在表脉反而紧张起来了。太阴的中风水饮血痹，有不足的病机，\n所以脉是微涩小紧。\n“宜针引阳气，令脉和，紧去则愈”。这种情况，可以用针去宣通阳气，疏\n\n导水津，发散外邪，脉象平和不紧了，邪也就解了。因为是太阴的中风范畴，病\n位是人体的肢体肌腠表位，在汉代以前，这个病位是“在肌肤，针石之所及也”（《扁\n鹊见蔡桓公》）的疗法为主的。\n如果用经方对治的话我们可以选用桂枝加黄芪汤，黄芪可以发表祛饮，太阴\n病的黄芪相当于太阳病的麻黄，都是解表散饮涌散的药，黄芪用于虚证，麻黄用\n于实证。桂枝加黄芪汤辛甘发散的性味都具备了，所以可治太阴中风的水饮水肿，\n桂枝汤解表，黄芪升阳气。正如《辅行诀脏腑用药法要》陶云：“阳旦者,升阳之\n方,以黄芪为主。”一个“针引阳气”，一个药引阳气，方法不同，功效一致。\n“血痹，阴阳俱微，寸口关上微，尺中小紧，外证身体不仁，如风痹状，黄\n芪桂枝五物汤主之。”\n这是血痹的第二个层次，是水血同病而以邪风血病为主的。这种情况脉象是\n浮取沉取都是微弱不足的，上一个层次邪风水病为主的时候脉是“寸口关上小紧”，\n偏于表和上焦的肌腠的问题为主。而这个层面脉象已经变化成“寸口关上微，尺\n中小紧”，寸口关上不紧，尺中进了，这说明病位又深入了一步，这才是典型的\n血痹病。血痹外证身不仁，如风痹状。不仁，就是身体麻木不调和，肢体麻木不\n调和，不听使唤了。\n仁，《康熙字典》引方书解释为“手足痿 爲不仁”。\n在汉代，惯用“不仁”来形容人的肢体麻木不用、不灵便，如东汉外交西域\n的名将，一人为我们的《成语词典》留下“投笔从戎”“不入虎穴，焉得虎子”\n两大成语名句的班超，在老年的时候思念汉土，他的妹妹，一代才女班昭，就在\n写给汉和帝的奏章中说：“兄年七十，两手不仁。”说班超年老体衰身病，两只手\n都不听使唤了，过去是有“欺君之罪”这样的罪名的，所以这都不是瞎说的，都\n得说的有根有据。后来汉和帝恩准了，班超在回朝后的一个月后因为胸胁之疾去\n世，胸胁之疾正好可以影响上肢，所以班昭说的“两手不仁”是非常合乎病理的。\n《诸病源候论》：“痹者，风寒湿三气杂至，合而成痹。其状∶肌肉顽厚，或\n疼痛。由人体虚，腠理开，故受风邪也。病在阳曰风，在阴曰痹;阴阳俱病，曰\n风痹。”\n《千金方》：\n风痹病不可已者，足如履冰，时如入汤，腹中股胫淫泺，烦心头痛。伤脾肾\n时呕眩，时自汗出。伤心目眩。伤肝悲恐，短气不乐。伤肺不出三年死。\n风痹病不可已者，足如履冰，时如入汤，腹中股胫淫泺，烦心头痛。伤脾肾\n时呕眩，时自汗出。伤心目眩。伤肝悲恐，短气不乐。伤肺不出三年死。\n风痹的主要症状就是肢体疼痛肌肤顽痹不用，甚则肢节冰冷或时灼热，腹股\n沟、股部、胫部汗出淋漓，时时自汗出，或伴心烦头痛，或伴眩晕呕吐，或情绪\n不定，重则危及生命。\n可以看出，风痹涵盖了西方医学的风湿性关节炎、类风湿性关节炎、退行性\n关节炎、强直性脊柱炎以及多种颈肩腰椎病及骨质增生、股骨头坏死、多种结缔\n组织病系统性红斑狼疮、硬皮病、皮肌炎等，这些疾病，是疼痛而不用。而血痹\n是“外证身不仁，如风痹状”，但是风痹是疼痛而不用，血痹是麻木而不用。\n黄芪桂枝五物汤，是桂枝加黄芪汤去甘草加重生姜到六两而成，到了黄芪桂\n枝五物汤这个层次是水血同病而以邪风血病为主的，但是同样也会包含上一个层\n次的水饮，并且在邪风虚热水饮血痹的步步紧入中，在太阴表的层次中导致了病\n位更里病性更寒病态更虚。\n注意，此处的“里”、“寒”指的是相对于太阴中风的第一个层次桂枝汤证和\n\n第二个层次中的水血同病以水为主的桂枝加黄芪汤证而言。同样，此处的“虚”，\n虚的也是表上的卫气。因为这个相对于上两证型病势更偏于的“里”、“寒”、“虚”，\n那么治疗方剂方向就要相对于桂枝汤和桂枝加黄芪汤更偏“外”偏“温”偏“补”\n才行。并且血痹证，的确需要让进入到人体的邪气更好更快的出表。经方治则，\n处处遵守让阴病转阳和里邪出表的法度。所以就去掉甘缓的甘草，它要升达阳气\n引导邪气外出才行，当然就要加重辛药的比例了，那么就加重了生姜，既可以解\n表散饮又可以逐风出汗，还有一个很大的妙处就是它可以入血分，入血分去“出\n汗，逐风，（除）湿痹”\n（《神农本草经》：味辛温。主胸满咳逆上气，温中止血，出汗，逐风，湿痹，\n肠澼，下利。生者尤良，久服去臭气，通神明。）\n妇人经带胎产过程中血气不和而引起的风寒湿燥火诸外邪疾患，仲圣的处方\n中都有生姜，\n比如风邪为主者：产后风，续之数十日不解，头微痛，恶寒，时时有热，心\n下闷，干呕汗出，虽久，阳旦证续在耳，可与阳旦汤。（《金匮。妇人产后病脉证\n治第二十一》）；\n寒邪为主者：产后腹中疼痛，当归生姜羊肉汤主之；并治腹中寒疝虚劳不足。\n当归生姜羊肉汤方。（《金匮。妇人产后病脉证治第二十一》）；\n湿邪为主者：妊娠呕吐不止，干姜人参半夏丸主之。\n干姜 人参（各一两） 半夏（二两）\n上三味，末之，以生姜汁糊为丸，如梧子大，饮服十丸，日三服。（《金匮要\n略。妇人妊\n娠病脉证并治第二十》）；\n燥邪为主者：治妇人产后虚羸不足，腹中刺痛不止，吸吸少气，或苦少腹中\n急，摩病引腰者，不能食饮。产后一月日，得服四五剂为善，令人强壮宜。《千\n金》内补当归建中汤（《金匮。妇人产后病脉证治第二十一》）；\n火邪为主者：产后，中风发热，面正赤，喘而头痛，竹叶汤主之。（《金匮。\n妇人产后病脉证治第二十一》）。\n答疑：\n1、“消息和解其外”消息是何解？审时度势，就是让患者吃着药及时反馈观\n察病情走向。\n2、甘草粉蜜汤中之粉是米粉吗？是高粱米粉，原书就是粱米粉，后世的抄\n本漏了，我也用过大米粉，疗效也不错。\n3、邹曼华，女。46 岁。面部多发性丘疹，色红，硬，痒，尤以嘴巴周围为\n甚，病人面色偏黄，感觉烦躁，黑眼圈明显，平时口不干，不苦，但是有喝水多\n的习惯，口中粘滞，晨起痰多，喉咙痒，长期干咳无痰。（白天咳，晚上不咳，\n站立就感觉喉咙痒，躺下就不痒）平时不出汗，饮食一般，偶尔胸窝有点不舒服，\n睡眠一般，偶尔梦多，月经量少，提前 7——10 天，无血块，大便成形，一天一\n次，小便可，胫肿，冬天腰怕冷，喜热饮，白带稀，无气味，舌质淡红，中有裂\n纹，边有齿痕，苔薄，偏黄，舌尖红，脉沉迟，\n这个以表上阳明热实证为主，而兼有太阴水饮和伤血，桂枝茯苓丸\n白天咳，晚上不咳，站立就感觉喉咙痒，躺下就不痒。。。这个不懂，咽炎好\n多年了？水饮的变化多端而已！水饮是阴邪，会随着阳气的升发而动作的，所以\n会有各种表现。面部多发性丘疹，色红，硬，痒，尤以嘴巴周围为甚黑眼圈明显\n——这都是淤滞。热而淤，所以是阳明证为主，这样就好理解了。津和血最怕两\n\n个东西，寒和热，寒则冰伏，冰伏则成寒淤，热则耗伤，耗伤而成干血。大黄蛰\n虫丸的内有干血就是热灼伤的，所以用那么多清润的药。\n老师，我还有个问题。是不是从痘的红，白可以去分析淤滞的寒和热？\n答：红的热盛，白的也不一定没有热，要看有无伴随的阳明证\n4、女，49\n唇部发干，起皮两月余。\n唇部不红，必须涂唇膏或者口红或者药物，下唇有一团团色素沉着。嘴唇偶\n尔有灼热感。一吃上火的东西唇部更不适，偶尔有溃疡。口干，喝水较多。人疲\n倦，发困，想睡觉。颈椎、肩部不舒服。常有昏沉感。睡眠多梦，像看电影一样。\n睡眠不好第二天眼睛痛。天亮前容易潮热汗出，白天也觉得热。汗出不多，皮肤\n触之微冷，手心摸着较热，自己 热，平常汗正常，活动出汗；无口干口苦，不渴，喝水\n不多，爱喝热水；有头晕偏头疼。无关节透风发凉，无心慌胸闷，大便干燥，一\n天一次，小便黄发红；睡眠可但多梦，吃饭正常。长时间蹲下后再站起会腰疼。\n以前有右手到肘关节发麻，现在没有。前几天左手到肘关节起红点，现已消失。\n小腹不凉，有时胀气。心情烦躁。下肢按不肿有轻微肌肤甲错。月经提前 4 天，\n色可无块，白带以前发黄，吃中药调理后现发白，无异味。经期有点肚子疼，年\n轻时会很疼，婚后稍好些。脉沉取寸关脉数有力，尺非常细（轻按脉感觉不到）。\n舌水滑苔白稍显黄，师曰:当归建中汤更合适.\n经期提前,小腹痛,从胯到脚冰凉,多梦都是伤到了营.\n33、徐学广 男 47 2013 年 11 月 3 号\n头顶绷紧 3-4 年\n刻诊：患者头顶绷紧有 3--4 年，好似有个东西紧箍着，受冷风吹空调症状\n加重头更晕沉，平素无寒热，手脚不凉，汗可，无身痛，无口干口苦饮温水，食\n欲可，无胸闷心慌，胃吃辣吃冷会痛，会拉稀，小腹吹冷风会胀，大便 1--2 天/\n次干，小便少饮淡黄，多饮清，身无肿无甲错，无失眠，无心烦，梦少，淡红舌\n尖红，胖，中有裂痕，薄白苔，脉浮缓许师曰:桂枝汤\n34、陈子轩，4，咳嗽\n咳嗽一个星期，咳嗽有痰声，平时无鼻涕，但说话声音发翁，打涕时，鼻涕\n浊中带黄，面色青白，因咳嗽睡眠不好有黑眼圈，手温，不喜喝水，家长会强制\n他喝，平时吃饭吃的少，吃菜吃的 多，咳嗽没影响食欲，小便发黄，大便成形，\n不干，盗汗，舌略红有红点，苔薄白少苔，脉沉。\n我开了小青龙加石膏。怎么样？温度正常，我问他怕风不，回答不知若然。\n许师曰：小儿病收集资料要全，因为可采用的资料比较少，所以望诊多作些。\n登被否，睡眠情况，睡眠是安静还是登被，肢体额头冷热程度。面色，眼睑\n等。\n本案有面色青白还不错。出汗，汗后，大人触摸上去手感是凉还是热。单一\n个出汗，没法看。比如说晚上出汗，出汗的部位，出汗多少，只是背部出汗，或\n头部出汗还是全身出汗。汗后怕风怕冷或一些不舒服的感觉。盗汗伴有咳嗽肯定\n是一个中风的问题，再看是那个病位体系。咳嗽有痰，有鼻涕这是个太阴的问题。\n太阴也只是个轻微的水饮的问题，还没有里的问题，因为尿和大便正常。手是温\n的，大便成形，小便黄，出汗，汗后凉热就很重要了。出汗是中风，要解表，再\n加上水饮的药。手足温，身上温，要是汗后不凉，可能是阳明的问题，会用到阳\n明方子。但现在缺一环，无法定方的。\n35、女，30，咽喉不适来诊。\n销售人员，说话较多，平时说话声音嘶哑，最近一周感冒咽喉不适加重，咽\n喉发干偶尔发痛，无恶风，流鼻涕清涕，手温，手心易出汗，口干欲饮饮热水，\n冬天四肢怕冷，无头晕头痛，无胸闷心悸，平时无胃痛反酸，但前几天胃痛打嗝，\n现无症状。无腹胀，背心凉，腰不痛，纳佳，大便 3-7 天一次，成形较软，小便\n\n淡黄，夜尿 3 次，平时喝水就易上厕所，有憋不住尿的现象，皮肤发干，下肢微\n肿按之有坑，有甲错，月经量少 3 天有血块痛经，一般痛经 3-4 小时干痛，刷牙\n出血，舌淡红苔薄白后微黄有齿痕，味蕾处是凹陷，脉偏细，脉弱，平时容易感\n冒。我想是虚寒伤及营血，用当归生姜羊肉汤如何？许师曰：半量温经汤。\n36、患者蒋桂平女 50 岁，因胃口胀满来就诊。\n刻诊：病人面色可体态稍胖，平时头痛头晕无耳鸣，口微苦，无口干口渴，\n饮水正常饮温水，纳可，食后胃口胀满，左侧肋下胀满感按压打嗝后会减轻，不\n敢多吃，无恶心呕吐反酸烧心，无胃痛腹痛，无肠鸣，大便一天一次成型(以前\n经常便秘)，小便可起夜一次，平时怕冷，手不凉足凉，晨起有汗出，汗后不怕\n风冷，右手拘紧发胀，伸缩不利，无心悸胸闷，月经已经停经，无白带，眠可，\n下肢无水肿甲错，舌淡苔白滑有齿痕，左手脉沉弦弱，右手脉弦无力。\n许师曰：厚朴生姜半夏甘草人参汤。\n病人有留气气结，导致胃不能消化食物，津液不能上承。胃不能正常消化食\n物就会导致胃胀，而津液不能上承则会口微苦。平时怕冷，手不凉足凉，晨起有\n汗出，汗后不怕风冷，说明不是典型的阴证，不宜过多的用温的方法，把气解了\n就好了。气的问题影响到津液在表的输布温煦。右手拘紧发胀，伸缩不利，留气\n的存在导致手足的拘挛在于气上，也就是气不能让津液很好的在表上去防御濡养。\n必伏其所主，先其所因要抓病机不要看现象。。\n37、黄秀珍，女 52 右坐骨神经痛\n右侧坐骨神经痛兼右侧腰腿足发凉发木有坐骨神经牵扯样疼痛一个月来诊。\n怕冷，风吹后流眼泪，手温，右脚凉发木，平时不易汗出，面色萎黄略有光泽，\n略瘦。眼干眼花，无口干口苦，无头晕头痛，冬天背心凉，有胸闷心悸，纳佳，\n无胃胀反酸，无恶心呕吐，无饭后胃胀，无饭后排便，无腹痛腹胀，说话久了会\n觉得气不够用，大便成型初硬后软，小便淡黄无不利，无夜尿，手睡久了会发麻，\n右下肢有水肿，按有坑，略甲错。舌淡，有齿痕，唇舌有瘀斑。脉粗细正常，较\n弱。月经以前量多，得病时来月经量少，断断续续吃过桂枝加黄芪汤，当归四逆\n汤后这个月经量可。我的疑问是该补还是该发散还是该温通活血？用什么方？这\n个病人营血该是足的，否则手也会 凉？又这个人处于绝经期，是不是不应该补\n血了？许师曰：典型的仓公当归汤证。既有少阴伤营又有溢饮在表，有溢饮表饮\n的问题，肯定要发散，有伤营肯定要养营怕冷，腿脚凉发木，少阴证很明显。既\n要温养养营又要去发散。要选个恰如其份的方子。补血不是看是否在经期，而是\n看是否有血不足的病机。此案有血不足的病机，又有溢饮在表，所以既要养营，\n又要发散，温药，所以仓公当归汤最合适。\n38、请教老师一个案。之前问过的胸闷病人。吃了枳实薤白桂枝汤 2 付，不\n巧适逢经期，没有停药，导致出血 6 天量大，下血块很多，后来服了胶艾汤经血\n已停。但开始腹痛。腹痛持续四五日。日 渐加重，白天痛的厉害，夜里不明显。\n服过当归芍药散散剂和小建中，当归生姜羊肉汤 均无明显效果。其他症状：饮\n食稍差。睡眠还可以。偶尔发热醒来能接着睡。无汗。比较怕冷，手脚均 冷，\n尤其是右手。用了当归生姜羊肉汤半付之后怕冷减轻。大便基本一天一次，不太\n成形。白带呈略带点咖啡色的水样白带。小便在用了当归生姜羊肉汤之后有点涩\n痛，下阴不适发痒，微有 疼痛。口略干不渴。今天腹痛比前几天加重，有点放\n\n射到骶骨。右腰也疼。腹痛基本是整天持续，以下腹部为主偏右侧。现在想用当\n归建中汤。许师曰：真武汤。有实质性的病变，排病的过程也非常不舒服。芎归\n胶艾汤中的生地川芎芍药也能治血痹。博士的应对是和体的。本案是水血同病，\n单治血不治水怎么行。病机是水血同病，虚寒体质要加附子剂。\n39、英，78，女主诉：反复感冒，下肢颤抖 1 月\n晨起出汗多，汗后恶风，平时怕热，头痛头晕，腰痛，下肢无力，时有颤抖，\n大便三天一次偏干，小便黄，夜尿 2 次，纳差，食后胃胀，无肠鸣，饮水胃胀明\n显，喜温饮，心慌胸闷，口干口苦，耳鸣，眠可，四肢温无麻木，下肢轻度水肿，\n无甲错，舌淡苔白，脉浮弦。许师曰:黄芪建中汤。\n邪风虚热水饮血痹加黄汗，这个汗可以看成黄汗，因为是虚寒性质的。还有\n津亏胃虚。柴胡桂枝汤有表证。整体症状偏阳，偏于滞气滞饮。而本案整体症状\n偏阴，有汗，汗出怕风，病在三阴。下肢无力擅抖食欲不好，纳差，太阴之为病，\n腹满而吐，食不下。纳差，食后腹胀，饮水后腹胀，胃虚不化。舌淡苔白是不同\n于苔黄厚腻的。下肢无力擅抖其实就是津血虚不能濡养，和血痹的病机是一样的。\n汗出多后恶风是和黄汗的病机是一样的。黄芪建中汤是桂枝加黄芪汤打底的，\n胃虚和大便干燥是津亏液少，所以用黄芪建中汤更合适，用饴糖补津液，温润润\n肠滋精，还能治口干口苦。\n40、鲍金强 男 33 岁 131105\n以性功能减退来诊，最近一段时间性欲减退，性功能低下，挺而不坚。平素\n怕热，特别是晚上烦热但是清晨则怕冷，睡觉需要盖好被子，夜里有汗白天无汗，\n手足多汗，手热脚凉。无头痛头 晕，无耳鸣眼花，口干不渴不苦，偶有心烦，\n无胸闷气短心悸，无胃胀烧心泛酸，纳呆，无腹胀肠鸣，大便成型日一次。小便\n黄不起夜，偶有不利。喝酒后眼睑浮肿平时没有，腿按稍肿，感 觉身沉重无力，\n眠可，面色有点晦暗，无阴囊潮湿小腹冷等，偶有干哕甚至吐出点清水，舌质暗\n淡薄白苔无齿痕，脉沉细。许师曰:当归四逆加吴茱萸生姜汤,吴茱萸用二两。\n厥阴病，寒热杂错，不通 ，平时怕热但晨起冷。虚寒伤及胃，呕吐酸水，\n腿也肿了，都是虚寒。面色晦暗，脉沉细，性功能问题都是伤营的表现。宋版上\n吴茱萸是二升,一般人吃上呕吐比较重。但近来我考证,在唐朝以前，包括在《金\n匮玉函经》，吴茱萸都是二两。二升是值得商榷的，临床上稍微超过六十克，病\n人就会烧心反酸躁热呕 吐。超过二升就一百四五十克了，就不象经方的剂量了。\n二两还是比较契合。所以我们以后当归四逆加吴茱萸生姜汤，吴茱萸用二两。\n41、 男 40 岁 131104\n以高血压来诊，早晨吃了一片降压药，10 点多测血压 180/120，最近吃降压\n药效果不好。高血压四五年，平素怕热，手足温，易出汗，汗后不怕凉，无头晕\n头痛，无耳鸣眼花，无口干口渴口苦，无胸闷气短心悸，无心烦，无胃胀泛酸偶\n有烧心，无腹胀肠鸣，大便日一次成型，小 便清无不利，膝关节稍痛，无身沉\n重，眠可，纳可，面色可，体格胖大，腰酸背痛，腿按肿稍有甲错。舌质暗淡薄\n白腻苔稍胖大无齿痕。右脉缓弱，左脉稍弦紧。师曰：五苓散。水热兼表。怕热，\n易出汗，水肿，肌肤甲错，都是水热。\n42、 男 49 岁 131102\n\n以烧心来诊，烧心多年久治不愈，平素怕冷，足心热，晚上烦热清晨怕冷，\n汗少，睡眠不足时头痛，无头晕，偶有耳鸣眼花，口干口渴喜冷饮，偶有口苦，\n时胸闷气短偶有心悸，饭后胃胀，烧心严重，吃面食明显，喝西乌旗（赤峰市北\n部的一个旗县）的水明显（大概水质的原因），泛酸，无腹胀肠鸣，大便干燥如\n羊屎，小便稍黄稍有不利，身酸痛乏力，手胀，腿按不肿，眠差，纳可，面色可，\n舌质淡红，薄白黄腻苔无齿痕。脉缓弱。许师曰：分步治疗。\n先用柴胡桂枝干姜汤，和其营卫，通其津液，畅其大便，待营卫得合，津液\n下行，大便正常后会用到栀子豉汤合一个泻心类方。\n这关系到怎么样人为地把病机转化过来，这是经方一个很高深的法则。症状\n明显的是泻心类方，但大便硬结。你用泻心类方是不会取效的。待津液下行，大\n便润畅后再用泻心类方才会取效。用柴胡桂枝干姜汤，对烧心作用不大，但是会\n改善大便和小便发黄不利以及胸闷心慌气短等症状。改善手胀等。饭后胃胀，很\n多小建中汤的病人食后会舒服些，而此人食后发胀，证明存在一些滞的问题。结\n滞一般就不是建中汤证。手胀，无水虚胀为气，他的腿不肿，就说明是个气分的\n问题。\n舌是黄腻苔，证明有积滞，一般建中汤苔不会太厚腻，更不会黄腻，建中汤\n病人一般会舌淡红苔薄白，微润。\n43、 男 70 20130925\n中风 15 天来诊（脑梗塞）患者中风住院 15 天，稍有好转，要求中药继续治\n疗，既往无高血压糖尿病。刻诊：左侧肢体弛缓，发麻稍有疼痛，以上肢明显，\n能吃力举过头，伸舌偏左，无神，语音不利低弱，面黄乏力，无明显怕冷，头晕，\n汗出可，无心慌胸闷，胃腹无症状，口稍干口苦，纳少 ，大便 3--4 天/次、软，\n排便困难，小便淡黄，夜尿 3--4 次，无肿无甲错，舌红苔腻有齿痕、润，脉微\n浮缓，稍迟。用了千金小续命汤一月。治疗过程中出现夜有汗出，上肢疼痛加重、\n发热（右手温，但左手明显比右手热，自己也觉发热）、手背水肿、指粗，加了\n黄芪 30 细辛 30（后面的五付）因效果不理想停药。今日又诊（20131105）面黄，\n乏力，语音不利，上肢疼痛加重、夜有抽痛、发热、手背水肿、指粗，无寒热，\n汗可，食欲可，无头晕，胸腹无症状，口不干不苦，喝水不多，口水多，大便\n3- -4 天/次，软，大便不困难，小便黄，夜尿 3---4 次，舌红、纵向两行腻苔，水\n滑。脉弦稍滑。上肢疼痛加重、夜有抽痛、发热、手背水肿、指粗（仅仅是左侧\n出现）许师曰：续命煮散。\n水证比较明显。水不去，津液不生。用千斤小续命就是没有照顾到水的问题。\n乏力，肢体迟缓，瘫痪是表上的阴证，少阴。而阳证是手足躁扰，亢奋。\n44、男，26 岁，以左侧面肌痉挛来诊。患者怕冷手脚心出汗，平时脚怕凉，\n耳鸣，鼻子不通气，早起有痰，喜热饮食，食欲不好，喝热水较多，小便可，，\n夜晚入睡难，白天困倦，夏天尤甚，体力可，记忆力差。大便一天两次，量少偏\n稀，无下肢水肿甲错，面白，舌尖红苔薄白水润。右脉寸短促关浮紧尺弦细；左\n脉寸弦涩关弦紧尺弦。许师曰：真武汤。面肌痉挛是由于水饮向上冲逆加表不解。\n医案第三课\n许某，男，四岁。\n初诊日期：2013 年 9 月 25 日。","hasDose":false},{"caseId":"P0048","caseSource":"临床医案解伤寒一期","caseType":"讲义医案","归集方":"芍药四物解肌汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：感冒发烧二天，服退烧西药烧退后数小时即复发烧，输液一次未效。","symptom":"主诉：感冒发烧二天，服退烧西药烧退后数小时即复发烧，输液一次未效。","history":"","exam":"刻诊：体温 39.0℃，咽痛，扁桃体肥大增生，色红，有多处点状小凹陷。口","analysis":"","prescription":"处方：芍药四物解肌汤","effect":"","comment":"","caseExcerpt":"主诉：感冒发烧二天，服退烧西药烧退后数小时即复发烧，输液一次未效。\n刻诊：体温 39.0℃，咽痛，扁桃体肥大增生，色红，有多处点状小凹陷。口\n干，饮水亦咽痛，故亦不喜饮，不欲食。发热，恶寒，身着棉袄，无腹痛腹胀，\n大便两日未行，小便可，色黄。用西药退烧时身微汗，无胸闷心慌，家人诉昨夜\n发烧，夜眠后忽自行起床行走似梦游，家人呼之不应，后又自睡。月经周期可，\n经期五到八天，色红量多有块，带可，无腹痛腹胀，无小腹凉，下肢无按肿甲错，\n面色可。脉数微浮，舌红苔黄白厚腻。\n六病辨证：太阳阳明合病\n处方：芍药四物解肌汤\n葛根 20 黄芩 20 升麻 20 生白芍 20\n一剂\n当天服药两次即退烧。翌日已可正常上学。\n家人诉因为自幼即有扁桃体肥大发炎病史，每次感冒咽痛后一般高烧退后低\n烧也要持续一周左右始退，即使输液服消炎药也是一周退烧，不治疗一周也可以\n自退。但是这次服用中药不但退烧快，还在烧退后咽喉即已随之不痛，是以超乎\n\n想象的。后来患者的家长遇到我几次都问这样好的方子是不是可以去申请专利。\n按语：\n1、 辨证思路：\n患者发热恶寒脉微浮，邪在太阳表位不彻，而阳明里热已炽，故见口干咽喉\n红肿溃疡疼痛，便迟溲黄，甚至神昧梦游，脉数、舌红苔黄白厚腻也显示了里热\n的炽盛，月经色红量多有块也与患者素体蕴热有关。由于里热燔灼胃中干津液少\n所以患者不欲饮食。\n2、 施治法则：\n阳明里热炽盛而太阳表邪不彻，这种情况，要在清解里热的同时注意解表。\n由于患者里热渐实津亏液燥已经显露，加之溃疡属于“疮家”不可以发汗，所以\n一般不再适宜选择辛温的麻黄桂枝类解表药，而要选择辛凉或性平的葛根、升麻\n类去微透表邪而能清解里热，即所谓的双解表里。所以选择了双解表里、清热散\n结、清利湿热、解肌化斑的芍药四物解肌汤。\n3、 引申思考：\n暨芍药四物解肌汤考释：\n1、来源考释：\n芍药四物解肌汤最早见于孙思邈的《千金要方。卷第五。少小婴孺方。伤寒\n第五》，《千金方》是经方的仓库，里面搜集了很多经方的好方子，但是药王老人\n家有个缺点，就是他一般不注明方子的出处来源，而王焘就在这点上做得很好，\n他的《外台秘要》方子大都有原出处。当然王焘也有王焘的缺点，那就是有的时\n候随意改动剂量。\n《千金要方。卷第五。少小婴孺方。伤寒第五》\n治少小伤寒，芍药四物解肌汤方：\n芍药 黄芩 升麻 葛根各半两\n上四味，?咀，以水三升，煮取九合，去滓，分服（笔者按：或作分五服，\n《外台秘要》分四服）。期岁以上分三服。\n释：这张治小儿伤寒的方子言辞简略，需要我们纵观药王全篇立意以及以药\n测证去解读。\n期岁，期，在这里读 ji，古也作朞（ji），期岁就是一年的意思，也就是一周\n岁。唐高宗《定明堂规制诏》：“一朞有四时。……一朞十有二月”（《全唐文》卷\n一三）。\n就是说一岁以内的分四次或五次服用，一周岁以上的就可以分三次服用了。\n这也指导了我们临床中小儿的服药频率。\n药王在此篇前论曰：夫小儿未能冒涉霜雪，乃不病伤寒也，大人解脱之久，\n伤于寒冷，则不论耳。然天行非节之气，其亦得之，有时行疾疫之年，小儿出腹，\n但患斑者也，治其时行节度，故如大人法，但用药，分剂少异，药小冷耳。\n这段话的意思是说：小儿在父母的精心呵护下，是触冒不了风寒霜雪，所以\n一般得不了伤寒病。当然要是大人长时间的照顾不周，感触寒冷，那又另当别论\n了。\n从这段话可以透漏出另一层信息是，最迟在晋唐代，伤寒就作为外感病的代\n名词了，用这种眼量去读伤寒论，当然是读不到真正的精义的！要知道仲圣伤寒\n是为百病而立，而非为外感一病而立。所以说，仲圣心法，一经问世，即已散轶。\n故而孙思邈在《大医精诚》第一句话就说：“张湛曰：夫经方之难精，由来\n尚已！”张湛是东晋人，博学之通儒，撰有《养生要集》、《列子注》、《冲虚至德\n\n真经注》等，并且在在医学方面极有造诣。陶弘景的《养性延命录》也是参考了\n张湛《养生要集》，其卷上《教诫篇第一》就引张湛养生著作，将养生法则归纳\n为十大要。孙思邈《千金翼方卷十二养性禁忌》开篇也引述了张湛养生十要的内\n容。\n接着解《少小婴孺方。伤寒》的前论：但是天行不正之时气，如春应温而寒，\n冬应寒而暖等，那都会导致小儿伤寒的发生。甚至更有天行疫气，尤其会导致婴\n幼儿发斑疫疠。这些病的治法，和大人一个法则，只是用药的剂量少一些（小儿\n形气未充脏腑柔弱），用药的气味偏寒凉一点（小儿纯阳之体火<心>常有余）。\n2、法度考释：\n“如大人法，分剂少异，药小冷耳”，这是药王治小儿伤寒的法度，同样也\n贯穿在芍药四物解肌汤中。所以这首方子的四味药，都是偏于寒凉或者平性的，\n解表用葛根，清热用黄芩，化斑用升麻，养津用芍药。同时升麻亦可解表清热；\n葛根亦可清热生津，芍药亦可化斑清热。\n故可以用于表有外邪里有实热者；\n又则黄芩可以燥湿，芍药可以利水，所以又可以用于表有邪而里有湿热者。\n3、方药考释：\n此方葛根升麻都可以双解表里，而辛凉解表尤需倚重葛根。葛根既可以解表\n（如葛根汤），又可以清热解毒（如芍药四物解肌汤），还可以清解湿热（如葛根\n芩连汤）；\n升麻之用，在经方更重视其解毒辟邪之功效，《本经》明言其：“解百毒，杀\n百老物殃鬼，辟温疾，障，邪毒蛊”，可解阳毒（升麻鳖甲汤），阴毒（升麻鳖甲\n去雄黄蜀椒汤），脓毒（麻黄升麻汤、升麻鳖甲汤），疫毒（芍药四物解肌汤）。\n芍药，清热和血养营利小便，芍药四物解肌汤中用芍药，这是依照桂枝汤法\n度演变的痕迹。太阳表邪虽不了了，阳明里热已经炽烈，所以不适合辛甘发散故\n去桂枝甘草法，用葛根升麻辛凉苦平双解；里邪热盛不适合生姜大枣温卫，所以\n去之加黄芩芍药清热凉润利津和营。在经方中，芍药四物解肌汤与桂枝汤、黄芩\n汤、葛根汤这三张方子关系最密切，而这三张方子共有的药物就是芍药，所以拿\n出芍药作为方名其实是经方思维制方的一大伏笔。\n黄芩，《本经》言其：“主诸热”，其实它主的是邪盛之里热为主而非卫强的\n表热，而除了温热之薮阳明这个里热，黄芩更多的是主少阳和厥阴的邪热。\n诸如小柴胡汤、大柴胡汤、柴胡加芒硝汤、柴胡去半夏加瓜蒌汤、柴胡桂枝\n汤、黄芩汤、黄芩加半夏生姜汤是以少阳为主的邪热；\n而柴胡桂枝干姜汤、柴胡加龙骨牡蛎汤、三泻心汤类方、附子泻心汤、六物\n黄芩汤是以厥阴（类厥阴）为主的邪热。\n上面说过，芍药四物解肌汤有依照桂枝汤法度演变的痕迹，那么，这个痕迹\n重要的一个环节就是黄芩汤，也就是说，桂枝汤为阳性的补津液除热方，黄芩汤\n为阴性的补津液除热方，那么在这两个方子中间的证，就是芍药四物解肌汤的证\n型。所以芍药四物解肌汤既可以解表邪，又可以养护津液除热，因为药物的组成\n攸关，它还达不到补益津液的层面，只是清热养护津液，还有它独具的养营和血\n化斑的功用尤需我们重视。\n仲圣本草学术，虽然与《神农本草经》关系密切，但是又不尽然，有其独特\n的用法和理解。同样，我们再来对照一下记载在《千金翼方》中本草的性味功用\n与《神农本草经》之异同，以体悟芍药四物解肌汤组成的原理：\n①葛根\n\n《神农本草经。中经》味甘平。主消渴，身大热，呕吐，诸痹，起阴气，解\n诸毒。\n《千金翼方。本草中品之上》 味甘，平，无毒。主消渴，身大热，呕吐，\n诸痹，起阴气，解诸毒。\n疗伤寒中风，解肌 发表出汗，开腠理。疗金疮，止痛，胁风痛。\n注：除了清热解毒生津，《翼方》还注重葛根的解肌发表出汗之工功效，更\n明确了葛根在表证中的使用地位。\n②芍药\n《神农本草经。中经》：味苦平。主邪气腹痛，除血痹，破坚积寒热，疝瘕，\n止痛，利小便，益气。\n《千金翼方。本草中品之上》：味苦酸，平，微寒，有小毒。主邪气腹痛，\n除血痹，破坚积，寒热疝瘕，止痛，益气，通顺血脉，缓中，散恶血，逐贼血，\n去水气，利膀胱大小肠，消痈肿，时行寒热，中恶，腹痛，腰痛。\n注：《翼方》已经注意到芍药有酸味的功用，并且可以利膀胱大小肠，即通\n利二便。既可以通利小便，又可以通利大便。这个《伤寒论》279)条所言如出一\n辙：“太阴为病,脉弱,其人续自便利,设当行大黄芍药者,宜减之,其人胃气弱,易动故\n也。”，符合仲圣的本草思维。\n③黄芩\n《神农本草经。中经》：味苦平。主诸热黄疽，肠澼，泄利，逐水，下血闭，\n恶创恒蚀，火疡。\n《千金翼方。本草中品之上》：味苦，平，大寒，无毒。主热黄疸，肠澼泻\n痢，逐水，下血闭，恶疮，疽蚀，疗痰热，胃中热，小腹绞痛，消谷，利小肠，\n女子血闭，淋露下血，小儿腹痛。\n注：《翼方》已经注意到黄芩的寒性，以及在里热、湿热病机中的重要应用。\n④升麻：《神农本草经。上经》：味甘辛（《大观本》作甘平）。主解百毒，杀\n百老物殃鬼，辟温疾，障，邪毒蛊。久服不夭。（《大观本》作主解百毒，杀百精\n老物殃鬼，辟瘟疫瘴气邪气虫毒，此用《御览》文）。\n《千金翼方。本草上品之上》：味甘苦，平，微寒，无毒。主解百毒，杀百\n精老物殃鬼，辟温疫瘴气，邪气蛊毒口皆吐出，中恶腹痛，时气毒疠，头痛寒热，\n风肿诸毒，喉痛口疮。久服不夭，轻身长年。\n注：《翼方》已经注意到了升麻还有苦和微寒的性味，除了解毒辟邪，更多\n的可以用在风肿诸毒，喉痛口疮。\n综上所述：\n1、芍药四物解肌汤在经方方剂学上乃阳性的补津液除热方桂枝汤和阴性的\n补津液除热方黄芩汤之中间链接。\n2、芍药四物解肌汤在临床证型学上常见于乃葛根汤之后，黄芩汤之前之病\n段，与葛根汤、黄芩汤的组方脉络关系密切。\n3、芍药四物解肌汤既可以微通大便（阳明里热为主或再兼表所致），又可以\n清热止利（阳明湿热为主或再兼表所致）。\n4、芍药四物解肌汤清解化斑解皮肤之郁热毒邪之功用应当重视。\n5、 芍药四物解肌汤病机乃太阳表邪欲解未彻，阳明里热、湿热熏蒸上焦以\n及表位以及燔灼中焦弥漫下焦之候。\n6、芍药四物解肌汤诸多功用，不出双解表里、清热散结、清利湿热、解肌\n化斑四端。\n\n答疑：\n1、麻杏石甘汤也是表里双解，不太好区分？水热和湿热有啥区别那？麻杏\n甘石汤水饮重，芍药四物解肌汤津虚重，麻杏甘石汤散饮平喘，芍药四物解肌汤\ 症状:短气>）、肾气丸（十七条<症状:短气>）、甘遂半夏汤（十八条<症状：自利>）、十枣汤（二十二条<症状：胸内痛>、三十三条<咳烦胸中痛>）、大青龙汤（二十三条<症状：身体痛重>）、小青龙汤（二十三条<症状：身体痛重>、三十五条<症状：咳逆倚息不得卧>）、木防己汤（二十四条<症状：喘满>）、木防己去石膏加茯苓芒硝汤（二十四条<症状：喘满>）、泽泻汤（二十五条<症状：冒眩>）、厚朴大黄汤（二十六条（<症状：胸满>）、葶苈大枣泻肺汤（二十七条<症状：不得息>）、小半夏汤（二十八条<症状：呕>、四十一条（<症状：渴、呕>）、己椒苈黄丸（二十九条<症状：腹满>）、小半夏加茯苓汤（三十条<症状：呕吐、心下痞、眩悸>）、五苓散（三十一条<症状：脐下悸、吐涎沫、癫眩>）、外台茯苓饮（附方<症状：气满、不能食>）、苓桂味甘汤（三十六条<症状：多唾口燥、手足厥逆手足痹、气从少腹上冲胸咽、面翕热如醉、小便难、冒>）、苓甘五味姜辛汤（三十七条<症状：咳、胸满>）、苓甘五味姜辛夏汤（三十八条<症状：冒、呕>）、苓甘五味姜辛夏杏汤（三十九条<症状：形肿>）、苓甘五味姜辛夏杏大黄汤（四十条<症状：面热如醉>）]。有咳嗽症状的仅有三方（十枣汤<悬饮>、小青龙汤<支饮>、苓甘五味姜辛汤<支饮>），且此三方无一方为治淡饮病的；换句话说，一篇中能集中有二十一方算的上是《金匮》中方子较多的篇章了，但是这么多方子中仅出现有三个“咳”字，所以把它作为“咳嗽”篇是明显的文不对题。我们常说，一部伤寒大论就是一部津液大论，而津液不利则为水饮（正常能气化者谓之津液，异常不能气化者谓之水饮），所以水饮病在整个仲圣经方体系中，本来就是一种理法的高度，而非一种病名。故四饮应该放在《金匮》全书前面作为法度来专讲，或者亦可以说四饮篇极有可能是与《脏腑经络先后病脉证第一》篇有承接关系；比如用“脏腑经络”言生理，用“四饮（淡饮）”言病理（因为淡饮是其它三饮的基础，所以可以用淡饮概称四饮，这符合古人的命名及写作规律）。因为在现行版本的第一篇中我们还可以看到诸如：“鼻头色微黑者有水气”、“色鲜明者有留饮”、“师曰：息摇肩者，心中坚，息引胸中，上气者，咳息张口，短气者，肺痿唾沫”、“如渴者，与猪苓汤”等这样一些本应该属于四饮水气篇相关的条文散落其中，这都是些重要的蛛丝马迹。为了证明这种论点，我们可以来示范整理规范一下，看整理前后的条文的对比关联性。宋本原貌：《金匮*脏腑经络先后病第一》：“师曰：五藏病各有所得者愈，五藏病各有所恶，各随其所不喜者为病。病者素不应食，而反暴思之，必发热也。夫诸病在藏，欲攻之，当随其所得而攻之，如渴者，与猪苓汤。余皆仿此。”《金匮*淡饮咳嗽病脉证并治十二》：“呕家本渴，渴者为欲解，今反不渴，心下有支饮故也，小半夏汤主之（《千金》云：小半夏加茯苓汤）。”经典经方版本整理后：《金匮*脏腑经络先后病第一》：“师曰：五藏病各有所得者愈，五藏病各有所恶，各随其所不喜者为病。病者素不应食，而反暴思之，必发热也。夫诸病在藏，欲攻之，当随其所得而攻之，余皆仿此。”《金匮*淡饮咳嗽病脉证并治十二》：“呕家本渴，渴者为欲解，今反不渴，心下有支饮故也，小半夏汤主之（《千金》云：小半夏加茯苓汤）。如渴者，与猪苓汤。”旁证：《伤寒论》条：“少阴病，下利六七日，咳而呕渴，心烦，不得眠者，猪苓汤主之。”从中我们可以看出，《金匮。脏腑经络先后病第一》的“如渴者，与猪苓汤”在原条文中前后不搭，非常突兀。而移入淡饮篇小半夏汤条则正好是对应了支饮的寒热两端，既符合金匮类证类方的写作特点，又示范了治法方药，可谓恰当。一、四饮概念《金匮。痰（淡）饮咳嗽病脉证治第十二》问曰：夫饮有四，何谓也？师曰：有痰（淡）饮，有悬饮，有溢饮，有支饮。问曰：四饮何以为异？师曰：其人素盛今瘦，水走肠间，沥沥有声，谓之淡饮。饮后水流在胁下，咳唾引痛，谓之悬饮。饮水流行，归于四肢，当汗出而不汗出，身体疼重，谓之溢饮。咳逆倚息，短气不得卧，其形如肿，谓之支饮。开篇这段话是把四饮的主要特点归纳出来了：（１）淡饮：“其人素盛今瘦”，本来身体强壮后来瘦弱了，这说明胃气虚了，水谷精微吸收障碍；“水走肠间，沥沥有声”，指的是淡饮来源于下焦，是人体应该排出的的废水上逆而成，这是淡饮的主要特点。（２）悬饮：“饮后水流在胁下，咳唾引痛”，“饮后”，前人一般都怎么解释的？说是人喝了水后，然后水流到胁下这个部位，引起了咳嗽牵引痛的症候群。这就是随文附议解经文的缺点，往往解不到本质上，忽略了经典的内涵。这个有“饮后”，其实是指的得了淡饮病以后的病传，因为淡饮是四饮的基础，人得了淡饮病之后，当淡饮停留结滞到胁下时，悬停在这里，引起了一组咳嗽吐痰胸胁引痛的症状，这就是悬饮的主要特点。（３）溢饮：“饮水流行，归于四肢，当汗出而不汗出，身体疼重”。饮水流行，就是水饮周流布散的过程。“饮水”，不是喝水，古人修辞喜欢倒装词句，饮水、水饮其实都是本指“水饮”的，就像在仲圣书中，风邪也被叫做“邪风”一样，水饮也会被叫做“饮水”。发生淡饮病之后，在病传过程中，当水饮在表位流行、荡溢，流到四肢百骸体表的位置上，水饮在表位被困束了，正气强时应当能自汗出而自解之，或者医者用汗法而药解之。而当汗不汗就会出现水邪困表身体痛重的症状。溢饮就像一个人被戴上了水囊外套一样，会引起身体的疼痛（津液不利不化则不能敷布荣养）和沉重（水饮阴邪盛极聚集）的症状，这就是溢饮的特点。（４）支饮：支饮最复杂。它综合了前面三种水饮的特点：咳逆倚息——类似于悬饮的咳唾引痛；短气不得卧——类似于淡饮的微者短气；其形如肿——类似于溢饮的身体疼重。因为它综合了前面三种水饮的特点，所以又被称为“饮家”，是水饮病中的老大，这就是支饮特点。附：淡饮考《金匮》的四饮，在现行的宋版《金匮》中，一曰痰饮；二曰悬饮；三曰溢饮；四曰支饮。而在宋前各种收录张仲景医文的书籍中，如晋代的《脉经》、隋代的《诸病源候论》、唐代的《千金翼方》中，痰饮俱作为“淡饮”。现在通行的宋本《金匮》是北宋初年翰林学士王洙在翰林院蠹简中得到了三卷仲景的一个叫《金匮玉函要略方》本子抄录而成的，“录之以传士流”，再后来（大概二十年后）精通医术的朝官林亿等人校正而成了现在我们看到的这个版本。而在最接近仲景时代的晋太医令王叔和的《脉经》的卷八就是《金匮》的另一个版本，收录了《金匮》的大部分内容，在第十五章节中就包含了宋本<痰饮咳嗽病脉证并治第十二>的条文，篇名是《平肺痿肺痈咳逆上气淡饮脉证第十五》，名称分类比宋本《金匮》更完美，更重要的是它称为“淡饮”而不是“痰饮”，一个“痰”字，往往会禁锢了学者的思路，向“稠浊者为痰，清稀者为饮”“积水成饮，饮凝成痰”等这些后世的理论靠拢，大失经方本意，不利于展开辨治。考“淡”字，《广韵》释意：“水满貌”，又《广韵》《集韵》（《广韵》、《集韵》，北宋官修韵书，其最重要的蓝本是隋代的《切韵》，曾在敦煌出土过残卷，正如《切韵》的作者陆法言在序言中所说：“因论南北是非，古今通塞，欲更捃选精切，除削疏缓，萧颜多所决定”，是对隋前汉语语系的一次总结），皆曰淡或作澹，可见在宋前，淡和澹是通用字，同音同义。比如西汉枚乘的《七发》中有“上有千仞之峰，下临百丈之溪；湍流遡波，又澹淡之。”之句，两字并用；又如东汉曹操（生于公元年，卒于公元年，与后世学者考证的张仲景的生卒年谱<约公元150-154~公元215-219>基本重叠）与仲景为同年，曹操在公元年东征乌桓的时候(与张仲景撰写《伤寒杂病论》的年谱相近，《伤寒杂病论》的撰写不会早于建安元年即公元年，不会晚于仲景最晚卒年年)，写了《观沧海》的四言名篇，有“东临碣石，以观沧海；水何澹澹，山岛竦峙”之句，而通观此篇，有很明显的化裁借鉴了宋玉《高唐赋》的文气，更何况在《高唐赋》中即有“濞汹汹其无声兮，溃淡淡而并入…..若浮海而望碣石…..徙靡澹淡，随波暗蔼”等句。可见在汉前，澹淡、澹澹、淡淡这些字词是通用的，《广韵》《集韵》：“澹淡，水播扬貌”，则这些词组是用来形容荡漾、汹涌、澎湃、激荡、上溯、潮汐的江河湖海的水（特别是自然界的寒冷的、有冲击力和急迫力的水）状态的词组。而这非常符合淡饮发于下焦肠间，走串上逆的特点与淡饮性本寒的特性，如《金匮》曰：“其人素盛今瘦，水走肠间，沥沥有声，谓之淡饮”；又曰：“病淡饮者，当以温药和之”。今天讲到这里，下面会用数节课的时间细讲分论。四饮通了，经方水平就是殿堂级了课后答疑老师在视屏中说，黄芩加生姜半夏汤，是桂枝汤偏阴的层面，这个怎么理解？怎样去对比鉴别那？——黄芩加生姜半夏汤在《辅行诀》中被称为小阴旦汤，桂枝汤被称为小阳旦汤。黄芩加半夏生姜汤与桂枝汤皆有芍药甘草汤与半个生姜甘草汤的方纲，所异者，桂枝汤用以上方纲+桂枝趋阳，黄芩加半夏生姜汤用以上方纲+黄芩趋阴。阳病则津液不能温煦，故桂枝汤需要啜粥以助阳气。阴病而津液煎灼成饮，故黄芩加半夏生姜汤需要半夏以化水饮。越婢加术汤，麻黄连翘赤小豆汤，五苓散这三个方子都有热而兼有小便不利，临床上该如何鉴别使用？——三方皆可以治支饮，而越婢加术汤、麻黄连轺赤小豆汤能治溢饮而五苓散不能治溢饮，五苓散能治淡饮而越婢加术汤、麻黄连轺赤小豆汤不能治淡饮。越婢加术汤、麻黄连轺赤小豆汤表饮为主，可见于溢饮、支饮偏表偏热者、里水、风水等表之水邪为主要方向；五苓散里饮为主，可见于淡饮、支饮偏里偏寒者等里之水邪为主要方向。请问一个病理：刘亮，男，就诊日期2015.6.16恶寒，恶风六年，加重一年患者自述年前，无明显诱因出现恶寒恶风，夏季也要着厚衣，稍感风寒则感到寒冷透骨，鼻涕连连，一年前装空调后更加重，以后尤恶空调冷风，但自述在屋里关门闭窗则不穿衣服也可以。刻诊：患者体型中等，面色无华，气温多度仍着保暖加外套，舌淡红，苔薄黄，左脉滑数，右脉沉弦数。眼睑半红半白。怕风，怕冷，汗多，活动后尤剧，上半身汗多，汗后身凉怕风。头昏，记忆力减退明显，眼散光，有时耳鸣，偶尔刷牙出血，早上口粘口苦，喜热饮热食，纳一般，喝水多，后背颈椎僵硬难受，手足温，腹软无压痛，下肢不干燥，不肿无袜痕。大便日一次，成条，有时稀，小便尿等待，饮水少则黄，起夜1-2次。睡眠可，梦多，有恶梦。我想请老师讲一下思路。李鹏练习甘草泻心汤——-40余翥、周喜梅、谢明、海岗、欧阳林资芪芍桂酒汤——张圣浩、由立国、程金亮桂枝加黄芪汤——高冰桂枝加附子汤——李强黄芪五物汤——从到都有了。刘亮，男，就诊日期2015.6.16恶寒，恶风六年（表束），加重一年患者自述年前，无明显诱因出现恶寒恶风，夏季也要着厚衣，稍感风寒则感到寒冷透骨，鼻涕连连（太阴水饮），一年前装空调后更加重，以后尤恶空调冷风，但自述在屋里关门闭窗则不穿衣服也可以。刻诊：患者体型中等，面色无华（伤营），气温多度仍着保暖加外套，怕风，怕冷，汗多，活动后尤剧，上半身汗多，汗后身凉怕风（表阴+中风）。头昏记忆力减退明显眼散光有时耳鸣（表束），偶尔刷牙出血（太阴伤血），早上口粘口苦（阳明湿热），喜热饮热食，纳一般，喝水多（阳明里热），后背颈椎僵硬难受（表束），手足温（系在太阴），腹软无压痛，下肢不干燥，不肿无袜痕。眼睑半红半白（津血虚而兼阳兼表）。大便日一次，成条，有时稀（太阴里虚胃虚轻证），小便尿等待（太阴水饮），饮水少则黄（阳明水热），起夜1-次。睡眠可，梦多，有恶梦（伤营）。舌淡红，苔薄黄（兼热），左脉滑数（水热），右脉沉弦数（阳微+水饮+热）。病机：表束+中风+表阴+伤营太阴水饮+里虚轻证+血少阳明里热+水热（湿热）六病：太阳太阴阳明病类厥阴（太阴中风之黄汗）处方：芪芍桂酒汤。李鹏：把表束断为太阴外证了。海岗问：备用桂枝加黄芪汤对吗？师曰：海岗的桂枝加黄芪汤应该暂时排后，备用黄芪建中汤。淡饮“其人素盛今瘦”，本来身体强壮后来瘦弱了，这说明胃气虚了，水谷精微吸收障碍；“水走肠间，沥沥有声”，指的是淡饮来源于下焦，是人体应该排出的的废水上逆而成，这是淡饮的主要特点。胖人是否没有淡饮？——素盛今瘦这种描述手法是以果为因法。古人不喜欢太直白的文法，老是用这个素盛今瘦来代表胃虚的病机，只要有胃虚的病机，就算没表现在素盛今瘦的症状上而表现在大便溏泄、痞满不食等症状也可以，所以胖人也可以有淡饮，瘦人也可以有溢饮。拈花指月，那个指头可不是月亮，但是不用那个指头引导你不认识月亮。再问病例。男岁主诉：中午及劳累后心下悸年。年前腹泻后出现心下悸，查心电图频发室性早博，诊断为心肌炎，中西医治疗后好转，但午饭后和劳累后发作，饮水多后发作。刻诊：稍恶风寒，无汗，活动后出汗，汗后恶风，项背部僵硬，后背心发凉怕冷，有时前胸疼，肚子怕凉，腰痛，手足温，手脚心较手脚背热，胃口一般，口不渴不干，口中和，有口臭，饮水少，习惯性喝水，温热水，饮凉水胃不适，大便日一次，不成行，小便3-5次，尿不尽感，饮水少则尿黄臭，眼睑半红半白，自觉眼稍干涩，舌淡红苔薄白，胖大齿痕，舌面水润，下肢皮肤不干，无甲错，有袜子痕，脉诊寸沉关滑大，尺弦，寸上近腕关节滑如豆。范祥源：怎么还是像芪芍桂酒汤——海岗：练习肾着汤——石贤强：练习五苓散——王庶：桂枝去芍药加茯苓白术汤——周喜梅：茯苓四逆汤——高冰：茯苓四逆汤——谢明：苓桂味甘汤——刘瑞欣：生姜泻心汤——周俊：桂枝去芍药加茯苓白术汤林凡庚：真武汤——李鹏：五苓散——邓全斌：生姜泻心汤马振：支持真武汤周帅:支持真武汤欧阳林资：支持真武汤程金亮：支持生姜泻心汤钟修重：支持真武汤刘忠革：苓桂术甘谢华林：支持生姜泻心汤牟盛云：生姜泻心汤张圣浩：桂枝加黄芪汤廖琪：黄芪建中汤王磊：茯苓甘草汤看到了大家的短板，只看到了五邪，没上升到四证，也就是被寒热迷惑了。水火气血，这是个水证，那么水饮的存在，就会导致寒热不均。表束不解的第一层面而兼有水证，会有太阳客热的问题，所以这个热不能用苦寒去清男岁主诉：中午及劳累后心下悸年。年前腹泻后出现心下悸，查心电图频发室性早博，诊断为心肌炎，中西医治疗后好转，但午饭后和劳累后发作，饮水多后发作。刻诊：稍恶风寒（表束），无汗，活动后出汗，汗后恶风，项背部僵硬（表束），后背心发凉怕冷（表阴），有时前胸疼（表束），肚子怕凉（太阴里寒），腰痛（表束），手足温，手脚心较手脚背热，胃口一般，口不渴不干，口中和有口臭（阳明湿热），饮水少，习惯性喝水，温热水，饮凉水胃不适（太阴里寒），大便日一次，不成形（太阴里虚），小便3-5次，尿不尽感（太阴水饮），饮水少则尿黄臭（阳明水热），眼睑半红半白（津血虚而兼阳兼表），自觉眼稍干涩（阳明里热），舌淡红苔薄白（表束），胖大齿痕（里虚+水饮），舌面水 符合法度，具体参考泽泻汤、真武汤]二诊：效果极佳，头晕项痛消失，故停药半月始来复诊。尿已不急数频多，尚有滴沥等待感，下肢按压轻微水气感。下睑红润正常，腹按微满。原方续进剂，巩固疗效。按语：、辨证思路：<1>辨症：患者头晕项痛，首先确定这是表位不和即表束证，而无明显怕风怕冷，这是表束的第二层面，即有表证无表邪。淡饮以下焦里位水饮和饮逆为主要症候群，水停下焦，则会导致尿急数尿频多尿滴沥等待阴囊潮湿腹按硬满大便稍频；水逆到上焦则会心慌头晕；因为表束的存在，所以不但头眩，还会项痛；同样由于表束的存在，而有腿微按肿；这种情况，在病机上其实已经存在着淡饮欲向支饮转化的倾向了，所以选择了兼顾表里的苓桂术类方，而不选择纯粹里位的苓姜类方。也是因为兼表，故脉浮。《伤寒论》条苓桂术甘汤原文的“脉沉”是因为“伤寒若吐若下后”表邪入里故脉沉；而此证为先发生里之淡饮后兼表束故脉浮。一个是由表向里走故脉下沉；一个是由里向表走故脉上浮，浮沉虽不同，病机一类，过程虽不同，结果一致，都是形成了表束里饮的状态。此案若到了肢体水肿更为明显的不用按压也“其形如肿”或伴有“咳逆倚息，短气不得卧”等四饮特点集中出现的症候群，则病传为支饮。即淡饮是以里位水饮的停留和冲逆为主要特点，而当里位水饮不解之所急所苦未除，表位（包括四肢百骸的表和上焦表位）亦发生困重溢肿时，即是淡饮病传支饮层面了。因为淡饮的冲逆上行，上焦阳火下行受碍而郁阻，所以会时有口气重浊等症状出现，这种情况不要一概加用清火法，如本案参见舌嫩苔润，下睑湿润淡红等水饮征象不支持火证，故但用化水饮通利三焦法即可水气去三焦利而郁火自除。除了水饮病机，下睑淡红，微心慌也是水邪盛血稍亏导致，故在治疗上要除水饮为要养营血为辅，苓桂术甘汤中茯苓白术甘草除饮为主，桂枝养营开表降逆，桂枝配伍甘草有桂枝甘草汤方干养营宣化平悸，白术配伍甘草可健中补虚。<2>辨脉：脉浮为有表证，如《伤寒论》条：“浮为在外......今脉浮，故在外”；《伤寒论》条：“脉浮者，病在表”。脉弦为有水饮，如《金匮要略*淡饮咳嗽病脉证并治第十二》：“其脉弦，为有水”。脉滑，主有水邪或热邪或水热胶结郁阻三焦不利（本案为水郁），如《伤寒论》条：“小结胸病，正在心下，按之则痛，脉浮滑者，小陷胸汤主之。”脉象有力是水饮上冲充迫脉道导致。<3>辨舌：舌红紫为有邪气郁滞之象，水火气血之邪气皆可导致，综合舌嫩苔薄白润，故知为水郁。、施治法则：《金匮*淡饮咳嗽病脉证并治第十二》：“病淡饮者，当以温药和之。”《伤寒论》条：“伤寒若吐若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者，茯苓桂枝白术甘草汤主之。”《金匮*淡饮咳嗽病脉证并治第十二》心下有淡饮，胸胁支满，目眩，苓桂术甘汤主之。《金匮*淡饮咳嗽病脉证并治第十二》夫短气有微饮，当从小便去之，苓桂术甘汤主之；肾气丸亦主之。淡饮性本寒，故需用温药对治使其阴阳自和而为治则。淡饮的施治用方，分为两大类：一是淡饮以水饮为主者，温化为主温补为辅，苓桂类方、苓术类方、苓甘类方、苓桂术类方为主；二是淡饮以虚寒为主者，温补为主温化为辅，苓姜类方，苓附类方为主。本案以水饮症状为主，所以治则当温化为主温补为辅，又因为有表里证，故选用了健中化饮兼能解表的苓桂术甘汤。、条文解析：苓桂术甘汤条文及“微饮”解：《伤寒论》条：“伤寒若吐若下后，心下逆满，气上冲胸，起则头眩，脉沉紧，发汗则动经，身为振振摇者，茯苓桂枝白术甘草汤主之。”《金匮*淡饮咳嗽病脉证并治第十二》：“心下有淡饮，胸胁支满，目眩，苓桂术甘汤主之。”《金匮*淡饮咳嗽病脉证并治第十二》：“夫短气有微饮，当从小便去之，苓桂术甘汤主之；肾气丸亦主之。”《伤寒论》条讲的其实是苓桂术甘汤之所以形成淡饮的病机，金匮的条文是补充。“伤寒若吐若下后”，伤寒，这是说明有表证，表证应该用汗法，故用吐下是误治。所以经过吐下误治后虚其里，虚其胃，就有了胃虚而津液不化反变成水饮的病机基础了。因为入胃入里了，所以脉也会由浮转沉，而紧脉，既主水饮，又主邪反不解，符合表邪入里的病机。因为胃虚，中不制下，下焦的浊饮和浊气就会向上冲逆，冲逆到中焦就会“心下逆满”、“胸胁支满”；充逆到上焦就会“气上冲胸”、“短气”、“起则头眩”、“目眩”；起则头眩指的是患者站立活动时眩晕加重，这是水逆眩晕的的辨证眼目之一，人肖天地，人体内的水和自然界的水是一个性质的，都是静则水止，动则水湍。“短气有微饮”是种什么状态呢？此处前人多误读，我们来详解一下：这个微饮，指的是不明显非典型的一些水饮征象，是需要医者通过细致的望诊切诊等他觉性手段才能采集到的一些水气症候群。《说文解字》：“微，隐行也。”微饮就是隐匿起来的不显著的一些水气症状。比如一个患者主诉短气，医者问他痰涎鼻涕多吗？小便频数滴沥等待不利吗？女子带下吗？男子囊湿吗？患者答曰：统统没有，医生，我除了短气别的都正常！这样问诊资料匮乏的患者大家在临床上时常可以遇到，自觉性症状非常少。那么遇到这样的患者我们怎么办呢？有办法！那就是通过望诊切诊等医者的他觉性手段来补充资料而便于进行辨治。仲圣就是一位擅用此法的医者，所以他批判那些“明堂阙庭尽不见察”的“今之医”诊病疗疾是“所谓窥管而已。夫欲视死别生，实为难矣！”而这种“窥管”的医者直到现代也大有人在，此皆不研读仲圣书之过也！那么这些微饮会表现在什么地方和什么体征呢？我们从仲圣书中给大家搜罗复原了这些重要的词条：如“目下有卧蚕”、“视人之目窠上微拥”、“如蚕新卧起状”、“其颈脉动”、“面目鲜泽”、“鼻头色微黑色有水气”。这些状态，都是微饮的反应，故《灵枢•水胀》也认识到：“水始起也,目窠上微肿,如新卧起之状”。水始起，就是微饮的状态，还不太显著，需要医者的火眼金睛去发现。我们在临床中也补充了一些经典经方学术体系常用的观察方法，如下睑过度湿润、泪目汪汪、舌苔过度水滑或伸舌垂涎欲滴、按压腹部肠鸣或有气过水声、按压小腿微有水气感或素有袜痕等，这都是“微饮”的征象。有了这些资料作为辨证依据，这个短气的病机才能断定为是水逆所导致，而不是其它火证、气证、血证所致，所以才可以用利小便降水逆的法则去对治。这种微饮，属于淡饮虚寒以饮为主者则用苓桂术甘汤；属于支饮寒热虚实水火气血杂错以水为主者则用金匮肾气丸。而不是一见“短气有微饮，当从小便去之”就从苓桂术甘汤和肾气丸中随便选一个方子就行，必须经过明辨病机后才可以随证施方。综上所述，苓桂术甘汤证不可以再发汗，“发汗则动经，身为振振摇”。动经，指的是动摇了人体的血脉。动经的“经”，温经汤的“经”，都是经脉即血脉的意思，温经汤温的可不是月经，也不是妇人专方，男子妇人皆有血脉，皆可以动经，也皆可以温经。苓桂术甘汤本来就是津液不化，水盛胃弱，营血不养，表位不和，再用汗法误治，一者汗血同源，汗后津血更亏则更不能濡养血脉；二者汗后胃气胃液更亏则水逆更盛冲击血脉；所以不光会“起则头眩”了，还会身体自发性颤抖的，“身为振振摇”，振的本意是振动摇摆羽毛翅膀，如《诗•豳风•七月》：“六月莎鸡振羽”，《礼记•月令》：“蛰虫始振”。在这里引申为肢体阵发性颤动摇摆。讲完了，我一点半出发，答疑十分钟。课后解惑:周喜梅问：老师，脉紧主邪不反解是怎么理解？答:脉缓和，为欲解。脉紧张，为不解。邓全斌问：老师能不能简单的讲下四逆散的辩证要点？答:四逆散，是类厥阴方，可以有少阳或阳明轻证，这个方子即芍药甘草汤方干+柴胡解表清里+甘草养中补中，这个方子可以治下利，是阳明热利，与黄芩汤相类，黄芩汤火证为主，四逆散气证为主。林凡庚问：老师，短气除了水证其他三证也会出现吧？苏方达问：许师好，短气这个症状，除了水饮可以引起，还有其它病机吗？答:短气，水火气血皆可导致。水证如苓桂术甘汤，火证如栀子豉汤，气证如枳实薤白桂枝汤，血证仲圣原书无方，但是可以参看下淤血汤等方。见于《金匮*惊悸吐衄下血胸满瘀血病脉证治第十六》“病人胸满，唇痿舌青，口燥，但欲漱水，不欲咽，无寒热，脉微大来迟，腹不满，其人言我满，为有瘀血”。周俊问：老师，阳微结是什么意思？答:阳微结就是津液不能防御温煦濡养。下一周休课，大家参看淡饮讲义消化一下。2015.8.2许师随讲录说起医心方，里面有一个半夏剂量，正好符合我们考证的剂量。苏敬云：半夏一升八两为正。按一两六克，八两四十八克。若按一升200ml，200ml的半夏大概会有克左右，显然不符合用药的法度。按照一两15.625克计算，多克。\n第一还是剂量太大，\n第二又与升难以自圆其说。所以学问最怕认真只要认真了，就可以做到如理如法。比如：大半夏汤半夏（二升，洗完用）人参（三两）白蜜（一升）上三味，以水一斗二升，和蜜扬之二百四十遍，煮药取二升半，温服一升，余分再服。两升半夏，按照200ml和15.625计算显然不符合用药疗疾的法度了。这是本着中毒的目的去的。徐灵胎有段话说的很中正，“要知药气入胃，不过借此调和气血。非药气入口，即变气血”。所以不在多也，我们是医者，以药材疗疾，切记孟浪。当归补血，非当归是血也，而是当归之性味能调节机体生血之能。同样，用半夏也是为了调动机体化饮降逆之功能半夏+病人=化饮降逆，以草木之偏性攻脏腑之偏胜，而非以草木之重量攻脏腑之偏胜。射干（十三枚，一法三两）麻黄（四两）生姜（四两）细辛紫菀款冬花（各三两）五味子（半升）大枣（七枚）半夏（大者洗，八枚，一法半升）上九味，以水一斗二升，先煮麻黄两沸，去上沫，纳诸药，煮取三升，分温三服我们来看：射干麻黄汤半夏（大者洗，八枚，一法半升），大个的半夏，枚约等于半升，枚半夏有无100ml？绝无可能，但是按照苏敬法折算正好。大半夏一枚大约等于克，枚正好是克——半升。古人喜欢去约数，有的医家有药升，有的没有怎么办？约定俗成，大半夏一枚≈克（半两）。故苏敬云：半夏一升八两为正。问题的关键还在于，宋本金匮中的射干麻黄汤是在隋唐时代隐匿的。但正好与唐代苏敬的说法不谋而合，蠹简中的宝珠。学生：原来半夏是突破口牵涉好几个条学生:半夏，是有大小，不可能均因的。学生：大者。答:小的半夏和薏米一般大，要不就不会有苦酒汤的炮制方法了。半夏（洗，破如枣核，十四枚）鸡子（去黄，内上苦酒，着鸡子壳中，一枚）上二味，内半夏，着苦酒中，以鸡子壳置刀环中，安火上，令三沸，去滓。少少含咽之；不瘥，更作三剂。一个鸡蛋去黄，装上苦酒，还可以装下十四枚半夏学生：那么问题来了，既然剂量不精确，那么相差一两的剂。答:剂量，只是一种象。学生：如深师麻黄汤的四两麻黄和仲景麻黄汤的三两，有很大的区别吗？有说两，有用两，剂量与疗效可能不是正相关，这个最难研究。答:有主次之分。比如：桂枝汤治太阳病，用桂枝三两，桂枝附子汤治少阴病，用桂枝四两，而小青龙汤兼有太阳表不解，用桂枝三两。桂枝芍药知母汤偏于少阴，用桂枝四两。象，是一种大象。也就是一种规范，是一种示现。比如盖房子，偏房总要比正房低一些，低这几寸有无意义？非常有的，尊卑偏正之象就显出。张建成问：还有药材的种类、含量存在差异，如何规范？如黄芪分内蒙黄芪和荚膜黄芪，同样剂量的前提下有多大的区别？是否能达到古人的标准？还有药材的种类、含量存在差异，如何规范？如黄芪分内蒙黄芪和荚膜黄芪，同样剂量的前提下有多大的区别？是否能达到古人的标准？答:药材纯正当然也重要。但是不要忘了，古今药材其实并无质的变异。举个例子：食材浅显易懂。汉代的羊肉性热，现代的羊肉性热不？汉代的西瓜性凉，现代的西瓜性凉不？雕虫刻棘心忧怂，大刀阔斧意豪然。学经方要越学越大气。欧阳林资问：许师好，现在前胡到底用哪一种啊!有信前胡。答:前胡不必用信前胡，顶端有毛者佳欧阳林资问：就是普通的前胡吗？答:是的。余翥问：师父，临床上能不能用前胡代替柴胡？二者功效作用会不会差别非常大？答:肯定不能，柴胡推陈致新。一曰大黄二曰柴胡大黄剂非常好用。大黄不但可以治火证，还可以治水证。四饮我们会解到。鈡蒋騠问：许师，柴胡用柴胡根好还是叶，还是二者各半？答:柴胡用全草。根苗各半。欧阳林资问：那现在有的柴胡里面掺柴胡的芦头也可以一起用吧答:可以。欧阳林资问：细辛有的地方叶子一起用，还是只用根。谢明：细辛应该只用根吧！答:是的。形细而味辛，故曰细辛。魏晋以降，文人喜欢骈文，喜欢对仗。所以很多抄本就有一些流弊出现。我们现在通行本是宋本，宋本当然有很多整合后优点，但是也有鱼目混珠的地方。比如后世很多人争论桂枝到底是什么，为什么说去皮等等。就此有多种论点出现，论文多篇，有数万言者。我们一直强调：读书查其源，切勿从其流。你学颜体不临勤礼碑，不临麻姑仙坛，去临摹何绍基临摹刘墉能成吗？在更古老的版本，伤寒论其实是前论后方的。比如我们现在可以见到的《金匮玉函经》，其实就是一个古本伤寒论，在这里面，桂枝不去皮，麻黄也不去节，杏仁也不去皮尖只有甘草曰炙。后世文人看到甘草下面有炮制，其它三味没有，不对仗啊！画蛇添足结果后世论文有了素材。桂枝是肉桂之说出来了，实在是不认真。这就像拿着何绍基的书法说颜体的一样。何绍基学过颜体，字里也有颜体的风骨，但是他毕竟不是颜体。鈡蒋騠问：我记得：小品记载麻黄不去节，不去沫，会使人咳。答:临床验证过吗？麻黄我专用带节的老麻黄，掰开里面有砖红色的粉。不但没发现令人咳，还是治咳喘的良药。麻黄不先煎去沫有一部分人会失眠是对的，麻黄量大时可以煎两遍。谢明曰：麻黄有时即使先煎去沫，有时也会对睡眠有影响。程金亮曰：我也有体会，吃了以后精神的很。答:辨证为主。我们有用小青龙汤、续命煮散治疗失眠的效案。支饮导致营卫不和而失眠，需要发散水饮而和营卫，小青龙汤有甘草麻黄汤和半夏干姜散治饮，桂枝汤方干和营卫。续命煮散还加有苓桂术甘汤，还可以治疗眩悸心下满。大家长时熏修，必有所成。（2.15.8.3）","hasDose":true},{"caseId":"P0063","caseSource":"临床医案解伤寒二期","caseType":"讲义医案","归集方":"桂枝汤","usedFormulas":["桂枝汤"],"isCombine":false,"patient":"臨床醫案解傷寒二期講課實錄（一）許家棟講述目錄","symptom":"","history":"","exam":"","analysis":"","prescription":"","effect":"","comment":"","caseExcerpt":"臨床醫案解傷寒二期講課實錄（一）許家棟講述目錄\n第⼀課濕疹案講解（⼩建中湯條⽂串講）.......................\n第⼆課腹脹伴肢痛案講解（厚樸七物湯條⽂）............\n第三課半夏瀉⼼湯案⼀解析（⿈連湯解析）................\n第四課半夏瀉⼼湯案⼆解析.............................................\n第五課⽢草瀉⼼湯醫案（腎著湯的故事）....................\n第六課⽢草瀉⼼湯案.........................................................\n第七課⽢草瀉⼼湯案（六病眼針）.................................\n第⼋課三瀉⼼湯源流詳解之前世今⽣篇⼀....................\n第九課三瀉⼼湯源流詳解之前世今⽣篇⼆....................\n第⼗課病案答疑...............................................................\n第⼗⼀課三瀉⼼湯源流詳解之⼀源三岐篇..................\n第⼗⼆課病案講解...........................................................\n第⼗三課太陰病概講.......................................................\n第⼗四課太陰病概講之⼆...............................................\n第⼗五課太陰病概講之三...............................................\n第⼗六課太陰病概講之四...............................................\n第⼗七課太陰病概講之五...............................................\n第⼗⼋課太陰病概講之六...............................................\n第⼗九課太陰病概講之七（⿈汗）..............................\n第⼆⼗課太陰病概講之⼋（⽢草幹薑湯、腎著湯）..\n第⼆⼗⼀課芍藥四物解肌湯考釋（五穀）..................\n第⼆⼗⼆課經⽅辨治咳喘專題講座之⼀......................\n第⼆⼗三課經⽅辨治咳喘專題講座之⼆......................\n第⼆⼗四課經⽅辨治咳喘專題講座之三......................\n第⼆⼗五課經⽅辨治咳喘專題講座之四......................\n第⼆⼗六課經⽅辨治痤瘡專題講座之⼀（⽕痤）......\n第⼆⼗七課經⽅辨治痤瘡專題講座之⼆（⽔痤、⾎痤）傷寒條⽂及重要名詞索引...................................................\n第一課濕疹案講解（小建中湯條文串講）（年月日）\n【医案】秦某，男，岁。出诊⽇期：年⽉⽇。主诉：左⽆名指湿疹两年。病史简要：患⼉左⼿⽆名指湿疹两年，⽤过多种中⻄药物内服外⽤不效。因近⽇⽪损及瘙痒加重来诊。刻诊：左⽆名指⽪损⼲裂苔藓化，增厚之硬性⽪损与变薄变脆之嫩肤兼加，瘙痒明显，时因抓搔⽽渗⾎。下肢亦有⼀暗红斑疹尚不甚痒，⾯部有淡红点状粟疹。⽆明显怕风怕冷，扪⼿⾜温，夜眠⾝汗，汗后不凉，夜间不喜盖被，喜蹬被取凉。饮⽔不多，纳可，喜⾷⾁⾷，家⼈代诉有时⼝臭。⼤便⽇⼀⾏，质可，溲⾊量次数皆可。下眼睑淡⻩伴有红⾎丝。⾆脉：脉弦细浮，⾆红紫嫩中有裂纹苔⽩腻花剥。（图1.治疗前）六病辨证：太阳太阴阳明合病（或太阳太阴类厥阴病）处⽅：半量⼩建中汤（桂枝⽣⽩芍炙⽢草⽣姜⼤枣饴糖（烊），⽔煎服五剂。）外洗：⽩芨⽣⽢草煎汤外洗连⽤天。外搽：⽣地⽣⽢草决明⼦⻩精研末⽤腊⽉猪脂调膏（⽆则可以勉⽤凡⼠林膏代⽤，但疗效⽐腊⽉猪脂要打折扣，此⾎⾁有情物理相引之妙也）。（图2.治疗后）二诊：效果极佳，五剂药还剩半剂，皮损即已痊愈。查看患处已光洁柔嫩新皮已生，渗血裂痕已愈合，已无瘙痒。下肢皮损及面部粟疹已不明显。夜汗等伴随症状皆已大减。原方续进五剂，巩固疗效。、辨证思路病患部位在表，⽽⼜⽆少阴证，这是辨为太阳病位的依据；患指湿疹硬脆燥裂，这是津液不能濡养导致，加之不喜覆被，恶热喜凉且汗出不恶寒，这类似阳明病“燥烦满实⼤便难”中的“燥”“烦”，有热和燥的病机。但患⼉⽆⼝⼲⼝苦，饮⽔不多，⼤便不燥结，⼩便不⻩⾚，这说明此热和燥不是真正的阳明实热实⽕导致的，再参看下眼睑淡⻩，这是津⾎濡养不⾜的表现（红⾎丝的夹杂是津⾎濡养荣养不⾜导致了热⽣），不但津液濡养不⾜了，⾎液的荣养也不⾜了（真正的阳明实热实⽕，下眼睑是⾚红的），⽪损时时的渗⾎也是津⾎虚燥伤损的⼀个表现，⾎者，阴中之阴也，归为太阴。太阴病以⾥虚寒为主，此则因津⾎不能濡养荣养⽽引起了⼀组近于阳明的症状，因为不是阳明的实热实⽕，所以勉称为“阳明虚热”证，阳明虚热证严谨来说属于类厥阴病，以虚为主。脉浮病位在表，脉细津⾎不⾜，脉弦在这⾥亦提⺬津伤不养之象，如《⾦匮》：“转筋之为病，其⼈臂脚直，脉上下⾏，微弦。”⾆红紫为有热有瘀，嫩⾆腻苔提⺬此热不实，裂纹提⺬花剥有⾥虚津⾎濡养不⾜。、施治法则因为病机是津⾎不濡养⽽产⽣的虚热，所以不能去⽤真正的清阳明热的法则。（附：真正的阳明热有四类⽤药法度：⼀、⽯膏寒⽔⽯知⺟丹⽪升⿇类⾟寒解热；⼆、⻩芩⻩连⻩柏苦参秦⽪败酱类苦寒清热；三、栀⼦豉类酸寒泄热；四、⼤⻩芒硝类苦寒攻热。）那么就需要⽤清虚热⽽护液除⾎痹的芍药去对治，芍药六两，⽐芍药⽢草汤的量还重了，配合饴糖能养津护液，配合桂枝则能调和营卫⽽⽣肌。此条⾔辞简略，所以记录的症状还不⾜以辨证，仲圣⽤思精，绝不孟浪，他⽼⼈家如何判定这是⼩建中汤证的腹痛呢？因为还会有以下条⽂的补充：虚劳⾥急，悸，衄，腹中痛，梦失精，四肢酸疼，⼿⾜烦热，咽⼲⼝燥，⼩建中汤主之。（《⾦匮要略·⾎痹虚劳病脉证并治第六》）妇⼈腹中痛，⼩建中汤主之。（《⾦匮要略·妇⼈杂病脉证并治第⼆⼗⼆》）伤寒⼆三⽇，⼼中悸⽽烦者，⼩建中汤主之。（）这样看起来就丰满了，虚劳必兼虚热，这是法则，所以⼩建中汤证常见咽⼲⼝燥，⼿⾜烦热这类的虚热之象，这是津⾎虚了濡养⽽⽣的虚热，是邪风虚热。故⾦匮虚劳诸⽅，皆有补益⽽除热之药（劳，繁体字作“勞”，是⽕字头的，这是古字的⽞机，所以繁体字也被称为正体字。）所以⼩建中汤更合理的说来是太阴病⽅，太阴中风病中的邪风虚热型。是故⼩建中汤证说的是四肢酸疼，这很有意思，凡是典型的太阳病桂枝汤证的，都是说⾝疼痛，从来没有只是四肢酸疼的，⽽太阴中风才是四肢疼烦。这是因为太阴中风津⾎虚的程度要⽐太阳中风更重，所以趋表抗邪的更少，所以达不到周⾝疼痛的程度，只是四肢酸疼，四肢为诸阳之本，⼈体的阴阳营卫、卫阳津液交合流⾏的根据地，所以这些部位会有酸疼的感觉，但是达不到太阳病那种周⾝充盈的程度。参见：．太阴中风，四肢烦疼，脉阳微阴涩⽽长者，为欲愈。⾥急，急，《说⽂》：“褊也。褊者，⾐⼩也。故凡窄陿谓之褊”；《增韵》：“迫也。⼜窘也”。⾥急是指腹部有变窄的感觉，本来正常⼈的感觉腹部是宽敞的，有变窄的感觉就是⾥急，总觉得腹部不适，窘迫不舒服，还会出现疼痛。悸，⼩建中汤证的⼼悸，是由于津⾎虚不养还兼表不解所导致，所以这种悸往往还会伴有烦，⼼中悸⽽烦。这种烦的病机是津⾎虚不养+表不解，还可以见于桂枝汤证，如：．太阳病，初服桂枝汤，反烦不解者，先刺风池、风府，却与桂枝汤则愈。．伤寒发汗，已解。半⽇许复烦，脉浮数者，可更发汗，宜桂枝汤。再延伸⼀步，这个衄，既是津⾎受损的⼀个症状，⼜是津⾎受损的⼀个病因，同上烦悸，这个衄的病机同样也是要兼有表不解的，但是这个解表不能去发汗解表，为什么？．衄家，不可发汗，汗出，必额上陷脉急紧，直视不能眴，不得眠。条在很多版本断句有问题，断成“汗出必额上陷，脉急紧”了，这是不通的，谁见过发汗把⼈的额部瘪陷了的？应该断成“汗出，必额上陷脉急紧”，额上陷脉，指的是太阳⽳处的颞动脉，衄家本来就⾎少，汗⾎同源，发汗就更导致⾎少，⼈体为了把有限的⾎先提供给⼤脑，就会加速动脉供⾎，所以颞动脉会跳动的厉害，这就是额上陷脉急紧的道理，不但额上陷脉急紧，⼨⼝脉也是急数的，失⾎的脉。梦失精，这是中不制下导致的，中焦的津液被虚热耗伤了，对下焦就失去了固摄的⼒度，加之虚热的继续存在，由津伤到了营⾎也被耗伤的程度，营⾎耗伤，津液不⾜，营卫交合失其常度，则眠差梦繁；虚热熏灼，⼼旌神摇，则性梦梦遗或⽆梦⾃遗。伤精，是更明显的虚劳病的标志。那么为什么不差者⽤⼩柴胡汤呢？伤寒，阳脉涩，阴脉弦，法当腹中急痛者，先与⼩建中汤；不差者，与⼩柴胡汤主之。（）⾎弱⽓尽，腠理开，邪⽓因⼊，与正⽓相搏，结于胁下，正邪分争，往来寒热，休作有时，默默不欲饮⾷。藏府相连，其痛必下，邪⾼痛下，故使呕也。⼩柴胡汤主之。（）⼩建中汤针对了⾎弱⽓尽，针对了表⾥虚腠理开⽽邪⽓⼊⾥导致腹中急痛，针对了这⼀部分病机。保胃⽓，存津液，所以先⽤⼩建中汤建⽴中焦之⽓，使表⾥实津液充盈荣养则腹痛外证可愈。要是还没有好彻底，减轻了⼀部分，还不甚了了，出现了⼀组“腹痛⽽呕”（条；《⾦匮·⻩疸病脉证并治第⼗五》），“默默不欲饮⾷”，还可伴有“往来寒热”等正邪纷争的症候群，这⾥⾯有个很突出眼⽬，就是“邪⽓因⼊，与正⽓相搏，结于胁下”⽽导致“胁下硬满”（条）！⼩建中汤证虽有腹痛，但是腹部柔软，得按则喜，或者患者⾃⼰也喜欢⽤揉按的⽅式来缓解疼痛，这是⾥虚的表现。⽽经过⼩建中汤补益以后，邪正相搏的结局变成了疼痛⽽硬满，这是⾥⾯有⽔饮的夹杂了，⼩建中汤治的是胃中津液少的胃虚，⼩柴胡汤治的是下焦⽔饮逆（可上逆到中焦胃脘胸胁或上焦头⾯）的胃虚；故⽽⼩建中汤⽤芍药⽢草汤+饴糖作为⽅根补津液，⽽⼩柴胡汤⽤⽣姜⽢草汤+⼩半夏汤作为⽅根治⽔逆。这不是单纯的⽤症状去套⽅，⽽是在病机上的思辨。这也就是“先与⼩建中汤；不差者，与⼩柴胡汤主之”的病机层次所在，也就是我们临床可以在⼀诊推衍出⼆诊的处⽅的范本！不是我们标新⽴异，我们研究伤寒经⽅的标准是“⽆⼀字⽆来历，⽆⼀字⽆出处”！","hasDose":false},{"caseId":"P0068","caseSource":"临床医案解伤寒二期","caseType":"讲义医案","归集方":"当归建中汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"【课后答疑】晓辉问：淡饮也可以向上冲逆那么⾼？许师⽈：淡饮可以头眩，四饮中本性冲逆的就是淡饮。林树元问：发作时冷汗淋漓，","symptom":"","history":"","exam":"","analysis":"","prescription":"","effect":"","comment":"","caseExcerpt":"【课后答疑】晓辉问：淡饮也可以向上冲逆那么⾼？许师⽈：淡饮可以头眩，四饮中本性冲逆的就是淡饮。林树元问：发作时冷汗淋漓，是⽔饮上逆时从表⽓泄越吗？那是否是有卫⽓虚？许师⽈：是胃虚⾥虚不能温固收摄津液，需要温⾥固⾥，⽤守⽽不⾛之药如⼲姜⽢草，绝不可以让药势⾛表。太阴虚寒者，⾥虚寒，⾥虚寒者，胃⽓⾥阳津⾎皆可以虚寒，可以⽣虚寒淡饮̶̶⽔，可以⽣邪风虚热̶̶⽕，可以⽣留⽓结⽓̶̶⽓，可以⾎少失⾎̶̶⾎。崔莉问：⼩便如茶⾊，说明什么？许师⽈：说明⽔+热。张圣浩问：如果初诊⽤了⽣姜泻⼼，接下来的病机怎么转变？许师⽈：可能需要⽢草⼲姜汤或⽢姜苓术汤去救逆了。马向国问：许⽼师，您判断太阴虚寒的最核⼼眼⽬是否是叟急频数，纳呆腹胀，⼤便素稀？我指这个医案中的症状啊！许师⽈：我给的是更⾼的法则。张圣浩问：师⽈：其⼈素盛今瘦，⽔⾛肠间，沥沥有声，谓之痰饮；-----谈饮就是特指中虚寒产⽣的吗？许师⽈：胃虚+津液不化。李津新问：⾷时汗出----仅仅表明是阳明有热吗？还说明了什么？许师⽈：或热或虚或有表邪，需要四诊合参。郑晓岑问：⽼师，三泻⼼汤中，都有太阴症，⽽太阴外证，只有⽢草泻⼼汤可以出现吧？许师⽈：是的。马向国问：̶̶可能需要⽢草⼲姜汤或⽢姜苓术汤去救逆了。⽢草⼲姜能理解，⼲姜苓术是意味着虚寒到⽔饮严重影响胃⽓恢复必须兼顾去除了吗？许师⽈：肾着之病，其⼈⾝体重，腰中冷，如坐⽔中，形如⽔状，反不渴，⼩便⾃利，饮⾷如故，病属下焦，⾝劳汗出，⾐（⼀作表）⾥冷湿，久久得之，腰以下冷痛，腹重如带五千钱，⽢姜苓术汤主之。（《⾦匮·五脏风寒积聚病脉证并治第⼗⼀》）许师⽈：下午有个同修跟我讲，跟其他班听经⽅课⼀年了，⽼师讲了很多，就是还没讲条⽂。跟我的班说我没讲条⽂⽴马踢⾛。我们为什么说⽆⼀字⽆来历，⽆⼀字⽆出处，就是我们所有的理论都是有条⽂出处的。⽤仲圣的条⽂解读条⽂，⽽不是⾃建⽴了⼀套理论去框伤寒论，这才叫以经解经。⾼来⾼去的空说是都可以，能否脚踏实地的⽤到临床呢！⼀个理念治法的提出能否举⼀反三在伤寒中通⾏⽆碍呢。许师⽈：解条⽂开始。肾着之病，其⼈⾝体重，腰中冷，如坐⽔中，形如⽔状，反不渴，⼩便⾃利，饮⾷如故，病属下焦，⾝劳汗出，⾐（⼀作表）⾥冷湿，久久得之，腰以下冷痛，腹重如带五千钱，⽢姜苓术汤主之。（《⾦匮·五脏风寒积聚病脉证并治第⼗⼀》）。仲圣这本书，⽤的是⼀种形⽽上的⽅式去撰写，⽐如内经时代，远早于仲圣时代。⽽在《灵枢·经⽔》说：“夫⼋尺之⼠，⽪⾁在此，外可度量切循⽽得之，其死，可解剖⽽视之。其脏之坚脆，腑之⼩⼤，⾕之多少，脉之长短，⾎之清浊……皆有⼤数”。解剖这⼀名词，知识产权属于我们。⻩帝问于伯⾼⽈：余愿闻六府传⾕者，肠胃之⼤⼩长短，受⾕之多少奈何？伯⾼⽈：请尽⾔之，⾕所从出⼊浅深远近长短之度：唇⾄齿长九分，⼝⼴⼆⼨半；齿以后⾄会厌，深三⼨半，⼤容五合；⾆重⼗两，长七⼨，⼴⼆⼨半；咽门重⼗两，⼴⼀⼨半。⾄胃长⼀尺六⼨，胃纡曲屈，伸之，长⼆尺六⼨，⼤⼀尺五⼨，径五⼨，⼤容三⽃五升。⼩肠后附脊，左环回⽇迭积，其注于回肠者，外附于脐上。回运环⼗六曲，⼤⼆⼨半，径⼋分分之少半，长三丈三尺。回肠当脐左环，回周叶积⽽下，回运还反⼗六曲，⼤四⼨，径⼀⼨⼨之少半，长⼆丈⼀尺。⼴肠传脊，以受回肠，左环叶脊上下，辟⼤⼋⼨，径⼆⼨⼨之⼤半，长⼆尺⼋⼨。肠胃所⼊⾄所出，长六丈四⼨四分，回曲环反，三⼗⼆曲也。看看，说的多清晰，这是内经的法则之⼀，讲究形器。⽽仲圣⽼⼈家⽤思精，他怕后学者跟着内经形器的思路跑偏，所以虽然借⽤了⼀些⼈体组织和脏腑的名称，但是内涵已不尽相同，所以会有“胃中有燥⽮五六枚”这种说法。燥⽮在肠中，怎么会跑到胃中，就算仲圣⽼⼈家的解剖课程是书法⽼师教的也不会出现这样的低级错误吧。其实，这些都是⼤约的⼀种虚指名词⽽已。就像本⽂的肾着、还有⾦匮的肝着、肺痈、肺胀、⾎室、膀胱等等皆是如此。许师⽈：（以下剧情⽤故事形式论述）学⽣：那就请⽼师先讲下胃中燥⽮。仲圣说：肾着这种病，⾝体沉重，腰部冰冷，患者⾃觉或者医者触诊潮湿冰冷就像刚刚从⽔⾥捞出来似的。形如⽔状，不是说⾛起来是凌波微步，⽽是说肾着病的患者腰冷腹重步履维艰，外观看起来就像⽔肿病类似。许师⽈：⽔肿病，在⾦匮叫做⽔⽓病。汉代古⼈的语⾔习惯，喜欢带个⽓。⽔盛了叫⽔⽓，⽕盛了叫⽕⽓，风盛了叫风⽓，湿盛了叫湿⽓。所以⾦匮湿病说风湿不可以发⼤汗，⼤汗是风⽓去，湿⽓仍在。我们现在不也说⼈⽓很旺嘛。都是这样的语⽓助词。那么怎么区别是肾着病还是⽔⽓病呢？看看仲圣⽼⼈家的临床技巧。什么技巧？可劲的问啊！您⼝渴吗？⼩便怎么样？⾷欲何如？患者：医⽣，我是来看腰痛的，你问我胃⼝⼲什么？仲圣就耐⼼的解释：这位患者，因为⽔⽓病的常见的病机就是中焦胃虚和津液不化。您没有⼝渴（⼝渴为津液不化），没有不欲饮⾷（中焦胃虚），没有⼩便不利（津亏或者表不解或者中不制下）。这些病机没有，那就不是⽔⽓病啊。患者：哦~原来是为我好，那就实话实说哈“反不渴，⼩便⾃利，饮⾷如故”你整吧。仲圣：ok！这是病在下焦啊，下焦⾥位的虚寒本来就不能固摄收摄，加上您劳倦，就更容易形成太阴外证的体表的⾃汗出嘛~久之则能导致的表⾥冷湿（注意不是⾐⾥冷湿，⽽是表和⾥都有寒冷和⽔湿）。患者：这么复杂，听不懂啊~~~医⽣，我腰痛腰冷，痛的肚⼦还下坠啊~救我~~患者：医⽣，你怎么不说话，是不是我肾亏啊！患者：刚看过⼀个医经派⼤夫，说我肾亏啊！仲圣：说你表⾥冷湿的嘛，腰为阳位属表，腹为阴位属⾥~你这个病，不但虚寒了，⽔湿也成了你的主要病机，腰痛牵扯肚⼦下坠像挂了⼏捆铜钱吧！治疗的话需要⽤治太阴外证的⽢草⼲姜汤打底，加上之温化渗利淡饮⽔湿的⽅根茯苓⽩术，这张⽅⼦，本来叫⽢姜苓术汤的，既然你这么关⼼肾，那就叫肾着汤吧！从此，江湖上出现了⼀张⼈⼈欲得之的神⽅̶̶肾着汤。马向国问：⼩便⾃利是指正常吗？还是不正常呢？许师⽈：正常。⽔⽓病多不正常。谢明问：许师粳⽶⼀合是多少克？许师⽈：粳⽶⼀合先⽤̶̶克。余翥问：⽹友⼩美，⼥，⼀诊开的温经汤。主诉：⽉经延后不准时恶寒，恶热。不恶风，容易出汗，出汗了恶风。稍微动就会出汗，⽆盗汗。眼睛容易⼲涩，蹲久了起来会头晕且眼睛发黑。脸颊两边的痘痘很⼩，不红，没有脓头，看不太出来，⽤⼿摸才感觉得到。下巴和唇周围会长很⼩的痘痘，不红，有脓头。下巴偶尔还会长⼀颗很⼤很红且痛的痘痘，不多。⽆刷⽛流⾎。⽆⽿鸣。⿐⼦⾥⼲⼲的，有些⼝臭。会⼝⼲咽⼲，有点⼝黏。有时候会觉得脚冷。⾃⼰觉得⼿脚温度还算正常的。睡觉⼿脚烦，要翻来翻去的很久才会睡着。别⼈抚摸⼿脚温度都要偏凉些。⼿脚⽪肤⽐较⼲燥，没有⽔肿。下肢⽪肤如鱼鳞⽚但是没有⼲裂。⼤便成条。现在⼀天⼀次，有时候会两天⼀次，不紧，但是会肚痛，有痔疮，不流⾎。⼩便次数⽐较多，量少，颜⾊深⻩。不夜尿。来⽉经前期胸两边会很痛。⼩腹也坠坠的，晚上睡觉⼀定要盖肚⼦。现在偶尔会胃胀⽓。相对之前好很多了。喝药\n第三天肚⼦有咕噜咕噜叫，之后就没有了。服⽤期间放屁很多。喝⽔⽐较少，凉开⽔。⼝渴。胃⼝好。⼀碗⽶饭加各种零⾷。睡眠差，⽐较难⼊睡，梦多。记忆⼒不太好。⽉份⽉经是4-27号来的。⽉延迟了天，6-号来的。之前⼀般⼀周⼲净，量少。这次喝药的第五天来的。现在⽉经\n第三天，还没有⼲净，量⽐以前多了些。⾎块还是有，但是⽐以前的⾎块⼩了很多很多。第⼀天是暗褐⾊的。第⼆天就鲜红了。没有腹痛。来的时候没有别的不舒服。平时⽩带量多，颜⾊⽶⽩，没有味道。痰少，⽩⾊。许师⽈：当归建中汤。余翥问：我⼀开始在犹豫温经汤和当归建中汤之间。许师⽈：⾟散表和⽢滋⾥的区别。\n第六課甘草瀉心湯案（2014.6.11）\n【医案】李某，男，岁。初诊⽇期：年⽉⽇。主诉：嘈杂痞满便溏半年。病史简要：患者嘈杂烧⼼泛酸半年，服⽤多种中⻄药治疗乏效，或有时虽能暂时缓解⽽难以持久，伴有脘痞便溏。刻诊：嘈杂泛酸，胃脘热灼，⾷后甚；嗳⽓，⼼下痞满，痞满时牵掣周⾝难受；近来尤苦于⼤便凌晨三点即⾏，甚或晨起亦再两⾏，多溏便，时有完⾕不化，便后即⼼下痞满周⾝难受；⽆⼝⼲⼝苦，饮纳可，溲频溲急，饮⽔少则⼩便深⻩，饮⽔多则⼩便清长；⽆汗，⽆怕风怕冷，⽆关节⼿⾜凉⿇，腿⾏⽆⼒；形瘦，⾯⾊⻘⽩油腻感，双⽬内眦红⾚胬⾁，睡眠不馨，眠浅多梦，醒后难眠。⾆脉：脉弦细，⾆淡紫嫩红苔⽩。六病辨证：太阴阳明合病。处⽅：⽢草泻⼼汤炙⽢草⻩芩⻩连⽣旱半夏⼈参⼲姜⼤枣⽔煎服四剂。⼆诊：效极佳，诸证皆效，嘈杂烧⼼泛酸⼤减，凌晨溏泄症状已改善，即偶有凌晨⼤便亦已不溏，且便后亦已舒适，⼤便⽇⼀⾏，患者甚喜；痞满不适感亦已改善，只是⼼下痞满，⽽⾝已不难受，⾆微⼲。脉弦，⾆淡红紫苔⽩。处⽅：半夏泻⼼汤（⽣旱半夏⻩芩⻩连⼈参炙⽢草⼲姜⼤枣，⽔煎服四剂。）许师⽈：⼤家练习⼆诊处⽅。林树元⽈：⼩便还是频急，下肢还是⽆⼒，那还是原⽅（⽢草泻⼼汤）吧。许师⽈：效极佳，诸证皆效。这是⼩便也改善了。许师⽈：复诊先写改善的部分，再写现在的所急所苦。谢知问：⽼师，我有⼀问题，开⽅时候四付，六付，，，，，怎么定？许师⽈：⼀般⽽⾔，退烧⼀天⼀开⽅，慢性疾病，近距离的四五剂。远距离的⼗天半个⽉。三诊：嘈杂烧⼼泛酸基本消失，胃脘痞满感已除，⼤便⽇⼀⾏，便后舒适，腿沉重感已减，⾯⾊明显好转，双⽬内眦胬⾁颜⾊变淡，⾆⼲已不明显，患者对疗效满意。原⽅（半夏泻⼼汤）续进四剂，巩固疗效。、辨证思路患者五更泄泻，稀溏急频，泄后痞满不适，溲频溲急，形瘦腿乏，⾯⾊⻘⽩油腻，这是太阴⾥虚寒引起的胃虚寒不能固摄制约⽔⾕之运化所致；⽽嘈杂泛酸，胃脘热灼，⾷后加重，脘痞嗳⽓，双⽬红⾚，这是阳明⽔热客⽓上犯导致；溲频溲急，饮⽔少则⼩便深⻩，饮⽔多则⼩便清长多为⾥虚⽽有寒热杂错之证。饮⽔多则虚寒不化故可见清长，饮⽔少则虚热内耗故可见⻩短；睡眠障碍，⽔⽕⽓⾎四证都可以导致，⽔则上凌，⽕则耗伤，⽓则攻冲，⾎则失养。具体到此案，眠浅多梦之完整病机为⽔⽓上凌+⽕⽓耗伤+浊⽓攻冲+⾎⽓不养，⽽以太阴虚寒⽔饮与阳明⽔热为主要症结，⽽浊⽓与津⾎不养是由于上述太阴阳明合病之病机所致。林树元问：请问⽼师，⾎⽓不养的佐证是“痞满时牵掣周⾝难受”“腿⾏⽆⼒”吗？许师⽈：还有⾯⾊，眠差。、施治法则初诊时患者以太阴胃虚寒不能固摄制约⽔⾕之运化为急为苦，⽽⼜兼有阳明⽔热客⽓攻冲之证，还有形体瘦削，腿乏⽆⼒，⾯⾊⻘⽩等虚损羸弱体征，需要以补胃健运，扶虚强健，补虚治泄为主，兼以清热化湿，⽽三泻⼼类⽅中，完⾕不化，虚弱不固为急为苦者，中焦胃虚为主，⽢草⼲姜汤为基础⽅根，⽢草泻⼼汤为主；⽔⽓不化，兼表不解为急为苦者，⽔热互结为主，⽣姜⽢草汤为基础⽅根，⽣姜泻⼼汤为主；寒热不化，呕逆痞满为急为苦者，寒热杂错为主，半夏⼲姜散为基础⽅根，半夏泻⼼汤为主。故初诊选⽤⽢草泻⼼汤施治。⼜则患者⾯⾊⻘⽩油腻，⽬内眦红⾚胬⾁和《⾦匮要略·百合狐惑阴阳毒病证治第三》中描述的⽢草泻⼼汤证的狐惑病的“其⾯⽬乍⾚、乍黑、乍⽩”颇相类。⼆诊时胃虚得补养，津液得固化，故⽽虚弱溏泄得到改善，故易以半夏泻⼼汤以治其痞。⽽⾆⼲是因为废⽔得以浚化，津液尚未及上承充盈有关，此反应与⼩⻘龙汤化饮后的反应堪称异曲同⼯，临床亦⼴泛见于各类⽔饮病的治疗过程中。《伤寒论》条：“伤寒，⼼下有⽔⽓，咳⽽微喘，发热不渴。服汤已渴者，此寒去欲解也。⼩⻘龙汤主之。”并且三泻⼼类⽅与⼩⻘龙汤看似风马⽜不相及，⽽皆有半夏⼲姜散之⽅根，皆有⾥位的⽔⽓，其实⼤有联系，所不同之处在于：、⼩⻘龙汤以兼表风寒湿为急为苦，故合⽤桂枝汤去⼤枣加⿇⻩以解表邪；、⼩⻘龙汤⽔饮为寒饮，故加⽤细⾟、五味⼦温化；、⽽三泻⼼汤类⽅以⾥虚胃弱为急为苦，故合⽤⽢草⼲姜汤、⽣姜⽢草汤（⽣姜泻⼼汤）以健胃补中；、三泻⼼汤⽔饮为⽔热，故加⽤⻩芩、⻩连清解。是故⾦匮书中有条⽂两⽅并提，见于《⾦匮要略·妇⼈杂病脉证并治第⼆⼗⼆》：“妇⼈吐诞沫，医反下之，⼼下即痞，当先治其吐诞沫，⼩⻘龙汤主之；涎沫⽌，乃治痞，泻⼼汤主之。”今天到这⾥。","hasDose":false},{"caseId":"P0073","caseSource":"临床医案解伤寒二期","caseType":"讲义医案","归集方":"茯苓泽泻汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"【神农答疑】2014/6/29问道经⽅问：附⼦汤有个“⼝中和”,背恶寒，⽽痉湿喝病脉证中有这么⼀条：湿家病，⾝疼发热，⾯","symptom":"","history":"","exam":"","analysis":"","prescription":"","effect":"","comment":"","caseExcerpt":"【神农答疑】2014/6/29问道经⽅问：附⼦汤有个“⼝中和”,背恶寒，⽽痉湿喝病脉证中有这么⼀条：湿家病，⾝疼发热，⾯⻩⽽喘，头痛⿐塞⽽烦，其脉⼤，⾃能饮⾷，腹中和，⽆病，病在头中寒湿，故⿐塞，内药⿐中则愈。这⼉“腹中和”该如何理解？静听风语⽈：调和。伤寒论有胃⽓不和之论，⾥病也，当和胃⽓⽽治⾥，此腹中和就是胃⽓调和，不当和胃⽓治⾥，当治表。我把这条的笔记和⼤家分享⼀下：①湿家病⾝疼发热，⾯⻩⽽喘，头痛⿐塞⽽烦，其脉⼤，⾃能饮⾷，腹中和⽆病，病在头中寒湿，故⿐塞，内药⿐中则愈。（《脉经》云：病⼈喘。⽽⽆\"湿家病\"以下⾄\"⽽喘\"⼗⼀字）释：这个湿家是个⽐较特殊的案例，上焦表位被寒湿所侵袭了，有表证反应了，但是没有明显的⾥证，所以不是那种“伤寒三⽇阳明脉⼤”（《伤寒论》）的实证，⽽是个“脉⼤为劳”（《⾦匮》“夫男⼦平⼈，脉⼤为劳，极虚亦为劳”）的虚证，所以⾯⻩⽽喘，有津虚液少的病机，虚弱的⼀个患者，头部中有了寒湿，怎么办？还是不要⽤峻药发散了，不适合，就近病位⽤药，⽤些去寒湿的药把寒湿从⿐⼦中引出来，把这个湿病的症状解决掉就⾏了，想治虚劳以后再说，即提⾼了患者的⽣存质量还不去冒险，仲圣的确⽤思精！林凡庚问：许师，这个往⿐中放的药是什么？静听风语⽈：你想配制啊。林凡庚问：后⾯没⽅⼦，所以想问问⽼师⼤概是些什么药。静听风语⽈：是乌头膏千⾦乌头膏。不好配制三味毒药：乌头野葛莽草。问道经⽅问：其实我想问的是：⼝中和指的是⼝中黏黏糊糊不爽的感觉，⽽腹中和确是腹中⽆问题了呢？难到和在这两个地⽅的意思是不⼀样的吗？静听风语⽈：这两个字不⼀个读⾳⼝中huo，⼀字多⾳，⼀字多义。这种字经⽅中⽐较常见，⽐如̶̶重，重发汗̶̶chong。腹满⾝重̶̶重zhong。重发汗，就是重复发汗了。见于条：.伤寒，脉浮，⾃汗出，⼩便数，⼼烦，微恶寒，脚挛急。反与桂枝欲攻其表，此误也。得之便厥，咽中⼲，烦躁吐逆者，作⽢草⼲姜汤与之，以复其阳。若厥愈⾜温者，更作芍药⽢草汤与之，其脚即伸；若胃⽓不和，谵语者，少与调胃承⽓汤，若重发汗，复加烧针者，四逆汤主之。本来⾃汗出，⼜⽤了桂枝汤等误发汗，这叫重发汗汗家重发汗，必恍惚⼼乱，⼩便已阴疼，与禹余粮丸。汗家有⽤了发汗剂，这叫重发汗。欧阳林资问：许师，请问苓⽢五味姜⾟汤，苓⽢五味姜⾟夏汤，苓⽢五味姜⾟夏杏汤，苓⽢五味姜⾟夏杏加⼤⻩汤，这⼏个⽅病机如何区别啊。这⼏⽅在临床运⽤的时候有点糊涂，请许师指点。静听风语⽈：这四⽅是⽀饮的从⾥向表，从阴向阳弥漫转化的四种状态。苓⽢五味姜⾟汤温化中下焦寒饮为主，苓⽢五味姜⾟夏汤在上⽅基础上加重了降⽔逆利中上焦的作⽤，苓⽢五味姜⾟夏杏汤在上⽅基础上兼有了温散轻宣解表⽔的作⽤，苓⽢五味姜⾟夏杏加⼤⻩汤在上⽅基础上兼有了清解湿热的作⽤还能加强利⼩便的效果⽽针对⽀饮的热化去的，苓⽢五味姜⾟夏杏⼤⻩汤不要只被条⽂的⾯热如醉所惑，这个⽅证的⽔肿⽐苓⽢五味姜⾟夏杏汤要重得多。欧阳林资问：还有苓桂味⽢汤这⽅病机也容易糊涂。静听风语⽈：那⼀条需要和条参看，都是⽤了解表药后表不解，都是⾥有饮，都是翕翕发热。所不同的条是胃虚重。苓桂味⽢汤是伤津重。所以条是⼩便不利，有⼩便但是尿不出来。苓桂味⽢汤是⼩便难，虽然有⽔饮，但是津虚⽽⽆尿可尿了。阳盛则欲衄，阴虚⼩便，难津液虚了⼩便才难。还⽐如桂枝加附⼦汤也是⼩便难，他不说是⼩便不利为什么？津液⼤伤了，⽆尿可尿了。.太阳病，发汗，遂漏不⽌，其⼈恶风，⼩便难，四肢微急，难以屈伸者，桂枝加附⼦汤主之。所以读仲圣书需要处处留⼼，粗枝⼤叶不是经⽅。经⽅做的是微雕的学问。韩⾮⼦对⼀个国王说，有个微雕⾼⼿在棘刺的末端刻了⼀只猴⼦，⼀般⼈看不到，怎么才能看到呢？斋戒三个⽉，澄⼼静虑，才可以看到。我的感受亦是相同，读仲圣书，真的需要澄⼼涤虑，这是的。\n第十課病案答疑（2014.7.5）谢⾬晴问：⼥，岁，主诉：眠差多梦年长期夜眠多梦，近期加重，⼊睡容易，闭眼做梦，梦境清晰，晨起疲劳。平时畏风寒，后背和右肩怕冷，汗出正常，出汗后怕凉。饮⽔⼀般，喜欢热饮。⽆头晕头痛，⽉经前⿐⼦周围长痘痘1-2颗，⾊红，痛。⽉经后消失。偶尔刷⽛出⾎，劳累后有短暂的⼀过性⽿鸣，⽆⼝⼲⼝苦⼝粘，双⼿中指关节偶尔胀痛，屈伸疼痛。运动后肌⾁僵硬酸痛半个⽉以上才能恢复，右侧肩关节略有疼痛，怕冷，受凉后疼痛加重。右侧下腹部时有牵扯疼痛，痛时按压有包块，疼痛消失时包块消失，⼿⾜温，⽆⼿⾜⼼发热怕凉，⽪肤润泽⽆肌肤甲错⽆静脉曲张，下肢稍有按肿，有袜痕，⼤便时有黏腻不爽，每天次，成型。⼩便⾊⻩如茶，每天次左右，夜尿偶尔⼀次。时有⼼慌⼼悸，发作时胸闷，⼼中发空感，⼀般劳累后短暂发作。静⽌休息后缓解。肚⼦发凉怕风睡觉⼀定要盖肚⼦，吃冷饮会反胃呕吐，呕吐物为冷饮。吃糯⽶后胃胀胃痛，⽆嗳⽓泛酸，胃⼝⼀般，饭量⼀碗，喜欢吃辣，但吃辣后⼜胃痛，⽉经周期天，\n第1-2天量多，后天量少。5-6天左右⼲净，量少⾊暗，⽆⾎块，⽆腹痛，⽆乳房胀痛，偶尔腰骶部胀痛。⽩带正常，⽆异味。破腹产⼦。岁。⾆质红，⾆体胖⼤，晨起边有齿痕，中间有裂纹，⾆尖红⾚，苔薄⽩，脉弦.吃过付当归建中汤，吃了就头晕呕吐。温经汤剂⼆诊：诉服药后屁多，精神体⼒略好转，多梦眠差未见明显改变，掉头发多，⾯⾊萎⻩，巩膜略⻩，下睑红，脉浮细紧，⼝⼲，饮可，饮温，汗可，汗后发凉怕风，⼤便⽇⾏⼀次，稀溏，偶可，纳差，⾆胖红⽆苔，有齿痕。下肢⽆按肿，⽆肌肤甲错。许师⽈：患者有肠鸣吗？谢⾬晴⽈：没有。许师⽈：体质胖瘦。⾯部⽪肤⼲燥还是油腻还是正常。谢⾬晴⽈：偏瘦，⽶，公⽄。平时正常，劳累后出油。许师⽈：先⽤⽢草泻⼼汤。许师⽈：这个患者有营⾎不⾜⽽受损（⾯⾊萎⻩，⽉经偏量少⾊暗，刷⽛出⾎）和太阴胃虚寒（⼤便粘滞，腹冷腹痛，得温则减，饮冷呕吐）的底⼦，在此基础上兼有了太阴中风的病机，故⽽恶寒肩背冷汗出后凉肢节疼痛遇冷加重；但是也有阳明实热和湿热夹杂的病机，故⽽⼿⾜温，⼩便⻩如茶⾊，经前⾊红痤疮疼痛，这个太阴阳明的杂错是形成眠差多梦的病机。许师⽈：当归建中汤对治的是营⾎不⾜和太阴中风。加重了热。这个实热和湿热需要的是苦泄和⾟开苦泄⽽不是⽢滋。那么⼤量的⽢滋药下去，患者呕吐很正常。需要苦泄，你硬给⼈家⽢补，结果就是⼈家不⼲了。许师⽈：温经汤有⾟和苦的搭配了，五味上有些接近，但是四⽓的寒热温凉上偏颇了，所以疗效在有⽆之间。在照顾到太阴⾥寒⾎伤中风的基础上，把握住实热和湿热的祛除就圆满了。因为⾥证为主，不可以先攻表，所以选择了⽢草⼲姜汤为⽅根的⽢草泻⼼汤。⽢草⼲姜汤温养⾥阳⽽兼能补益津⾎（⼈参⼤枣），芩连半夏⾟开苦泄对治实热（芩连）和湿热（芩连+半夏）。等这部分湿热和实热去掉了，再考虑转⽅。钟蒋騠问：余雙利⼥岁0140629主诉：扁桃体肿⼤（两边肿⼤已经看不见喉咙）病史简要：患者⾃觉喉部不适，到医院检查诊断是扁桃体肿⼤三度，⻄医建议⼿术治疗，患者家属怕⼩孩⼿术后有什么并发症，故选择吃药，在这期间经过⼀段时间⻄药和安利保健产品（蛋⽩质粉）治疗⽆效，故⽽转求中医治疗。刻诊：扁桃体肿⼤⽆法看见喉咙，经常⽛龈上长块⼩⾁⽽且会有脓(不⽤治疗过段时间⾃然会好),有怕热，有盗汗（上半夜），有⼝臭，冬季下肢⽪肤⼲燥脱⽪，有袜⼦痕，⼤便不成形，稀，⼀天次，⼩便⻩（根据喝⽔多少，多就⽩⾊，少就⻩），量多，⼩便次数3-4次，偶有夜起，次数⼀次，偶有胸部喘不过⽓，喜深呼吸⼝⽓才可缓解，喝⽔少，⽆⽔温要求，睡眠可，有打呼噜，下眼睑⻩微带⾎丝。⾆脉：⾆淡红润苔⻩厚脉⼨关浮尺沉处⽅：⽢草泻⼼汤四剂，吃完后扁桃体，没多⼤改变。许师⽈：格式完美化，四诊完整化，措辞清晰化，⾏⽂优美化。四个现代化。这样的医案才能看起来赏⼼悦⽬，解起来酣畅淋漓。许师⽈：畏寒⼀次，伤寒论全书未见，以后最好不⽤了。《伤寒》书中，可以见到“恶寒”、“恶风”、“微恶寒”、“有寒”、“寒甚”、“⼤寒”、“寒多”、“多寒”、“寒少”、“振寒”、“振栗”、“淅然”、“洒淅恶寒”、“洒洒然⽑耸”、“寒在⽪肤”、“寒在⾻髓”、“⾝凉”、“⾝冷”、“背冷”、“腰中冷”、“⾥寒”、“胃中冷”、“厥”、“厥逆”、“厥冷”、“逆冷”、“逆寒”、“四逆”、“⼿⾜寒”、“⼿⾜冷”、“⼿⾜逆冷”、“胫冷”、“指头寒”等对恶寒（风）或者⾃觉或他觉性的低温的描述。这些描述，既有全⾝性的症状表现，也有局部性的症状表现。看看是不是没有畏寒。许师⽈：既然是伤寒学派，病理性的名词，伤寒论中有描述的就先⽤书中的原始名词，这样便于在辨证上的⽅向性。要学好经⽅，最主要的要素就是严谨和法度。不依仗臆造，不过度联想，直指所在，单⼑直⼊。时⽅是练的是套路，所以说起来天花乱坠，⽤起来不堪⼀击。经⽅练得是实战，故⽽说起来简洁凝练，⽤起来所向披靡。⼴播体操层⾯和九阴真经层⾯的差异。许师⽈：余雙利刻诊时⼜脓吗？鈡蒋騠⽈：没有。许师⽈：⽢草泻⼼汤是对的，⽤⽣⽢草⽅。⽢草泻⼼汤继续服⽤。鈡蒋騠⽈：⽤的⽣⽢草。许师⽈：要消的迅捷，需要配合⽕针。患者家长理解⼩孩配合的话就⽤⽕针点刺扁桃体。⽤75mm的长针烧红后点刺肿⼤的扁桃体。鈡蒋騠问：点刺⼏次。每个扁桃体点刺⼏下。许师⽈：每周⼀次。每次⼀下。刘旭⺠问：直接偏桃体⽕针？许师⽈：是的。不配合的话可以点刺颈部外侧浅刺。⼈迎和扶突上⾯下颌⾓下之间区域。点刺颈部看起来安全实则恐怖。鈡蒋騠问：进多深。许师⽈：需要很浅。颈动脉在这，破⽪就⾏。鈡蒋騠问：张学姝⼥岁0140619病史：做过宫颈囊肿⼿术，慢性胃炎。主诉：左侧头痛，喉部很多痰，⼿指关节痛，脖⼦两侧⼤筋僵硬痛、左右转动不灵活，会牵引双⼿紧绷不适，⽿⼼痛，同时也引起两肩部酸软痛，偶有夜⾥睡觉双⼿有点现⿇⽊，眼睛胀（⾃觉要突出来了），偶尔⼼烦会伴发微咳⽆痰，长期⿐⼦瘙痒，肛门骚痒坠胀，双膝关节盖被⼦热后现软，脚掌发热骚痒，⼈没有精神，睡不着觉，偶有⼤便没消化，⼩腹痛，⼩便次数多，夜起次数多，⼤便出来像脓痰那样（⽩⾊），不喜欢看到⽩⾊和波动的⽔，会⼼烦头晕脑胀呕吐，也不喜欢看到油腻的东⻄，会出现⼈很不舒服，⽛齿⾃觉松动，刷⽛时爱出⾎，还有⼤⼩便同时出现坠胀时、⼩便量少、⻩伴痛、⼤便通后⼩便量多，颜⾊清澈，⾛路和运动后⼼感觉累，奇怪的是只要⼀出汗症状全部好了，出汗停后症状⼜出来，从⼩不爱出汗，⾝上如果有伤⼝不易愈合，⼝渴喝⽔后肚⼦胀想吐，左侧肋下腹痛，长期中⻄药治疗⽆效，来诊。刻诊：精神不佳，⾯⾊⽩有斑，汗出后背⼼冷怕风，天⽓太热会出现⼼悸，出汗少，运动后总感觉⼼紧，⽆发热，⽆头晕，有头痛，⽆痘痘，有痔疮，有斑、颜⾊黑，刷⽛出⾎，还⾃觉⽛龈松动，⽆⿐塞⿐涕⿐⾎，有⼝臭、⼝黏，⽆⼝苦（憋尿时会出现⼝苦），⽆⼝⼲，有⼝渴，肌⾁酸痛，⼿关节（特别是⼿指）肩膀脖⼦痛，⽆⼿脚冷，有脚掌⼼发烫，⽆⾛路脚后跟疼，睡觉时⾝上和脚软不知道要怎么摆放，冬季下肢⽪肤⼲燥，⽆脱⽪甲错，按压有轻微凹陷，⼤便质量成形、前⼲如⽺屎状⾊黑后⾯正常，⼀天１−２次，⼩便量少，颜⾊清澈，次数−次，夜起次数−次，冬季夜起次数−次，⽆胸⼝不适，有⼼烦（严重），肚腹左侧痛（医院检查慢性胃窦炎），⽆肚⼦发凉，偶有胃胀，⼤椎位置怕冷怕风喜盖被⼦，胃⼝可，饭量可，平时很现饥饿感，胃痛，⽆反酸，有打嗝（碰其⾝体任何部位都会打嗝），，⽆⽿鸣⽿聋，喝⽔多、想喝冰凉的⽔越冰越好、但因喝后会腹胀不适、只有喝热⽔。睡眠差，⼊睡慢，易醒，醒后难⼊睡（但⼈很清醒），⽉经⽆，⽩带量少，颜⾊⽩⾊，有异味很臭，下眼睑⽩带⾎丝。⾆脉：⾆淡红微齿痕，苔微⻩有裂纹脉：⼨尺沉，关微浮⽆⼒⽣姜泻⼼汤⽣姜炙⽢草上⼈参⼲姜⻩芩⽣旱半夏⻩连⼤枣⽔煎服剂⼆诊：⽿⼼痛、眼睛胀、咳嗽、⼤便、⽛齿松动、刷⽛出⾎、⼝臭、⼝黏已好，精神、睡眠、脖⼦左右转动不灵活、双膝关节软、脚掌发热瘙痒都有好转，现在最苦恼的是打嗝，打嗝后呕吐⽩痰，吐后背⼼冷，出汗后背⼼也冷，周⾝感觉⽓窜（打嗝后缓解），上半⾝胀痛，双⼿指紧胀僵硬痛。有头晕头痛，怕风怕冷，⼼烦，⽿朵听⼒不灵敏，咽喉部总感觉堵塞有痰，脖⼦两侧⼤筋强硬，⽽有⿐⼦肛门痒，肚⼦⽓窜⾄背⼼痛，胃⼝可，饭量可，喝⽔少，喜温⽔，喝凉⽔后会腹胀，⼩腹痛后尿频，⼩便余沥不尽，⽆夜起，看到⽩⾊和油腻的东⻄⾃觉想吐，全⾝⾃觉热烦躁，有痔疮，冬季⽪肤⼲燥，⽆脱⽪，按压时有轻微凹陷（⾃觉紧绷），下眼睑⻩带⾎丝。⾆脉：⾆淡红微齿痕，苔微⻩有裂纹脉：⼨尺沉，关微浮⽆⼒鈡蒋騠⽈：这个⼈不好写，东拉⻄扯。许师⽈：以后注意提炼。不允许这样写医案，好中医，必须有好⽂笔。患者怎么说你就怎么写，这是路透社的记者。领导怎么说你就怎么写，这是xxx的记者。任他们怎么说，我⾃有定宰，理义明晰，⾏⽂优美，这才是天朝的国医圣⼿。许师⽈：脖⼦两侧⼤筋僵硬痛̶̶颈项强痛。写医案不是⺠间采风，有点书卷⽓⾏不。许师⽈：现在⼤⼩便的⾊量质次数？鈡蒋騠⽈：⼩便今天有点頻。许师⽈：⾊量质次数。鈡蒋騠⽈：⼩便颜⾊⽩⾊，⼀天7-8次。⼤便可，⼀天次，成形，条状。前⾯不⼲燥。以前有不消化的⾷物，现在都没有了。许师⽈：原⽅续进鈡蒋騠问：她现在最想解决的就是嗳⽓。许师⽈：这个症状快不了，⽅⼦对证。继续吃⼀周再说。鈡蒋騠问：她全⾝串⽓是怎么回事呀许师⽈：表束⽽⽓不旁流。需要⽣姜⽢草汤的⽅根解表养津。林树元问：⼥余岁6-29晕厥七年余，再发⼀天。七⼋年前出现晕厥，每年夏天七⼋⽉时加重，平素情绪不佳时亦发。今晨发作⼀次，晕后不醒⼈事，时间较长、难以计算，醒后稍有头晕、疲乏。平素时有胸闷、怔仲、烦躁、⽓短，⽆恶风寒，汗可，⼝渴，饮不多，饮则欲溺，喜温饮，⼩便⾊偏⻩，⼤便调，每夜时易醒，醒后难以⼊睡，经早−⽇，经期−⽇，量可，⾊鲜红，⽆⾎块，右细滑稍弦、关浮，左细浮滑，⾆暗红，苔薄⽩腻。下睑淡红。太阳表束：桂枝救逆汤桂枝，⽣姜，红枣，炒⽢草，⻘礞⽯，远志，龙⾻，牡蛎剂7-4昨晚⽆诱因下晕厥⼀次、较前清醒、晕厥时间较前缩短、约分钟，醒后⽆头晕、疲乏。平时汗可，⽆恶风寒，胸中疼痛、滞塞、⽓短，⽆怔忡，夜寐仍易醒、醒后可⼊睡，⽆⼝⼲渴，仍有饮则欲溺，剖腹产后出现腰痛，本次⽉经⽉。右⼨沉滑、关尺细弦浮滑，左细弦滑稍浮。氤氲期⽩带较多，偶夹淡红⾎⾊。⾊⾆淡红稍紫，边齿痕，苔薄⽩、中有细⼩裂纹。⾎压素低、波动在70/30mmHg，今⽇量⾎压升⾄110/70mmHg。太阳表束，太阴饮滞津伤。桂枝救逆汤合苓桂味⽢汤桂枝，⽣姜，红枣，炒⽢草，⻘礞⽯，龙⾻，牡蛎，茯苓，五味⼦剂许师⽈：解表养津化饮。许师⽈：⼆诊不⼝渴了？林树元⽈：不明显。但是⾆苔上反⽽出现裂纹。。估计还是伤了津⾎。许师⽈：太对了，元元。许师⽈：此患晕厥病机乃⽔热冲逆兼表不解导致，有热故⽽⼝渴溲⻩经⽔鲜红，烦躁难寐，脉浮（兼表）滑；⽔逆上冲到上焦表位⽽表不解故⽽晕厥⽽胸闷⽓短怔仲，虽⼝渴⽽不多饮，喜温饮，⽔热互兼故⽽下睑淡红，还有轻微的胃虚，故⽽饮则欲溺，许师⽈：短⽓有微饮，当从⼩便去之。（假令瘦⼈，脐下有悸），吐涎沫⽽颠眩者，（此⽔也），五苓散主之。林树元问：敢问栋师，何以养津？许师⽈：为什么要养津？津伤因为⽔热。林树元⽈：噢。许师⽈：你不去⽔热⽽去养津，桂枝配⽣姜是发越为主了。此案要⽤桂枝配猪苓泽泻茯苓去降⽔逆，猪苓泽泻还可以清热。⽩术可以健中。许师⽈：⽩术可以健中利⽔，⽔饮兼⾥虚常⽤，特别是在此基础上兼表就更常⽤了。如条⽅、苓桂术⽢汤、五苓散等。寒湿在表⽽⾥⽆饮也常⽤，如⿇⻩加术汤、桂枝附⼦汤等。林树元问：五苓散作汤的剂量？许师⽈：猪苓茯苓泽泻⽣⽩术桂枝。刘旭⺠问：许师茯苓泽泻汤会取效么？许师⽈：茯苓泽泻汤发表太过了。林树元问：⼥6-20近两⽉经少，半⽉⼀⾏，末次⽉经⽉⽇来潮，⽇经尽，⾊暗红，⽆⾎块，经前及经来时⼩腹隐痛，右侧胸部胀痛。本次⽉经未潮，⼩腹已有疼痛。近⽇⽩带偏多，⻩绿⾊，⽆异味，时有阴痒。寐不佳，凌晨时易醒。稍畏寒，⽆头痛头晕，汗不多，偶有⼀过性胸闷滞塞，稍有⼼烦，纳可，饭后稍有肠鸣，⼤便调、稍黏，⼩便淡⻩、⽆频急、⽆夜尿。⽆⼝⼲⼝渴⼝苦咽⼲，喜饮温⽔。右浮弦濡略滑，左弦细滑。⾆淡红，苔薄⽩稍淡。下睑半红半⽩。扪⼿⾜温，下肢⽪肤不⼲。太阴⾎伤停饮，当归芍药散。当归，芍，茯，术，泽，芎6-27经⽔未潮，⼩腹隐痛坠胀，⽩带⻩绿⾊、量不多、⽆阴痒，清晨半点醒，⽆胸闷，⼤便稍黏，⼩便淡⻩、⽆频急，⽆⼝⼲⼝苦，饮不多，⽆头晕，熬夜后晨起⼼悸，脉右细软、左细缓、⼨沉稍滑，⾆淡红，苔薄微滑，下睑淡⻩润泽。扪⼿⾜温，下肢⽪肤润泽、⽆按肿。许师⽈：处⽅正确。林树元⽈：没来，我就在想到底是⽔分还是⾎分。许师⽈：⽔⾎同病。林树元⽈：然后想了半天，出了个真武汤……后来⼜觉得，应该是当归建中汤。然后就不知道到底是哪个了。许师⽈：渐⾏渐远。林树元⽈：症状不太多。⼀开始⽤当归芍药散还很有信⼼的，但是⽉经没动，就动摇了。许师⽈：当归芍药散对证，需要坚持。再就是考虑你们的芍药不⾏。林树元⽈：也有可能。许师⽈：没有黑⽪的就⽤⾚芍林树元⽈：这⾥是杭⽩芍。。。但来是缺了通利之性。许师⽈：看起来很⽩净，⽤起来很摆设吧。林树元⽈：唉。我发现是有点不太给⼒。许师⽈：给⼤家讲⼀下当归芍药散。妇⼈怀娠，腹中庥痛，当归芍药散主之。《⾦匮要略•妇⼈妊娠病脉证并治第⼆⼗》妇⼈腹中诸疾痛，当归芍药散主之。《⾦匮要略•妇⼈妊娠病脉证并治第⼆⼗》当归芍药散⽅当归三两芍药⼀⽄茯苓四两⽩术四两泽泻半⽄芎窮半⽄（⼀作三两）右六味，杵为散，取⽅⼨⼔，酒和，⽇三服。释：妇⼈以⾎为⽤，所有的经带胎产哺乳莫不耗⾎，所以妇⼈的⾎证最为常见。妇⼈怀娠，⾎即去养胎，所以发⽣腹中庥痛者，不荣则痛也，⾎少故也。⼈体犹器也，内本有⽔⾎同在⽽并⾏不悖；⽔和⾎皆为阴之类也，阴亲下也，阴就⾥也；⾎者，阴也，⾥也；⽽器中⾎先减少则⽔即随后相应增多，浸淫⼊⾎则⾎就更会相应减少⽽变淡也，是故⾎亏⽔盛之病机成矣。⽽“妇⼈腹中诸疾痛”，亦⽤当归芍药散者，其机理则亦相当。妇⼈腹中，胞宫⼦处所居，经带胎产诸⽣理功能之根据地，⾎室之处也。胞中有胎或下焦瘀阻（多为经带胎产所致），则⾎之滋养荣养受碍，得不到滋荣部位的⾎是绝对不⾜的，胞中⼦处和瘀阻之处⾎是相对不⾜的，故⽽此证之⾎亏不可以⽤阿胶胶饴类滋腻壅滞之品呆补，⽽需⽤养⾎中能⾏⾎之品。所以当归芍药散中芍药量最⼤，《本经》：“芍药，味苦平。主邪⽓腹痛，除⾎痹，破坚积寒热，疝瘕，⽌痛，利⼩便，益⽓。”芍药的“益⽓”，益的是荣⽓即营！也就是养营的药，还可以除⾎痹，⾏⾎化瘀去滞，并且最为恰当的是可以“利⼩便”，即所以去⽔饮也。⼀药可兼⽔⾎两端，可养营⾎可⾏淤⾎可利⽔液可助阴液，芍药配伍茯苓，是仲圣⽔⾎同病⽔⾎同治的⽅根。见于当归芍药散、桂枝茯苓丸、真武汤、附⼦汤、薯蓣丸，这个⽅根的⽅⼦，占了⽔⾎同治的⽅剂的半壁江⼭，是此类⽅剂最重要的基础！当归芍药散中，当归、川芎、芍药养营⾎⾏瘀⾎为主，茯苓泽泻⽩术逐⽔⽓利⼩便为主，芍药兼可以利⽔饮，⽩术兼可以健胃⽓，合⽽成养⾎⾏⾎逐⽔祛饮益⽓护液之⽅。此⽅养⾎不留湿，⾏⾎不伤⾎，逐⽔不损中，祛饮不伤阴，益⽓不燥津，护液不滋腻，可谓⽔⾎同治之第⼀⽅！冯冬⾹问：林某男岁因眩晕，⾏基底动脉⽀架后脑积⽔呈半植物⼈状态，延髓损伤，呼吸⿇痹，呼吸机维持呼吸，营养液维持，肠瘘给养。刻诊：有意识，会⽤眨眼张嘴表达是不是，短暂⾃主呼吸，⼤约能维持1-2个⼩时，⾯⾊红润，唇⾊淡红，⽛关紧，嘴⾓有抽动，眼神迟钝，黑睛发灰，上有⽩膜，眼睑⽆⽔肿，下眼睑红⽩各半，唇不⼲，四肢肌⾁萎缩，上肢⽪肤松弛，肤⾊偏暗，下肢⽪肤正常，肤⾊红润，⾜底颜⾊略红，躯⼲⽪肤颜⾊正常，红润，⽆⼲燥，⽆褥疮。空调房呆着，⼏乎不见出汗，但被⼦悟久了会表⺬热，⼿脚温，不饮⽔。腹部⿎胀，表达腹胀，按压痞硬，⽆腹痛，⼤便每天⼀次（护理被动排出，质稀）⼩便颜⾊淡⻩清亮，⾃⾏排出（⼩便袋接盛），近天⾷物返流（长期营养液维持，有服祛痰中药，具体中药处⽅不详，未服药之前眼屎多，痰多，服药后症状好转，因⾷物返流已经停服，停服后⾷物返流好转），喉中和⼝中有痰，⾊⽩质粘（吸痰器吸引排出）下肢⽆按肿，⽆静脉曲张，略有少量⽪下⽑细⾎管暴露。夜寐安，有梦。⾆质红，苔⽩略厚，⼨脉浮，关脉⼤，尺脉略浮⽆⼒。⼀诊：许师指导下，⽣姜⽢草汤剂。服药后反应腹胀消（我怀疑家属领会错误），痰多，略有汗出，出汗粘腻，眼屎略多。⾯⾊红润，眼神较之前清明。⼆诊：原⽅续服剂，配合眼针，家属反应⾷物返流加重，胃胀。但头部能偶尔摆动（以前不能），⼿脚时有抽动。下肢略有浮肿，余症同前三诊：原⽅续进剂，配合眼针+涌泉，百会，⾷物返流减轻，偶见返流。腹胀依旧，眼屎⽆，下肢略有浮肿。腹胀⼀直未消。许师⽈：⼀个眩晕给⽀架成这样，可叹。找经⽅医⽣治眩晕物美价廉。许师⽈：外台茯苓饮，健中利⽔养津⾏⽓。还可以解表位和上焦的壅滞。冯冬⾹问：眼针继续扎，体针呢？许师⽈：眼针就⾏了。针扎多了泄，此患者不宜泄。眼针能补益。眼，内经称为命门，可以调动精⽓的。张圣浩问：患者⼥岁，⾯⾊⻘⻩，神态疲倦，主诉胸闷，容易喘⼤⽓，要深呼息才舒适，下午加重。既往有低⾎压病史，⽿鸣⼗余年，失眠多梦⼗余年，刻诊患者⽆怕风冷，冬天⼿⾜不冷，现⼿⾜温，稍怕热，热则喘息胸闷症状加重，双膝关节疼痛，以后侧疼痛为甚，左重于右，左下肢腹股沟处有牵制感，偶有下肢⾏⾛乏⼒脚软，下肢怕风，遇风冷则有胀感，做⾜掌怕风尤其重，平素汗多，全⾝出汗，以后枕汗尤甚，汗后⽆⾝冷，稍⼝⼲⽆⼝苦，眼侈不多，视⼒朦，⽿鸣⼗余年，⼝⼲欲饮⽔，饮⽔较多，⼩便⾊不⻩，淡⻩，有尿不尽感，尿后还有，不畅，夜尿3-4次，⼤便⽇⼀次，成型，质可，纳可，吃⽣冷容易拉肚⼦，⽆腹部冷，⽆腹胀⽆反酸，偶有嗳⽓，眠差多梦，⼗余年病史，双下眼俭偏淡⽩，颈腰⽆不适，下肢⽆明显按肿，⽆⾯肿，⾆淡红苔薄⽩，脉右关细滑，⼨尺稍弱，左脉⼨细滑，关尺稍弱。处⼩建中，当归建中，效果不满意，处⽢草泻⼼汤剂，患者诉喘⼤⽓症状有改善，疲倦改善，夜尿次。疑问：这个病⼈⽢草泻⼼汤是否正确，病⼈依从性⽐较⾼，⽢草泻⼼汤感觉有效果，但是我觉得是否没有照顾到整个病机？最想解决喘⽓和失眠问题。接下来如何治疗请许师指点。许师⽈:柴胡桂枝汤，备⽤⽵叶前胡汤。柴胡桂枝汤内有⼀个完整的⽣姜⽢草汤⽅根对治⾥虚合适⽔饮。张圣浩问：可否简单解⼀下。林树元⽈：类厥阴中风偏表位？许师⽈：类厥阴中风。林树元⽈：这个表⾥，难把控啊。必有表，复有⾥也……纠结。张圣浩⽈：常常判断失误表⾥寒热虚实。许师⽈：此案是类厥阴中风，即半阴阳中之偏阴性虚性寒性的中风证，阴经病⽽津⾎不⾜故⾯⾊⻘⻩，神态疲倦，眠差多梦；阴经病多虚寒⽔饮和故⽽⼩便不利尿频⾷冷腹泻；因为半阳的存在故⽽⼿⾜温怕热，热则喘息胸闷加重，（肢节疼痛+胸闷+⾥热证=表束证之兼热邪者）⼝⼲饮多，此热邪风邪半在内也：中风证，津⾎不⾜⽽有表邪，故⽽肢节疼痛怕风怕冷，⽽兼有⼿⾜温怕热，此风邪热邪半在外也：⾥证+胸闷嗳⽓喘满=⾥病+表束⽽⽓不旁流。柴胡汤养津和胃⽓⽽清解热邪，桂枝汤补津液和营卫⽽散风邪。⾼海荣问：刘刚⼥岁年前全⾝泛发⼤⾯红⽪型银屑病在我处治愈，⼀直恢复较好，今天春天因荨⿇疹在医院治疗后诱发旧病。躯⼲四肢散在⽶粒⾄⾖⼤丘斑疹，⾊红突出伴脱屑，微瘙痒。刻诊：⽆怕冷，稍怕热，易汗出，头汗多。腰胯酸困，⾝⽆浮肿，荨⿇疹不时有发，可⾃退。⼿⾜温，不冷，⽆⼿⾜烦热⿇⽊。汗出多但⽪肤较⼲燥甲错。纳⾷可以，⼝⼲饮⽔⼀般，不喜热饮。⼤便正常（有时便溏⾊黑）。⼩便微⻩，晚上睡不着时容易⼩便次数多。⾼⾎压160-100。脉弦滑沉举有⼒。⾆诊⽪损见图。许师⽈：汗后不恶风寒？⾼海荣⽈：不恶风寒。许师⽈：⿇杏⽢⽯汤。外⽤：⼤⻩五倍⼦⽣⽢草积雪草⻁杖煎汤外洗⼀周。⾼海荣问：⽪肤⼲燥严重可以对治么汗较多，但⽪肤显⼲燥甲错。最近还有黑便平时⼀直正常。许师⽈：⽯膏治⼝⼲⾆焦，也可以治⽪肤焦。叶德倡问：⽼师，腰胯酸困，⾝⽆浮肿，荨⿇疹不时有发，是表饮或表束？许师⽈：此阳明热不解则津液不断流失。故⽽⽯膏可以清热⽽护津液。不但伤津，还有轻微的伤⾎，所以有黑便。此案虽⽆浮肿，但是荨⿇疹就是局部的溢饮，溢饮+中风=风⽔。故⽽有⽔病的腰胯酸困，⽔病（兼表）者，发其汗即已。叶德倡问：患者，⽔、⽕、⾎的病机都有了？许师⽈：脉沉者（虚寒）宜⿇⻩附⼦汤。脉浮者（实热）宜杏⼦汤。病机有主次，有根源，依法治之。王庶问：杏⼦汤就是⿇杏⽢⽯汤吗？许师⽈：这个杏⼦汤，医宗⾦鉴考证就是⿇杏⽢⽯汤，暂从。齐永刚问：孙战友男岁140630主诉：左脚外侧疼痛三年多，近半年加重。简要病史：六年前得脑中风（脑溢⾎），经住院治疗痊愈，⽆任何后遗症，三年前中风（脑栓塞）后，左脚外侧疼痛，左⼿中指、⽆名指、⼩指⿇⽊不仁。有⾼⾎压病史多年。刻诊：⾯⾊可，⾝酸懒犯困没精神。左脚外侧疼痛，着凉易抽筋，平时感觉筋短拘挛疼痛。⼩腿怕冷怕风。多汗汗后恶风。⽆头⾝关节痛，⼝⼲不渴⽆⼝苦。纳可，⽆胃腹不适。⼤便不⼲不稀⽇⼀次，尿频急⾊清⽆灼热感。⼼悸，⽆胸胁满闷⽓短，眼花眼⼲，⽆⽿鸣⽿沉。眠好，腿按不肿。⾆边尖稍红，薄⽩腻苔，⽔滑⽆齿痕。脉弦紧。开了副桂枝加⻩芪汤，已经吃了副，今天下午问患者咋样？患者说：昨天疼痛严重，以⾄于没能劳动，今天缓解多了，似乎⽐没吃药前还要缓解些。腿脚拘挛的症状缓解些，汗多，因为天⽓太热没感觉怎么恶风，尿频急没缓解，其他可。许师看看吃完剩下的副后怎么处⽅？许师⽈：桂枝加⻩芪汤正确，估计需要使⽤⼀段时间。等虚热津虚改善后，以虚寒兼表为主再⽤⻩芪桂枝五物汤齐永刚问：如果尿频急始终不缓解是否会⽤到⽢草⼲姜汤。许师⽈：这个⼩便不利桂枝加⻩芪汤可以兼顾。齐永刚问：吕河源男岁140703主诉：早泄半年。简要病史：司机，有两次泌尿系感染病史，经输液基本痊愈。刻诊：⾯⾊可微红，经常熬夜开车，精神可，偶有眼花，怕冷也怕热都不明显，⼿⾜温。纳可⽆胃腹不适，⽆⼝⼲⼝渴⼝苦，⼼烦热，，汗脚。⼤便不⼲不稀⽇⼀次。⼩便淡⻩，尿道⼝疼，尿不尽，会阴部酸胀痛。⽆腰酸腿软，偶头痛，⽆关节痛⽆⾝痛。今早吹空调右⼿关节有点不舒服，汗可，汗后不恶风寒。脾⽓急躁。眠好，腿按不肿，偶有⽿鸣。⾆尖红，薄⽩苔⽆齿痕较润，脉弦紧。昨天开了副⻩芩加半夏⽣姜汤，⼼⾥没底，不知是否正确。许师⽈：这个是五苓散证。⽔热，胃虚，兼表。因为⽔的存在加上胃虚中焦不能固摄下焦所以早泄。⼘彤⽂问：袁⽂玲⼥岁双下肢关节疼五⼗余年，膝盖变形，下肢怕风怕冷，时有⽔肿，脚冷。腰以上怕热，出汗不⽌，腰以下怕冷，腰骶部疼痛。⾷欲不好，吃饭没味，冷热均可，以前有烧⼼反酸证，⽬前没有。⽆胸闷⼼慌⽓短，⼝⼲⼝渴，喝热⽔⽆腹胀肠鸣，⼤便成形，4-天⼀次，⼩便⻩少不利，睡觉少，体⼒可。⾆暗红，中间少苔，两侧⽩苔，左脉⼨缓关浮紧尺沉；右脉⼨弦滑关弦如⾖尺沉弦。⾯⾊萎⻩，体型中等。芪芍桂酒汤⽤副，基本⽆效许师⽈：越婢加术汤。林凡庚问：男孩岁，⾃幼夜间遗尿，现患⼉每晚夜尿次，不易叫醒。⾝怕热，⽆⼝⼲⼝渴，⾷欲好，喜热⾷，腹部怕凉怕风，⼤便可，⽇⼀次，睡眠体⼒可，⾝⽆汗但⼿脚出热汗多，⼩便⾊量正常。⾯⾊发⻩，眼睑红⽩相间，⾆红少苔多津液。右脉⼨沉弦，关尺弦浮；左脉⼨尺沉，关脉弦浮。许师⽈：五苓散。林凡庚问：男主訴：脂溢性脫髮年半。刻診：兩側額⾓上頭髮脫落，髮線後退，頭油多頭⽪多，頭⽪偶有出瘡，頭癢，⾯油亦多，晨起⼝苦，⼝粘，晨起唾液深⾊帶⾎腥味，怕熱，汗出不徹，汗很油，感覺背難出汗，背⽣瘡多致輕微肌膚甲錯，⾷納佳，⾷時頭汗，感覺熱往上攻，不渴飲涼多，⼤便時硬⼀⾄兩天⼀次，⼩便飲⽔少則⿈，刷⽛出⾎，有⿐炎史常有黏痰倒流，無頭暈頭痛，無嘔⼼嘔吐，無浮腫，無怕冷⾝痛，⾆略紅苔略厚⾊⽩潤輕微⿒痕，脈沉弦右略滑。服⽤梔⼦豉湯七服無效許師問診後補充陰囊有點潮濕，師⽈：茵陳蒿湯⼀天兩服，⼀內服⼀外洗頭部，⽤⼒搓洗。⼆診：茵陳蒿湯六服後，感覺不錯，⼤便⼀天⼀次質不實，⼩便⾊深⿈，頭癢頭油減少，藥洗頭時掉髮多(20條左右)⾯油仍多，背出油難出汗瘡不能潰，新增胃偶然不舒服，飯後噫臭氣，⾆紅苔厚微⿈，脈弦滑三診：茵陳蒿湯五服後，跟⼆診差不多，⼤便⼀天⼀次質調，⾷⾁後噫氣多⽽臭。许师⽈：原⽅续进，配合外洗，不能进⾷⾟辣油腻。林凡庚问：杨喜庆，⼥，岁2014.6.28主诉：睡眠不好，梦多，⼼烦，易醒，⼊睡难。刻诊：冬天怕冷，夏天怕热，洗完澡后出汗多。睡眠不好，⼊睡难，易醒，（考虑与⼩孩有关，育有⼀⼥，岁。）⼝⼲苦，⼝黏，不渴，不喜饮，喜凉饮。不觉饿，⾷少。⼤便有时⼀天解2-3次，成型，有时⼲燥，有解不尽感。⼩便勤，5-6次，起夜1-数次，睡不着就像解⼿，尿⼀两滴也得去，⾊淡⻩。冬天⼿⾜凉，⽪肤⼲，⽆甲错，不肿。头痛，头晕，腰感觉坠，三年前尾⾻⾻折。有带下，时多，⾊⻩，有味。经期可，⾊黑红，有⼤⾎块，多。有时痛经，带经5-6天，\n第2-5天量多。⾆淡紫，尖红，薄⽩苔。睑红⽩相间。脉⽞滑，尺沉。处⽅：⼩建中服药三天时说⼼烦睡眠不见改善，⼤便有改善，⽇⼀次，成型，好解，余⽆变化。考虑栀⼦豉汤。许师⽈：温经汤。林凡庚问：刘德新，男，岁2014.7.5主诉：腰跨酸疼两⽉余。刻诊：体型稍胖，⾯黑，肤凉。年冬天时腰部怕冷，睡热炕不觉热，以前没事。年前腰部动过⼿术。⼲活或热则出汗，眠可，⼝不⼲不苦不渴，有⼝臭。爱饮⽔，夏天常温，冬天饮热。⾷可。有时⾷后胀，有⼀天吃冰膏后烧⼼。⼤便⽇⼀次，不成形。在家有时2-3次爱蹲厕所，解也解不出来，似有似⽆。上班时不这样。⼩便5-6次，量可，淡⻩。⽆夜尿。⼿⾜温，⾆淡，中后部⻩腻苔，中间⼀深沟⽆裂纹，前部⽩苔。脉⽞紧，尺沉。许师⽈：先⽤当归建中汤，备⽤桂枝加⻩芪汤。林凡庚问：邓⽟周⼥岁20140704主诉：汗多怕风怕吹空调。刻诊：体型中等，⾯⾊可，眼睑淡红，时有头晕眼花，两侧太阳⽳微痛，⼝⼲，喝⽔少，饮温⽔，纳少，活动后胸闷⽓促，上腹稍胀，⼤便每天早晨̶次，成型，⼩便⾊⻩如浓茶，⼩便勤，时有尿等待，夜尿̶次。⾝怕冷怕风，⼿⾜寒热不显，扪及微凉，活动汗⼤，汗后不凉，肩关节膝关节怕冷，左膝关节疼痛，关节⽆红肿，各关节⽆透风发凉。颈痛腰痛，容易流眼泪，睡眠差，双下肢摸着感觉硬。刷⽛不出⾎，下肢⽆甲错⽔肿。⾆头右偏，上下肢肌⼒正常，活动⾃如。（⼀年前有脑梗塞病史已经治愈）脉象：双脉细沉⾆苔：⾆头偏右，淡红⾆⽔滑⽆苔许师⽈：芪芍桂酒汤。林凡庚问：陆亚凤，⼥，，全⾝关节疼痛，左侧头⽪⿇，嗜睡。⼀诊，脉右浮弦，左沉弦。⾆红紫暗，苔薄⽩腻。眼睑半红半⽩。头晕，左侧稍头⽪⿇，有点头痛，下⾬天⼿指稍凉，⼿掌温正常，下肢摸凉，⾃觉不凉，按压⽆凹陷，⽪肤⼲皱，⽪下有淤⾎。⽆恶风寒，汗出多，汗后⽆恶风，颈正常⼿⾜关节痛，腰痛，脚⾛路重，⼤便每天⼀次成条，偶尔天⼀次。⼩便清⽩，⽩天次正常，夜尿2~3次，胸腹正常，有时会咳嗽⽩痰。饮⽔少，凉⽔。⼝中正常，胃⼝好，饭量可。⽆⽿鸣，听⼒好。⽆⿇⽊⽆抽筋，睡眠好，⽩天想睡，睡觉不知醒。处桂枝附⼦汤。⼆诊，头不晕，还⿇，吃上⽅后咳嗽减少些，两⼿脉都浮弦稍涩，⾝上疼痛感觉明显多了，⼿温，⽆恶风寒，恶热，汗出多，下肢温，⼿⾜关节痛，腰痛，⾛路困难，⼤便每天⼀次，成条，⼩便清⽩，今天⼩便灼热，夜尿两次。眠好，⽩天嗜睡。胸腹正常。饮⽔少，⼝中正常。胃⼝好饭量可。下肢⼲皱，⽪下淤⾎成⽚，⾊暗红，按压有⼀点点凹陷，不明显。有少许咳嗽⽩痰。⾆红紫，苔⽩腻稍⼲微⻩，眼睑半红半⽩。处⽅附⼦汤。许师⽈：⻩芪建中汤，备⽤桂枝加⻩芪汤或芪芍桂酒汤。余翥问：王执海:复诊:主诉:颈痛犯困，腰酸，胃返酸，睡眠差。脉浮细弦，⾆淡红，苔⽩腻，边齿痕。眼睑红。⽆恶风寒，⼿⾜温正常。少汗。头犯困蒙，稍微晕，⼈反应慢。颈肩痛，腰稍酸痛，偶尔⼿⾜⿇。⼤便细烂，⽇次。⼩便⻩，次量正常，夜尿⼀次。胸部正常。胃脘不适，喝⽔吃粥嗯都会返酸，空腹喝碳酸饮料会有⽓上冲到颈部难受欲死。胃⼝差。左侧腹部有点抽，⼝⼲苦，喝⽔偏少（但较之前有改善），睡眠差，有⼝臭。下肢⽪肤稍⼲。第⼀诊主诉是便溏。前五诊⽤的是桂枝加⻩芪汤，前四诊效佳，第五诊守⽅效差。这次开⼩建中汤。之后很久没有见复诊。许师⽈：转⽅应该转⻩芪桂枝五物汤。余翥问：6.4，关惠林，⼥，。主诉:⽉经量少，⼀⽉两次。脉浮弦滑涩。⾆淡紫，苔厚⽩腻润，边齿痕，中间稍⼲。眼睑淡红⻩。下肢⽪肤稍⼲，按压轻微凹陷。有⼄肝病史，B超正常。恶寒，恶风，⼿指稍微凉，⼿⼼温暖，（冬天⼿脚冰凉），汗多，汗出⽆恶风，⽆盗汗。头⽆不适，肩膀酸，腰酸痛，腰腿不沉不抽筋，⼿指偶尔⿇疼，⼤便最近三⽇每天⼀次，前⼲后稀（肠道敏感，受寒凉或者⾟辣刺激就会排便次数增加到每天次伴有灼热感，排空后⼜会连续便秘⽇。）饮凉⽔也会腹痛。⼩便⻩，量多，次数正常，⽆夜尿。冬天有夜尿次，夏天⽆。左胸⼝偶尔闷痛，有前后贯穿感。胃痛，胃⼝差饭量⼩，消化可，余腹正常。饮⽔多，喜欢凉⽔，⼝中正常。⽬前⽆⽿鸣⽆刷⽛流⾎。（以前有⽿鸣）。⽩带少，经期乳房胀痛，⽉经⼀般提前天，量少，先来天，断停⼀两天，⼜来天，⽆⼩腹痛，⾊黑。这个⽉因为⽉经期间喝冷饮，先来天，间断天，于⽉⽇⼜来⽉经，⾊鲜红。眠⼀般，如果中间被吵醒会很难再次⼊睡。处⽅半量⽢草泻⼼汤付。反思：⽣姜泻⼼汤。许师⽈：这是当归建中汤证。林凡庚问：陈慧，⼥，头晕想吐。脉浮涩滑稍数。⾆淡红稍紫，苔薄⽩，边少许齿痕。眼睑浅⻩⽩。下肢⽪肤⼲屑有痒，⽆凹陷。冬天⼿⾜冷，夏天睡觉时有时会觉得⼿⾜凉，刻诊不觉得凉，摸之⼿指温度稍低，⼿⼼温暖。⽆恶风寒，汗少，头晕⽿鸣，右⽿听⼒下降，腰有时酸，⼿有时抽痛，有时⼿⾜⿇，有时⾜烦。⼤便2-3天⼀次，⼲。⼩便⻩，夜尿2-3次，⽩天量次正常。胸⼝憋⽓，胃有时痛，腹胀，饮⽔少，⼝⼲，对⽔温不要求。饭量胃⼝可。眠可。⽩带稍⻩，量少。以往⽉经⽉⼀次，天⼲净，量可。上个⽉同⽉来了两次。间隔天，黑，量少，⽆⾎块⽆肚痛，但是会腰酸。处苓桂味⽢汤。⼤家讨论，觉得陈慧可以⽤温经汤许师⽈：注意把握住⾥邪出表，阴病转阳的⼤规律。温经汤正确。林凡庚问：王丽萍，⼥，。哺乳期想断奶⽔。脉符缓弱。⽆⽉经⽆⽩带。⾆尖红紫，苔薄⽩⼲腻，⾆体瘦。⼿⾜温，⽆恶风寒。恶热汗少，⾝上和⼿臂起⼩痱⼦样暗红成⽚，没有渗出，痒。头稍胀，⼿酸⾜烦，乳房胀，眠可，⼤便成条正常，⼩便频，量⼩，清，⽆尿道不适。胸腹正常，⽿鸣，喝⽔多，凉⽔，⼝⼲苦，⿐塞⻩⿐涕。下肢忘了查看。⻩芪建中汤。反思栀⼦⽣姜豉汤。许师⽈：桂枝茯苓丸。林凡庚问：⾼凯丽。主述:多汗伴流⿐涕打喷嚏⼀周。右脉浮缓细弦（⼨浮缓弦，关细弦，尺弱），左浮涩细（⼨浮涩关细尺弱），⾆淡红暗，苔⽩厚腻，⾯上稍⻩，边齿痕，⾆体胖⼤。眼睑半红半⽩⽔润。下肢按压凹陷，但是恢复的弹性还好，⽪肤⼲燥，有少许裂纹。⼿⾜温热，早上起来眼⽪肿，⼿指⾃觉肿，汗出多，盗汗严重。头稍晕，⿐涕⽩清，喷嚏多，洗热⽔，恶寒，恶风，但是热则汗出，汗后恶风。肩膀酸痛。⼿臂肌⾁酸痛。有时抽筋。⼤便正常成条，⼩便稍频，分钟⼀次，时⻩短时清，量⼀般，饮⽔后则多，夜尿次。饮⽔量可，凉⽔温⽔都⾏。胃有返酸恶⼼，饥饿痛，稍胀。⼝⼲稍苦。胃⼝好。⽩带⻩，量少。⽉经提前周，前天多，天⼲净，红，有⾎块，痛经。⼊睡困难，睡后深。晨起乏⼒。有⼦宫肌瘤。之前医⽣给桂枝汤，吃⽣姜则⼩腹阴道疼痛，检查提⺬⼤前庭性囊肿。芪芍桂酒汤。师⽈正确，之前医⽣没搞明⽩热在哪⾥，⽤苦酒配则⼒量下⾏，⽣姜配桂枝则发表，湿热不能除也。余翥问：陈永胜，复诊，男。⼀诊以胸⾻后疼痛嗳⽓半年，师⽈枳实栀⼦豉汤，守了两诊，⾃⼰⼜去再抓了付，共付。诊，胸⾻疼痛减轻，闷堵的感觉往上⾛，胸⼝上部分闷堵，脖⼦两侧觉得紧胀，头顶嗳⽓时胀痛，嗳⽓，乏⼒，⼤便肛门灼热感觉减轻。脉浮弦缓，左脉较之前变细。⾆淡紫暗，苔⻩⽩腻润，苔⾯有裂，边齿痕。眼睑半红半⽩。下肢⽪肤⼲，⼩腿凉，有脱⽪，⽆凹陷，⾃觉不凉。恶热，汗多，头痛，颈侧胀痛伴⿇，⼿⾜⿇，⼿温正常。腰稍酸。⼤便时肛门有点灼热，但是这个也减轻，⼩便正常。胸⼝闷，嗳⽓还是有点痛，胃脘疼，两侧肋⾻痛。饮⽔少，咽⼲，厌恶喝⽔，温凉都可以。⼝苦⼝⼲黏。眠可，胃⼝好。做了⼿针，当时觉得闷痛减轻。⼜守了付枳实栀⼦豉汤。这⾥有没有四逆散的可能许师⽈：四逆散正确。余翥问：4.23，⼥，，咳嗽伴⽩稀痰⽉余。脉缓稍浮滑。⾆淡稍紫，苔⻩⽩腻厚。颈僵不适，头不晕，⼿⾜凉，⼿指关节⿇痛，膝盖痛，腰痛，腰腿没有沉重，⾜肿，按压稍凹陷，下肢⽪肤⼲燥脱⽪屑。⽆恶风寒，背后⽆冷痛，汗少，晚上咳嗽加重，⼆便平，胸腹⽆不适，⼝苦⼝⼲，饮⽔少，胃⼝可。处⽅⼩⻘龙汤，配合五苓散。后来反馈加重，没再复诊。反思真武汤这个之前我们群⾥讨论过。许师⽈：射⼲⿇⻩汤。余翥⽈:伯⽗，近⽇胸⼝胃脘闷胀钝痛不适，脉浮涩稍滑弦，⾆淡暗紫，⽔滑，苔光剥镜⾯，中间裂纹，边有轻度齿痕⼩⾎丝。眼睑半⽩半淡⻩，眼袋明显。下肢⽪肤⼲，⼩腿凉，按压略凹陷。稍微恶寒，⽪肤凉，汗出⼀般，⽆盗汗，汗后恶风。右肘运动损伤，余关节⽆疼痛。有时⼿⿇，⾜底有时发热。⼿⾜温度正常。⼤便⼀天1-2次，烂，昨天黑便，今天颜⾊正常。⼩便时稍⻩时清长，夜尿次，胸痛闷，钝痛，胃稍胀，嗳⽓后舒服，⽆肠鸣，饮⽔量⼀般，温⽔。运动后疼痛减轻。饭量⼀般，胃⼝差。⼝稍黏，有⽩痰，不咳嗽。思考四逆散。师⽈：外台茯苓饮。\n第十一課三瀉心湯源流詳解之一源三岐篇（2014.7.12）⼀、三泻⼼汤条⽂解析（⼀）半夏泻⼼汤条⽂解析：仲圣全书中半夏泻⼼汤条⽂凡两见：⼀见于《伤寒论》条：“伤寒五六⽇，呕⽽发热者，柴胡汤证具，⽽以他药下之，柴胡证仍在者，复与柴胡汤。此虽已下之，不为逆，必蒸蒸⽽振，却发热汗出⽽解。若⼼下满，⽽硬痛者，此为结胸也，⼤陷胸汤主之；但满⽽不痛者，此为痞，柴胡不中与之，宜半夏泻⼼汤。”⼀见于《⾦匮要略·呕吐哕下利病脉证治第⼗七》：“呕⽽肠鸣，⼼下痞者，半夏泻⼼汤主之。”伤寒五六⽇，到了向⾥传变的时间了，⼀般是传少阳和阳明的。并且在五六⽇这个时间段上，最多见的是传少阳。要是传到了少阳经，会出现以呕和发热为主的柴胡汤证，这是此条与半夏泻⼼汤主治相关的简约⼤义。⽽要想详尽的诠释条，解析透彻这个“柴胡证”则尤为重要，因为这个柴胡证是下⾯各证的发病肇始和基础。“呕⽽发热者，柴胡汤证具”，柴胡汤证可以包含呕和发热，但是就这两个症状肯定还不能俱全。那么欲知伤寒五六⽇的柴胡汤证还会有哪些症候群，则需要先联系到条和条来综合补充：《伤寒论》条：“伤寒五六⽇，中风，往来寒热，胸胁苦满，嘿嘿不欲饮⾷，⼼烦喜呕，或胸中烦⽽不呕，或渴，或腹中痛，或胁下痞硬，或⼼下悸、⼩便不利，或不渴、⾝有微热，或咳者，⼩柴胡汤主之。”《伤寒论》条：“伤寒五六⽇，头汗出，微恶寒，⼿⾜冷，⼼下满，⼝不欲⾷，⼤便硬，脉细者，此为阳微结，必有表，复有⾥也。脉沉，亦在⾥也。汗出，为阳微。假令纯阴结，不得复有外证，悉⼊在⾥，此为半在⾥半在外也。脉虽沉紧，不得为少阴病。所以然者，阴不得有汗，今头汗出，故知⾮少阴也。可与⼩柴胡汤。设不了了者，得屎⽽解。”可见伤寒五六⽇病传少阳的柴胡证是⼀组复杂的症候群，可以有多种症状出现。之所以能有这么多症状出现，是因为少阳病具有“必有表，复有⾥”、“半在⾥半在外”的特点。从病机上来分析，能称为典型的少阳病柴胡证则必须符合四⼤要素：、邪⽓交争于半表⾥；、上焦郁⽕；、中焦胃虚；、下焦饮逆。少阳病的寒热往来杂错是因为邪⽓交争于半表⾥导致，邪⽓出⼊表⾥之间，外出近太阳则有恶寒感，内⼊近阳明则有恶热感。所以少阳病柴胡证就处于这么⼀个特殊的“半在⾥半在外”的状态上，邪⽓要⼊⾥，⽽⾥⾯的胃⽓津液还不太虚，还有⼀定的抗病能⼒，还要奋起抗邪外出，就会出现邪正交争频繁、表⾥虚实寒热互杂的状态。故⽽古⼈有少阳是枢机之说，病情的转化，特别是阳经病情的转化，到了少阳这个层⾯就会呈现出⼀种动态的⽴体的变化的战场状态。正如《伤寒论》条所⾔：“属少阳……此属胃，胃和则愈”，可见，少阳病是需要以健壮中焦胃⽓为治主的，表⾥不和治其中，保胃⽓，存津液，尤其重视中焦和胃⽓津液。说到柴胡证，绕不开的还有⼀段伤寒学术研究中的公案，那就是“柴胡证，但见⼀证便是，不必悉具”这段经⽂，我们来看⼀下：《伤寒论》条：“伤寒中风，有柴胡证，但见⼀证便是，不必悉具。凡柴胡汤病证⽽下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸⽽振，却发热汗出⽽解。”后世不能真解此条，反⽽因此⽽成为有些医者滥⽤柴胡剂的依据。每每断章取义，⾔之凿凿⽈：仲圣条⽂明⾔但见⼀证便是！故凡见⼝苦咽⼲⽬眩胁满喜呕即常常处以⼩柴胡汤，不效亦不知悔改，去圣义已远！若要彻解此条疑案，亦须与上述条相互参校：《伤寒论》条：“伤寒五六⽇，中风，往来寒热，胸胁苦满，默默不欲饮⾷，⼼烦喜呕，或胸中烦⽽不呕，或渴，或腹中痛，或胁下痞硬，或⼼下悸，⼩便不利，或不渴，⾝有微热，或咳者，与⼩柴胡汤主之。”我们需要注意这七组或然证，“或胸中烦⽽不呕，或渴，或腹中痛，或胁下痞硬，或⼼下悸，⼩便不利，或不渴，⾝有微热，或咳者”。如上所述，太阳伤寒或中风五六⽇，到了向⾥传变的时间后，五六⽇以传少阳多见，⽽传少阳即是传⼊半表半⾥，即“必有表，复有⾥”、“半在⾥半在外”。前⾯已经申明，典型的少阳病柴胡证必须具备四⼤病机，即邪⽓交争于半表⾥；上焦郁⽕；中焦胃虚；下焦饮逆。具备了这四⼤病机才能算是典型的少阳病，即少阳本病，也叫柴胡汤证、柴胡证。那么柴胡证会有些什么样的症状出现呢？通过通篇阅读少阳篇条⽂我们得知，少阳病柴胡证以七种症状为常见。即条的提纲证：“少阳之为病，⼝苦，咽⼲，⽬眩”，加上条的：“往来寒热，胸胁苦满，默默不欲饮⾷，⼼烦喜呕”，会有这七种常见的症状出现。从病机的⾼度来看来，外在的症状都会由内在的病机引起，⽐如这组症状：、邪⽓交争与半表⾥（往来寒热）、上焦郁⽕（⼝苦，咽⼲）、中焦胃虚（默默不欲饮⾷，胸胁苦满）4.下焦饮逆（⼼烦喜呕，⽬眩）这是作为典型的少阳病必须具备的病机和惯常出现的症状，所以也叫柴胡证，⽤典型的主⽅汤剂代⾔典型的病名是仲圣惯⽤的笔法，就像⽤柴胡证代表少阳病，⽤桂枝证代表太阳病等。那么条“但见⼀证便是”怎么解呢？.伤寒中风，有柴胡证，但见⼀证便是，不必悉具。凡柴胡汤病证⽽下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸⽽振，却发热汗出⽽解。太阳伤寒或中风传变到半表⾥后，“有柴胡证”，即具备了典型少阳病的四⼤病机了，但是同样的病机在不同的⼈体会引起不同的症状。通过前⾯我们知道典型的少阳病会有七种症状出现，⽽在条则既描述了典型的症状，也提出了七种或然证。所以才会说，“但见⼀证便是，不必悉具。”因为这七个或然证都是前⽂七个典型症状的演变⽽已。它们在病机上有必然的内在联系，⾮此即彼，虽然没有出现典型证，出现了演变的或然证也⾏，也是属于“柴胡证”。⽐如：（⼀）病⼈虽然没有出现“寒热往来”，但是出现了“或不渴，⾝有微热”。不渴是排除阳明病的标志，为什么要排除阳明病？说明病⼈有明显的发热。但是经过仔细四诊，发现病⼈的热只是“⾝有微热”，潜台词就是说这个热不是阳明的壮热，⽽且还会有些偏虚偏寒的成分夹杂。仲圣书见“⾝有微热”者凡两条，⼀者为本条；⼀者为《⾦匮·呕吐哕下利病脉证之第⼗七》：“⾝有微热，见厥者难治。”这两条都不是真正的实⽽热，都是热⽽夹虚夹寒之证，符合邪正交争之病机，⼀见于少阳（伤寒条），⼀见于厥阴（⾦匮条）。（⼆）病⼈虽然没有出现“胸胁苦满”，但是出现了“或胁下痞硬”。这是因为初期的中焦胃虚不能运化则可致中焦停饮⽽胸胁苦满，胃虚到了⼀定的程度还会中不制下，下焦的浊⽔浊⽓上攻⽽导致“或胁下痞硬”，这都符合中焦胃虚的病机。（三）病⼈虽然没有出现“默默不欲饮⾷”，但是出现了“或腹中痛”，亦皆是中焦胃虚运化不及津虚不养之故。（四）病⼈虽然没有出现“⼼烦喜呕”，但是出现了“胸中烦⽽不呕”，皆是下焦之⽔饮上泛冲逆到⼼胸喉咽等上焦所致。（五）病⼈虽然没有出现“⼝苦”，但是出现了“或咳”，皆是因为上焦郁⽕所致，⽕郁于肺系则咳，郁于喉咽则⼝苦。（六）病⼈虽然没有出现“咽⼲”，但是出现了“或渴”，皆是上焦郁⽕灼津所致。（七）病⼈虽然没有出现“⽬眩”，但是出现了“或⼼下悸，⼩便不利”，皆是下焦饮逆上冲所致，⽔饮上冲则⼩便不利，上冲到⼼下则悸，上冲到头⽬则眩。以上这七组⽐较症状，每⼀组都是⾮此即彼，只要出现了其中之⼀，就说明符合典型少阳病柴胡证的病机，这才是“有柴胡证，但见⼀证便是”的真意。当然，我们上述这些症状之所以能成⽴柴胡证的前提是必须符合少阳病的四⼤病机，⽽不能把着⼒点放在症状的层⾯上。因为治伤寒之学，不论是做临床实证还是做学术研究，单纯⽤症状去对应⽽不上升到病机的⾼度去统摄的话，往往捉襟见肘，流于表⾯，不能明⼼见性，更不可能达到执⼀经⽽御万病，⼀部伤寒治天下的境界！即如我们上述所做的分析，⽆⼀不是在病机上着⼒，⽆⼀不是在病机上打算！舍此病机⽽⾔伤寒，往往开⼝动⼿便错，⽐如这组症状：⼝苦，百合病亦可见（《⾦匮·百合狐惑阴阳毒病证治第三》“百合病者……如寒⽆寒，如热⽆热，⼝苦”）；咽⼲，瘀⾎病亦可见（《⾦匮·惊悸吐衄下⾎胸满瘀⾎病脉证治第⼗六》“病⼈胸满……⼝燥……为有瘀⾎”）；⽬眩，失精亦可见（《⾦匮·⾎痹虚劳病脉证并治第六》“夫失精家……⽬眩”）；往来寒热，⼀般认为这是少阳病的标志性症状，可以铁证如⼭了，其实也不尽然，⽐如寒热往来在奔豚病亦可见（《⾦匮·奔豚⽓病脉证并治第⼋》“奔豚⽓上冲胸，腹痛，往来寒热……奔豚汤主之”）；胸胁苦满，腹中寒⽓亦可见（《⾦匮·腹满寒疝宿⾷病脉证治第⼗》“腹中寒⽓……胸胁逆满……附⼦粳⽶汤主之”）；不欲饮⾷，阳明⾥实亦可见（《伤寒论》条“下利不欲饮⾷者，有宿⾷也，当下之，宜⼤承⽓汤”）；⼼烦喜呕，太阳中风、太阳伤寒亦可见：太阳中风：（《伤寒论》条“太阳病……反烦不解者……却与桂枝汤则愈”；《伤寒论》条“半⽇许复烦……宜桂枝汤”；《伤寒论》条“太阳中风……⼲呕者，桂枝汤主之”）；太阳伤寒：（《伤寒论》条“太阳病……呕逆……名为伤寒”；《伤寒论》条“太阳病……其⼈发烦……⿇⻩汤主之”）。只有阐释清除了柴胡证，才具备解读条的基础，现在我们回到条上，来看看少阳病柴胡证误下后导致的三种转归：.伤寒五六⽇，呕⽽发热者，柴胡汤证具，⽽以他药下之，柴胡证仍在者，复与柴胡汤。此虽已下之，不为逆，必蒸蒸⽽振，却发热汗出⽽解。若⼼下满，⽽硬痛者，此为结胸也，⼤陷胸汤主之；但满⽽不痛者，此为痞，柴胡不中与之，宜半夏泻⼼汤。柴胡证具备时，可以⽤柴胡汤去和解外邪（条⼩柴胡汤以解外）、宣通上焦（条上焦得通）、润下津液（条津液得下）、调和胃⽓（条胃⽓因和）⽽推陈致新（《本经》柴胡药症），则在表可以得汗⽽解（条），在⾥可以得屎⽽解（条）。“柴胡汤证具，⽽以他药下之，柴胡证仍在者，复与柴胡汤”，这是说柴胡证必须⽤柴胡汤兼顾表⾥、三焦、胃⽓、津液，和解⽽润下，要是单纯的⽤他药攻下，会出现三种变证：、柴胡证（少阳证）：攻下的较轻或病者的正⽓尚可，胃⽓津液亏损不甚，病邪还是处在少阳的病位，还是柴胡证的所主范畴。复与柴胡汤调和表⾥和胃保津得战汗即可解；、结胸证（阳明证）：病发于阳⽽反下之，热⼊因作结胸（《伤寒论》条），结胸证见⼼下满、硬、痛，需要⽤⼤陷胸汤峻下热实对治；、痞证（类厥阴证）：病发于阴⽽反下之，（寒⼊）因作痞也（《伤寒论》条），阴证为主的痞证⼼下以满为主，常伴有“呕⽽肠鸣”《⾦匮要略·呕吐哕下利病脉证治第⼗七》，需要⽤半夏泻⼼汤去调和寒热虚实对治。今天讲到这⾥，谢谢⼤家。\n第十二課病案講解（2014.7.19）崔丽问：男，发烧，汗出多，热汗，怕风，咳嗽，⽩痰，体温度以上，昨晚接近，⼝唇⼲欲饮，饮温，饮后不解渴，⿐塞流清涕，眼睛发胀，⾝上⽪肤发热，⼿⾜⼼发烫，⾝体肌⾁发强，⼤便溏，⼀天两次，⼩便⻩，⼼下隐隐不适。⼩腿轻微⼲燥，⾆淡红，尖偏红，有红点，苔薄⻩，有裂纹，润。下眼睑发红。许师⽈：葛根芩连汤。杨永东问：何晓玲岁，⼥140707主诉：⽉经推迟半⽉未⾄。病史简要：患者曾因⽉经延期来诊，治疗后经⾄。此次⽉经延期半⽉未⾄，再来诊治。有⾼⾎压病史。上诊⽤⽣姜泻⼼四剂，服完经⾄。刻诊：冬季怕冷,夏季不怕风冷，头部胸背汗出多，汗出不怕风，汗出⽆⾝凉。右⼿指关节觉凉痛，触之凉。经前期⾝起荨⿇疹，多见于四肢颈背，⾊红，痒。时头晕，⼝不⼲不渴不苦，⽆⽿鸣。纳可，饮⾷稍油腻及饮⾷⽣冷则⼤便溏，⽇⾄次，⽆肠鸣，⽆胃部不适。⽆⼼慌胸闷，⽆胸胁不适。⼩便不频，不起夜，颜⾊不知，不欲饮⽔，。⽆⽩带。⽉经量少，⾊鲜红，有少量⾎块，经期天。经前腰痛，经前腿脚凉，触之凉，阴道⼲燥，瘙痒。脚底⼲燥。左脉弦细时弱，右脉弦细尺弱，⾆胖齿痕。尖粉红苔腻略⻩。⻩建剂。140714刻诊：⼀诊⽉经已来，此次服药中，头脑清晰，⾎压正常，停药后，⾎压反弹，头晕，有飘起来的感觉。⾝不怕冷，服药后脚透风感，⼿皱。⾝热时出汗多，汗出⾝不凉，不怕风冷。⾝易痒，搔之出现紫红的疹，易消退。⼝不⼲不渴不苦，⽛齿松动感。纳可，⼤便溏⽇两次，量少，吃油腻便溏。⽆肠鸣，⽆⼼慌胸闷，⽆胸胁不适。⼩便不频，⾊淡⻩，量少喝⽔量可，不欲饮⽔。⽆⽩带，阴道⼲燥，瘙痒。⽉经量少，⾊鲜红，少量⾎块，经期天。眠可。脉弦尺稍弱，右脉弦略缓尺沉弦⾆淡齿痕尖粉红，苔薄⽩中部苔略腐腻⾆润。芪芍桂酒汤剂140719服药后，腹部不适有时肠鸣⼤便⽇3-4次稍有稍⾷油腻即腹泻⾎压反弹，现⾎压110-150，右⼿僵硬。⾝⽪疹增多⾊红，脚不凉，⽛齿松动感减轻，阴道⼲燥瘙痒缓解，最近未明显不适。刻诊：不怕风冷，汗出很多，汗后不怕风，睡眠五六⼩时，有时醒来⽆法⼊睡，但不觉疲劳。不想喝⽔，⼩便不频，⾊淡⻩，量少喝⽔量可，劳累腰椎痛。⼿觉凉，但触之热。⾆淡齿痕尖粉红，苔薄⽩中部苔略腐腻⾆润。左⼨关弦实尺沉右⼨关浮弦吃弦。许师⽈：⽪肤有异常的最好有照⽚，现在⼿机上传很⽅便。杨永东⽈：好的⽼师下次注意。许师⽈：⾊红，有深红、淡红、紫红、暗红等区别，都会提⺬不⼀样的病机。深红多实，淡红多虚，紫红多热，暗红兼寒。杨永东⽈：他这个深红。搔之成⼩⽚。许师⽈：⽢草泻⼼汤，⽣⽢草。余翥问：…暗红和深红，⽼师，这听上去颜⾊好像⼀样。许师⽈：深红，红之甚者。暗红，红之灰暗者。杨永东问：李春玲岁140714主诉：头胀脚迈步没准，偶有⾆根硬⾔语不利。刻诊：去年⽉，因脑⾎栓⼊院治疗，后中药调治，⾆硬语⾔不利头部不适等基本痊愈。半⽉前动怒后，头胀，迈步没准，偶有⾆根硬⾔语不利。怕热，热时⾝汗多，汗出⾝凉，汗后不怕风冷。⼿⾜⼲热，触之⼿⼼热，⼿⾜不易汗出。头顶及头两侧胀，右侧太阳⽳后侧⾎管跳动。有时印堂处不适。有时失眠，每⽇点醒来后不能⼊睡。上午困倦,但打⿇将⽆困倦。⼝不⼲不渴不苦，不⽿鸣。⽆⼼慌胸闷，⽆胸胁不适，胃部⽆不适，纳可。腰骶活动时痛，按之不痛。⼤便⼀⽇⼀次成型，⼩便⽇4.5次，⼩便量可⾊清。⽉经周期规律，天，量可，⾊黑有⾎块。少量⽩带，⾊⽩质稀。⼿脚⼲燥，阴道⼲燥，脚脱⽪。觉⾝体皱似缺油。脉弦实尺紧⾆质红尖红苔薄腻略⻩续命煮散剂140719服⽤续命煮散后，头胀稍缓解，乏⼒⽐以前严重。脉沉弦实（有弱像），最近两天⾼温天⽓，⽩天汗很多，晚上很热。许师⽈：⾯⾊怎么样。杨永东⽈：⾯⾊⻩略红。许师⽈：没做腿诊吗？杨永东⽈：腿⽆甲错，⽔肿。许师⽈：腿⽆甲错⽆⽔肿？杨永东⽈：我记得是⼀诊是这样⼆诊匆忙给忽视了。许师⽈：这个医案有个鲜明的特点，那就是津⾎不养导致的表束。需要⽤补养津液⽽解表的法则。太阴中风邪风虚热+⾎痹的层⾯，⽤⻩芪建中汤。⽅根是太阴中风的总⽅根⻩芪配⽣姜。还有芍药⽢草汤滋津液。这种表在津⾎充养的基础上才能解得透。简⽽⾔之，即是津⾎虚⽽兼感受外邪。⽽续命煮散的⽅根是越婢加术汤，必须有⽔饮特别是风⽔和溢饮为主才可以使⽤。谢明问：津⾎虚为何会多汗？许师⽈：多汗表虚，这既是津⾎不⾜的病机，也是津⾎不⾜的病因之⼀。⼘彤⽂问：⼿脚⼲燥，阴道⼲燥，脚脱⽪。觉⾝体皱似缺油̶̶⽼师这组症状能看出津液亏乏，病⼈⾎亏症状有哪些？许师⽈：⾯⾊⻩⽉经⾊黑有⾎块。叶德昌问：2014/7/19，周某，男，岁，双⼿关节红肿痛，畸型，下⾬天痛甚，近⽇双肘部关节和脚趾关节酸软，精神可，⾯⾊偏红，怕热，多汗（喝温⽔更甚），汗后不冷，不怕风，⽆头晕、痛，⼝不⼲，喜冷饮，纳可，⼤便可，⼩便稍⻩，四肢⽆浮肿，⽆甲错，⾆如图，脉浮数。患者做过先天⼼修补术，这次发病省医检查诊断为痛风。许师⽈：⽩⻁加桂枝汤。叶德倡问：⽼师，要服多久？许师⽈：先吃⼀周。程⾦亮问：⼥岁20140713复诊：前额眉间粟粒样⼤⼩暗红⾊丘疹伴黑头，额头⿐部下肢有数块⻩⾖⼤⼩⽪损，⾊红伴少许鳞屑，不瘙痒。近⽇因连绵下⾬⾃觉怕冷，汗少。颈背酸痛好转，前⼏天因打乒乓球突然⾯⾊晄⽩⼝唇发紫头晕汗出⽽晕倒，后经休息缓解。⼝唇稍⼲，⼝⼲⼝渴不喜饮⽔，喜欢凉⽔。纳可，钠后⽆不适，⽆烧⼼反酸。⼩便可因吃⽔果多⽽次数增多，⾊微⻩，⽆夜尿。⼤便偏⼲，⽆便难，⽇⼆⾏。⽉经⼗号来潮，⾊鲜红，⽆⾎块，量少，⼀天换卫⽣⼱两⽚。经时⼩腹绞痛。⽆⽩带。下眼睑淡红有少量⾎丝，下肢⽆⽔肿，肌肤稍⼲燥，触⼿温。⾆暗红苔薄⻩腻润，⼨关脉滑弱尺沉弱。三物⻩芩汤苦参⻩芩⽣地付外洗：⼤⻩⽣⽢草五倍⼦⽩芨积雪草没药⻁杖⻩芪外洗。20140719复诊前额眉间粟粒样⼤⼩暗红⾊丘疹伴黑头，额头⿐部下肢有数块⻩⾖⼤⼩⽪损，⾊红伴少许鳞屑，不瘙痒有数个新发⽪损。⾃觉怕冷，在吹风扇的室内觉⾝冷⼿⾜凉。不爱出汗，近⽇锻炼⾝体后可有上半⾝汗出，汗后不觉冷。头晕，蹲起后头晕明显，眼前发黑。颈背酸痛缓解。⼝唇稍⼲，⼝⼲⼝渴，喜欢喝凉⽔。纳可，纳后⽆不适。⽆烧⼼反酸。⼩便⾊微⻩，次数不多，⽆夜尿。⼤便成条质偏稀，⽇⾏。上次经⾏天，⾊鲜红，量少⽆⾎块。⽆⽩带。⼿触温，腿部触凉。下肢⽆⽔肿。⾆暗红苔薄⻩润，脉⼨关弦滑尺弱。（注：下肢⽪损⼀直未⽤外洗药）许师⽈：疗效还不错。原⽅续进。许师⽈：和⼤家说⼀下三物⻩芩汤。这个⽅⼦苦参⽤⼆两的话患者会呕吐，通过临床验证，把⻩芩和苦参的剂量互换（苦参⼀两，⻩芩⼆两，⽣地四两）。在苦的性味总量上还是⼀样的，还没有副作⽤。林凡庚问：⽼师，没药在外洗的药物中起什么作⽤？许师⽈：化瘀去滞。对溃疡⾯还有护膜⽣肌的作⽤。并且是树⽪的分泌物，以⽪治⽪。没药⽤⽣的。盛长⻘⽈：《千⾦》三物⻩芩汤⻩芩（⼀两）苦参（⼆两）⼲地⻩（四两）上三味，以⽔六升，煮取⼆升，温服⼀升多吐下⾍。刘旭⺠⽈：李国⽟⼥岁主诉：双下肢腹股沟⽪炎就诊。病史简要：患者于⽉份，不明显诱因出现下肢，⼤腿，腹股沟出现透明⽔泡，⽔疱可随病情发展出现⾎疱、糜烂、结痂。中⻄医治疗效果不理想。⽉⽇医院病理检查诊断“天疱疮”，医院给予强的松⽚每天两次及其他对症治疗。刻诊：⾯部浮肿，体重⽐以前增加3.5公⽄。眼睑淡⽩。下肢按压不肿，⽆肌肤甲错。双⼿扪及温，⼝不苦，微⼲，喝⽔不多，饮温⽔。⾝⽆怕风怕冷，⼿⾜寒⽇不显，⼤便两天⼀次，⼲燥，量少。⼩便⾊⻩，每⽇̶次，夜尿1-2次，⽆尿频尿急尿等待。⽆腹痛腹胀，⾷欲⽐以前⼤增，容易饿，（⾃述激素导致），睡眠可，多梦，活动后汗⼤，汗后不凉。各关节⽆疼痛，⽆透风发凉。下肢⼩腿容易抽筋。下肢可见很多恢复的疮印，有⼏个地⽅散在的⽪炎，少量渗出微痒。双脉沉缓淡⽩⾆微⼲台稍刘旭⺠⽈：患者现在停了强的松。很多患者要醋调，但是不上⽪肤是怎么回事。涂上马上掉下，是什么原因。许师⽈：沾不上吗？刘旭⺠⽈：是的。许师⽈：⽪损的地⽅⼀般会⾃⾏的粘药的。有⽪损的地⽅⽪肤不光滑应该能粘药呀。刘旭⺠⽈：⼤⻩⻩连五倍⼦醋调。许师⽈：治的哪种⽪肤病。刘旭⺠⽈：就是这个病⼈。许师⽈：这上⾯是氟美松沫⼦？刘旭⺠⽈：炉⽢⽯。许师⽈：这样的地⽅不沾药，⽪损粘药。刘旭⺠⽈：是的。许师⽈：那就对了，这样不沾药的地⽅⽤汤剂洗。刘旭⺠⽈：这个患者整体改善很好。许师⽈：现在⾯部浮肿？刘旭⺠师⽈：好了⼤半。许师⽈：防⼰⻩芪汤。外⽤：没药⽣⽢草⽣地积雪草外洗⼀周。⼘彤⽂问:袁⽂玲⼥岁双下肢关节疼五⼗余年，膝盖变形，下肢怕风怕冷，时有⽔肿，脚冷。腰以上怕热，出汗不⽌，腰以下怕冷，腰骶部疼痛。⾷欲不好，吃饭没味，冷热均可，以前有烧⼼反酸证，⽬前没有。⽆胸闷⼼慌⽓短，⼝⼲⼝渴，喝热⽔⽆腹胀肠鸣，⼤便成形，1-天⼀次，⼩便⻩少不利，睡觉少，体⼒可。⾆暗红，中间少苔，两侧⽩苔，左脉⼨缓关浮紧尺沉；右脉⼨弦滑关弦如⾖尺沉弦。⾯⾊萎⻩，体型中等。许师指导越婢加术汤，服⽤后⼿指抽搐，患者不敢再服⽤，请问是何原因？许师⽈：剂量发上来。⼘彤⽂⽈：⿇⻩克⽯膏克⽣姜⽢草⼤枣枚⽩术许师⽈：抽筋是津液伤损了。⼘彤⽂⽈：病⼈出汗是很厉害。许师⽈：中风+溢饮=风⽔。此案有⾯⾊萎⻩，考虑到津⾎不⾜，所以加了⽩术。⽩术+⽢草姜枣可以补津液健胃治⽔⽓。但是还是⼒量不⾜。林树元问：这个是从⽩术附⼦汤来的吗？许师⽈：是的。⼀阴⼀阳。⼘彤⽂问：我的那个病案需要改什么⽅⼦那？许师⽈：服了⼏剂。⼘彤⽂⽈：四剂。许师⽈：从⼏剂后抽筋的。⼘彤⽂⽈：\n第⼆副，后两服是两天⼀副。许师⽈：汗出怎么样了。⼤便怎么样了。⼘彤⽂⽈：还是⼤汗，症状没什么变化。基本⼀天⼀次，成型的。许师⽈：腰以上还怕热？⼘彤⽂⽈：是的。许师⽈：下肢还⽔肿？⼘彤⽂⽈：不肿。以前有时有⽔肿许师⽈:脚还冷？⼘彤⽂⽈：下肢冷稍好点许师⽈：有时有⽔肿？初诊的刻诊有⽆⽔肿？⼘彤⽂⽈：没有。许师⽈：以后要描述清楚。许师⽈：以后的医案，按照我的模板医案描述，再这样上来乱呼呼的⼀团我不会解的。许师⽈：病案模板迟⽟萍，⼥，岁。初诊⽇期：年⽉⽇。主诉：腹胀五年，加重半年。病史简要：患者腹胀五年，伴有⽓串⾄肢体疼痛，揉按腹部或肢体即嗳⽓成串。刻诊：腹胀，⽓串⾄肢体即疼痛难受，阴⾬天上肢尤不适，捶按肢体或腹部即嗳⽓连连成串，时有肠鸣，饮⾷不慎易呕吐。⽆⼝⼲⼝苦，饮纳可，⼤便⼲燥，⼀⽇⼀⾏，溲可。唇略燥，下睑半红半⽩，⾯黑晦暗不华。⾝⽆怕风怕冷，时阵汗，汗后不凉。偶觉肢体凉，扪之⼿腿不凉。⽉经周期三⼗四五天，经期⼆三⽇，经⾊可，量偏少，⽆块，时经期头痛⾝痛，⽆腰腹痛。⾆脉：脉沉弦滑尺微浮，⾆淡红嫰胖质厚苔⻩⽩浮腻。许师⽈：这样的模板。姓⽒，性别，年龄，初诊⽇期，主诉，病史简要，刻诊，⾆脉。必须严谨。余翥问：男，，咳嗽⽉。脉浮涩细，右稍弦，左涩弱⾆淡红紫，苔⽩润腻稍⻩，边少许齿痕。眼睑半红半⽩。下肢按压有少许凹陷，不明显，⽪肤正常，⼩腿⽪肤凉。⼿⾜掌温度正常。⼿臂⽪肤凉。⽆恶风寒，喜欢吹冷⽓，动则汗出，但是喜欢洗温⽔。汗出吹风咳嗽多。咳嗽没有痰吐出，咽喉不⼲不疼，没有异物感。有⿐塞，⿐涕⻩。头⾝四肢⽆不适。⼤便每天⼀次，⼩条，黏。⼩便次数量⾊正常，⽆夜尿。胸闷少许，胃脘稍胀，⽆反酸嗳⽓。饮⽔量⼀般，最近喝温⽔，没病之前喜欢冰⽔。⼝中正常。胃⼝好，饭量多。睡眠可。考虑⼩⻘龙加⽯膏汤。未处⽅。许师⽈：⼩⻘龙加⽯膏汤正确。余翥问：关魁，男，全⾝⽪肤痒，全⾝都有⼩痱⼦暗红点疮，⾝上⽪肤颜⾊暗，有的有脓头，⼿指中间也有。怀疑疥疮。脉浮稍紧滑，左浮滑紧弦。⾆淡红，胖，苔⽩腻，中间裂纹。眼睑半红半⽩。⼿肤温，⾝上燥热，恶寒恶风，⿐塞，稍恶热，汗多，喜欢温⽔。头有时晕，⽛齿稀疏脱落，肩膀有点酸疼，腰稍酸疼，⼿⾜不⿇不酸不烦，脚凉。下阴潮湿，阴茎冷，⼤便溏，每天⼀次⽆腹痛⽆臭味。⼩便清，次数多，夜尿次，量可。有时⼼慌。胃⼝差，饭量⼩，没胀痛反酸。饮⽔量可，温⽔。脚丫摸凉，⼩腿⽪肤温，⽆凹陷。失眠。考虑茯苓四逆汤。许师⽈：没照⽚？余翥⽈:没有，很密集的⼩疹⼦，全⾝都是。⽪肤晦暗，疹⼦⼩，疥疮那么⼤。有⼩脓头。许师⽈：半量续命煮散。冯冬⾹问：李允若，男，岁腰痛天。既往有帕⾦森病史，四肢乏⼒，⾏动迟缓，发⾳吃⼒。天前突然感觉右脚⽆⼒，栽倒。后去医院X光检查右侧股⾻颈⾻裂，胸压缩性改变，严重⾻质疏松。年⽉⽇初诊：腰痛，右侧为甚，坐卧⾏动困难，⽆法翻⾝。平时汗少，怕冷，不怕热，偶尔头晕，⽆头痛，眼花，时有视物模糊，⼝⼲，⼝粘，不想喝⽔，全⾝肌⾁⽆⼒，四肢为甚，颤抖，⾆头嘴唇抖动，头部⽆摆动，⼿脚⽆⿇⽊。⽪肤⽆⼲燥⽆甲错，肌⾁略松弛，下肢有按肿。⼤便长期不好，服⽤润肠药后⼤便成型，⽇⼀次，很臭。⼩便频，短⾚。胃⼝差，⽆胃胀，⽆嗳⽓。嗜睡，做恶梦，偶有幻觉。⾆质红，⾆体胖⼤，⾆⾯裂纹，苔少，脉沉细。真武汤剂年⽉⽇⼆诊腰痛加重，翻⾝困难。⼿脚颤抖消失，⾆头抖动减轻。⼩便有改善。次数减少，余症同前。许师⽈：⻩芪建中汤。马振问：⾼菊梅⼥、岁20140719主诉：乳房胀痛⼀年病史简要：乳腺增⽣⼀年，⽆结节硬块，胀痛，⼦宫切除年。刻诊：精神可，体型偏胖，两腮略红，⽆惡寒发热，汗可汗出⽆惡风，怕热，偶尔头晕，⽆⾝痛，⽆关节透风发凉，⼤便⼀天三次⼲结，⼩便⻩，⽆不利⽆夜尿，纳可，⽆腹胀腹痛，饮⽔可，胸闷⽆⼼慌，⼝⼲⼝苦，⼝⼲夜甚，四肢温⽆⿇⽊，下肢⽆加错，轻度⽔肿，⾆红胎薄⻩，脉沉弱。许师⽈：⽪肤⼲燥还是油腻或正常。马振⽈：适中许师⽈：桂枝茯苓丸。鈡蒋騠问：⼀诊刘东男岁0140708主诉：嗜睡（两年）病史简介：两年前因陪朋友去坐⼩孩玩的⼤摆锤（原理：左右摆动，然后转圈），此后开始发病，症状表现为总想睡觉，在新桥医院检查诊断为脑供⾎不⾜，经⼀段时间⻄药治疗⽆效，之后⼀直未治疗，今年加重，因担⼼，⼜在新桥医院做全⾝检查诊断为额窦炎和⿐窦炎，经医院给开中药治疗⼀段时间⽆效，转⽽求助各地名⽼中医诊治,诊断为湿热、胃热、肺热等，均治疗⽆效。刻诊：精神疲倦，⾯⾊可，⽆怕冷怕风怕热，偶有盗汗，偶有头晕（晨起明显），蹲久后起⾝头晕眼花，偶有头痛（后脑勺和天灵盖位置），⽆痘痘，偶有⽿鸣，偶有刷⽛出⾎，⽆⿐塞⿐涕⿐⾎，⽆⼝⼲⼝苦⼝渴⼝黏，有⼝臭，⽆肌⾁酸痛，⽆⼿⾜关节脖⼦腰痛，有右⼿和双⾜抖动（坐时有），最近下⾬后有周⾝⽆⼒不喜动，膝关节天⽓变化痛（因北⽅当过兵，长期站岗），⽆⼿⾜冷和发烫，偶有睡觉时⾝体和四肢不适（放那⾥都不舒服），冬季下肢⼲燥，有鱼鳞纹，不脱⽪，有脚掌⼲燥脱⽪（有脚⽓），⽆按压凹陷，⽆袜⼦痕，⼤便成条，⼀天1-2次，⼩便⼀天3-4次，量可，颜⾊⽩⾊，偶有夜起1-2次，有胸部不适（总感觉在担⼼什么），⼼悸，偶有⼼烦，⽆胃胀胃痛嗳⽓反酸，胃⼝佳，饭量可，喝⽔少，喜温⽔，嗜睡两年（⾃觉睡不醒，站坐都能睡，睡后时间基本半天，醒后头昏眼睛胀疲劳），梦少，有阴囊潮湿，⽆阳痿早泄，下眼睑⻩带⾎丝。⾆脉：⾆淡红润胖⼤苔微⻩有齿痕脉右⼨沉关尺浮左⼨沉关浮尺微浮弱处⽅：真武汤茯苓芍药⽣姜⽣⽩术⽣附⼦⽔煎服四剂⼆诊：右⼿和双⾜抖动⼤减（基本痊愈），嗜睡好转，精神好转，盗汗消失，头晕刷⽛出⾎已⽆，⼝臭消失，下⾬后有周⾝⽆⼒不喜动已好，膝关节天⽓变化痛已愈，现主要是头部昏沉闷引起⼼烦（总感觉想⽤头撞墙），精⼒不集中，记忆⼒减退，⾯⾊可，冬季下肢⽪肤⼲燥，⽆脱⽪，有脚掌⼲燥脱⽪（有脚⽓），⼤便不成形，稀，⼀天1-2次，⼩便⼀天3-4次，量可，颜⾊⽩⾊，⽆夜起，有胸⼝不适（总感觉在担⼼什么），⼼悸，胃⼝佳，饭量可，喝⽔少（基本不喝），喜温⽔，嗜睡，梦多，下眼睑⻩带⾎丝。⾆脉：⾆淡润胖⼤有齿痕苔微⻩脉：右⼨沉关浮尺浮弱左⼨尺沉关浮许师⽈：真武汤的剂量⽐例不对，续进。李刚⽈：⽩术⼆两。张圣浩⽈：附⼦⼀枚⽤多少？许师⽈：克。鈡蒋騠问：⽅婷⼥岁年⽉⽇病史：宫颈糜烂三次流产史主诉：易疲劳，⾝体由内⽽外发冷，宫颈糜烂，呕吐，打嗝（连续打嗝），饭后⾃觉胃部停留⾷物，不消化，肢体关节酸痛，痰多（清⽩⾊）刻诊：有怕冷，怕风，午睡潮热后汗出，全⾝出汗，害怕空调冷风，⼿脚汗多，偶有⼼下痞块（按压会连续打嗝），偶有巅顶头痛，痛时头顶墙体缓解，⽆⽿鸣，⽆头晕，⽆⿐塞⿐涕⿐⾎，有⼝臭，偶有⼝苦，很少⼝⼲⼝渴，⽆⼝黏，四肢关节冷痛，背部胀痛，左⼿关节缝痒，脚踝关节受寒后酸痛，尾骶⾻痛，⾃觉⼿指关节内痒，有痔疮，⼿⼼热，脚底怕风，左侧脖⼦骚痒，⽆肢体⿇⽊，下肢⽪肤⼲，冬天脱⽪，⽪肤有点像鱼鳞形状，下肢按压⽆凹陷，⼤便不成形偏稀，⼀天

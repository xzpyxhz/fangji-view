⼦⽢草豉汤、栀⼦⽣姜豉汤、枳实栀⼦豉汤、栀⼦⼤⻩汤、⽠蒂散。淡⾖豉是黑⾖发酵后的制品，随各地地产不同⽽⽤辣蓼、佩兰、苏叶、藿⾹、桑叶、⻘蒿⾟⾹植物等做汤煮黑⾖，等煮透汤尽后，再蒸透焖闭发酵，⽣出⻩⾐后晒⼲即成，所以叫⾹豉，闻起来是酸⾹的。所以，淡⾖豉的性味除了苦寒，还有微微的⾟⾹酸温，凡是发酵之物，⼤抵微温。淡⾖豉的功效全⾯的阐释有四个⽅⾯的作⽤，清热化湿除烦，和中养胃健运，疏散微透表邪，涌泄轻宣郁滞。⽽前⼈往往只论述到清热化湿除烦这个层⾯，⽽对于后⾯三个功效鲜有论及，从⽽限制了本类⽅剂使⽤的范围。还有⼀段疑案，就是栀⼦豉类⽅到底有⽆吐的作⽤，由于栀⼦豉汤⽅后有“得吐者，⽌后服”之语，⽽导致注家分成两派，⼀派主张栀⼦豉汤能吐，⼀派主张栀⼦豉汤不能吐。⽽据我临床验证，栀⼦豉汤在某些患者确可发⽣吐的现象，并不是辨证不准，也不是不能愈病，但是确实有⼀部分患者服⽤栀⼦豉汤或其类⽅会有吐的反应，⽽⼤部分不会吐。细究其因，则栀⼦豉汤所治之证，⾃中焦湿热开始可以涌迫到上焦，所引起的症状也是极多，烦热、胸中窒、⼼中懊憹、饥不能⾷、头汗出、虚烦不得眠、其外有热、⼿⾜温、下利后更烦、按之⼼下濡等等。那么，病机就会有湿热结于中焦和结于上焦的不同，中焦湿热⽤栀⼦豉汤后⼤部分不吐，；⽽上焦湿热由于病位在横隔膜以上，如果⽕热湿邪冤结郁滞较甚，药⼊⽽与邪争，加之栀⼦豉汤本⾝具有酸苦涌泄的作⽤，病位在上，因势利导，得吐则邪去正安，津液得下得以敷布，正⽓⾃调，故⽈得吐者可以⽌后服。⽜春红问：张新伟，⼥，岁，2014.07.18主诉：脸上长痘半年，加重两个⽉。病史：未结婚时脸上爱长痘，结婚后育有⼀⼥，（今年岁）痘痘⾃愈。于今年⼜长，已经半年，近两⽉加重，痘印有⾊斑沉着，脸上满布。剖宫产⼀⼥，后怀孕因胎盘早剥，胎滞宫中，⼜⾏剖宫取胎。现术后年半。刻诊：冬天怕冷，夏天怕热，爱出汗，脸部和后背汗多。⼝⼲⼝苦⼝渴，⾃⼰感觉有⽕，故多喝⽔，每天杯⽔，⼀次毫升左右，凉⽩开。喝⽔后胃胀满发硬。⼝有点黏。眠可。乏⼒，不喜坐，坐久犯困。晨起不觉饿，不吃早餐，⾷量不⼤。⾷饱则胀满不舒。⼤便⽇⼀⾏，不成形，有时有解不尽感，⼩便6-8次，量⼩，次数多，⼩便⾊清。起夜⼀次。⼿⾜⼼爱出汗。肤稍⼲，⼿指有点脱⽪，⼀两处，不重。近两年冬天脚凉，⼿不凉。有时头晕，腰痛，有时胸闷，⼼悸，有好⼏年了，不常出现。原先爱头痛。脸⾊偏暗，睑红。膝盖以下发软⽆⼒。经期可，经量少，带经天，⽆⾎块，⾊偏暗。⾆瘦，尖粉红，薄⽩苔。脉⽞紧，关尺沉。左关动。处⽅：⻩芪建中汤许师⽈：张新伟痤疮有脓头吗⽜春红⽈：有的。许师⽈：温经汤。外⽤⼤⻩五倍⼦积雪草⻩连桑⽩⽪外洗⼀周⽜春红问：李清德，男，岁，2014.07.19主诉：左⼿发⿇余天，右⼿⿇天。在别处按照颈椎病治疗，不见效。刻诊：冷热不明显，不喜出汗，年轻时就这样，眠可。⼝不⼲，这两天有点⼝苦，不渴，不喜饮，常温⽔，⼀次毫升左右，⾷可，⾷后不胀。⼤便⽇⼀次，头⼲后软，成型，好解，⼩便三到四次，⾊淡⻩，起夜⼀次。⾯⾊黑，左⼿发⿇余天，右⼿于昨天感觉发⿇，颈部发⿇。⼿⾜温，蹲久站起时易头晕。⼿有⽼茧，肤稍⼲，腿不肿。眼睑红⽩相间，微发⻩⾊。⾆淡紫，胖，微有齿痕，中部有⼀竖沟，薄⽩苔⾆⾯润。脉左⼨沉⽞，关浮滑，尺微浮滑，右⼨浮⽞，关浮滑尺沉⽞紧。许师⽈：⾯⾊。⼲燥油腻还是正常。⽜春红⽈：黑。适中。许师⽈：桂枝加葛根汤。余翥问：李清德案不明⽩…桂枝加⻩芪汤与加葛根区别…许师⽈：桂枝加⻩芪偏于太阴，加葛根偏于阳明。张圣浩问：⼥，岁，形体适中主诉：左眼肌抽搐年余病史：患者年前因拔⽛后冰敷患处致左上下眼睑抽搐跳动，情绪紧张时候抽搐加重。经营养神经治疗乏效，中医多以养⾎祛风治疗⽽⽆效。刻诊：患者⾯⾊可，⾯部多雀斑，初诊⽪肤疏松感，左眼时抽搐，左外侧上眼睑浮肿，诉平素不怕风冷，怕热，汗⼀般，⽆盗汗，⼝⼲⽆⼝苦，⼝⼲欲饮⽔，饮⽔较多，⼩便晨起⻩，平时多⾊清，畅，⽆夜尿，⼤便⽇⼀⼆⾏，偶成型，偏溏，纳可，眠可，偶有腹胀，偶有反酸嗳⽓，头痛，⽆头胀，头部怕风，⽆头晕，⽆神疲，偶有⽿鸣，⽆肢体肿，⽆甲错，⽆呕吐，⽆刷⽛出⾎，⽉经容易提前，末次⽉经⽉⽇，⾏经5-6天，量可，痛经甚，热敷稍缓解，⾎块⽆，⾊鲜红，偶胸闷，⼿⾜温，冬天脚冷⼿不冷，眼眵较多，脉沉缓细，⽆⼒，⾆边尖红点太薄⽩。今天⼩便是阴道有⾎，原因不明。既往⽤过⻩芪建中汤桂枝加⻩芪汤，诉⽤了桂枝加⻩芪汤后眼眵多。许师⽈：⻩芪桂枝五物汤。林树元问：⼥5-18活动后胸中不适，⼩便泡沫，淡⻩，夜尿⼀次，⼤便调，⽆胸闷⼼悸，⽆⼼烦，⽆头晕头痛，⽆⼝⼲⼝苦，饮可，纳可，寐可，⼤便调，左⼿⼤拇指、⺬指、中指从第⼆指节以上⿇⽊。右⼨浮细弦，关偏弦，尺弦；左⼨细稍浮，关弦，尺细弦。⾆暗淡，苔⽩腻、中裂纹。⼿指凉，下肢扪温、轻度按肿、⽪肤甲错。下睑淡⽩。桂枝加⻩芪汤。5-28外⼏⽇外感，晨起咽痛，午后流浓涕，现咽已不痛，下肢肿，⼿⿇仍在，⽆明显⼝渴，饮可，汗可，⼤便溏，⼩便淡⻩，夹泡沫，饮多则⼩便多，⽆明显腰痛，寐纳可，⽆恶风寒，吃橙⼦后第⼆⽇少腹疼痛、伴便溏，后缓，右⼨浮弦滑，关弦⼤薄滑，尺细弦滑；左⼨细浮，关弦滑，尺细弦滑稍紧。⾆淡红暗，苔薄⽩稍腻少津、中有裂纹。扪⼿⼼潮热。下肢中度按肿、有袜痕。下睑淡⽩、⾯⾊暗滞。⽉肾功、尿常规⽆异常，肾脏B超⺬右肾囊肿（1.1*0.89CM）。少阴津⾎亏少虚热，饮停。肾⽓丸6-4药后下肢浮肿已有好转，今⽇⼜肿如前，⼤便溏，⼿⿇仍在，⼩便淡⻩，夹泡沫，饮多则溺多，⽆畏风寒，汗可，⽆⾝重，右⼨浮细，关弦⼤宽薄沉紧，尺沉弦稍紧；左关尺沉弦稍紧。⾆淡红⽼，苔微浊，中有裂纹。下肢重度按重。5-29邵逸夫医院检查⽣化：钾3.10mmol/L（3.5-5.3），总蛋⽩63g/L（65-85），⽩蛋⽩37g/L（40-55），超敏CRP16mg/L（0-5）；尿常规：隐⾎1+，蛋⽩细胞微量，⽩细胞37/uL，⽩细胞（⾼位视野）6.6/HPF。真武汤（备⽤：肾⽓丸）。6-11下肢仍重度浮肿，⼤便溏、⽇−⾏，⼿⿇仍在，⼩便同前，⽆⼝⼲⼝苦咽⼲，⽆恶风寒，⽆恶热，汗可，汗后不凉，⽆头晕头痛，⾏步快时则胸⾻后隐痛，⽆胸闷⽓短⼼悸，纳寐可，⽆腹痛胀，晨起⼤便时偶有肠鸣，⽆腰痛，两膝曾有疼痛、现已好，右⼨浮细弦，关弦⼤宽薄沉紧，尺弦紧稍宽略浮；左关尺弦紧、尺略沉。⾆红紫稍暗，体稍瘦，边齿痕，苔薄⽩腻、上有浅⼩裂纹。扪⼿⾜尚温，下肢重度按肿，⽪肤⽋温如鱼鳞。肾⽓丸⽆效，请教许师后处以防已茯苓汤，⽤⾄7-15，⽔肢已明显减轻，⼿⿇仍有，⼩便夹泡沫仍在、淡⻩，饮不多，⼤便调，稍⾷凉则便溏，⽇⼀⾏，右⼨浮弦，关尺弦⼤中空，左弦沉，⾆淡红稍紫，苔薄⽩腻少津。下肢轻−中度按肿。继续防⼰茯苓汤。防⼰，⻩芪，桂枝，茯苓，炒⽢草⼗四剂请教许师此案的机理，及下⼀步的⽅案。许师⽈：树元这个还需要⽤防⼰茯苓汤，此案改天我详解。林树元问：2014-6-25岁⼥膝盖以下及两臂发凉年余，时有右⼿⿇⽊，⽆疼痛，⾃汗出，汗冷，汗后⾝凉，恶风畏寒，时有腰痛，烧⼼，⼝苦，⽆反酸嗳⽓，⽆腹痛胀，⼤便调，⼩便深⻩，有尿不尽感，夜尿−次，醒睡⼝⼲，素不欲饮，右细弦稍浮、关略滑，左弦、关紧滑，⾆淡红紫、苔薄滑。下睑半红半⽩。扪⼿⾜温。厥阴病：太阴⾥寒饮停、卫津亏虚，阳明⽔热。⽢草泻⼼汤（备⽤：温经汤）。7-2肢冷同前，两膝盖以下及右上肢明显，药后⾜⼼热，⼝苦减轻，偶有⼿⿇，⾃汗多，恶风寒，腰痛畏寒，烧⼼、饮⽔明显，⼩便深⻩、频急，夜尿仍有，夜间⼝⼲。右关浮弦滑，左浮细弦滑，⾆暗红紫，边有瘀斑，苔薄⽩腻⽋润。扪⼿⾜温。下睑半暗红半⽩。温经汤。7-6⼿脚凉、恶寒，⾜⼼发热，夜间⼩腿发热，夜间⼝⼲，烧⼼仍在，稍有⼝苦，⼩便⻩、次数稍减、仍频急，⾃汗出，恶风，汗出⾝凉，腰已不痛，右⼨细、关尺浮弦稍滑，左浮细弦滑，⾆偏红、边瘀斑，苔薄少。类厥阴中风：乌梅丸（备⽤：柴胡桂枝汤）。乌梅丸，桂尖，⼲姜，花椒，细⾟，⽩附⽚，⻩连，⻩柏，当归，沙参，党参，⽣晒参，炙⽢草剂7-16上肢发凉减轻，下肢仍有发凉，⾜⼼时有发热，烧⼼，⼝苦⼝⼲，⾃汗稍减，汗后⾝凉，⾝⽆汗、下肢汗出明显，恶风，⼩便稍有频急、尿痛，⼤便⼲，⾆⿇，右弦缓稍浮，左弦稍紧，⾆暗红，苔薄⽩腻滑。类厥阴：柴桂姜汤。柴胡，桂枝尖，⼲姜，⻩芩，天花粉，⽣牡蛎，炒⽢草七剂药后上⽕，⼤便⼲结。此案对于津⾎的把握很纠结，病机把控不清，请教⽼师此案思路当如何许师⽈：阿元，乌梅丸⽤的不当。燥伤津⾎了。林树元⽈：想不出⽅⼦了。许师⽈：当⽤⻩芪建中汤救逆。柴胡桂枝⼲姜汤也是清泻的。林树元⽈：⼀开始应该就⽤建中吗？许师⽈：刚开始是芪芍桂酒汤。有感觉了吧。林树元⽈：有了。⻩汗之病，两胫⾃冷。许师⽈：太阴中风的不同层⾯。张铭锡问：梅⼩凤⼥岁20140712咳嗽半年余。患者之前在餐饮包间上班，长期吸⼆⼿咽后引发咳嗽，久治不愈来诊刻诊：脸⾊淡红润，每于下午4~5点，晚上9~11点咳嗽加剧，⼲咳，少痰，⾊⽩。时⼝⼲，伴咽⼲咽痒。饮⽔⼀般。怕热，汗可。⼿⾜扪之温润，下肢⽆⽔肿。带偏多，⽩。经来第⼀天⾝稍软，腰微酸，\n第⼆天后⽆症状，量⾊可。⼤便可。⼩便起夜到次，⾊淡⻩。⾆淡红苔薄⽩，脉沉偏弱。平素刷⽛，视脏物，晕车时欲呕。许师⽈：⽵叶⽯膏汤。林凡庚问：王某，男，岁。初诊⽇期：年⽉⽇。主诉：脘腹灼热⼀⽉余。病史简要：患者脘腹灼热近⼀⽉，在别处服⽤中药乏效，或有时暂时缓解⽽难以持久，伴有烦躁，早晚尤甚。刻诊：脘腹灼热，烦躁，下午尤甚，⼝渴饮⽔多，喜凉饮，纳差不欲⾷，⼤便⽇⼀次成形灼热感（纳凉物则便稀），溲热⽆不利，⾝怕热，⼿⾜觉热，汗出正常，汗后⽆怕风冷，后背，腰部发沉，风吹久有不适感，⽆四肢关节疼痛⿇⽊，形瘦，⾯⽩⽋光泽，眼睑半⽩半红，眠可，⽆⼼悸胸闷，下肢轻度甲错⽆⽔肿。⾆脉：脉弦细，⾆红苔少根部⻩腻。处⽅：⽵叶⽯膏汤⼋剂。复诊：药后⼝⼲⼝渴明显减轻，纳⾷好转，早晚烦躁减轻，腹部还是热，⼤便⼀⽇⼀到两次，量不多，成形（⾃述昨晚排便⼀次有很热的感觉）排便后⾃觉腹中轻快不少，⼩便已不热⽆不利，⼿⾜少许热感，后背，腰部沉重感减轻，右胯受凉后有不舒服的感觉，近两天⾝乏⼒，傍晚缓解，眠差多梦。⾆脉：脉弦细，⾆红苔少根部苔⻩略腻。许师⽈：栀⼦豉汤。余翥问：⽼师，如果汗后怕风冷，伴有下肢⽔肿，是不是栀⼦⽣姜豉汤？许师⽈:会有效.是的林凡庚问：⽼师如果吃了栀⼦豉后烦躁胃中嘈杂是否是排病反应。许师⽈：恶⼼欲呕吗？林凡庚⽈：是的。许师⽈:那是的.林凡庚问：⼀开始我给开了两幅吃了难受没敢吃。四诊忘记写了。病⼈⼀直嘟囔，弄的我⼼⾥没底。许师⽈：上焦湿热由于病位在横隔膜以上，如果⽕热湿邪冤结郁滞较甚，药⼊⽽与邪争，加之栀⼦豉汤本⾝具有酸苦涌泄的作⽤，病位在上，因势利导，得吐则邪去正安，津液得下得以敷布，正⽓⾃调，故⽈得吐者可以⽌后服。余翥问：⽼师，我奶奶刚服药后⼜出现恶⼼，这个也是排病不？许师⽈:别的症状怎么样？余翥⽈：其他没什么，呕点酸⽔许师⽈：头⾯痛⽬红肿怎么样了余翥⽈：⾝上疼痛减轻很多了许师⽈：那不要紧，这就是病在太阳的呕逆⾝痛。余翥⽈：看上去红肿还是有，但是疼痛减轻了。这个⽤阳针可以不？昨天做了阳针，对头肩膀都有⽌痛，今天做效果不明显。许师⽈：阳⾯中焦。余翥问：眼充⾎肿，不算阴吗？这两天做的阳上焦。有时想，腿⽔肿是不是可以⽤阴⾯下焦…许师⽈：这⾥的阴阳都是相对的。⿇⻩汤的发烦⽬瞑记得吗？津⾎充斥在表不解了。这个津⾎的来路要分清。\n第十三課太陰病概講（2014.7.25）因为最近看到⼤家的⼀些瓶颈，所以我们接下来的⼏节课来细化太阴中风。太阴是杂病之薮。⼀部《⾦匮要略》就是在太阴病⾥打转。⽽太阴中风是太阴病中最精细和难解的部分，所以我们先来解读这⼀部分。太阴病病机概念：⽆⾥热⽆表寒者发于太阴。太阴病的⽆表寒是相对来讲的，指的是相对于少阴表阴病，太阴病的寒是偏⾥的；表上恶寒不明显或者只是由于津⾎虚寒或有⽔饮⽽影响到表；不适合⿇⻩这类的纯表散⽆补益的药去直接发表散越，甚⾄即使⽤⿇⻩配伍⼲姜附⼦⽩术剂也不可以（这种配伍只存在于太阳太阴合病的症候中可以适⽤，如⼩⻘龙汤、⿇⻩加术汤等；⽆与太阳合病的太阴中风、外证等皆不可以使⽤）；⽽是需要⽤温卫补津⾎或温⾥化饮的⽅法，通过补益或治疗⾥位来温煦表位⽽去对治（如⽢草⼲姜汤、⽢姜苓术汤类）；或者⼀部分有表邪者最多⽤到⻩芪、桂枝这类补益营卫⽽发表之药去对治（如桂枝加⻩芪汤、⻩芪桂枝五物汤类）。故临床常见少阴表病多寒⽽痛；太阴表病多烦⽽痛。太阴病是⾥虚寒的，所以不会有⾥热证，但是可以有⼀些表上的热像，如“汗出已，反发热”、“⼿⾜⾃温系在太阴”等症状，⽽这些症状也是由于津⾎虚寒或有⽔饮阻碍⽽影响到表产⽣的。所以说，这就是病机解伤寒的妙处，症状千变万化，病机真确唯⼀，不要只被症状牵着⾛，见到寒的症状就⽤温法，见到热的症状就⽤清法，此皆谬也。持此种思路之医者，皆需要拜读明末医家王应震之要诀：“见痰休治痰，见⾎休治⾎。⽆汗不发汗，有热莫攻热。喘⽣休耗⽓，精遗不涩泄。明得个中趣,⽅是医中杰。”张景岳、陈修园之⼗问歌是四诊准绳，王应震先⽣之要诀是施治准绳。⾃利不渴者，属太阴，以其藏有寒故也。当温之，宜服四逆辈。()释：脏病，即是⾥病，太阴病脏有寒，就是⾥虚寒，所以它不会有⾥热证，⽽⾥虚寒的治则⾃然是当温之。宜服四逆辈，四逆辈，就是以四逆汤为代表的⼀⼤类温法的⽅⼦，不⽌于四逆汤，范围很⼴，⽽⼤致分为五个⼤的范畴，都是在⾥虚寒的基础上展开的：<1>⾥虚寒本证；<2>⾥虚寒引起的⽔证；<3>⾥虚寒引起的⾎证；<4>⾥虚寒引起的⽔⾎同病证<5>⾥虚寒引起的外证。我们先讲：<1>⾥虚寒本证，⽤温⾥类⽅即包括四逆汤、通脉四逆汤、理中汤（丸）、⼲姜附⼦汤、附⼦粳⽶汤等；四逆汤条⽂：．伤寒，医下之，续得下利圊⾕不⽌，⾝疼痛者，急当救⾥，后⾝疼痛；清便⾃调者，急当救表，救⾥宜四逆汤，救表宜桂枝汤。．下利腹胀满，⾝体疼痛者，先温其⾥，乃攻其表；温⾥宜四逆汤，攻表宜桂枝汤。释：⾸先纠正个名词，后世医家，把下利圊⾕写作“下利清⾕”，认为是⽤来形容⽔泻或完⾕不化的，并且误以为这个概念源⾃《伤寒论》。这其实是个讹传，不是清⾕，⽽是圊⾕，圊是厕所的古称，五⾕轮回之所，所以叫圊⾕，下利，仲圣不都是⽤来描述泄泻的，包括⼀些妇科出⾎或带下也这么描述，就是“下焦过于通利”的意思，有下利便脓⾎的（如桃花汤、⽩头翁汤），下利⻘⽔的（如承⽓汤），下⾎的（温经汤）等。下利“圊⾕”才专门是指的蹲厕所拉肚⼦。并且下利清（圊）⾕并不都是⽔泻和完⾕不化，也可以只是⼤便不成形或者只是⼤便次数增多，当然可以有⽔泻和完⾕不化，但也不全是，所以这个概念要厘清。伤寒，误下伤胃，⾥虚寒了，则下利或伴腹胀满，虽然伤寒还不愈，也应当先温⾥救⾥，然后再治表证⾝痛。圊便⾃调⽽⾝体疼痛者，说明病还没传⾥，这就和那个“其⼩便清者，知不在⾥，仍在表也，当须发汗”是⼀个道理，⼤⼩便⾃调者，是仲圣⾏⽂惯⽤的⽤来排除⾥病的概念⽅式，所以发表就⾏了。温⾥救⾥的代表⽅就是四逆汤类⽅，发表散邪的代表⽅就是桂枝汤类⽅。⼀表⼀⾥，⼀温⼀散，⼀补⼀攻，延伸出整个经⽅的法度，故⾔经⽅治则，全在阴阳表⾥上打算。．病发热、头痛，脉反沉，若不瘥，⾝体疼痛，当救其⾥，四逆汤⽅。释：利⽤这⼀条，我们可以来把握住少阴体痛脉沉的两种分型。少阴病体痛发热⽽脉沉者，常见于⿇⻩附⼦细⾟汤证类⽅，是因为发热体痛者常发于阳也，所以这个⽅证严格来说是个太阳少阴太阴合病，所以会头痛⽽发热；少阴病体痛恶寒⽽脉沉者，常见于附⼦汤证类⽅，是因为恶寒体痛者常发于阴也，严格来说是个少阴太阴合病，所以会体痛⽽恶寒；条说的意思就是要是少阴病有发热的情况，经过⿇⻩附⼦细⾟汤温发之后，病未见好，并且还加重了，这说明这个不能解表了，少阴津虚液少营弱，不可以执着于表，需要急当救⾥，“须表⾥实，津液⾃和，便⾃汗出愈”，需要把阳⽓津液补充充⾜，卫⾃可以到表防御驱邪，所以可以⾃愈，这种⾃愈，常见微汗，这是卫阳以牺牲⾃⼰为待价⽽以汗出的⽅式驱邪外出。．脉浮⽽迟，表热⾥寒，下利清⾕者，四逆汤主之。释：本条其实是厥阴病了，戴阳厥脱之象，我们重复着放在太阴病和少阴病篇讲，是为了⼤家从⽅证上更多维的去把握四逆汤。四逆汤证⼤多数情况下是脉沉的，但是也有脉浮的情况，就是出现在这个厥阴病的时候，表热⾥寒，假热真寒。迟脉，有津伤液少的病机，浮脉说明病位往表上⾛，⾥寒⽽下利圊⾕就会导致津伤液少，少到⼀定程度就要亡阳脱阳戴阳了，所以脉浮⽽表有假热，这是典型的“热在⽪肤，寒在⾻髓”，所以要回阳救逆，急救厥脱，不可以清热，更不可发表，就⽤四逆汤，甚者⽤通脉四逆汤。通脉四逆汤条⽂：．少阴病，下利清⾕，⾥寒外热，⼿⾜厥逆，脉微欲绝，⾝反不恶寒，其⼈⾯⾊⾚；或腹痛，或⼲呕，或咽痛，或利⽌脉不出者，通脉四逆汤主之。．下利清⾕，⾥寒外热，汗出⽽厥者，通脉四逆汤主之。释：这些少阴病戴阳证，精确来分应该属于厥阴病，厥阴厥脱必从少阴病位⽽脱，所以伤寒书中少阴厥阴死症最多，单纯的太阴反⽽少见。通脉四逆汤就是四逆汤的升级版，附⼦⼲姜量⼤，回阳救逆作⽤也更强于四逆汤。理中汤（丸）条⽂：霍乱，头痛、发热、⾝疼痛、热多欲饮⽔者，五苓散主之；寒多不⽤⽔者，理中丸主之。（）理中汤（丸）⼈参⼲姜⽢草（炙）⽩术（各三两）上四味，捣筛，蜜和为丸，如鸡⼦⻩许⼤。以沸汤数合，和⼀丸，研碎，温服之，⽇三四、夜⼆服；腹中未热，益⾄三四丸，然不及汤。汤法∶以四物根据两数切，⽤⽔⼋升，煮取三升，去滓，温服⼀升，⽇三服。释：这段话是分开来说的，霍乱的定义在条：问⽈，病有霍乱者何？答⽈：呕吐⽽利，此名霍乱。霍乱分寒热两种，热者，是“呕吐⽽利”伴有“头痛、发热、⾝疼痛、热多欲饮⽔”，那是⽔热兼表的症候群，是五苓散证为主；寒者，“呕吐⽽利”伴有“寒多不⽤⽔”，那是“⾃利不渴者属太阴也，脏有寒故也”，是理中丸（汤）证为主。⼤病瘥后，喜唾，久不了了，胸上有寒，当以丸药温之，宜理中丸。（）胸痹⼼中痞，留⽓结在胸，胸满，胁下逆抢⼼，枳实薤⽩桂枝汤主之；⼈参汤亦主之。⼈参汤⽅⼈参⽢草⼲姜⽩术各三两右四味，以⽔⼋升，煮取三升，温服⼀升，⽇三服《⾦匮•胸痹⼼痛短⽓病脉证治第九》释：⼤病瘥后，胃虚津虚，胃虚则中不制下，中焦对下焦⽔浊的分清泌浊的作⽤就会减弱，那么⽔浊下趋后窍就会⼤便溏泻甚则霍乱泻下⽆度，⽔浊下趋前窍则会⼩便频数清长遗尿甚则男⼦遗精⼥⼦带浊；中不制下了浊⽔也会在下焦浊⽓的带动下上逆，则会导致胸上有寒（饮），喜唾痰涎，甚则⼼悸胸满胸痞，达到⼀定的⾼度还会⽬眩⽿鸣头晕头重。理中汤有个重要的⽅根，是⽢草⼲姜汤，补中温中健胃补津回阳充液，补中制下的代表⽅，再配伍补津养液的⼈参，健胃除饮的⽩术，⽽成温胃养中之佳⽅。（附：⽢草⼲姜汤肺痿吐诞沫⽽不咳者，其⼈不渴，必遗尿，⼩便数，所以然者，以上虚不能制下故也。此为肺中冷，必眩，多诞唾，⽢草⼲姜汤以温之。若服汤已渴者，属消渴。《⾦匮•肺痿肺痈咳嗽上⽓病脉证治第七》。）⼲姜附⼦汤条⽂：下之后，复发汗，昼⽇烦躁不得眠，夜⽽安静，不呕、不渴，⽆表证，脉沉微，⾝⽆⼤热者，⼲姜附⼦汤主之。（）⼲姜附⼦汤⼲姜（⼀两）附⼦（⽣⽤，去⽪，切⼋⽚，⼀枚）上⼆味，以⽔三升，煮取⼀升，去滓，顿服。释：这段话前代注家多⽤天之阴阳即“昼阳旺，夜阴旺”来解释“昼⽇烦躁，夜⽽安静”之机理，⽽未能引⼊实际临床中思考。其实仲圣学术更重视的是⼈体内⼩宇宙即⼈体内⾃⾝阴阳的之盛衰，⽽很少⽤天之阴阳来解释病情。其实仲圣的作法，才是最符合临床实际的。例如⾃⾝阳衰之患者即使在盛夏⽩昼阳旺之时亦可见到阴病如四逆理中诸证；⾃⾝⽕旺之患者即使在隆冬黑夜之时亦可见到阳病如⽩⻁承⽓诸证。这段话也是仲圣书中常见的倒装句，表述的语序应该是这样的：“下之后，复发汗，昼⽇烦躁，夜⽽安静，不得眠，不呕、不渴，⽆表证，脉沉微，⾝⽆⼤热者，⼲姜附⼦汤主之。”古⼈不昼寝，⽇出⽽作，⽇落⽽息，朝暮两⾷，所以宰予昼寝才被孔⽼夫⼦所指责为“朽⽊不可雕也,粪⼟之墙不可圬也”。故⽽根本不是“昼⽇烦躁不得眠”，是⽩天烦躁，晚上不得眠。所⾔的“夜⽽安静”的意义在于鉴别虚寒性失眠与阳热性失眠。如阳热性失眠就如⻩连阿胶汤那种“⼼中烦不得卧”，⼲姜附⼦汤的失眠，是失眠⽽不烦躁，安安静静的就是睡不着。为什么此条不眠⽽安静？⽆⽕也，⾥虚寒也；津亏也，不养⼼也，注意是“下之后”，⼀般下药都是苦寒的，就会虚寒了⾥阳；“复发汗”，发汗⼀般都是⾟温的，就会耗散了津液。复原⼀下当时的治疗过程就是：这个医者，先⽤苦寒攻下，病未愈，接着⽤⾟温发汗，汗和下是古⼈最常⽤的治病⽅法。患者服了发汗药，药后烦躁了⼀⽩昼，⼊夜后，倒是不烦躁了，但是就失眠了。这是由于津液的耗散，⾥阳也虚寒了，津液的化源也受到了戕伤，不能温养⼼脑神⽓了，睡眠障碍了，所以这种症候，不但不眠还会伴有⾝冷厥冷的。为什么这么肯定呢？因为条⽂中的那个“⾝⽆⼤热”，那说的不是⾝热，想表达的意思其实是本来不眠⼤多是要烦热的。如上⾯提到的⻩连阿胶汤，在《辅⾏诀》叫做⼩朱鸟汤，“治天⾏热病，⼼⽓不⾜，内⽣烦热，坐卧不安。”《伤寒杂病论》把它定义为：“少阴病，得之⼆三⽇以上，⼼中烦、不得卧，⻩连阿胶汤主之。（）”这是因阳热伤津液的⾝热烦躁不眠，所以⽤清滋法。但是这个⼲姜附⼦汤治的是因虚寒⽽伤津液的不眠，不但⾝⽆⼤热，还要⾝冷厥冷脉沉微弱的。按照法则，轻微的津液虚寒的⾝冷不眠是⽢草⼲姜汤证，虚寒的重的才是⼲姜附⼦汤证。这个⽅⼦，就是⽢草⼲姜汤去⽢草加附⼦，⽢草的⽢温纠正不了这个程度的虚寒的，所以加了⾟热的附⼦，⼲姜附⼦汤是四逆汤类⽅的⽅根。“不呕、不渴，⽆表证”，这段话在仲圣书中很有代表意义，⼀般的规律是⽤“不呕”来排除少阳病，“不渴”来排除阳明病，⽆表证来排除太阳病。再深⼀步说，为什么⽤不呕排除少阳病？则不呕是代表⽔饮也；为什么⽤不渴来排除阳明病？则不渴是代表⾥热也。这就是辨病机⾼于辨症状的道理所在，知其然亦知其所以然也！附：⽢草⼲姜汤．伤寒脉浮、⾃汗出、⼩便数、⼼烦、微恶寒、脚挛急，反与桂枝，欲攻其表，此误也。得之便厥、咽中⼲、烦躁吐逆者，作⽢草⼲姜汤与之，以复其阳。．问⽈∶证象阳旦，按法治之⽽增剧，厥逆、咽中⼲、两胫拘急⽽谵语。师⽈∶⾔夜半⼿⾜当温，两脚当伸。后如师⾔，何以知此？答⽈∶⼨⼝脉浮⽽⼤；浮为风，⼤为虚，风则⽣微热，虚则两胫挛。病形象桂枝，因加附⼦参其间，增桂令汗出，附⼦温经，亡阳故也。厥逆、咽中⼲、烦躁、阳明内结、谵语烦乱，更饮⽢草⼲姜汤，夜半阳⽓还，两⾜当热，胫尚微拘急，重与芍药⽢草汤，尔乃胫伸；以承⽓汤微溏，则⽌其谵语。故知病可愈。）附⼦粳⽶汤条⽂：腹中寒⽓，雷鸣切痛，胸胁逆满，呕吐，附⼦粳⽶汤主之。（《⾦匮•腹满寒疝宿⾷病脉证治第⼗》附⼦粳⽶汤⽅附⼦⼀枚（炮）半夏半升⽢草⼀两⼤枣⼗枚粳⽶半升。右五味，以⽔⼋升，煮⽶熟，汤成，去滓，温服⼀升，三⽇服。释：太阴⾥虚寒的特点往往是寒+湿，在此亦有体现，太阴⾥虚寒的重了，虽有“雷鸣切痛，胸胁逆满，呕吐”⽽不能⽤⽣姜类的⾟散药，只能温⾥补⾥救⾥（附⼦、⽢草、⼤枣、粳⽶）⽽加温降之半夏祛⽔湿。此⽅亦适合不耐姜味的患者温中⽌呕。今天讲这些，⼤家消化⼀下。\n第十四課太陰病概講之二（2014.8.2）<1>⾥虚寒本证；<2>⾥虚寒引起的⽔证；<3>⾥虚寒引起的⾎证；<4>⾥虚寒引起的⽔⾎同病证<5>⾥虚寒引起的外证。接下来讲：<2>⾥虚寒引起的⽔证，⽤温化类⽅包括⽢姜苓术汤、茯苓四逆汤等。⽢姜苓术汤条：肾着之病，其⼈⾝体重，腰中冷，如坐⽔中，形如⽔状，反不渴，⼩便⾃利，饮⾷如故，病属下焦，⾝劳汗出，⾐（⼀作表）⾥冷湿，久久得之，腰以下冷痛，腹重如带五千钱，⽢姜苓术汤主之。（《⾦匮·五脏风寒积聚病脉证并治第⼗⼀》）⽢草⼲姜茯苓⽩术汤⽅⽢草⼆两⽩术⼆两⼲姜四两茯苓四两右四味，以⽔五升，煮取三升，分温三服，腰中即温。释：本条是太阴寒湿，寒湿影响到了表，肾着这种病，⾝体沉重，腰部冰冷，患者⾃觉或者医者触诊潮湿冰冷，腰冷腹重，步履维艰，外观看起来就像⽔肿病类似。但是经过询问，不渴、⼩便正常、饮⾷正常，没有⽔肿病的这些必要症候群。⽔肿病的常见的病机就是中焦胃虚和津液不化。这个没有⼝渴（⼝渴为津液不化），没有纳呆（胃虚），没有⼩便不利（津亏或者表不解或者中不制下）。这些病机没有，这是病在下焦，下焦⾥位的虚寒导致的表⾥冷湿（注意不是⾐⾥冷湿，⽽是表和⾥都有寒冷和⽔湿）。所以⽤⽢草⼲姜汤加上茯苓⽩术去温化敷布即可。肾着汤的⽅根是可以治疗太阴外证的⽢草⼲姜汤。茯苓四逆汤条：发汗，若下之，病仍不解，烦躁者，茯苓四逆汤主之。（）茯苓（四两）⼈参（⼀两）附⼦（⽣⽤，去⽪，破⼋⽚，⼀枚）⽢草（炙，⼆两）⼲姜（⼀两半）上五味，以⽔五升，煮取三升，去滓，温服七合，⽇⼆服。释：本⽅是四逆汤加⼈参茯苓，亦即四逆加⼈参汤再加茯苓。四逆汤对治⾥虚寒，⼈参对治伤津或（和）亡⾎，茯苓对治⽔饮（淡饮）。本⽅是回阳⽣津养⾎⽽温化⽔饮的效⽅，⽅证是在虚寒津伤⾎少⽽兼饮的病机上展开的。所以茯苓四逆汤证的烦躁就会有三层意义的病机，⼀是虚寒津伤不能温养；⼆是⽔饮的冲逆或下注；三是营⾎不荣。故⽽此⽅既可以治疗虚寒津伤兼饮；亦可以治疗虚寒⾎少兼饮；还可以治疗虚寒津伤⾎少兼饮。只要符合这三种病机中的⼀条既可以去施⽤，此乃经⽅医家临证所需之病机⼀法摄伤寒，执⼀当万之思维也。<3>⾥虚寒引起的⾎证，⽤温养类⽅包括四逆加⼈参汤、⼤建中汤等。四逆加⼈参汤条：恶寒、脉微⽽复利，利⽌，亡⾎也，四逆加⼈参汤主之。（）四逆加⼈参汤⽢草（炙，⼆两）附⼦（⽣，去⽪，破⼋⽚，⼀枚）⼲姜（⼀两半）⼈参（⼀两）上四味，以⽔三升，煮取⼀升⼆合，去滓，分温再服。释：此条是真正的⾥虚寒引起的⾎证，这种亡⾎，是⽤不得清热、化瘀、⽌⾎诸法的，只可以在温养（⽢草⼲姜汤⽅根）、温阳（四逆汤⽅根）、救⾥（⼲姜附⼦汤⽅根）、补中（⽢草⼲姜汤⽅根）、补津（⽢草⼲姜汤⽅根+⼈参）、养⾎（⼈参）中打算。⼤建中汤条：⼼胸中⼤寒痛，呕不能饮⾷，腹中寒，上冲⽪起，出见有头⾜，上下痛⽽不可触近，⼤建中汤主之。《⾦匮•腹满寒疝宿⾷病脉证治第⼗》⼤建中汤⽅蜀椒⼆合（去汗）⼲姜四两⼈参⼆两右三味，以⽔四升，煮取⼆升，去滓，内胶饴⼀升，微⽕煎取⼀升半，分温再服；如⼀炊顷，可饮粥⼆升，后更服，当⼀⽇⾷糜，温覆之。释：此⽅虽在《⾦匮》中治疗的是⼼胸腹寒痛之证，但亦是⼀张温中养⾎⽌⾎的好⽅⼦。蜀椒治⾎⽌⾎，⼜见于升⿇鳖甲汤、王不留⾏散、⽩术散、乌梅丸。这⼏个⽅⼦，都可以见到⾎证，如升⿇鳖甲汤的“唾脓⾎”、王不留⾏散的“病⾦疮”“亡⾎”、⽩术散的“养胎”其实主要就是防⽌的胎漏⾎证、乌梅丸“久利”中就可以包括“⾎痢”。蜀椒温中⽌痛，⼜见于乌头⾚⽯脂丸，治⼼痛掣背，背痛掣⼼，⽤的就是蜀椒的温中⽌痛作⽤。可见蜀椒主要是温中和⽌痛⽌⾎的药效。⽽⼲姜亦可以温中⽌⾎，⼈参养津⾎，胶饴“补虚乏”“⽌⾎”（《别录》），所以合⽽成为温中⽌⾎之要⽅。我在临床中时常⽤其治太阴⾎证，每取佳效，如常⽤于虚寒⾎少体质的温⾎养⾎去虚、中下焦虚寒津亏⾎少的妇⼈崩漏带下、虚寒津⾎亏少体质的便⾎（常见于溃疡性结肠炎、癌症便⾎）等。附：问⽈：⼨⼝脉浮微⽽涩，然当亡⾎，若汗出，设不汗者云何？答⽈：若⾝有疮，被⼑斧所伤，亡⾎故也。病⾦疮，王不留⾏散主之。王不留⾏散⽅王不留⾏⼗分（⼋⽉⼋⽇采）溯瞿细叶⼗分（七⽉七⽇来）桑东南根（⽩⽪⼗分，三⽉三⽇采）⽢草⼗⼋分川椒三分（除⽬及闭⼝者，汗）⻩芩⼆分⼲姜⼆分芍药厚朴各⼆分右九味，桑根⽪以上三味烧灰存性，勿令灰过，各别杵筛，合治之为散，服⽅⼨⼔。⼩疮即粉之，⼤疮但服之，产后亦可服。如风寒，桑东根勿取之。三物皆阴⼲百⽇。⼼痛彻背，背痛彻⼼，乌头⾚⽯脂丸主之。乌头⾚⽯脂丸⽅蜀椒⼀两（⼀法⼆分）乌头⼀分（炮）附⼦半两（炮）（⼀法⼀分）⼲姜⼀两（⼀法⼀分）⾚⽯脂⼀两（⼀法⼆分）右五味，末之，蜜丸如梧⼦⼤，先⾷服⼀丸，⽇三服（不知，稍加服）。妊娠养胎，⽩术散主之。⽩术散⽅（见《外台》）⽩术芎穷蜀椒三分（去汗）牡蛎右四味，杵为散，酒服⼀钱⼔，⽇三服，夜⼀服。但苦痛，加芍药；⼼下毒痛，倍加芎穷；⼼烦吐痛，不能⾷饮，加细⾟⼀两、半夏⼤者⼆⼗枚。服之后，更以醋浆⽔服之。若呕，以醋浆⽔服之；复不解者，⼩⻨汁服之；已后渴者，⼤⻨粥服之。病虽愈，服之勿置。．伤寒脉微⽽厥，⾄七⼋⽇肤冷，其⼈躁，⽆暂安时者，此为脏厥，⾮蛔厥也。蛔厥者，其⼈当吐蛔。今病者静，⽽复时烦者，此为脏寒。蛔上⼊其膈，故烦，须臾复⽌；得⾷⽽呕，⼜烦者，蛔闻⾷臭出，其⼈常⾃吐蛔。蛔厥者，乌梅丸主之。⼜主久利。乌梅丸乌梅（三百枚）细⾟（六两）⼲姜（⼗两）⻩连（⼗六两）当归（四两）附⼦（炮，去⽪，六两）蜀椒（出汗，四两）桂枝（去⽪，六两）⼈参（六两）⻩柏（六两）上⼗味，异捣筛，合治之。以苦酒渍乌梅⼀宿，去核，蒸之五⽃⽶下，饭熟捣成泥，和药令相得。内⾅中，与蜜杵⼆千下，丸如梧桐⼦⼤。先⾷饮服⼗丸，⽇三服，稍加⾄⼆⼗丸。禁⽣冷、滑物、臭⾷等。升⿇鳖甲汤阳毒之为病，⾯⾚斑斑如锦⽂，咽喉痛，唾脓⾎。五⽇可治，七⽇不可治，升⿇鳖甲汤主之。阴毒之为病，⾯⽬⻘，⾝痛如被杖，咽喉痛。五⽇可治，七⽇不可治，升⿇鳖甲汤去雄⻩、蜀椒主之。升⿇鳖甲汤⽅升⿇⼆两当归⼀两蜀椒（炒去汗）⼀两⽢草⼆两雄⻩半两（研）鳖甲⼿指⼤⼀⽚（炙）右六味，以⽔四升，煮取⼀升，顿服之，⽼⼩再服，取汗。（《肘后》、《千⾦⽅》阳毒⽤升⿇汤，⽆鳖甲有桂；阴毒⽤⽢草汤，⽆雄⻩）。）<4>⾥虚寒引起的⽔⾎同病证。⾥虚寒引起的⽔⾎同病分为两个层⾯：\n第⼀个层⾯：偏⾥的层⾯者为⽔盛⾎亏或⾎亏⽔盛；《⾦匮•⽔⽓病脉证并治第⼗四》：师⽈：⼨⼝脉沉⽽迟，沉则为⽔，迟则为寒，寒⽔相搏。趺阳脉伏，⽔⾕不化，脾⽓衰则鹜清，胃⽓衰则⾝肿。少阳脉卑，少阴脉细，男⼦则⼩便不利，妇⼈则经⽔不通，经为⾎，⾎不利则为⽔，名⽈⾎分。问⽈：病有⾎分⽔分，何也？师⽈：经⽔前断，后病⽔，名⽈⾎分，此病难治，先病⽔，后经⽔断，名⽈⽔分，此病易治，何以故？去⽔，其经⾃下。(本条原本缺据《脉经》补⼊)。释：这段话，⾥⾯也有千古疑案，是什么呢？就是这个“少阳脉卑，少阴脉细”。前⼈皆从经络经脉解释，其实是与仲圣所建⽴之学术体系格格不⼊的。这个少阳脉和少阴脉应该怎么解？我们要去《脉经》中寻找答案，《脉经》的作者王叔和，对仲圣学术之传承可谓厥功甚伟，这位⻄晋太医令应该是仲圣的再传或私淑弟⼦，他不但把仲圣学术整理成《伤寒》、《⾦匮》⼆书，令经⽅法门赖以流传，还把其中的内容整理到⾃⼰的《脉经》七、⼋卷中，对仲圣的学术崇敬溢于⾔表。并且在序⾔中明⾔：“夫医药为⽤，性命所系。和鹊⾄妙，犹或加思，仲景明审，亦候形证，⼀毫有疑，则考校以求验。故伤寒有承⽓之戒，呕哕发下焦之间”。可见，王叔和是⾸重研究医和、扁鹊、仲景的学术的。那么他在整理《伤寒》、《⾦匮》时，就要带⼊他们这些先贤的学术概念和经验的。⽐如这个少阳脉和少阴脉，在《脉经》中就可以找到答案。《脉经》卷五：扁鹊阴阳脉法第⼆脉，平旦⽈太阳，⽇中⽈阳明，晡时⽈少阳，⻩昏⽈少阴，夜半⽈太阴，鸡鸣⽈厥阴，是三阴三阳时也。这就可以明⽩了，这个“少阳脉卑”、“少阴脉细”，说的是病⼈脉象随三阴三阳时⾠的变化。卑，《说⽂》庳也，中伏舍。段⽟裁注:“谓⾼其两旁⽽中低伏之舍也。”就是两边⾼中间低的房屋，指低微的意思，借指沉微的脉像。微脉，《脉经》定义为“极细⽽软，或欲绝，若有若⽆”；细，《脉经》定义为“⼩⼤于微”，就是⽐微脉还稍微强⼀些。指的都是差不多脉象即微弱之脉。就是说这个虚寒的证型，脉虚弱，到了少阳（晡时）、少阴（⻩昏）的时候，由于⼈体阳⽓更弱了，所以脉也更虚了，沉微细弱。这种计时⽅法，最早见于《左传》杜预注，就是把⼀昼夜分为⼗⼆个时间段：夜半、鸡鸣、平旦、⽇出、⾷时、隅中、⽇中、⽇昳、哺时、⽇⼊、⻩昏、⼈定。每个时间段⼀个时⾠即⼆个⼩时。少阳晡时即申时，也就是下午：̶̶5:00；少阴⻩昏即戌时，也就是下午7:00̶̶9:00。这些时段，都是阳⽓衰微明显的时候，所以⼀些虚寒性疾病就会重。这个时间段的脉也就会格外的微细。或⽈：医者如何能在⼏个时⾠为患者把脉？答⽈：古⼈的习惯，是请医⽣到家中的，叫做“延医”。延，《礼记》⽈：“主⼈延客”，延医就是（病）主⼈延（请医⽣到家中做）客。所以我们读古代名医的列传，不管是医缓、医和、还是扁鹊、华佗，都是上门服务的。⼜或⽈，帝王将相可以延医上门，寻常百姓亦可乎？答案是肯定的，在《伤寒论。平脉法》就记载有仲景时代延医的习俗，如：“师⽈：病家⼈请云，病⼈苦发热，⾝体疼，病⼈⾃卧，师到诊其脉……病⼈⾃坐，师到脉之……”；“师⽈：病家⼈来请云，病⼈发热烦极。明⽇师到，病⼈向壁卧，此热已去也。设令脉不和，处⾔已愈。设令向壁卧，闻师到，不惊起⽽盻视……注意，都是病⼈在家“卧”病⽽师“到”诊其脉。所以孙思邈的《⼤医精诚》就告诫普天下的医⽣：“⼜到病家，⼜到病家，纵绮罗满⽬，勿左右顾眄；丝⽵凑⽿，⽆得似有所娱；珍羞迭荐，⾷如⽆味；醽醁兼陈，看有若⽆。所以尔者，夫⼀⼈向隅，满堂不乐，⽽况病⼈苦楚，不离斯须，⽽医者安然欢娱，傲然⾃得，兹乃⼈神之所共耻，⾄⼈之所不为，斯盖医之本意也！”作为医者，到了病家，豪华的装修也不要左顾右盼，超级⼥声也不要如痴如醉，海参鲍鱼吃起来不能吧唧嘴，因为酒驾也不能喝。药王⽼⼈家苦⼝婆⼼的教导我们医者上门服务的这些礼仪，恰恰是因为⾃古素有的延医的传统，这种传统⼀直延续到解放后组建联合诊所前。\n第⼀段中《⾦匮》的⽂字是分为三部分讲述的：①⼨⼝脉沉⽽迟，沉则为⽔，迟则为寒，寒⽔相搏。⼨⼝脉，也叫⽓⼝脉，就是现代医学的腕部桡动脉。“脉得诸沉，当责有⽔”，迟脉，主寒主虚，脉沉⽽搏动迟缓，虚寒⽔饮之象即所谓的寒⽔相搏。②趺阳脉伏，⽔⾕不化，脾⽓衰则鹜清，胃⽓衰则⾝肿。趺阳脉，也叫冲阳脉，就是现代医学说的⾜背胫前动脉。《伤寒论》序中所⾔之“⼈迎趺阳三部不参”，“三部”是指“⼈迎”（结喉旁颈总动脉）“⼨⼝”（腕部桡动脉）和“趺阳”脉（⾜背部胫前动脉）。古⼈对趺阳脉的切诊⾮常重视，特别是在诊⼤病险证的时候⽤来候胃⽓之根基。如《⽊刻本濒湖脉学•辨⽣死脉诀歌注解⽂》：“树⽆叶⽽有根，⼈困如斯，垂死⽽当治也。”趺阳脉伏，看《脉经》伏脉怎么定义的：“极重指按之，着⾻乃得”。那是⽐沉还沉，胃⽓虚衰⽆⼒⿎动脉搏了，胃⽓虚衰则虚寒⽔饮⽣矣，就会会出现⽔⾕不化，鹜清便溏，⾝体⽔肿了。③少阳脉卑，少阴脉细，男⼦则⼩便不利，妇⼈则经⽔不通，经为⾎，⾎不利则为⽔，名⽈⾎分。前⾯说过仲圣脉诊重视三部合参，⼈迎脉主要就是⽤来⽐较趺阳脉的，如“师⽈:⼈迎脉⼤，趺阳脉⼩，其常也;假令⼈迎趺阳平等为逆;⼈迎负趺阳为⼤逆;所以然者，胃⽓上升，动在⼈迎，胃⽓下降，动在趺阳，上升⼒强故⽈⼤，下降⼒弱故⽈⼩，反此为逆,⼤逆则死。”经⽅脉学体系有三条主线（即三部合参）和六段时相：⼀、趺阳脉主胃⽓主根；⼆、⼈迎脉⽤来⽐较顺逆；三、“独取⼨⼝”来统摄诸脉。（相关论述最早见于《内经》⼨⼝“独为五脏主”，直接提出“独取⼨⼝”最早见于难经•⼀难》，已经具体的指出：“⼨⼝者，脉之⼤会……五脏六腑之所终始，故法取于⼨⼝也”。⽽在《伤寒论》中被⼴泛实践应⽤，可见难经为伪书⼀说似难以成⽴，应该是仲圣以前或与仲圣同时代的著作。）⽽除了上述的三部合参，仲圣还⾮常重视的就是阴阳脉法，即把脉分三阴三阳时段来细辨⼈体阴阳之盛衰。这就是完整的经⽅脉法的体系：三条主线+六段时相。主要的思想可以参见王叔和收集在《脉经》中的那篇“扁鹊阴阳脉法第⼆”附录：脉，平旦⽈太阳，⽇中⽈阳明，晡时⽈少阳，⻩昏⽈少阴，夜半⽈太阴，鸡鸣⽈厥阴，是三阴三阳时也。少阳之脉，乍⼩乍⼤，乍长乍短，动摇六分。王⼗⼀⽉甲⼦夜半，正⽉、⼆⽉甲⼦王。太阳之脉，洪⼤以长，其来浮于筋上，动摇九分。三⽉、四⽉甲⼦王。阳明之脉，浮⼤以短，动摇三分。⼤前⼩后，状如科⽃，其⾄跳。五⽉、六⽉甲⼦王。少阴之脉紧细，动摇六分。王五⽉甲⼦⽇中，七⽉、⼋⽉甲⼦王。太阴之脉、紧细以长，乘于筋上，动摇九分。九⽉、⼗⽉甲⼦王。厥阴之脉，沉短以紧，动摇三分。⼗⼀⽉、⼗⼆⽉甲⼦王。<1>、<2>两段中本来就表现出了胃虚、虚寒、⽔饮的病机，⽤阴阳时段脉法去⼀看，在少阳晡时（申时）和少阴⻩昏（戌时），这些阳⽓衰微明显的时候，虚寒的反应更重了，所以这个时间段的脉也就会格外的微细虚弱，这⾮常符合临床所见。少阳（时）脉卑，少阴（时）脉细，男⼦则⼩便不利，妇⼈则经⽔不通，经为⾎，⾎不利则为⽔，名⽈⾎分。男⼦则⼩便不利，妇⼈则经⽔不通，经为⾎，⾎不利则为⽔，名⽈⾎分。胃虚、虚寒、⽔饮的病机都有了，在男⼦⼀般就会⾸先病⽔的，出现⼩便不利⽔⽓等⽔分病；⽽妇⼈胃虚、虚寒、⽔饮的病机存在时，⼀般⾸先就会影响到经⾎，引起“经⾎不通”，这⾥的“经⾎不通”并不是仅指闭经。《说⽂》：通，达也。《吕⽒春秋•达郁》：⾎脉欲其通也。注:“利也。”可见，这个通，就是利的同义词，是和上⽂的“利”字相呼应的骈⽂。想表达的意思是：“男⼦则⼩便不利，妇⼈则经⽔不利”。经⾎不利就包括⽉经的⾊量质周期经期的失调。⾎和⽔同属于阴所以经⾎也叫经⽔。接着看下⾯怎么说的：问⽈：病有⾎分⽔分，何也？师⽈：经⽔前断，后病⽔，名⽈⾎分，此病难治；先病⽔，后经⽔断，名⽈⽔分，此病易治，何以故？去⽔，其经⾃下。这也是疑案。为什么⾎分难治⽽⽔分易治？我们且来分析其中缘由。⾸先，男⼦会不会先病⾎后病⽔？会的。⼥⼦会不会先病⽔后病⾎？也会的。所以这两段话只是以阴阳男⼥来⺬其⼤略。并⾮男⼦就是病⽔⽔分，⼥⼦就是病⾎⾎分。勿论男⼥，只要是先有⾎病，⾎液不循常道，或上溢于⼝⿐诸窍，或下泄于前后⼆阴，或渗出于肌肤脉络形成诸如吐衄下⾎等，或⼥⼦不到五⼗所⽽闭经，⽽后发⽣⽔⽓⽔肿，这就是⾎分。⾎分是⾎不利⽽为⽔，营⾎先病，病到极重的程度就会影响到津液的充盈，津液虚了，就会流转不利，就像溪河之⽔⼀个道理，少了反⽽要流动不起来，就会淤滞⽽成腐⽔，就要发⽣⽔病了。这种情况治疗限于两难的境地，不利⽔则⽔饮充斥，利⽔反更伤津⾎，所以难治。这样的患者，临床中并不少见，如恶性贫⾎、再障、⽩⾎病、⼀些恶性肿瘤患者等，确为难治之疾；⽽先病⽔⽓⽔分，后病吐衄下⾎或闭经等，则是由于虚寒⽔饮盛了，胃虚了，影响到了营⾎的⽣成，⽤温阳补中利⽔养⾎的⽅法去对治就⾏的，这些治则本来就并⾏不悖，这样的⽅⼦在经⽅中俯拾皆是，并且也是仲圣组⽅体系中的⼀个重要理论根据，所以说易治。依据此类组⽅法则的⽅剂可以见到诸如：温阳可以暖胃⽽补中（如四逆汤等）；温阳可以胜阴⽽利⽔（如真武汤等）；温阳可以煦营⽽养⾎（如当归⽣姜⽺⾁汤等）；补中可以健运⽽利⽔（如肾着汤等）、补中可以滋化⽽养⾎（如⼤建中汤等）、补中可以回津⽽温阳（如⽢草⼲姜汤等）；利⽔可以去秽⽽养⾎（如⾚⼩⾖当归散等）、利⽔可以回厥⽽温阳（如茯苓四逆汤等）、利⽔可以降浊⽽补中（如泽泻汤等） 渴⼝苦喝⽔不多，苔有裂纹较燥⽅根：多半个桂枝汤⽅根（⽆⼤枣）解表补津液芍药⽢草汤清热补津液⽣姜⽢草汤（⽆⼤枣）健胃化饮补津液多半个桂枝茯苓丸（⽆茯苓）清热⽔⾎同治养津液多半个吴茱萸汤⽅根温胃寒解表饮治厥阴补津液多半个⻨门冬汤⽅根清热益胃化饮补津液处⽅：温经汤王庶问：许师，此案为何⽤不到半夏⼲姜⽅根呢？许师⽈：津伤有热不适合⼲姜。王庶问：这个热与泻⼼类的热区别在哪？许师⽈：厥阴津（⾎）伤之热液可以有半虚实的热，⽽以虚热为主，以下焦津⾎不⾜为主；三泻⼼类⽅以实热和湿热为主，以中焦⽔热冤结为主。徐伟⽈：枳实栀⼦豉的剂量。枳实、栀⼦、淡⾖豉、醋5ML（代清浆⽔）。许师⽈：醋浆⽔,味微酸，主清热除烦，滋养津液。⼀名酸浆⽔,⼀名清浆⽔。可⽤⻨⾯汤和⾖芽汤发酵⽽成类似啤酒的饮品，取⻨及⾖芽之味鲜。亦可⽤淡醋代之。发现过程⼤概是吃⾯地⽅的⼈，喝剩下的⾯汤⽆意间发酵了，⼀尝味道不错，于是开始制作，渐成为⽼少咸宜的饮品，类似现在的啤酒。再后来⼜⽤⾯汤和⾖芽汤来发酵，因为⻨⾯是粮⾷中味最鲜的，⾖芽也是味鲜的。就象经⽅⽤药，有时取其⽓，有时取其味。\n第二十一課芍藥四物解肌湯考釋（五穀）（2014.9.27）今晚讲⼀下芍药四物解肌汤。好⼏个兄弟要求讲这个⽅⼦了。今晚插播⼀下，太阴病的衍伸还没完稿，完稿后再接上讲太阴。芍药四物解肌汤考释：双解表⾥、清热散结、清利湿热、解肌化斑的芍药四物解肌汤。先从⼀个医案⼊⼿学习这个⽅⼦。许某，⼥，岁。初诊⽇期：20131023。主诉：感冒发烧⼆天，服退烧⻄药烧退后数⼩时即复发烧，输液⼀次未效。刻诊：体温39.0℃，咽痛，扁桃体肥⼤增⽣，⾊红，有多处点状⼩凹陷。⼝⼲，饮⽔亦咽痛，故亦不喜饮，不欲⾷。发热，恶寒，⾝着棉袄，⽆腹痛腹胀，⼤便两⽇未⾏，⼩便可，⾊⻩。⽤⻄药退烧时⾝微汗，⽆胸闷⼼慌，家⼈诉昨夜发烧，夜眠后忽⾃⾏起床⾏⾛似梦游，家⼈呼之不应，后⼜⾃睡。⽉经周期可，经期五到⼋天，⾊红量多有块，带可，⽆腹痛腹胀，⽆⼩腹凉，下肢⽆按肿甲错，⾯⾊可。脉数微浮，⾆红苔⻩⽩厚腻。六病辨证：太阳阳明合病处⽅：芍药四物解肌汤柴葛根⻩芩升⿇⽣⽩芍⼀剂当天服药两次即退烧。翌⽇已可正常上学。家⼈诉因为⾃幼即有扁桃体肥⼤发炎病史，每次感冒咽痛后⼀般⾼烧退后低烧也要持续⼀周左右始退，即使输液服消炎药也是⼀周退烧，不治疗⼀周也可以⾃退。但是这次服⽤中药不但退烧快，还在烧退后咽喉即已随之不痛，是以超乎想象的。后来患者的家长遇到我⼏次都问这样好的⽅⼦是不是可以去申请专利。（今年芍药四物解肌汤勘定的成⼈剂量是柴葛根⻩芩升⿇⽣⽩芍。治外感病⼉童岁后量可以同成⼈）按语：、辨证思路患者发热恶寒脉微浮，邪在太阳表位不彻，⽽阳明⾥热已炽，故见⼝⼲咽喉红肿溃疡疼痛，便迟溲⻩，甚⾄神昧梦游，脉数、⾆红苔⻩⽩厚腻也显⺬了⾥热的炽盛，⽉经⾊红量多有块也与患者素体蕴热有关。由于⾥热燔灼胃中⼲津液少所以患者不欲饮⾷。、施治法则阳明⾥热炽盛⽽太阳表邪不彻，这种情况，要在清解⾥热的同时注意解表。由于患者⾥热渐实津亏液燥已经显露，加之溃疡属于“疮家”不可以发汗，所以⼀般不再适宜选择⾟温的⿇⻩桂枝类解表药，⽽要选择⾟凉或性平的葛根、升⿇类去微透表邪⽽能清解⾥热，即所谓的双解表⾥。所以选择了双解表⾥、清热散结、清利湿热、解肌化斑的芍药四物解肌汤。、引申思考暨芍药四物解肌汤考释：（）来源考释芍药四物解肌汤最早见于孙思邈的《千⾦要⽅·卷第五·少⼩婴孺⽅·伤寒第五》，《千⾦⽅》是经⽅的仓库，⾥⾯搜集了很多经⽅的好⽅⼦，但是药王⽼⼈家有个缺点，就是他⼀般不注明⽅⼦的出处来源，⽽王焘就在这点上做得很好，他的《外台秘要》⽅⼦⼤都有原出处。当然王焘也有王焘的缺点，那就是有的时候随意改动剂量。《千⾦要⽅·卷第五·少⼩婴孺⽅·伤寒第五》治少⼩伤寒，芍药四物解肌汤⽅：芍药⻩芩升⿇葛根各半两上四味，㕮咀，以⽔三升，煮取九合，去滓，分服（笔者按：或作分五服，《外台秘要》分四服）。期岁以上分三服。）释：这张治⼩⼉伤寒的⽅⼦⾔辞简略，需要我们纵观药王全篇⽴意以及以药测证去解读。期岁，期，在这⾥读ji，古也作朞（ji），期岁就是⼀年的意思，也就是⼀周岁。唐⾼宗《定明堂规制诏》：“⼀朞有四时。……⼀朞⼗有⼆⽉”（《全唐⽂》卷⼀三）。就是说⼀岁以内的分四次或五次服⽤，⼀周岁以上的就可以分三次服⽤了。这也指导了我们临床中⼩⼉的服药频率。药王在此篇前论⽈：夫⼩⼉未能冒涉霜雪，乃不病伤寒也，⼤⼈解脱之久，伤于寒冷，则不论⽿。然天⾏⾮节之⽓，其亦得之，有时⾏疾疫之年，⼩⼉出腹，但患斑者也，治其时⾏节度，故如⼤⼈法，但⽤药，分剂少异，药⼩冷⽿。这段话的意思是说：⼩⼉在⽗⺟的精⼼呵护下，是触冒不了风寒霜雪，所以⼀般得不了伤寒病。当然要是⼤⼈长时间的照顾不周，感触寒冷，那⼜另当别论了。从这段话可以透漏出另⼀层信息是，最迟在晋唐代，伤寒就作为外感病的代名词了，⽤这种眼量去读伤寒论，当然是读不到真正的精义的！要知道仲圣伤寒是为百病⽽⽴，⽽⾮为外感⼀病⽽⽴。所以说，仲圣⼼法，⼀经问世，即已散轶。故⽽孙思邈在《⼤医精诚》第⼀句话就说：“张湛⽈：夫经⽅之难精，由来尚已！”张湛是东晋⼈，博学之通儒，撰有《养⽣要集》、《列⼦注》、《冲虚⾄德真经注》等，并且在在医学⽅⾯极有造诣。陶弘景的《养性延命录》也是参考了张湛《养⽣要集》，其卷上《教诫篇第⼀》就引张湛养⽣著作，将养⽣法则归纳为⼗⼤要。孙思邈《千⾦翼⽅卷⼗⼆养性禁忌》开篇也引述了张湛养⽣⼗要的内容。接着解《少⼩婴孺⽅。伤寒》的前论：但是天⾏不正之时⽓，如春应温⽽寒，冬应寒⽽暖等，那都会导致⼩⼉伤寒的发⽣。甚⾄更有天⾏疫⽓，尤其会导致婴幼⼉发斑疫疠。这些病的治法，和⼤⼈⼀个法则，只是⽤药的剂量少⼀些（⼩⼉形⽓未充脏腑柔弱），⽤药的⽓味偏寒凉⼀点（⼩⼉纯阳之体⽕<⼼>常有余）。（）法度考释“如⼤⼈法，分剂少异，药⼩冷⽿”，这是药王治⼩⼉伤寒的法度，同样也贯穿在芍药四物解肌汤中。所以这⾸⽅⼦的四味药，都是偏于寒凉或者平性的，解表⽤葛根，清热⽤⻩芩，化斑⽤升⿇，养津⽤芍药。同时升⿇亦可解表清热；葛根亦可清热⽣津，芍药亦可化斑清热。故可以⽤于表有外邪⾥有实热者；⼜则⻩芩可以燥湿，芍药可以利⽔，所以⼜可以⽤于表有邪⽽⾥有湿热者。（）⽅药考释此⽅葛根升⿇都可以双解表⾥，⽽⾟凉解表尤需倚重葛根。葛根既可以解表（如葛根汤），⼜可以清热解毒（如芍药四物解肌汤），还可以清解湿热（如葛根芩连汤）;升⿇之⽤，在经⽅更重视其解毒辟邪之功效，《本经》明⾔其：“解百毒，杀百⽼物殃⻤，辟温疾，障，邪毒蛊”，可解阳毒（升⿇鳖甲汤），阴毒（升⿇鳖甲去雄⻩蜀椒汤），脓毒（⿇⻩升⿇汤、升⿇鳖甲汤），疫毒（芍药四物解肌汤）；芍药，清热和⾎养营利⼩便，芍药四物解肌汤中⽤芍药，这是依照桂枝汤法度演变的痕迹。太阳表邪虽不了了，阳明⾥热已经炽烈，所以不适合⾟⽢发散故去桂枝⽢草法，⽤葛根升⿇⾟凉苦平双解；⾥邪热盛不适合⽣姜⼤枣温卫，所以去之加⻩芩芍药清热凉润利津和营。在经⽅中，芍药四物解肌汤与桂枝汤、⻩芩汤、葛根汤这三张⽅⼦关系最密切，⽽这三张⽅⼦共有的药物就是芍药，所以拿出芍药作为⽅名其实是经⽅思维制⽅的⼀⼤伏笔。⻩芩，《本经》⾔其：“主诸热”，其实它主的是邪盛之⾥热为主⽽⾮卫强的表热，⽽除了温热之薮阳明这个⾥热，⻩芩更多的是主少阳和厥阴的邪热。诸如⼩柴胡汤、⼤柴胡汤、柴胡加芒硝汤、柴胡去半夏加⽠蒌汤、柴胡桂枝汤、⻩芩汤、⻩芩加半夏⽣姜汤是以少阳为主的邪热；⽽柴胡桂枝⼲姜汤、柴胡加龙⾻牡蛎汤、三泻⼼汤类⽅、附⼦泻⼼汤、六物⻩芩汤是以厥阴（类厥阴）为主的邪热。上⾯说过，芍药四物解肌汤有依照桂枝汤法度演变的痕迹，那么，这个痕迹重要的⼀个环节就是⻩芩汤，也就是说，桂枝汤为阳性的补津液除热⽅，⻩芩汤为阴性的补津液除热⽅（在《辅⾏诀》中桂枝汤为⼩阳旦汤，⻩芩汤加⽣姜为⼩阴旦汤），那么在这两个⽅⼦中间的证，就是芍药四物解肌汤的证型。所以芍药四物解肌汤既可以解表邪，⼜可以养护津液除热，因为药物的组成攸关，它还达不到补益津液的层⾯，只是清热养护津液，还有它独具的养营和⾎化斑的功⽤尤需我们重视。仲圣本草学术，虽然与《神农本草经》关系密切，但是⼜不尽然，有其独特的⽤法和理解。同样，我们再来对照⼀下记载在《千⾦翼⽅》中本草的性味功⽤与《神农本草经》之异同，以体悟芍药四物解肌汤组成的原理：①葛根《神农本草经。中经》味⽢平。主消渴，⾝⼤热，呕吐，诸痹，起阴⽓，解诸毒。《千⾦翼⽅。本草中品之上》味⽢，平，⽆毒。主消渴，⾝⼤热，呕吐，诸痹，起阴⽓，解诸毒。疗伤寒中风，解肌发表出汗，开腠理。疗⾦疮，⽌痛，胁风痛。注：除了清热解毒⽣津，《翼⽅》还注重葛根的解肌发表出汗之功效，更明确了葛根在表证中的使⽤地位。②芍药《神农本草经。中经》：味苦平。主邪⽓腹痛，除⾎痹，破坚积寒热，疝瘕，⽌痛，利⼩便，益⽓。《千⾦翼⽅。本草中品之上》：味苦酸，平，微寒，有⼩毒。主邪⽓腹痛，除⾎痹，破坚积，寒热疝瘕，⽌痛，益⽓，通顺⾎脉，缓中，散恶⾎，逐贼⾎，去⽔⽓，利膀胱⼤⼩肠，消痈肿，时⾏寒热，中恶，腹痛，腰痛。注：《翼⽅》已经注意到芍药有酸味的功⽤，并且可以利膀胱⼤⼩肠，即通利⼆便。既可以通利⼩便，⼜可以通利⼤便。这个《伤寒论》条所⾔如出⼀辙：“太阴为病,脉弱,其⼈续⾃便利,设当⾏⼤⻩芍药者,宜减之,其⼈胃⽓弱,易动故也。”，符合仲圣的本草思维。③⻩芩《神农本草经。中经》：味苦平。主诸热⻩疸，肠澼，泄利，逐⽔，下⾎闭，恶创恒蚀，⽕疡。《千⾦翼⽅。本草中品之上》：味苦，平，⼤寒，⽆毒。主热⻩疸，肠澼泻痢，逐⽔，下⾎闭，恶疮，疽蚀，疗痰热，胃中热，⼩腹绞痛，消⾕，利⼩肠，⼥⼦⾎闭，淋露下⾎，⼩⼉腹痛。注：《翼⽅》已经注意到⻩芩的寒性，以及在⾥热、湿热病机中的重要应⽤。④升⿇《神农本草经。上经》：味⽢⾟（《⼤观本》作⽢平）。主解百毒，杀百⽼物殃⻤，辟温疾，障，邪毒蛊。久服不夭。（《⼤观本》作主解百毒，杀百精⽼物殃⻤，辟瘟疫瘴⽓邪⽓⾍毒，此⽤《御览》⽂）。《千⾦翼⽅。本草上品之上》：味⽢苦，平，微寒，⽆毒。主解百毒，杀百精⽼物殃⻤，辟温疫瘴⽓，邪⽓蛊毒⼝皆吐出，中恶腹痛，时⽓毒疠，头痛寒热，风肿诸毒，喉痛⼝疮。久服不夭，轻⾝长年。注：《翼⽅》已经注意到了升⿇还有苦和微寒的性味，除了解毒辟邪，更多的可以⽤在风肿诸毒，喉痛⼝疮。综上所述：、芍药四物解肌汤在经⽅⽅剂学上乃处于阳性的补津液除热⽅桂枝汤和阴性的补津液除热⽅⻩芩汤之中间的链接。、芍药四物解肌汤在临床证型学上常见于乃葛根汤之后，⻩芩汤之前之病段，与葛根汤、⻩芩汤的组⽅脉络关系密切。、芍药四物解肌汤既可以微通⼤便（阳明⾥热为主或再兼表所致），⼜可以清热⽌利（阳明湿热为主或再兼表所致）。、芍药四物解肌汤清解化斑解⽪肤之郁热毒邪之功⽤应当重视。、芍药四物解肌汤病机乃太阳表邪欲解未彻，阳明⾥热、湿热熏蒸上焦或（和）表位以及燔灼中焦弥漫下焦之候。、芍药四物解肌汤诸多功⽤，不出双解表⾥、清热散结、清利湿热、解肌化斑四端。今个⼉已经悉数讲解透彻，私⼼想着若是⼤家熟读体味，定可增加见闻，对临床毕竟是极好的。","hasDose":false},{"caseId":"P0084","caseSource":"临床医案解伤寒四期班","caseType":"讲义医案","归集方":"桂枝加芍药汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：“高血压”一年，闭经两个月。","symptom":"主诉：“高血压”一年，闭经两个月。","history":"","exam":"刻诊：头晕时作，无头痛，无口干口苦，饮水一般，纳可，大便","analysis":"","prescription":"处方：桂枝加芍药汤","effect":"二诊：患者半年后始来二诊。诉服药一剂后月经即来潮，尽十五","comment":"","caseExcerpt":"主诉：“高血压”一年，闭经两个月。\n病史简要：一年前因头晕测得高血压，平素波动在 BP170—\n140/140—120mmhg 之间，两个月前闭经，因胞弟患高\n血压经我处治愈而来求诊。\n刻诊：头晕时作，无头痛，无口干口苦，饮水一般，纳可，大便\n一两日一行，质可，溲可。带可，闭经两个月。未闭经前\n月经周期可，经期四五日，色量可，有块，小腹不凉，偶\n腰痛。无恶寒，无汗，无手足凉麻，平时易感冒疲乏干哕，\n无心慌胸闷。下睑淡白，目眶黯黑，按腹满，扪手微凉，\n下肢轻度血络浮露。\n舌脉：脉浮细弦，舌淡红紫嫩苔薄白腻。\n六病辨证：\n表束+表寒\n太阴伤血+血少\n阳明里结+外燥\n方证：桂枝加芍药汤\n\n处方：桂枝加芍药汤\n桂枝 18 生白芍36 炙甘草12 生姜18 大枣 24\n水煎服 15剂\n二诊：患者半年后始来二诊。诉服药一剂后月经即来潮，尽十五\n剂后BP110/60mmhg，以为中药是“强效降压药”，加之月\n经每月行经规律无明显不适故一直未复诊，今恰至胞弟家\n走亲，顺便复诊调理身体。\n月经周期三十天，经期四五日，色可，量多，有块，块多\n时有头晕感。无腰腹痛胀冷，无手足冷，无恶寒，无汗。无口干\n口苦，饮纳可，大便日一行，质可，溲可，无夜尿，带可，无心\n慌胸闷，眠可。\n刻诊 BP110/60mmhg，无头痛，过劳易头晕干哕甚则呕吐，身易\n乏力，面色萎黄，目眶黯黑，下睑淡白，腹软，扪手微冷，小腿\n轻度甲错血络。\n舌脉：脉浮细弦，舌淡红紫嫩苔薄白腻。\n六病辨证：\n表束+表寒\n太阴伤血+血少\n阳明里结+外燥\n方证：桂枝汤\n处方：桂枝汤\n桂枝 18 生白芍18 炙甘草12 生姜18 大枣 24 黍米48\n\n水煎服 5剂\n三诊：头晕已减，乏力已减，面色改善，手扪稍冷。余症同前。\n脉浮细，舌淡红紫嫩苔薄白边有齿痕。\n处方：桂枝加黄芪汤\n桂枝18 生白芍18 炙甘草 12 生姜18 大枣24 黄芪 30\n水煎服 10剂，巩固疗效。\n按语\n1、辨证思路：\n<1>、辨症\n患者头晕，这是表位和上焦的问题而属于表束证，但无恶风\n恶寒发热骨疼等表邪侵袭津血充滞为所急所苦的表现，且下睑淡\n白目眶黯黑血络浮露，这是由于津血不足不能荣养濡润所致，属\n于表束的第二层面，即有表证无表邪；因为津血亏损，也导致了\n月事不能依时而下而发生闭经等里证。津血亏虚不能濡养胞宫则\n月事不能依时而下，不能濡养肠道则大便行迟，因为不是胃中燥\n烦满实，所以大便不硬口无干苦。不能濡养肢体则疲乏少力时作\n腰痛，经言“正气存内，邪不可干”，津血不能充养则外邪容易\n侵袭，故而患者会时常感冒干哕，在发作感冒有典型表邪时，会\n出现表束的第一层面有表证有表邪，但刻诊没有表现就需要按照\n第二层面论治，这种“随证治之”也是病传所统摄的法度之一。\n我们经过研究发现，在仲圣体系中，津液本来就是包含阴\n阳的，具体公式是：\n\n表： 曰卫 曰阳 曰气\n津液\n里：曰营（荣） 曰阴 曰血\n津液是一，阴阳是二，打个比方，津液就是一种对人体有正\n能量的热水，没有水（阴血—荣——濡润荣养）的形态，热（阳\n气—卫——防御温煦）就无所依附；同理，没有热（阳气—卫—\n—防御温煦）的功能，水（阴血—荣——濡润荣养）就是废水死\n血。所以我们人体是恒温的，惟有保持这种恒温才不会生病，温\n度过高过低都会生病，这也就是为什么伤寒经方体系特别注重寒\n热症状的道理所在，津液最怕寒热两端。所以津液偏阴偏血（濡\n润荣养）的一面伤损也会影响到偏阳偏气（防御温煦）的功能，\n偏阳偏气（防御温煦）的一面伤损同样也会影响到偏阴偏血（濡\n润荣养）的功能。故而仲圣经方一个鲜明的特点就是常见阴阳寒\n热配伍（九成以上）而少见纯阴纯阳纯寒纯热的配伍（不足一成）。\n即如此案，因为津血不能濡养也会影响到阳气的温煦，所以触诊\n患者手偏凉。\n人体是个杯子，倒进去热水（津液），杯子热了（37℃），\n把水倒出来，杯子就会凉下来。那么这种水（濡润荣养）和热（防\n御温煦）能不能绝对分得开？没有濡润荣养，防御温煦从何而来。\n同样，没有防御温煦，这只是一杯冷水死血！\n<2>、辨脉：\n脉浮为病在表，如\n\n《伤寒论》1 条：“太阳之为病，脉浮”；\n《伤寒论》45条：“浮为在外......今脉浮，故在外”；\n《伤寒论》51条：“脉浮者，病在表”。\n但是属于表束的第一层面还是第二层面甚至是属于外证都\n需要再抽丝剥茧继续辨别，如 29条太阴外证也会“脉浮”。\n脉细主诸不足，特别是营血不足，如\n《伤寒论》60条：“下之后，复发汗，必振寒，脉微细。所\n以然者，以内外俱虚故也。”\n《伤寒论》351 条：“手足厥寒，脉细欲绝者，当归四逆汤\n主之。”\n《金匮要略》：“少阴脉细......女子则经水不通”。\n因为兼有脉细，弦脉为在这里也主虚，并且主津血不足濡养\n不及，如：\n《金匮要略。痰饮咳嗽病脉证并治第十二》：“脉双弦者......\n善虚”\n《金匮》：“脉弦者，虚也”\n《金匮》：“转筋之为病......脉上下行，微弦”。\n《伤寒论》100 条：“阴脉弦，法当腹中急痛”。\n<3>、辨舌：\n舌淡红嫩为表病和虚病的常见之舌质，而紫舌为瘀滞有余\n之象，苔薄白腻在这里也是有余之邪夹杂的征象，与紫舌同为闭\n经之呼应。\n\n2、施治法则\n表束第二层面需要治里为主而兼顾表证，津血不足不濡诸证\n需要补益津血而荣养濡润，闭经血结胞宫需要通闭解结。故此证\n治法需要补津血而解表束，补津血而濡血脉，补津血而逐废血。\n《伤寒论。辨不可发汗病脉证并治》：“诸脉得数动微弱者，\n不可发汗，发汗则大便难，腹中干，胃燥而烦，其形相像，根本\n异源。”\n浮、细脉也属于动、弱脉的范畴，并且此条所述之禁忌就包括此\n案之情形。所以不是表束之第一层一般不可以汗法为主或发大汗。\n方选桂枝加芍药汤，符合“补津血而解表束，补津血而濡血\n脉，补津血而逐废血”的治则。补津液而解表束这是阳旦法则（桂\n枝汤）的基本要义，故选用桂枝汤作为方干打底。补津血而濡血\n脉就是要把桂枝汤调整成更濡润一些的状态，所以倍用芍药。并\n且津血不足还需攻逐恶血浊水者，芍药常为首选之品。故芍药，\n《本经》：“主邪气腹痛，除血痹，破坚积寒热，疝瘕，止痛，\n利小便，益气”；《别录》：“主通顺血脉，缓中，散恶血，逐\n贼血，去水气，利膀胱、大小肠，消痈肿，时行寒热，中恶，腹\n痛，腰痛。”\n二诊时闭经已愈，血压如常，血结的病机已经得到解除，\n故而减半“散恶血，逐贼血”的芍药剂量，继续用打底的桂枝汤\n来补津血而解表束，补津血而濡血脉。\n\n三诊时津血荣养濡润的症状继续改善，而手凉尚未改善，\n加之齿痕舌的出现，并且因为津血已经得到了濡养，所以才可以\n在桂枝汤的基础上加黄芪而成桂枝加黄芪汤，以增强温煦防御散\n寒除湿之效用而不惧黄芪生姜发散之力。\n所以惜墨（药）如金者，必求丝丝入扣也！此即经方“存\n津液”、“和营卫”之要义而贯穿伤寒法则之始终耳！\n3、方机\n①桂枝加芍药汤\n桂枝三两 芍药六两 炙甘草二两 生姜三两 大枣十二枚\n方干：桂枝甘草汤 芍药甘草汤 桂枝汤 半个生姜甘草汤\n方眼：桂枝汤（最大之方干）+芍药（最大剂量）\n方势：解表 温卫 补津 .................................... 114 \n第四节 如何从所急所苦判断病机.......................................................... 120 \n一、何为所急所苦............................................................................ 120 \n二、所急所苦背后的病机................................................................ 122 \n三、针对病机如何处方用药............................................................ 123 \n第四章 方证与方机.......................................................................................... 126 \n第一节 以“庖丁解牛”谈经典经方的方机体系.................................. 126 \n庖丁之技与经方病机........................................................................ 126 \n经方方机体系.................................................................................... 127 \n\n总结.................................................................................................... 130 \n第二节 初谈经方机要与学习方法和思维方式...................................... 131 \n方剂是基础 经方重层次.................................................................. 131 \n精准不合方 病机成体系.................................................................. 131 \n病案示例津液整体观........................................................................ 132 \n学习心得............................................................................................ 135 \n思维方式............................................................................................ 135 \n第三节 方证表里之辨及转方思路临床感悟.......................................... 136 \n一 阴旦名释...................................................................................... 136 \n二 方证原文...................................................................................... 136 \n三 医案析理...................................................................................... 137 \n第四节 从麻黄与石膏的比例理解麻石方阵.......................................... 143 \n一、思维要素——药症（麻黄 石膏）.......................................... 143 \n二、思维要素——方根（麻黄+石膏）.......................................... 144 \n三、麻石结构方证梳理.................................................................... 145 \n第五节 纯经方非独现存宋本伤寒金匮方.............................................. 156 \n伤寒论成书及版本............................................................................ 156 \n伤寒论为残卷.................................................................................... 156 \n金匮要略传本.................................................................................... 157 \n考证唐本金匮之百合病.................................................................... 157 \n考脉经为最早传本之一.................................................................... 158 \n第五章 临床医案与心得.................................................................................. 160 \n凡庚临床医案三则.................................................................................... 160 \n案一 纳差.......................................................................................... 160 \n案二 头晕.......................................................................................... 163 \n案三 月经不调.................................................................................. 165 \n晓辉临床医案四则 一.............................................................................. 167 \n案一 小儿口水兼夜啼...................................................................... 167 \n案二 老妇四十年胸膜炎.................................................................. 168 \n案三 小儿高烧十日.......................................................................... 169 \n案四 婴儿便秘案.............................................................................. 171 \n晓辉临床医案四则 二.............................................................................. 173 \n案一 丁丁肿痛.................................................................................. 173 \n案二 小儿急性腹痛.......................................................................... 173 \n案三 糖尿病乏力案.......................................................................... 176 \n案四 胃胀兼有月经不调的病人...................................................... 177 \n\n伟东银屑病跟诊医案分享及个人心得感受............................................ 179 \n银屑病医案记录：............................................................................ 179 \n医案讲解：........................................................................................ 181 \n个人亲身案医案................................................................................ 181 \n个人学习体会.................................................................................... 182 \n\n第一章 六病病机体系 \n第一节 太阳病病机体系复习 \n 海岗 2016.11.29 \n晚上好， 今晚 8 点 15分由我和大家一起来复习经典经方病机体系的太阳病\n的病机！这一段时间新门诊装修，准备搬迁琐事较多，准备比较仓促，不周之处\n请兄弟姐妹们海涵。开始之前先给大家说一下课程的安排，本周二讲太阳的基础\n病机，基础药证，下周二讲太阳病的复合病机，方证。 \n一、经方首重表里及表束三层面 \n许师曰： 《伤寒论》读完你会发现，仲景首重表里，有时都可以放开虚实寒\n热不管，先重表里，表里是第一位的。表里之辨是贯穿在我们辨病机的始终的，\n仲景先师之所以能称医圣， 在某种意义上甚至可以说是表里的关系尤其是对表的\n问题的独具思考才奠定了他医圣的江湖地位，我们的师父在研究伤寒论时，提出\n一个独特而又有重要意义的概念：表束。 \n表束是个病机的概念，是由于津液的离合输布失和引起的在表位的表现。表\n束的三个层面： \n1、有表证有表邪，如伤寒、中风、湿病等，治法发表为主，治里为辅，用药升 \n散为主，如麻黄汤、桂枝汤、麻杏薏甘汤。 \n2、有表证无表邪，如水逆、气逆、火逆、血虚而血气上逆，治法治里为主，治\n表为辅用药酸苦咸淡寒凉降敛为主，如苓桂术甘汤、葛根芩连汤、小建中汤。 \n3、外证：如太阴外证甘草干姜汤、阳明外证白虎汤，治法纯用治里，不可攻表， \n用药虚寒则温补之，实热则寒清之。 \n二、太阳病实质 \n我们今天的复习的主体是太阳病他是表束的第一层面， 太阳病的实质是津液\n的绝对或相对充滞在表， 单纯的太阳病是不入里的。 太阳病的特点： 表 实 热 。\n病位---表位，病性--实，热。针对这种特点，仲圣示出太阳的治法是：辛温开达，\n决散表实。 \n三、太阳病基础病机——药症 \n表束在太阳的这个层面，一般喜欢用辛药来开达，常用药是麻黄，桂枝，杏\n仁，葛根。 \n（一）麻黄 \n1.本草文献记载： \n\n《神农本草经》 ： “味苦温。主中风伤寒头痛温疟，发表，出汗，去邪热气，止咳 \n逆上气，除寒热，破症坚积聚。 ” \n《名医别录》 ： “微温，无毒。主治五脏邪气缓急，风胁痛，字乳余疾，止好唾， \n通腠理，疏伤寒头痛解肌，泄邪恶气，消赤黑斑毒。 \n2.经方药理分析 ： \n前人有桂枝为太阳正药的论点，其实是非常值得商榷的，因为太阳中风桂枝\n汤证并不是津液绝对在表充盈之典型太阳病，并且除了太阳中风，桂枝汤还可以\n对治少阳中风、太阴中风、少阴中风、类厥阴，中风，确切的来讲更是一张类厥\n阴方证的方子，所以麻黄才是太阳病之正药，麻黄汤才是太阳病之正方，仲圣之\n用麻黄，不外四端：解表祛邪，发越水气，逐散血实，醒脑开窍。 \n解表祛邪，故可“主中风伤寒头痛温疟，发表，出汗，去邪热气，止咳逆上\n气，除寒热” 、 “主治五脏邪气缓急，风胁痛，通腠理，疏伤寒头痛解肌，泄邪恶\n气” 。发越水气，故可“止好唾” ；逐散血实，故可“消赤黑斑毒，字乳余疾” ；\n醒脑开窍，故可以治头痛疗五脏邪气（风中五脏）而为还魂汤、续命汤诸方之第\n一要药。 \n3.经方中的具体应用： \n ①发汗解表以治寒热咳喘风寒表病，如麻黄汤、葛根汤、葛根加半夏汤、小\n青龙汤、大青龙汤、麻杏甘石汤、厚朴麻黄汤、射干麻黄汤、麻黄附子甘草汤、\n麻黄附子细辛汤、 桂枝麻黄各半汤、 桂枝二麻黄一汤、 桂枝二越婢一汤、 文蛤汤、\n牡蛎汤、乌头汤、桂枝芍药知母汤、古今录验续命汤、千金三黄汤、千金小续命\n汤、千金续命煮散、千金大续命散等。 \n ②祛湿散饮以治水证湿病饮病黄疸，如麻黄加术汤、麻杏薏甘汤、甘草麻黄\n汤、麻黄附子汤、麻黄连轺赤小豆汤、麻黄醇酒汤、半夏麻黄丸、小青龙汤、小\n青龙加石膏汤、麻杏甘石汤（即《金匮》杏子汤） 、厚朴麻黄汤、射干麻黄汤、\n越婢汤、越婢加术汤、越婢加半夏汤、桂枝去芍药加麻黄附子细辛汤、桂枝芍药\n知母汤等。 \n ③散血化瘀以治血实瘀滞吐衄恶血，如麻黄汤、外台深师麻黄汤、麻黄升麻\n汤、麻黄连轺赤小豆汤、小品漏芦汤、小品漏芦连翘汤等。 \n附： 《外台》卷十引《深师方》: 外台深师麻黄汤 \n麻黄六两（去节） ，桂心一两，甘草（炙）二两，杏仁（去尖皮）二两，生姜八\n两。主上气咳嗽，喉中水鸡鸣，唾脓血腥臭。 \n ④醒脑开窍以治卒死客忤中恶中风痱，如金匮还魂汤、古今录验续命汤、千\n金三黄汤、千金小续命汤、千金续命煮散、千金大续命散等。 \n（二）桂枝 \n1.本草文献记载： \n《神农本草经》 ： “味辛温。 主上气咳逆， 结气喉痹， 吐吸， 利关节， 补中益气。 ” \n\n《名医别录》 ： “味甘、辛，大热，有毒．主温中，利肝肺气，心腹寒热，冷疾，\n霍乱，转筋，头痛，腰痛，出汗，止烦，止唾，咳嗽，鼻齆（ wèng） ，能堕胎，\n坚骨节，通血脉，理疏不足，宣导百药。 ” \n2.经方药理分析 \n 桂枝为经药之首，仲圣方凡二百余，用桂枝者七十余，这充分说明了经方首\n重表里之辨，且尤重表证之要。仲圣之用桂枝，不外四端：①解表祛邪，②调和\n营卫，③降逆(气逆、水逆、火逆、血逆诸逆皆可） ，④止痛（内外皆可，肢痛腹\n痛。 \n 解表祛邪，故可“出汗” ， “利关节” ； 调和营卫，故可“通血脉，理疏不足，\n宣导百药” ；降逆、止痛，故可“主上气咳逆，结气喉痹，吐吸，利关节” ， “主\n温中，利肝肺气，心腹寒热，冷疾，霍乱，转筋，头痛，腰痛” ， “止烦，止唾，\n咳嗽，鼻齆，能堕胎，坚骨节” 。 \n3.经方具体运用 \n ①解表祛邪 \n 常配伍麻黄，如麻黄汤、葛根汤、桂枝麻黄各半汤、桂枝二麻黄一汤、桂枝\n二越婢一汤、小青龙汤、小青龙加石膏汤、大青龙汤、麻黄升麻汤、桂枝去芍药\n加麻黄附子细辛汤、桂枝芍药知母汤、古今录验续命汤、千金小续命汤、千金续\n命煮散等。 \n ②调和营卫（调和营卫即是调和表里阴阳津血） \n 表阴证常配伍甘草，如桂枝甘草汤、半夏散及汤等；表阳证常配伍麻黄或葛\n根，如麻黄汤、葛根汤等；卫强营弱或营卫俱弱常配伍芍药，如桂枝汤、桂枝加\n芍药汤、桂枝加桂汤、桂枝加大黄汤、桂枝加厚朴杏子汤、桂枝加葛根汤、瓜蒌\n桂枝汤、乌头桂枝汤、桂枝加龙骨牡蛎汤、桂枝加附子汤、新加汤、桂枝加黄芪\n汤、小建中汤、黄芪建中汤、当归建中汤、黄芪桂枝五物汤、芪芍桂酒汤、柴胡\n桂枝汤、当归四逆汤、桂枝茯苓丸、温经汤、土瓜根散、鳖甲煎丸、薯蓣丸等； \n ③降逆 \n 降气逆常配伍枳实，如桂枝生姜枳实汤、枳实薤白桂枝汤、厚朴七物汤等；\n降水逆常配伍茯苓，如五苓散、苓桂术甘汤、苓桂味甘汤、苓桂枣甘汤、茯苓甘\n草汤、茯苓泽泻汤、防己茯苓汤、桂枝茯苓丸、肾气丸、木防己去石膏加茯苓芒\n硝汤、薯蓣丸、麻黄升麻汤、侯氏黑散等；降火逆常配伍芍药、龙骨、牡蛎，如\n火逆而津液不足常配伍芍药， 如小建中汤、 炙甘草汤、 栝楼桂枝汤、 芪芍桂酒汤、\n桂枝加大黄汤、 温经汤等； 如火逆而津液不固常配伍龙骨、 牡蛎， 如桂甘龙牡汤、\n桂枝加龙骨牡蛎汤、桂枝去芍药加龙骨牡蛎救逆汤、风引汤、柴胡加龙骨牡蛎汤\n等；降血逆常配伍大黄，如桃核承气汤、桂枝加大黄汤、鳖甲煎丸等。 \n ④止痛 \n 止身体痛常配伍附子、乌头，如配伍附子见于桂枝附子汤、甘草附子汤、桂\n\n枝芍药知母汤、桂枝加附子汤、桂枝去芍药加附子汤、桂枝去芍药加麻黄附子细\n辛汤等；配伍乌头见于乌头桂枝汤等；止腹痛常配伍芍药、饴糖，如配伍芍药见\n于桂枝加芍药汤、桂枝加大黄汤、小建中汤、黄芪建中汤、当归建中汤、小青龙\n汤、温经汤等；如配伍饴糖见于小建中汤、黄芪建中汤、当归建中汤等。 \n4.桂枝运用总结 \n 如上所述， 《伤寒》 、 《金匮》书中共有经方二百余首，用桂枝者七十余首，\n这与伤寒经方明辨表里尤重表证之法度密切相关。 加之桂枝汤为伤寒开首第一方，\n桂枝为桂枝汤之第一药， 故桂枝为经药之首， 在经方中有着不可替代的尊贵地位。\n换句话说，桂枝剂的广泛使用正是伤寒经方医家的鲜明标志，这与 “终生麻桂\n不敢入口轻尝” 的温病学派恰好相反。用桂枝方剂虽多，大法不离表束之第一\n二层面（有表证有表邪、有表证无表邪） ，而表束之第三层面（外证）绝不可以\n轻尝，犯禁则逆（参见《伤寒论》29 条） 。 \n（三）杏仁 \n1.本草文献记载 \n《神农本草经》 ： “味甘温。 主咳逆上气， 雷鸣， 喉痹， 下气， 产乳， 金创， 寒心，\n贲豚。 ” \n《名医别录》 ： “味苦， 冷利， 有毒。 主治惊痫， 心下烦热， 风气去来， 时行头痛，\n解肌，消心下急。 ” \n2.经方药理分析 \n 麻黄是太阳之正药，也就说是典型太阳表病正面战场之解表药，而杏仁则是\n一味潜伏的解表药，属于一种隐藏不露暗度陈仓类型的解表药。故而仲圣之用杏\n仁，功效虽有润肠道，止咳喘，散水气，利气机四端，但都是建立在微解表邪的\n基础上的。即润肠道而不碍表邪，止咳喘而不留贼寇，散水气（发散）而不伤津\n血，利气机而不妨解外这四类法则。 \n ①润肠道，故可“冷利（指杏仁功效性冷通利，而不是治疗冷性的下利） ” ，\n“心下烦热” ， “主治惊痫” ， “消心下急” ；②止咳喘，故可“主咳逆上气，雷鸣，\n喉痹” ；③散水气，故可主“雷鸣” ， “金创” ；④利气机，故可主“下气” ， “寒心，\n贲豚”⑤微解表邪，故可主“风气去来，时行头痛，解肌” 。 （许师按：雷鸣释，\n喉中雷鸣为哮喘，腹中雷鸣为肠鸣） 。 \n3.经方具体运用 \n①润肠道而不碍解表者，麻子仁丸、大黄蛰虫丸之类也。 \n②止咳喘而不留贼寇者， 麻黄汤、 麻黄加术汤、 麻杏甘石汤、 大青龙汤、 文蛤汤。 \n桂枝加厚朴杏子汤之类也。 \n③散水气而不伤津血者， 苓甘五味姜辛夏杏汤、 茯苓杏仁甘草汤、 薯蓣丸之类也。 \n④利气机而不妨解外者，桂枝加厚朴杏子汤、茯苓杏仁甘草汤之类也。 \n\n（四）葛根 \n1.本草文献记载 \n 《神农本草经》 ：味甘平。主消渴，身大热，呕吐，诸痹，起阴气，解诸毒， \n葛谷，主下利，十岁已上。一名鸡齐根。生川谷。 \n 《名医别录》 ：无毒。主治伤寒中风头痛，解肌发表出汗，开腠理，疗金疮， \n止痛，胁风痛。生根汁，大寒，治消渴，伤寒壮热。一名鹿藿，一名黄斤。生生\n汶山川谷。五月采根,曝干。 \n2.经方药理分析 \n 后世把它作为一个辛凉解表的药，但是《伤寒论》中的运用规律是这样的：是\n治疗太阳的表位不和为主，是治疗太阳病的药。这个药本来是以辛平为主的，既\n能解表，又能去疏利经筋。就是说当太阳病发生经筋不利的情况，喜欢用葛根，\n葛根辛寒可以起阴气而解表，辛寒解表还能敷布表上之津液，常用于痉病（表+\n津亏） ，再就是此种表位以及上焦既有废水又有津亏的症候。比如葛根汤， “太阳\n病，项背强几几” ，这些症状出现的时候，用葛根来解决，葛根用量比麻黄大。\n我们知道药物剂量最大的时候，它的方向性以它为主的时候，葛根四两是要重用 \n麻黄的，所以说太阳病的层面有一层是经筋不利的情况下是以葛根为主：31、 太\n阳病，项背强几几，无汗恶风（者） ，葛根汤主之。 \n太阳病是表病津血有余，项背强几几是痉病津血不足，无汗恶风是卫气凝滞\n在表防御过度，故既要发散津液，又要补益津液，葛根药症常见，此表之用葛根\n法度也！所以太阳病的药就确定是这几味药，太阳病的基本病机复习到这里，复\n习完师父的这些讲义，是不是又有新的体会，是不是越发感觉师父真乃神人也，\n学问做的如此精深，细腻。由于时间的关系，今天就讲到这里，下周二，我们来\n讲太阳病的复合病机。 \n四、太阳病复合病机——方证 \n1.太阳伤寒（本病） \n表束+表阳（热）+津液绝对有余而充实（无汗） \n典型太阳病——正药麻黄， （辛）苦温泄法——麻黄汤 \n大家可以看到，太阳伤寒，它是一个复合病机，它的基础病机是怎么构成的\n呢？就是前面的表束+表热（阳）+津液绝对有余而充实。是一种无汗的状态。太\n阳伤寒是典型的太阳病，也是太阳的本病，最能代表太阳病的证型是太阳伤寒，\n而不是太阳中风，太阳正药是麻黄，本病是太阳伤寒。因为六病皆有中风，但是\n六病中只有太阳、少阴有伤寒，太阳少阴都有表的层面，别的病这个表不典型。 \n治法：用辛温开泄法， 辛可以开散， 温可以升散， 用这个方法来解太阳伤寒，\n来解这个津液绝对有余而凝滞在表的现象， 所以太阳病会头痛发热， 身痛， 腰痛，\n骨节疼痛（是津血在表上凝滞不通而痛） ，恶风，需要决散津血而通达表位，来\n\n解决问题，包括太阳的喘，胸满，都是表上的津血凝滞，津液不利则为水饮，所\n以麻黄汤证可以治咳嗽，治痰，其中的杏仁就可以解表化饮，麻黄可以治溢饮，\n治上焦和表位的溢饮。很多病并不是缺乏一种治法，而是缺乏一种思路。 \n条文解读： \n 太阳病，脉浮紧，无汗，发热，身疼痛，八九日不解，表证仍在，此当发其\n汗。 服药已， 微除， 其人发烦目瞑。 剧者必衄， 衄乃解， 所以然者， 阳气重故也。\n麻黄汤主之。 46 条 \n有几个重要的概念： \n①鼻衄，是可以用麻黄的，它是津血在表凝滞过度了，就需要用麻黄来逐恶\n血。 \n②阳气的概念——“阳气重故也”为什么用麻黄？阳气就是津液一个名词，\n阳气在表上过度充实凝滞了叫阳气重，所以用麻黄来决散，如果是后世理论，阳\n气重了，要用寒药，阴药，绝不可用麻黄汤来发越。这再次证明伤寒论是一个独\n特的体系，与后世的理论是格格不入的，所以在学习过程中一定要带入伤寒中正\n确的概念，而不要用后世的理论，后世的理法去解伤寒论条文。 \n 脉浮者，病在表，可发汗，宜麻黄汤。51 条 \n“浮” ， “表”都是太阳病的一些概念，一些基础的要素，用麻黄汤（太阳病\n的正方正药）来解决。 \n 脉浮而数者，可发汗，宜麻黄汤。52 条 \n“数”是有热，表上有热，就可以用辛温的麻黄汤解。因为这个热是太阳的\n表热，如果用寒凉药以寒退热的话，那就是阳明证的治法了，不是太阳病治法。\n所以六经病是经纬分明的，各有各的治法，我们的病机体系就是要把六病的治法\n剖析开来。 \n 伤寒脉浮紧，不发汗，因致衄者，麻黄汤主之。55 条 \n“伤寒脉浮紧”是津血凝滞在表了，应该用发汗来解，如果“不发汗” ，就\n以“鼻衄”的方式开发泄。这类病人，我们会看到，虽有鼻衄，但是有表实，表\n热证，就可以用麻黄汤来解表实表热。 \n 阳明病脉浮，无汗而喘者，发汗则愈，宜麻黄汤。235 条 \n “阳明病”证明这个病人热的明显，阳明病是热病的一个代表疾病，类似阳\n明病的热病，但“脉浮” ，那就不是阳明了， “脉浮者，病在表也”这就是一个表\n热病，前面的“阳明病”是类似阳明病的热，热得很重，但是我们反而用麻黄汤\n来解，为什么？这是太阳病的表热病，所以说太阳病的表热是可以非常高烧的，\n我们的麻黄汤证患者，很多是 39 度以上的，甚 40 度。用越婢汤来解高热 40 度\n左右的。 \n 脉但浮，无余证者，与麻黄汤；若不尿，腹满加哕者，不治。232 条： \n “脉但浮”是表病，没有里症表现就可以用麻黄汤解决，但是如果病人是\n\n“不尿，腹满加哕”这种情况津液本来就少了， “不尿”是没有津液可以尿了，\n津液不能去化生小便了，再有“腹满”不但津液少了，里面还有邪气停留了，津\n液不足以与邪气抗争了，没有津液抗争邪气了，人体的正能量不能战胜邪气，就\n会比较难治。 \n2.太阳中风 \n表束+表阳（热）+津液相对有余而兼虚（汗出） \n非典型太阳病——正药桂枝， （辛）甘温补法——桂枝汤（类厥阴） \n六病皆有中风，太阳中风表束比较明显，有哪几个病机呢？表束+表阳（以\n热为主）+津液相对有余而兼虚（汗出津液外泄） 。麻黄汤是津液有余而绝对充实\n在表，桂枝汤证是相对有余，它在表上过胜，在里是不足的，所以桂枝汤即可以\n治太阳病，又可以补津液，这个方比较独特，桂枝汤是众方之首，很多经方是通\n过桂枝汤衍化出来的。桂枝汤的表现比麻黄汤复杂。 \n 太阳中风，阳浮而阴弱。阳浮者，热自发；阴弱者，汗自出。啬啬恶寒，淅\n淅恶风，翕翕发热，鼻鸣干呕者，桂枝汤主之。12 条 \n这些症候群即有表，又有热，然后又有“阴弱者” （这个“阴弱者”其实里\n津液弱， ）前面讲过津液是阳气，麻黄汤的问题，这是桂枝汤津液是阴，津液本\n身就包含阴阳，所以《伤寒论》中津液的概念，既有阴的概念，又有阳的概念，\n它本来就包含阴液和阳气，这才是完整的一个津液概念， “恶寒，恶风，发热”\n都是太阳病表的现象， “鼻鸣，干呕者”这是人体上焦表位出了问题，也是表束\n的层面。所以看到“干呕”不要马上去降逆，你看下有无表证，如有表证是要用\n表药去解的。麻黄汤合桂枝汤都会出现呕逆，39、29。 \n 太阳病，外证未解，脉浮弱者，当以汗解，宜桂枝汤。42 \n“脉浮弱”是津液不足，与麻黄汤“脉浮紧是对应的。 “脉浮弱”本来就有\n虚的现象了，浮为在外，弱为津液不足， “当以汗解” ，宜桂枝汤，桂枝汤层面，\n既可治太阳病中风津液充滞在表，又可以治太阴病中风。六病中风，除了阳明病\n中风，都可以用桂枝汤来解，所以有时是“脉弱”的，并不是一定是脉浮或有力\n的。 \n 太阳病，外证未解者，不可下也，下之为逆。欲解外者，宜桂枝汤主之。44 \n这也是用桂枝汤来解表。 \n 太阳病，先发汗不解，而复下之，脉浮者不愈。浮为在外，而反下之，故令\n不愈。今脉浮，故知在外，当须解外则愈，宜桂枝汤主之。45 \n有表证，我们首先应用汗解表，下法是引邪入里， “会不愈”不但不愈还会\n病除不解。 \n 病常自汗出者， 此为荣气和。 荣气和者， 外不谐， 以卫气不共荣气和谐故尔。\n以荣行脉中，卫行脉外，复发其汗，荣卫和则愈，宜桂枝汤。53 \n荣气——津液是包含阴阳的，阳包含卫气，阴包含荣气（营） （营血） ，营血\n\n是能濡养和温煦的，能濡润人体正常组织的，当它不能荣的时候，人体会出现一\n个（标志？）性的现象，所以桂枝汤既可以里证，又可以治表证，既可以解表，\n又可以救津液，是经方最平衡的一个天平，你加一点表药就走表，加一点里药就\n走里。如：续命类方基本都包含有桂枝汤法则+麻黄、生姜、防风、独活，形成\n续命法则，能更好的去解表，解比单纯的太阳病中风伤寒更深的病，如果里位不\n和，桂枝汤+芍药，再里的+饴糖形成建中法则，来解里病。所以桂枝汤是一个平\n衡的天平。 \n 病人藏无他病，时发热，自汗出，而不愈者，此卫气不和也。先其时发汗则\n愈，宜桂枝汤主之。54 \n后面的条文说的是桂枝汤当“脏无它病（里病不明显） ”的时候，以表为主\n时，津液外泄“卫气不和”为主时，用桂枝来解。 \n 伤寒不大便六七日，头痛有热者，与承气汤。其小便清者，知不在里，仍在\n表也，当须发汗；若头痛者必衄，宜桂枝汤。56 \n承气汤与桂枝汤对比，如果病人“不大便六七日，头痛，有热者” ，治里”\n与承气汤”,不仅是大便失调要治里， 小便失调也要治里。 “小便清者， 知不在里，\n仍在表也” 。那么“小便浊”小便出了问题，是在里，起码也是不分在里了，表\n不解要表里同治，表解后要治其里。 \n 伤寒发汗，解半日许，复烦，脉浮数者，可更发汗，宜桂枝汤主之。57 \n“伤寒发汗”是津液散失了一部分，亏虚了一部分了，要解外的时候就得考\n虑到不要用太过开泄的方子， 要既能补益津液， 又能去解表的方法， 就用桂枝汤。 \n桂枝汤可以见到脉浮数，脉浮弱，所以一定要用脉证去对应方证或药证，脉\n象是可以变的，不变的只有病机。 \n 伤寒医下之，续得下利，清谷不止，身疼痛者，急当救里；后身疼痛，清便\n自调者，急当救表。救里宜四逆汤；救表宜桂枝汤。91 \n四逆汤救里，桂枝汤解表的区别，前面讲了里有实，里有热，用承气汤与桂\n枝汤对应，后面讲里有虚，里有寒用四逆汤，与桂枝汤对应，所以说人身不过表\n里，气血不过阴阳。 \n3.太阳风寒两感 \n表束+表阳+津液半虚半实 \n非典型太阳病 ——桂枝麻黄各半汤、桂枝二麻黄一汤（类厥阴） \n 太阳病，得之八九日，如疟状，发热恶寒，热多寒少，其人不呕，清便欲自\n可，一日二三度发，脉微缓者，为欲愈也。脉微而恶寒者，此阴阳俱虚，不可更\n发汗、 更下、 更吐也。 面色反有热色者， 未欲解也， 以其不能得小汗出， 身必痒，\n宜桂枝麻黄各半汤。 \n 服桂枝汤，大汗出，脉洪大者，与桂枝汤如前法；若形似疟，一日再发者，\n汗出必解，宜桂枝二麻黄一汤。25 \n\n太阳风寒两感是比较特殊的证型。太阳病出现了很多方子，桂枝汤与麻黄汤\n合方的方子，如：桂枝二麻黄一汤，桂枝麻黄各半汤等，这些方子很有特点， “形\n似疟” ， “如疟状” 。 \n这个“疟”在《伤害论》有两种情况可以出现，①是少阳病，②是厥阴病。\n太阳病出了个“疟”就显得很突兀，太阳病的法度为什么有这种情况出现？其实\n这种病就是我们说的类厥阴病，这种病是有寒，有热，有虚，有实，有表，有里，\n所以会出现“此阴阳具虚” ，阳是表，阴是里，表里都出了问题，怎么去解决？\n就用桂枝和麻黄合方来解决，前面讲了桂枝汤是治里的，麻黄汤是治表为主，更\n加证明麻黄是太阳病之正药，麻黄汤是太阳病之正方， “阴阳具虚”用麻黄汤来\n解阳，桂枝汤解阴。包括后面 25 条，服桂枝汤后出现津液更虚的现象，桂枝汤\n整体来说是攻表的， 不能用桂枝了， 用桂二麻一汤， 这也是类厥阴的方子， 表里，\n虚实，寒热都有，为什么出“疟”？“疟”就是有寒有热。 \n 太阳风寒两感，既是太阳病的一个证型，有风有寒，那么也会出现在类厥\n阴的层面，所以临床中以表病，以热病，以偏实的情况为主的时候，我们用太阳\n病的法则去辨证，用桂二麻一去治疗。很多偏里的病,偏虚的病，还有寒象的病，\n也可以用这个方。所以我们讲方证是多维的，不要把方子看死了，一个方子可以\n治疗很多层面的病， 《伤寒论》的方子不但够用，而且非常够用，临床中根本不\n需要用后世的方子， 我临床中用伤寒论的方子有6-7年了， 后世的方子是不用的，\n临床效果还可以，很多恶性肿瘤的患者效果不错。这就证明经方的法度，伤寒的\n理法是非常可贵的，只要如理如法去用，不会出现无药可用，方子是够用的。 \n三焦 \n从太阳病到厥阴病，都会有三焦不利的现象。就比如太阳病，主要是表位和\n上焦失和，会出现头痛、呕逆、咳喘。少阳病三焦不利，它有半表里半虚实半寒\n热，表里都有虚实寒热都有，就会有里病的情况出现，就会出现中焦的失调，所\n以少阳病会说“上焦得通，津液得下，胃气得和” ，三焦都有了。少阳病的病机\n有上交郁火，中焦胃虚，下焦饮逆。六病都有三焦，并不是说哪一个病对应哪一\n个焦。 \n桂二麻一汤——桂枝和麻黄是一个非常巧妙的配伍。 当桂枝和麻黄是一样的\n时候，可治寒热如疟，当桂枝2 份，麻黄 1 份的时候，或者桂枝 2 份，麻黄量比\n例更小的时候，它是有调和营卫的作用的，如：桂枝二麻黄一汤（是阴阳俱虚，\n表里都出现问题了， 表里都虚了） ， 桂枝二越婢一汤 （此无阳也， 虚得更厉害了） ，\n2 份桂枝汤，1 份越婢汤，量是非常小的，麻黄才用了几克， ，来解卫阳，卫阳就\n是在表上不能温煦了，有虚的层面，当桂枝大于麻黄的时候，它是可以调和营卫\n的。 调和营卫就是能养营卫而解表邪， 就是补的作用， 补而发之， 桂枝大于麻黄，\n是有补益作用的， 桂枝是甘温的， 桂枝的甘的作用大于苦的作用， 就是补的作用。 \n\n第二节 少阳病病机复习 \n ——董超 2016.10.25 —11.1 \n 今天由我带领大家一起复习一下少阳病的基础病机。 典型的少阳病因为地域\n的不同、病种分布的差异临床应用也许并不多见，但通过分析它的病机特点能帮\n助我们更好地理解卫气营血、胃气以及三焦，更好地把握疾病的走势。 \n我们先看一下六病病机是如何形成的。人体内生或外感邪气后形成水火气血\n四证， 进而影响卫气营血的消涨盈亏及输布转化、 胃气的虚实寒热以及三焦的奉\n承制化，从而形成了六病病势的体现。 \n一、三焦奉承制化的两方面病机 \n今天复习的少阳病主要讲的就是其中“三焦的奉承制化”方面的病机。三焦\n呢是我们的胃气、津液、津血敷布的道路。它要是出了问题会形成两种疾病。第\n一种疾病是津血、胃气、津液本身出了问题了。第二种疾病是津血、胃气、津液\n没有问题，而三焦这个道路出了问题了。打个比方，就好比是一条河流最后汇入\n大海，我们在大海口看到河水减少了，究其原因，要么是源头短缺、河水流散、\n聚集了，要么是河道淤积堵塞了。其实三焦不通利了，卫气营血、胃气也会受到\n影响，只是有主次之分罢了。这个时候我们要先通利三焦，打通这个道路，其他\n方面才能更好地恢复。 \n（一）津液本体问题 \n津血、津液、胃气本身会出现哪些问题呢？就拿津液来说，它在哪个位置停\n聚过多了，就会形成水饮。在上焦会产生鼻塞、鼻涕、眼泪、口水增多、咳嗽气\n喘。在中焦会产生脘腹胀满、痞闷、嗳气、反酸。在下焦会产生大小便的失常、\n女性白带增多、 男性遗精、 阴囊潮湿等症。 这个时候三焦这个道路是没有问题的，\n只需要去对治水饮就可以了。 \n（二）津液道路问题 \n 那么如果这个道路出了问题要怎么解决呢？我们原文中也提到了“上焦得\n通，津液得下，胃气因和，身濈然汗出而解”。其实也很简单，不通把它打通就\n行了，怎么打通？通上焦、固中焦、制下焦。打通了有什么表现？“身濈然汗出\n而解”，三焦通利了，津液、津血就能正常输布了，不但出汗正常了，大小便也\n会恢复过来。 “解”这个字的意思一方面是指三焦的通利。还有一方面是指“里\n邪出表” ，这也是我们治疗所有疾病的主要基调。 \n二、三焦生理 \n 那么三焦的正常工作时的状态是怎样的呢？ \n\n 上焦是清阳之地，清明之府。这里一般不能存在浊水和浊气，它要的是清\n气，清阳。要是被浊水、浊气瘀滞住了就会影响其功能。我们看金匮的胸痹篇就\n是个很好的例子。上焦的功能呢主要就是输布营卫，以清阳温煦下焦。 \n 那么浊水、浊气去哪里呢？要去下焦。下焦才是分清泌浊的地方，人体所\n有的糟粕通过下焦，特别是以大小便的方式排出。在分清泌浊的过程中还能升华\n一部分清气反馈中焦。 \n 而中焦的作用呢主要有两点，一个就是运化水谷精微，将精华与糟粕分别输\n送到上焦与下焦， 从而完成整个消化吸收的过程。 这个操作主要是靠胃气这位 “员\n工”完成的，而加工出来的主要“产品”就是津液、津血。第二个功能就是沟通\n上下二焦，起到一个调和作用，没有它的调和上焦和下焦就会闹“矛盾” ，谁都\n不搭理谁， 身体就会生病了。 所以说中焦这个位置是非常重要的， 如果中焦失和，\n三焦都会不通，都会失和，都会发生病变。 \n 三焦共同协作来完成沟通内外表里，运化输布津液、津血、排出糟粕的工\n作，任何一环出现问题都会或多或少影响到其他位置的功能。所以三焦要时时保\n持通畅才好。 \n三、三焦病理 \n 生理复习完了开始复习病理， 其实三焦的病理状态就包含在我们少阳病的基\n础病机里了。 \n（一） 基础病机—药证 \n1. 上焦郁火—苦—柴胡、黄芩为主。 \n 我们前面提到过， 上焦是清阳之地， 它是要通利的， 要配合中焦敷布津液，\n它要是瘀滞住了就会产生邪火邪热。会出现哪些症状呢？口苦、口干、咽干、目\n赤、心烦，甚则虚火上炎导致头晕目眩、耳鸣等。 \n 对于这个邪火邪热要怎样对治呢？我们知道太阳表位的热要通过辛温发散\n的方法来对治，而里面的热呢我们一般通过阳明清热四法来治疗。因为后面呢还\n有师兄弟要讲阳明病，所以我这里就不再作解释，对于少阳病这个上焦郁热呢我\n们就以苦味药来对治， 苦以泻之， 用苦来降泻郁火， 所用药物呢就是柴胡、 黄芩。\n这两味药均有苦泻、苦降、苦清的作用，均能对治这个“火” ，对于“郁”呢我\n们还要想办法让其通顺，而柴胡正好有推陈出新的作用，所以既能降火，又能疏\n通三焦，火得降，三焦得通利，郁热就解了。 \n2. 中焦胃虚—甘—人参、甘草、大枣为主。 \n 这个胃虚就是胃气虚。我们前面讲过“如果中焦失和，三焦都会不通，都会\n失和，都会发生病变”可见中焦这个胃气的重要性。所以师傅经常说“经方是特\n别重视胃气的” 。说道胃气虚还要补充一点，胃气不光光是有胃气虚，还有胃气\n实、胃气热、胃气寒。 \n\n 很多人一提到胃气，马上就想到胃气虚，或者一看到小便频数，就直接诊断\n胃气虚或者胃气寒，就直接联想到肾着汤、甘草干姜汤这样温补的方子。其实是\n有失片面的。比如说阳明病的麻子仁丸证，它也会有小便频数，但它却是胃气实\n导致的。所以师父说：“并不是说某一个症状马上对应上一个病机，而是把这个\n症状整盒到一个整体的辩证体系下，再去看它的偏虚、偏实、偏寒、偏热。 ” \n 我在跟随师傅学习期间是深有感受的。有的时候来一位患者，我也会跟着采\n集症状，然后写上病机再处方。假如恰巧跟师傅写的病机一样（当然了这个几率\n堪比买彩票中五百万啊）但发现处方却相差很远，有时候几乎只能照顾到其中几\n点，就是师傅常常说的“会有效，但不确切”其实呢病根就是没有一个整合基础\n病机（整体辩证）的过程。当然了还有对于方子把握程度不够的原因。 \n 那么这里少阳病病机中的胃虚会出现那些症状呢？食欲不振（默默不欲饮\n食） 、甚至不欲食、脘腹胀满等。本来这里还会夹杂一些“中不治下”的症状，\n我暂且先把它整理到下焦饮逆病机里去了，这里就不再赘述。 \n 中焦胃虚， 虚则补之， 补的药是以甘味的药为主。 在这里我们用人参、 甘草、\n大枣来对治。 \n3. 下焦饮逆——辛——半夏、生姜为主。 \n前面说了，下焦是分清泌浊的地方，往下走是顺，往上走是逆。所以它要是\n冲逆了，人体就会相应地引起一系列症状。根据饮逆的部位不同，出现的症状可\n归结为： \n 下焦本位——腹痛腹胀、 小便不利 （这个更偏向于水饮停聚在下焦的症状） \n 冲逆到上焦——头晕目眩、咳喘、耳鸣。 \n 冲逆到中焦——心慌心悸、胸闷气短、呃逆、胃胀胃痛。 \n 冲逆到心下——脘腹胀满（胸胁苦满、胁下痞硬）等 \n产生饮逆的主要原因呢， 一个是上焦的清阳不去下焦温煦了， 下焦会寒一些，\n另一个是中焦胃虚不能制约下焦了。还有一个原因就是表束，气不旁流，而引起\n的冲逆。对于这个饮逆我们就用辛温的半夏、生姜来对治。两味药搭配是经方中\n小半夏汤的法则。既能温化寒饮，又能顾护胃气，还能辛开表束。治疗饮逆本来\n还可以用沉降的药物，那么这里为什么不用呢？主要是因为少阳病是半表里的，\n我们既要照顾到这个饮逆， 还要照顾到表束的问题。 如果用了沉降的药物来治疗，\n反而可能会引邪入里，不利于后续治疗了。对于这个饮逆，师父曾经说过一句话\n“ 《伤寒论》的体系特别重视下焦的浊水浊气往上冲的问题。很多疑难病，把逆\n的问题解决了，病就好了。 ”所以我们临床中要引起足够的重视。话说师父好像\n就是靠金匮四饮起家的，大家也可以翻翻讲义再重温一下，结合着看一下津液是\n怎样输布离合的。 \n经方中除了饮逆还有气逆、火逆、血虚而血气上逆的概念。这是大的病机要\n结合着去总结，整个伤寒论讲得就是津液的输布离合，要想看完整的估计得等师\n\n父出书了。这些病机会出现哪些症状呢？气逆：嗳气、头眩、胃胀、胸满胸胀，\n心慌心悸。火逆：口干舌燥、目赤、渴饮、燥烦。血虚而血气上逆：心悸、头晕、\n失眠、流鼻血，也会引起口干舌燥、渴饮、心烦等症。引起逆的症状大同小异，\n但病邪的性质不一样，治法也会有相应的差别。例如血虚而血气上逆比起火逆来\n说，它也会有口干舌燥、渴饮的症状，但它不是真正的实火实热，这个“火”是\n血虚而血气上逆引起来的，它是最浅的一层，不是本质，只是一种现象，你把血\n补益起来了， 这个火自然就不上升了。 我们用温经汤和建中汤去治疗一些 “上火”\n的症状，就是利用的这个理法。所以我们在诊断疾病的过程中首先要辨清水火气\n血的性质、阴阳的虚实盛衰，把握病机的脉络，不要仅仅停留在表像上。只有这\n样才能带着病邪走，才能指挥从容，淡定应战，否则就是被动防御，捉襟见肘，\n得失往复，会很难受的。 \n4. 邪气交争于半表里——平——柴胡为主 \n 在表和邪气在里我们好理解， 那这个半表里到底是怎么回事呢？我们看一段\n原文“血弱气尽，腠理开，邪气因入，与正气相搏，结于胁下。正邪纷争，往来\n寒热，休作有时” 。 \n “血弱气尽”说明这个人得病的时候身体是偏弱的，弱到那种程度呢“腠理\n开” ， 皮肤的营卫功能衰退了， 不能很好地阻挡外邪了。“邪气因入， 与正气相搏，\n结于胁下”这个时候如果感受外邪就不是在表上了， 它变到 “胁下” 这个位置了。 \n“胁” 《说文解字》中解释是“两膀也，膀言其前，胠言旁迫于肱者” 。这里指的\n是两侧腋中线的位置。这里正好是阴阳交合的位置，后面是阳前面是阴。胁下指\n的是侧胸部的里面。正好是半表里。 \n “正邪纷争， 往来寒热， 休作有时”指得是这个正邪交争的结果：“正气胜，\n邪气会浅一层， 到达太阳表位则恶寒， 邪气胜会深一层， 到达阳明病位则发热。 ”\n出现的症状主要是寒热往来。正邪交争的时候，除了上述三焦的奉承制化方面的\n问题，还有一个重要的病机，就是本来这个正邪就是在表里之间交争游荡的。这\n时除了通利三焦以外，还要想办法把邪气更好地发散出去。这时候就用到了柴胡\n这味药。 \n 这里提一下柴胡的心法，师言：“柴胡，是一个推陈致新的药，轻量用会以\n清火为主，重量用、大量用的话，会是升散的药”例如小柴胡汤、大柴胡汤都是\n大量的用，柴胡用了八两，这里它主要的作用就是开泻、升散，而四逆散、薯蓣\n丸都是轻用的，因为用它清郁火就行了，不需要再推陈致新。 \n （二）复合病机——方证 \n 上周二咱们复习了少阳病基础病机：上焦郁火、中焦胃虚、下焦饮逆、邪气\n交争于半表里。这些都属于少阳病组成的最基本要素。对应的药证也是组成少阳\n病方证的最基本要素。这些基础病机组合之后就形成了完整的少阳病，病位——\n\n半表里，病性——半寒热，病态——半虚实。 \n1.少阳中风 \n 上焦郁火+中焦胃虚 +下焦饮逆+邪气交争于半表里以表为主——柴胡桂枝\n汤、柴胡桂枝干姜汤为主。 \n 少阳中风就是人体半表里、半寒热、半虚实偏于阳的这个症候群，以四肢百\n骸，或上焦表位失和为主。以四肢百骸为主时会出现：身体酸重、肢体和关节疼\n痛、恶风、汗出等症。以上焦表位失和为主时会出现：头晕目眩、目赤等症。主\n要对应的方子是柴胡桂枝汤、柴胡桂枝干姜汤。 \n伤寒，六七日，发热微恶寒，肢节烦疼，微呕，心下支结，外证未去者，柴胡桂\n枝汤主之。146 \n我们伤寒论的条文中好多处用“呕”来代指少阳病。例如： \n“太阳病， 得之八九日， 如疟状， 发热恶寒， 热多寒少， 其人不呕， 清便欲自可，\n一日二三度发，脉微缓者，为欲愈也。23” \n“下之后， 复发汗， 昼日烦躁不得眠， 夜而安静， 不呕， 不渴， 无表证， 脉沉微，\n身无大热者，干姜附子汤主之。61” \n 但是这个“呕”必须有个前提，那就是“胃不和” 。 “此属胃，胃和则愈” 。\n只有符合这一特点才能判断为少阳病。 而导致 “胃不和” 的原因就是 “上焦郁火、\n中焦胃虚、下焦饮逆、邪气交争于半表里” 。146 条就是在少阳病的基础之上，\n出现了“肢节烦疼” “外证未去”的症状，所以就选择了比小柴胡汤更偏表一些\n的柴胡桂枝汤。柴胡桂枝汤是以人体的寒热失调为主。其基础方干是小柴胡汤和\n桂枝汤，里面有一个完整的桂枝汤，能解表调和营卫，是对治表里之间关系的。 \n伤寒，五六日，已发汗，而复下之，胸胁满微结，小便不利，渴而不呕，但头汗\n出，往来寒热，心烦者，此为未解也。柴胡桂枝干姜汤主之。147 \n 这条是在少阳病的基础上出现了“胸胁满微结，小便不利，渴而不呕”的症\n状。胃虚寒和水饮的症状明显了。为什么不呕了呢？是因为水饮停聚，想呕都呕\n不出来了。这时候就用柴胡桂枝干姜汤来对治。柴胡桂枝干姜汤是以水火失调为\n主，里面有瓜蒌牡蛎散，能利小便而制化水饮，还有甘草干姜汤，能补胃虚，因\n而它的饮要比柴胡桂枝汤重一些，水火两端比较明显。 \n2.少阳本病（典型少阳病柴胡汤证） \n上焦郁火+中焦胃虚+下焦饮逆+邪气交争于半表里以里为主——小柴胡汤为主。 \n 典型的少阳病必须有少阳病的四个特点:①上焦郁火——柴胡、黄芩去清。 \n②中焦胃虚——人参、甘草、大枣，还有一个生姜甘草汤的基础方干在里面。去\n补益。③下焦饮逆——半夏、生姜，用小半夏汤的方根去降逆。④邪气交争于半\n表里——柴胡，大剂量应用来推陈致新。 \n 这才是真正的少阳病。主要用方就是小柴胡汤。上面复习的少阳中风要比本\n\n病偏表一些，是以上焦和表位失和为主的，而少阳本病是以三焦不利、邪气交争\n为主的。我们看一下条文： \n 96、伤寒五六日，中风，往来寒热，胸胁苦满，嘿嘿不欲饮食，心烦喜呕，或\n胸中烦而不呕，或渴，或腹中痛，或胁下痞硬，或心下悸、小便不利，或不渴、\n身有微热，或咳者，小柴胡汤主之。 \n 这个就是很典型的少阳本病，邪气交争就会往来寒热；上焦的郁火下不去就\n会渴、喜呕；中焦的胃虚，就会嘿嘿不欲饮食；下焦的水饮上逆就会胸胁苦满或\n胁下痞硬、心烦、胸中烦。 \n 这些或然症也比较有意思。临床中患者很少会出现典型的条文描述的症状，\n会有许多变化，这也是套方行不通的地方。我们要充分熟悉、理解、掌握这些条\n文症所蕴含的病机，把握住这些病机的虚实、缓急、轻重的变化。只有这样才能\n把方子用活，才能更好的临床，否则就是纸上谈兵了。这也算是仲圣给予我们的\n告诫。条文描述的症状是让我们更好地理解方子，总结它的病机，再用病机去指\n导临床。病机就是疾病的“命门” ，抓住了它，你才不会被千奇百怪的症状所蒙\n蔽。 \n97、血弱气尽，腠理开，邪气因入，与正气相搏，结于胁下。正邪纷争，往来寒\n热，休作有时，嘿嘿不欲饮食。脏腑相连，其痛必下，邪高痛下，故使呕也。小\n柴胡汤主之。服柴胡汤已，渴者，属阳明，以法治之。 \n 我们上周二分析过这条的前半段。这条其实也是少阳的本病，表述的是一个\n邪正交争的过程，符合少阳病的特点。后面有一个病传的概念。服柴胡汤后，病\n人出现了口渴，这个时候是比柴胡汤偏热了，阳明层面多了一些，有可能要用到\n偏厥阴的方子了，比如生姜泻心汤、柴胡桂枝干姜汤。 “服柴胡汤已”说明服了\n小柴胡汤，这个病已经了结了一部分，开始出现转变了，这个时候我们也要跟着\n病机走，即使见效也要马上转方，不要效不更方。在不断转换阵地的过程中，逐\n渐消灭敌人。为了加深对于病传以及选方用药法度的了解，我们再看一条。 \n“伤寒，阳脉涩，阴脉弦，法当腹中急痛者，先于小建中汤；不差者，与小柴胡\n汤主之。100” \n “伤寒”是指这位患者有表束，表不解。 “阳脉涩”证明表上有邪气； “阴脉\n弦”证明里面有水饮，弦脉是四饮中淡饮的一种表现。 “法当腹中急痛者”按照\n理法来说会出现肚子疼的症状。 我们知道，单纯的表束+水饮不会出现“腹中急\n痛”的症状，说明这位患者还有一个隐含的病机“胃虚” 。胃虚则津液不化而成\n饮，胃虚则津血不养而致腹痛。表束、水饮、胃虚同时出现，我们就要考虑在解\n表的基础上是先制化水饮呢还是先治疗胃虚津亏。先制化水饮易令胃中水竭，伤\n敌一千，自损八百，短期虽然会见效，但对于后续的治疗会很麻烦，失去了治愈\n的一个机会。所以仲圣先用小建中汤来建立中焦之气，保胃气、存津液，把中焦\n建立起来了再转为小柴胡汤来制化水饮。小建中汤用芍药、饴糖来养津液，小柴\n\n胡汤里面也有甘草、大枣、人参来养津液，虽然转换了方子，但二者都有养津液\n的法度在里面，只是用药层次、法度不一样而已。围绕着养津液的治法，一个更\n偏向于滋补、制化水饮，一个在甘补的基础上又加入小半夏汤、生姜甘草汤这样\n降逆温化水饮的方根，循序渐进，一步一步解除病邪。 这个条文正好非常巧妙\n的说明仲圣治病是非常有层次的，是看病传的，而不是见山是山、见痰治痰。他\n是讲法度的。 \n 所以《伤寒论》的学习是个漫长的过程，你在浅的层面是一个症状，叫“随\n症治之” ；然后你再深入一个层面，认识到了法度，叫“以法治之” ，随症治之和\n以法治之在《伤寒论》中是一直强调的；然后师父又提出一个“随病传而治之” ，\n这是《伤寒论》中一个最高的法度。 \n 第一层随证治之。病人发热，以寒退热；病人恶寒，以热胜寒；病人腹泻，\n给他吃温药；病人便秘，给他吃泻药。一直跟在症状后面跑，这是随证治之。打\n得是一场局部战争，争得是一城得失，没有大局观可言。 \n 第二层以法治之。以法治之要比随证治之层面高一些。它讲究法度，讲究战\n略，懂得排兵布阵，懂得奇谋鬼算。相比于随证治之的“勇” ，它又兼具了“谋” 。\n在临床中就是“见痰休治痰，见血休治血，无汗莫发汗”了。这种高度，是建立\n在本身对疾病有一定认识了，能通过症状对本质有一个判断。 \n 第三层依病传治之。这是仲圣的最高心法。 病人来的时候你把他的体质摸\n得一清二楚，在阴阳寒热表里上，毫厘不差地给他辨得精细到位了。再在这个体\n质的基础上，以现在的所急所苦作为病机的一个着力点来处方用药，这样既能把\n所急所苦解决掉，还能清楚认识阴阳表里虚实还有什么问题，下面会用到哪个方\n子。师父临床中之所以能在一诊的时候开出二诊、三诊的处方，就是按照“依病\n传治之”的法度来治疗的。只有这样才能“里邪出表，阴病转阳” ，才能彻底治\n愈疾病，而不是单纯的缓解病情。 \n3 少阳外证 \n胃虚（此属胃，胃和则愈）——小柴胡汤为主。 \n 典型的外证见于太阴、阳明，是因为太阴和阳明都是典型的里病，一个是\n虚寒之里，一个是实热之里。而且都会出现汗液和尿液的失常，汗液和尿液的外\n泄、脱失了。而少阳是半虚实、半表里，所以会有一部分外证出现，因为偏表一\n些、偏阳一些，所以主要是以汗液失常为主。主要用方也是小柴胡汤。 \n265、伤寒，脉弦细，头痛发热者，属少阳。少阳不可发汗，发汗则谵语，此属\n胃。胃和则愈，胃不和，烦而悸。 \n “少阳不可发汗，发汗则谵语”津液充足的时候发一下汗不会出现“谵语” ，这\n说明津液本身就丢失的厉害了。 “不可发汗”说明患者本身就是出汗的，汗出过\n多，导致了津液亏虚。如果是通过下利丢失的，他就会说“不可下”了。 \n 这种情况下，要怎么解决呢？“此属胃。胃和则愈，胃不和，烦而悸” 要先“和\n\n胃” 。胃寒了温一下——生姜、甘草，胃热了清一下——柴胡、黄芩，胃虚了补\n一下——人参、大枣、甘草，胃实了泻一下——柴胡。把胃调平和了，这个病就\n好了，身体也可以发展到良性循环，绊脚石没有了会非常顺畅，按你的安排走下\n去， 一步步里邪出表， 阴病转阳。 这也更加说明了， 病传， 还有按着层次去用药，\n是多么的重要。 \n 少阳病的病机还是比较精细的，在《伤寒论》中它是由阳病过度到阴病的重\n要一站， 是承上启下的一篇。 病机的表里寒热虚实转变， 直接决定了疾病的走向。\n是“复习题”也是“思考题” 。好了少阳病的基础病机和复合病机到这里我们就\n复习完了。病案我就不发了，拿不出手。上周四有好几个师父指导的病案都用的\n小柴胡汤，大家可以对比的再分析下。谢谢！ \n 这两次跟着大家一起复习，对我的启发也是很明显，许多临床中的疑惑也能\n渐渐清晰起来。所以先在这里感谢一下师父给我这次机会。本来是打算一节课把\n基础病机跟复合病机全讲了的，结果丁杰跟我说，最好是分着讲。我当时一看讲\n案，苦笑着说不够啊，总结的太少了。实在不行硬着头皮试试吧。现在看来人的\n潜力还是挺大的。总算是完成了任务。也因此多学了很多东西。看来不鞭策还是\n不行啊！大家不要学我。 \n四、许师补充 \n少阳治法 \n 少阳不可汗不可吐不可下， 是指不能单纯的用汗、 吐、 下法， 以避免伤胃气，\n助郁热，发水逆。少阳病最大的病机就是 265 条（伤寒，脉弦细，头痛发热者，\n属少阳。少阳不可发汗，发汗则谵语。此属胃，胃和则愈。胃不和，烦而悸。）\n所言的此属胃，胃和则愈。胃和则下焦浊水浊气不能上逆；胃和则津液充盈表邪\n不能入里；胃和津液充盈则上焦郁火盛不起来。 \n小柴胡汤证的胃不和，用甘药补中+苦寒药泻热+辛温药化饮，邪气以表为主\n则得辛温法则汗出而解，邪气以里热为主则得苦寒药泄下而解，上逆到上焦或困\n束于表位的的寒湿水饮郁火也可以得吐而解。并且吐法之中，汗法存焉。所以吐\n也可以解表。所以少阳病一面说不可吐下，或者经汗吐下温针不愈，一面又说用\n柴胡汤后上焦得通津液得下胃气因和身濈然汗出而解。 \n柴胡阴旦法 \n柴胡汤是阴旦法则，从阴面里面而解表透邪的方子。旦者升也，阳旦者，从\n阳从表而升也；阴旦者，从阴从里而升也。处处透漏经方首辨表里尤重表证的特\n点。有很多小朋友发热的柴胡汤证，用柴胡汤后就呕吐而退烧的。 \n只要是三阳的发热， 很多都是呕吐后才退烧的。 三阳吐一吐， 病邪解得更快。\n三阴尽量不要使之吐。六病皆可呕吐，水火气血四证都可以导致。太阳病的麻黄\n汤桂枝汤都可以有呕，阳明病竹叶石膏汤气逆欲吐，少阳病小柴胡汤心烦喜呕，\n\n少阴病欲吐不吐，太阴病腹满而吐，厥阴病食则吐（蛔） 。 \n鉴别栀子豉法 \n问曰： 老师， 栀子生姜豉汤的胃热实导致的胃气不足而不能制化下焦浊水浊气与\n小柴胡汤证的胃虚而不能制化下焦浊水浊气怎么区分？（立涛） \n 师曰：这就是虚实之辨。栀子豉是阳明中的厥阴法，虽然会有阴证虚证，但\n是以热实为第一层病机，那么睑多红鲜，舌多黄厚腻，脉多滑而有力；柴胡汤是\n少阳中的厥阴法，本来就存在者（半）里（半）虚（半）寒的第一层病机，则睑\n多色淡，舌多薄白，脉多细而少力。 \n津液论的基础理论就是津液分阴阳论，而经方分析病机每时每刻用的就是。\n全貌就是伤寒金匮全书+经典经方补遗。 仲圣的体系就是津液分阴阳论+阴阳二旦\n方阵。明年给大家详解伤寒金匮，后年详解方阵。 \n新增的方子论坛都有，大家养成在论坛学习的习惯。每天不上论坛，何异于\n入宝山而空回。薛蓉、伟东、李鹏、余霞、周帅、秀海为大家整理了很多录音资\n料，不学可对不起大家的辛勤付出。只要紧跟团队别掉队，不想成名医都难。 \n \n\n第三节 阳明病病机体系复习 \n 丁杰 2016.12.27-2017.01.03 \n先来个一锤定音，师曰：“若能明了阳明病机，则后世温病学派则无出现之\n必要。 ” \n但是说实话，最近我接了很多阳明为主的病人，就是治不好。所以，阳明病是看\n起来简单， 要全解疾病还真不容易。 不过基础病机你还是简单。 难得是符合病机。\n今晚先讲一下基础病机。基本病机提取出来就是热，燥，结。然后分表里。 \n 问曰：病有太阳阳明，有正阳阳明，有少阳阳明，何谓也？答曰：太阳阳明\n者，脾约是也；正阳阳明者，胃家实是也；少阳阳明者，发汗、利小便已，胃中\n燥、烦、实，大便难是也。[179] \n阳明之为病，胃家实是也。[180] \n一 阳明病基础病机 \n（一）里热 \n ①苦寒（黄芩黄连黄柏大黄等）——阳明正法 \n 阳明里热，这和太阳完全是大相径庭。它需要苦寒的药来解决，需要以寒胜\n热。太阳之热因卫强在表，是卫津聚集发热，津是多余的过盛的。阳明之热因邪\n盛于里，是邪热，会灼伤津血，津是不足的。所以阳明热不能发散津液，越发散\n越重；太阳热不能补益津液，越补益越不能解表。太阳病是辛温解热，阳明病归\n结为清热四法，就是用辛寒、酸寒、咸寒和苦寒来解决阳明热，四种都是以寒胜\n热的方法。 \n 在热的层面，阳明正法，就是苦寒法。代表药就是黄芩、黄连、黄柏、大黄\n这类苦寒药，在性味上以苦寒为主，是以寒胜热、以苦开泻。 \n ②酸寒（苦酒、栀子配伍淡豆豉）——阳明中的厥阴法 \n 还有一个层面，是酸寒。酸寒的药是苦酒，还有栀子配伍淡豆豉来达到这类\n功效。因为酸寒的方法，是仲景独特的概念，在他之前， 《汤液经法》的节略本\n《辅行诀》里边，它是不重视酸寒解热之法的，也不重视酸苦涌泻之法。苦酒的\n性味，既有苦，又有酸，又有甘，又有辛，它的性味比较周全。而如果我们用醋\n代替呢，只有酸之收敛的作用，而苦之开泄，辛之发散，甘之补益，这些作用，\n醋都没有。苦酒，正是因为它的辛、苦、甘、酸这些味 ，所以它是酸寒解热的\n代表 。比如乌梅丸，它有辛开苦降的作用，里面有辛的药，有苦的药，但是里\n面还有苦酒。 所以用乌梅丸， 一定不要忘了放苦酒， 这是非常重要的一个药。 \n 再就是栀子豉汤类方，用栀子和豆豉配合，达到一个酸苦涌泄的作用。豆豉\n这个药是酸的，还微微有一点温的作用，用栀子来平衡它的温性，就可以达到一\n\n个酸寒的状态。淡豆豉的功效全面的阐释有四个方面的作用，清热化湿除烦，和\n中养胃健运，疏散微透表邪，涌泄轻宣郁滞。但是，为什么栀子豉类方是酸寒法\n则，而不用别的药来配伍豆豉？ \n栀子： 《神农本草经》 ： 味苦， 寒。 主治五内邪气， 胃中热气， 面赤酒齄鼻， 白癞，\n赤癞，疮疡。 \n 因为栀子本来就可以利水湿，可以治疗面部脓疱，这也是一种水饮，喜欢配\n伍豆豉这类酸苦涌泄的，一起配伍治疗水火同病，火病中的水病。 \n ③辛寒（石膏寒水石葛根升麻连翘丹皮等）——里热兼表 \n 辛寒来解的热，都是里热兼表的热 ，既有里热，表上还有外邪。辛能解表，\n所以石膏、寒水石、葛根、升麻、丹皮、连翘，这些药既可以清里热，也可以照\n顾到表的问题。比如石膏，可以治疗阳明的大汗出、身恶热。在风引汤里， “除\n热瘫痫” ，用寒水石来解表上的瘫和痫。葛根、升麻，都是可以解表的药。所\n以我们说项背强几几， 或痉病， 用葛根来解； 续命煮散， 用升麻来解表上的瘫痪、\n表上的失和。包括丹皮、连翘，都是有这样的作用。 \n附： \n六病发热治法：六病皆可发热， 太阳病辛温除热为主; 太阴病甘温除热为主; 少\n阴病辛热除热为主; 少阳病辛温+甘温+苦温除热为主; 厥阴病辛热+甘温+苦温除\n热为主（真、类皆是） ；阳明病以寒胜热为主，又分辛寒，苦寒，咸寒，酸寒诸\n法。由此我们得见，在六病施治中，纯粹的以寒胜热法只适合于阳明病。 \n（二）里燥 \n 里燥，就是在热的基础上，出现津液被耗光的情况。这种情况，补津液反而\n是助热的。那么怎么治疗？ \n ①咸寒（芒硝、硝石等） \n 咸寒的药，比苦寒要重，比酸寒要重。酸寒有涌泄的作用，也有轻微的泄下\n的作用。所以吃栀子豉汤，在上焦的热可以呕吐而出；在下焦的热，可以大便溏\n泄而泻下 。 \n而咸寒的药，就是以攻下为主的。咸能软坚、润下，它的代表药是芒硝、硝石，\n这些承气类方常用的药物，包括三承气，包括木防己去石膏加茯苓芒硝汤这样的\n方子。 \n ②辛寒（石膏寒水石葛根升麻连翘丹皮等） \n 里燥有一个层面，当里燥以大便干燥为所急所苦，但是表上还有皮肤干燥、\n甲错，表上有一些不能濡养的现象，可用辛寒的药来解。既有以清代下的方法，\n比如石膏大剂量应用，它会有泻下的作用；然后又能解表。经方有一丝一毫的表\n证，它就会照顾到表，就会不让表邪入里。 所以会用辛寒的药来解这个表里都\n\n有的燥。当然它以里燥为主。 \n（三）里结 \n 里结，也叫阳微结。一般我们临床中常见两个层面。第一，是大便的燥结不\n畅。第二是比如妇女月经有血块，或者以血的失和（为表现） ，或者腹部按之硬\n满等。 \n 许师关于阳明结的解释 \n许师曰：有形的东西，都是结。凡是结都归阳明，但是不一定是热，在体表的高\n出皮肤的肿物是阳明的外结， 面部色斑也属于外结。 在里的肿块， 中医是必须能\n摸到的才算内结，或是腹诊硬满也算内结。比如：里有癌肿，但是不可见，也触\n摸不到，这不算内结。再说虚寒人的月经血块问题，也属于结。因为阳明除了热\n以外还有实。 实有热实和寒实。 寒实就是寒结， 虚寒人的月经血块就是属于这一\n种。如：大黄附子汤证的寒结，用附子细辛温化用大黄攻下。 \n 1. 结在燥矢 \n ①咸寒（芒硝、硝石等） \n 大便干燥这样的情况，是用咸寒的方法来对治的。用芒硝、硝石，这些药，\n咸能软坚散结，寒能攻下。 \n ②辛寒（土瓜根升麻丹皮等） \n 如果是伴有表证，既有里面的大便干燥，表上还有表位失和，就像咱前面讲\n过的那些规律和现象，就会用辛寒的方法。用丹皮、土瓜根、升麻这些药来解。\n这些药是辛寒的，这三个药有什么特点呢？既有辛寒的作用，大剂量运用都有以\n寒代下的作用 ，都能令大便溏泄。所以临床中用丹皮、土瓜根、升麻的方子，\n剂量大一些的话，大便会微溏的。它既可以解表，又可以治里。 \n 2. 结在血分 \n 䗪①咸寒（ 虫水蛭虻虫等） \n 里结结在血分的时候，用䗪虫、水蛭、虻虫这些药来解。这些药是咸能入血\n的药，寒能清热的药、寒能泻下的药。前面讲过，土瓜根是有泻下的作用的，䗪\n虫也有泻下的作用的。所以土瓜根散这个方子，病人吃了会有两种反应。一种是\n呕吐，如果他上焦被结得比较重的话，会呕吐而出；在下焦结得比较重的话，大\n便会溏泄。 \n 用这类方子的时候和病人要说一下，用这方子大便会拉稀一些，或者恶心呕\n吐一些， 这是正常的， 是一种排病的反应。 没有这些过程， 病不会好， 病不会解。\n因为经方是重视运用汗、吐、下来排出邪气的。只有邪气发掉、排掉，人体的正\n气才能来复，病才能解。所以说用经方，咱要把很多病用药以后的反应提前告诉\n患者，这样患者不慌张。因为现在患者往往比较敏感，心里比较脆弱。有一两个\n\n不舒服以后，它认为是你的药出了问题。或者你给它用错药了。那么咱能够未卜\n先知地把一些药的反应告诉他的话，他会很佩服你。这种情况，就必需建立在对\n药性的精确把握的基础之上。 \n ②辛寒（土瓜根升麻丹皮蒲黄等） \n 里结结在血分，表里同病出现的时候，还是用辛寒，这个药也是以皮、土瓜\n根、 升麻、 蒲黄这类药为主。 这些药也有一个特点， 也是大量用的话会泻下大\n便。 \n（四）外热 \n 辛寒（石膏寒水石葛根升麻连翘丹皮等） \n 阳明的外热，首先用辛寒的方法去解。因为辛能开散，辛能升散，能达到表\n位。阳明的外热，往往表现在什么方面呢？皮肤的红赤、搔痒，我们临床常见的\n荨麻疹，一些湿疹、皮炎、银屑病，这都是外热非常明显的病变。辛寒的药，用\n的机会也是非常多的。它的代表药，石膏、寒水石、葛根、丹皮、升麻、连翘，\n这些药既能解外，大量的话还可以对治里热。这些药本来是以辛为主，而有寒能\n清、寒能下的作用。 \n（五）外燥 \n 1. 辛寒（石膏寒水石葛根连翘丹皮等） \n 外燥，是阳明病最基础的病机 。所以说， 《伤寒论》它是一个“燥烦满实大\n便难” ，他告诉你一个燥，但是没有说燥在哪里啊。其实，燥既有外，也有里。\n现在很多人一想“燥烦满实大便难” ，就认为燥和大便难是一样的。 其实是不\n一样的。 燥是燥， 大便难是大便难。 外燥的话，也是用辛寒的药来解。用石膏、\n寒水石、连翘、丹皮、葛根这些药来解。这些药，辛能解表，寒能清能润。 \n 2. 咸寒（芒硝、硝石等） \n 还有一个层面，如果燥是血结，或者燥伴有伤血的层面，我们要注意咸寒药\n的运用。就比如说牛皮癣的患者，如果皮肤是干燥甲错出血，里面再大便干燥的\n话，那么要注意咸寒药的运用。咸寒药是以芒硝和硝石为主的。 \n（六）外结 \n 1. 结在卫津 \n ①辛寒（石膏寒水石葛根升麻连翘丹皮等） \n 阳明外结，如果是结在卫和津液的层面的话，用辛寒药去解，也是石膏、寒\n水石、葛根、升麻、丹皮、连翘。这种结在卫津是什么表现呢？比如荨麻疹、皮\n炎、皮肤异常的高凸、肿块，只要是外在的、可见的、凸出的、过度有余的，就\n是外结。就用辛寒药来解。临床常用的漏芦连翘汤就是以这些药为主。还有，麻\n\n杏甘石汤。 \n 2. 结在营血 \n ①辛寒（土瓜根升麻丹皮蒲黄等） \n 如果结在营血，也是用辛寒来解。但是因为他有营血的层面，这些药必需\n入血分，那就升麻、丹皮、土瓜根、蒲黄。后面三个药入血，大家都能理解。升\n麻为什么能治疗血病呢？麻黄升麻汤，唾脓血，这个升麻本来就是能涌散、清解\n恶血或者脓血。正因为这样，能治疗什么？瘀血入表，刚才讲到的续命煮散，为\n什么能治疗中风、偏瘫、瘫痪？麻黄类的、升麻类的，都能治疗瘀血入表，麻黄\n是这个作用，升麻也是这个作用。只不过麻黄是辛温的，升麻是辛凉的。 \n 䗪②咸寒（ 虫水蛭虻虫等） \n 还有一个层面， 外结如果结在营血的话， 比如银屑病的伤血的层面，可见\n性的出血、可见性的血的异常、血络浮露，就要注意咸寒药的运用，也是䗪虫、\n水蛭、虻虫这类药。 \n外结， 结在血分， 有的是辛寒， 有的是咸寒， 临床如何辨判断辛寒与咸寒的选择？\n如果结在血分，要用辛寒，是要以表为主；如果是咸寒是以里为主。比如表上皮\n肤的郁结、异常的血络浮露，往往是辛寒；如果是妇女闭经、月经失调，往往是\n咸寒为主的。之所以说为主，在仲景的方子往往还要有配合。既有咸寒，也有辛\n寒。 \n阳明病基础病机，在字面上还是比较简单，用药方向也比较分明。所以，理\n解上一般还是没难度而且各种病机的外在内外表现，前面师兄师姐们都讲烂了，\n但是， 复合病机， 特别是结合了太阳， 厥阴， 太阴理法的。 治疗起来就非常棘手。\n而且，这方面的方子，也是栋师最近才慢慢补入的，这部分血泪史，后面再聊。\n基础病机简单嘛。今天到此为止。 \n二 阳明病的复合病机 \n（一）阳明中风=里热+里燥+外热 \n 白虎加人参汤证 \n 相关条文： \n26.服桂枝汤，大汗出后，大烦渴不解，脉洪大者，白虎加人参汤主之。 \n168.伤寒， 若吐、 若下后， 七八日不解， 热结在里， 表里俱热， 时时恶风， 大渴，\n舌上干燥而烦，欲饮水数升者，白虎加人参汤主之。 \n169.伤寒，无大热，口燥渴，心烦，背微恶寒者，白虎加人参汤主之。 \n170.伤寒，脉浮，发热无汗，其表不解，不可与白虎汤，渴欲饮水无表证者，白\n虎加人参汤主之。 \n222.若渴欲饮水，口干舌燥者，白虎加人参汤主之。 \n\n《金匮》.太阳中热者，暍是也。汗出恶寒，身热而渴，白虎加人参汤主之。 \n渴欲饮水，口干舌燥者，白虎加人参汤主之（方见中暍中） 。 \n 阳明中风其实就是里热、里燥、外热，这个基础病机罗列起来，组合成的就\n叫复合病机，即阳明中风，代表处方是白虎加人参汤。 \n 阳明中风主要是以汗液外泄而有口舌干燥、表上微恶寒、还有烦渴不解或者\n轻微的大便干燥为主。 \n（二）阳明外证=里热 \n 白虎汤证 \n 相关条文： \n176，伤寒，脉浮滑，此表有热，里有寒，白虎汤主之。 \n219，三阳合病，腹满身重，难于转侧，口不仁面垢，谵语遗尿。发汗则谵语，\n下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。 \n350，伤寒，脉滑而厥者，里有热，白虎汤主之。 \n 大家比较熟悉的是太阴的外证，甘草干姜汤。还有一个阳明的外证， “一阴\n一阳之谓道” ，所以古人的学说、中医的理论，在阴阳的层面都是一个圆满的构\n建。它既然有里虚寒的外证，就必然会出现一个里实热的外证。这个里实热的外\n证，就是阳明外证，它是以里热为主，对应的方子是白虎汤。为什么说它是外证\n呢？外证有几个比较重要的规律： \n第一、必需是汗出多 \n第二、必需是小便数 \n 如 29 条是“伤寒、脉浮、自汗出、小便数” ，有汗出和小便数。白虎汤的条\n文， “下之则额上生汗” ，或者是“自汗出” ，还有“谵语遗尿” ，也有小便\n和汗的问题。这就是外证的典型的症状，必需有汗液或尿液的失常，才叫外证，\n外证不是盲目叫的。 \n219.三阳合病，腹满身重，难以转侧，口不仁而面垢，谵语遗尿。发汗则谵语，\n下之则额上生汗，手足逆冷。若自汗出者，白虎汤主之。 \n三阳合病的患者， “腹满身重，难以转侧，口不仁而面垢，谵语遗尿。发汗\n则谵语，下之则额上生汗，手足逆冷” ，是不是和 29 条说“不可发汗”一样\n的？不可再攻了，也不可再温了，因为这个是阳明的里热病。那就是用清里的方\n法来解决这个外证。所以并不是所有的小数频数、遗尿，都是用温固的方法。 寒\n药，也是可以来治疗遗尿的，为什么？阳明里热迫使津液外泄。所以经方是非常\n圆融的，它不会出现一个症状马上用一个方子。 \n 许师解外证： \n问曰：外证为什么必伴有汗出和小便的异常？ \n 师曰：外证是中风病的一个伸延。29 条为什么会用桂枝攻表？这个医生也不\n是随便用桂枝攻表的，因为他觉得是中风。浅一层，是中风的表现，如果中风的\n\n病机病传，传变的话，就会形成外证。外证，第一不能攻表了。所以有类似于中\n风的概念、现象、临床表现、症候群，但是和中风的基础病位（相比） ，已经\n发生变化了。所以说，它和中风类似。但是中风是以汗出为主的，外证多了一个\n小便数。 异常的津液，都是水饮 。在外的水饮，需要治中风；在里的水饮，需\n要治里。治里的方法，是用温和清的方法，热则清之、寒则温之。就是说，它本\n来是中风的一种病传；体现的是津液的一种状态，津液在表在里不一样，趋势不\n一样。 \n问曰：那为什么是汗和小便，而不是其它的呢？ \n 师曰：津液的输布离合是通过人体的窍来体现的，不管是生理还是病理，人\n体生命的活动，病理的变化，都会有窍的变化。人体的汗窍，还有尿窍，是代谢\n津液最常用的通道。我们都知道活动会出汗，正常人会觉得比较舒服，如果汗大\n泄的话，人会发虚。正常的话，我们都有小便。如果小便异常，就最先从小便来\n观察疾病的特点。本来人生理所具有，病理会最先出现异常，便于观察，再就是\n说它是津液的一个通道。 \n（三）阳明腑实证（本病）=里热+里燥+里结 \n 1. 胃家（肠间）燥矢——承气汤 \n 阳明的腑实证是阳明病的本病，就是承气汤证。它是由里热、里燥、里结组\n成的，所以胃家实，就是肠间有燥矢。 “胃中有燥矢五六枚也” 。 \n承气汤证，是分三个层面的。如果是以里面气滞伴有阳明腑实证的时候，会用到\n小承气汤，它是由枳实和厚朴配伍的，既可以行气通滞，又可以攻下大便。如果\n是以里燥，大便干燥为主，或者是别的燥症——口舌干燥为主的话，是用调胃承\n气汤，里燥对应的药就是芒硝，然后再加上大黄去攻下。如果是热、燥、实都非\n常典型、都非常突出的时候，用大承气。 \n 下面是重点：用大承气汤还有什么特点？不但能攻下大便，还能利小便。用\n大黄去利小便，治水湿。栋师在病例里至少讲过 5 例。很多大小便不通的患者，\n大便下来了，小便也下来了。比如说很多老年患者，有习惯性便秘的，再伴有前\n列腺胖大的，不但大便干燥难解，小便也是不通的。这种情况，里面有热、 有\n燥、 有实， 如果再用茯苓、 白术去利小便的话，则胃中更燥更实更热，津液\n更虚，大便更干燥。那么我们就可以用大承气汤来解，因为通大便也可以利小便\n的。还比如茵陈蒿汤，栀子大黄汤等。 \n 2 血室瘀血——下瘀血汤 \n相关条文： \n师曰：产妇腹痛，法当以枳实芍药散，假令不愈者，此为腹中有干血着脐下，宜\n下瘀血汤主之；亦主经水不利。 \n 还有结在血室的情况，瘀血内结，结在下焦，结在血室，就是用下瘀血汤来\n\n解。它也是里热里燥加里结为主，只不过前面是结在肠中燥矢，后面是结在血室\n的瘀血，结在血分。所以说，经方用药是丝丝入扣的。虽然都是阳明病，都是阳\n明的腑实证，但是结在血分和燥矢完全不一样，所以经方是非常细腻的，如果只\n是辨到六病的话根本没法用药。只有分析到最小的病机、最基础的病机才能去用\n药。 \n（四）阳明水热（阳明太阴合病）=里热+水饮 \n 1. 水热互结以水为主——主猪苓汤 \n相关条文： \n223.若脉浮，发热，渴欲饮水，小便不利者，猪苓汤主之。 \n224.阳明病，汗出多而渴者，不可与猪苓汤。以汗多胃中燥，猪苓汤复利其小便\n故也。 \n319.少阴病，下利六七日，咳而呕渴，心烦不得眠者，猪苓汤主之。 \n《金匮》脉浮发热，渴欲饮水，小便不利者，猪苓汤主之。 \n这个病机，比较独特。它本来就是太阴和阳明合病。所有的水饮病，都是太\n阴病，因为水饮的基础是胃虚和津液不化。而最能代表胃虚的就是太阴病。水饮\n化热，以热为主的时候， 就不是单纯治太阴能解的。它会出现一种水热现象。\n那么就会出现阳明的口干咽燥、口苦，渴欲饮水，还会出现黄疸之类的。小便不\n利、赤痛、频数、灼热，甚至小便带血，这种情况，就要既能治水，又能治热的\n药。治水、治热，而以治热为主，就是水热。 \n阳明的水热， 以两个方子为主要代表：水热互结，以水为主的时候用猪苓\n汤；水热互结，以热为主的时候用茵陈蒿汤。所以说，大黄能利小便。茵陈、栀\n子、大黄， 里面是用茵陈和大黄来利小便的。 猪苓汤中猪苓、 茯苓、泽泻、\n滑石， 这都是利小便的， 这是以水为主的。 而茵陈蒿汤是以热为主的， 所以茵陈、\n栀子、大黄，都能清热。所以仲景的方子，从来不浪费一味药。把每一味药的作\n用发挥到极致，发挥到极限。只有这样，才能单刀直入，把病机解得非常透彻。\n如果是把茵陈蒿汤再加上茯苓、赤小豆、萆薢，再加上一些利水的药，反而不利\n于解热。热不解会耽误病情，而不是解决病情。 \n 2. 水热互结以热为主——茵陈蒿汤 \n 茵陈蒿汤是一个水热为主的方，热是发黄的一个重要的基础，所以说茵陈蒿\n汤证经常可以见于黄疸病。但是临床中不要胶柱鼓瑟，如果没有黄疸，但是有里\n热和水热，完全可以用。茵陈蒿汤非常好用，不但可以治疗黄疸，还可以治疗妇\n科白带，男性小便的异常--一些所谓前列腺炎的症状，这个方子非常好用。很多\n现在说的淋病什么的，这个方子用上去，一付药就能解。 \n三、提问鉴别篇 \n 阳明酸寒法和类厥阴甘寒法如何鉴别？ \n\n师曰：经方本来就是用药物的寒热温凉来对应病的虚实寒热，一定用本草药\n石的寒热温凉对应。阳明清热四法我们知道有辛寒、苦寒、酸寒、咸寒，其中有\n一个酸寒法，类厥阴有一个甘寒法。 \n酸寒法（阳明法中的厥阴法）：立足的根本还是在阳明层面，所以酸寒是酸\n苦涌泻的，寒能清热的，对应的病虽然是虚实寒热表里杂错，但是总会以实以热\n以里为主。当里边以里虚热为主的时候，你再用酸寒法则就不能丝丝入扣。 \n 甘寒法：甘能补益，寒能清热，甘能对治虚，麦冬甘寒，能对治心腹结气伤\n饱，胃络脉绝，羸瘦短气等虚的层面，麦冬、生地、人参、玉竹、百合都是甘寒\n药。 \n 治里补虚同时兼有清热的，这是甘寒法则；泻里实热的同时兼顾里虚，这是酸\n寒法则。 \n问：阴病转阳，是不是就是三阴病转成三阳病？ \n 师曰：可以这么理解。在最基础的层面是这么理解的，中间还有一些细腻的\n方证变化。比如说本来这个人是用续命煮散的，也是一个表里同病；后来用越婢\n加术汤，也是表里同病。但有可能，越婢加术汤证偏实、偏表、偏热一些，他需\n要发得比较剧烈，但是在病人恢复的层面上比续命煮散要强多了。伤寒论中相对\n论的重要性。 \n问：阴病转阳了以后，是不是会反复转？ \n 师曰：会反复转，这是人疾病恢复的一个客观规律，会反复地转。只有在运\n动中才能消灭敌人， 也只有在运动中才能把这些病机一个个地消灭掉， 把门打开，\n把窗打开。要在病传的层面上去把握这个疾病。这个病人过来的时候，就知道这\n个病情是怎么样的发展规律，在阴阳气血，在水火气血上是怎么发生和发展的，\n那么把某个病机解决掉以后，下一个病机会是什么病机，用什么方子去解。并不\n是病人感觉轻了就轻，病人感觉重了就重。用病机去看，是在表还是在里，是虚\n是实，是阴是阳，是寒是热，是需要解外还是需要治里，是需要从阴治还是从阳\n治。这是非常重要的，这是阴阳客观存在的规律。 \n----------------------------------------------------------------------- \n如果仅仅从表面上看疾病的轻重，那么下面这段治疗过程就是把一个“简单\n的感冒，中间反复发作，最后治成重度肾病的医疗事故了” 。 \n咳逆倚息，不得卧，小青龙汤主之（方见上文肺痈中） 。 \n青龙汤下已，多唾口燥，寸脉沉，尺脉微，手足厥逆，气从小腹上冲胸咽，手\n足痹，其面翕热如醉状，因复下流阴股，小便难，时复冒者；与茯苓桂枝五味\n甘草汤，治其气冲。 \n冲气即低，而反更咳，胸满者，用桂苓五味甘草汤去桂，加干姜、细辛，以治其\n咳满。 \n咳满即止，而更复渴，冲气复发者，以细辛、干姜为热药也。服之当遂渴，而渴\n\n反止者，为支饮也。支饮者，法当冒，冒者必呕，呕者复内半夏，以去其水。 \n水去呕止，其人形肿者，加杏仁主之。其证应内麻黄，以其人逐痹，故不内之。\n若逆而内之者，必厥。所以然者，以其人血虚，麻黄发其阳故也。 \n若面热如醉，此为胃热上冲熏其面，加大黄以利之。 \n 就阳明病本身来说，单纯的病机都比较好治疗。难的是阳明病结合了太阳法\n和/或厥阴法、太阴法。以前这类方子不多，现今栋师补入了很多这类方剂，比\n如太阳麻黄法+阳明苦寒法+阳明辛寒法+阳明酸寒法+厥阴甘寒法+太阴中风法+\n太阴虚寒水饮法。这些法则可以随意组合，有的还组合到 4-5 个以上。比如: \n 芍药四物解肌汤、黄芪竹叶汤、千金阴旦解肌汤、百合前胡汤、小品前胡\n汤、 近效消渴方、 黄连知母丸、 千金竹叶黄芩汤、 前胡大黄汤、 深师三黄石膏汤、\n黄芪升麻地黄汤、前胡升麻地黄汤、古今录验栀子汤、千金时病表里大热方、小\n品芍药地黄汤、小品小三黄汤、知母解肌汤、栀子薤白豉汤、栀子黄芩豉汤、栀\n子黄芩芍药豉汤等等。这些方子在阳明为主的皮肤病领域，用的机会很大。下面\n分享一下我在用这些方子治疗皮肤病方面的一些经验。我的经验就是：不管是我\n水平太差的主要原因，还是病人激素用太多的主要原因，总之，很多阳明为主，\n兼有太阳、厥阴、太阴病机的皮肤病，我自己也没搞懂，真难。说完了，莫打我。 \n \n\n第四节 太阴病机体系复习 \n 林树元 \n今晚和大家学习（复习）太阴病的病机体系。太阴病可能是大家最熟悉的一\n块，因为我们跟许师学经典经方，大多是从太阴中风入手，临床门诊工作中也最\n为常见， 但很多时候， 最熟悉的也是最容易忽视的。 下面就和大家重新复习一下。\n在复习的过程当中，一部分是我自己的理解，不一定准备，不过另外一部分是许\n师的解释，大家可以更清晰。 \n一 基础病机与复合病机 \n由于有很多新同学，所以我们先来复习一下基础病机和复合病机的概念。基\n础病机为组成复合病机的最小单元，是对人体局部的病理机制的高度概括。如太\n阳病的基础病机分为表束、表实、表阳三种，其中表热就代表津液聚集在表、卫\n气在表位与邪气相争而生热。但表热并不体现人体的整体病机，而只是代表在表\n位津液、营卫的病理状态，并不能体现里位的胃气、三焦的状态。 \n基础病机的临床意义在于，它是每一味药物之理法确立的指征，其对应的是\n药证。如表实、表热，代表津液聚集在表位，故其用药的理法就应该为辛温发散\n之法，用药则根据表实、实热病机各层面的不同，分别选用麻黄、桂枝、杏仁、\n葛根等。复合病机是人体整体的病机概括，由基础病机组成，其真正决定了三阴\n三阳的病势分类。 \n 许师曰：基础病机是过程，复合病机是结果。基础病机，对应的是药证；复\n合病机，对应的是方证 \n 许师再曰：基础病机，是我们从《伤寒论》的条文中提炼出来的，是我们这\n个团队独特的概念，也是我们临床辨证中先把这个最基本的要素、最基础的概念\n罗列清晰以后，再组合成复合病机。组成复合病机以后，再去辨证施方，这样每\n一味药都是丝丝入扣的， 没有一味药是多余的， 也没有一个症状是不被照顾到的。 \n 许师又曰： 基础病机？就是它最基础的、 再不可分的病机。 就像盖房子一样，\n它是最基础的一砖一瓦，不可再分了。盖成房子以后，这房子叫什么名字？这房\n子叫太阳病的房子，这房子叫阳明病的房子，那么这种病机叫复合病机。而复合\n病机，是仲景自己在《伤寒论》中说的病机。 \n好了，概念复习完了。 \n二 太阴基础病机 \n 太阴病的基本病理特点为胃虚里寒而多饮，其病位在里，病性为虚，病态属\n寒，故里虚寒为其本病。在里虚寒的基础上，又外受邪风者，为太阴中风证；里\n虚寒影响到表位者，为太阴外证。基础病机：里虚（胃虚） 、里寒、水饮、伤血、\n\n血少。 \n里虚（胃虚） \n 里虚，即为胃虚。胃虚又有胃气虚及胃津虚之别。里虚，表现为消磨饮食水\n谷、化生气血津液、抗御邪气传变、制化下焦浊阴的功能不足。胃虚是太阴病基\n础病机中的基础病机，以下四个基础病机，常常由胃虚发展而来。里虚不能温煦\n则生寒，里虚不能敷布津液则生饮，里虚不能收摄津血则伤血，里虚不能化生气\n血则血少。治法上，以甘药为主，用药如甘草、人参、大枣、饴糖等。甘能补益，\n此四药皆为益胃气、补胃津的代表，如人参汤、小建中汤等。 \n总结：里虚（胃虚）——甘——甘草、人参为主 \n 许师曰：胃虚会出现什么？首先是饮食不化，就会不想吃饭，对水谷不想摄\n纳，还会胃胀满，当然它是最浅一层，大部分胃虚有症状的话，一般除了胃虚，\n还有下焦的浊水浊气的问题。先把它拆到最浅的一层病机，首先是胃虚，甘能补\n益，一般是用人参、甘草为主，中焦给建起来，下焦的浊水浊气不往上跑。 \n里寒 \n 里寒，常由里虚中之胃气虚发展而来，故常常“里虚寒”并提，如《金匮要\n略•腹满寒疝宿食病脉证治第十》 ： “中寒，其人下利，以里虚也，欲嚏不能，此\n人肚中寒。 ”此处里虚以胃气虚为主，由于胃虚不能制化下焦浊阴而生水饮，出\n现下利；水饮阻碍导致腹中失于温煦，故见“肚中寒” 。 \n 二者病机和临床表现有所差异。 里虚是以胃气之生功能功能不足为主要病理\n改变，而里寒以是里位不能温煦为主要表现。常见腹部恶寒发凉，或扪之凉，脘\n腹部绞痛，妇女月经时小腹发凉、痛经，伴口淡不渴等表现。治法上，以温药为\n主，代表药为干姜，如甘草干姜汤、干姜附子汤。 \n水饮 \n 水饮生于下焦，其病理基础为胃虚，由于胃虚不能制化下焦浊阴，下焦不能\n正常分清别浊，则聚而为饮。自利为水饮下泄，不渴为水饮内盛，故所有的水饮\n皆归属太阴的范畴。水饮的阻碍，使得腹中失于温煦，又可导致或加重里寒。水\n饮阻碍， 则可致女子月事不调， 则导致伤血， 水饮内盛， 则津血既不能正常生化，\n亦不能正常敷布，则会导致津血虚而不能温煦或濡养的血少证。 \n 饮停下焦，此为水饮的基础病理状态，典型的表现为小便不利，包括尿频、\n尿急、尿不畅、尿滴沥，及外阴潮湿搔痒，女子白带量多；其他表现为肠鸣，大\n便稀溏、甚则腹泻等。若水饮冲逆、内结、泛溢，又可表现为悬饮、溢饮、支饮。 \n治法上以淡为主，代表药为茯苓。淡渗可利小便，使得水饮从小便排出，津液方\n能正常地敷布，腹中方能得到阳气的温煦，故《内经》有“淡味渗泄为阳”之说。 \n许师曰：水饮，特别是太阴的水饮，就是以淡饮为主，淡饮是四饮的基础，\n主药是以茯苓为主，所有治淡饮的方子，都是以茯苓为主的。当然这个病机是一\n\n层层深入的，太阴病首先有胃虚，然后会产生虚寒饮，没有虚寒的话是不会产生\n水饮的，我们说水饮的基础就是胃虚和津液不化。 \n伤血 \n 伤血，为血的功能失调，或者出现可见性的出血。血的功能失调，如月经周\n期紊乱（推迟、提前或先后不定期） 、闭经、痛经等；可见性的出血，如鼻衄、\n齿衄、咯血、吐血、尿血、便血、肌衄，女子崩中或漏下、妊娠下血、白带夹血\n等，仲景常将这些出血统称为“亡血” 。 \n 这里插播一个小小的思考。 亡， 亡失、 丢失之意。 《说文》 ： “逃也” ， 古作 “亾” ，\n段玉裁注曰： “亡之本义为逃，今人但谓亡为死，非也。引申之则谓失为亡，亦\n谓死为亡” （ 《说文解字注》 ） 。亡血，在《伤寒论》与《金匮要略》中，即失血、\n出血之意，即正常的血液向体外流失的病理状态。如《伤寒论》87条：亡血家，\n不可发汗，发汗则寒栗而振。亡血家，即经常失血之人，发汗则卫表津液不足而\n出现寒栗。 \n 伤血，治法上，以甘温为主，甘能守中，以止亡血；温能煦越，以助其流行。\n代表药为当归、川芎、芍药、人参等。 \n 许师曰： 伤血， 第一是女性的月经失常， 男性的鼻衄， 或人体可见性的出血，\n这叫伤血。可以说血被扰动了，它本来血在里位应该是安安静静的，它被躁扰到\n表、到人可见性的，就叫伤血。它的用药是以甘温为主，整个太阴病配备的都是\n甘药和温药为主。伤血的话，一般用当归、川芎、芍药、人参为主，养血补益。 \n血少 \n 血少，又称血虚，为血的绝对不足，血液之温煦和濡养两层面功能都受到抑\n制。治法上，以甘温为主，甘能滋养血气之濡养的层面，温能滋养血气之温煦的\n层面。代表药为当归、阿胶、人参，如胶艾汤、 《小品》当归汤。 \n许师曰：血少和伤血还有不同。伤血是可见性的出血为主，血少是血绝对不\n足，它真正少了、真正亏了，所以这种药是用阿胶、当归、人参，非常能补益的、\n非常留恋的、固敛的，汁液浓厚的，这些药为主，来给它填实。 \n许师还曰： 我们知道， 阿胶烊化， 是非常黏稠的， 当归煎出来也比较黏稠的，\n人参煎出来大家可以看一下，有一定黏稠度的。这就是古人认为，它以外在的黏\n稠的形态，归到这个浊血的形态，和血是相类的，来补益血的绝对性的少。 \n 许师最后曰：那么，血少会出现什么症状呢？下眼睑的淡白，面色苍白、萎\n黄，唇口淡白，女性的月经量少或者闭经，还会有因为血少引起的人体的一些虚\n和寒的表现，精神不振、四末不温，这些都表现都可以有。 \n以上就是太阴病基础病机的全部内容。太阴病五大基础病机，以里虚为本，\n常常在病理上相互影响，在临床表现上也常同时并见。其中，又以血、水关系最\n为复杂。 \n\n三 太阴病复合病机 \n好吧，兄弟们，姐妹们，我们开始今天的学习。今天的内容是太阴病复合病\n机。太阴病复合病机，主要有三点：太阴中风，太阴外证，太阴里病。 \n（一）太阴中风四大层面 \n1.邪风虚热——桂枝汤 \n基础病机：里虚·伤血·血少·水饮·表束 \n治 法：辛甘温法 \n代 表 方：桂枝加黄芪汤 \n太阴里虚，水饮内生，加之外受邪风，导致津液在表位充滞为饮，同时又在\n表位涣散，即为太阴中风。最浅一层，为轻微之胃气津血不足而外受邪风，表现\n为发热、汗自出，伴脉微涩。 \n 相关条文： \n 太阴病脉浮者，可发汗，宜桂枝汤。 （276） \n桂枝汤统治除阳明病外另五病之中风， 在太阴层面是由于胃气津血不足所生\n的中风，故用生姜甘草汤、甘麦大枣汤补益胃气津血，桂枝、芍药解表而调和营\n卫。这一层，谓之“邪风虚热” 。 \n2.水饮血痹——桂枝加黄芪汤 \n再深一层， 水饮与邪风加重， 阻痹于肢体， 使得表位之营血不能敷布而濡养，\n典型表现为肌体酸痛、麻木不仁，常见于血痹。 \n相关条文： \n 问曰：血痹病从何得之？师曰：夫尊荣人，骨弱肌肤盛，重因疲劳汗出，卧\n不时动摇， 加被微风， 遂得之。 但以脉自微涩， 在寸口、 关上小紧， 宜针引阳气，\n令脉和，紧去则愈。 \n此时单用桂枝汤则不能有效地解决水饮的问题， 故需在桂枝汤的基础上加宣\n发水气之黄芪，则为桂枝加黄芪汤。此层谓之“水饮血痹” 。 \n3.邪风血病——黄芪桂枝五物汤 \n水饮血痹又有别一层面邪风血病之黄芪桂枝五物汤， 在这里由于时间关系不\n再缀述，复习二期讲义的时候会详细说到。 \n4.风水黄汗——芪芍桂酒汤 桂枝加黄芪汤 \n最深一层风水黄汗，风与饮水相击，邪风鼓荡水津外泄，表现为自盗汗出，\n恶寒等。其中水饮偏重者，停聚于体表而不化，表现为四肢头面浮肿、身体沉重\n疼痛，则为风水。相关条文： \n 风水，其脉自浮，外证骨节疼痛，恶风。 \n邪风偏重者，表现为身热、汗出明显，由于太阴里虚、表里水湿阻滞，在下\n\n焦则表现为小便不利，在上焦表现为口中多涎，小便不利则水湿无出路，郁而化\n热，或邪风生热，与水湿相搏而生水热，水热熏蒸甚则汗出色黄或头身黏腻，则\n为黄汗。相关条文： \n 问曰：黄汗之为病，身体肿，发热汗出而渴，状如风水，汗沾衣，色正黄如\n药汁，脉自沉，何从得为之？师曰：以汗出入水中浴，水从汗孔入得之，宜芪芍\n桂酒汤主之。 \n 黄汗之病， 两胫自冷； 假令发热， 此属历节。 食已汗出， 又身常暮盗汗出者，\n此劳气也，若汗出已，反发热者，久久其身必甲错。发热不止者，必生恶疮。若\n身重，汗出已辄轻者，久久必身。即胸中痛，又从腰以上必汗出，下无汗，腰髋\n弛痛，如有物在皮中状，剧者不能食，身疼重，烦躁，小便不利，此为黄汗，桂\n枝加黄芪汤主之。 （ 《金匮要略·水气病脉证并治第十四》 ） \n其中，偏水热为盛者者，治以辛温解肌、佐以酸苦涌泻，代表方为芪芍桂酒\n汤。偏水偏风偏虚寒而热不重者，以辛甘温法为主，辛温发散以祛太阴表位之邪\n风水气，甘温补益以健太阴里位之胃气不足。代表方为桂枝加黄芪汤，即在桂枝\n汤的基础上再加黄芪五两，甘温能补益胃气，配桂枝、生姜宣散表里之水饮，配\n大枣、甘草健胃补中。 \n太阴中风， 为杂病之薮， 金匮一书， 多从此证衍化而出， 之前做过一个简图，\n现在看起来不是完全准确，还不够完善，但是可以参考。 \n \n\n5.临床示例太阴中风理法 \n 太阴中风其实是最为重要的一个理法，下面用一个病案，大概说一下诊断用\n药的思路。 \n病案实录 \n基本信息： 女 49 岁 2016/4/26 初诊 \n主 诉：潮热汗出两个月。 \n病史简要：近两个月身潮热汗出，汗出以头额项周后背为主，午后及夜间明显，\n夜间难以入寐，彻夜难眠，眼花，无头晕头痛，汗后不凉，无盗汗。 \n无口干苦咽干，不欲饮，不恶风寒，无手足凉，夜寐手足喜伸出被外，头维处发\n紧，无胸闷气短心悸，纳可，腹无痛胀，肠鸣，大便日一行、质可不干不稀，小\n便无频急、时有夜尿一行，无口黏，咽中痰滞、咯之色白，时有腰酸。晨起舌上\n发麻。膝盖酸、发凉。 \n脉细略浮稍弦，右略紧。舌紫，胖大，苔薄润。下睑半红半白。 \n基础病机： \n表束（汗出，头维处发紧，膝盖酸，腰酸）+表寒（膝盖酸、发凉）+中风（身潮\n热汗出）+伤营（舌上发麻，难以入寐） \n太阴水饮（肠鸣，夜尿一行，咽中痰滞）+血少（下睑半红半白、脉细） \n阳明外热（潮热，夜寐手足喜伸出被外） \n复合病机：太阴中风 \n诊断思维： \n 这个患者的所急所苦为中风及伤营，由于津虚血弱而有饮，外受邪风，导致\n营卫不和，卫强营弱，出现潮热汗出。由于营卫不和，卫气与邪风相击而不能入\n于营分与之交合，故夜间难以入寐，彻夜难眠。卫气不能温煦能膝盖发凉，营阴\n不能濡养则舌上发麻。由于太阴水饮的杂夹，与邪风相搏而出来腰腿膝盖酸乏的\n血痹证（属太阴中风第二层面，黄汗可包括之） 。 “风则生微热” ，邪风化热，可\n出现潮热、手足伸出被外等外热症。在太阴水饮及血少的基础上，出现的中风，\n即为太阴中风证。故治疗上，以太阴中风黄汗层面主方——芪芍桂酒汤主治。 \n芪芍桂酒汤 黄芪 30，桂枝 18，生白芍 18，苦酒 60ML 7 剂 \n方证鉴别： \n1、桂枝加黄芪汤证：以邪风水病为主，热像不明显。此案邪风生热，在三阴病\n层面出现的阳明证，需用苦酒对治，配芍药养营泄热以除水，配桂枝、黄芪辛开\n苦降以通利表里三焦。 \n2、黄芪建中汤证：可以出现热证，然以津虚血弱里燥虚热伤血为主，水饮不甚。\n从咽中痰滞、舌胖大、不欲饮可知，此案之热像为邪风与水饮郁而生热，津虚血\n弱燥热不明显。 \n3、百合地黄汤证：以津虚液少里热为所急所苦，可出现睡眠障碍，然表位之邪\n\n风与水饮并不明显，虽然亦可出现汗出，然是在里热蒸迫的基础上出现的单纯的\n津液耗散， 而芪芍桂酒汤证黄汗之汗是建立在中风证——津液充滞在表而相对不\n足的基础上，有身痛、肢烦等表现。 \n总结：建中汤证之热，是津液不能濡养而产生之虚热；芪芍桂酒汤证之热，是津\n液不能敷布产生之湿热，而这种湿热进一步发热，可化燥伤津而出现虚劳病建中\n汤证之虚热 （这种热是在阳旦法津液不能温煦的基础上， 出现的津液不能濡养） ，\n再往下发展，太阴里虚胃虚及表束不解已不为主，而以津虚液少为核心病机，以\n津液不能濡养为所急所苦，则可出现百合病之虚热燥热。 \n2016/6/5 二诊 \n上药服后潮热已除，汗出正常，夜寐好转，故未再来求诊。 \n近日出现头上发胀、稍有头脑发热，午后明显，眼花，上眼睑浮肿，头上昏蒙，\n小腹隐痛，眼难睁，夜寐不佳，项强，两足心热，扪之凉，稍有口干，不欲饮，\n舌上发麻，纳可，大便难解、成形、日一行、不黏，小便淡黄、夜尿一行，稍有\n腰酸。膝盖酸。无泛恶，肠鸣。白带不多。鼻塞。 \n脉浮滑略细弦。舌红暗，边齿痕，苔薄腻。下睑半红半白。 \n处方：芪芍桂酒汤 \n黄芪 30，桂枝 18，生白芍 18，苦酒 60ML 7 剂 \n上诊药后，邪风生热已除，然表位之水饮仍在（上眼睑浮肿，头上昏蒙） ，\n营卫仍有不和，热像未清，继守前方为治。 \n2016/6/19 三诊 \n眼睑肿胀感减轻，夜尿无，头上发胀减轻，仍有昏蒙感，大便初干后软，夜寐好\n转，前额易自汗出、汗凉，项强，两足心热减轻，药服时稍有口干，停药则无，\n无口中黏腻，饮不多，舌上稍有发麻、较前减轻，右腰、臀及大腿僵硬不适，眼\n花，白带减少，膝盖酸、冷，肠鸣，腹无痛胀，无反酸泛恶。鼻塞减轻、较前通\n气、无流涕。无口苦。 \n脉浮细弦， 左紧， 右略软。 舌紫暗胖大边齿痕， 苔薄白。 下睑红半白。 扪手温可。 \n处方：桂枝加黄芪汤 \n桂枝 18，生白芍 18，生姜 18，大枣 24，炒甘草 12，黄芪 30 7 剂 \n 表位之水饮得减，然表束未解、津液未能敷布，故出现右腰、臀及大腿僵硬\n不适。热已得去，津液不充不布之时，苦酒已不适合，此时应用生姜、大枣，健\n胃补津、敷布津液为主，故转桂枝加黄芪汤继续治疗。 \n （二）太阴外证 \n1.太阴外证——甘草干姜汤 \n病 机：里虚·里寒·水饮 \n治 法：甘温 \n\n代表方：甘草干姜汤、肾着汤 \n 太阴外证，属于表束第三层面，是由里位之虚寒，导致津液不能收摄，在表\n窍及下窍同时涣散所致。典型的太阴外证，是由于太阴里虚所致。里虚则导致津\n液不能温煦里位而产生里寒，津液不能敷布而产生水饮，表现为小便频数，或伴\n大便溏泄，或女子带下清冷量多等；表位之津液不能收摄则可导致自汗出，由于\n津液持续及过度耗散，导致表位之津液不足，其温煦和濡养功能都受到影响。卫\n津不能温煦，则表现恶风寒、手足凉；营阴不能濡养，则脚挛急。其中，自汗出\n及小便数为外证的典型表现。 \n相关条文： \n伤寒脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，反与桂枝汤，欲攻其表，\n此误也。得之便厥，咽中干，烦燥，吐逆者，作甘草干姜汤与之，以复其阳。若\n厥愈、足温者，更作芍药甘草汤与之，其脚即伸。……（29） \n2.太阴外湿证——肾着汤 \n 若里位寒湿较重，导致水道不利、下窍不通，水湿不能从下阴排出反而向表\n位漫延，会导致寒湿困束于体表，出现腹重腹痛、腰以下冷痛等表现。此为太阴\n外证之进一步发现——太阴外湿证。 \n相关条文： \n肾着之病，其人身体重，腰中冷，如坐水中，形如水状，反不渴，小便自利，饮\n食如故，病属下焦，身劳汗出，衣（一作表）里冷湿，久久得之，腰以下冷痛，\n腹重如带五千钱， 甘姜苓术汤主之。 （ 《金匮要略· 五藏风寒积聚病脉证并治第十\n一》 ） \n 治法上，应以甘温为主，甘能补益胃气津液，温能温化里位之寒饮。代表方\n为甘草干姜汤，以大剂甘草，甘平补益，配干姜之辛温，则能补益津液之温煦层\n面，使得津液得以收摄。 \n（三） 太阴里病（本病） \n病 机：里虚·里寒 \n治 法：里虚为主者，治以甘温；里寒为主者，治以辛甘热 \n代表方：理中丸（里虚为主） ，四逆汤（里寒为主） \n 太阴的本病为里虚寒，中风和外证都是在里虚寒的基础上衍生出来的。其中\n又有里虚及里寒的偏胜之不同。由于太阴里虚寒，不能制摄下焦，常常表现为有\n水饮冲逆：冲逆于口窍，则表现为口中多涎唾，如《伤寒论》396 条： “大病差\n后，喜唾，久不了了者，胸上有寒，当以丸药温之，宜理中丸”；冲逆于上焦，\n则表现为胸中痞闷滞寒、气从胁下冲逆于心胸，如《金匮要略·胸痹心痛短气病\n脉证治第九》 ： “胸痹心中痞，留气结在胸，胸满，胁下逆抢心，枳实薤白桂枝汤\n主之， 人汤亦主之”；冲逆于中焦则表现为腹满、腹中痛，如理中丸方后注有“腹\n中痛者……腹满者”之或然症。 \n\n 治疗上，以里虚为主者，治以甘温，补益胃气，兼以散寒、除饮，代表方为\n理中丸（或人参汤） ，人参为补胃气之第一要药；以里寒为主者，治以辛甘热，\n辛热能祛里位之寒，甘则能兼顾胃气之不足，代表方为四逆汤。 \n许师曾对里虚和里寒的鉴别有过讲解： \n 里虚和里寒的治法是不一样的， 所以说经方的层面是非常细腻的。 里寒的时\n候，你用理中丸的时候，效果不明显，吃着病人还会更厉害，病人主诉拉肚子，\n一般病人不喜欢吃中药的话，你给他点理中丸吃吃，吃着还更胀，你后来发现，\n哦，这个病人不是里虚证，是里寒证，你给他开一付四逆汤好了。 \n 这就是说， 里虚和里寒是两个层面的。 它虽然都是太阴的本病， 但是本来就\n是有寒和虚两端的。里虚的时候，要补之，要用人参补益之；里寒为主的时候，\n要用干姜 （附子） 来温养之。 所以基础病机为什么这么重要？就是因为复合病机\n组成以后，还是得用基础病机去辨准用药方向。 \n 好了，今晚的分享到此结束，谢谢大家 \n \n \n \n \n\n第五节 太阴中风饮血痹病机的理解和方证体会 \n 钟晓辉 2016.1029 \n大家好 上周六主要讲了几个阴旦法则的方证，今天分享两个阳旦法则的医\n案和理法思悟。最近树元已经带大家复习了太阴中风病机和方证。 \n太阴中风表饮形成 \n太阴中风是太阴虚寒的底子，而以表病为所急所苦。太阴中风有三个层次。\n第一个层面是邪风虚热，津虚液少血弱而中风，病人兼有虚寒而津虚液少，处方\n用桂枝汤。第二个层面是水饮血痹。第三个层面是风水黄汗。在太阴中风的第二\n个层面， 水饮血痹， 发生了表饮。 太阴中风的表饮， 是如何发生的呢？我们知道，\n太阴中风是虚寒而津虚液少，表位卫津不足。虚寒会导致什么结果？津液流通不\n利（热则流通，寒则凝涩） 。津液充盈畅合（注意，不是充滞） ，在表位正常流通，\n才能发挥卫津温煦的功用。当津虚液少的时候，同时又因为虚寒而流通不利，就\n会形成水饮。 许师有个非常经典的比喻： 河流之水在水流大的时候流的非常畅通，\n（能正常流动则是津液） ，水流变小变浅的时候，就会形成水洼废水停滞（不能\n正常流动则成为水饮） 。太阴病会有那么多的水饮症状表现，原因就在于津液不\n足而流通不利了。 流通起来是津液， 不流通就变成水饮了， 即津液不利则为水饮。 \n太阴中风之要药黄芪 \n我们知道太阴中风有三个重要的方证： 黄芪芍药桂枝苦酒汤， 桂枝加黄芪汤，\n黄芪桂枝五物汤，可分别对治太阴中风水饮血痹的更细分层面。这三个方都是桂\n枝汤的架构（桂枝芍药等量）加黄芪。血痹的第一个层次，是水血同病而以邪风\n水病为主的。就是现在这个所急所苦是表位的饮。表位的饮怎么给它去掉？可以\n“针引阳气”——宣通阳气，疏导水津，发散外邪。那如果不用针法，药就可以\n用黄芪。阳旦者，升阳之方，以黄芪为主。 \n 黄芪是太阴中风之要药，那么为什么用黄芪？桂枝芍药等量的结构上加一\n味黄芪之后，究竟能发挥出什么更强大的作用？黄芪最本质的作用在于，它是一\n个行阳气的药，可以鼓舞更多的津血去体表，所以黄芪是重要的表药。我们说太\n阴中风是津亏液少血弱，问题的症结是表位上津液非常不足，产生了水饮。黄芪\n解表散饮的办法不同于麻黄，麻黄是打开毛孔发汗，去宣泄有余的水气。而太阴\n中风，是卫津不足，虽然也产生了表饮了，但你不能去泄。相反，你要补充更多\n的津液去表位，原本水量不足的水流得到了更多的津液，就可以像夏天水量不够\n而处处水洼的河道下了一场雨一样， 开始潺潺地流起来了， 气血一旦开始了流通，\n那么废水自然就不存在了，因为废水本来就是因为津液虚少并且不流通的产物。\n在黄芪的鼓舞作用下，更多的气血奔涌到表位，津液多起来并且流通了，就没有\n\n表饮发生的前提了。当然这里桂枝芍药都各有其功用，此次讲课我先不具体说这\n两个药。 \n现在大家可能理解了黄芪是一个引导阳气的药， 怎么引——鼓舞卫阳 （卫津） ，\n引到哪里——人体表位。这里我一直在说“鼓舞” 、 “引导” 、 “升阳”这些词，黄\n芪类似一种动能，它跟桂枝不一样，桂枝直接进入血脉有温通解肌的作用，黄芪\n主要是激发更多的卫津奔涌体表，所以它是升阳，让早晨的太阳从海平面升起，\n有托举的力量。 说到这里我希望大家可以对太阴中风的水饮血痹病机有更深的理\n解，所以说黄芪你千万不能给在意念上想象成麻黄一类的药（尽管在效用上也是\n解表散饮了） ，去开泄散饮，恰恰相反，它是让表位升起正能量的好津液来促使\n津血恢复了流通，水行起来之后，石块垃圾水洼就统统是浮云了。津液可以流通\n之后，没有表饮了，可以温煦了，可以濡养了，有疮脓的地方可以得到更多气血\n滋养了。 \n 下面发一个案子，我们趁热打铁，来看看如何从太阴中风的本质病机来关联\n四诊的具体症状。我们在理解太阴中风的病机之后，就可以挣脱思维的桎梏，治\n疗很多病，因为在临床中太阴中风病非常多，许师言 ：“太阴为杂病之薮”。 \n医案示例 \n1.芪芍桂酒汤证之月经不调案 \n初诊 2015.11.20 女 34 岁，体型略胖。 \n主述：月经不调，经常不来月经。脚冷，失眠。 \n刻诊：面上有色斑，怕冷怕风，最近脚冷明显，脚尤其冷，冷到骨头里。经常头\n晕，肌肉酸痛，腰也痛，腿经常浮肿。前两年出汗多，汗凉，去年开始汗减少，\n上半身出汗，吃热食微汗，干活和运动后汗多。睡眠不好。记忆力差。心胸胃都\n没有明显异常。喜温水，饭量差。大便日一二次，便软，腹冷，经常矢气。小便\n可。不起夜。月经经常不来，而且人也慢慢发胖。舌苔上有裂痕，苔白厚。 \n处方：黄芪芍药桂枝苦酒汤。大家先看看案子 ,这种案子比较容易犯的错误估计\n是开温经汤。 \n反馈：这个病人远处新疆寒地， 冬天非常冷。 因月经不调， 全身怕冷， 脚冷失眠，\n头晕腿肿，已经求医五年，非常苦痛。开了芪芍桂酒汤之后坚持服药，服药到\n12 月份，月经来潮。脚冷改善，睡眠转好。比之前不怕冷了。后来陆续服药几\n个月，感觉身体体质提高了，在户外正常穿衣完全不感觉冷，并且外出劳动做事\n都比之前更加耐寒，腰痛腿痛都没有。脸上色斑还变淡了很多。目前舌上没什么\n白厚苔了。病人对疗效满意，而且感慨于经方药少力宏，因她之前求医五年花钱\n很多不说，还把身体治得越来越难受，她后来陆续给我介绍了几十个病人来看。 \n分析：我们分析一下案子。表证——怕冷，脚冷，头晕，腿肿，失眠。怕冷脚冷\n是因为表位卫津不足，不能温煦。营卫不合 津血不流通。 此外虚少的津液聚集\n\n成表饮，更加隔绝了营卫的交互，所以芪芍桂酒汤证的病人也经常有血压高和头\n晕等。腿肿，这是典型的表饮。失眠，营卫不合，兼表饮隔绝。全身怕冷和脚冷\n大家还蛮好理解的，腿肿是太阴中风的表位水饮，那么头晕和血压高，有的人就\n困惑了。今天我们主要是从太阴中风病机本质去分析一下太阴中风病常见症状，\n究竟为什么太阴中风可能有这些症状，我们怎么去理解。高血压六病都有，黄芩\n汤证也可以高血压，先在里位发生血痹水结，然后人体启动自保的机制去升高血\n压，给心脑供血。所以说临床千万不要以药对病，要有经方思维的全局观。那么\n太阴中风的这个表饮阻碍的影响是很大的，桂枝汤证本身有营卫不合，津血因虚\n寒而不流通，发生了表饮，进一步地隔绝了营卫的交合，津血不流通了，加上表\n位水饮进一步阻隔，就导致了人体的血量不够使了，所以人体升高血压去保证重\n要器官的供血。此外，同理，营卫不合加上水饮的进一步阻隔（加剧营卫不合） ，\n病人也会以失眠为急苦了。说到这里我们来看下一个案子 – \n2.芪芍桂酒汤证之失眠案 \n20160122 女，40 岁，面色偏黄，体型正常，不胖。 \n主述：睡眠差，不易入睡，睡不沉，断续有一个月了。肠胃有气，打嗝多。 \n刻诊：以前怕冷，现在好转。出汗不多。无头痛身痛，右脚三阴交位置有压痛，\n有时走路脚后跟疼。 早上醒来觉得没精神， 无力， 两只胳膊困累。 前几天有鼻塞、\n鼻子干燥，口腔上鄂和嗓子干燥这几天都好转了。没有明显的口干苦渴，睡眠不\n好，入睡困难。记忆力不好。胃口饮水都正常。大便日一次，质可，小便可，偶\n起夜。肚子发凉怕风，有胃胀，爱打嗝，有肠鸣。月经不准，推后三四天 ，经\n量正常，不痛经，无血块，颜色红。白带淡黄色，无异味。 \n处方：半量芪芍桂酒汤。 \n反馈：服芪芍桂酒汤 10 剂，睡眠基本正常了。病人诉有打嗝胃疼恶心，偶尔有\n突然的饥饿感。下个处方开了柴胡桂枝汤。服药后胃不适缓解很多。 \n分析：这个案子我们就看到了太阴中风的一个常见苦急症状，失眠。在夜里睡觉\n的时候，卫气是入营的，行于阴，卫入里。行于阴，卫入里。太阴中风的卫津不\n足，津液成为表位废饮，表位营卫不合，卫不能入营，人就无法好好睡眠（壮者\n之气血盛，其肌肉滑，气道通，营卫之行，不失其常，故昼精而夜瞑） 。本案芪\n芍桂酒汤调和营卫，解表散饮，营卫的通道就畅合了。在很多的芪芍桂酒汤医案\n里我们经常看到一个症状，是肚子胀矢气多。这是为什么？服药之后除了解决苦\n急症状，我们经常看到腹胀也随之而解。关于这个问题在这里放一段条文，条文\n我就不解了，主要是怕解错了给大家带沟里去。大家读读看看能不能意会一些。 \n金匮： 师曰∶寸口脉迟而涩， 迟则为寒， 涩为血不足。 趺阳脉微而迟， 微则为气，\n迟则为寒。寒气不足，则手足逆冷；手足逆冷，则荣卫不利；荣卫不利，则腹满\n肠鸣相逐。 \n重点是，荣卫不利，则腹满肠鸣相逐。我个人的想法是营卫不利于外，在里\n\n则寒水相搏——导致腹胀肠鸣。营卫最重要还是交互，流通起来，输布气血，如\n果表位因寒因饮阻而导致气血的输布障碍，里位也会产生不合。 \n今天就讲这些， 主要是在许师讲义学习和临床的基础上对太阴中风的一些思\n悟体会。关于太阴中风的系统学习，大家一定要常读二期讲义的太阴病概讲（太\n阴中风部分） ，这是二期的精华内容，在理解病机本质之后新加入的同修们很快\n就可以上手，在临床中一扫一片了。而其中芪芍桂酒汤的处方几率非常之高，远\n超其他几方， 以后我们在学习医案的时候可以仔细鉴别此方证之湿热和津液不足\n的倾向（苦酒之苦泄，滋养，收敛） 。苦酒许师曾以米酒和米醋代用，然疗效不\n够理想，雪松研发苦酒之后，苦酒之苦泄，收敛，滋养之功用就可以齐备。 \n案后问答 \n问:本案表上的废水表现是什么呢？是腹部怕冷吗， \n 答:最典型的症状就是腿浮肿。第一案第二案来说 没有腿肿这么明显的症状.\n但是病人有——早上醒来觉得没精神，无力，两只胳膊困累，脚后跟疼——其实\n这跟表饮是有关的，水饮夹杂加之表不解，导致了周身肿胀松弛麻痹不仁不用。\n许师讲义： \n由于水饮的夹杂加之表不解， 黄汗还会有身肿、 头面四肢肿、 身重、 身冷、 胫冷、\n腰髋松垮虚肿无力而微痛不仁不用， 就像周痹的感觉， 周身肿胀松弛麻痹不仁不\n用。 \n 所以我们也经常在太阴中风病中看到 这类症状， 全身乏力 没劲， 老想睡觉，\n胳膊无力，身体困重，上不了楼梯。 \n问：表寒包含表饮？ \n 答：表饮是结果，因虚寒和津亏液少发生了水饮。 （表寒包含津液亡失在表，\n和集聚在表，我再看看讲义，谢谢师姐！） \n 二期讲义关于太阴病非常的详尽， 多读就能找到一切答案， 而且有意思的是，\n你隔段时间读总能发现领会更多 ，芪芍桂酒汤疗效很快，比如我曾经开给一个\n老者，就吃了一剂 他就小便增加很多 睡眠转好。 \n问：黄芪除了影响津液的输布，是否也会补津液？只看到说促进输布... \n钟晓辉： 我前面一直在说芪最本质的作用在于，它是一个行阳气的药，可以鼓\n舞更多的津血去体表， 所以黄芪是重要的表药。 我们说太阴中风是津亏液少血弱，\n问题的症结是表位上津液非常不足，产生了水饮。黄芪解表散饮的办法不同于麻\n黄，麻黄是打开毛孔发汗，去宣泄有余的水气。而太阴中风，是卫津不足，虽然\n也产生了表饮了，但你不能去泄。相反，你要补充更多的津液去表位，原本水量\n不足的水流得到了更多的津液， 就可以像夏天水量不够而处处水洼的河道下了一\n场雨一样，开始潺潺地流起来了。气血一旦开始了流通，那么废水自然就不存在\n了，因为废水本来就是因为津液虚少并且不流通的产物。在黄芪的鼓舞作用下，\n\n更多的气血奔涌到表位，津液多起来并且流通了，就没有表饮发生的前提了。当\n然这里桂枝芍药都各有其功用，此次讲课我先不具体说这两个药。现在大家可能\n理解了黄芪是一个引导阳气的药，怎么引 - 鼓舞卫阳（卫津） ，引到哪里 - 人体表\n位。这里我一直在说“鼓舞” 、 “引导” 、 “升阳”这些词，黄芪类似一种动能，它\n跟桂枝不一样，桂枝直接进入血脉有温通解肌的作用，黄芪主要是激发更多的卫\n津奔涌体表，所以它是升阳，让早晨的太阳从海平面升起，有托举的力量。 \n刘忠革：这个津液从其他地方引导过来的，津液总量不变，拆东补西，强心。水\n饮所在津液离位， 鸠占鹊巢， 鸠占鹊巢， 喜鹊叫了一群同伴， 这样又把鸠赶跑了。 \n 钟晓辉：尽量别搞成西医的角度，卫阳（卫津）达表，津液的正常状态，流\n通，而且足够，才能发挥正常的功用，温煦、濡养。津液的不正常状态 就是水\n饮。水占位了，血就少了，要不怎么说是水饮血痹。 \n杨洋：风水黄汗，风与水相击，邪风鼓荡水津外泄，水饮偏重者，停聚于\n体表不化， 表现为肿痛。 水占表位， 还要用黄芪引表吗？今天晕在水里了 \n 周喜梅：要想明白水的问题就得搞懂四饮的问题 \n 钟晓辉：太阴中风的表饮就是黄芪来散的，这个大家多读讲义就能慢慢理解\n了。表位水饮的产生是因为津液不足，津液不足你就不能用麻黄了。而是升发阳\n气，疏导水津。 \n万健：怎么理解葛根升津和黄芪升阳之不同？邓国雄：还有天花粉 \n 钟晓辉：葛根是阳明药，黄芪是太阴表药。表位津燥而经筋失养，用葛根，\n天花粉也是阳明药，里位气分有热，可以清滋润养，此外天花粉也可以清湿热，\n利于分肉。葛根、天花粉对表位的作用，在痉证的处方里很典型。 \n万健： 如果偏燥向阳明转化就用桂枝加葛根， 向太阴出表就用桂枝加黄芪是这个\n意思吗？ \n 钟晓辉：你这句我比较认同。 \n邓国雄：师姐是不是两个的所急所苦不同.表和里 \n 钟晓辉：先这样吧，舌战群儒可不是一般人能做到的，我自己对药证方证的\n理解都还有很大提升空间，也是学习者，举个简单的例子 \n桂枝加葛根汤案一 \n女 年龄：40 \n上次服药的改善之处：头疼改善","hasDose":true},{"caseId":"P0133","caseSource":"经典经方学术体系传习汇编","caseType":"讲义医案","归集方":"知母解肌汤","usedFormulas":["黄芩汤"],"isCombine":true,"patient":"主诉：小儿高烧十日，退烧后食物过敏发全身水肿。","symptom":"主诉：小儿高烧十日，退烧后食物过敏发全身水肿。","history":"","exam":"","analysis":"","prescription":"处方：先开方黄芩加半夏生姜汤，服药 2 天没有退烧。炎症表现有好转，牙龈仍","effect":"反馈： 服药四天之后， 患儿全身浮肿消得彻底。 浮肿好了， 显得眼眶都凹下去了。","comment":"","caseExcerpt":"主诉：小儿高烧十日，退烧后食物过敏发全身水肿。 \n男孩 1 岁 8 个月，牙龈溃疡红肿，舌头有泡，嘴唇有口\n疮，喉咙有发炎，咳嗽厉害一声接一声干咳，早晨起来\n听着喘气，胸口有痰声，手放肋骨时有震动。晚上踢被\n子，夜里啼哭。情绪烦躁脾气大。面色偏黄，发烧已经\n十天，经常过 39 度。手脚凉，体表热，不出汗。饮水不\n多。 无口臭。 大便每天两三次， 前干偏黑后面黄色不干。\n生病前有一次拉肚子。小便量少黄。 \n病史信息：对鸡蛋和蛋白质过敏 \n这个案子治疗的比较曲折。 \n处方：先开方黄芩加半夏生姜汤，服药 2 天没有退烧。炎症表现有好转，牙龈仍\n有红肿。这时请教了许师，开芍药四物解肌汤一剂（生白芍 24 ，黄芩 24，升麻\n24，柴葛根 24） ，服药之后发烧略退，牙龈红和溃疡好转。再开黄芩加半夏生姜\n汤 2 剂彻底退烧。咳喘好转。 \n分析：这里我们可以看到患儿有表证， 有阳明热结和湿热 （牙龈红肿， 口疮溃疡） ，\n\n所以用芍药四物先解表清热散结。邪在太阳表位不彻，而阳明里热已炽，故见牙\n龈红肿舌头起泡口疮溃疡咽喉发炎。 \n 许师讲义： \n 阳明里热炽盛而太阳表邪不彻， 这种情况， 要在清解里热的同时注意解表。 由\n于患者里热渐实津亏液燥已经显露，加之溃疡属于“疮家”不可以发汗，所以一\n般不再适宜选择辛温的麻黄桂枝类解表药， 而要选择辛凉或性平的葛根、 升麻类\n去微透表邪而能清解里热，即所谓的双解表里。芍药四物解肌汤可以双解表里、\n清热散结、清利湿热、解肌化斑。 \n 太阳表邪解了，里之热结透散，再用黄芩加姜夏汤就很顺畅退烧了。本来这\n个案子似乎到这里就完美结束了，不料患儿家长不顾小儿过敏体质，给吃了不少\n的鸡蛋， 很快全身发水肿， 从脸到眼到腿都浮肿。 讲真， 浮肿了我是挺高兴的。 。 。 \n可以借机从表位解病了。 \n处方：知母解肌汤 半量。 \n麻黄 12 葛根 18 生石膏 18 炙甘草 18 知母 18两天吃完一剂。 \n反馈： 服药四天之后， 患儿全身浮肿消得彻底。 浮肿好了， 显得眼眶都凹下去了。\n咳嗽减轻，没有喘了。大便情况好转。口水有点多。续服黄芩加半夏生姜汤。 \n 下面总结一下知母解肌汤的要点（引自经典经方论坛许师贴） \n 知母解肌汤 \n麻黄二两 葛根三两 石膏三两 炙甘草三两 知母三两 \n知母解肌汤有二两麻黄， 表证和表邪都会比较重， 然后有三两葛根， 葛根既能治\n疗太阳又可以梳理经筋可以清阳明热的， 所以说这个是太阳的层面已经往阳明转\n了。知母四物解肌汤虽然有表，但已经往阳明走了，正因为往阳明走了，所以引\n起阳明的水热， 就需要知母石膏去清水热， 用石膏是为了辛散水气的， 我们在水\n气病篇就知道了， 当麻黄重于石膏的时候主要是用来发散水气的 （水气在表形成\n了一些外在的肿， 外在的一些突出或结的状态的话， 这是阳明的外结， 有可能没\n有阳明的热只是外结，用石膏的辛寒来散这个外结） 。知母解肌汤，石膏三两麻\n黄才二两， 并且用知母葛根这种苦凉的药来佐石膏， 寒性就更强， 这个是阳明为\n主的方子（表束+阳明） ，知母解肌汤主要治水，芍药四物解肌汤主要治津血。 \n\n案四 婴儿便秘案 \n 女婴，不到三个月大，目前迫切想解决孩子的排便\n问题。鼻梁有青筋，平常怕热出汗怕风。手脚不凉，会\n出汗。口不干饮水少。无咽喉红肿，无口气。无恶心呕\n吐，无咳嗽。胃口好，精力好。肚子几天不排便就会胀\n满屁多。现在排便极不规律，出月子以后由两天一次排\n便到三天一次排便到后面一个星期一次排便， 便便酸臭，\n黄色，前干后稀烂，小便量不多色淡黄。夜奶两次，吃饱就睡，无夜啼。没有湿\n疹和过敏。 \n处方：黄芩汤四分之一量 \n四天后反馈：孩子第一天中午吃药下午就排便了。现在\n服药第四天，排便一天 1-2 次，舌苔不白了。鼻梁青筋吃\n药以后稍微淡了一些。 \n续服黄芩汤。 \n解析 \n黄芩汤：黄芩三两，芍药二两，炙甘草二两，大枣 12 枚 \n条文（修正后版本） ：太阳与少阳合病，若呕者，黄芩加半夏生姜汤主之，自下\n利者，与黄芩汤。 \n黄芩汤我们知道经常用于治疗水热腹泻，但奇妙的是这个方是双向调节，也可以\n对治阳明热加上津血不足，阳明里结导致的虚性便秘。 \n 下文引自经典经方论坛许师帖（便秘如何辨？） \n问：便秘问题大多因为什么? \n师曰： 大便不容易解首先是阳明的里结， 大便干燥是阳明里燥， 有人是大便黏腻\n不爽而不好解，有的人是大便正常但无力排动，阳明里燥+里结是承气法我们不\n讲了。里结+大便粘滞不爽是太阴和阳明合病，既有太阴的津血虚少，大便有时\n是细软的，或干稀不调，就是太阴法+阳明法，太阴法是津血不足的底子，阳明\n法的话有大便的不畅不通的基础， 阳明法是里结， 里结一部分是实热结一部分是\n虚热结， 虚热结就是太阴和阳明合病了， 因为津血不足而引起的， 本来就是燥结，\n因为被热耗干了， 就好像水流小冲不下淤泥一样， 这个情况就是芍药证， 津血虚\n热而里结，第一是桂枝加芍药汤，第二是桂枝加大黄汤，第三是当归芍药散，芍\n药甘草汤， 枳实芍药散， 建中汤等芍药类方， 只有芍药才能肩负滋养津血通闭结\n节的作用。 \n 黄芩汤也是芍药类方。芍药通闭结节之后，营血可以下降，所以大便会恢复\n正常，全身也可以恢复血脉的流通（此案中服药四天后见到鼻梁青筋变淡） 。所\n以大家要好好理解芍药的作用，芍药法治津虚血少而有结有热，毫不夸张地说，\n透彻地理解芍药，你的经方内力能提高二十个百分点！ \n\n 今天讲课之后希望大家有个认识……多刷讲义，多刷论坛！多刷讲义，多刷\n论坛！多刷讲义，多刷论坛！讲义和论坛帖精华内容极多，可以常看常新。现在\n我们很幸福的就是有太多的资料和内容可以经常去温习思悟。 每天可以深入一点\n去思考一个方一个药。把方证药证病机内核理解得更加透彻。临床中看空症状，\n把握病机核心，开出精准的处方。 \n \n\n晓辉临床医案四则 二 \n 钟晓辉 2017.01.07 \n案一 丁丁肿痛 \n家长代写小儿四诊 20161121","hasDose":true},{"caseId":"P0215","caseSource":"谦川中医公众号经典经方医案集","caseType":"讲义医案","归集方":"竹叶石膏汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：反复发热两周。","symptom":"主诉：反复发热两周。","history":"","exam":"查体：脉：浮滑数。舌：淡白如猪肺，苔浮微白，中有裂痕，边有齿痕，苔","analysis":"","prescription":"许师：这个患者是非常典型的阳明火证，他的热、结都非常明显，灼伤了津","effect":"","comment":"","caseExcerpt":"主诉：反复发热两周。\n现病史：因“意识不清12 小时”入院，急诊见昏睡状态，手足乏力，辅助\n检查提示：高血压脑出血（左侧额叶），破入脑室，行血肿清除术，术后转入ICU\n监护5 天，期间出现肺部感染，现转到脑病科病房。目前患者可进行简单对答。\n近两周出现反复高热，最高体温40°。\n口干口苦，欲饮水，纳差（留置鼻饲管）。大便每天2-3 次，质稀烂（目前\n使用药物中含泻下类药物），留置尿管。不怕风不怕冷，汗不多，无心慌，眠不\n知。\n查体：脉：浮滑数。舌：淡白如猪肺，苔浮微白，中有裂痕，边有齿痕，苔\n欠润。下睑淡白边淡红水润，腹满压疼，下肢轻度甲错，血络浮露，额热，手足\n灼热。\n这类患者即使意识再不清也不要紧，我们把他觉资料采集到，一样可以辨证。\n基础病机：\n表束\n太阴伤血，血少轻症，里虚\n阳明里热，里结，外燥轻症，外热\n许师：这个患者是非常典型的阳明火证，他的热、结都非常明显，灼伤了津\n血，引起外燥，他表的问题一定要用辛寒解外，因为表上没有风和寒，一定不能\n误用辛温。在表的层面去看表的阴阳，辛寒是治表证中的火证。\n第二步我们看太阴层面的里虚。我们一定要区别里虚是胃气虚还是胃津虚。\n那么患者是口渴、身热，是不是阴的津液少了，不能去制化阳热，那就是胃津虚\n的特点。所以这个患者一定不要去温中、温胃，理中辈是不能用的。胃津虚同时\n津血是不足的，所以会出现轻微的燥证。纳差、口干，包括大便失常，都是胃津\n亏虚不能制化。\n那么表的层面，伤营是血不足引起的，血不足是火热引起的，我们是不是要\n\n针对第一层病机，针对火热？这个患者是非常典型的竹叶石膏汤证。\n竹叶12 生石膏100 麦冬48 人参12 半夏24 粳米24 炙甘草12\n经方的人参出山西上党，后来才带到辽东。上党是多风干燥的地区故而人参\n滋津液，我们看《神农本草经》，人参味是甘寒的，辽东是高寒地区所以今天辽\n东的人参性味偏温，这是物种的变迁引起的性味变化。偏温的人参肯定不能作为\n经方的人参。\n我们想了一个办法，山西上党还出党参、沙参，符合当地多风多燥的环境，\n人参还有一个安神定魄的作用，是沙参、党参不能代替的。\n我们就把三种参合起来，各取三分之一，保留了人参安魂定魄的作用，再加\n上照顾津液胃气亏虚的党参沙参，组成经方的人参用法。\n那其实就是白人参4，沙参4，党参4，合起来就是经方二两。石膏打成小\n的颗粒。半夏一定要用生半夏，不能用水半夏。水半夏在过去是作为山慈菇的混\n淆品来使用的。\n这个方，因为患者处在高热、手足灼热、额热、耳热，可以每天2 剂，按经\n方法度。\n知识点复习：\n桂枝汤方后条文：“若一服汗出病差，停后服，不必尽剂；若不汗，更服依\n前法；又不汗，后服小促其间，半日许，令三服尽。若病重者，一日一夜服，周\n时观之。服一剂尽，病证犹在者，更作服。若汗不出，乃服至二三剂。”\n此段提示若处方正确，而邪气未解，可缩短服药间隔，甚至加至两剂。\n2018 年3 月2 日疗效反馈，整体热势有下降表现，波动在38-38.7 度左右，\n夜间偶有胡言乱语。\n舌淡暗短缩，干裂少苔。守竹叶石膏汤3 天。\n2018 年3 月5 日疗效反馈，截止3 月5 日共服竹叶石膏汤7 剂，热势有所\n下降，昨夜发热有所反复。\n四诊信息","hasDose":true},{"caseId":"P0230","caseSource":"谦川中医公众号经典经方医案集","caseType":"讲义医案","归集方":"黄芩汤","usedFormulas":["黄芩汤"],"isCombine":true,"patient":"【疑难攻坚】丝绸之路的 7 年之痛","symptom":"","history":"","exam":"刻下：体温偏高，体温高时怕冷，不出汗，手足不凉不麻。头晕，无恶心耳","analysis":"","prescription":"处方：①小品前胡汤×10。②甘草汤×20。③黄芩汤×10。2，2，2 交替，","effect":"复诊：","comment":"","caseExcerpt":"【疑难攻坚】丝绸之路的 7 年之痛\n疾病科普：白塞氏病(Behcet’sdisease，简称BD)，又叫贝赫切特综合征，\n是一种全身性、慢性、血管炎性的罕见疾病，临床上以口腔溃疡、生殖器溃疡、\n眼炎及皮肤损害为突出表现，又称为口-眼-生殖器综合征。该病常累及神经系统、\n消化道、肺、肾以及附睾等器官，病情呈反复发作和缓解的交替过程。由于该病\n在地中海沿岸、中东及远东地区（中国、日本、朝鲜）发病率较高，故又被称为\n“丝绸之路病”。\n医案：主诉，反复口腔溃疡7 年余。\n现病史：7 年前确诊白塞氏病，咽喉溃疡反复发作，无肛周溃疡，无便血。\n曾经长期服用激素类药物，初服效果佳，后溃疡反复发作如前，现已停用激素类\n药物。\n刻下：体温偏高，体温高时怕冷，不出汗，手足不凉不麻。头晕，无恶心耳\n鸣，口干，口腔时有灼热感，腹部虚弱感，心疲感，目内眦持续红丝，饮偏多，\n饮凉，纳可，腹可，大便日一行，质可，小便无频急，小便黄，灼热，夜尿无.\n怕风冷，心慌胸闷，眠可，梦不多。四肢乏力。\n查体：脉浮弦缓，舌淡红嫩，苔白腻，剥苔，口腔溃疡淡白淡黄紫红，满布\n口腔咽喉，腹满，下肢甲错，轻血络，手凉微潮\n基础病机：\n表束，表寒，中风轻伤营\n太阴伤血，血少轻\n阳明里热，里结，水热，外燥\n辨表：患者手凉手潮，怕风冷，有表寒中风，并有四肢乏力，心疲感，腹部\n虚弱感等伤营的症候群。\n\n辨里：里证见身热、口干、口腔时有灼热感、饮偏多、饮凉、溲黄灼热，这\n是阳明里热灼伤津液。\n综合为表里合病，虚实错杂，类厥阴中风，四证以火证为主。\n类厥阴只是有一组表里虚实寒热杂错的症候群，不会出现阴阳或营血绝对不\n通（短缺）的病机，如麻黄升麻汤（以表里寒热夹杂为主，看似复杂，其实病势\n不险），三泻心汤（寒热虚实夹杂），柴胡桂枝干姜汤（表里寒热夹杂），所以\n类厥阴病只是复杂的合病而已，一般是阴阳经的复杂的合病情况。所以本案符合\n表里错杂，寒热错杂，虚实错杂，所以辨证为类厥阴。\n治法提炼：本案属于类厥阴中风，而四证以火证为主。表有风寒不解中风，\n里有邪热灼伤津血，捉住了这个主要病机，我们可以通过“约分”法简化我们的\n基础病机，太阴的伤血，血少，阳明的外燥，可以被伤营约分，治疗伤营就好。\n而这个伤营是里位的阳明里热所致，所以第一层病机首当治疗火证，以清热养津\n血而解表寒为法。\n那么这个里位的热我们通过辨证得出是个实热，实热见到口干，口腔时有灼\n热感，饮偏多，饮凉，溲黄灼热，腹满，当以阳明四法之苦寒法治疗。\n同时又见到疲倦乏力，腹部虚弱感，口腔溃疡等虚证，可以得出这个里位是\n一个胃津虚。\n里热兼有水热，胃津虚，我们伤寒论有个经典的方根，那就是黄芩汤。黄芩\n苦寒清热；芍药甘草，甘寒对治虚热胃津不足。又因为表有风寒的不解之类厥阴\n中风，我们表药的选择以前胡更为贴切。所以第一个方选择小品前胡汤。\n表不解的因素是里热灼伤津血，津血不能温煦推动，所以当以清热养津液的\n大法为主。\n处方：①小品前胡汤×10。②甘草汤×20。③黄芩汤×10。2，2，2 交替，\n甘草汤10 剂内服10 剂漱口。\n方药学习：\n小品前胡汤，前胡二两 芍药三两 黄芩二两 大枣廿枚 甘草二两 大黄二两\n凡六物，以水八升，煮取二升半，分三服。\n《小品方》云：解寒食散发，或头痛，或心痛，或腹痛，或胸胁肿满，或寒，\n或热，或手足冷，或口噤，或口疮烂，或目赤，或干呕、恶食气便呕吐，或狂言\n\n倒错、不与人相当，或气上欲绝、进退经时。散发百端，服此前胡汤得下便愈方。\n黄芩汤方，黄芩三两 芍药二两 甘草二两（炙） 大枣十二枚（擘）。\n右四味，以水六升，煮取三升，去滓，温服一升，日再，夜一服。\n太阳与少阳合病，自下利者，与黄芩汤；若呕者，黄芩加半夏生姜汤主之。\n[宋172]\n伤寒脉迟六七日，而反与黄芩汤彻其热，脉迟为寒，今与黄芩汤复除其热，\n腹中应冷，当不能食，今反能食，此名除中，必死。[宋333]\n甘草汤方，甘草二两。右一味，以水三升，煮取一升半，去滓，温服七合，\n日再服。\n少阴病二三日，咽痛者，可与甘草汤；不差，与桔梗汤。[311]\n张圣洁医生按语：\n三个处方我们可以看到一脉相承，在经方”表里观、津液观、邪正观”统摄\n下。以清热养津解表为法。一味甘草汤，甘寒清热养津；黄芩汤，苦寒甘寒以清\n热养津治水火错杂；小品前胡汤（前胡 黄芩 白芍 甘草 大枣 大黄）包含黄芩\n汤（黄芩 白芍 甘草 大枣）、大黄甘草汤（大黄 甘草）的完整方根，在苦寒\n清热甘寒养津的基础上强化了去里结水热的作用。整个方子苦辛、苦寒、甘寒，\n清热养津解表，治厥阴中风里热伤营，水火错杂。而3 张处方2-2-2 交替服用，\n可见步步以津液为要，以解表透邪为法。\n复诊：\n查体：脉浮弦，舌红嫩，苔白腻花剥，下睑红鲜，腹按微满，下肢轻甲错，\n手凉有汗。\n刻下：溃疡减轻，服药一半后，出现发烧，口不干苦 饮水不多 胃纳可 易\n饥，晨起口中黏腻，大便稀，日1 次，有肠鸣，腹痛后需排便。无尿急频，小便\n热，无夜尿，无怕风冷，无心慌胸闷，眠可，无梦，易疲劳。\n基础病机：\n表束，表寒，中风\n太阴里虚轻证\n阳明里结，外燥，里热，水热\n辨证分析：药后口中灼热，口干多饮饮凉，腹满明显缓解，而且在服药过程\n\n中出现发热，这个典型的里邪出表。且容易饥饿，这是胃气增强，胃津得复。虽\n然有手凉汗出之表寒中风表现，但是无怕风冷，这个中风的症状也是大为缓解。\n新出现的症状时腹痛便溏，伴有尿热未能缓解。\n表里合病，四证以火证为主，病势以里证水火的错杂为主，伴有表位火热攻\n冲，津液外泄。治疗当以清热养津解表，揆理水火为法。\n处方：1.栀子柏皮汤X15。2.黄芩汤X10。3.白头翁汤X5。3-2-1 服用\n外用：甘草汤 X30 剂 日1 剂 每日漱口。\n药方学习：许师处三方的服法是3-2-1 的服用方法，以栀子柏皮汤清下水热，\n涌散表邪，这个的用药比例是最大的，而白头翁汤作为苦寒的代表，用量是最小\n的。很多同学对栀子这味常见药物具有涌散表邪的作用感到很新奇，其实这是我\n们经典经方四大阳明解表药之一。\n栀子：《神农本草经》，味苦，寒。主治五内邪气，胃中热气，面赤酒齄鼻，\n白癞，赤癞，疮疡。\n《名医别录》，大寒，无毒。主治目热赤痛，胸心大小肠大热，心中烦闷，\n胃中热气。\n栀子《本经》原文说治面赤酒齄鼻，是上焦郁火、表的外热引起的发斑红赤，\n是苦寒而去升散的药，它常配伍豆豉加强解表效果。但不配豆豉有没有解表作\n用？有。比如说栀子柏皮汤，它是治疗黄疸的。黄疸是水热兼表，它有没有表？\n有表。因为有表，但是以热为主的时候，就不能过度用温药了。用什么？栀子。\n既可以解表，又可以清热、治黄疸。你用栀子柏皮汤治皮肤病看看？效果非常好，\n它本来就升散。还有栀子它的透发、渗透力量特别强，很多外伤的、扭挫伤的，\n马上皮肤青紫，把里边的瘀血一下发出来了。它是不是涌散的力量特别强。发出\n来后里边不疼了，外边是淤青的。\n栀子也能解表，它不配豆豉一样能解，配豆豉只不过是火证中的水证，火证\n中的虚证，只不过是配豆豉补虚、治水。那就是水热以热为主，就可以只用栀子，\n不配豆豉。\n三诊：溃疡已基本不发作，刻诊口腔已无溃疡。浮弦细，舌淡紫红嫩，苔薄\n白腻中裂痕，淡白淡红，微满，轻度甲错，手潮手指微凉、眠可，牙龈已无出血。","hasDose":true},{"caseId":"P0240","caseSource":"谦川中医公众号经典经方医案集","caseType":"讲义医案","归集方":"桂二麻一汤","usedFormulas":["桂枝汤"],"isCombine":true,"patient":"主诉：腹透后顽固瘙痒数年。","symptom":"主诉：腹透后顽固瘙痒数年。","history":"","exam":"刻下：盗汗，汗后不凉，怕冷怕热。腹部微恶风寒。神疲乏力，双下肢乏力","analysis":"","prescription":"","effect":"药后反馈：顽固瘙痒较前缓解，继续治疗。","comment":"","caseExcerpt":"主诉：腹透后顽固瘙痒数年。\n现病史：皮肤瘙痒，难耐难止，无皮疹，搔抓后皮肤红。腹部透析时或透析\n后
